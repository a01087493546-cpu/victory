<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문답책 - 독서 집중 시간</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap");

    :root {
      color-scheme: light;
      --ink: #49301d;
      --muted: #80664d;
      --gold: #a66b24;
      --gold-dark: #684017;
      --cream: #fffaf0;
      --line: rgba(135, 91, 39, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.96), transparent 34%),
        linear-gradient(145deg, #f7ead1 0%, #fffaf1 48%, #ead5af 100%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .focus-page {
      width: 100vw;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vh, 64px) 24px;
    }

    .focus-view {
      display: none;
      width: min(820px, 100%);
      text-align: center;
    }

    .focus-view.active {
      display: block;
    }

    .book-icon,
    .complete-icon {
      font-size: clamp(42px, 5vw, 64px);
      line-height: 1;
      margin-bottom: 22px;
    }

    h1,
    h2 {
      font-family: "Noto Serif KR", serif;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    h1 {
      font-size: clamp(36px, 4vw, 56px);
    }

    h2 {
      font-size: clamp(34px, 3.6vw, 52px);
    }

    .description {
      margin-top: 25px;
      font-size: clamp(20px, 2vw, 27px);
      font-weight: 800;
      line-height: 1.55;
      word-break: keep-all;
    }

    .minute-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 42px;
    }

    .minute-button {
      height: 72px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 253, 247, 0.74);
      color: #684625;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 7px 18px rgba(88, 53, 20, 0.08);
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .minute-button:hover {
      transform: translateY(-2px);
    }

    .minute-button.active {
      border-color: rgba(139, 80, 17, 0.72);
      background: linear-gradient(180deg, #e9be68, #be7b25);
      color: #40260e;
    }

    .custom-time {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 76px;
      margin-top: 18px;
    }

    .custom-time.show {
      display: flex;
    }

    .custom-time input {
      width: 130px;
      height: 58px;
      border: 2px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.85);
      color: var(--ink);
      font-size: 25px;
      font-weight: 900;
      text-align: center;
      outline: none;
    }

    .custom-time input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(166, 107, 36, 0.12);
    }

    .custom-time span {
      font-size: 20px;
      font-weight: 900;
    }

    .validation-message {
      min-height: 24px;
      margin-top: 5px;
      color: #a4472f;
      font-size: 16px;
      font-weight: 800;
    }

    .total-time {
      position: fixed;
      top: clamp(22px, 4vh, 42px);
      right: clamp(22px, 4vw, 58px);
      z-index: 2;
      margin: 0;
      padding: 13px 19px;
      border: 1px solid rgba(139, 91, 35, 0.34);
      border-radius: 999px;
      background: rgba(255, 250, 238, 0.86);
      color: #775532;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 9px 24px rgba(83, 50, 19, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    .total-time strong {
      margin-left: 5px;
      color: #4d3017;
      font-size: 18px;
      font-weight: 900;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 34px;
    }

    .action-button {
      min-width: 180px;
      height: 62px;
      padding: 0 26px;
      border-radius: 18px;
      font-size: 20px;
      font-weight: 900;
    }

    .action-button.secondary {
      border: 1px solid var(--line);
      background: rgba(255, 253, 247, 0.7);
      color: #6f5236;
    }

    .action-button.primary {
      min-width: 260px;
      border: 1px solid rgba(99, 57, 15, 0.5);
      background: linear-gradient(180deg, #8a5a2d, #4d3017);
      color: #fff8e8;
      box-shadow: 0 6px 0 rgba(58, 32, 10, 0.72), 0 12px 22px rgba(67, 40, 14, 0.18);
    }

    .action-button:disabled {
      cursor: not-allowed;
      opacity: 0.46;
      transform: none;
    }

    .running-view .focus-label {
      color: var(--muted);
      font-size: 22px;
      font-weight: 900;
    }

    .timer {
      margin-top: clamp(36px, 8vh, 90px);
      font-size: clamp(92px, 14vw, 176px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    .running-view.paused .timer {
      color: #8b704f;
    }

    .running-view .actions {
      margin-top: clamp(42px, 8vh, 84px);
    }

    .pause-button,
    .end-button {
      min-width: 180px;
      height: 62px;
      border-radius: 18px;
      font-size: 20px;
      font-weight: 900;
    }

    .pause-button {
      border: 1px solid var(--line);
      background: rgba(255, 253, 247, 0.72);
      color: var(--ink);
    }

    .end-button {
      border: 1px solid rgba(102, 52, 26, 0.3);
      background: #6b4127;
      color: #fff8e8;
    }

    .complete-view {
      width: min(1280px, calc(100vw - 48px));
    }

    .praise {
      width: 100%;
      max-width: none;
      margin: 24px auto 0;
      font-family: "Noto Serif KR", serif;
      font-size: clamp(32px, 3.2vw, 58px);
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.045em;
      white-space: nowrap;
    }

    .completion-summary {
      display: grid;
      gap: 10px;
      width: min(500px, 100%);
      margin: 34px auto 0;
      padding: 22px 28px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 19px;
      font-weight: 800;
    }

    @media (max-width: 720px) {
      body {
        overflow-y: auto;
      }

      .minute-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .total-time {
        top: 16px;
        right: 16px;
        padding: 10px 14px;
        font-size: 14px;
      }

      .total-time strong {
        font-size: 15px;
      }

      .actions {
        flex-direction: column-reverse;
      }

      .action-button,
      .action-button.primary,
      .pause-button,
      .end-button {
        width: min(340px, 100%);
      }
    }
  </style>
</head>
<body>
  <main class="focus-page">
    <section class="focus-view setup-view active" id="setupView" aria-labelledby="setupTitle">
      <div class="book-icon" aria-hidden="true">📖</div>
      <h1 id="setupTitle">독서 집중 시간</h1>
      <p class="description">지금부터 책에만 집중해 볼까요?<br>읽을 시간을 골라 주세요.</p>

      <div class="minute-options" aria-label="집중 시간 선택">
        <button class="minute-button active" type="button" data-minutes="10">10분</button>
        <button class="minute-button" type="button" data-minutes="15">15분</button>
        <button class="minute-button" type="button" data-minutes="20">20분</button>
        <button class="minute-button" type="button" data-minutes="custom">직접 입력</button>
      </div>

      <div class="custom-time" id="customTimeRow">
        <label for="customMinutes" class="sr-only">직접 입력할 집중 시간</label>
        <input id="customMinutes" type="number" min="1" max="60" step="1" inputmode="numeric" autocomplete="off">
        <span>분</span>
      </div>
      <p class="validation-message" id="validationMessage" role="alert"></p>

      <p class="total-time">총 독서 집중 시간 <strong id="setupTotalTime">0분</strong></p>

      <div class="actions">
        <button class="action-button secondary" type="button" id="setupBackButton">돌아가기</button>
        <button class="action-button primary" type="button" id="startButton">집중 시작하기</button>
      </div>
    </section>

    <section class="focus-view running-view" id="runningView" aria-labelledby="runningTitle">
      <h2 class="focus-label" id="runningTitle">독서 집중 시간</h2>
      <div class="timer" id="timer" aria-live="polite">10:00</div>
      <div class="actions">
        <button class="pause-button" type="button" id="pauseButton">일시정지</button>
        <button class="end-button" type="button" id="endButton">끝내기</button>
      </div>
    </section>

    <section class="focus-view complete-view" id="completeView" aria-labelledby="praiseText">
      <div class="complete-icon" aria-hidden="true">🎉</div>
      <h2 class="praise" id="praiseText"></h2>
      <div class="completion-summary">
        <span>이번 집중시간 <strong id="sessionTime">0분</strong></span>
        <span>총 독서 집중 시간 <strong id="completeTotalTime">0분</strong></span>
      </div>
      <div class="actions">
        <button class="action-button secondary" type="button" id="completeBackButton">돌아가기</button>
        <button class="action-button primary" type="button" id="thoughtButton">책 속 생각쓰기</button>
      </div>
    </section>
  </main>

  <script src="../js/auth.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const context = params.get("context") === "individual" ? "individual" : "practice";
      const studentId = sessionStorage.getItem("studentId") || "student-demo";
      const authToken = sessionStorage.getItem("token");

      /*
        총 독서 집중 시간 저장 위치는 계정 종류에 따라 다르다:
        - 일반 학생계정: backend(MySQL, StudentStats.totalReadingFocusSeconds)가
          source of truth. 다른 브라우저/기기에서도 같은 값을 보여준다.
        - 심사 학생계정: 브라우저 localStorage만 사용(기존 readingFocusTotalSeconds_
          키 그대로). 심사위원이 여러 브라우저/기기에서 각자 독립된 데모 상태를
          유지할 수 있어야 하므로 backend 조회/저장을 아예 호출하지 않는다.
        isDemoAccount()는 auth.js가 로그인 시 sessionStorage에 심어 둔 실제
        서버 판정값(User.demoAccount)을 그대로 읽는 기존 공통 판별기다.
      */
      const totalStorageKey = "readingFocusTotalSeconds_" + studentId;

      function getApiBaseUrl() {
        if (window.location.hostname === "127.0.0.1") {
          return "http://127.0.0.1:8080";
        }
        if (window.location.hostname === "localhost") {
          return "http://localhost:8080";
        }
        return "https://victory-production-f94d.up.railway.app";
      }

      const praiseMessages = [
        "오늘도 집중해서 읽었어요. 대단해요!",
        "차근차근 읽는 모습이 아주 좋아요!",
        "오늘의 독서 집중, 정말 멋졌어요!",
        "끝까지 집중한 모습이 멋져요!",
        "책에 집중하는 힘이 자라고 있어요!",
        "오늘도 책에 푹 빠져 읽었어요!",
        "차분하게 잘 읽었어요. 훌륭해요!"
      ];

      const destinations = context === "individual"
        ? {
            back: "./individual-during-reading.html",
            thought: "./individual-during-reading.html?view=question"
          }
        : {
            back: "./class-reading.html",
            thought: "./during-read.html"
          };

      const setupView = document.getElementById("setupView");
      const runningView = document.getElementById("runningView");
      const completeView = document.getElementById("completeView");
      const minuteButtons = Array.from(document.querySelectorAll(".minute-button"));
      const customTimeRow = document.getElementById("customTimeRow");
      const customMinutes = document.getElementById("customMinutes");
      const validationMessage = document.getElementById("validationMessage");
      const startButton = document.getElementById("startButton");
      const timer = document.getElementById("timer");
      const pauseButton = document.getElementById("pauseButton");
      const setupTotalTime = document.getElementById("setupTotalTime");
      const completeTotalTime = document.getElementById("completeTotalTime");
      const sessionTime = document.getElementById("sessionTime");
      const praiseText = document.getElementById("praiseText");

      let selectedMinutes = 10;
      let plannedSeconds = 0;
      let focusedMilliseconds = 0;
      let runningStartedAt = 0;
      let intervalId = null;
      let isRunning = false;
      let sessionSaved = false;

      /*
        화면에 보여주는 "총 독서 집중 시간" 캐시. 심사계정은 localStorage에서
        한 번 읽어 두고, 일반계정은 backend GET 응답으로 채운다(초기화는
        아래 initializeTotalSeconds 참고). saveSessionOnce가 세션 종료 시
        이 값을 갱신한다.
      */
      let currentTotalSeconds = 0;

      function showView(view) {
        [setupView, runningView, completeView].forEach(function (item) {
          item.classList.toggle("active", item === view);
        });
      }

      /* 심사계정 전용 - 브라우저 localStorage 읽기/쓰기 */
      function loadLocalTotalSeconds() {
        const value = Number(localStorage.getItem(totalStorageKey));
        return Number.isFinite(value) && value > 0 ? Math.floor(value) : 0;
      }

      function saveLocalTotalSeconds(totalSeconds) {
        localStorage.setItem(totalStorageKey, String(totalSeconds));
      }

      /* 일반계정 전용 - backend 조회/추가 */
      async function fetchBackendTotalSeconds() {
        const response = await fetch(
          getApiBaseUrl() + "/api/students/" + studentId + "/reading-focus",
          { headers: { Authorization: "Bearer " + authToken } }
        );
        if (!response.ok) {
          throw new Error("독서 집중 누적 시간을 불러오지 못했습니다: " + response.status);
        }
        const data = await response.json();
        return Number(data.totalSeconds) || 0;
      }

      /*
        keepalive: true는 "끝내기"를 누르지 않고 그냥 화면을 벗어날 때도
        (pagehide 핸들러) 이 요청이 취소되지 않고 끝까지 전송되게 한다.
        평소 흐름(끝내기/자연 종료)에서도 그대로 켜 둬도 안전하다.
      */
      async function addBackendTotalSeconds(addSeconds) {
        const response = await fetch(
          getApiBaseUrl() + "/api/students/" + studentId + "/reading-focus",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + authToken
            },
            body: JSON.stringify({ addSeconds: addSeconds }),
            keepalive: true
          }
        );
        if (!response.ok) {
          throw new Error("독서 집중 누적 시간을 저장하지 못했습니다: " + response.status);
        }
        const data = await response.json();
        return Number(data.totalSeconds) || 0;
      }

      /*
        화면 진입 시 총 누적시간을 가져온다. 심사계정은 절대 backend를
        호출하지 않고(데모 값이 실제 DB에 섞이면 안 됨), 일반계정은 반대로
        localStorage의 readingFocusTotalSeconds_* 값을 더 이상 누적 계산에
        쓰지 않는다 - backend 값 하나만 source of truth로 표시한다.
      */
      async function initializeTotalSeconds() {
        if (isDemoAccount()) {
          currentTotalSeconds = loadLocalTotalSeconds();
          updateTotalDisplays(currentTotalSeconds);
          return;
        }

        try {
          currentTotalSeconds = await fetchBackendTotalSeconds();
        } catch (error) {
          console.error(error);
        }
        updateTotalDisplays(currentTotalSeconds);
      }

      function formatDuration(seconds) {
        const safeSeconds = Math.max(0, Math.floor(seconds));
        if (safeSeconds > 0 && safeSeconds < 60) return "1분 미만";
        const totalMinutes = Math.floor(safeSeconds / 60);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        if (hours && minutes) return hours + "시간 " + minutes + "분";
        if (hours) return hours + "시간";
        return totalMinutes + "분";
      }

      function updateTotalDisplays(totalSeconds) {
        const text = formatDuration(totalSeconds);
        setupTotalTime.textContent = text;
        completeTotalTime.textContent = text;
      }

      function getSelectedSeconds() {
        if (selectedMinutes !== "custom") return selectedMinutes * 60;
        const raw = customMinutes.value;
        const value = Number(raw);
        if (!raw || raw.trim() !== raw || !Number.isInteger(value) || value < 1 || value > 60) {
          return 0;
        }
        return value * 60;
      }

      function validateSelection() {
        const valid = getSelectedSeconds() > 0;
        startButton.disabled = !valid;
        validationMessage.textContent = selectedMinutes === "custom" && !valid
          ? "1분에서 60분 사이로 입력해 주세요."
          : "";
        return valid;
      }

      function getFocusedMilliseconds() {
        return focusedMilliseconds + (isRunning ? Date.now() - runningStartedAt : 0);
      }

      function getFocusedSeconds() {
        return Math.min(plannedSeconds, Math.floor(getFocusedMilliseconds() / 1000));
      }

      function renderTimer() {
        const remaining = Math.max(0, plannedSeconds - Math.floor(getFocusedMilliseconds() / 1000));
        const minutes = String(Math.floor(remaining / 60)).padStart(2, "0");
        const seconds = String(remaining % 60).padStart(2, "0");
        timer.textContent = minutes + ":" + seconds;
        if (remaining <= 0) finishSession(true);
      }

      function stopRunningClock() {
        if (isRunning) {
          focusedMilliseconds += Date.now() - runningStartedAt;
          isRunning = false;
        }
        clearInterval(intervalId);
        intervalId = null;
      }

      /*
        한 집중 세션을 정확히 한 번만 반영한다. sessionSaved를 네트워크
        요청 전에 먼저 true로 바꿔 두므로, 자연 종료/끝내기 클릭/
        pagehide/버튼 연타가 겹쳐도 실제 저장(로컬 또는 backend)은 한
        번만 일어난다.
      */
      async function saveSessionOnce() {
        if (sessionSaved) return currentTotalSeconds;
        stopRunningClock();
        const actualSeconds = getFocusedSeconds();
        sessionSaved = true;

        if (isDemoAccount()) {
          currentTotalSeconds = loadLocalTotalSeconds() + actualSeconds;
          saveLocalTotalSeconds(currentTotalSeconds);
          return currentTotalSeconds;
        }

        try {
          currentTotalSeconds = await addBackendTotalSeconds(actualSeconds);
        } catch (error) {
          console.error(error);
        }
        return currentTotalSeconds;
      }

      function getKoreanDateKey() {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(new Date());
      }

      function selectPraise() {
        const seed = studentId + "|" + getKoreanDateKey();
        let hash = 0;
        for (let index = 0; index < seed.length; index += 1) {
          hash = (hash * 31 + seed.charCodeAt(index)) >>> 0;
        }
        return praiseMessages[hash % praiseMessages.length];
      }

      async function finishSession(completedNaturally) {
        if (sessionSaved) return;
        if (completedNaturally) focusedMilliseconds = plannedSeconds * 1000;
        const totalSeconds = await saveSessionOnce();
        sessionTime.textContent = formatDuration(getFocusedSeconds());
        praiseText.textContent = selectPraise();
        updateTotalDisplays(totalSeconds);
        showView(completeView);
      }

      function startSession() {
        if (!validateSelection()) return;
        plannedSeconds = getSelectedSeconds();
        focusedMilliseconds = 0;
        sessionSaved = false;
        isRunning = true;
        runningStartedAt = Date.now();
        runningView.classList.remove("paused");
        pauseButton.textContent = "일시정지";
        showView(runningView);
        renderTimer();
        intervalId = setInterval(renderTimer, 250);
      }

      function togglePause() {
        if (sessionSaved) return;
        if (isRunning) {
          focusedMilliseconds += Date.now() - runningStartedAt;
          isRunning = false;
          clearInterval(intervalId);
          intervalId = null;
          runningView.classList.add("paused");
          pauseButton.textContent = "다시 시작";
          return;
        }
        isRunning = true;
        runningStartedAt = Date.now();
        runningView.classList.remove("paused");
        pauseButton.textContent = "일시정지";
        intervalId = setInterval(renderTimer, 250);
      }

      minuteButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          selectedMinutes = button.dataset.minutes === "custom"
            ? "custom"
            : Number(button.dataset.minutes);
          minuteButtons.forEach(function (item) {
            item.classList.toggle("active", item === button);
          });
          customTimeRow.classList.toggle("show", selectedMinutes === "custom");
          if (selectedMinutes === "custom") customMinutes.focus();
          validateSelection();
        });
      });

      customMinutes.addEventListener("input", validateSelection);
      startButton.addEventListener("click", startSession);
      pauseButton.addEventListener("click", togglePause);
      document.getElementById("endButton").addEventListener("click", function () {
        finishSession(false);
      });
      document.getElementById("setupBackButton").addEventListener("click", function () {
        location.href = destinations.back;
      });
      document.getElementById("completeBackButton").addEventListener("click", function () {
        location.href = destinations.back;
      });
      document.getElementById("thoughtButton").addEventListener("click", function () {
        location.href = destinations.thought;
      });
      window.addEventListener("pagehide", function () {
        if (plannedSeconds > 0 && !sessionSaved) saveSessionOnce();
      });

      initializeTotalSeconds();
      validateSelection();
    })();
  </script>
</body>
</html>
