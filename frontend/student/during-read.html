<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문답책 - 질문 만들기</title>

  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap");

   * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  position: relative;
  font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
  color: #3f2615;
  background: #fff8e9 !important;
}

button,
textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.page {
  position: absolute;
  top: 50%;
  left: 50%;

  width: 1920px;
  height: 1080px;
  padding: 8px 20px 10px;
  overflow: hidden;

  transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
  transform-origin: center center;

  background-image:
    linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.06),
      rgba(255, 247, 224, 0.08)
    ),
    url("../assets/images/practice/during-reading-magic-space-bg.png") !important;

  background-size: cover !important;
  background-position: center center !important;
  background-repeat: no-repeat !important;
  background-color: #fff8e9 !important;
}
    .shell {
      width: 1580px;
      height: 1062px;
      margin: 0 auto;

      display: grid;
      grid-template-rows: 64px minmax(0, 1fr) 220px;
      gap: 8px;

      overflow: hidden;
    }

    /* ==================================================
       상단
    ================================================== */

    .top {
      width: 100%;
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) max-content;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;

      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.7px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.65);
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255, 224, 158, 0.78);
      border-radius: 15px;

      background: linear-gradient(180deg, #bf8740, #6d3a0d);
      box-shadow: 0 8px 16px rgba(91, 47, 10, 0.18);
    }

    .brand-icon img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .main-title,
    .main-desc {
      display: none;
    }

    /*
      title-area는 원래 비어 있는 제목(main-title/main-desc)을 담던 자리라
      화면에서 완전히 숨겨져 있었다. 그 빈 자리(.top 헤더의 가운데 칸)를
      심사 체험 배지 전용 자리로 재사용한다.
    */
    .title-area {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    /* 심사 체험 계정에서만 보이는 짧은 안내 배지. 연습읽기 질문 작성
       화면들이 공통으로 사용하는 디자인(베이지/브라운/골드)이다. */
    .mq-demo-banner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      height: auto;
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(180, 130, 60, 0.42);
      background: linear-gradient(180deg, rgba(255, 247, 225, 0.96), rgba(238, 216, 176, 0.92));
      box-shadow: 0 6px 14px rgba(90, 55, 15, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      color: #6b4b26;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 800;
      white-space: normal;
      word-break: keep-all;
      overflow: visible;
    }

    .mq-demo-banner strong {
      color: #7a4a12;
      font-size: 15px;
      font-weight: 900;
    }

    .mq-demo-banner[hidden] { display: none !important; }

    .top-actions {
      justify-self: end;

      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;

      width: max-content;
      margin-left: auto;
      white-space: nowrap;
    }

    .mq-book-home-button,
    .class-reading-button,
    .date-pill {
      height: 46px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 999px;
      white-space: nowrap;

      font-size: 17px;
      font-weight: 900;
    }

    .mq-book-home-button {
      padding: 0 20px;

      border: 1px solid rgba(214, 173, 99, 0.5);
      background: linear-gradient(180deg, #5c3c22, #2c1a0d);
      color: #fbf0da;

      box-shadow:
        0 8px 16px rgba(35, 20, 8, 0.32),
        inset 0 1px 0 rgba(255, 238, 205, 0.16);
    }

    .class-reading-button {
      padding: 0 20px;

      border: 1px solid rgba(171, 112, 36, 0.45);
      background: linear-gradient(180deg, #efbd59, #b87412);
      color: #fff9ec;

      box-shadow:
        0 8px 16px rgba(105, 57, 5, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .date-pill {
      min-width: 190px;
      padding: 0 16px;
      margin-right: 0;

      border: 1px solid rgba(177, 122, 57, 0.34);
      background: rgba(255, 250, 238, 0.86);
      color: #4f2e16;

      font-size: 15px;

      box-shadow:
        0 7px 14px rgba(116, 71, 20, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.58);
    }

    /* ==================================================
       공통 카드
    ================================================== */

    .card {
      min-width: 0;
      min-height: 0;

      border: 1px solid rgba(193, 133, 61, 0.34);
      border-radius: 28px;

      background:
        linear-gradient(
          180deg,
          rgba(255, 254, 249, 0.94),
          rgba(255, 247, 231, 0.92)
        );

      box-shadow:
        0 14px 28px rgba(123, 75, 25, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);

      backdrop-filter: blur(2px);
    }

    /* ==================================================
       책 속 생각 쓰기
    ================================================== */

    .main-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    .write-card {
      width: 100%;
      height: 100%;
      min-height: 0;

      padding: 20px 38px 16px;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

   .section-title-row {
  display: flex;
  align-items: center;
  gap: 24px;
  width: 100%;
}

.section-title-row .section-title {
  flex-shrink: 0;
  margin: 0;
}

.section-title-row .mq-demo-banner {
  flex: 1;
  min-width: 0;
  max-width: 900px;
  min-height: 38px;
  height: auto;
  padding: 6px 16px;
  font-size: 16px;
  line-height: 1.4;
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  word-break: keep-all;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 9px;

  color: #4b2a13;
  font-family: "Noto Serif KR", serif;
  font-size: 34px;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.7px;
}
    .title-line {
      height: 1px;
      margin: 9px 0 10px;

      background:
        linear-gradient(
          90deg,
          rgba(196, 135, 61, 0.26),
          rgba(196, 135, 61, 0.05)
        );
    }

    .small-label {
      color: #4f2d15;
      font-size: 25px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .type-box {
      flex: 0 0 auto;
    }

    .type-buttons {
      width: 100%;

      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;

      margin-bottom: 9px;
    }

    .type-button {
      height: 60px;

      border: 1px solid rgba(192, 130, 55, 0.34);
      border-radius: 18px;

      background: rgba(255, 252, 245, 0.82);
      color: #5a3820;

      font-size: 22px;
      font-weight: 900;
      white-space: nowrap;

      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .type-button.active {
      border-color: rgba(190, 125, 32, 0.82);
      background: linear-gradient(180deg, #f3c978, #c9902d);
      color: #4a2a10;

      box-shadow: 0 6px 12px rgba(176, 112, 25, 0.15);
    }

    .input-block {
      flex: 0 0 auto;
      margin-top: 5px;
    }

    /*
      답 영역이 남는 공간을 모두 차지하도록 설정
    */
    .answer-block {
      flex: 1 1 auto;
      min-height: 0;

      display: flex;
      flex-direction: column;

      margin-top: 9px;
    }

    .input-head {
      flex: 0 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 7px;
    }

    .input-head .small-label {
      margin-bottom: 0;
    }

    .count {
      color: #94714d;
      font-size: 19px;
      font-weight: 900;
    }

    textarea {
      width: 100%;
      resize: none;

      padding: 18px 21px;

      border: 1px solid rgba(196, 138, 69, 0.34);
      border-radius: 18px;

      background: rgba(255, 255, 255, 0.78);
      color: #452713;

      font-size: 24px;
      font-weight: 800;
      line-height: 1.55;

      outline: none;

      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    textarea::placeholder {
      color: #7e674f;
      font-size: 22px;
      font-weight: 800;
    }

    textarea:focus {
      border-color: rgba(203, 139, 44, 0.72);

      box-shadow:
        0 0 0 3px rgba(216, 162, 68, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    /*
      질문 입력칸도 기존보다 확대
    */
    #questionInput {
      height: 130px;
      min-height: 130px;
    }

    /*
      답 입력칸은 고정 높이가 아니라
      카드에서 남는 높이를 자동으로 채움
    */
    #answerInput {
      flex: 1 1 auto;
      height: auto;
      min-height: 180px;
    }

    .write-actions {
      flex: 0 0 auto;

      margin-top: 14px;
      padding-top: 0;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .sub-button,
    .main-button {
      height: 64px;
      border-radius: 18px;

      font-size: 22px;
      font-weight: 900;
    }

    .sub-button {
      width: 160px;

      border: 1px solid rgba(175, 119, 53, 0.34);
      background: rgba(255, 252, 245, 0.82);
      color: #654220;
    }

    .main-button {
      width: 350px;

      border: 1px solid rgba(176, 111, 25, 0.4);
      background: linear-gradient(180deg, #e4ad45, #b06d0d);
      color: #fff9ec;

      box-shadow:
        0 6px 0 rgba(105, 57, 5, 0.66),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .sub-button:hover,
    .main-button:hover,
    .type-button:hover,
    .mq-book-home-button:hover,
    .class-reading-button:hover {
      transform: translateY(-1px);
    }

    .sub-button:active,
    .main-button:active,
    .type-button:active,
    .mq-book-home-button:active,
    .class-reading-button:active {
      transform: translateY(1px);
    }

    /* ==================================================
       하단 루미 피드백
    ================================================== */

    .bottom-grid {
      min-height: 0;

      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 10px;

      align-items: stretch;
    }

    .feedback-card {
      min-height: 0;
      padding: 16px 28px;

      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 24px;
      align-items: center;

      overflow: hidden;
    }

    .feedback-left {
      width: 180px;
      min-width: 180px;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: visible;
    }

    .lumi-img {
      width: 164px;
      height: 184px;
      max-width: 100%;
      max-height: 100%;

      object-fit: contain;
      object-position: center;

      display: block;

      filter:
        drop-shadow(0 10px 13px rgba(112, 63, 15, 0.14))
        drop-shadow(0 0 12px rgba(255, 198, 94, 0.12));
    }

    .feedback-right {
      width: 100%;
      min-width: 0;
      height: 100%;

      display: flex;
      align-items: center;
    }

    .feedback-message {
      width: 100%;
      height: 166px;
      min-height: 166px;
      max-height: 166px;

      padding: 22px 28px;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      overflow-y: auto;

      border: 1px solid rgba(186, 130, 58, 0.3);
      border-radius: 20px;

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(255, 219, 129, 0.13),
          transparent 40%
        ),
        rgba(255, 255, 250, 0.76);

      color: #4f3219;
      font-size: 23px;
      font-weight: 900;
      line-height: 1.55;

      word-break: keep-all;
    }

    .feedback-message.good {
      border-color: rgba(97, 155, 72, 0.42);

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(166, 224, 132, 0.16),
          transparent 40%
        ),
        rgba(250, 255, 245, 0.78);
    }

    .feedback-message.need {
      border-color: rgba(209, 146, 48, 0.44);

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(255, 208, 115, 0.19),
          transparent 40%
        ),
        rgba(255, 250, 238, 0.78);
    }

    .next-card {
      min-height: 0;
      padding: 18px 20px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;

      overflow: hidden;
    }

    .pass-count {
      min-height: 42px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(190, 130, 55, 0.28);
      border-radius: 999px;

      background: rgba(255, 249, 235, 0.9);
      color: #8c5c1e;

      font-size: 18px;
      font-weight: 900;
    }

    .next-button {
      width: 100%;
      height: 58px;

      border: 1px solid rgba(102, 71, 33, 0.18);
      border-radius: 16px;

      background: linear-gradient(180deg, #e6ad45, #b06a0d);
      color: #fff9eb;

      font-family: "Noto Serif KR", serif;
      font-size: 21px;
      font-weight: 900;

      box-shadow:
        0 6px 0 rgba(105, 57, 5, 0.66),
        inset 0 1px 0 rgba(255, 255, 255, 0.34);
    }

    .type-button:disabled,
    textarea:disabled,
    .sub-button:disabled,
    .main-button:disabled {
      opacity: 0.62;
      cursor: not-allowed;
      transform: none !important;
    }

    textarea:disabled {
      background: rgba(239, 235, 226, 0.88);
      color: #8b7b6a;
    }

    .next-button:disabled {
      background: linear-gradient(180deg, #cfc7bb, #aaa195);
      color: #fffaf1;

      cursor: not-allowed;
      box-shadow: none;
    }

    .share-note {
      color: #8a7259;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    /*
      1920×1080 고정 스테이지를 사용하므로
      화면 크기에 따라 글씨·버튼·카드 크기를 바꾸는 반응형 규칙은 사용하지 않습니다.
      아래 스크립트가 전체 화면만 같은 비율로 축소·확대합니다.
    */

  </style>
</head>

<body>
  <main class="page">
    <div class="shell">

      <header class="top">
        <div class="brand">
          <div class="brand-icon">
            <img
              src="../assets/images/logo-book.png"
              alt="문답책 로고"
            />
          </div>

          <span>우리반 책읽기</span>
        </div>

       <div class="title-area">
  <h1 class="main-title"></h1>
  <p class="main-desc">
    질문과 내 생각을 쓰고 루미에게 확인 받아 봐.
  </p>
</div>

        <div class="top-actions">
          <button
            class="mq-book-home-button"
            type="button"
            onclick="goHome()"
          >
            🏠 홈으로
          </button>

          <button
            class="class-reading-button"
            type="button"
            onclick="goClassReading()"
          >
            📚 우리반 책읽기
          </button>

          <div class="date-pill" id="todayText">
            오늘 날짜
          </div>
        </div>
      </header>

      <section class="main-grid">
        <article class="card write-card">

          <div class="section-title-row">
            <h2 class="section-title">
              ✎ 책 속 생각 쓰기
            </h2>

            <div class="mq-demo-banner" id="demoExperienceBanner" hidden>
              🔍 <strong>심사 체험 안내</strong> — 실제 학생은 루미 피드백을 통과해야 다음 단계로 이동하지만, 심사계정은 바로 이동할 수 있습니다.
            </div>
          </div>

          <div class="title-line"></div>

          <div class="type-box">
            <div class="small-label">
              질문 유형 선택
            </div>

            <div class="type-buttons">
              <button
                class="type-button active"
                type="button"
                data-type="direct"
              >
                🔍 바로 찾기
              </button>

              <button
                class="type-button"
                type="button"
                data-type="infer"
              >
                💡 짐작하기
              </button>

              <button
                class="type-button"
                type="button"
                data-type="opinion"
              >
                💛 생각·느낌
              </button>

              <button
                class="type-button"
                type="button"
                data-type="connect"
              >
                🔗 삶과 연결
              </button>
            </div>
          </div>

          <div class="input-block">
            <div class="input-head">
              <label
                class="small-label"
                for="questionInput"
              >
                질문 쓰기
              </label>

              <span
                class="count"
                id="questionCount"
              >
                0 / 200자
              </span>
            </div>

            <textarea
              id="questionInput"
              maxlength="200"
              placeholder="책을 읽으며 떠오른 질문을 써 보세요."
            ></textarea>
          </div>

          <div class="input-block answer-block">
            <div class="input-head">
              <label
                class="small-label"
                for="answerInput"
              >
                내 생각 / 답
              </label>

              <span
                class="count"
                id="answerCount"
              >
                0 / 400자
              </span>
            </div>

            <textarea
              id="answerInput"
              maxlength="400"
              placeholder="이 질문에 대한 내 생각이나 답을 자유롭게 써 보세요."
            ></textarea>
          </div>

          <div class="write-actions">
            <button
              class="sub-button"
              id="resetButton"
              type="button"
              onclick="resetForm()"
            >
              다시 쓰기
            </button>

            <button
              class="main-button"
              id="checkButton"
              type="button"
              onclick="checkQuestion()"
            >
              ✨ 루미에게 확인 받기
            </button>
          </div>

        </article>
      </section>

      <section class="bottom-grid">

        <article class="card feedback-card">
          <div class="feedback-left">
            <img
              class="lumi-img"
              src="../assets/images/class-reading/class-reading-lumi-feedback.png"
              alt="루미"
            />
          </div>

          <div class="feedback-right">
            <div
              class="feedback-message"
              id="feedbackBox"
            >
              질문과 내 생각을 쓴 뒤
              <strong>루미에게 확인 받기</strong>를 눌러 봐.
              3개 이상 통과하면 다음 단계로 갈 수 있어.
            </div>
          </div>
        </article>

        <article class="card next-card">
          <div
            class="pass-count"
            id="passCount"
          >
            통과 0 / 3개
          </div>

          <button
            class="next-button"
            id="nextButton"
            type="button"
            onclick="goNextStep()"
            disabled
          >
            다음 단계
          </button>

          <p class="share-note">
            루미에게 3개 이상 통과받아야 열려요.
          </p>
        </article>

      </section>
    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script src="../js/demo-storage.js"></script>
  <script src="../js/pre-reading-validation.js"></script>
<script src="../js/ai-feedback.js"></script>
  <script>
    /* =========================================================
       1920×1080 고정 화면 비율 유지
       - 내부 글씨, 버튼, 카드 크기는 원본 그대로 유지
       - 브라우저 창 크기에 맞춰 화면 전체만 동일 비율로 축소/확대
    ========================================================= */
    function fitFixedStage() {
      const designWidth = 1920;
      const designHeight = 1080;

      const scaleX = window.innerWidth / designWidth;
      const scaleY = window.innerHeight / designHeight;
      const scale = Math.min(scaleX, scaleY);

      document.documentElement.style.setProperty(
        "--stage-scale",
        String(scale)
      );
    }

    window.addEventListener("resize", fitFixedStage);
    window.addEventListener("DOMContentLoaded", fitFixedStage);
    fitFixedStage();

    /*
      로컬 형식 필터. 의미 판정(선택한 질문 유형에 맞는지, 질문과 답이
      자연스럽게 이어지는지)은 하지 않고, 읽기 전 검증(js/pre-reading-
      validation.js)과 같은 기준으로 빈 입력·초성/기호만 입력·반복 글자·
      너무 짧은 입력·질문 형태가 아닌 입력만 걸러낸다. 의미 판정은
      requestDuringReadingAiFeedback()에서 AI에게 맡긴다.
    */
    function validateDuringReadingFormat(question, answer) {
      if (!question) {
        return {
          ok: false,
          message:
            "질문 칸이 비어 있어. 책을 읽으며 궁금했던 점을 먼저 질문으로 써 보자."
        };

      if (preReadingIsJamoOrSymbolOnly(question)) {
        return {
          ok: false,
          message: "질문의 뜻이 잘 보이지 않아. 궁금한 점을 문장으로 다시 적어 보자."
        };
      }

      if (preReadingHasExcessiveRepetition(question)) {
        return {
          ok: false,
          message: "같은 글자가 너무 많이 반복됐어. 궁금한 내용을 문장으로 적어 보자."
        };
      }

      if (preReadingCountWithoutSpaces(question) < 5) {
        return {
          ok: false,
          message:
            "질문이 너무 짧아. 누가, 무엇을, 왜, 어떻게 같은 말을 떠올리며 조금 더 자세히 써 보자."
        };
      }

      if (!preReadingLooksLikeQuestion(question)) {
        return {
          ok: false,
          message:
            "질문 형식으로 바꿔 보자. 끝을 '나요?', '까요?', '했을까요?'처럼 물어보는 문장으로 쓰면 좋아."
        };
      }

      if (!answer) {
        return {
          ok: false,
          message:
            "내 생각이나 답도 함께 써야 해. 질문에 대해 내가 생각한 답을 한 문장 이상 적어 보자."
        };
      }

      if (preReadingIsJamoOrSymbolOnly(answer)) {
        return {
          ok: false,
          message: "답의 뜻이 잘 보이지 않아. 내 생각을 문장으로 다시 적어 보자."
        };
      }

      if (preReadingHasExcessiveRepetition(answer)) {
        return {
          ok: false,
          message: "같은 글자가 너무 많이 반복됐어. 내 생각을 문장으로 적어 보자."
        };
      }

      if (preReadingCountWithoutSpaces(answer) < 3) {
        return {
          ok: false,
          message:
            "내 생각이나 답이 조금 짧아. 왜 그렇게 생각했는지 이유를 한 문장 더 붙이면 좋아."
        };
      }

      return { ok: true };
    }

    /*

      AI가 good을 줘야만 저장·통과 카운트·다음 단계 조건에 반영된다.
      AbortController + 타임아웃으로 "루미가 답변을 읽고 있어요..."에서

      요청을 막는다.
    */
    async function saveBookThoughtResponse(
  questionType,
  question,
  answer,
  demoOptions
) {
  if (isDemoAccount()) {
    const items = loadDemoState(DEMO_DURING_READ_STORAGE_KEY, []);
    const options = demoOptions || {};
    const demoId = options.id ||
      "demo-" + Date.now() + "-" + Math.floor(Math.random() * 1000);
    const existingIndex = items.findIndex(function(item) {
      return String(item.id) === String(demoId);
    });
    const existingItem = existingIndex >= 0 ? items[existingIndex] : null;

    const newItem = {
      id: demoId,
      questionType: questionType,
      question: question,
      answer: answer,
      createdAt: existingItem?.createdAt || new Date().toISOString(),
      aiPassed: options.aiPassed === true
    };

    if (existingIndex >= 0) {
      items[existingIndex] = newItem;
    } else {
      items.push(newItem);
    }

    saveDemoState(DEMO_DURING_READ_STORAGE_KEY, items);

    /* saveDemoState는 저장 예외를 내부에서 처리하므로 실제 재조회로 성공을 확인한다. */
    const persistedItems = loadDemoState(DEMO_DURING_READ_STORAGE_KEY, []);
    return persistedItems.find(function(item) {
      return String(item.id) === String(demoId) &&
        item.question === question &&
        item.answer === answer;
    }) || null;
  }

  const token = sessionStorage.getItem("token");

  if (!token || !studentId || !classReadingBookId) {
    console.error(
      "책 속 생각 저장에 필요한 정보가 없습니다."
    );
    return null;
  }

  try {
    const response = await fetch(
      `${API_BASE_URL}/api/students/${studentId}/responses/book-thought`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({
          questionType: questionType,
          question: question,
          answer: answer,
          classReadingBookId: classReadingBookId
        })
      }
    );

    if (!response.ok) {
      const errorText = await response.text();

      console.error(
        "책 속 생각 저장 실패:",
        response.status,
        errorText
      );

      return null;
    }

    return await response.json();
  } catch (error) {
    console.error(
      "책 속 생각 저장 중 오류가 발생했습니다.",
      error
    );

    return null;
  }
}
function applyTodayBookThoughtItems(items) {
  todayQuestions = items
    .filter(function(item) {
      /* AI 확인 전 저장한 심사 체험 초안은 완료 질문 수에 포함하지 않는다. */
      if (isDemoAccount() && item.aiPassed === false) {
        return false;
      }

      if (!item.createdAt) {
        return false;
      }

      const createdDate =
        String(item.createdAt).slice(0, 10);

      return createdDate === todayInfo.key;

        id: item.id,
        dateKey: todayInfo.key,
        dateText: todayInfo.display,
        shortDateText: todayInfo.shortDisplay,
        type: item.questionType,
        typeLabel:

          item.questionType,
        text: item.question,
        answer: item.answer,
        createdAt:
          String(item.createdAt).slice(11, 16)
      };
    });
}

    async function requestDuringReadingAiFeedback(question, answer) {

if (!token || !studentId || !classReadingBookId) {

}

/*
  아직 저장되지 않은 현재 질문의 순번을 사용한다.
  같은 질문을 수정해서 재검사할 때는 todayQuestions.length가 바뀌지 않으므로
  동일한 evaluationKey가 유지된다.
*/
const questionNumber = todayQuestions.length + 1;

const evaluationKey =
  "practice-during-" +
  classReadingBookId +
  "-" +
  studentId +
  "-book-thought-" +
  todayInfo.key +
  "-" +
  questionNumber;

      const isDemo = isDemoAccount();
      const demoResponseId = "demo-" + evaluationKey;

      try {
        /* 심사 체험은 공용 DB가 아니라 현재 브라우저에 먼저 초안으로 저장한다. */
        if (isDemo) {
          const localDraft = await saveBookThoughtResponse(
            selectedType,
            question,
            answer,
            { id: demoResponseId, aiPassed: false }
          );

          if (!localDraft) {
            setFeedback("need", "질문을 저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
            return;
          }
        }

        const apiPath = isDemo
          ? "/api/feedback/ai-review"
          : "/api/students/me/feedback/ai-review";
        const headers = { "Content-Type": "application/json" };

        if (!isDemo) {
          headers.Authorization = "Bearer " + token;
        }

        const requestBody = isDemo
          ? {
              type: "during_reading_question",
              stepType: selectedType,
              qaList: [{ question: question, answer: answer }]
            }
          : {
              question: question,
              answer: answer,
              activityType: "during_reading_question",
              questionType: selectedType,
              evaluationKey: evaluationKey,
              classReadingBookId: classReadingBookId
            };

        const response = await fetch(API_BASE_URL + apiPath, {
          method: "POST",
          headers: headers,
          signal: abortController.signal,
          body: JSON.stringify(requestBody)
        });

        if (requestId !== duringReadingAiRequestId) {
          return;
        }

        if (!response.ok) {
          const bodyText = await response.text().catch(function() {
            return "(읽지 못함)";
          });
          console.error(
            "읽기 중 AI 피드백 요청 실패 - status:",
            response.status,
            "body:",
            bodyText
          );
          setFeedback("need", aiFailMessage);
          return;
        }

        const result = await response.json();

        if (requestId !== duringReadingAiRequestId) {
          return;
        }

        const isGood = result.status === "good";
        setFeedback(isGood ? "good" : "need", result.message);

        if (isGood) {
          const savedResponse = await saveBookThoughtResponse(
            selectedType,
            question,
            answer,
            isDemo ? { id: demoResponseId, aiPassed: true } : undefined
          );

          if (requestId !== duringReadingAiRequestId) {
            return;
          }

          if (!savedResponse) {
            setFeedback(
              "need",
              "질문은 잘 만들었지만 저장하지 못했어요. 잠시 후 다시 확인 받아 주세요."
            );
            return;
          }

          saveQuestion(question, answer, savedResponse);
          questionInput.value = "";
          answerInput.value = "";
          updateCounts();

          if (todayQuestions.length >= 3) {
            syncDemoPracticeApprovalRequests();
            lockQuestionForm();
            setCompletionFeedback();
          }
        }
      } catch (error) {
          if (requestId !== duringReadingAiRequestId) {
            return;
          }

          if (error.name === "AbortError") {
            console.error(
              "읽기 중 AI 피드백 요청이 시간 초과(타임아웃)되었습니다.",
              error
            );
          } else {
            console.error(
              "읽기 중 AI 피드백 요청 중 네트워크 오류가 발생했습니다.",
              error
            );
          }

          setFeedback("need", aiFailMessage);
      } finally {
          clearTimeout(timeoutId);
          isDuringReadingAiRequestInFlight = false;

          /* 질문 3개를 이미 다 통과했으면 lockQuestionForm()이 잠근 상태를 유지해야 한다. */
          if (checkButton && todayQuestions.length < 3) {
            checkButton.disabled = false;
          }
      }
    }

    function setFeedback(
      state,
      message
    ) {
      feedbackBox.className =
        "feedback-message " + state;

      feedbackBox.innerHTML =
        message;
    }

    /*
      =========================================================
      4. 오늘 만든 질문 저장
      =========================================================
    */

    function saveQuestion(
  question,
  answer,
  savedResponse
) {
  const alreadyExists = todayQuestions.some(
    function(item) {
      return item.id === savedResponse.id;
    }
  );

  if (alreadyExists) {
    setFeedback(
      "need",
      "이미 통과한 질문과 같은 내용이에요. 다른 질문을 만들어 보세요."
    );
    return;
  }

  const newQuestion = {
    id: savedResponse.id,
    dateKey: todayInfo.key,
    dateText: todayInfo.display,
    shortDateText: todayInfo.shortDisplay,
    type: savedResponse.questionType,
    typeLabel:
      typeInfo[savedResponse.questionType]?.label ||
      savedResponse.questionType,
    text: savedResponse.question,
    answer: savedResponse.answer,
    createdAt:
      String(savedResponse.createdAt || "").slice(11, 16)
  };

  todayQuestions.push(newQuestion);

  saveTodayQuestions();
  renderTodayQuestions();
}

    function getCurrentTimeText() {
      const now = new Date();

      const hour = String(
        now.getHours()
      ).padStart(2, "0");

      const minute = String(
        now.getMinutes()
      ).padStart(2, "0");

      return hour + ":" + minute;
    }

    function loadTodayQuestions() {
      const savedData =
        localStorage.getItem(
          todayKey
        );

      if (!savedData) {
        todayQuestions = [];
        return;
      }

      try {
        todayQuestions =
          JSON.parse(savedData);
      } catch (error) {
        todayQuestions = [];
      }
    }

    function saveTodayQuestions() {
      localStorage.setItem(
        todayKey,
        JSON.stringify(
          todayQuestions
        )
      );

      const archiveKey =
        "classReadingQuestionArchive_" +
        studentId;

      let archive =
        JSON.parse(
          localStorage.getItem(
            archiveKey
          ) || "{}"
        );

      archive[todayInfo.key] =
        todayQuestions;

      localStorage.setItem(
        archiveKey,
        JSON.stringify(archive)
      );
    }

    function renderTodayQuestions() {
      const passed =
        todayQuestions.length;

      if (passCount) {
        passCount.textContent =
          "통과 " +
          Math.min(passed, 3) +
          " / 3개";
      }

      if (nextButton) {
        nextButton.disabled =
          !isDemoAccount() && passed < 3;
      }

      if (passed >= 3) {
        lockQuestionForm();
      } else {
        unlockQuestionForm();
      }

      if (!questionList) {
        return;
      }

      if (selectCount) {
        selectCount.textContent =
          selectedQuestionIds.length +
          " / 3개 선택됨";
      }

      if (shareButton) {
        shareButton.disabled =
          selectedQuestionIds.length === 0;
      }

      if (topShareButton) {
        topShareButton.disabled =
          selectedQuestionIds.length === 0;
      }

      if (
        todayQuestions.length === 0
      ) {
        questionList.innerHTML =
          '<div class="empty">' +
          "아직 만든 질문이 없어요.<br>" +
          "위에서 질문을 쓰고 루미에게 확인 받아 보세요." +
          "</div>";

        return;
      }

      questionList.innerHTML =
        todayQuestions
          .map(function(question) {
            const selected =
              selectedQuestionIds.includes(
                question.id
              );

            const selectedClass =
              selected
                ? " selected"
                : "";

            return (
              '<article class="question-card' +
              selectedClass +
              '" onclick="toggleQuestionSelect(' +
              question.id +
              ')">' +
              '<div class="check"></div>' +
              '<div class="q-meta">' +
              question.shortDateText +
              '<span class="type-badge">' +
              escapeHtml(
                question.typeLabel
              ) +
              "</span>" +
              "</div>" +
              '<div class="q-text">' +
              escapeHtml(
                question.text
              ) +
              "</div>" +
              '<div class="q-answer">내 답: ' +
              escapeHtml(
                question.answer || ""
              ) +
              "</div>" +
              '<button class="edit-button" type="button" onclick="editQuestion(event, ' +
              question.id +
              ')">✎</button>' +
              "</article>"
            );
          })
          .join("");
    }

    function toggleQuestionSelect(id) {
      const alreadySelected =
        selectedQuestionIds.includes(id);

      if (alreadySelected) {
        selectedQuestionIds =
          selectedQuestionIds.filter(
            function(itemId) {
              return itemId !== id;
            }
          );
      } else {
        if (
          selectedQuestionIds.length >= 3
        ) {
          setFeedback(
            "need",
            "질문 나누기에 보낼 질문은 최대 3개까지 고를 수 있어. 하나를 해제한 뒤 다시 선택해 봐."
          );

          return;
        }

        selectedQuestionIds.push(id);
      }

      renderTodayQuestions();
    }

    function editQuestion(
      event,
      id
    ) {
      event.stopPropagation();

      const target =
        todayQuestions.find(
          function(question) {
            return question.id === id;
          }
        );

      if (!target) {
        return;
      }

      selectedType =
        target.type;

      questionInput.value =
        target.text;

      answerInput.value =
        target.answer;

      typeButtons.forEach(
        function(button) {
          button.classList.toggle(
            "active",
            button.dataset.type ===
              selectedType
          );
        }
      );

      todayQuestions =
        todayQuestions.filter(
          function(question) {
            return question.id !== id;
          }
        );

      selectedQuestionIds =
        selectedQuestionIds.filter(
          function(questionId) {
            return questionId !== id;
          }
        );

      saveTodayQuestions();
      renderTodayQuestions();
      updateCounts();

      setFeedback(
        "need",
        "선택한 질문을 다시 고칠 수 있게 불러왔어. 수정한 뒤 다시 루미에게 확인 받아 줘."
      );
    }

    function lockQuestionForm() {
      questionInput.disabled = true;
      answerInput.disabled = true;

      typeButtons.forEach(function(button) {
        button.disabled = true;
      });

      if (resetButton) {
        resetButton.disabled = true;
      }

      if (checkButton) {
        checkButton.disabled = true;
        checkButton.textContent = "✓ 질문 3개 통과 완료";
      }
    }

    function unlockQuestionForm() {
      questionInput.disabled = false;
      answerInput.disabled = false;

      typeButtons.forEach(function(button) {
        button.disabled = false;
      });

      if (resetButton) {
        resetButton.disabled = false;
      }

      if (checkButton) {
        checkButton.disabled = false;
        checkButton.textContent = "✨ 루미에게 확인 받기";
      }
    }

    function setCompletionFeedback() {
      setFeedback(
        "good",
        "<div>🎉 질문 3개가 모두 통과했어!<br>" +
        "‘바로 찾기’ 유형은 책 퀴즈로, ‘짐작하기·생각과 느낌·삶과 연결’ 유형은 생각나누기로 자동 분류돼.<br>" +
        "오른쪽의 다음 단계 버튼을 눌러 책수다방으로 가 보자.</div>"
      );
    }

    function resetForm() {
      if (todayQuestions.length >= 3) {
        setCompletionFeedback();
        return;
      }

      questionInput.value = "";
      answerInput.value = "";

      updateCounts();

      setFeedback(
        "need",
        "입력칸을 비웠어. 새 질문을 써 보고 루미에게 확인 받아 봐."
      );
    }

    /*
  =========================================================
  5. 다음 단계 이동
  =========================================================
*/

function syncDemoPracticeApprovalRequests() {
  if (!isDemoAccount() || todayQuestions.length < 3) return [];

  const existingRequests = loadDemoApprovalRequests("practice");
  return todayQuestions.slice(0, 3).map(function(question, index) {
    const requestId = "practice-book-thought-" + String(question.id || index);
    const existing = existingRequests.find(function(item) {
      return String(item.requestId) === requestId;
    });
    const unchanged = existing
      && existing.question === question.text
      && existing.answer === question.answer
      && existing.questionType === question.type;

    return saveDemoApprovalRequest("practice", {
      requestId: requestId,
      activityScope: "practiceBookChat",
      studentId: studentId,
      studentName: sessionStorage.getItem("name") || "김초롱",
      classReadingBookId: classReadingBookId,
      questionId: String(question.id || index),
      submittedAt: existing && unchanged ? existing.submittedAt : new Date().toISOString(),
      status: existing && unchanged ? existing.status : "pending",
      rejectedReason: existing && unchanged ? existing.rejectedReason : "",
      questionType: question.type,
      question: question.text,
      answer: question.answer,
      questions: [{
        questionId: String(question.id || index),
        questionType: question.type,
        question: question.text,
        answer: question.answer
      }]
    });
  });
}

function goNextStep() {
  if (!isDemoAccount() && todayQuestions.length < 3) {
    setFeedback(
      "need",
      "아직 " +
        (3 - todayQuestions.length) +
        "개가 더 필요해. 질문과 내 생각을 쓰고 루미에게 확인 받아 봐."
    );

    return;
  }

  /*
    책수다방에서 불러올 질문 저장
  */
  const studentQuestionData = {
    name: sessionStorage.getItem("name") || "나",
    isMine: true,
    dateKey: todayInfo.key,
    dateText: todayInfo.display,

    questions: todayQuestions.slice(0, 3).map(function(question) {
      return {
        text: question.text,
        answer: question.answer,
        type: question.type,
        typeLabel: question.typeLabel,
        createdAt:
          question.dateText +
          " " +
          question.createdAt
      };
    })
  };

  syncDemoPracticeApprovalRequests();

  if (isDemoAccount()) {
    const demoProgress = loadDemoState("practiceProgress", {});
    demoProgress.classReadDone = true;
    saveDemoState("practiceProgress", demoProgress);
  }

  localStorage.setItem(
    "classReadingPassedQuestions",
    JSON.stringify(todayQuestions.slice(0, 3))
  );

  localStorage.setItem(
    "mySharedQuestions",
    JSON.stringify(studentQuestionData)
  );

  location.href = "./book-chat.html";
}

    function goReadingMain() {
      location.href =
        "./class-reading.html";
    }

    function goHome() {
      location.href =
        "./individual-reading.html";
    }

    function goClassReading() {
      location.href =
        "./class-reading.html";
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll(
          "'",
          "&#039;"
        );
    }
  </script>
