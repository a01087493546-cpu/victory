<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문답책 - 질문 만들기</title>

  <style>
    /*
      파일명: during-read.html
      역할: 우리반 책읽기 - 질문 만들기 화면

      핵심 기능:
      1. 학생이 질문 유형을 선택하고 질문/내 생각을 작성합니다.
      2. 루미가 질문 형식, 길이, 유형 적합성, 답과의 연결성을 피드백합니다.
      3. 통과한 질문은 오늘 날짜와 함께 저장됩니다.
      4. 오늘 만든 질문 중 최대 3개를 선택해 질문 나누기로 공유합니다.
    */

    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap");

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
  width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: hidden;
  font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
  color: #3f2615;
  background:
    linear-gradient(180deg, rgba(255, 246, 222, 0.42), rgba(255, 232, 184, 0.46)),
    url("../assets/images/practice/mystic-forest-bg.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

    button,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

  .page {
  width: 100%;
  height: 100vh;
  padding: 12px 20px 14px;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(255, 246, 222, 0.42), rgba(255, 232, 184, 0.46)),
    url("../assets/images/practice/mystic-forest-bg.png") center / cover no-repeat;
}

 .shell {
  width: min(1120px, calc(100vw - 40px));
  height: calc(100vh - 26px);
  margin: 0 auto;
  display: grid;
  grid-template-rows: 64px minmax(0, 1fr) 170px;
  gap: 12px;
  overflow: hidden;
}

    /* 상단 */
 .top {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr) 260px;
  align-items: center;
  gap: 8px;
}

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.7px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.65);
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #fff5d6;
      background: linear-gradient(180deg, #bf8740, #6d3a0d);
      border: 1px solid rgba(255, 224, 158, 0.78);
      box-shadow: 0 8px 16px rgba(91, 47, 10, 0.18);
      font-size: 21px;
    }
    .brand-icon img {
  width: 30px;
  height: 30px;
  object-fit: contain;
  display: block;
}

    .title-area {
      text-align: center;
    }

    .main-title {
  font-family: "Noto Serif KR", serif;
  color: #4b2a13;
  font-size: 28px;
  font-weight: 900;
  line-height: 1.08;
  letter-spacing: -1.4px;
  white-space: nowrap;
}

    .main-desc {
      margin-top: 3px;
      color: #6e4b2e;
      font-size: 14px;
      font-weight: 850;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .date-pill,
    .top-share,
      .back-main-button {
      height: 38px;
      border-radius: 14px;
      border: 1px solid rgba(177, 122, 57, 0.34);
      background: rgba(255, 250, 238, 0.82);
      color: #4f2e16;
      font-size: 13px;
      font-weight: 900;
      box-shadow:
        0 7px 14px rgba(116, 71, 20, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.58);
    }
    .back-main-button {
  min-width: 112px;
  padding: 0 12px;
}

    .date-pill {
  min-width: 128px;
  display: grid;
  place-items: center;
  padding: 0 8px;
}

    .top-share {
      min-width: 95px;
      padding: 0 13px;
      background: linear-gradient(180deg, #e4ad45, #b06d0d);
      color: #fff9ec;
    }

    .top-share:disabled {
      background: rgba(205, 198, 188, 0.85);
      color: #fffaf1;
      cursor: not-allowed;
    }

    /* 공통 카드 */
  .card {
  min-width: 0;
  min-height: 0;
  border-radius: 22px;
  border: 1px solid rgba(193, 133, 61, 0.34);
  background:
    linear-gradient(180deg, rgba(255, 254, 249, 0.92), rgba(255, 247, 231, 0.90));
  box-shadow:
    0 14px 28px rgba(123, 75, 25, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(2px);
}

    /* 중간 */
    .main-grid {
  min-height: 0;
  display: grid;
  grid-template-columns: 0.86fr 1fr;
  gap: 14px;
  align-items: stretch;
}

   .write-card {
  min-height: 0;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

    .section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #4b2a13;
  font-family: "Noto Serif KR", serif;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.6px;
  line-height: 1;
}

    .title-line {
      height: 1px;
      margin: 10px 0 11px;
      background: linear-gradient(90deg, rgba(196, 135, 61, 0.26), rgba(196, 135, 61, 0.05));
    }

    .small-label {
  color: #4f2d15;
  font-size: 16px;
  font-weight: 900;
  margin-bottom: 7px;
}

    .type-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

    .type-button {
  height: 44px;
  border-radius: 14px;
  border: 1px solid rgba(192, 130, 55, 0.34);
  background: rgba(255, 252, 245, 0.82);
  color: #5a3820;
  font-size: 15px;
  font-weight: 900;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
  white-space: nowrap;
}
    .type-button.active {
      border-color: rgba(190, 125, 32, 0.82);
      background: linear-gradient(180deg, #f3c978, #c9902d);
      color: #4a2a10;
      box-shadow: 0 6px 12px rgba(176, 112, 25, 0.15);
    }

    .input-block {
      margin-top: 6px;
    }

    .input-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .count {
      color: #94714d;
      font-size: 12px;
      font-weight: 850;
    }

    textarea {
      width: 100%;
      resize: none;
      border-radius: 15px;
      border: 1px solid rgba(196, 138, 69, 0.34);
      background: rgba(255, 255, 255, 0.76);
      color: #452713;
      padding: 12px 14px;
      font-size: 16px;
      font-weight: 750;
      line-height: 1.43;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    textarea:focus {
      border-color: rgba(203, 139, 44, 0.72);
      box-shadow:
        0 0 0 3px rgba(216, 162, 68, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    #questionInput {
  height: 92px;
}

#answerInput {
  height: 108px;
}

   .write-actions {
  display: grid;
  grid-template-columns: 145px 1fr;
  gap: 10px;
  margin-top: auto;
  padding-top: 12px;
}

    .sub-button,
    .main-button {
      height: 43px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 900;
    }

    .sub-button {
      border: 1px solid rgba(175, 119, 53, 0.34);
      background: rgba(255, 252, 245, 0.80);
      color: #654220;
    }

    .main-button {
      border: 1px solid rgba(176, 111, 25, 0.40);
      background: linear-gradient(180deg, #e4ad45, #b06d0d);
      color: #fff9ec;
      box-shadow:
        0 6px 0 rgba(105, 57, 5, 0.66),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    /* 루미 피드백 */
 .feedback-card {
  min-height: 0;
  padding: 14px 20px;
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 18px;
  align-items: center;
  overflow: hidden;
}

    .feedback-content {
      min-height: 0;
      display: grid;
      grid-template-rows: 104px 1fr;
      gap: 8px;
    }

    .lumi-row {
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 8px;
      align-items: end;
    }

.lumi-img {
  width: 138px;
  filter:
    drop-shadow(0 10px 13px rgba(112, 63, 15, 0.14))
    drop-shadow(0 0 12px rgba(255, 198, 94, 0.12));
}
    .lumi-say {
      align-self: center;
      padding: 12px 14px;
      border-radius: 15px;
      border: 1px solid rgba(186, 130, 58, 0.23);
      background: rgba(255, 254, 248, 0.72);
      color: #5a3b1f;
      font-size: 14px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

 .feedback-message {
  min-height: 96px;
  max-height: 122px;
  padding: 16px 20px;
  border-radius: 18px;
  border: 1px solid rgba(186, 130, 58, 0.30);
  background:
    radial-gradient(circle at 100% 0%, rgba(255, 219, 129, 0.13), transparent 40%),
    rgba(255, 255, 250, 0.72);
  color: #4f3219;
  font-size: 18px;
  font-weight: 850;
  line-height: 1.5;
  word-break: keep-all;
  overflow-y: auto;
  margin-top: 6px;
}

    .feedback-message.good {
      border-color: rgba(97, 155, 72, 0.42);
      background:
        radial-gradient(circle at 100% 0%, rgba(166, 224, 132, 0.16), transparent 40%),
        rgba(250, 255, 245, 0.78);
    }

    .feedback-message.need {
      border-color: rgba(209, 146, 48, 0.44);
      background:
        radial-gradient(circle at 100% 0%, rgba(255, 208, 115, 0.19), transparent 40%),
        rgba(255, 250, 238, 0.78);
    }

    /* 하단 */
    .bottom-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 14px;
      align-items: stretch;
    }

    .today-card {
  min-height: 0;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
    .today-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 9px;
    }

    .today-guide {
  margin-bottom: 10px;
  color: #7a5a3b;
  font-size: 14px;
  font-weight: 850;
}

    .select-count {
      min-width: 98px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(190, 130, 55, 0.26);
      background: rgba(255, 249, 235, 0.86);
      color: #8c5c1e;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
    }

   .question-list {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr;
  gap: 9px;
  overflow-y: auto;
  padding-right: 4px;
}

 .empty {
  min-height: 100%;
  border-radius: 15px;
  border: 1px dashed rgba(177, 122, 57, 0.30);
  background: rgba(255, 255, 255, 0.50);
  color: #92745a;
  font-size: 15px;
  font-weight: 850;
  line-height: 1.5;
  display: grid;
  place-items: center;
  text-align: center;
}

    .question-card {
  position: relative;
  min-height: 72px;
  padding: 14px 38px 12px 42px;
  border-radius: 14px;
  border: 1px solid rgba(186, 130, 58, 0.25);
  background: rgba(255, 255, 255, 0.65);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
  cursor: pointer;
}

    .question-card.selected {
      border-color: rgba(83, 133, 60, 0.65);
      background: rgba(243, 255, 236, 0.80);
      box-shadow:
        0 0 0 3px rgba(110, 169, 80, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    .check {
      position: absolute;
      left: 10px;
      top: 11px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(158, 114, 64, 0.44);
      background: rgba(255, 255, 255, 0.78);
    }

    .question-card.selected .check {
      border-color: #5c9a3e;
      background: #67a846;
    }

    .question-card.selected .check::after {
      content: "✓";
      position: absolute;
      left: 3px;
      top: -4px;
      color: white;
      font-size: 15px;
      font-weight: 900;
    }

    .q-meta {
  margin-bottom: 7px;
  color: #9c7141;
  font-size: 14px;
  font-weight: 900;
}

    .type-badge {
  display: inline-block;
  margin-left: 7px;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(222, 168, 79, 0.18);
  color: #8b5a1d;
  font-size: 12px;
  font-weight: 900;
}

    .q-text {
  color: #3f2615;
  font-size: 17px;
  font-weight: 900;
  line-height: 1.45;
  display: -webkit-box;
  line-clamp: 2;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: keep-all;
}
 .q-answer {
  margin-top: 10px;
  color: #6f4e2f;
  font-size: 19px;
  font-weight: 800;
  line-height: 1.55;
  word-break: keep-all;
  white-space: pre-line;
}

    .edit-button {
      position: absolute;
      right: 8px;
      bottom: 7px;
      border: 0;
      background: transparent;
      color: #a87a45;
      font-size: 14px;
    }

    .share-card {
  min-height: 0;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  overflow: hidden;
}

    .share-title {
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -0.6px;
    }

    .share-desc {
      color: #6f5031;
      font-size: 14px;
      font-weight: 820;
      line-height: 1.42;
      word-break: keep-all;
    }

    .share-button {
      height: 48px;
      border: 1px solid rgba(102, 71, 33, 0.18);
      border-radius: 16px;
      background: linear-gradient(180deg, #e6ad45, #b06a0d);
      color: #fff9eb;
      font-family: "Noto Serif KR", serif;
      font-size: 19px;
      font-weight: 900;
      box-shadow:
        0 6px 0 rgba(105, 57, 5, 0.66),
        inset 0 1px 0 rgba(255, 255, 255, 0.34);
    }

    .share-button:disabled {
      background: linear-gradient(180deg, #cfc7bb, #aaa195);
      color: #fffaf1;
      cursor: not-allowed;
      box-shadow: none;
    }

    .share-note {
      color: #8a7259;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 1100px) {
      body {
        overflow: auto;
      }

 .shell {
  width: min(1180px, calc(100vw - 32px));
  height: calc(100vh - 20px);
  margin: 0 auto;
  display: grid;
  grid-template-rows: 48px minmax(0, 1fr) 178px;
  gap: 8px;
  overflow: hidden;
}
.feedback-left {
  display: flex;
  justify-content: center;
  align-items: center;
  padding-right: 4px;
}

.feedback-right {
  min-width: 0;
  padding-top: 4px;
}

.feedback-card .section-title {
  margin-bottom: 14px;
}
      .top,
      .main-grid,
    
      .bottom-grid {
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 14px;
  align-items: stretch;
}
      .question-list {
        height: auto;
        grid-template-columns: 1fr;
      }

      .question-card {
        height: auto;
        min-height: 108px;
      }
    }
    /* =========================================================
   질문 만들기 화면 최종 보정
   - 상단 멘트 삭제 후 전체 위로 올림
   - 루미 이미지/피드백 확대
   - 4가지 질문 유형 버튼 잘림 방지
   ========================================================= */

.title-area {
  min-height: 0;
}

.main-title,
.main-desc {
  display: none;
}

.top-actions {
  gap: 10px;
}

.date-pill,
.top-share {
  height: 40px;
  font-size: 14px;
}

.main-grid {
  gap: 12px;
}

.write-card,
.today-card {
  padding: 18px 20px;
}

.title-line {
  margin: 8px 0 10px;
}

#questionInput {
  height: 96px;
  font-size: 18px;
}

#answerInput {
  height: 112px;
  font-size: 18px;
}

.count {
  font-size: 13px;
}

.today-title {
  color: #4b2a13;
  font-family: "Noto Serif KR", serif;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.6px;
}

.today-guide {
  font-size: 16px;
  line-height: 1.35;
}

.q-meta {
  font-size: 15px;
}

.q-text {
  font-size: 19px;
  line-height: 1.45;
}

.q-answer {
  font-size: 18px;
  line-height: 1.5;
}

.share-title {
  font-size: 25px;
}

.share-desc {
  font-size: 16px;
}

.share-note {
  font-size: 13px;
}

@media (max-height: 820px) {
  .page {
    padding: 8px 16px 10px;
  }

  .shell {
    width: min(1180px, calc(100vw - 32px));
    height: calc(100vh - 18px);
    grid-template-rows: 44px minmax(0, 1fr) 166px;
    gap: 7px;
  }

  .section-title,
  .today-title {
    font-size: 24px;
  }

  .type-button {
    height: 40px;
    font-size: 14px;
  }

  #questionInput {
    height: 86px;
  }

  #answerInput {
    height: 100px;
  }

  .lumi-img {
    width: 126px;
  }

  .feedback-card {
    grid-template-columns: 138px 1fr;
    padding: 12px 18px;
  }

  .feedback-message {
    min-height: 86px;
    max-height: 106px;
    font-size: 17px;
    padding: 14px 18px;
  }
}
/* =========================================================
   질문 만들기 화면 확대 최종 조정
   - 홈 버튼 추가
   - 전반적인 글씨 크기 확대
   - 버튼 크기 확대
   - AI 루미 피드백 크기 확대
   ========================================================= */

  .shell {
    width: min(1240px, calc(100vw - 36px));
    height: calc(100vh - 22px);
    grid-template-rows: 58px minmax(0, 1fr) 210px;

  }

  .top {
    grid-template-columns: 270px minmax(0, 1fr) 430px;
    gap: 10px;
  }

  .brand {
    font-size: 28px;
  }

  .brand-icon {
    width: 48px;
    height: 48px;
    border-radius: 15px;
  }

  .brand-icon img {
    width: 36px;
    height: 36px;
  }

  .top-actions {
    gap: 10px;
  }

  .home-button,
  .date-pill,
  .top-share {
    height: 44px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 900;
  }

  .home-button {
    min-width: 74px;
    padding: 0 16px;
    border: 1px solid rgba(177, 122, 57, 0.34);
    background: linear-gradient(180deg, #fff8e8, #f1dfbd);
    color: #4f2e16;
    box-shadow:
      0 7px 14px rgba(116, 71, 20, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.72);
  }

  .date-pill {
    min-width: 172px;
    padding: 0 12px;
  }

  .top-share {
    min-width: 116px;
    padding: 0 16px;
  }

  .main-grid {
    grid-template-columns: 0.88fr 1.12fr;
    gap: 14px;
  }

  .write-card,
  .today-card {
    padding: 22px 24px;
    border-radius: 26px;
  }

  .section-title,
  .today-title {
    font-size: 31px;
    line-height: 1.1;
  }

  .title-line {
    margin: 11px 0 14px;
  }

  .small-label {
    font-size: 18px;
    margin-bottom: 8px;
  }

  .type-buttons {
    gap: 10px;
    margin-bottom: 14px;
  }

  .type-button {
    height: 50px;

              <label class="small-label" for="answerInput">내 생각 / 답</label>
              <span class="count" id="answerCount">0 / 400자</span>
            </div>
            <textarea id="answerInput" maxlength="400" placeholder="이 질문에 대한 내 생각이나 답을 자유롭게 써 보세요."></textarea>
          </div>

          <div class="write-actions">
            <button class="sub-button" type="button" onclick="resetForm()">다시 쓰기</button>
            <button class="main-button" type="button" onclick="checkQuestion()">✨ 루미에게 확인 받기</button>
          </div>
        </article>
      </section>
<section class="bottom-grid">
        <article class="card feedback-card">
          <div class="feedback-left">
            <img class="lumi-img" src="../assets/images/class-reading/class-reading-lumi-feedback.png" alt="루미">
          </div>
          <div class="feedback-right">
            <h2 class="section-title">✦ 루미의 피드백</h2>
            <div class="feedback-message" id="feedbackBox">
              질문과 내 생각을 쓴 뒤 <strong>루미에게 확인 받기</strong>를 눌러 봐.
              3개 이상 통과하면 다음 단계로 갈 수 있어.
            </div>
          </div>
        </article>

        <article class="card next-card">
          <div class="pass-count" id="passCount">통과 0 / 3개</div>
          <button class="next-button" id="nextButton" type="button" onclick="goNextStep()" disabled>다음 단계</button>
          <p class="share-note">루미에게 3개 이상 통과받아야 열려요.</p>
        </article>
      </section>
    </div>
  </main>

  <script>
    /*
      =========================================================
      1. 기본 데이터
      =========================================================
    */

    const studentId = sessionStorage.getItem("studentId") || "student-demo";

    const typeInfo = {
      direct: {
        label: "바로 찾기",
        words: ["무엇", "누구", "어디", "언제", "몇", "이름"]
      },
      infer: {
        label: "짐작하기",
        words: ["왜", "어떤마음", "무슨생각", "이유", "어째서"]
      },
      opinion: {
        label: "생각·느낌",
        words: ["나는", "나라면", "내생각", "어떻게생각", "느낌", "마음이들"]
      },
      connect: {
        label: "삶과 연결",
        words: ["나도", "내가", "경험", "비슷한", "해본적", "겪은적", "우리반", "가족", "친구"]
      }
    };

    let selectedType = "direct";
    let selectedQuestionIds = [];
    let todayQuestions = [];

    const todayInfo = getTodayInfo();
    const todayKey = "classReadingQuestions_" + studentId + "_" + todayInfo.key;

    const typeButtons = document.querySelectorAll(".type-button");
    const questionInput = document.getElementById("questionInput");
    const answerInput = document.getElementById("answerInput");
    const questionCount = document.getElementById("questionCount");
    const answerCount = document.getElementById("answerCount");
    const feedbackBox = document.getElementById("feedbackBox");
    const questionList = document.getElementById("questionList");
    const selectCount = document.getElementById("selectCount");
    const shareButton = document.getElementById("shareButton");
    const topShareButton = document.getElementById("topShareButton");
    const passCount = document.getElementById("passCount");
    const nextButton = document.getElementById("nextButton");
    const todayText = document.getElementById("todayText");

    initPage();

    /*
      =========================================================
      2. 초기 설정
      =========================================================
    */

    function initPage() {
      todayText.textContent = "오늘 날짜  " + todayInfo.display;

      loadTodayQuestions();
      updateCounts();
      renderTodayQuestions();

      typeButtons.forEach(function(button) {
        button.addEventListener("click", function() {
          typeButtons.forEach(function(btn) {
            btn.classList.remove("active");
          });

          button.classList.add("active");
          selectedType = button.dataset.type;

          setFeedback(
            "need",
            "'" + typeInfo[selectedType].label + "' 유형을 골랐어. " +
            typeInfo[selectedType].guide + " 질문과 내 생각을 써 보고 루미에게 확인 받아 봐."
          );
        });
      });

      questionInput.addEventListener("input", updateCounts);
      answerInput.addEventListener("input", updateCounts);
    }

    function getTodayInfo() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const date = String(today.getDate()).padStart(2, "0");
      const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
      const day = dayNames[today.getDay()];

      return {
        key: year + "-" + month + "-" + date,
        display: year + "." + month + "." + date + " (" + day + ")",
        shortDisplay: month + "." + date
      };
    }

    function updateCounts() {
      questionCount.textContent = questionInput.value.length + " / 200자";
      answerCount.textContent = answerInput.value.length + " / 400자";
    }

    /*
      =========================================================
      3. 루미 피드백 검사
      =========================================================
    */

    function checkQuestion() {
      const question = questionInput.value.trim();
      const answer = answerInput.value.trim();
      const result = validateQuestion(selectedType, question, answer);

      if (!result.ok) {
        setFeedback("need", result.message);
        return;
      }

      saveQuestion(question, answer);
      setFeedback(
        "good",
        result.message +
        "<br><br>좋아! 루미 확인을 통과했어. 현재 " + todayQuestions.length + "개가 통과했어. 3개 이상이면 다음 단계로 갈 수 있어."
      );

      questionInput.value = "";
      answerInput.value = "";
      updateCounts();
    }

    function validateQuestion(type, question, answer) {
      if (!question) {
        return {
          ok: false,
          message: "질문 칸이 비어 있어. 책을 읽으며 궁금했던 점을 먼저 질문으로 써 보자."
        };
      }

      if (!answer) {
        return {
          ok: false,
          message: "내 생각이나 답도 함께 써야 해. 질문에 대해 내가 생각한 답을 한 문장 이상 적어 보자."
        };
      }

      if (question.length < 8) {
        return {
          ok: false,
          message: "질문이 조금 짧아. 누가, 무엇을, 왜, 어떻게 같은 말을 떠올리며 조금 더 자세히 써 보자."
        };
      }

      if (answer.length < 8) {
        return {
          ok: false,
          message: "내 생각이나 답이 조금 짧아. 왜 그렇게 생각했는지 이유를 한 문장 더 붙이면 좋아."
        };
      }

      if (!isQuestionForm(question)) {
        return {
          ok: false,
          message: "질문 형식으로 바꿔 보자. 끝을 ‘나요?’, ‘까요?’, ‘했을까요?’처럼 물어보는 문장으로 쓰면 좋아."
        };
      }

      const normalizedQuestion = normalizeText(question);
      const normalizedAnswer = normalizeText(answer);

      if (!isTypeMatched(type, normalizedQuestion)) {
        return {
          ok: false,
          message: "'" + typeInfo[type].label + "' 유형과 조금 달라 보여. " +
            typeInfo[type].guide + " 선택한 유형에 어울리는 말을 넣어 다시 써 보자."
        };
      }

      if (!isAnswerRelated(normalizedQuestion, normalizedAnswer)) {
        return {
          ok: false,
          message: "질문과 내 생각/답의 연결이 약해 보여. 질문에서 묻는 말에 대한 답이 바로 이어지도록 다시 써 보자."
        };
      }

      return {
        ok: true,
        message: "좋아! 질문 형식으로 잘 썼고, '" + typeInfo[type].label + "' 유형과도 잘 맞아. 답도 질문과 자연스럽게 연결되어 있어."
      };
    }

    function isQuestionForm(text) {
      const trimmed = text.trim();

      if (trimmed.includes("?") || trimmed.includes("？")) {
        return true;
      }

      const normalized = normalizeText(trimmed);
      const endings = [
        "나요",
        "까요",
        "했나요",
        "했을까요",
        "있나요",
        "없나요",
        "무엇인가요",
        "어떤가요",
        "어떨까요"
      ];

      return endings.some(function(ending) {
        return normalized.endsWith(normalizeText(ending));
      });
    }

    function isTypeMatched(type, normalizedQuestion) {
      const words = typeInfo[type].words;

      if (type === "opinion") {
        return words.some(function(word) {
          return normalizedQuestion.includes(normalizeText(word));
        }) || normalizedQuestion.includes("어떤생각") || normalizedQuestion.includes("어떤느낌");
      }

      if (type === "direct") {
        const inferWords = ["왜", "이유", "마음", "생각"];
        const hasDirectWord = words.some(function(word) {
          return normalizedQuestion.includes(normalizeText(word));
        });
        const hasInferWord = inferWords.some(function(word) {
          return normalizedQuestion.includes(normalizeText(word));
        });

        return hasDirectWord && !hasInferWord;
      }

      return words.some(function(word) {
        return normalizedQuestion.includes(normalizeText(word));
      });
    }

    function isAnswerRelated(normalizedQuestion, normalizedAnswer) {
      // 실제 책 원문을 알 수 없으므로 답이 충분히 길고 질문에 대응하면 통과시킵니다.
      // 너무 짧은 답은 위 length 검사에서 이미 걸러집니다.
      if (normalizedAnswer.length >= 12) {
        return true;
      }

      return normalizedQuestion.split("").some(function(char) {
        return normalizedAnswer.includes(char);
      });
    }

    function normalizeText(text) {
      return String(text || "")
        .replace(/\s/g, "")
        .replace(/[?？!！.,，。'‘’"“”]/g, "")
        .toLowerCase();
    }

    function setFeedback(state, message) {
      feedbackBox.className = "feedback-message " + state;
      feedbackBox.innerHTML = message;
    }

    /*
      =========================================================
      4. 오늘 만든 질문 저장 / 선택
      =========================================================
    */

    function saveQuestion(question, answer) {
      const newQuestion = {
        id: Date.now(),
        dateKey: todayInfo.key,
        dateText: todayInfo.display,
        shortDateText: todayInfo.shortDisplay,
        type: selectedType,
        typeLabel: typeInfo[selectedType].label,
        text: question,
        answer: answer,
        createdAt: getCurrentTimeText()
      };

      todayQuestions.push(newQuestion);
      saveTodayQuestions();
      renderTodayQuestions();
    }

    function getCurrentTimeText() {
      const now = new Date();
      const hour = String(now.getHours()).padStart(2, "0");
      const minute = String(now.getMinutes()).padStart(2, "0");
      return hour + ":" + minute;
    }

    function loadTodayQuestions() {
      const savedData = localStorage.getItem(todayKey);

      if (!savedData) {
        todayQuestions = [];
        return;
      }

      try {
        todayQuestions = JSON.parse(savedData);
      } catch (error) {
        todayQuestions = [];
      }
    }

    function saveTodayQuestions() {
      localStorage.setItem(todayKey, JSON.stringify(todayQuestions));

      // 날짜별 질문 모음에서 다시 볼 수 있도록 전체 보관함에도 저장합니다.
      const archiveKey = "classReadingQuestionArchive_" + studentId;
      let archive = JSON.parse(localStorage.getItem(archiveKey) || "{}");
      archive[todayInfo.key] = todayQuestions;
      localStorage.setItem(archiveKey, JSON.stringify(archive));
    }

    function renderTodayQuestions() {
      const passed = todayQuestions.length;
      if (passCount) passCount.textContent = "통과 " + Math.min(passed, 3) + " / 3개";
      if (nextButton) nextButton.disabled = passed < 3;
      if (!questionList) return;
      if (selectCount) selectCount.textContent = selectedQuestionIds.length + " / 3개 선택됨";
      if (shareButton) shareButton.disabled = selectedQuestionIds.length === 0;
      if (topShareButton) topShareButton.disabled = selectedQuestionIds.length === 0;

      if (todayQuestions.length === 0) {
        questionList.innerHTML =
          '<div class="empty">' +
            '아직 만든 질문이 없어요.<br>' +
            '위에서 질문을 쓰고 루미에게 확인 받아 보세요.' +
          '</div>';
        return;
      }

      questionList.innerHTML = todayQuestions.map(function(question) {
        const selected = selectedQuestionIds.includes(question.id);
        const selectedClass = selected ? " selected" : "";

        return '' +
          '<article class="question-card' + selectedClass + '" onclick="toggleQuestionSelect(' + question.id + ')">' +
            '<div class="check"></div>' +
            '<div class="q-meta">' +
              question.shortDateText +
              '<span class="type-badge">' + escapeHtml(question.typeLabel) + '</span>' +
            '</div>' +
            '<div class="q-text">' + escapeHtml(question.text) + '</div>' +
'<div class="q-answer">내 답: ' + escapeHtml(question.answer || "") + '</div>' +
'<button class="edit-button" type="button" onclick="editQuestion(event, ' + question.id + ')">✎</button>' +
          '</article>';
      }).join("");
    }

    function toggleQuestionSelect(id) {
      const alreadySelected = selectedQuestionIds.includes(id);

      if (alreadySelected) {
        selectedQuestionIds = selectedQuestionIds.filter(function(itemId) {
          return itemId !== id;
        });
      } else {
        if (selectedQuestionIds.length >= 3) {
          setFeedback("need", "질문 나누기에 보낼 질문은 최대 3개까지 고를 수 있어. 하나를 해제한 뒤 다시 선택해 봐.");
          return;
        }

        selectedQuestionIds.push(id);
      }

      renderTodayQuestions();
    }

    function editQuestion(event, id) {
      event.stopPropagation();

      const target = todayQuestions.find(function(question) {
        return question.id === id;
      });

      if (!target) return;

      selectedType = target.type;
      questionInput.value = target.text;
      answerInput.value = target.answer;

      typeButtons.forEach(function(button) {
        button.classList.toggle("active", button.dataset.type === selectedType);
      });

      todayQuestions = todayQuestions.filter(function(question) {
        return question.id !== id;
      });

      selectedQuestionIds = selectedQuestionIds.filter(function(questionId) {
        return questionId !== id;
      });

      saveTodayQuestions();
      renderTodayQuestions();
      updateCounts();

      setFeedback("need", "선택한 질문을 다시 고칠 수 있게 불러왔어. 수정한 뒤 다시 루미에게 확인 받아 줘.");
    }

    function resetForm() {
      questionInput.value = "";
      answerInput.value = "";
      updateCounts();
      setFeedback("need", "입력칸을 비웠어. 새 질문을 써 보고 루미에게 확인 받아 봐.");
    }

    /*
      =========================================================
      5. 질문 나누기 이동
      =========================================================
    */

    function shareSelectedQuestions() {
  if (selectedQuestionIds.length === 0) {
    setFeedback("need", "공유할 질문을 먼저 선택해 줘. 오늘 만든 질문 중 최대 3개까지 고를 수 있어.");
    return;
  }

  const selectedQuestions = todayQuestions.filter(function(question) {
    return selectedQuestionIds.includes(question.id);
  });

  const studentQuestionData = {
    name: "나",
    icon: "❓",
    dateKey: todayInfo.key,
    dateText: todayInfo.display,
    questions: selectedQuestions.map(function(question) {
      return {
        text: question.text,
        answer: question.answer,
        type: question.type,
        typeLabel: question.typeLabel,
        createdAt: question.dateText + " " + question.createdAt
      };
    })
  };

  // 질문 나누기 화면에서 사용할 공유 질문을 저장합니다.
  localStorage.setItem("mySharedQuestions", JSON.stringify(studentQuestionData));

  // 질문 나누기 화면으로 이동합니다.
  location.href = "./friend-question.html";
}

function goNextStep() {
  if (todayQuestions.length < 3) {
    setFeedback("need", "아직 " + (3 - todayQuestions.length) + "개가 더 필요해. 질문과 내 생각을 쓰고 루미에게 확인 받아 봐.");
    return;
  }

  localStorage.setItem("classReadingPassedQuestions", JSON.stringify(todayQuestions));
  location.href = "./friend-question.html";
}

function goReadingMain() {
  location.href = "./class-reading.html";
}
function goHome() {
  location.href = "./class-reading.html";
}

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
  <script src="../js/fixed-stage.js"></script>
</body>
