<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문답책 - 질문 만들기</title>

  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap");

   * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  position: relative;
  font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
  color: #3f2615;
  background: #fff8e9 !important;
}

button,
textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.page {
  position: absolute;
  top: 50%;
  left: 50%;

  width: 1920px;
  height: 1080px;
  padding: 8px 20px 10px;
  overflow: hidden;

  transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
  transform-origin: center center;

  background-image:
    linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.06),
      rgba(255, 247, 224, 0.08)
    ),
    url("../assets/images/practice/during-reading-magic-space-bg.png") !important;

  background-size: cover !important;
  background-position: center center !important;
  background-repeat: no-repeat !important;
  background-color: #fff8e9 !important;
}
    .shell {
      width: 1580px;
      height: 1062px;
      margin: 0 auto;

      display: grid;
      grid-template-rows: 64px minmax(0, 1fr) 220px;
      gap: 8px;

      overflow: hidden;
    }

    /* ==================================================
       상단
    ================================================== */

    .top {
      width: 100%;
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) max-content;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;

      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.7px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.65);
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255, 224, 158, 0.78);
      border-radius: 15px;

      background: linear-gradient(180deg, #bf8740, #6d3a0d);
      box-shadow: 0 8px 16px rgba(91, 47, 10, 0.18);
    }

    .brand-icon img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .title-area,
    .main-title,
    .main-desc {
      display: none;
    }

    .top-actions {
      justify-self: end;

      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;

      width: max-content;
      margin-left: auto;
      white-space: nowrap;
    }

    .mq-book-home-button,
    .class-reading-button,
    .date-pill {
      height: 46px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 999px;
      white-space: nowrap;

      font-size: 17px;
      font-weight: 900;
    }

    .mq-book-home-button {
      padding: 0 20px;

      border: 1px solid rgba(214, 173, 99, 0.5);
      background: linear-gradient(180deg, #5c3c22, #2c1a0d);
      color: #fbf0da;

      box-shadow:
        0 8px 16px rgba(35, 20, 8, 0.32),
        inset 0 1px 0 rgba(255, 238, 205, 0.16);
    }

    .class-reading-button {
      padding: 0 20px;

      border: 1px solid rgba(171, 112, 36, 0.45);
      background: linear-gradient(180deg, #efbd59, #b87412);
      color: #fff9ec;

      box-shadow:
        0 8px 16px rgba(105, 57, 5, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .date-pill {
      min-width: 190px;
      padding: 0 16px;
      margin-right: 0;

      border: 1px solid rgba(177, 122, 57, 0.34);
      background: rgba(255, 250, 238, 0.86);
      color: #4f2e16;

      font-size: 15px;

      box-shadow:
        0 7px 14px rgba(116, 71, 20, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.58);
    }

    /* ==================================================
       공통 카드
    ================================================== */

    .card {
      min-width: 0;
      min-height: 0;

      border: 1px solid rgba(193, 133, 61, 0.34);
      border-radius: 28px;

      background:
        linear-gradient(
          180deg,
          rgba(255, 254, 249, 0.94),
          rgba(255, 247, 231, 0.92)
        );

      box-shadow:
        0 14px 28px rgba(123, 75, 25, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);

      backdrop-filter: blur(2px);
    }

    /* ==================================================
       책 속 생각 쓰기
    ================================================== */

    .main-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    .write-card {
      width: 100%;
      height: 100%;
      min-height: 0;

      padding: 20px 38px 16px;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;

      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.7px;
    }

    .title-line {
      height: 1px;
      margin: 9px 0 10px;

      background:
        linear-gradient(
          90deg,
          rgba(196, 135, 61, 0.26),
          rgba(196, 135, 61, 0.05)
        );
    }

    .small-label {
      color: #4f2d15;
      font-size: 25px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .type-box {
      flex: 0 0 auto;
    }

    .type-buttons {
      width: 100%;

      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;

      margin-bottom: 9px;
    }

    .type-button {
      height: 60px;

      border: 1px solid rgba(192, 130, 55, 0.34);
      border-radius: 18px;

      background: rgba(255, 252, 245, 0.82);
      color: #5a3820;

      font-size: 22px;
      font-weight: 900;
      white-space: nowrap;

      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .type-button.active {
      border-color: rgba(190, 125, 32, 0.82);
      background: linear-gradient(180deg, #f3c978, #c9902d);
      color: #4a2a10;

      box-shadow: 0 6px 12px rgba(176, 112, 25, 0.15);
    }

    .input-block {
      flex: 0 0 auto;
      margin-top: 5px;
    }

    /*
      답 영역이 남는 공간을 모두 차지하도록 설정
    */
    .answer-block {
      flex: 1 1 auto;
      min-height: 0;

      display: flex;
      flex-direction: column;

      margin-top: 9px;
    }

    .input-head {
      flex: 0 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 7px;
    }

    .input-head .small-label {
      margin-bottom: 0;
    }

    .count {
      color: #94714d;
      font-size: 19px;
      font-weight: 900;
    }

    textarea {
      width: 100%;
      resize: none;

      padding: 18px 21px;

      border: 1px solid rgba(196, 138, 69, 0.34);
      border-radius: 18px;

      background: rgba(255, 255, 255, 0.78);
      color: #452713;

      font-size: 24px;
      font-weight: 800;
      line-height: 1.55;

      outline: none;

      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    textarea::placeholder {
      color: #7e674f;
      font-size: 22px;
      font-weight: 800;
    }

    textarea:focus {
      border-color: rgba(203, 139, 44, 0.72);

      box-shadow:
        0 0 0 3px rgba(216, 162, 68, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    /*
      질문 입력칸도 기존보다 확대
    */
    #questionInput {
      height: 130px;
      min-height: 130px;
    }

    /*
      답 입력칸은 고정 높이가 아니라
      카드에서 남는 높이를 자동으로 채움
    */
    #answerInput {
      flex: 1 1 auto;
      height: auto;
      min-height: 180px;
    }

    .write-actions {
      flex: 0 0 auto;

      margin-top: 14px;
      padding-top: 0;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .sub-button,
    .main-button {
      height: 64px;
      border-radius: 18px;

      font-size: 22px;
      font-weight: 900;
    }

    .sub-button {
      width: 160px;

      border: 1px solid rgba(175, 119, 53, 0.34);
      background: rgba(255, 252, 245, 0.82);
      color: #654220;
    }

    .main-button {
      width: 350px;

      border: 1px solid rgba(176, 111, 25, 0.4);
      background: linear-gradient(180deg, #e4ad45, #b06d0d);
      color: #fff9ec;

      box-shadow:
        0 6px 0 rgba(105, 57, 5, 0.66),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .sub-button:hover,
    .main-button:hover,
    .type-button:hover,
    .mq-book-home-button:hover,
    .class-reading-button:hover {
      transform: translateY(-1px);
    }

    .sub-button:active,
    .main-button:active,
    .type-button:active,
    .mq-book-home-button:active,
    .class-reading-button:active {
      transform: translateY(1px);
    }

    /* ==================================================
       하단 루미 피드백
    ================================================== */

    .bottom-grid {
      min-height: 0;

      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 10px;

      align-items: stretch;
    }

    .feedback-card {
      min-height: 0;
      padding: 16px 28px;

      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 24px;
      align-items: center;

      overflow: hidden;
    }

    .feedback-left {
      width: 180px;
      min-width: 180px;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: visible;
    }

    .lumi-img {
      width: 164px;
      height: 184px;
      max-width: 100%;
      max-height: 100%;

      object-fit: contain;
      object-position: center;

      display: block;

      filter:
        drop-shadow(0 10px 13px rgba(112, 63, 15, 0.14))
        drop-shadow(0 0 12px rgba(255, 198, 94, 0.12));
    }

    .feedback-right {
      width: 100%;
      min-width: 0;
      height: 100%;

      display: flex;
      align-items: center;
    }

    .feedback-message {
      width: 100%;
      height: 166px;
      min-height: 166px;
      max-height: 166px;

      padding: 22px 28px;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      overflow-y: auto;

      border: 1px solid rgba(186, 130, 58, 0.3);
      border-radius: 20px;

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(255, 219, 129, 0.13),
          transparent 40%
        ),
        rgba(255, 255, 250, 0.76);

      color: #4f3219;
      font-size: 23px;
      font-weight: 900;
      line-height: 1.55;

      word-break: keep-all;
    }

    .feedback-message.good {
      border-color: rgba(97, 155, 72, 0.42);

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(166, 224, 132, 0.16),
          transparent 40%
        ),
        rgba(250, 255, 245, 0.78);
    }

    .feedback-message.need {
      border-color: rgba(209, 146, 48, 0.44);

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(255, 208, 115, 0.19),
          transparent 40%
        ),
        rgba(255, 250, 238, 0.78);
    }

    .next-card {
      min-height: 0;
      padding: 18px 20px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;

      overflow: hidden;
    }

    .pass-count {
      min-height: 42px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(190, 130, 55, 0.28);
      border-radius: 999px;

      background: rgba(255, 249, 235, 0.9);
      color: #8c5c1e;

      font-size: 18px;
      font-weight: 900;
    }

    .next-button {
      width: 100%;
      height: 58px;

      border: 1px solid rgba(102, 71, 33, 0.18);
      border-radius: 16px;

      background: linear-gradient(180deg, #e6ad45, #b06a0d);
      color: #fff9eb;

      font-family: "Noto Serif KR", serif;
      font-size: 21px;
      font-weight: 900;

      box-shadow:
        0 6px 0 rgba(105, 57, 5, 0.66),
        inset 0 1px 0 rgba(255, 255, 255, 0.34);
    }

    .next-button:disabled {
      background: linear-gradient(180deg, #cfc7bb, #aaa195);
      color: #fffaf1;

      cursor: not-allowed;
      box-shadow: none;
    }

    .share-note {
      color: #8a7259;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    /*
      1920×1080 고정 스테이지를 사용하므로
      화면 크기에 따라 글씨·버튼·카드 크기를 바꾸는 반응형 규칙은 사용하지 않습니다.
      아래 스크립트가 전체 화면만 같은 비율로 축소·확대합니다.
    */

  </style>
</head>

<body>
  <main class="page">

      <header class="top">

  <script>
    /* =========================================================
       1920×1080 고정 화면 비율 유지
       - 내부 글씨, 버튼, 카드 크기는 원본 그대로 유지
       - 브라우저 창 크기에 맞춰 화면 전체만 동일 비율로 축소/확대
    ========================================================= */
    function fitFixedStage() {
      const designWidth = 1920;
      const designHeight = 1080;

      const scaleX = window.innerWidth / designWidth;
      const scaleY = window.innerHeight / designHeight;
      const scale = Math.min(scaleX, scaleY);

      document.documentElement.style.setProperty(
        "--stage-scale",
        String(scale)
      );
    }

    window.addEventListener("resize", fitFixedStage);
    window.addEventListener("DOMContentLoaded", fitFixedStage);
    fitFixedStage();
  </script>

    const feedbackBox =
      document.getElementById("feedbackBox");

    const questionList =
      document.getElementById("questionList");

    const selectCount =
      document.getElementById("selectCount");

    const shareButton =
      document.getElementById("shareButton");

    const topShareButton =
      document.getElementById("topShareButton");

    const passCount =
      document.getElementById("passCount");

    const nextButton =
      document.getElementById("nextButton");

    const todayText =
      document.getElementById("todayText");

    initPage();

    /*
      =========================================================
      2. 초기 설정
      =========================================================
    */

    function initPage() {
      todayText.textContent =
        "오늘 날짜 " + todayInfo.display;

      loadTodayQuestions();
      updateCounts();
      renderTodayQuestions();

      typeButtons.forEach(function(button) {
        button.addEventListener("click", function() {
          typeButtons.forEach(function(btn) {
            btn.classList.remove("active");
          });

          button.classList.add("active");
          selectedType = button.dataset.type;

          setFeedback(
            "need",
            "'" +
              typeInfo[selectedType].label +
              "' 유형을 골랐어. " +
              typeInfo[selectedType].guide +
              " 질문과 내 생각을 써 보고 루미에게 확인 받아 봐."
          );
        });
      });

      questionInput.addEventListener(
        "input",
        updateCounts
      );

      answerInput.addEventListener(
        "input",
        updateCounts
      );
    }

    function getTodayInfo() {
      const today = new Date();

      const year = today.getFullYear();

      const month = String(
        today.getMonth() + 1
      ).padStart(2, "0");

      const date = String(
        today.getDate()
      ).padStart(2, "0");

      const dayNames = [
        "일",
        "월",
        "화",
        "수",
        "목",
        "금",
        "토"
      ];

      const day = dayNames[today.getDay()];

      return {
        key:
          year +
          "-" +
          month +
          "-" +
          date,

        display:
          year +
          "." +
          month +
          "." +
          date +
          " (" +
          day +
          ")",

        shortDisplay:
          month +
          "." +
          date
      };
    }

    function updateCounts() {
      questionCount.textContent =
        questionInput.value.length +
        " / 200자";

      answerCount.textContent =
        answerInput.value.length +
        " / 400자";
    }

    /*
      =========================================================
      3. 루미 피드백 검사
      =========================================================
    */

    function checkQuestion() {
      const question =
        questionInput.value.trim();

      const answer =
        answerInput.value.trim();

      const result =
        validateQuestion(
          selectedType,
          question,
          answer
        );

      if (!result.ok) {
        setFeedback(
          "need",
          result.message
        );

        return;
      }

      saveQuestion(
        question,
        answer
      );

      setFeedback(
        "good",
        result.message +
          "<br><br>좋아! 루미 확인을 통과했어. 현재 " +
          todayQuestions.length +
          "개가 통과했어. 3개 이상이면 다음 단계로 갈 수 있어."
      );

      questionInput.value = "";
      answerInput.value = "";

      updateCounts();
    }

    function validateQuestion(
      type,
      question,
      answer
    ) {
      if (!question) {
        return {
          ok: false,
          message:
            "질문 칸이 비어 있어. 책을 읽으며 궁금했던 점을 먼저 질문으로 써 보자."
        };
      }

      if (!answer) {
        return {
          ok: false,
          message:
            "내 생각이나 답도 함께 써야 해. 질문에 대해 내가 생각한 답을 한 문장 이상 적어 보자."
        };
      }

      if (question.length < 8) {
        return {
          ok: false,
          message:
            "질문이 조금 짧아. 누가, 무엇을, 왜, 어떻게 같은 말을 떠올리며 조금 더 자세히 써 보자."
        };
      }

      if (answer.length < 8) {
        return {
          ok: false,
          message:
            "내 생각이나 답이 조금 짧아. 왜 그렇게 생각했는지 이유를 한 문장 더 붙이면 좋아."
        };
      }

      if (!isQuestionForm(question)) {
        return {
          ok: false,
          message:
            "질문 형식으로 바꿔 보자. 끝을 ‘나요?’, ‘까요?’, ‘했을까요?’처럼 물어보는 문장으로 쓰면 좋아."
        };
      }

      const normalizedQuestion =
        normalizeText(question);

      const normalizedAnswer =
        normalizeText(answer);

      if (
        !isTypeMatched(
          type,
          normalizedQuestion
        )
      ) {
        return {
          ok: false,
          message:
            "'" +
            typeInfo[type].label +
            "' 유형과 조금 달라 보여. " +
            typeInfo[type].guide +
            " 선택한 유형에 어울리는 말을 넣어 다시 써 보자."
        };
      }

      if (
        !isAnswerRelated(
          normalizedQuestion,
          normalizedAnswer
        )
      ) {
        return {
          ok: false,
          message:
            "질문과 내 생각/답의 연결이 약해 보여. 질문에서 묻는 말에 대한 답이 바로 이어지도록 다시 써 보자."
        };
      }

      return {
        ok: true,
        message:
          "좋아! 질문 형식으로 잘 썼고, '" +
          typeInfo[type].label +
          "' 유형과도 잘 맞아. 답도 질문과 자연스럽게 연결되어 있어."
      };
    }

    function isQuestionForm(text) {
      const trimmed = text.trim();

      if (
        trimmed.includes("?") ||
        trimmed.includes("？")
      ) {
        return true;
      }

      const normalized =
        normalizeText(trimmed);

      const endings = [
        "나요",
        "까요",
        "했나요",
        "했을까요",
        "있나요",
        "없나요",
        "무엇인가요",
        "어떤가요",
        "어떨까요"
      ];

      return endings.some(
        function(ending) {
          return normalized.endsWith(
            normalizeText(ending)
          );
        }
      );
    }

    function isTypeMatched(
      type,
      normalizedQuestion
    ) {
      const words =
        typeInfo[type].words;

      if (type === "opinion") {
        return (
          words.some(function(word) {
            return normalizedQuestion.includes(
              normalizeText(word)
            );
          }) ||
          normalizedQuestion.includes(
            "어떤생각"
          ) ||
          normalizedQuestion.includes(
            "어떤느낌"
          )
        );
      }

      if (type === "direct") {
        const inferWords = [
          "왜",
          "이유",
          "마음",
          "생각"
        ];

        const hasDirectWord =
          words.some(function(word) {
            return normalizedQuestion.includes(
              normalizeText(word)
            );
          });

        const hasInferWord =
          inferWords.some(function(word) {
            return normalizedQuestion.includes(
              normalizeText(word)
            );
          });

        return (
          hasDirectWord &&
          !hasInferWord
        );
      }

      return words.some(
        function(word) {
          return normalizedQuestion.includes(
            normalizeText(word)
          );
        }
      );
    }

    function isAnswerRelated(
      normalizedQuestion,
      normalizedAnswer
    ) {
      if (
        normalizedAnswer.length >= 12
      ) {
        return true;
      }

      return normalizedQuestion
        .split("")
        .some(function(char) {
          return normalizedAnswer.includes(
            char
          );
        });
    }

    function normalizeText(text) {
      return String(text || "")
        .replace(/\s/g, "")
        .replace(
          /[?？!！.,，。'‘’"“”]/g,
          ""
        )
        .toLowerCase();
    }

    function setFeedback(
      state,
      message
    ) {
      feedbackBox.className =
        "feedback-message " + state;

      feedbackBox.innerHTML =
        message;
    }

    /*
      =========================================================
      4. 오늘 만든 질문 저장
      =========================================================
    */

    function saveQuestion(
      question,
      answer
    ) {
      const newQuestion = {
        id: Date.now(),
        dateKey: todayInfo.key,
        dateText: todayInfo.display,
        shortDateText:
          todayInfo.shortDisplay,
        type: selectedType,
        typeLabel:
          typeInfo[selectedType].label,
        text: question,
        answer: answer,
        createdAt:
          getCurrentTimeText()
      };

      todayQuestions.push(
        newQuestion
      );

      saveTodayQuestions();
      renderTodayQuestions();
    }

    function getCurrentTimeText() {
      const now = new Date();

      const hour = String(
        now.getHours()
      ).padStart(2, "0");

      const minute = String(
        now.getMinutes()
      ).padStart(2, "0");

      return hour + ":" + minute;
    }

    function loadTodayQuestions() {
      const savedData =
        localStorage.getItem(
          todayKey
        );

      if (!savedData) {
        todayQuestions = [];
        return;
      }

      try {
        todayQuestions =
          JSON.parse(savedData);
      } catch (error) {
        todayQuestions = [];
      }
    }

    function saveTodayQuestions() {
      localStorage.setItem(
        todayKey,
        JSON.stringify(
          todayQuestions
        )
      );

      const archiveKey =
        "classReadingQuestionArchive_" +
        studentId;

      let archive =
        JSON.parse(
          localStorage.getItem(
            archiveKey
          ) || "{}"
        );

      archive[todayInfo.key] =
        todayQuestions;

      localStorage.setItem(
        archiveKey,
        JSON.stringify(archive)
      );
    }

    function renderTodayQuestions() {
      const passed =
        todayQuestions.length;

      if (passCount) {
        passCount.textContent =
          "통과 " +
          Math.min(passed, 3) +
          " / 3개";
      }

      if (nextButton) {
        nextButton.disabled =
          passed < 3;
      }

      if (!questionList) {
        return;
      }

      if (selectCount) {
        selectCount.textContent =
          selectedQuestionIds.length +
          " / 3개 선택됨";
      }

      if (shareButton) {
        shareButton.disabled =
          selectedQuestionIds.length === 0;
      }

      if (topShareButton) {
        topShareButton.disabled =
          selectedQuestionIds.length === 0;
      }

      if (
        todayQuestions.length === 0
      ) {
        questionList.innerHTML =
          '<div class="empty">' +
          "아직 만든 질문이 없어요.<br>" +
          "위에서 질문을 쓰고 루미에게 확인 받아 보세요." +
          "</div>";

        return;
      }

      questionList.innerHTML =
        todayQuestions
          .map(function(question) {
            const selected =
              selectedQuestionIds.includes(
                question.id
              );

            const selectedClass =
              selected
                ? " selected"
                : "";

            return (
              '<article class="question-card' +
              selectedClass +
              '" onclick="toggleQuestionSelect(' +
              question.id +
              ')">' +
              '<div class="check"></div>' +
              '<div class="q-meta">' +
              question.shortDateText +
              '<span class="type-badge">' +
              escapeHtml(
                question.typeLabel
              ) +
              "</span>" +
              "</div>" +
              '<div class="q-text">' +
              escapeHtml(
                question.text
              ) +
              "</div>" +
              '<div class="q-answer">내 답: ' +
              escapeHtml(
                question.answer || ""
              ) +
              "</div>" +
              '<button class="edit-button" type="button" onclick="editQuestion(event, ' +
              question.id +
              ')">✎</button>' +
              "</article>"
            );
          })
          .join("");
    }

    function toggleQuestionSelect(id) {
      const alreadySelected =
        selectedQuestionIds.includes(id);

      if (alreadySelected) {
        selectedQuestionIds =
          selectedQuestionIds.filter(
            function(itemId) {
              return itemId !== id;
            }
          );
      } else {
        if (
          selectedQuestionIds.length >= 3
        ) {
          setFeedback(
            "need",
            "질문 나누기에 보낼 질문은 최대 3개까지 고를 수 있어. 하나를 해제한 뒤 다시 선택해 봐."
          );

          return;
        }

        selectedQuestionIds.push(id);
      }

      renderTodayQuestions();
    }

    function editQuestion(
      event,
      id
    ) {
      event.stopPropagation();

      const target =
        todayQuestions.find(
          function(question) {
            return question.id === id;
          }
        );

      if (!target) {
        return;
      }

      selectedType =
        target.type;

      questionInput.value =
        target.text;

      answerInput.value =
        target.answer;

      typeButtons.forEach(
        function(button) {
          button.classList.toggle(
            "active",
            button.dataset.type ===
              selectedType
          );
        }
      );

      todayQuestions =
        todayQuestions.filter(
          function(question) {
            return question.id !== id;
          }
        );

      selectedQuestionIds =
        selectedQuestionIds.filter(
          function(questionId) {
            return questionId !== id;
          }
        );

      saveTodayQuestions();
      renderTodayQuestions();
      updateCounts();

      setFeedback(
        "need",
        "선택한 질문을 다시 고칠 수 있게 불러왔어. 수정한 뒤 다시 루미에게 확인 받아 줘."
      );
    }

    function resetForm() {
      questionInput.value = "";
      answerInput.value = "";

      updateCounts();

      setFeedback(
        "need",
        "입력칸을 비웠어. 새 질문을 써 보고 루미에게 확인 받아 봐."
      );
    }

    /*
      =========================================================
      5. 질문 나누기 이동
      =========================================================
    */

    function shareSelectedQuestions() {
      if (
        selectedQuestionIds.length === 0
      ) {
        setFeedback(
          "need",
          "공유할 질문을 먼저 선택해 줘. 오늘 만든 질문 중 최대 3개까지 고를 수 있어."
        );

        return;
      }

      const selectedQuestions =
        todayQuestions.filter(
          function(question) {
            return selectedQuestionIds.includes(
              question.id
            );
          }
        );

      const studentQuestionData = {
        name: "나",
        icon: "❓",
        dateKey: todayInfo.key,
        dateText: todayInfo.display,

        questions:
          selectedQuestions.map(
            function(question) {
              return {
                text: question.text,
                answer:
                  question.answer,
                type:
                  question.type,
                typeLabel:
                  question.typeLabel,
                createdAt:
                  question.dateText +
                  " " +
                  question.createdAt
              };
            }
          )
      };

      localStorage.setItem(
        "mySharedQuestions",
        JSON.stringify(
          studentQuestionData
        )
      );

      location.href =
        "./friend-question.html";
    }

    function goNextStep() {
      if (
        todayQuestions.length < 3
      ) {
        setFeedback(
          "need",
          "아직 " +
            (3 - todayQuestions.length) +
            "개가 더 필요해. 질문과 내 생각을 쓰고 루미에게 확인 받아 봐."
        );

        return;
      }

      localStorage.setItem(
        "classReadingPassedQuestions",
        JSON.stringify(
          todayQuestions
        )
      );

      location.href =
        "./friend-question.html";
    }

    function goReadingMain() {
      location.href =
        "./class-reading.html";
    }

    function goHome() {
      location.href =
        "./individual-reading.html";
    }

    function goClassReading() {
      location.href =
        "./class-reading.html";
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll(
          "'",
          "&#039;"
        );
    }
  </script>
