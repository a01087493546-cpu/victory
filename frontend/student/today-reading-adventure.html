<body>
  <main class="tra-page">
    <div class="tra-shell">
      <header class="tra-top-bar">
        <div class="tra-logo">
          <img src="../assets/images/logo-book.png" alt="문답책 로고">
          <span>문답책</span>
        </div>

        <div class="tra-top-actions">
          <!-- 개별읽기 활동 중에도 현재 능력치를 확인하는 버튼입니다. -->
<button type="button" class="tra-top-button" onclick="openIndividualPowerModal()">✨ 나의 힘</button>
          <button type="button" class="mq-book-home-button" onclick="goIndividualReading()">📚 책읽기 홈</button>
         
        </div>
      </header>

      <section class="tra-main">
        <article class="tra-content-card">
          <h1 class="tra-adventure-title">오늘의 독서 모험을 떠나볼까요?</h1>

          <div class="tra-stage-grid" id="stageGrid"></div>

          <div class="tra-community-shortcut-grid" aria-label="친구 활동 바로가기">
         <div class="tra-community-guide">
  <strong>✨ 친구들의 생각이 궁금하다면?</strong>
  <span>바로가기 버튼을 눌러보세요!</span>
</div>
            <button type="button" class="tra-community-shortcut" onclick="openCommunityShortcut('during')"><span aria-hidden="true">💬</span><span>책수다방</span></button>
            <button type="button" class="tra-community-shortcut" onclick="openCommunityShortcut('after')"><span aria-hidden="true">📖</span><span>간추리기 공유</span></button>
          </div>

          <!-- 아래 안내 문구 바는 화면을 깔끔하게 보이도록 제거했습니다. -->
<div class="tra-bottom-note" id="bottomNote" style="display: none;"></div>
        </article>

        <aside class="tra-lumi-card">
          <div class="tra-lumi-bubble" id="lumiBubble">
            이번 모험은 읽기 전부터 시작이야.<br>
            어떤 책을 읽을지 먼저 알려줘!
          </div>

          <div class="tra-lumi-wrap">
            <div class="tra-lumi-glow"></div>
            <img
              id="lumiImage"
              src="../assets/images/individual-reading/today-reading-lumi-guide.png"
              alt="용사 루미"
              class="tra-lumi"
            >
          </div>
        </aside>
      </section>
    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script src="../js/demo-storage.js"></script>

  <script>
    // 개발 중 화면 확인을 위해 로그인 체크를 잠시 꺼둡니다.
    // checkLogin();

    const studentId = sessionStorage.getItem("studentId") || "student-demo";

    const STORAGE_KEYS = {
      stage: "individualAdventureStage_" + studentId,
      bookTitle: "individualCurrentBookTitle_" + studentId,
      beforeDone: "individualBeforeDone_" + studentId,
      duringDone: "individualDuringDone_" + studentId,
      afterDone: "individualAfterDone_" + studentId
    };

    const stages = [
      {
        key: "before",
        number: "01",
        title: "읽기 전",
        iconImage: "../assets/images/individual-reading/today-reading-before-icon.png",
        desc: "",
        activeLabel: "시작하기",
        doneLabel: "완료",
        lockedLabel: "먼저 시작하세요",
        url: "./individual-before-reading.html"
      },
      {
        key: "during",
        number: "02",
        title: "읽기 중",
        iconImage: "../assets/images/individual-reading/today-reading-during-icon.png",
        desc: "",
        activeLabel: "이어서 하기",
        doneLabel: "완료",
        lockedLabel: "읽기 전 완료 필요",
        url: "./individual-during-reading.html",
        shortcut: {
          icon: "💬",
          label: "책수다방",
          url: "./individual-during-reading.html?view=bookChat"
        }
      },
      {
        key: "after",
        number: "03",
        title: "읽기 후",
        iconImage: "../assets/images/individual-reading/today-reading-after-icon.png",
        desc: "",
        activeLabel: "정리하기",
        doneLabel: "완료",
        lockedLabel: "읽기 중 완료 필요",
        url: "./individual-after-reading.html",
        shortcut: {
          icon: "📖",
          label: "간추리기 공유",
          url: "./individual-after-reading.html?view=summaryShare"
        }
      }
    ];

    function getApiBaseUrl() {
      if (window.location.hostname === "127.0.0.1") {
        return "http://127.0.0.1:8080";
      }
      if (window.location.hostname === "localhost") {
        return "http://localhost:8080";
      }
      return "https://victory-production-f94d.up.railway.app";
    }

    const INDIVIDUAL_READING_API_BASE_URL = getApiBaseUrl();

    document.addEventListener("DOMContentLoaded", async () => {
      prepareDefaultState();
      await syncCurrentBookFromServer();
      renderAdventure();
    });

    function prepareDefaultState() {
      if (!sessionStorage.getItem(STORAGE_KEYS.stage)) {
        sessionStorage.setItem(STORAGE_KEYS.stage, "before");
      }
    }

    /*
      진행 중인 책은 DB(reading_records, finished_at IS NULL)가 원본이다.
      진행 중인 책이 없으면(완독했거나 아직 시작 전) 이전 책의 완료
      플래그가 새 책에 그대로 넘어가지 않도록 초기화한다. 있으면 제목을
      DB 값으로 채워 다른 기기/새 세션에서도 이어 읽기가 보이게 한다.
      /*
  진행 중인 책과 단계 완료 상태는 DB(reading_records)가 원본이다.
  서버에서 받은 책 제목, 현재 단계, 읽기 전·중·후 완료 상태를
  sessionStorage에 화면용 캐시로 반영한다.
  카드 활성화는 서버에서 복원한 완료 상태를 기준으로 처리한다.
    */
    async function syncCurrentBookFromServer() {
      if (isDemoAccount()) {
        return;
      }

      const token = sessionStorage.getItem("token");

      if (!token) {
        return;
      }

      try {
        const response = await fetch(
          INDIVIDUAL_READING_API_BASE_URL + "/api/students/me/individual-reading/current",
          {
            headers: {
              Authorization: "Bearer " + token
            }
          }
        );

        if (response.status === 204) {
          sessionStorage.removeItem(STORAGE_KEYS.bookTitle);
          sessionStorage.setItem(STORAGE_KEYS.stage, "before");
          sessionStorage.setItem(STORAGE_KEYS.beforeDone, "false");
          sessionStorage.setItem(STORAGE_KEYS.duringDone, "false");
          sessionStorage.setItem(STORAGE_KEYS.afterDone, "false");
          return;
        }

        if (!response.ok) {
          throw new Error("진행 중인 책 조회 실패: " + response.status);
        }

        const record = await response.json();

sessionStorage.setItem(STORAGE_KEYS.bookTitle, record.title || "");

// DB의 ReadingRecord 완료 상태를 화면 상태에 반영
sessionStorage.setItem(
  STORAGE_KEYS.beforeDone,
  record.beforeDone === true ? "true" : "false"
);

sessionStorage.setItem(
  STORAGE_KEYS.duringDone,
  record.duringDone === true ? "true" : "false"
);

sessionStorage.setItem(
  STORAGE_KEYS.afterDone,
  record.afterDone === true ? "true" : "false"
);

// 현재 단계도 DB 값을 기준으로 복원
const serverStage = record.currentStage;

if (
  serverStage === "before" ||
  serverStage === "during" ||
  serverStage === "after"
) {
  sessionStorage.setItem(STORAGE_KEYS.stage, serverStage);
} else if (serverStage === "completed") {
  sessionStorage.setItem(STORAGE_KEYS.stage, "after");
}
      } catch (error) {
        console.error("진행 중인 개별읽기 책을 불러오지 못했습니다.", error);
      }
    }

    function getCurrentStage() {
      if (isDemoAccount()) {
        return loadDemoState("individualAdventureProgress", {}).stage || "before";
      }
      return sessionStorage.getItem(STORAGE_KEYS.stage) || "before";
    }

    function getCurrentBookTitle() {
      return sessionStorage.getItem(STORAGE_KEYS.bookTitle) || "";
    }

    function isStageDone(stageKey) {
      if (isDemoAccount()) {
        const progress = loadDemoState("individualAdventureProgress", {});
        return progress[stageKey + "Done"] === true;
      }
      if (stageKey === "before") return sessionStorage.getItem(STORAGE_KEYS.beforeDone) === "true";
      if (stageKey === "during") return sessionStorage.getItem(STORAGE_KEYS.duringDone) === "true";
      if (stageKey === "after") return sessionStorage.getItem(STORAGE_KEYS.afterDone) === "true";
      return false;
    }

    function isStageUnlocked(stageKey) {
      /*
        심사계정은 개별읽기 세 단계를 순서와 관계없이 바로 체험한다.
        완료 여부와 보상 기록은 각 단계의 기존 browser-local 완료 함수가
        따로 관리하므로, 여기서는 카드 잠금만 해제한다.
      */
      if (isDemoAccount()) return true;

      // 그 단계 자체를 이미 완료했다면, 다른 조건과 상관없이 항상 다시 볼 수 있어야 합니다.
      if (isStageDone(stageKey)) return true;

      if (stageKey === "before") return true;
      if (stageKey === "during") return isStageDone("before");
      if (stageKey === "after") return isStageDone("during");

      return false;
    }

    function renderAdventure() {
      renderStageCards();
      renderLumiGuide();
    }

    function renderBookStatus() {
      const bookTitle = getCurrentBookTitle();
      const currentBookTitle = document.getElementById("currentBookTitle");
      if (currentBookTitle) {
        currentBookTitle.textContent = bookTitle || "";
      }
    }

    function renderStageCards() {
      const stageGrid = document.getElementById("stageGrid");
      const currentStage = getCurrentStage();

      stageGrid.innerHTML = "";

      stages.forEach((stage) => {
        const done = isStageDone(stage.key);
        const unlocked = isStageUnlocked(stage.key);
        const active = currentStage === stage.key && !done;

        const button = document.createElement("article");
        button.className = "tra-stage-button";
        button.setAttribute("role", "button");
        button.tabIndex = 0;
        button.classList.toggle("active", active);
        button.classList.toggle("done", done);
        button.classList.toggle("locked", !unlocked);

        const stateLabel = done ? stage.doneLabel : active ? stage.activeLabel : unlocked ? stage.activeLabel : stage.lockedLabel;

        button.innerHTML = `
          <div class="tra-stage-number">${stage.number}</div>
          <div class="tra-stage-icon">
            <img src="${stage.iconImage}" alt="${stage.title} 이미지">
          </div>
          <div class="tra-stage-text">
            <h2>${stage.title}</h2>
            ${stage.desc ? `<p>${stage.desc}</p>` : ""}
          </div>
          <div class="tra-stage-state">${stateLabel}</div>
        `;

        const openStage = () => {
          if (!unlocked) {
            alert("앞 단계 활동을 먼저 완료하면 열려요!");
            return;
          }

          location.href = stage.url;
        };

        button.addEventListener("click", openStage);
        button.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openStage();
          }
        });

        stageGrid.appendChild(button);
      });
    }

    function openCommunityShortcut(stageKey) {
      const stage = stages.find((item) => item.key === stageKey);

      if (stage && stage.shortcut) {
        location.href = stage.shortcut.url;
      }
    }

    function renderLumiGuide() {
      const currentStage = getCurrentStage();
      const bookTitle = getCurrentBookTitle();
      const lumiBubble = document.getElementById("lumiBubble");
      const lumiImage = document.getElementById("lumiImage");
      const bottomNote = document.getElementById("bottomNote");

      if (currentStage === "before") {
        lumiImage.src = "../assets/images/individual-reading/today-reading-lumi-point.png";
        lumiBubble.innerHTML = "이번 모험은 읽기 전부터 시작이야.<br>어떤 책을 읽을지 먼저 알려줘!";
        
        return;
      }

      if (currentStage === "during") {
        lumiImage.src = "../assets/images/individual-reading/today-reading-lumi-reading.png";
        lumiBubble.innerHTML = `${bookTitle ? "「" + bookTitle + "」" : "책"}을 읽으며<br>떠오르는 질문을 붙잡아 보자!`;
        
        return;
      }

      if (currentStage === "after") {
        lumiImage.src = "../assets/images/individual-reading/today-reading-lumi-guide.png";
        lumiBubble.innerHTML = "완독까지 거의 다 왔어!<br>읽은 내용을 정리하면 모험이 마무리돼.";
        
      }
    }

    function goIndividualReading() {
      location.href = "./individual-reading.html";
    }
  </script>
  <!-- 개별읽기 공통: 나의 힘 팝업 기능 -->
<script src="../js/individual-power.js?v=power-common-5"></script>
  <script src="../js/fixed-stage.js"></script>
</body>
