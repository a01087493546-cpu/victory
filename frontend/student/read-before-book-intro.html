<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>문답책 - 읽기 전 책 소개</title>

  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #3f2a17;
      background:
        linear-gradient(rgba(255, 248, 235, 0.5), rgba(255, 241, 215, 0.68)),
        url("../assets/images/read-before/intro/read-before-intro-bg.png") center / cover no-repeat;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .page {
      width: 100vw;
      height: 100vh;
      padding: 26px 54px;
      background:
        linear-gradient(rgba(255, 248, 235, 0.5), rgba(255, 241, 215, 0.68)),
        url("../assets/images/read-before/intro/read-before-intro-bg.png") center / cover no-repeat;
      overflow: hidden;
    }

    .page-inner {
      width: 100%;
      max-width: 1720px;
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: 58px 124px 1fr;
      gap: 22px;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .nav-button,
    .question-count {
      height: 48px;
      padding: 0 26px;
      border: 1px solid rgba(167, 119, 58, 0.34);
      border-radius: 999px;
      background: rgba(255, 250, 240, 0.94);
      color: #4b321a;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 10px 20px rgba(100, 66, 27, 0.12);
      backdrop-filter: blur(5px);
    }

    .book-strip {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 520px;
      align-items: center;
      gap: 22px;
      padding: 18px 28px;
      border: 1px solid rgba(189, 145, 82, 0.34);
      border-radius: 26px;
      background: rgba(255, 250, 241, 0.9);
      box-shadow:
        0 14px 30px rgba(104, 70, 31, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(5px);
    }

    .book-thumb {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: linear-gradient(180deg, #f5dfac, #bd8434);
      display: grid;
      place-items: center;
      color: #4b3014;
      font-size: 34px;
      font-weight: 900;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(110, 73, 27, 0.14);
    }

    .book-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-label {
      margin-bottom: 7px;
      color: #8c5c21;
      font-size: 17px;
      font-weight: 900;
    }

    .book-title {
      font-family: "Noto Serif KR", serif;
      color: #302116;
      font-size: 36px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.05em;
    }

    .book-author {
      margin-top: 8px;
      color: #6d4a28;
      font-size: 19px;
      font-weight: 800;
    }

    .step-progress {
      display: grid;
      grid-template-columns: 1fr 48px 1fr 48px 1fr 48px 1fr;
      align-items: center;
    }

    .step-item {
      display: grid;
      place-items: center;
      gap: 8px;
      color: #5a3a1d;
      font-size: 15px;
      font-weight: 900;
    }

    .step-circle {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(172, 124, 61, 0.34);
      border-radius: 50%;
      background: rgba(255, 251, 241, 0.94);
      color: #4e3218;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 8px 16px rgba(94, 62, 24, 0.08);
    }

    .step-line {
      height: 2px;
      margin-bottom: 26px;
      background: rgba(179, 132, 70, 0.22);
    }

    .intro-card {
      position: relative;
      display: grid;
      grid-template-columns: 0.88fr 1.12fr;
      align-items: center;
      gap: 62px;
      min-height: 0;
      padding: 46px 68px;
      border: 2px solid rgba(191, 143, 79, 0.38);
      border-radius: 34px;
      background:
        radial-gradient(circle at 48% 0%, rgba(255, 229, 165, 0.32), transparent 34%),
        rgba(255, 251, 243, 0.93);
      box-shadow:
        0 22px 46px rgba(103, 70, 30, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.82);
      overflow: hidden;
    }

    .intro-card::before,
    .intro-card::after {
      content: "✦";
      position: absolute;
      color: rgba(197, 151, 79, 0.38);
      font-size: 34px;
      font-weight: 900;
    }

    .intro-card::before {
      left: 38px;
      top: 36px;
    }

    .intro-card::after {
      right: 42px;
      bottom: 34px;
    }

    .cover-slot {
      height: 520px;
      border: 3px dashed rgba(185, 143, 88, 0.42);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 235, 187, 0.52), transparent 38%),
        rgba(255, 249, 238, 0.78);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.82),
        0 12px 24px rgba(108, 74, 32, 0.08);
    }

    .cover-icon {
      width: 116px;
      height: 96px;
      margin-bottom: 28px;
      border-radius: 22px;
      background: rgba(190, 151, 103, 0.28);
      display: grid;
      place-items: center;
      color: rgba(116, 78, 38, 0.72);
      font-size: 54px;
    }

    .cover-slot strong {
      margin-bottom: 14px;
      font-family: "Noto Serif KR", serif;
      color: #6a4422;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .cover-slot span {
      color: #856345;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.4;
    }

    .intro-content {
      text-align: center;
      padding-right: 24px;
    }

    .intro-title {
      margin-bottom: 28px;
      font-family: "Noto Serif KR", serif;
      color: #342215;
      font-size: 76px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.075em;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.55);
    }

    .intro-subtitle {
      margin-bottom: 34px;
      color: #7a4e20;
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .intro-book-box {
      width: 650px;
      max-width: 100%;
      min-height: 118px;
      margin: 0 auto 40px;
      display: grid;
      grid-template-columns: 82px 1fr;
      align-items: center;
      gap: 22px;
      padding: 24px 32px;
      border: 1px solid rgba(181, 135, 77, 0.4);
      border-radius: 24px;
      background: rgba(255, 250, 242, 0.86);
      box-shadow: 0 10px 20px rgba(103, 70, 30, 0.08);
      text-align: left;
    }

    .intro-book-icon {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle, #f6d88c 0%, #b8792b 78%);
      color: #fff8df;
      font-size: 34px;
      box-shadow: 0 8px 18px rgba(141, 92, 33, 0.18);
    }

    .intro-book-title {
      margin-bottom: 8px;
      font-family: "Noto Serif KR", serif;
      color: #3a2516;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .intro-book-author {
      color: #705033;
      font-size: 20px;
      font-weight: 800;
    }

    .start-button {
      width: 520px;
      max-width: 100%;
      height: 82px;
      border: 2px solid rgba(138, 86, 25, 0.38);
      border-radius: 26px;
      background: linear-gradient(180deg, #e1ad43 0%, #b77618 100%);
      color: #fff8df;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.04em;
      box-shadow:
        0 12px 24px rgba(136, 83, 20, 0.24),
        inset 0 2px 0 rgba(255, 255, 255, 0.34);
    }

    .start-button span {
      display: inline-grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin-left: 22px;
      border-radius: 50%;
      background: rgba(105, 62, 15, 0.3);
      font-size: 34px;
      vertical-align: middle;
    }
             /* 책 소개 화면: 제목 + 표지 중심 구성 */
    .page-inner {
      grid-template-rows: 58px 1fr;
    }

    .intro-card {
      grid-row: 2 / 3;
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      align-items: center;
      gap: 54px;
      padding: 54px 82px;
    }

    .book-main-panel {
      width: 100%;
      height: 100%;
      display: contents;
    }

    .book-main-title {
      align-self: center;
      justify-self: end;
      width: 100%;
      max-width: 520px;
      padding: 46px 42px;
      border-radius: 30px;
      background: rgba(255, 250, 242, 0.86);
      border: 1px solid rgba(181, 135, 77, 0.34);
      box-shadow: 0 14px 28px rgba(103, 70, 30, 0.1);
      text-align: center;
    }

    .book-main-name {
      font-family: "Noto Serif KR", serif;
      color: #332116;
      font-size: 58px;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.07em;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.55);
    }

    .book-main-author {
      margin-top: 18px;
      color: #6d4a28;
      font-size: 22px;
      font-weight: 850;
    }

    .book-preview-area {
      align-self: center;
      justify-self: start;
      width: 100%;
      max-width: 560px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cover-slot {
      width: 420px;
      height: 520px;
    }

    .cover-slot.has-cover {
      border-style: solid;
      background: rgba(255, 250, 241, 0.9);
      padding: 18px;
    }

    .cover-slot.has-cover img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
      filter: drop-shadow(0 12px 18px rgba(86, 55, 22, 0.16));
    }

    .start-button {
      grid-column: 1 / 3;
      justify-self: center;
      margin-top: -8px;
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="page-inner">

      <header class="top-nav">
        <div class="nav-left">
          <button class="nav-button" type="button" onclick="location.href='home.html'">⌂ 홈으로</button>
          <button class="nav-button" type="button" onclick="location.href='practice.html'">▣ 연습하기로</button>
        </div>

        <button class="question-count" type="button">
          내가 만든 질문 (0/4)
        </button>
      </header>

     

            <section class="intro-card">
       

        <div class="book-main-panel">
          <div class="book-main-title">
            <h1 class="book-main-name" id="introBookTitle">「신통방통 홈 쇼핑」</h1>
            <p class="book-main-author" id="introBookAuthor">지은이: 예시 작가</p>
          </div>

          <div class="book-preview-area">
            <div class="cover-slot" id="bookCoverSlot">
              <div class="cover-icon">▧</div>
              <strong>책 표지 넣는 곳</strong>
              <span>책 표지 이미지를<br />업로드해주세요.</span>
            </div>

           
          </div>

          <button class="start-button" type="button" onclick="location.href='before-reading.html'">
            책 살펴보기 시작 <span>›</span>
          </button>
        </div>
      </section>

    </div>
  </main>

  <script>
  const defaultBook = {
    title: "신통방통 홈 쇼핑",
    author: "예시 작가",
    coverImage: ""
  };

  function getSelectedBook() {
    const savedBook = sessionStorage.getItem("selectedBook");

    if (savedBook) {
      try {
        return JSON.parse(savedBook);
      } catch (error) {
        return defaultBook;
      }
    }

    return defaultBook;
  }

  function initBookIntroPage() {
    const book = getSelectedBook();

    document.getElementById("introBookTitle").textContent = "「" + book.title + "」";
    document.getElementById("introBookAuthor").textContent = "지은이: " + book.author;

    const bookCoverSlot = document.getElementById("bookCoverSlot");

    if (book.coverImage) {
      bookCoverSlot.classList.add("has-cover");
      bookCoverSlot.innerHTML =
        '<img src="' + book.coverImage + '" alt="책 표지">';
    }
  }

  initBookIntroPage();
</script>
  <script src="../js/fixed-stage.js"></script>
</body>
</html>
