    * {

      margin: 0;
      padding: 0;
    }

    html,
    body {

      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #3f2a17;

        linear-gradient(rgba(255, 248, 235, 0.45), rgba(255, 241, 215, 0.68)),

    }

    button {

      cursor: pointer;
    }

    .page {
      width: 100vw;
      height: 100vh;

      overflow: hidden;
    }

    .page-inner {
      width: 100%;

      height: 100%;

      display: grid;
      grid-template-rows: 40px minmax(0, 1fr);
      gap: 12px;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }

    .nav-left {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nav-button,
.question-count {

  padding: 0 28px;
  border: 1px solid rgba(167, 119, 58, 0.32);
  border-radius: 999px;
  background: rgba(255, 250, 240, 0.94);
  color: #4b321a;
  font-size: 16px;
  font-weight: 900;
  box-shadow: 0 8px 18px rgba(100, 66, 27, 0.11);
  backdrop-filter: blur(5px);
}

    .intro-card {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 34px 54px 36px;
      border: 2px solid rgba(191, 143, 79, 0.34);
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 8%, rgba(255, 229, 165, 0.34), transparent 34%),
        rgba(255, 251, 243, 0.94);
      box-shadow:
        0 20px 42px rgba(103, 70, 30, 0.17),
        inset 0 1px 0 rgba(255, 255, 255, 0.82);
      overflow: hidden;
    }

    .intro-card::before,
    .intro-card::after {
      content: "✦";
      position: absolute;
      color: rgba(197, 151, 79, 0.36);
      font-size: 28px;
      font-weight: 900;
      pointer-events: none;
    }

    .intro-card::before {
      left: 28px;
      top: 26px;
    }

    .intro-card::after {
      right: 30px;
      bottom: 24px;
    }

    .book-layout {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(520px, 1.25fr) minmax(300px, 0.75fr);
      gap: 46px;
      align-items: stretch;
    }

    .book-info-card {
      width: 100%;
      min-height: 96px;
      padding: 17px 28px 15px;
      border-radius: 22px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 225, 150, 0.25), transparent 44%),
        rgba(255, 250, 242, 0.96);
      border: 1px solid rgba(181, 135, 77, 0.34);
      box-shadow:
        0 12px 24px rgba(103, 70, 30, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.76);
      text-align: left;
      overflow: hidden;
    }

    .book-info-question {
      margin-bottom: 4px;
      color: #7c4e1f;
      font-size: clamp(16px, 1.45vw, 23px);
      font-weight: 950;
      letter-spacing: -0.04em;
    }

    .book-info-label {
      display: none;
    }

    .book-main-name {
      width: 100%;
      font-family: "Noto Serif KR", serif;
      color: #332116;
      font-size: clamp(31px, 3vw, 46px);
      font-weight: 900;
      line-height: 1.04;
      letter-spacing: -0.065em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.55);
    }

    .book-main-author {
      margin-top: 6px;
      color: #6d4a28;
      font-size: clamp(15px, 1.35vw, 20px);
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-preview-area {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cover-slot {
      width: 100%;
max-width: 720px;
height: 170px;
min-height: 170px;
      border: 3px dashed rgba(185, 143, 88, 0.42);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 36%, rgba(255, 235, 187, 0.5), transparent 38%),
        rgba(255, 249, 238, 0.78);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.82),
        0 12px 24px rgba(108, 74, 32, 0.08);
    }

    .cover-slot.has-cover {
      border-style: solid;
      background: rgba(255, 250, 241, 0.9);
      padding: 16px;
    }

    .cover-slot.has-cover img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
      filter: drop-shadow(0 12px 18px rgba(86, 55, 22, 0.16));
    }

    .cover-icon {
  width: 52px;
  height: 40px;
  margin-bottom: 12px;
  border-radius: 12px;
  background: rgba(190, 151, 103, 0.28);
  display: grid;
  place-items: center;
  color: rgba(116, 78, 38, 0.72);
  font-size: 24px;
}

    .cover-slot strong {
      margin-bottom: 6px;
      font-family: "Noto Serif KR", serif;
      color: #6a4422;
      font-size: clamp(23px, 2vw, 31px);
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .cover-slot span {
  color: #856345;
  font-size: clamp(12px, 1vw, 15px);
  font-weight: 800;
  line-height: 1.3;
}

    .right-lumi-zone {
      min-width: 0;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      justify-items: center;
      align-items: center;

    .lumi-bubble {

      background: rgba(255, 253, 247, 0.97);
      border: 1px solid rgba(177, 126, 62, 0.28);

      font-size: clamp(19px, 1.7vw, 25px);

      line-height: 1.24;
      text-align: center;
      letter-spacing: -0.04em;
      box-shadow: 0 12px 24px rgba(95, 61, 23, 0.1);
    }

    .lumi-image {
      width: min(100%, 285px);
      max-height: 100%;
      object-fit: contain;
      object-position: bottom center;
      align-self: end;
      filter: drop-shadow(0 16px 22px rgba(88, 55, 22, 0.18));

    .start-button {

      height: 54px;
      border: 2px solid rgba(138, 86, 25, 0.38);
      border-radius: 20px;

      color: #fff8df;
      font-size: clamp(19px, 1.8vw, 24px);

</head>

<body>
  <main class="page">
    <div class="page-inner">

      <header class="top-nav">
        <div class="nav-left">
          <button class="mq-book-home-button" type="button" onclick="goIndividualReading()">📚 책읽기 홈</button>
          <button class="nav-button" type="button" onclick="location.href='practice.html'">▣ 연습하기로</button>
        </div>

        
      </header>

      <section class="intro-card">
        <div class="book-layout">
          <div class="intro-center-zone">
            <div class="book-info-card">
              <p class="book-info-question">우리 반이 정한 책</p>
              <p class="book-info-label">제목</p>
              <h1 class="book-main-name" id="introBookTitle">「신통방통 홈 쇼핑」</h1>
              <p class="book-main-author" id="introBookAuthor">지은이: 예시 작가</p>
            </div>

            <div class="book-preview-area">
              <div class="cover-slot" id="bookCoverSlot">
                <div class="cover-icon">▧</div>
                <strong>책 표지 넣는 곳</strong>
                <span>책 표지 이미지를<br />업로드해주세요.</span>
              </div>
            </div>
          </div>

          <div class="right-lumi-zone">
            <div class="lumi-bubble">
              책 읽기를<br />시작해볼까요?
            </div>

            <img
              class="lumi-image"
              src="../assets/images/read-before/intro/pre-reading-lumi-thinking.png"
              alt="루미"
            />

            <button class="start-button" type="button" onclick="location.href='before-reading.html'">
              책 살펴보기 시작 <span>›</span>
            </button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    // 상단 "책읽기 홈" 버튼을 누르면 개별읽기 메인 홈으로 이동합니다.
    function goIndividualReading() {
      location.href = "./individual-reading.html";
    }

    function getApiBaseUrl() {
      if (window.location.hostname === "127.0.0.1") {
        return "http://127.0.0.1:8080";
      }
      if (window.location.hostname === "localhost") {
        return "http://localhost:8080";
      }
      return "https://victory-production-f94d.up.railway.app";
    }

    const API_BASE_URL = getApiBaseUrl();

async function initBookIntroPage() {
  const token = sessionStorage.getItem("token");

  const studentId =
    sessionStorage.getItem("studentId") ||
    sessionStorage.getItem("id");

  const role = sessionStorage.getItem("role");

  if (!token || !studentId || role !== "student") {
    alert("학생 로그인이 필요합니다.");
    location.href = "../../index.html";
    return;
  }

  try {
    const classResponse = await fetch(
      `${API_BASE_URL}/api/students/${studentId}/class`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (!classResponse.ok) {
      throw new Error(
        `학생 학급 조회 실패: ${classResponse.status}`
      );
    }

    const classData = await classResponse.json();

    const bookResponse = await fetch(
      `${API_BASE_URL}/api/classes/${classData.classId}/reading-range`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (bookResponse.status === 404) {
      showBookNotRegistered();
      return;
    }

    if (!bookResponse.ok) {
      throw new Error(
        `온책읽기 책 조회 실패: ${bookResponse.status}`
      );
    }

    const book = await bookResponse.json();

    showRegisteredBook(book);
  } catch (error) {
    console.error(
      "우리 반 온책읽기 책 정보를 불러오지 못했습니다.",
      error
    );

    showBookLoadError();
  }
}

function showRegisteredBook(book) {
  const titleElement =
    document.getElementById("introBookTitle");

  const authorElement =
    document.getElementById("introBookAuthor");

  const bookCoverSlot =
    document.getElementById("bookCoverSlot");

  const startButton =
    document.querySelector(".start-button");

  titleElement.textContent =
    `「${book.bookTitle || "제목 없음"}」`;

  authorElement.textContent =
    `지은이: ${book.author || "정보 없음"}`;

  if (book.coverImage) {
    bookCoverSlot.classList.add("has-cover");

    const coverImage = document.createElement("img");
    coverImage.src = book.coverImage;
    coverImage.alt = `${book.bookTitle || "선정 도서"} 책 표지`;

    bookCoverSlot.replaceChildren(coverImage);
  } else {
    showEmptyCover();
  }

  startButton.disabled = false;
  startButton.textContent = "책 살펴보기 시작 ";

  const arrow = document.createElement("span");
  arrow.textContent = "›";
  startButton.appendChild(arrow);
}

function showBookNotRegistered() {
  document.getElementById(
    "introBookTitle"
  ).textContent =
    "아직 우리 반의 책이 등록되지 않았어요";

  document.getElementById(
    "introBookAuthor"
  ).textContent =
    "선생님이 책을 등록하면 여기에 나타나요.";

  showEmptyCover();
  disableStartButton("책 등록을 기다리고 있어요");
}

function showBookLoadError() {
  document.getElementById(
    "introBookTitle"
  ).textContent =
    "책 정보를 불러오지 못했어요";

  document.getElementById(
    "introBookAuthor"
  ).textContent =
    "잠시 후 다시 시도해 주세요.";

  showEmptyCover();
  disableStartButton("책 정보를 확인하고 있어요");
}

function showEmptyCover() {
  const bookCoverSlot =
    document.getElementById("bookCoverSlot");

  bookCoverSlot.classList.remove("has-cover");

  bookCoverSlot.innerHTML = `
    <div class="cover-icon">▧</div>
    <strong>책 표지 넣는 곳</strong>
    <span>
      선생님이 책을 등록하면<br>
      표지가 나타나요.
    </span>
  `;
}

function disableStartButton(message) {
  const startButton =
    document.querySelector(".start-button");

  startButton.disabled = true;
  startButton.textContent = message;
}

initBookIntroPage();
  </script>
