<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 추천 책장 - 문답책</title>

  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
  <link rel="stylesheet" href="../css/common.css?v=friend-book-shelf-clean-final">
  <link rel="stylesheet" href="../css/individual-power.css">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .fs-page,
    .fs-page * {
      box-sizing: border-box;
      font-family: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    .fs-page {
      width: 100vw;
      height: 100vh;
      padding: 16px 28px 20px;
      color: #4a2a10;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255, 248, 229, 0.92), rgba(255, 248, 229, 0.72) 48%, rgba(255, 248, 229, 0.5)),
        radial-gradient(circle at 12% 18%, rgba(255, 221, 135, 0.38), transparent 34%),
        radial-gradient(circle at 88% 82%, rgba(166, 103, 31, 0.22), transparent 32%),
        linear-gradient(135deg, #f8ecd2, #d8b16d 48%, #84521f);
    }

    .fs-shell {
      width: 100%;
      max-width: 1480px;
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: 64px minmax(0, 1fr);
      gap: 14px;
    }

    .fs-top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 22px;
      border: 1px solid rgba(182, 119, 38, 0.28);
      border-radius: 24px;
      background: rgba(255, 250, 236, 0.92);
      box-shadow: 0 12px 24px rgba(92, 58, 18, 0.12);
      backdrop-filter: blur(8px);
    }

    .fs-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fs-logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .fs-logo span {
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      font-size: 29px;
      font-weight: 900;
      color: #5a3415;
      letter-spacing: -0.045em;
    }

    .fs-top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .fs-top-button {
      height: 42px;
      padding: 0 18px;
      border: 1px solid rgba(168, 106, 31, 0.28);
      border-radius: 999px;
      background: rgba(255, 252, 242, 0.94);
      color: #633915;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(98, 59, 15, 0.1);
      white-space: nowrap;
    }

    .fs-main {
      width: 100%;
      min-width: 0;
      min-height: 0;
      display: block;
    }

    .fs-content-card {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 100px minmax(0, 1fr);
      padding: 26px 30px 28px;
      border: 1px solid rgba(180, 116, 34, 0.24);
      border-radius: 34px;
      background: rgba(255, 251, 242, 0.92);
      box-shadow:
        0 18px 34px rgba(92, 58, 18, 0.13),
        inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .fs-content-header {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      border-bottom: 1px solid rgba(181, 117, 37, 0.16);
      padding-bottom: 18px;
    }

    .fs-title-row {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .fs-content-header h1 {
      margin: 0;
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      color: #4d2b10;
      font-size: 44px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.055em;
      white-space: nowrap;
    }

    .fs-write-button {
      height: 48px;
      padding: 0 24px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #e8bd5e, #a8641e);
      color: #fff9e8;
      font-size: 16px;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(128, 76, 18, 0.22);
      white-space: nowrap;
    }

    .fs-tab-list {
      display: flex;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 245, 219, 0.8);
      border: 1px solid rgba(178, 113, 31, 0.16);
    }

    .fs-tab-button {
      height: 42px;
      padding: 0 18px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: #744919;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .fs-tab-button.active {
      background: linear-gradient(180deg, #e7ba5b, #a8641e);
      color: #fff9e8;
      box-shadow: 0 8px 16px rgba(128, 76, 18, 0.18);
    }

    .fs-scroll-area {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 6px 2px 0;
    }

    .fs-section {
      margin-bottom: 24px;
    }

    .fs-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .fs-section-title {
      margin: 0;
      color: #5b3515;
      font-size: 24px;
      font-weight: 950;
      letter-spacing: -0.04em;
    }

    .fs-best-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .fs-book-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .fs-best-card,
    .fs-book-card {
      min-width: 0;
      min-height: 190px;
      border-radius: 26px;
      border: 1px solid rgba(181, 117, 37, 0.18);
      background: rgba(255, 252, 244, 0.88);
      box-shadow: 0 12px 22px rgba(101, 63, 18, 0.1);
      overflow: hidden;
    }

    .fs-best-card {
      padding: 20px;
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 236, 169, 0.72), transparent 42%),
        linear-gradient(180deg, rgba(255, 252, 241, 0.96), rgba(255, 240, 199, 0.9));
    }

    .fs-book-card {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 14px;
      padding: 20px;
    }

    .fs-book-mark {
      width: 58px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 16px 16px 24px 24px;
      background: linear-gradient(180deg, #e6b656, #9f5d1d);
      color: #fff9e8;
      font-size: 26px;
      box-shadow: 0 8px 14px rgba(129, 76, 18, 0.16);
    }

    .fs-best-badge {
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #e7ba5b, #a8641e);
      color: #fff9e8;
      font-size: 13px;
      font-weight: 950;
      box-shadow: 0 8px 14px rgba(128, 76, 18, 0.18);
    }

    .fs-card-title {
      margin: 12px 0 6px;
      color: #4e2d10;
      font-size: 26px;
      font-weight: 950;
      line-height: 1.2;
      letter-spacing: -0.04em;
      word-break: keep-all;
    }

    .fs-book-card .fs-card-title {
      margin-top: 0;
    }

    .fs-card-author {
      margin: 0 0 10px;
      color: #8a5b22;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.35;
      word-break: keep-all;
    }

    .fs-card-reason {
      margin: 0;
      color: #6f481d;
      font-size: 16px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .fs-like-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      gap: 8px;
    }

    .fs-rec-by {
      color: #9a681f;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .fs-card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .fs-like-button,
    .fs-detail-button {
      height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(174, 109, 27, 0.22);
      border-radius: 999px;
      background: rgba(255, 250, 237, 0.94);
      color: #8a5519;
      font-size: 13px;
      font-weight: 950;
      cursor: pointer;
      white-space: nowrap;
    }

    .fs-detail-button {
      background: rgba(255, 240, 201, 0.96);
    }

    .fs-empty {
      display: grid;
      place-items: center;
      min-height: 280px;
      border-radius: 28px;
      border: 1px dashed rgba(166, 103, 31, 0.3);
      background: rgba(255, 248, 229, 0.65);
      color: #7a5123;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
      line-height: 1.5;
      grid-column: 1 / -1;
    }

    .fs-detail-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(52, 31, 12, 0.38);
      z-index: 100;
    }

    .fs-detail-modal.show {
      display: flex;
    }

    .fs-detail-box {
      width: min(720px, 92vw);
      max-height: 82vh;
      overflow-y: auto;
      padding: 30px;
      border-radius: 30px;
      background: rgba(255, 251, 242, 0.98);
      box-shadow: 0 24px 50px rgba(51, 29, 9, 0.25);
      border: 1px solid rgba(181, 117, 37, 0.24);
    }

    .fs-detail-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(181, 117, 37, 0.16);
      padding-bottom: 16px;
    }

    .fs-detail-header h2 {
      margin: 0 0 8px;
      color: #4d2b10;
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      font-size: 34px;
      font-weight: 950;
      letter-spacing: -0.05em;
    }

    .fs-detail-header p {
      margin: 0;
      color: #7a5123;
      font-size: 17px;
      font-weight: 900;
    }

    .fs-close-button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #f1dfb8;
      color: #633915;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
    }

    .fs-detail-section {
      margin-top: 18px;
    }

    .fs-detail-section strong {
      display: block;
      margin-bottom: 8px;
      color: #5b3515;
      font-size: 19px;
      font-weight: 950;
    }

    .fs-detail-section p {
      margin: 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255, 244, 213, 0.9);
      color: #6f481d;
      font-size: 18px;
      font-weight: 850;
      line-height: 1.55;
      word-break: keep-all;
    }

    .fs-detail-list {
      margin: 0;
      padding: 14px 18px 14px 34px;
      border-radius: 18px;
      background: rgba(255, 244, 213, 0.9);
      color: #6f481d;
      font-size: 17px;
      font-weight: 850;
      line-height: 1.55;
      word-break: keep-all;
    }

    .fs-detail-list li + li {
      margin-top: 7px;
    }

    @media (max-height: 760px) {
      .fs-page {
        padding: 12px 24px;
      }

      .fs-shell {
        grid-template-rows: 58px minmax(0, 1fr);
        gap: 10px;
      }

      .fs-content-card {
        grid-template-rows: 86px minmax(0, 1fr);
        padding: 20px 24px;
      }

      .fs-content-header h1 {
        font-size: 36px;
      }

      .fs-write-button {
        height: 40px;
        font-size: 14px;
      }

      .fs-best-card,
      .fs-book-card {
        min-height: 162px;
        padding: 16px;
      }

      .fs-card-title {
        font-size: 22px;
      }

      .fs-card-author,
      .fs-card-reason {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="fs-page">
    <div class="fs-shell">

      <header class="fs-top-bar">
        <div class="fs-logo">
          <img src="../assets/images/logo-book.png" alt="문답책 로고">
          <span>문답책</span>
        </div>

        <div class="fs-top-actions">
          <button type="button" class="fs-top-button" onclick="openIndividualPowerModal()">✨ 나의 힘</button>
          <button type="button" class="fs-top-button" onclick="goBookRecommend()">책 추천 받기</button>
          <button
  type="button"
  class="mq-book-home-button"
  id="shelfHomeButton"
  onclick="goIndividualReading()"
>
  📚 책읽기 홈
</button>
        </div>
      </header>

      <section class="fs-main">
        <article class="fs-content-card">

          <div class="fs-content-header">
            <div class="fs-title-row">
              <h1>우리 반 추천 책장</h1>
              <button type="button" class="fs-write-button" onclick="goFriendBookWrite()">
                나도 책 추천하기
              </button>
            </div>

            <div class="fs-tab-list" aria-label="추천 책 보기 방식">
              <button type="button" class="fs-tab-button active" data-tab="all" onclick="changeTab('all')">전체 보기</button>
              <button type="button" class="fs-tab-button" data-tab="mine" onclick="changeTab('mine')">내가 쓴 추천</button>
            </div>
          </div>

          <div class="fs-scroll-area" id="scrollArea">
            <section class="fs-section" id="bestSection">
              <div class="fs-section-header">
                <h2 class="fs-section-title">🏆 많이 좋아한 책</h2>
              </div>
              <div class="fs-best-grid" id="bestBookList"></div>
            </section>

            <section class="fs-section" id="allSection">
              <div class="fs-section-header">
                <h2 class="fs-section-title">📚 친구들이 추천한 책</h2>
              </div>
              <div class="fs-book-grid" id="friendBookList"></div>
            </section>

            <section class="fs-section" id="mineSection" style="display:none;">
              <div class="fs-section-header">
                <h2 class="fs-section-title">✍️ 내가 쓴 추천</h2>
              </div>
              <div class="fs-book-grid" id="myBookList"></div>
            </section>
          </div>

        </article>
      </section>

    </div>
  </main>

  <div class="fs-detail-modal" id="detailModal" onclick="closeDetailModalOnBg(event)">
    <div class="fs-detail-box">
      <div class="fs-detail-header">
        <div>
          <h2 id="detailTitle">책 제목</h2>
          <p id="detailAuthor">지은이</p>
        </div>
        <button type="button" class="fs-close-button" onclick="closeDetailModal()">×</button>
      </div>

      <div class="fs-detail-section">
        <strong>추천한 친구</strong>
        <p id="detailRecommender">친구 이름</p>
      </div>

      <div class="fs-detail-section">
        <strong>추천 이유</strong>
        <p id="detailReason">추천 이유</p>
      </div>

      <div class="fs-detail-section">
        <strong>이 책이 궁금해지는 질문</strong>
        <ol class="fs-detail-list" id="detailQuestions"></ol>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>

  <script>
    // checkLogin();

    const studentId = sessionStorage.getItem("studentId") || "student-demo";
    const FRIEND_BOOK_KEY = "individualFriendBookRecommendations_" + studentId;
    const FRIEND_BOOK_LIKED_KEY = "individualFriendBookLikedBooks_" + studentId;

        ]
      }
    ];

    let currentTab = "all";

    document.addEventListener("DOMContentLoaded", function () {
  renderShelf();
  applyTeacherMode();
});
function applyTeacherMode() {
  const params = new URLSearchParams(window.location.search);
  const isTeacherMode = params.get("mode") === "teacher";
  const homeButton = document.getElementById("shelfHomeButton");

  if (isTeacherMode && homeButton) {
    homeButton.textContent = "← 개별읽기 관리";
  }
}
    function goIndividualReading() {
  const params = new URLSearchParams(window.location.search);
  const isTeacherMode = params.get("mode") === "teacher";

  if (isTeacherMode) {
    window.location.href =
      "../teacher/individual-reading-manage.html";
  } else {
    window.location.href =
      "./individual-reading.html";
  }
}

    function goBookRecommend() {
      window.location.href = "./book-recommend.html";
    }

    function goFriendBookWrite() {
      window.location.href = "./friend-book-write.html";
    }

    function getSavedFriendBooks() {
      try {
        return JSON.parse(sessionStorage.getItem(FRIEND_BOOK_KEY) || "[]");
      } catch (error) {
        return [];
      }
    }

    function getLikedBookIds() {
      try {
        return JSON.parse(sessionStorage.getItem(FRIEND_BOOK_LIKED_KEY) || "[]");
      } catch (error) {
        return [];
      }
    }

    function saveLikedBookIds(likedBookIds) {
      sessionStorage.setItem(FRIEND_BOOK_LIKED_KEY, JSON.stringify(likedBookIds));
    }

    function getAllBooks() {
      return [...getSavedFriendBooks(), ...classBooks];
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function changeTab(tabName) {
      currentTab = tabName;

      document.querySelectorAll(".fs-tab-button").forEach(function (button) {
        button.classList.toggle("active", button.dataset.tab === tabName);
      });

      renderShelf();
    }

    function getSortedBooks() {
      return getAllBooks().sort(function (a, b) {
        if (b.likes !== a.likes) return b.likes - a.likes;
        return b.id - a.id;
      });
    }

    function renderShelf() {
      const bestSection = document.getElementById("bestSection");
      const allSection = document.getElementById("allSection");
      const mineSection = document.getElementById("mineSection");

      if (currentTab === "all") {
        bestSection.style.display = "block";
        allSection.style.display = "block";
        mineSection.style.display = "none";
        renderBestBooks();
        renderFriendBooks();
      } else {
        bestSection.style.display = "none";
        allSection.style.display = "none";
        mineSection.style.display = "block";
        renderMyBooks();
      }
    }

    function renderBestBooks() {
      const bestBookList = document.getElementById("bestBookList");
      const bestBooks = getSortedBooks().slice(0, 3);

      bestBookList.innerHTML = "";

      bestBooks.forEach(function (book, index) {
        const likedBookIds = getLikedBookIds();
        const isLiked = likedBookIds.includes(book.id);

        const card = document.createElement("div");
        card.className = "fs-best-card";
        card.innerHTML = `
          <span class="fs-best-badge">BEST ${index + 1}</span>
          <h3 class="fs-card-title">${escapeHtml(book.title)}</h3>
          <p class="fs-card-author">${escapeHtml(book.author)} 지음 · ${escapeHtml(book.recommender)} 추천</p>
          <p class="fs-card-reason">“${escapeHtml(book.reason)}”</p>
          <div class="fs-like-row">
            <span class="fs-rec-by">👍 ${book.likes}</span>
            <div class="fs-card-actions">
              <button type="button" class="fs-detail-button" onclick="openDetailModal(${book.id})">자세히</button>
              <button type="button" class="fs-like-button" onclick="likeBook(${book.id})">
                ${isLiked ? "취소" : "좋아요"}
              </button>
            </div>
          </div>
        `;

        bestBookList.appendChild(card);
      });
    }

    function renderFriendBooks() {
      const friendBookList = document.getElementById("friendBookList");
      const books = getSortedBooks();

      friendBookList.innerHTML = "";

      books.forEach(function (book) {
        friendBookList.appendChild(createBookCard(book));
      });
    }

    function renderMyBooks() {
      const myBookList = document.getElementById("myBookList");
      const myBooks = getSortedBooks().filter(function (book) {
        return book.mine;
      });

      myBookList.innerHTML = "";

      if (myBooks.length === 0) {
        myBookList.innerHTML = `
          <div class="fs-empty">
            아직 내가 추천한 책이 없어.<br>
            나도 책 추천하기 버튼을 눌러 책을 소개해봐!
          </div>
        `;
        return;
      }

      myBooks.forEach(function (book) {
        myBookList.appendChild(createBookCard(book));
      });
    }

    function createBookCard(book) {
      const likedBookIds = getLikedBookIds();
      const isLiked = likedBookIds.includes(book.id);

      const card = document.createElement("div");
      card.className = "fs-book-card";
      card.innerHTML = `
        <div class="fs-book-mark">📖</div>
        <div>
          <h3 class="fs-card-title">${escapeHtml(book.title)}</h3>
          <p class="fs-card-author">${escapeHtml(book.author)} 지음 · ${escapeHtml(book.recommender)} 추천</p>
          <p class="fs-card-reason">“${escapeHtml(book.reason)}”</p>
          <div class="fs-like-row">
            <span class="fs-rec-by">👍 ${book.likes}</span>
            <div class="fs-card-actions">
              <button type="button" class="fs-detail-button" onclick="openDetailModal(${book.id})">자세히</button>
              <button type="button" class="fs-like-button" onclick="likeBook(${book.id})">
                ${isLiked ? "취소" : "좋아요"}
              </button>
            </div>
          </div>
        </div>
      `;

      return card;
    }

    function findBookById(bookId) {
      return getAllBooks().find(function (book) {
        return book.id === bookId;
      });
    }

    function openDetailModal(bookId) {
      const book = findBookById(bookId);
      if (!book) return;

      document.getElementById("detailTitle").textContent = book.title;
      document.getElementById("detailAuthor").textContent = book.author + " 지음";
      document.getElementById("detailRecommender").textContent = book.recommender + " 추천";
      document.getElementById("detailReason").textContent = book.reason;

      const detailQuestions = document.getElementById("detailQuestions");
      detailQuestions.innerHTML = "";

      const questions = book.teaserQuestions || [];

      if (questions.length === 0) {
        detailQuestions.innerHTML = "<li>아직 등록된 질문이 없어.</li>";
      } else {
        questions.forEach(function (question) {
          const li = document.createElement("li");
          li.textContent = question;
          detailQuestions.appendChild(li);
        });
      }

      document.getElementById("detailModal").classList.add("show");
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.remove("show");
    }

    function closeDetailModalOnBg(event) {
      if (event.target.id === "detailModal") {
        closeDetailModal();
      }
    }

    function likeBook(bookId) {
  let likedBookIds = getLikedBookIds();

  const alreadyLiked = likedBookIds.includes(bookId);

  if (alreadyLiked) {
    likedBookIds = likedBookIds.filter(function (id) {
      return id !== bookId;
    });
  } else {
    likedBookIds.push(bookId);
  }

  saveLikedBookIds(likedBookIds);

  const changeAmount = alreadyLiked ? -1 : 1;

  classBooks = classBooks.map(function (book) {
    if (book.id === bookId) {
      return {
        ...book,
        likes: Math.max(0, book.likes + changeAmount)
      };
    }

    return book;
  });

  const savedBooks = getSavedFriendBooks().map(function (book) {
    if (book.id === bookId) {
      return {
        ...book,
        likes: Math.max(0, book.likes + changeAmount)
      };
    }

    return book;
  });

  sessionStorage.setItem(FRIEND_BOOK_KEY, JSON.stringify(savedBooks));

  renderShelf();
}
  </script>

  <script src="../js/individual-power.js?v=power-common-2"></script>
  <script src="../js/fixed-stage.js"></script>
</body>
