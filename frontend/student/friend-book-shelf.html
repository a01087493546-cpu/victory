<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>우리 반 추천 책장 - 문답책</title>

  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
  <link rel="stylesheet" href="../css/common.css?v=friend-book-shelf-clean-final">

  <style>
    html,
    body {
      width: 100%;

    .fs-page,

    .fs-page {

}

<body>
  <main class="fs-page">
    <div class="fs-shell">

      <header class="fs-top-bar">
        <div class="fs-logo">
          <img src="../assets/images/logo-book.png" alt="문답책 로고">
          <span>문답책</span>
        </div>

        <div class="fs-top-actions">
          <button
            id="friendShelfPowerButton"
            type="button"
            class="fs-top-button"
            onclick="openIndividualPowerModal()"
          >
            ✨ 나의 힘
          </button>
          <button
            id="friendShelfRecommendButton"

            class="fs-top-button"
            onclick="goBookRecommend()"

          </button>
          <button
  type="button"
  class="mq-book-home-button"
  id="shelfHomeButton"
  onclick="goIndividualReading()"
>
  📚 책읽기 홈
</button>
        </div>
      </header>

      <section class="fs-main">
        <article class="fs-content-card">

          <div class="fs-content-header">
            <div class="fs-title-row">
              <h1>우리 반 추천 책장</h1>
              <div class="fs-demo-banner" id="friendShelfDemoBanner" hidden>🔍 <strong>심사 체험 안내</strong> — 학생 활동 모습을 확인할 수 있도록 가상 학생들의 예시 데이터를 미리 구성해 두었습니다.</div>
              <button type="button" class="fs-write-button" onclick="goFriendBookWrite()">
                나도 책 추천하기

              <button type="button" class="fs-tab-button active" data-tab="all" onclick="changeTab('all')">전체 보기</button>
              <button type="button" class="fs-tab-button" data-tab="mine" onclick="changeTab('mine')">내가 쓴 추천</button>
            </div>
          </div>

          <div class="fs-scroll-area" id="scrollArea">
            <section class="fs-section" id="bestSection">

            <section class="fs-section" id="allSection">

  <div class="fs-detail-modal" id="detailModal" onclick="closeDetailModalOnBg(event)">

      <div class="fs-detail-section">

  <script src="../js/auth.js"></script>
  <script src="../js/demo-storage.js"></script>

  <script>
    // checkLogin();

    const API_BASE_URL = "http://localhost:8080";
    const token = sessionStorage.getItem("token");
    /* 로그인 시 학생/교사 구분 없이 sessionStorage "studentId" 키에 숫자 사용자 id가 저장된다(auth.js). */
    const viewerId = sessionStorage.getItem("studentId") || "";

    let currentTab = "all";
    let classWall = { best: [], recent: [] };
    let loadError = false;
    let likeInFlight = false;
    const DEMO_RECOMMENDATION_LIKES_KEY = "bookRecommendationLikes";

    document.addEventListener("DOMContentLoaded", async function () {
      applyTeacherMode();
      applyTeacherModeUi();
      const demoBanner = document.getElementById("friendShelfDemoBanner");
      if (demoBanner) demoBanner.hidden = !(isDemoAccount() && !isTeacherMode());
      showLoadingState();
      await loadClassWall();
      renderShelf();
    });

    function isTeacherMode() {
      return new URLSearchParams(window.location.search).get("mode") === "teacher";
    }

    function applyTeacherMode() {
      const homeButton = document.getElementById("shelfHomeButton");

      if (isTeacherMode() && homeButton) {
        homeButton.textContent = "← 개별읽기 관리";
      }
    }

    /* 교사 모드에서는 추천 글 작성이 불가하므로 작성 버튼과 "내가 한 추천" 탭을 숨긴다. */
    function applyTeacherModeUi() {
      if (!isTeacherMode()) return;

      const writeButton = document.querySelector(".fs-write-button");
      if (writeButton) writeButton.style.display = "none";

      const mineTabButton = document.querySelector('.fs-tab-button[data-tab="mine"]');
      if (mineTabButton) mineTabButton.style.display = "none";

      const powerButton = document.getElementById("friendShelfPowerButton");
      if (powerButton) powerButton.hidden = true;

      const recommendButton = document.getElementById("friendShelfRecommendButton");
      if (recommendButton) recommendButton.hidden = true;
    }

    function goIndividualReading() {
      if (isTeacherMode()) {
        window.location.href = "../teacher/individual-reading-manage.html";
      } else {
        window.location.href = "./individual-reading.html";
      }
    }

    function goBookRecommend() {
      window.location.href = "./book-recommend.html";
    }

    function goFriendBookWrite() {
      window.location.href = "./friend-book-write.html";
    }

    function getClassWallUrl() {
      if (isTeacherMode()) {
        return API_BASE_URL + "/api/teachers/" + viewerId + "/book-recommendations/class-wall";
      }
      return API_BASE_URL + "/api/students/me/book-recommendations/class-wall";
    }

    function getLikeUrl(recommendationId) {
      if (isTeacherMode()) {
        return API_BASE_URL + "/api/teachers/" + viewerId + "/book-recommendations/" + recommendationId + "/like";
      }
      return API_BASE_URL + "/api/students/me/book-recommendations/" + recommendationId + "/like";
    }

    /*
      우리 반 추천 책장을 서버(GET .../book-recommendations/class-wall)에서 받아온다.
      샘플 데이터/sessionStorage는 더 이상 쓰지 않는다 - 학생/교사가 같은 DB 자료를 본다.
    */
    async function loadClassWall() {
      loadError = false;

      if (!token) {
        classWall = { best: [], recent: [] };
        loadError = true;
        return;
      }

      try {
        const response = await fetch(getClassWallUrl(), {
          headers: { Authorization: "Bearer " + token }
        });

        if (!response.ok) {
          throw new Error("우리 반 추천 책장 조회 실패: " + response.status);
        }

        classWall = await response.json();
        applyDemoRecommendationLikes();
        mergeDemoWrittenRecommendations();
      } catch (error) {
        console.error("우리 반 추천 책장을 불러오지 못했습니다.", error);
        classWall = { best: [], recent: [] };
        loadError = true;
      }
    }

    function applyDemoRecommendationLikes() {
      if (!isDemoAccount()) return;
      const likedById = loadDemoState(DEMO_RECOMMENDATION_LIKES_KEY, {});
      [classWall.best, classWall.recent].forEach(function (items) {
        items.forEach(function (item) {
          const key = String(item.recommendationId);
          const seedLikeCount = Number(item.likeCount) || 0;
          item.likeCount = seedLikeCount + (likedById[key] ? 1 : 0);
          item.likedByMe = !!likedById[key];
        });
      });
    }

    /*
      심사계정이 친구에게 책 추천하기 화면에서 직접 쓴 글은 공용 DB가 아니라
      현재 브라우저의 mq_demo_individualBookRecommendations에만 저장된다.
      서버에서 새로 받은 공용 seed 목록에 이 브라우저의 글만 한 번 병합한다.
      학생 ss01과 교사 tt11은 같은 브라우저 localStorage를 공유하므로,
      같은 브라우저에서 tt11로 봐도(교사 모드) 이 브라우저에서 ss01이 쓴
      글이 그대로 보여야 한다 - 그래서 isTeacherMode() 여부와 무관하게
      isDemoAccount()이기만 하면 병합한다.
    */
    function mergeDemoWrittenRecommendations() {
      if (!isDemoAccount()) return;

      const saved = loadDemoState("individualBookRecommendations", []);
      if (!Array.isArray(saved) || saved.length === 0) return;

      const existingIds = new Set(
        [...classWall.best, ...classWall.recent].map(function(item) {
          return String(item.recommendationId);
        })
      );
      const localIds = new Set();
      const localRecommendations = saved.filter(function(item) {
        if (!item || !item.recommendationId) return false;
        const id = String(item.recommendationId);
        if (existingIds.has(id) || localIds.has(id)) return false;
        localIds.add(id);
        return true;
      });

      classWall.recent = localRecommendations.concat(classWall.recent);
    }

    function getMineList() {
      return [...classWall.best, ...classWall.recent].filter(function (item) {
        return item.isMine;
      });
    }

    function getEmptyWallMessage() {
      return isTeacherMode()
        ? "아직 이 학급에 등록된 추천 책이 없습니다."
        : "아직 우리 반 친구들이 추천한 책이 없어요.<br>내가 먼저 좋은 책을 소개해 볼까요?";
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // 서버 ISO 시각(예: 2026-07-30T21:48:14)을 2026.07.30 형식으로 바꾼다.
    function formatCreatedDate(isoDateTime) {
      if (!isoDateTime) return "";

      const datePart = String(isoDateTime).slice(0, 10);
      const parts = datePart.split("-");

      if (parts.length !== 3) return datePart;

      return parts[0] + "." + parts[1] + "." + parts[2];
    }

    function changeTab(tabName) {
      if (isTeacherMode() && tabName === "mine") return;

      currentTab = tabName;

      document.querySelectorAll(".fs-tab-button").forEach(function (button) {
        button.classList.toggle("active", button.dataset.tab === tabName);
      });

      renderShelf();
    }

    function showLoadingState() {
      const bestBookList = document.getElementById("bestBookList");
      const friendBookList = document.getElementById("friendBookList");
      const myBookList = document.getElementById("myBookList");

      if (bestBookList) bestBookList.innerHTML = `<div class="fs-empty">불러오는 중...</div>`;
      if (friendBookList) friendBookList.innerHTML = "";
      if (myBookList) myBookList.innerHTML = "";
    }

    function renderShelf() {
      const bestSection = document.getElementById("bestSection");
      const allSection = document.getElementById("allSection");
      const mineSection = document.getElementById("mineSection");

      if (currentTab === "all") {
        bestSection.style.display = "block";
        allSection.style.display = "block";
        mineSection.style.display = "none";
        renderBestBooks();
        renderRecentBooks();
      } else {
        bestSection.style.display = "none";
        allSection.style.display = "none";
        mineSection.style.display = "block";
        renderMyBooks();
      }
    }

    function renderBestBooks() {
      const bestSection = document.getElementById("bestSection");
      const bestBookList = document.getElementById("bestBookList");
      const hasAny = classWall.best.length > 0 || classWall.recent.length > 0;

      if (loadError || !hasAny) {
        bestSection.style.display = "none";
        return;
      }

      bestSection.style.display = "block";
      bestBookList.innerHTML = classWall.best.map(renderBestCardHtml).join("");
    }

    function renderRecentBooks() {
      const friendBookList = document.getElementById("friendBookList");

      if (loadError) {
        friendBookList.innerHTML = `
          <div class="fs-empty">
            추천 책장을 불러오지 못했어요.<br>
            잠시 후 다시 시도해 주세요.
          </div>
        `;
        return;
      }

      const hasAny = classWall.best.length > 0 || classWall.recent.length > 0;

      if (!hasAny) {
        friendBookList.innerHTML = `<div class="fs-empty">${getEmptyWallMessage()}</div>`;
        return;
      }

      friendBookList.innerHTML = classWall.recent.map(renderBookCardHtml).join("");
    }

    function renderMyBooks() {
      const myBookList = document.getElementById("myBookList");

      if (loadError) {
        myBookList.innerHTML = `
          <div class="fs-empty">
            불러오지 못했어요.<br>
            잠시 후 다시 시도해 주세요.
          </div>
        `;
        return;
      }

      const myBooks = getMineList();

      if (myBooks.length === 0) {
        myBookList.innerHTML = `
          <div class="fs-empty">
            아직 내가 추천한 책이 없어.<br>
            나도 책 추천하기 버튼을 눌러 책을 소개해봐!
          </div>
        `;
        return;
      }

      myBookList.innerHTML = myBooks.map(renderBookCardHtml).join("");
    }

    function renderBestCardHtml(item) {
      return `
        <div class="fs-best-card">
          <span class="fs-best-badge">BEST ${item.rank}</span>
          <h3 class="fs-card-title">${escapeHtml(item.title)}</h3>
          <p class="fs-card-author">${escapeHtml(item.author)} 지음 · ${escapeHtml(item.studentName)} 추천</p>
          <p class="fs-card-reason">“${escapeHtml(item.reason)}”</p>
          ${renderTeaserQuestionsHtml(item)}
          <div class="fs-like-row">
            <span class="fs-rec-by">👍 ${item.likeCount}</span>
            <div class="fs-card-actions">
              <button type="button" class="fs-like-button" onclick='toggleLike(${JSON.stringify(String(item.recommendationId))})'>
                ${item.likedByMe ? "취소" : "좋아요"}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderBookCardHtml(item) {
      return `
        <div class="fs-book-card">
          <div class="fs-book-mark">📖</div>
          <div>
            <h3 class="fs-card-title">${escapeHtml(item.title)}</h3>
            <p class="fs-card-author">${escapeHtml(item.author)} 지음 · ${escapeHtml(item.studentName)} 추천 · ${formatCreatedDate(item.createdAt)}</p>
            <p class="fs-card-reason">“${escapeHtml(item.reason)}”</p>
            ${renderTeaserQuestionsHtml(item)}
            <div class="fs-like-row">
              <span class="fs-rec-by">👍 ${item.likeCount}</span>
              <div class="fs-card-actions">
                <button type="button" class="fs-like-button" onclick='toggleLike(${JSON.stringify(String(item.recommendationId))})'>
                  ${item.likedByMe ? "취소" : "좋아요"}
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderTeaserQuestionsHtml(item) {
      const questions = Array.isArray(item.teaserQuestions) ? item.teaserQuestions : [];
      const question = questions.length > 0 ? questions[0] : "";

      if (!question) {
        return "";
      }

      return `
        <div class="fs-teaser-question-box">
          <p class="fs-teaser-question-title">이 책이 궁금해지는 질문</p>
          <p class="fs-teaser-question-item">Q. ${escapeHtml(question)}</p>
        </div>
      `;
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.remove("show");
    }

    function closeDetailModalOnBg(event) {
      if (event.target.id === "detailModal") {
        closeDetailModal();
      }
    }

    /* 좋아요 클릭 성공 후에는 낙관적 갱신 없이 전체 목록을 다시 조회해 서버 값을 그대로 반영한다. */
    async function toggleLike(recommendationId) {
      if (likeInFlight || !token) return;

      if (isDemoAccount()) {
        const localRecommendations = loadDemoState("individualBookRecommendations", []);
        const localIndex = Array.isArray(localRecommendations)
          ? localRecommendations.findIndex(function(item) {
              return String(item.recommendationId) === String(recommendationId);
            })
          : -1;

        if (localIndex >= 0) {
          const item = localRecommendations[localIndex];
          const wasLiked = item.likedByMe === true;
          localRecommendations[localIndex] = Object.assign({}, item, {
            likedByMe: !wasLiked,
            likeCount: Math.max(0, (Number(item.likeCount) || 0) + (wasLiked ? -1 : 1))
          });
          saveDemoState("individualBookRecommendations", localRecommendations);
          await loadClassWall();
          renderShelf();
          return;
        }

        const likedById = loadDemoState(DEMO_RECOMMENDATION_LIKES_KEY, {});
        const key = String(recommendationId);
        likedById[key] = !likedById[key];
        saveDemoState(DEMO_RECOMMENDATION_LIKES_KEY, likedById);
        await loadClassWall();
        renderShelf();
        return;
      }

      likeInFlight = true;

      try {
        const response = await fetch(getLikeUrl(recommendationId), {
          method: "POST",
          headers: { Authorization: "Bearer " + token }
        });

        if (!response.ok) {
          throw new Error("좋아요 처리 실패: " + response.status);
        }

        await loadClassWall();
        renderShelf();
      } catch (error) {
        console.error("좋아요 처리 중 오류가 발생했습니다.", error);
        alert("좋아요 처리에 실패했어요. 잠시 후 다시 시도해 주세요.");
      } finally {
        likeInFlight = false;
      }
    }
  </script>

  <script src="../js/individual-power.js?v=power-common-5"></script>
  <script src="../js/fixed-stage.js"></script>
</body>
