<!--
  파일명: during-reading-intro.html
  역할: 읽기 중 활동으로 들어가기 전, 루미가 활동을 안내하는 인트로 화면입니다.

  이 화면에서 하는 일:
  1. 읽기 전 활동을 마친 학생을 칭찬합니다.
  2. 읽기 중에는 책을 읽으며 생긴 궁금함에 답해 보는 활동을 안내합니다.
  3. 읽기 중 질문의 종류를 하나씩 연습하고 실제 책읽기에 적용하도록 연결합니다.

  참고: 읽기 전 인트로 화면(read-before-intro.html)과 배경 이미지/레이아웃을
  동일하게 맞춘 화면입니다. 화면 크기는 1920x1080 고정이며, 창을 줄여도
  fixed-stage.js가 비율 그대로 축소해서 레이아웃이 깨지지 않습니다.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>문답책 - 읽기 중 인트로</title>

 <style>
  /* 제목과 중요한 문구에 사용할 폰트입니다. */
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
    background: #1f140d;
    color: #fff4e3;
  }

  .intro-page {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background:
      linear-gradient(rgba(22, 14, 8, 0.18), rgba(22, 14, 8, 0.34)),
      url("../assets/images/read-before/intro/pre-reading-bg-magic-greenhouse.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }

  .intro-page::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 38%, rgba(255, 214, 133, 0.18), transparent 28%),
      linear-gradient(90deg, rgba(20, 13, 9, 0.12), rgba(20, 13, 9, 0.02) 52%, rgba(20, 13, 9, 0.18));
    pointer-events: none;
    z-index: 1;
  }

  .intro-lumi {
    position: absolute;
    right: 140px;
    bottom: 0;
    z-index: 2;
    width: 520px;
    max-height: 910px;
    object-fit: contain;
    object-position: bottom center;
    filter:
      drop-shadow(0 18px 28px rgba(0, 0, 0, 0.34))
      drop-shadow(0 0 12px rgba(231, 178, 82, 0.16));
  }

  .story-box {
    position: absolute;
    left: 145px;
    bottom: 132px;
    z-index: 3;
    width: 640px;
    min-height: 332px;
    padding: 30px 30px 26px;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(36, 31, 31, 0.88), rgba(21, 19, 25, 0.92));
    border: 1px solid rgba(238, 212, 158, 0.18);
    box-shadow:
      0 18px 36px rgba(0, 0, 0, 0.34),
      inset 0 1px 0 rgba(255, 247, 226, 0.08);
    backdrop-filter: blur(4px);
  }

  .speaker-name {
    position: absolute;
    left: 34px;
    top: -28px;
    min-width: 120px;
    padding: 11px 22px;
    border-radius: 12px 12px 4px 4px;
    background: linear-gradient(180deg, rgba(70, 51, 32, 0.98), rgba(41, 31, 24, 0.98));
    border: 1px solid rgba(237, 207, 151, 0.22);
    color: #fff2d7;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
  }

  .scene-label {
    margin-bottom: 12px;
    color: #e8c481;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: -0.2px;
  }

  .story-text {
    min-height: 156px;
    font-family: "Noto Serif KR", serif;
    color: #fff6e8;
    font-size: 31px;
    font-weight: 900;
    line-height: 1.48;
    letter-spacing: -1px;
    text-shadow: 0 3px 8px rgba(0, 0, 0, 0.34);
    white-space: pre-line;
  }

  .story-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    margin-top: 20px;
  }

  .dot-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .dot {
    width: 14px;
    height: 14px;
    border-radius: 999px;
    background: rgba(255, 246, 224, 0.22);
  }

  .dot.active {
    width: 42px;
    background: linear-gradient(90deg, #e2ae59, #f0d28b);
    box-shadow: 0 0 10px rgba(230, 178, 88, 0.34);
  }

  .next-button {
    min-width: 154px;
    border: none;
    border-radius: 999px;
    padding: 16px 28px;
    background: linear-gradient(180deg, #f3e4bf, #d8bf87);
    color: #4b3420;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    box-shadow:
      0 10px 20px rgba(0, 0, 0, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.42);
    transition: 0.2s ease;
  }

  .next-button:hover {
    transform: translateY(-2px);
    background: linear-gradient(180deg, #fff0c8, #e5ca91);
  }

  .prev-button {
    min-width: 154px;
    border: none;
    border-radius: 999px;
    padding: 16px 28px;
    background: linear-gradient(180deg, #9a6a35, #5c3214);
    color: #fff1d2;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    box-shadow:
      0 10px 20px rgba(0, 0, 0, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);
    transition: 0.2s ease;
    display: none;
  }

  .prev-button:hover {
    transform: translateY(-2px);
    background: linear-gradient(180deg, #b47a3a, #6c3b17);
  }

  .button-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }
 </style>
</head>

<body>
  <main class="intro-page">

    <!-- 장면마다 루미 이미지가 바뀝니다. -->
    <img
      class="intro-lumi"
      id="lumiImage"
      src="../assets/images/during-reading/intro/during-reading-lumi-01-goodjob.png"
      alt="읽기 중 활동을 안내하는 루미"
    >

    <!-- 대화창 영역입니다. -->
    <section class="story-box">
      <div class="speaker-name">루미</div>

      <div class="scene-label" id="sceneLabel">
        읽기 전 활동 완료
      </div>

      <div class="story-text" id="storyText"></div>

      <div class="story-bottom">
        <div class="dot-row" id="dotRow"></div>

        <div class="button-row">
          <button class="prev-button" type="button" onclick="prevScene()" id="prevButton">
            이전
          </button>

          <button class="next-button" type="button" onclick="nextScene()" id="nextButton">
            다음
          </button>
        </div>
      </div>
    </section>

  </main>

  <script>
    /*
      =========================================================
      읽기 중 인트로 장면 데이터
      =========================================================
    */

    const scenes = [
      {
        label: "읽기 전 활동 완료",
        text: "읽기 전 활동을 끝내다니,\n정말 대단한데?",
        image: "../assets/images/during-reading/intro/during-reading-lumi-01-goodjob.png"
      },
      {
        label: "책을 읽으며 생각하기",
        text: "이제는 책을 읽으면서\n생기는 궁금함에 답해 보는\n연습을 할 거야.",
        image: "../assets/images/during-reading/intro/during-reading-lumi-02-question-note.png"
      },
      {
        label: "읽기 중 질문 연습",
        text: "읽기 중에 할 수 있는 질문을\n하나씩 차근차근 연습하고,\n바로 책읽기에 써 보자!",
        image: "../assets/images/during-reading/intro/during-reading-lumi-03-practice.png"
      }
    ];

    // 현재 보고 있는 장면 번호입니다.
    let currentSceneIndex = 0;

    // 화면이 열리면 첫 장면을 보여줍니다.
    renderScene();

    // 현재 장면을 화면에 그립니다.
    function renderScene() {
      const scene = scenes[currentSceneIndex];

      document.getElementById("sceneLabel").textContent = scene.label;
      document.getElementById("storyText").textContent = scene.text;
      document.getElementById("lumiImage").src = scene.image;

      const prevButton = document.getElementById("prevButton");

      // 두 번째 장면부터 이전 버튼을 보여줍니다.
      if (currentSceneIndex > 0) {
        prevButton.style.display = "inline-block";
      } else {
        prevButton.style.display = "none";
      }

      const nextButton = document.getElementById("nextButton");

      if (currentSceneIndex === scenes.length - 1) {
        nextButton.textContent = "질문 연습하러 가기";
      } else {
        nextButton.textContent = "다음";
      }

      renderDots();
    }

    // 아래 점 표시를 그립니다.
    function renderDots() {
      const dotRow = document.getElementById("dotRow");
      dotRow.innerHTML = "";

      scenes.forEach(function(scene, index) {
        const dot = document.createElement("span");
        dot.className = "dot";

        if (index === currentSceneIndex) {
          dot.classList.add("active");
        }

        dotRow.appendChild(dot);
      });
    }

    // 다음 장면으로 이동합니다.
    function nextScene() {
      if (currentSceneIndex < scenes.length - 1) {
        currentSceneIndex++;
        renderScene();
        return;
      }

      /*
        나중에 읽기 중 질문 연습 화면을 만들면
        아래 경로를 실제 파일명에 맞게 연결하면 됩니다.
      */
      location.href = "./during-reading-practice.html";
    }

    // 이전 장면으로 이동합니다.
    function prevScene() {
      if (currentSceneIndex > 0) {
        currentSceneIndex--;
        renderScene();
      }
    }
  </script>
  <script src="../js/fixed-stage.js"></script>
</body>
</html>
