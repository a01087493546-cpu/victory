<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문답책 - 읽기 후 인트로</title>

  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&display=swap");

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: #120b06;
      color: #fff4d6;
    }

    button {
  font-family: inherit;
  cursor: pointer;
}

.after-intro-page {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    linear-gradient(90deg, rgba(10, 5, 2, 0.86), rgba(10, 5, 2, 0.30), rgba(10, 5, 2, 0.72)),
    url("../assets/story/bg-after-reading-intro.png");
  background-size: cover;
  background-position: center;
}

.after-intro-brand {
  position: absolute;
  top: 48px;
  left: 58px;
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 5;
  color: #fff4cf;
  font-family: "Noto Serif KR", serif;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -0.8px;
  text-shadow: 0 3px 14px rgba(0, 0, 0, 0.42);
}

.after-intro-brand img {
  width: 54px;
  height: 54px;
  object-fit: contain;
  filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.42));
}

.after-intro-back {
  position: absolute;
  top: 58px;
  right: 60px;
  z-index: 5;
  height: 50px;
  padding: 0 26px;
  border-radius: 999px;
  border: 1.5px solid rgba(255, 222, 153, 0.62);
  background: rgba(93, 62, 31, 0.84);
  color: #fff3cf;
  font-size: 17px;
  font-weight: 900;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.26);
}

.after-intro-card {
  position: absolute;
  left: 4.5%;
  top: 39%;
  width: min(700px, 46vw);
  min-height: 410px;
  padding: 62px 52px 34px;
  border-radius: 0 28px 28px 28px;
  border: 1.5px solid rgba(255, 220, 145, 0.38);
  background:
    radial-gradient(circle at 96% 0%, rgba(255, 221, 145, 0.12), transparent 34%),
    linear-gradient(180deg, rgba(24, 22, 18, 0.96), rgba(18, 16, 13, 0.94));
  box-shadow:
    0 24px 46px rgba(0, 0, 0, 0.44),
    inset 0 1px 0 rgba(255, 240, 190, 0.10);
  z-index: 4;
}

.after-intro-speaker {
  position: absolute;
  top: -54px;
  left: 42px;
  width: 154px;
  height: 54px;
  display: grid;
  place-items: center;
  border-radius: 14px 14px 0 0;
  border: 1.5px solid rgba(255, 220, 145, 0.38);
  border-bottom: 0;
  background: rgba(52, 39, 23, 0.86);
  color: #ffe6a8;
  font-size: 20px;
  font-weight: 900;
}

.after-intro-small-title {
  margin-bottom: 24px;
  color: #ffe6a8;
  font-size: 17px;
  font-weight: 900;
}

.after-intro-text {
  min-height: 150px;
  display: flex;
  align-items: center;
  color: #fff8e5;
  font-family: "Noto Serif KR", serif;
  font-size: clamp(28px, 2.25vw, 38px);
  font-weight: 900;
  line-height: 1.48;
  letter-spacing: -1.2px;
  word-break: keep-all;
  white-space: pre-line;
  text-shadow:
    0 2px 0 rgba(20, 12, 5, 0.92),
    0 6px 18px rgba(0, 0, 0, 0.45);
}

.after-intro-bottom {
  display: grid;
  grid-template-columns: 160px 1fr 180px;
  align-items: center;
  gap: 24px;
  margin-top: 54px;
}

.after-intro-button {
  height: 56px;
  border-radius: 999px;
  border: 1.5px solid rgba(255, 223, 151, 0.50);
  font-size: 17px;
  font-weight: 900;
}

.after-intro-button.prev {
  background: rgba(255, 245, 220, 0.94);
  color: #5c3718;
}

.after-intro-button.prev:disabled {
  opacity: 0.35;
  cursor: default;
}

.after-intro-button.next {
  background: transparent;
  color: #ffe6a8;
  border-color: rgba(255, 218, 135, 0.38);
  box-shadow: none;
}

.after-intro-dots {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 13px;
}

.after-intro-dot {
  width: 15px;
  height: 15px;
  border-radius: 999px;
  background: rgba(255, 238, 196, 0.26);
}

.after-intro-dot.is-active {
  width: 58px;
  background: #ffd36f;
  box-shadow: 0 0 16px rgba(255, 211, 111, 0.28);
}

.after-intro-lumi {
  position: absolute;
  right: 8%;
  bottom: 0;
  width: min(500px, 34vw);
  max-height: 84vh;
  object-fit: contain;
  object-position: bottom center;
  filter:
    drop-shadow(0 22px 28px rgba(0, 0, 0, 0.58))
    drop-shadow(0 0 22px rgba(255, 211, 111, 0.18));
  z-index: 3;
}
  </style>
</head>

<body>
  <main class="after-intro-page">
    <div class="after-intro-brand">
      <img src="../assets/images/logo-book.png" alt="문답책 로고">
      <span>문답책</span>
    </div>

    <button class="after-intro-back" type="button" onclick="goPracticeHome()">
      ← 연습하기
    </button>

    <section class="after-intro-card">
      <div class="after-intro-speaker">루미</div>

      <div class="after-intro-small-title" id="afterIntroSmallTitle">
        읽기 후 활동
      </div>

      <p class="after-intro-text" id="afterIntroText"></p>

      <div class="after-intro-bottom">
        <button class="after-intro-button prev" id="prevAfterIntroButton" type="button" onclick="prevAfterIntro()">
          이전
        </button>

        <div class="after-intro-dots" id="afterIntroDots"></div>

        <button class="after-intro-button next" id="nextAfterIntroButton" type="button" onclick="nextAfterIntro()">
          다음
        </button>
      </div>
    </section>

    <img
      class="after-intro-lumi"
      id="afterIntroLumi"
      src="../assets/story/lumi-after-intro-01-smile.png"
      alt="루미"
    >
  </main>
    </main>

  <script>
    const afterIntroSlides = [
      {
        smallTitle: "읽기 후 활동",
        text: "책을 끝까지 읽었구나.\n이제 읽은 내용을 차근차근 정리해 보자.",
        lumi: "../assets/story/lumi-after-intro-01-smile.png"
      },
      {
        smallTitle: "간추리기 준비",
        text: "책의 종류에 따라\n중요한 내용을 골라 간추려 볼 거야.",
        lumi: "../assets/story/lumi-after-intro-02-serious.png"
      },
      {
        smallTitle: "간추리기 나누기",
        text: "내가 읽은 내용을 짧게 정리하고,\n친구들과 함께 나누어 보자.",
        lumi: "../assets/story/lumi-after-intro-03-confident.png"
      }
    ];

    let currentAfterIntroIndex = 0;

    const afterIntroSmallTitle = document.getElementById("afterIntroSmallTitle");
    const afterIntroText = document.getElementById("afterIntroText");
    const afterIntroLumi = document.getElementById("afterIntroLumi");
    const afterIntroDots = document.getElementById("afterIntroDots");
    const prevAfterIntroButton = document.getElementById("prevAfterIntroButton");
    const nextAfterIntroButton = document.getElementById("nextAfterIntroButton");

    function renderAfterIntro() {
      const slide = afterIntroSlides[currentAfterIntroIndex];

      afterIntroSmallTitle.textContent = slide.smallTitle;
      afterIntroText.textContent = slide.text;
      afterIntroLumi.src = slide.lumi;

      prevAfterIntroButton.disabled = currentAfterIntroIndex === 0;

      if (currentAfterIntroIndex === afterIntroSlides.length - 1) {
        nextAfterIntroButton.textContent = "읽기 후 활동 시작";
      } else {
        nextAfterIntroButton.textContent = "다음";
      }

      renderAfterIntroDots();
    }

    function renderAfterIntroDots() {
      let dotHTML = "";

      for (let i = 0; i < afterIntroSlides.length; i++) {
        if (i === currentAfterIntroIndex) {
          dotHTML += '<span class="after-intro-dot is-active"></span>';
        } else {
          dotHTML += '<span class="after-intro-dot"></span>';
        }
      }

      afterIntroDots.innerHTML = dotHTML;
    }

    function prevAfterIntro() {
      if (currentAfterIntroIndex > 0) {
        currentAfterIntroIndex--;
        renderAfterIntro();
      }
    }

    function nextAfterIntro() {
      if (currentAfterIntroIndex === afterIntroSlides.length - 1) {
        window.location.href = "./after-read.html";
        return;
      }

      currentAfterIntroIndex++;
      renderAfterIntro();
    }

    function goPracticeHome() {
      window.location.href = "./practice.html";
    }

    renderAfterIntro();
  </script>
</body>
</html>
