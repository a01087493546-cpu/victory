<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 독서 모험 - 문답책</title>

  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
  <link rel="stylesheet" href="../css/common.css?v=individual-reading-home-final" />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      color: #3f260f;
      background:
        linear-gradient(
          90deg,
          rgba(24, 17, 9, 0.38) 0%,
          rgba(255, 245, 219, 0.56) 42%,
          rgba(31, 21, 10, 0.34) 100%
        ),
        url("../assets/images/individual-reading/individual-reading.png") center / cover no-repeat;
    }

    button {
      font-family: inherit;
    }

    .ir-page {
      width: 100vw;
      height: 100vh;
      padding: 14px 44px 18px;
      background:
        linear-gradient(
          90deg,
          rgba(24, 17, 9, 0.38) 0%,
          rgba(255, 245, 219, 0.56) 42%,
          rgba(31, 21, 10, 0.34) 100%
        ),
        url("../assets/images/individual-reading/individual-reading.png") center / cover no-repeat;
      overflow: hidden;
    }

    .ir-topbar {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 10px;
      max-width: 1420px;
    }

    .ir-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ir-logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .ir-logo span {
      font-family: "Noto Serif KR", "Pretendard Variable", serif;
      font-size: 31px;
      font-weight: 900;
      letter-spacing: -0.06em;
      color: #fff2c7;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.42);
    }

    .ir-top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ir-top-archive,
    .ir-top-power {
      height: 46px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(26, 15, 5, 0.2);
    }

    .ir-top-archive {
      padding: 0 24px;
      border: 2px solid rgba(255, 219, 124, 0.86);
      background:
        radial-gradient(circle at 15% 0%, rgba(255, 247, 199, 0.95), transparent 42%),
        linear-gradient(180deg, #f9de8a 0%, #d29a35 100%);
      color: #3d260d;
      font-size: 17px;
    }

    .ir-top-power {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 18px;
      border: 1px solid rgba(255, 221, 143, 0.68);
      background: rgba(35, 23, 11, 0.74);
      color: #fff5d2;
      font-size: 16px;
    }

    .ir-top-power img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
    }

    .ir-shell {
      max-width: 1420px;
      height: calc(100vh - 96px);
      margin: 0 auto;
      padding: 20px 24px 20px;
      border: 2px solid rgba(202, 141, 49, 0.48);
      border-radius: 34px;
      background:
        radial-gradient(circle at 78% 8%, rgba(255, 236, 174, 0.58), transparent 26%),
        rgba(255, 247, 225, 0.92);
      box-shadow:
        0 18px 42px rgba(30, 19, 7, 0.24),
        inset 0 0 0 1px rgba(255, 255, 255, 0.38);
      backdrop-filter: blur(6px);
      overflow: hidden;
    }

    .ir-title {
      height: 76px;
      padding: 0 8px 2px;
    }

    .ir-title h1 {
      margin: 0;
      font-family: "Noto Serif KR", "Pretendard Variable", serif;
      font-size: 62px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.07em;
      color: #47280d;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.58);
    }

    .ir-main-row {
      height: 228px;
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 20px;
      margin-bottom: 16px;
    }

    .ir-card {
      border: 1px solid rgba(172, 111, 31, 0.28);
      border-radius: 22px;
      background: rgba(255, 250, 238, 0.92);
      box-shadow:
        0 10px 20px rgba(99, 61, 17, 0.1),
        inset 0 0 0 1px rgba(255, 255, 255, 0.42);
      overflow: hidden;
    }

    .ir-card-head {
      height: 44px;
      padding: 12px 16px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ir-card-head h2 {
      margin: 0;
      font-family: "Noto Serif KR", "Pretendard Variable", serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: #4f2e12;
    }

    .ir-card-head button {
      width: 30px;
      height: 30px;
      border: 1px solid rgba(165, 103, 25, 0.35);
      border-radius: 50%;
      background: #fff1cf;
      color: #8b5818;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .ir-power-body {
      height: calc(100% - 44px);
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 16px;
      padding: 0 18px 16px;
      align-items: center;
    }

    .ir-radar {
      position: relative;
      width: 132px;
      height: 132px;
      margin: 0 auto;
    }

    .ir-radar::before,
    .ir-radar::after {
      content: "";
      position: absolute;
      inset: 20px;
      border: 1px solid rgba(126, 77, 20, 0.22);
      transform: rotate(45deg);
    }

    .ir-radar::after {
      inset: 36px;
      border-color: rgba(126, 77, 20, 0.14);
    }

    .ir-radar-core {
      position: absolute;
      inset: 46px;
      z-index: 2;
      background: linear-gradient(180deg, #d99b32, #b06a1d);
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    }

    .ir-radar span {
      position: absolute;
      z-index: 3;
      color: #4f2f13;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
    }

    .radar-top {
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .radar-right {
      right: -8px;
      top: 54px;
    }

    .radar-bottom {
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .radar-left {
      left: -8px;
      top: 54px;
    }

    .ir-power-bars {
      display: grid;
      gap: 10px;
    }

    .ir-power-row {
      display: grid;
      grid-template-columns: 58px 1fr 68px;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 900;
      color: #543315;
    }

    .ir-power-row div {
      height: 10px;
      border-radius: 999px;
      background: rgba(113, 75, 31, 0.15);
      overflow: hidden;
    }

    .ir-power-row i {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8a5019, #c1842e, #e1b456);
    }

    .ir-practice-card {
      position: relative;
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      padding: 18px 24px;
      border: 2px solid rgba(232, 190, 91, 0.68);
      border-radius: 22px;
      background:
        radial-gradient(circle at 80% 20%, rgba(255, 230, 143, 0.2), transparent 32%),
        linear-gradient(135deg, rgba(33, 74, 28, 0.98), rgba(16, 56, 24, 0.98));
      color: #fff3c7;
      box-shadow:
        0 10px 22px rgba(32, 75, 24, 0.18),
        inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      cursor: pointer;
      overflow: hidden;
    }

    .ir-practice-card::before {
      content: "";
      display: none;
    }

    .ir-practice-lumi {
      width: 160px;
      height: 180px;
      object-fit: contain;
      object-position: bottom center;
      justify-self: center;
      filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.25));
    }

    .ir-practice-text {
      text-align: center;
    }

    .ir-practice-text h2 {
      margin: 0;
      font-family: "Noto Serif KR", "Pretendard Variable", serif;
      font-size: 32px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -0.05em;
      color: #fff8dc;
    }

    .ir-practice-text p {
      margin: 10px 0 14px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.35;
      color: #f4e7b9;
    }

    .ir-practice-text button {
      display: block;
      width: 176px;
      height: 44px;
      margin: 0 auto;
      border: 1px solid rgba(255, 225, 136, 0.78);
      border-radius: 999px;
      background: linear-gradient(180deg, #c8943c, #7f4b17);
      color: #fff8dc;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 8px 16px rgba(14, 42, 17, 0.26);
      cursor: pointer;
    }

    .ir-chart-card {
      height: 230px;
      margin-bottom: 16px;
    }

    .ir-chart-body {
      height: calc(100% - 44px);
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      padding: 0 16px 14px 12px;
    }

    .ir-chart-y {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 0 20px;
      color: #7a4a19;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
    }

    .ir-chart-plot {
      position: relative;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      align-items: end;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(173, 118, 44, 0.16);
      background:
        linear-gradient(to bottom, rgba(173, 118, 44, 0.15) 1px, transparent 1px) 0 25% / 100% 25% repeat-y;
    }

    .ir-bar {
      position: relative;
      height: 100%;
      display: flex;
      align-items: end;
      justify-content: center;
      padding-bottom: 18px;
    }

    .ir-bar b {
      width: 24px;
      min-height: 6px;
      border-radius: 14px 14px 6px 6px;
      background: linear-gradient(180deg, #dda64d, #a45e19);
      box-shadow: 0 8px 14px rgba(123, 73, 20, 0.14);
    }

    .ir-bar em {
      position: absolute;
      bottom: calc(var(--h) + 24px);
      font-style: normal;
      color: #4d2d10;
      font-size: 12px;
      font-weight: 900;
    }

    .ir-bar span {
      position: absolute;
      bottom: 0;
      color: #5d3715;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .ir-flow {
      height: 116px;
      display: grid;
      grid-template-columns: 1fr 24px 1fr 24px 1fr;
      align-items: center;
      gap: 8px;
    }

    .ir-flow-card {
      height: 116px;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 10px;
      padding: 14px 14px 14px;
      border: 1px solid rgba(178, 113, 29, 0.34);
      border-radius: 20px;
      background: rgba(255, 248, 230, 0.94);
      color: #4d2d11;
      box-shadow:
        0 10px 20px rgba(83, 51, 17, 0.1),
        inset 0 0 0 1px rgba(255, 255, 255, 0.38);
      cursor: pointer;
      text-align: left;
    }

    .ir-flow-card img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(74, 44, 13, 0.14));
    }

    .ir-flow-text strong {
      display: block;
      font-family: "Noto Serif KR", "Pretendard Variable", serif;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.05em;
    }

    .ir-card-arrow {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 243, 215, 0.9);
      color: #8a571c;
      font-size: 18px;
      font-style: normal;
      font-weight: 900;
      justify-self: end;
    }

    .ir-flow-arrow {
      color: #f3c762;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
    }

    .ir-dungeon {
      border: 3px solid rgba(245, 190, 78, 0.92);
      box-shadow:
        0 0 0 2px rgba(130, 77, 18, 0.1),
        0 0 16px rgba(224, 157, 49, 0.22),
        0 10px 20px rgba(83, 51, 17, 0.1);
    }

    .ir-dungeon .ir-card-arrow {
      background: #fff0c9;
    }
        /* 개별읽기 메인 화면 미세조정 */
    .ir-title {
      height: 62px !important;
      padding: 0 8px !important;
    }

    .ir-title h1 {
      font-size: 50px !important;
      line-height: 1 !important;
      letter-spacing: -0.075em !important;
    }

    /* 나의 힘 카드 물음표 제거 */
    .ir-main-row .ir-card:first-child .ir-card-head button {
      display: none !important;
    }

    /* 연습읽기 카드 고급화 */
    .ir-practice-card {
      position: relative !important;
      grid-template-columns: 210px minmax(0, 1fr) !important;
      padding: 20px 34px !important;
      border: 2px solid rgba(247, 205, 106, 0.9) !important;
      background:
        radial-gradient(circle at 18% 28%, rgba(255, 226, 130, 0.2), transparent 28%),
        radial-gradient(circle at 86% 18%, rgba(255, 238, 164, 0.24), transparent 28%),
        linear-gradient(135deg, #123e1e 0%, #1f5a27 48%, #0f3218 100%) !important;
      box-shadow:
        0 12px 24px rgba(22, 70, 28, 0.24),
        inset 0 0 0 1px rgba(255, 244, 184, 0.18),
        inset 0 0 34px rgba(255, 212, 100, 0.08) !important;
    }

    .ir-practice-card::after {
      content: "맨 처음 해요";
      position: absolute;
      top: 16px;
      right: 20px;
      height: 34px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 226, 143, 0.88);
      border-radius: 999px;
      background: linear-gradient(180deg, #fff0b9 0%, #d4a13c 100%);
      color: #3d260d;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 8px 16px rgba(25, 54, 18, 0.22);
    }

    .ir-practice-lumi {
      width: 190px !important;
      height: 200px !important;
      object-fit: contain !important;
      object-position: bottom center !important;
    }

    .ir-practice-text h2 {
      font-size: 34px !important;
      line-height: 1.15 !important;
      margin-bottom: 18px !important;
    }

    /* 연습읽기 보조설명 제거 */
    .ir-practice-text p {
      display: none !important;
    }

    .ir-practice-text button {
      width: 200px !important;
      height: 48px !important;
      font-size: 19px !important;
      background: linear-gradient(180deg, #d8a247 0%, #8a541b 100%) !important;
      border: 1px solid rgba(255, 229, 151, 0.9) !important;
      box-shadow:
        0 8px 18px rgba(14, 42, 17, 0.28),
        inset 0 0 0 1px rgba(255, 255, 255, 0.16) !important;
    }

    /* 하단 3개 버튼 키우기 */
    .ir-flow {
      height: 128px !important;
      grid-template-columns: 1fr 26px 1fr 26px 1fr !important;
      gap: 10px !important;
    }

    .ir-flow-card {
      height: 128px !important;
      grid-template-columns: 92px minmax(0, 1fr) 34px !important;
      gap: 14px !important;
      padding: 16px 18px !important;
    }

    .ir-flow-card img {
      width: 84px !important;
      height: 84px !important;
    }

    .ir-flow-text strong {
      font-size: 23px !important;
      line-height: 1.15 !important;
    }

    .ir-card-arrow {
      width: 34px !important;
      height: 34px !important;
      font-size: 23px !important;
    }

    .ir-flow-arrow {
      font-size: 32px !important;
    }

    .ir-dungeon {
  border: 3px solid rgba(193, 153, 92, 0.92) !important;
  background: linear-gradient(135deg, #f3eadb 0%, #e2d1b4 52%, #c6ab84 100%) !important;
  box-shadow:
    0 0 0 2px rgba(130, 77, 18, 0.08),
    0 0 14px rgba(177, 134, 74, 0.18),
    0 10px 20px rgba(83, 51, 17, 0.08) !important;
}

.ir-dungeon .ir-flow-text strong {
  color: #5a3a1a !important;
}

.ir-dungeon .ir-card-arrow {
  background: #f4e7d2 !important;
  color: #8a5c24 !important;
}
/* 상단 홈 버튼 + 연습읽기 버튼 + 던전입장 색감 보정 */
.ir-top-home {
  height: 46px;
  padding: 0 22px;
  border: 1px solid rgba(122, 79, 30, 0.48);
  border-radius: 999px;
  background:
    linear-gradient(180deg, rgba(91, 58, 26, 0.94), rgba(45, 29, 14, 0.92));

  font-size: 16px;
  font-weight: 900;
  cursor: pointer;

    0 8px 18px rgba(26, 15, 5, 0.22),

}

.ir-practice-card {
  border-color: rgba(218, 178, 93, 0.92) !important;
  background:
    radial-gradient(circle at 20% 18%, rgba(255, 226, 138, 0.16), transparent 30%),
    radial-gradient(circle at 84% 20%, rgba(255, 240, 176, 0.18), transparent 28%),
    linear-gradient(135deg, #123819 0%, #1e5525 48%, #102f17 100%) !important;
  box-shadow:
    0 12px 24px rgba(23, 63, 25, 0.2),
    inset 0 0 0 1px rgba(255, 236, 167, 0.18),

}

.ir-practice-card::after {
  top: 14px !important;
  right: 18px !important;
  height: 32px !important;
  padding: 0 17px !important;
  background: linear-gradient(180deg, #f4df9f 0%, #bd8430 100%) !important;
  color: #3e260c !important;
  font-size: 13px !important;
}

.ir-practice-text button {
  width: 210px !important;
  height: 50px !important;
  margin-top: 2px !important;
  border: 1px solid rgba(255, 225, 139, 0.95) !important;
  background:
    linear-gradient(180deg, #d6a14a 0%, #9a641f 54%, #6e4315 100%) !important;
  color: #fff5d2 !important;
  font-size: 19px !important;
  letter-spacing: -0.03em !important;
  box-shadow:
    0 8px 16px rgba(14, 42, 17, 0.24),
    inset 0 1px 0 rgba(255, 255, 255, 0.28),

}

.ir-practice-text button:hover {
  transform: translateY(-1px);
}

.ir-dungeon {

  background:
    linear-gradient(135deg, #d8c3a3 0%, #b99669 48%, #7d5531 100%) !important;
  box-shadow:
    0 0 0 2px rgba(88, 53, 19, 0.1),
    0 0 16px rgba(126, 85, 42, 0.22),
    0 10px 20px rgba(67, 40, 15, 0.12),

}

.ir-dungeon .ir-flow-text strong {

}

.ir-dungeon .ir-card-arrow {
  background: #ead7b9 !important;
  color: #6f431b !important;
}
  </style>
</head>

<body>
  <div class="ir-page">
    <header class="ir-topbar">
      <div class="ir-logo">
        <img src="../assets/images/logo-book.png" alt="문답책 로고" />
        <span>문답책</span>
      </div>

      <div class="ir-top-actions">
  <button class="ir-top-home" type="button" onclick="location.href='../index.html'">
    🏠 홈으로
  </button>

  <button class="ir-top-archive" type="button" onclick="location.href='reading-archive.html'">
    📚 나의 독서 보관함
  </button>

  <button class="ir-top-power" type="button" onclick="location.href='my-power.html'">
    <img src="../assets/story/char-lumi-01-basic.png" alt="" />
    나의 힘
  </button>
</div>
    </header>

    <main class="ir-shell">
      <section class="ir-title">
        <h1>나만의 독서 모험 ✨</h1>
      </section>

      <section class="ir-main-row">
        <article class="ir-card">
          <div class="ir-card-head">
            <h2>나의 힘</h2>
            <button type="button">?</button>
          </div>

          <div class="ir-power-body">
            <div class="ir-radar">
              <span class="radar-top">마법력<br />11</span>
              <span class="radar-right">체력<br />11</span>
              <span class="radar-bottom">지혜<br />11</span>
              <span class="radar-left">용기<br />10</span>
              <div class="ir-radar-core"></div>
            </div>

            <div class="ir-power-bars">
              <div class="ir-power-row">
                <span>마법력</span>
                <div><i style="width: 11%"></i></div>
                <b>11 / 100</b>
              </div>
              <div class="ir-power-row">
                <span>체력</span>
                <div><i style="width: 11%"></i></div>
                <b>11 / 100</b>
              </div>
              <div class="ir-power-row">
                <span>지혜</span>
                <div><i style="width: 11%"></i></div>
                <b>11 / 100</b>
