<!--
  파일명: before-reading.html
  역할: 문답책 프로젝트의 읽기 전 질문 만들기 화면입니다.

  화면 흐름:
  1. 책 고르기/투표로 결정된 책을 기준으로 읽기 전 질문을 만듭니다.
  2. 제목 → 차례 → 책 속 그림 → 글 훑어보기 순서로 진행합니다.
  3. 각 단계는 예시 보기와 질문 만들기 화면으로 구성됩니다.
  4. 질문과 내가 생각한 답을 적고, 루미의 피드백을 받은 뒤 다음 단계로 넘어갑니다.
  5. 모든 질문을 완성하면 공유하기 화면으로 이동합니다.

  백엔드 연동 준비:
  - 현재는 sessionStorage와 mock 데이터를 사용합니다.
  - 나중에 API 함수 부분만 fetch 코드로 바꾸면 됩니다.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>문답책 - 읽기 전 질문 만들기</title>

  <style>
    
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #fff2dc;
      background:
        linear-gradient(rgba(10, 7, 5, 0.58), rgba(10, 7, 5, 0.68)),
        url("../assets/images/home/home-library-bg.png");
      background-size: cover;
      background-position: center;
      overflow-x: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

   .page {
  position: relative;
  min-height: 100vh;
  padding: 14px 28px 22px;
  background:
    linear-gradient(

      rgba(235, 209, 164, 0.52)

    .page::before {

      inset: 0;

    .page-inner {

    }

    /* 상단 메뉴 */
   .top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-button {
      border: 1px solid rgba(236, 198, 127, 0.22);

    .my-count {

      font-weight: 900;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
    }

    /* 책 정보 + 진행도 + 루미 */
  .top-info {

  grid-template-columns: 1fr;
  gap: 14px;
  align-items: stretch;
  margin-bottom: 14px;
}

    .book-icon {

  height: 58px;

    }
.book-icon-image {
  width: 58px;
  height: 58px;
  object-fit: contain;
  display: block;
}
    .book-small-label {
      margin-bottom: 8px;
      color: #f2d38b;
      font-size: 15px;
      font-weight: 900;
    }

   .book-title {
  font-family: "Noto Serif KR", serif;
  color: #fff6e4;
  font-size: 27px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .book-meta {
      margin-top: 6px;
      color: rgba(255, 241, 214, 0.66);
      font-size: 15px;
      font-weight: 800;
    }

    .step-progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-step {
      display: grid;
      place-items: center;
      gap: 7px;
      color: rgba(255, 237, 205, 0.62);
      font-size: 14px;
      font-weight: 900;
    }

    .progress-circle {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border-radius: 999px;
      border: 2px solid rgba(239, 206, 145, 0.24);

      color: rgba(255, 237, 205, 0.8);
      font-size: 18px;
      font-weight: 900;
    }

    .progress-step.active .progress-circle {

      box-shadow: 0 0 22px rgba(239, 191, 91, 0.36);

    .progress-step.done .progress-circle {

    }

    .progress-line {
      flex: 1;
      height: 2px;
      background: rgba(230, 203, 154, 0.18);
      margin-top: -25px;
    }

    .lumi-zone {
      position: relative;
      min-height: 118px;
      border-radius: 24px;
    }

    .lumi-bubble {
      position: absolute;
      left: 0;
      top: 10px;
      width: 270px;
      padding: 18px 20px;
      border-radius: 20px;
      background: rgba(61, 43, 27, 0.88);

      margin-bottom: 8px;
      color: #f4c873;
      font-size: 15px;
      font-weight: 900;
    }

    .lumi-text {
      color: #fff0d2;
      font-size: 16px;
      font-weight: 850;
      line-height: 1.58;
      word-break: keep-all;
      white-space: pre-line;
    }

    .lumi-img {
      position: absolute;
      right: -4px;
      bottom: -10px;
      width: 185px;
      max-height: 150px;
      object-fit: contain;
      filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.34));

    /* 메인 활동 영역 */
    .activity-layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 22px;
      align-items: stretch;
    }

    .side-steps {
      padding: 18px 0;
      border-radius: 24px;
      border: 1px solid rgba(238, 207, 150, 0.18);
      background: rgba(19, 15, 11, 0.72);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(6px);
      overflow: hidden;
    }

    .side-step {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      padding: 24px 22px;
      border: none;
      border-bottom: 1px solid rgba(238, 207, 150, 0.09);
      background: transparent;
      color: rgba(255, 239, 210, 0.68);
      text-align: left;
      transition: 0.18s ease;
    }

    .side-step:last-child {
      border-bottom: none;
    }

    .side-step:hover {
      background: rgba(255, 223, 158, 0.06);
    }

    .side-step.active {
      background:
        linear-gradient(90deg, rgba(217, 154, 45, 0.22), rgba(217, 154, 45, 0.03));
      color: #fff1d4;
      box-shadow: inset 4px 0 0 #f0bf62;
    }

    .side-step.done {
      color: #e3ffe0;
    }

    .side-num {
      display: grid;
      place-items: center;
      min-width: 48px;
      height: 48px;
      border-radius: 999px;
      border: 2px solid rgba(238, 207, 150, 0.24);
      font-size: 18px;
      font-weight: 900;
    }

    .side-step.active .side-num {
      border-color: #ffd77d;
      background: radial-gradient(circle, #ffe29e 0%, #c4862d 76%);
      color: #3e2813;
      box-shadow: 0 0 22px rgba(239, 191, 91, 0.36);
    }

    .side-main {
      display: block;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.35;
      word-break: keep-all;
    }

    .activity-card {
  min-height: 640px;
  padding: 34px 40px 30px;
      border-radius: 28px;
      background: rgba(255, 248, 235, 0.94);
      color: #312419;
      box-shadow:
        0 22px 44px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.78);
    }

    .activity-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  margin-bottom: 28px;
}

    .activity-title {
      font-family: "Noto Serif KR", serif;
      color: #2e2117;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.9px;
      word-break: keep-all;
white-space: normal;
    }

    .tab-box {
  display: flex;
  width: 230px;
  max-width: 100%;
  margin-left: auto;
  border-radius: 18px;
  overflow: hidden;
  background: #d6bd95;
  border: 2px solid #9e7544;
  box-shadow:
    0 8px 0 rgba(92, 57, 23, 0.16),
    0 16px 28px rgba(76, 47, 18, 0.12);
}

    .tab-button {
      width: 100%;
      border: none;
      padding: 18px 24px;
      background: linear-gradient(180deg, #d8bd91, #bf9863);
      color: #2f2116;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .tab-button.active {
      background: linear-gradient(180deg, #f3dfbd, #cda36b);
      box-shadow:
        inset 0 0 0 2px rgba(89, 56, 24, 0.18),
        0 0 0 1px rgba(255, 248, 232, 0.55);
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .activity-card.is-write .content-grid {
      min-height: 474px;
    }

    .activity-card.is-example .content-grid {
      min-height: 474px;
    }

    .example-panel,
    .write-panel {
      width: 100%;
      padding: 34px;
      border-radius: 20px;
      background: #f6ead8;
      border: 2px solid #d6bd95;
    }

    .write-panel {
      min-height: 420px;
    }

    .write-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .write-grid .input-block {
      margin-bottom: 0;
    }

    .example-panel {
      min-height: 470px;
    }

    .panel-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
    }

    .panel-title {
      color: #3a2a1c;
      font-size: 25px;
      font-weight: 900;
    }

    .book-tag {
      padding: 10px 16px;
      border-radius: 999px;
      background: #e7d0ad;
      color: #5a4734;
      font-size: 16px;
      font-weight: 900;
    }

    .example-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .example-item {
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 18px;
  align-items: start;
  padding: 26px 24px;
      min-height: 230px;
      border-radius: 20px;
      background: #fff7e9;
      border: 2px solid #d9bf95;
    }

    .example-content {
      display: grid;
      gap: 14px;
    }

    .example-label {
      display: inline-flex;
      width: fit-content;
      margin-bottom: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      background: #d8bd91;
      color: #2f2116;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
    }

    .example-num {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: linear-gradient(180deg, #d9b06b, #9a6b36);
      color: #fff8df;
      font-size: 22px;
      font-weight: 900;
    }

    .example-question {
      color: #3b2a1b;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.38;
      word-break: keep-all;
    }

    .example-answer {
      color: #5f4a36;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.48;
      word-break: keep-all;
    }

    .input-block {
      margin-bottom: 18px;
    }

    .input-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      gap: 12px;
    }

    .input-label {
      color: #3b2a1b;
      font-size: 17px;
      font-weight: 900;
    }

    .input-help {
      color: #b48938;
      font-size: 14px;
      font-weight: 900;
    }

   textarea {
  width: 100%;
  min-height: 292px;
      resize: none;
      border: 1px solid #dec9a8;
      border-radius: 18px;
      outline: none;
      padding: 16px;
      background: #fffdf8;
      color: #33261b;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.55;
    }

    #answerInput {
      min-height: 292px;
    }

    textarea:focus {
      border-color: #c88d24;
      box-shadow: 0 0 0 4px rgba(216, 158, 50, 0.14);
    }

    .feedback-box {
      min-height: 70px;
      margin-top: 14px;
      padding: 16px 18px;
      border-radius: 18px;
      background: #fff3d5;
      border: 1px solid #eac675;
      color: #5a3e19;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.55;
      word-break: keep-all;
      white-space: pre-line;
    }

    .feedback-box.good {

      border-color: #b7d991;
      color: #355628;
    }

    .feedback-box.need {
      background: #fff0df;
      border-color: #e6b178;

.feedback-box-with-lumi {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 82px;
}

.feedback-lumi {

.feedback-message {
  flex: 1;

}
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      gap: 14px;
    }

    .small-note {
      flex: 1;
      padding: 16px 18px;
      border-radius: 16px;
      background: #fff2cf;
      border: 1px solid #e7c574;
      color: #5a421c;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.5;
    }

    .action-area {
      display: flex;
      gap: 12px;
    }

    .plain-button,
    .main-button {
      border: none;
      border-radius: 16px;
      padding: 17px 28px;
      font-size: 18px;
      font-weight: 900;
      transition: 0.18s ease;
    }

    .plain-button {
      background: #d8cab5;
      color: #6c5a48;
    }

    .main-button {
      background: linear-gradient(180deg, #dca328, #bd7908);
      color: #fff7e4;
      box-shadow: 0 10px 18px rgba(143, 91, 8, 0.24);
    }

    .plain-button:hover,
    .main-button:hover {
      transform: translateY(-2px);
    }

    .summary-list {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .summary-item {
      padding: 18px;
      border-radius: 18px;
      background: #fffaf0;
      border: 1px solid #ead9bd;
    }

    .summary-title {
      margin-bottom: 8px;
      color: #bb7d13;
      font-size: 22px;
      font-weight: 900;
    }

    .summary-text {
      color: #443123;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.55;
    }

    @media (max-width: 1100px) {
      .top-info,
      .activity-layout,
      .content-grid {
        grid-template-columns: 1fr;
      }

      .book-strip {
        grid-template-columns: 80px 1fr;
      }

      .step-progress {
        grid-column: 1 / -1;
        margin-top: 18px;
      }

      .lumi-zone {
        min-height: 150px;
      }
    }
    /* 읽기 전 질문 만들기 화면: 왼쪽 단계 메뉴 제거 + 카드 확대 */
.read-before-layout,
.before-reading-layout,
.question-layout,
.practice-layout,
.step-layout {
  grid-template-columns: 1fr !important;
  display: grid !important;
}

.left-step-menu,
.step-side-menu,
.step-sidebar,
.before-step-list,
.read-before-sidebar,
.activity-step-list,

    async function initPage() {
  const loaded = await loadSelectedBook();

  if (!loaded) {
    return;
  }

  await loadPreReadingResponses();

  renderAll();
}

    /*
      저장된 읽기 전 질문·답을 불러와 answers 배열을 채운다.
      실패해도 화면 진입 자체를 막지 않고, 빈 입력칸으로 시작하게 둔다.
    */
    async function loadPreReadingResponses() {
  const token = sessionStorage.getItem("token");

  if (!token || !studentId) {
    return;
  }

  try {
    const response = await fetch(
      `${API_BASE_URL}/api/students/${studentId}/responses/pre-reading`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("읽기 전 질문·답 조회 실패: " + response.status);
    }

    const items = await response.json();

    items.forEach(function (item) {
      const stepIndex = steps.findIndex(function (step) {
        return step.type === item.stepType;
      });

      if (stepIndex === -1) {
        return;
      }

      answers[stepIndex] = {
        question: item.question || "",
        expectedAnswer: item.answer || "",
        passed: !!item.passed,
        skipped: !!item.skipped
      };
    });
  } catch (error) {
    console.error("저장된 읽기 전 질문·답을 불러오지 못했습니다.", error);
  }
}

    /*
      AI good 판정을 받은 질문·답을 DB에 저장(또는 갱신)한다.
      실패하면 예외를 던져서 호출한 쪽(onResult)이 통과 처리를 하지 않게 한다.
    */
    async function savePreReadingResponse(stepType, question, answer, skipped) {
  const token = sessionStorage.getItem("token");

  if (!token || !studentId) {
    throw new Error("로그인 정보가 없습니다.");
  }

  if (!selectedBook || !selectedBook.bookId) {
    throw new Error("현재 학급 책 정보가 없습니다.");
  }

  const response = await fetch(
    `${API_BASE_URL}/api/students/${studentId}/responses/pre-reading`,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({
        stepType: stepType,
        question: question,
        answer: answer,
        classReadingBookId: selectedBook.bookId,
        skipped: !!skipped
      })
    }
  );

  if (!response.ok) {
    throw new Error("읽기 전 질문·답 저장 실패: " + response.status);
  }

  return response.json();
}

    async function loadSelectedBook() {
  const token = sessionStorage.getItem("token");
  const role = sessionStorage.getItem("role");

  if (!token || !studentId || role !== "student") {
    alert("학생 로그인이 필요합니다.");
    location.href = "../../index.html";
    return false;
  }

  try {
    const classResponse = await fetch(
      `${API_BASE_URL}/api/students/${studentId}/class`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (!classResponse.ok) {
      throw new Error(
        `학생 학급 조회 실패: ${classResponse.status}`
      );
    }

    const classData = await classResponse.json();

    const bookResponse = await fetch(
      `${API_BASE_URL}/api/classes/${classData.classId}/reading-range`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (bookResponse.status === 404) {
      alert("아직 우리 반의 온책읽기 책이 등록되지 않았습니다.");
      location.href = "./read-before-book-intro.html";
      return false;
    }

    if (!bookResponse.ok) {
      throw new Error(
        `온책읽기 책 조회 실패: ${bookResponse.status}`
      );
    }

    const bookData = await bookResponse.json();

    selectedBook = {
      bookId: bookData.id,
      title: bookData.bookTitle,
      author: bookData.author || "지은이 정보 없음",
      coverImage: bookData.coverImage || "",
      totalPages: bookData.totalPages,
      currentPage: bookData.currentPage,
      tableOfContents: []
    };

    document.getElementById("bookTitle").textContent =
      `「${selectedBook.title}」`;

    document.getElementById("bookMeta").textContent =
      `지은이: ${selectedBook.author}`;

    return true;
  } catch (error) {
    console.error(
      "온책읽기 책 정보를 불러오지 못했습니다.",
      error
    );

    alert("책 정보를 불러오지 못했습니다.");
    return false;
  }
}

    function renderAll() {
  renderTopProgress();
  renderSideSteps();

  if (currentMode === "summary") {
    renderSummary();
  } else {
    renderActivity();
  }

  updateQuestionCount();
}

    /*
      =========================================================
      4. 진행도 표시
      =========================================================
    */

    function renderTopProgress() {
      const topProgress = document.getElementById("topProgress");
      topProgress.innerHTML = "";

      steps.forEach(function(step, index) {
        const item = document.createElement("div");
        item.className = "progress-step";

        if (index === currentStepIndex) {
          item.classList.add("active");
        }

        if (answers[index].passed) {
          item.classList.add("done");
        }

        item.innerHTML =
          '<div class="progress-circle">' + step.number + '</div>' +
          '<div>' + step.short + '</div>';

        topProgress.appendChild(item);

        if (index < steps.length - 1) {
          const line = document.createElement("div");
          line.className = "progress-line";
          topProgress.appendChild(line);
        }
      });
    }

    function renderSideSteps() {
      const sideSteps = document.getElementById("sideSteps");
      sideSteps.innerHTML = "";

      steps.forEach(function(step, index) {
        const button = document.createElement("button");
        button.className = "side-step";

        if (index === currentStepIndex && currentMode !== "summary") {
          button.classList.add("active");
        }

        if (answers[index].passed) {
          button.classList.add("done");
        }

        button.onclick = function() {
          currentStepIndex = index;
          currentMode = "write";
          renderAll();
        };

        button.innerHTML =
          '<span class="side-num">' + step.number + '</span>' +
          '<span>' +
            '<span class="side-main">' + step.title + '</span>' +
          '</span>';

        sideSteps.appendChild(button);
      });
    }

    function updateQuestionCount() {
  const count = answers.filter(function(item) {
    return item.passed;
  }).length;

  const questionCountEl = document.getElementById("questionCount");

  if (questionCountEl) {
    questionCountEl.textContent = "(" + count + "/4)";
  }
}

    function updateLumiText() {
  const lumiTextEl = document.getElementById("lumiText");
  if (!lumiTextEl) return;

  if (currentMode === "summary") {
    lumiTextEl.textContent = "잘했어! 네 질문들이 책을 읽을 때 생각의 길잡이가 되어 줄 거야.";
    return;
  }

  const step = steps[currentStepIndex];

  if (currentMode === "write") {
    lumiTextEl.textContent = "질문과 답을 적어 봐.\\n정답을 맞히는 것보다 책 내용을 상상하는 게 더 중요해!";
    return;
  }

  lumiTextEl.textContent = step.tip;
}

      =========================================================
      5. 예시 보기 / 질문 만들기 화면
      =========================================================

    function renderActivity() {
  const step = steps[currentStepIndex];
  const answer = answers[currentStepIndex];
  const activityCard = document.getElementById("activityCard");

    function checkAndGoNext() {
  const questionInput = document.getElementById("questionInput");
  const answerInput = document.getElementById("answerInput");
  const feedbackBox = document.getElementById("feedbackBox");

  if (!questionInput || !answerInput || !feedbackBox) {
    console.error("질문 입력칸, 답 입력칸 또는 피드백 상자를 찾지 못했습니다.");
    return;
  }

  /* 요청이 진행 중이면 버튼이 비활성화되어 있지만, 혹시 모를 중복 클릭을 한 번 더 막는다. */
  if (isPreReadingAiRequestInFlight || isSavingPreReadingResponse) {
    return;
  }

  const question = questionInput.value.trim();
  const expectedAnswer = answerInput.value.trim();

  const localResult = validatePreReadingQuestionAndAnswer(
    question,
    expectedAnswer,
    emptyQuestionMessages[steps[currentStepIndex].type]
  );

  feedbackBox.style.display = "flex";
  feedbackBox.classList.remove("good", "need");

  const feedbackMessage = feedbackBox.querySelector(".feedback-message");

  if (!localResult.ok) {
    feedbackBox.classList.add("need");

    if (feedbackMessage) {
      feedbackMessage.textContent = localResult.message;
    }

    /*
      형식 검사에서 걸렸으므로 AI 호출 없이 여기서 끝낸다.
      질문과 답의 연결성은 AI만 판단할 수 있으므로 통과 여부(passed)는
      AI가 good을 줄 때만 true가 된다(아래 requestFeedbackForCurrentStep 참고).
    */
    answers[currentStepIndex].passed = false;

    const nextStepButton = document.getElementById("nextStepButton");
    if (nextStepButton) {
      nextStepButton.disabled = true;
    }

    return;
  }

  answers[currentStepIndex].question = question;
  answers[currentStepIndex].expectedAnswer = expectedAnswer;

  requestFeedbackForCurrentStep(feedbackBox, question, expectedAnswer);
}

/*
  =========================================================
  읽기 전 AI 피드백 요청
  =========================================================
  실제 요청/타임아웃/버튼 잠금 로직은 js/pre-reading-validation.js의
  requestPreReadingAiFeedback()(개별읽기 읽기 전과 공용)를 그대로 쓰고,
  여기서는 이 화면의 DOM/상태만 연결한다.
*/
let preReadingAiRequestId = 0;
let isPreReadingAiRequestInFlight = false;
/* AI good 판정 이후 DB 저장이 진행되는 동안 중복 클릭을 막는 별도 플래그.
   pre-reading-validation.js의 자체 guard는 AI 요청이 끝나자마자 바로 풀리므로
   저장 단계까지는 지켜주지 못해 따로 둔다. */
let isSavingPreReadingResponse = false;

function requestFeedbackForCurrentStep(feedbackBox, question, answer) {
  const requestId = ++preReadingAiRequestId;
  const checkButton = document.getElementById("checkAnswerButton");
  const loadingMessage = feedbackBox.querySelector(".feedback-message");

  requestPreReadingAiFeedback({
  stepType: steps[currentStepIndex].type,
  bookTitle: selectedBook ? selectedBook.title : "",
  question: question,
  answer: answer,

  activityType: "pre_reading_question",
  questionType: steps[currentStepIndex].type,
  evaluationKey:
    "practice-before-" +
    selectedBook.bookId +
    "-" +
    studentId +
    "-" +
    steps[currentStepIndex].type,
  classReadingBookId: selectedBook.bookId,

  requestButton: checkButton,
    guard: {
      isRequesting: function () {
        return isPreReadingAiRequestInFlight;
      },
      setRequesting: function (value) {
        isPreReadingAiRequestInFlight = value;
      }
    },
    onLoading: function () {
      feedbackBox.classList.remove("good", "need");

      if (loadingMessage) {
        loadingMessage.textContent = "루미가 답변을 읽고 있어요...";
      }
    },
    onResult: function (result) {
      if (requestId !== preReadingAiRequestId || !document.body.contains(feedbackBox)) {
        return;
      }

      if (!result.isGood) {
        feedbackBox.classList.remove("good", "need");
        feedbackBox.classList.add("need");

        if (loadingMessage) {
          loadingMessage.textContent = result.message;
        }

        answers[currentStepIndex].passed = false;

        const nextStepButton = document.getElementById("nextStepButton");
        if (nextStepButton) {
          nextStepButton.disabled = true;
        }

        return;
      }

      /*
        AI가 good이어도 DB 저장에 실제로 성공했을 때만 이 단계를 통과 처리한다.
        저장 실패 시 need로 전환하고 다음 단계로 넘어가지 못하게 막는다.
      */
      const stepIndexAtRequest = currentStepIndex;
      const checkButton = document.getElementById("checkAnswerButton");

      isSavingPreReadingResponse = true;
      if (checkButton) {
        checkButton.disabled = true;
      }

      if (loadingMessage) {
        loadingMessage.textContent = "루미가 확인한 내용을 저장하고 있어요...";
      }

      savePreReadingResponse(steps[stepIndexAtRequest].type, question, answer)
        .then(function () {
          if (requestId !== preReadingAiRequestId || !document.body.contains(feedbackBox)) {
            return;
          }

          feedbackBox.classList.remove("good", "need");
          feedbackBox.classList.add("good");

          if (loadingMessage) {
            loadingMessage.textContent = result.message;
          }

          answers[stepIndexAtRequest].passed = true;

          const nextStepButton = document.getElementById("nextStepButton");
          if (nextStepButton) {
            nextStepButton.disabled = false;
          }

          renderTopProgress();
          renderSideSteps();
          updateQuestionCount();
        })
        .catch(function (error) {
          console.error("읽기 전 질문·답 저장에 실패했습니다.", error);

          if (requestId !== preReadingAiRequestId || !document.body.contains(feedbackBox)) {
            return;
          }

          feedbackBox.classList.remove("good", "need");
          feedbackBox.classList.add("need");

          if (loadingMessage) {
            loadingMessage.textContent = "저장하지 못했어. 다시 한 번 눌러줘.";
          }

          answers[stepIndexAtRequest].passed = false;

          const nextStepButton = document.getElementById("nextStepButton");
          if (nextStepButton) {
            nextStepButton.disabled = true;
          }
        })
        .finally(function () {
          isSavingPreReadingResponse = false;
          if (checkButton) {
            checkButton.disabled = false;
          }
        });
    }
  });
}
function goNextAfterFeedback() {
  if (currentStepIndex < steps.length - 1) {
    currentStepIndex++;
    currentMode = "write";
    renderAll();
  } else {
    currentMode = "summary";
    renderAll();
  }
}

/*
  =========================================================
  6-1. 차례 없음(스킵) 처리
  =========================================================
  차례가 없는 책을 위한 기능. 실제 질문·답을 작성한 것이 아니므로
  AI 검사 요청을 보내지 않고(AI 시도 기록/이력도 남기지 않는다),
  서버에는 question/answer를 빈 값으로, skipped=true로만 저장한다.
  이 단계는 "정상적으로 완료"된 것으로 취급하므로 passed는 그대로
  true를 쓴다(진행률·다음 버튼 활성화가 전부 passed 하나만 본다).
*/
/*
  체크를 통과하기 전(=아직 서버에 저장되지 않은) 상태에서 "차례 없음"을
  누르면 화면에 입력해 둔 초안을 조용히 지우지 않고 여기 잠깐 담아
  둔다. "차례 질문 작성하기"로 취소하면 그대로 되돌려 준다.
*/
let stashedContentsDraft = null;

async function skipContentsStep() {
  const stepIndex = currentStepIndex;
  const answer = answers[stepIndex];

  if (isPreReadingAiRequestInFlight || isSavingPreReadingResponse) {
    return;
  }

  /*
    이미 검사를 통과한 정상 질문·답이 저장되어 있다면(차례 없음이
    아니라 실제로 작성해서 통과한 상태), 되돌릴 수 없다는 것을
    학생에게 먼저 확인받는다 - 임의로 조용히 지우지 않는다.
  */
  if (answer.passed && !answer.skipped) {
    const confirmed = window.confirm(
      "작성한 차례 질문과 답이 있어요.\n" +
      "차례 없음으로 바꾸면 이 단계의 작성 내용은 사용하지 않게 됩니다.\n" +
      "계속할까요?"
    );

    if (!confirmed) {
      return;
    }

    stashedContentsDraft = null;
  } else if (!answer.passed) {
    const questionInput = document.getElementById("questionInput");
    const answerInput = document.getElementById("answerInput");
    const draftQuestion = questionInput ? questionInput.value.trim() : answer.question;
    const draftAnswer = answerInput ? answerInput.value.trim() : answer.expectedAnswer;

    stashedContentsDraft = (draftQuestion || draftAnswer)
      ? { question: draftQuestion, expectedAnswer: draftAnswer }
      : null;
  }

  const skipButton = document.querySelector(".bottom-row-right .plain-button");
  isSavingPreReadingResponse = true;
  if (skipButton) {
    skipButton.disabled = true;
  }

  try {
    await savePreReadingResponse(steps[stepIndex].type, "", "", true);

    answers[stepIndex] = {
      question: "",
      expectedAnswer: "",
      passed: true,
      skipped: true
    };

    renderAll();
  } catch (error) {
    console.error("차례 없음 처리에 실패했습니다.", error);
    alert("차례 없음 처리를 저장하지 못했어. 다시 시도해줘.");
  } finally {
    isSavingPreReadingResponse = false;
  }
}

/*
  "차례 없음" 취소(다시 차례 질문 작성하기). 서버에 저장된 skipped
  상태는 학생이 실제로 새 질문·답을 작성해 검사를 통과할 때(=
  requestFeedbackForCurrentStep의 저장 경로)만 덮어써진다 - 여기서는
  화면 상태만 "아직 완료하지 않음"으로 되돌려서 입력칸을 다시 활성화한다.
  아무것도 지우지 않고 그대로 두면(서버 쪽), 학생이 취소만 하고 새로
  작성하지 않은 채 새로고침해도 이전 차례 없음 상태가 안전하게 복원된다.
*/
function cancelContentsSkip() {
  const stepIndex = currentStepIndex;
  const answer = answers[stepIndex];

  answer.skipped = false;
  answer.passed = false;
  answer.question = stashedContentsDraft ? stashedContentsDraft.question : "";
  answer.expectedAnswer = stashedContentsDraft ? stashedContentsDraft.expectedAnswer : "";
  stashedContentsDraft = null;

  preReadingAiRequestId++;

  renderAll();
}

    /*
      =========================================================
      6-1. 1차 형식 검사 (AI 호출 전, 프론트에서 무의미한 입력을 차단)
      =========================================================
    */

    const emptyQuestionMessages = {
      title: "질문이 아직 비어 있어. 제목에서 궁금한 점을 한 문장으로 적어 봐!",
      contents: "질문이 아직 비어 있어. 차례를 보고 앞으로 어떤 일이 일어날지 궁금한 점을 적어 봐!",
      picture: "질문이 아직 비어 있어. 책 속 그림을 보고 인물, 표정, 장소, 물건에서 궁금한 점을 적어 봐!",
      skim: "질문이 아직 비어 있어. 글을 훑어보고 눈에 띄는 낱말이나 문장에서 궁금한 점을 적어 봐!"
    };

    /* 공백/구두점을 지운 나머지가 한글 자모(초성·모음)뿐이거나, 한글/영문 글자가 하나도 없으면 의미 없는 입력으로 본다. */
    function isJamoOrSymbolOnly(text) {
      const compact = text.replace(/[\s.?!~,·…ㆍ]/g, "");

      if (!compact) {
        return true;
      }

      const jamoOnlyPattern = /^[ㄱ-ㅎㅏ-ㅣ]+$/;
      const hasRealLetter = /[가-힣a-zA-Z]/;

      return jamoOnlyPattern.test(compact) || !hasRealLetter.test(compact);
    }

    /* 같은 글자 3번 이상 반복(가가가가가), 짧은 패턴 반복(abcabcabc, asdfasdf)을 잡아낸다. */
    function hasExcessiveRepetition(text) {
      const compact = text.replace(/[\s.?!~,·…ㆍ]/g, "");

      if (!compact) {
        return false;
      }

      if (/(.)\1{2,}/.test(compact)) {
        return true;
      }

      if (/^(.{2,6})\1+$/.test(compact)) {
        return true;
      }

      return false;
    }

    function countWithoutSpaces(text) {
      return text.replace(/\s/g, "").length;
    }

    /*
      물음표가 아니라 질문형 표현(왜/무엇/어떻게 등)이나 질문형 어미(~까, ~나요 등)로
      질문인지 판단한다. 이 목록에 하나도 걸리지 않으면 질문으로 보지 않는다.
    */
    function looksLikeQuestion(text) {
      const questionWordPattern = /왜|무엇|무슨|뭐|누구|누가|어디|언제|어떻게|어떤|어느|몇/;

      if (questionWordPattern.test(text)) {
        return true;
      }

      const stripped = text.replace(/[\s.?!~,·…ㆍ]+$/g, "");
      const questionEndingPattern = /(까요?|나요|가요|는지|은지|인지|일지|인가|한가)$/;

      return questionEndingPattern.test(stripped);
    }

    function validateQuestionAndAnswer(question, expectedAnswer) {
      if (!question) {
        return {
          ok: false,
          failedRule: "INVALID_INPUT",
          message: emptyQuestionMessages[steps[currentStepIndex].type]
        };
      }

      if (isJamoOrSymbolOnly(question)) {
        return {
          ok: false,
          failedRule: "INVALID_INPUT",
          message: "질문의 뜻이 잘 보이지 않아요. 궁금한 점을 문장으로 다시 적어 보세요."
        };
      }

      if (hasExcessiveRepetition(question)) {
        return {
          ok: false,
          failedRule: "REPEATED_INPUT",
          message: "같은 글자가 너무 많이 반복됐어요. 궁금한 내용을 문장으로 적어 보세요."
        };
      }

      if (countWithoutSpaces(question) < 5) {
        return {
          ok: false,
          failedRule: "TOO_SHORT",
          message: "질문이 너무 짧아요. 무엇이 궁금한지 조금 더 자세히 적어 보세요."
        };
      }

      if (!looksLikeQuestion(question)) {
        return {
          ok: false,
          failedRule: "NOT_A_QUESTION",
          message: "질문의 뜻이 잘 보이지 않아요. 궁금한 점을 문장으로 다시 적어 보세요."
        };
      }

      if (!expectedAnswer) {
        return {
          ok: false,
          failedRule: "INVALID_INPUT",
          message: "내가 생각한 답도 적어 줘. 아직 읽기 전이니까 상상해서 답해도 괜찮아!"
        };
      }

      if (isJamoOrSymbolOnly(expectedAnswer)) {
        return {
          ok: false,
          failedRule: "INVALID_INPUT",
          message: "답의 뜻이 잘 보이지 않아요. 내가 예상한 답을 문장으로 다시 적어 보세요."
        };
      }

      if (hasExcessiveRepetition(expectedAnswer)) {
        return {
          ok: false,
          failedRule: "REPEATED_INPUT",
          message: "같은 글자가 너무 많이 반복됐어요. 예상한 답을 문장으로 적어 보세요."
        };
      }

      if (countWithoutSpaces(expectedAnswer) < 3) {
        return {
          ok: false,
          failedRule: "TOO_SHORT",
          message: "답이 너무 짧아요. 왜 그렇게 생각했는지 조금 더 자세히 적어 보세요."
        };
      }

      const normalizedQuestion = question.replace(/\s/g, "");
      const normalizedAnswer = expectedAnswer.replace(/\s/g, "");

      if (normalizedQuestion === normalizedAnswer) {
        return {
          ok: false,
          failedRule: "LOW_EFFORT_ANSWER",
          message: "질문을 그대로 답으로 적었어요. 내가 예상한 답을 새로 생각해서 적어 보세요."
        };
      }

      const weakAnswers = ["몰라", "모르겠다", "없다", "없음", "그냥", "모름", "아무거나"];

      if (weakAnswers.includes(normalizedAnswer)) {
        return {
          ok: false,
          failedRule: "LOW_EFFORT_ANSWER",
          message: "조금 더 상상해서 답해 보자. 정답이 아니어도 괜찮으니까 ‘~일 것 같다’처럼 써 보면 좋아!"
        };
      }

      return {
        ok: true,
        message: "형식을 확인했어요. 루미에게 검사를 부탁할게요!"
      };
    }

    /*
      =========================================================
      7. 요약 화면
      =========================================================
    */

    function showSummary() {
      currentMode = "summary";
      renderAll();
    }

    function renderSummary() {
      const activityCard = document.getElementById("activityCard");

      activityCard.innerHTML =
        '<div class="activity-head">' +
          '<div>' +
            '<h2 class="activity-title">내가 만든 읽기 전 질문 확인하기</h2>' +
          '</div>' +
        '</div>' +

        '<div class="summary-list">' +
          steps.map(function(step, index) {
            const item = answers[index];

            return '<article class="summary-item">' +
              '<h3 class="summary-title">' + step.number + '. ' + step.title + '</h3>' +
              '<p class="summary-text"><strong>질문</strong> · ' + (item.skipped ? "차례가 없어 건너뛰었어요." : (item.question || "아직 작성하지 않았어요.")) + '</p>' +
              '<p class="summary-text"><strong>답</strong> · ' + (item.skipped ? "차례가 없어 건너뛰었어요." : (item.expectedAnswer || "아직 작성하지 않았어요.")) + '</p>' +
            '</article>';
          }).join("") +
        '</div>' +

        '<div class="bottom-row">' +
          '<div></div>' +

          '<div class="action-area">' +
            '<button class="plain-button" type="button" onclick="editIncompleteOrFirst()">수정하기</button>' +
            '<button class="main-button" type="button" onclick="completeAndGoPractice()">읽기 단계 선택으로 이동 →</button>' +
          '</div>' +
        '</div>';
    }

    function editIncompleteOrFirst() {
      const incompleteIndex = answers.findIndex(function(item) {
        return !item.passed;
      });

      currentStepIndex = incompleteIndex === -1 ? 0 : incompleteIndex;
      currentMode = "write";
      renderAll();
    }

    // 질문 4개를 모두 완성하면 읽기 전 질문 공유하기 화면은 건너뛰고,
    // 바로 읽기 전/중/후 3단계 선택 화면(practice.html)으로 이동합니다.
    async function completeAndGoPractice() {
  const incompleteIndex = answers.findIndex(function(item) {
    return !item.passed;
  });

  if (incompleteIndex !== -1) {
    currentStepIndex = incompleteIndex;
    currentMode = "write";
    renderAll();

    setTimeout(function() {
      const feedbackBox = document.getElementById("feedbackBox");

      feedbackBox.style.display = "flex";
      feedbackBox.classList.add("need");

      feedbackBox.querySelector(".feedback-message").textContent =
        "아직 완성하지 않은 질문이 있어. 이 질문과 답을 완성하면 다음 단계로 갈 수 있어!";
    }, 100);

    return;
  }

  // 기존 질문과 답을 임시 저장합니다.
  

  const studentId = sessionStorage.getItem("studentId");
  const token = sessionStorage.getItem("token");

  if (!studentId || !token) {
    alert("로그인 정보가 없습니다. 다시 로그인해 주세요.");
    return;
  }

  try {
    const response = await fetch(
      `http://localhost:8080/api/students/${studentId}/practice-progress`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          bookSelected: true,
          beforeDone: true
        })
      }
    );

    if (!response.ok) {
      throw new Error("읽기 전 완료 상태 저장에 실패했습니다.");
    }

    // 저장 성공 후 연습읽기 단계 선택 화면으로 이동합니다.
    location.href = "./practice.html";

  } catch (error) {
    console.error(error);
    alert("읽기 전 완료 상태를 저장하지 못했습니다.");
  }
}
    /*
      =========================================================
      8. 이동 함수
      =========================================================
    */

    function goPrevious() {
      if (currentStepIndex === 0) {
        currentMode = "write";
        renderAll();
        return;
      }

      currentStepIndex--;
      currentMode = "write";
      renderAll();
    }

    // 상단 "책읽기 홈" 버튼을 누르면 개별읽기 메인 홈으로 이동합니다.
    function goIndividualReading() {
      location.href = "./individual-reading.html";
    }

    function goPractice() {
      location.href = "./practice.html";
    }
  </script>
  <script src="../js/fixed-stage.js"></script>
</body>
</html>
