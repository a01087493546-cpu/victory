<!--
  파일명: before-reading.html
  역할: 문답책 프로젝트의 읽기 전 질문 만들기 화면입니다.

  화면 흐름:
  1. 책 고르기/투표로 결정된 책을 기준으로 읽기 전 질문을 만듭니다.
  2. 제목 → 차례 → 책 속 그림 → 글 훑어보기 순서로 진행합니다.
  3. 각 단계는 예시 보기와 질문 만들기 화면으로 구성됩니다.
  4. 질문과 내가 생각한 답을 적고, 루미의 피드백을 받은 뒤 다음 단계로 넘어갑니다.
  5. 모든 질문을 완성하면 공유하기 화면으로 이동합니다.

  백엔드 연동 준비:
  - 현재는 sessionStorage와 mock 데이터를 사용합니다.
  - 나중에 API 함수 부분만 fetch 코드로 바꾸면 됩니다.
-->

    /*
      =========================================================
      3. 초기 실행
      =========================================================
    */

    initPage();

    function initPage() {
      selectedBook = getSelectedBook();

      document.getElementById("bookTitle").textContent = "「" + selectedBook.title + "」";
      document.getElementById("bookMeta").textContent = "작가: " + selectedBook.author;

      renderAll();
    }

    // 책 고르기/투표에서 저장된 책이 있으면 사용하고, 없으면 예시 책을 사용합니다.
    function getSelectedBook() {
      const savedBook = sessionStorage.getItem("selectedBook");

      if (savedBook) {
        try {
          return JSON.parse(savedBook);
        } catch (error) {
          console.warn("선정 도서 데이터를 읽을 수 없어 예시 책을 사용합니다.", error);
        }
      }

      return defaultBook;
    }

    function renderAll() {
  renderTopProgress();
  renderSideSteps();

  if (currentMode === "summary") {
    renderSummary();
  } else {
    renderActivity();
  }

  updateQuestionCount();
}

    /*
      =========================================================
      4. 진행도 표시
      =========================================================
    */

    function renderTopProgress() {
      const topProgress = document.getElementById("topProgress");
      topProgress.innerHTML = "";

      steps.forEach(function(step, index) {
        const item = document.createElement("div");
        item.className = "progress-step";

        if (index === currentStepIndex) {
          item.classList.add("active");
        }

        if (answers[index].passed) {
          item.classList.add("done");
        }

        item.innerHTML =
          '<div class="progress-circle">' + step.number + '</div>' +
          '<div>' + step.short + '</div>';

        topProgress.appendChild(item);

        if (index < steps.length - 1) {
          const line = document.createElement("div");
          line.className = "progress-line";
          topProgress.appendChild(line);
        }
      });
    }

    function renderSideSteps() {
      const sideSteps = document.getElementById("sideSteps");
      sideSteps.innerHTML = "";

      steps.forEach(function(step, index) {
        const button = document.createElement("button");
        button.className = "side-step";

        if (index === currentStepIndex && currentMode !== "summary") {
          button.classList.add("active");
        }

        if (answers[index].passed) {
          button.classList.add("done");
        }

        button.onclick = function() {
          currentStepIndex = index;
          currentMode = "example";
          renderAll();
        };

        button.innerHTML =
          '<span class="side-num">' + step.number + '</span>' +
          '<span>' +
            '<span class="side-main">' + step.title + '</span>' +
            '<span class="side-sub">' + (answers[index].passed ? "완성됨" : "예시 보고 작성하기") + '</span>' +
          '</span>';

        sideSteps.appendChild(button);
      });
    }

    function updateQuestionCount() {
      const count = answers.filter(function(item) {
        return item.passed;
      }).length;

      document.getElementById("questionCount").textContent = "(" + count + "/4)";
    }

    function updateLumiText() {
      if (currentMode === "summary") {
        document.getElementById("lumiText").textContent =
          "잘했어! 네 질문들이 책을 읽을 때 생각의 길잡이가 되어 줄 거야.";
        return;
      }

      const step = steps[currentStepIndex];

      if (currentMode === "write") {
        document.getElementById("lumiText").textContent =
          "질문과 답을 적어 봐.\\n정답을 맞히는 것보다 책 내용을 상상하는 게 더 중요해!";
        return;
      }

      document.getElementById("lumiText").textContent = step.tip;
    }

    /*
      =========================================================
      5. 예시 보기 / 질문 만들기 화면
      =========================================================
    */

    function renderActivity() {
      const step = steps[currentStepIndex];
      const answer = answers[currentStepIndex];
      const activityCard = document.getElementById("activityCard");

      activityCard.innerHTML =
        '<div class="activity-head">' +
          '<div>' +
            '<h2 class="activity-title">' + step.number + '. ' + step.title + '</h2>' +
            '<p class="activity-desc">' + step.desc + '</p>' +
          '</div>' +

          '<div class="tab-box">' +
            '<button class="tab-button ' + (currentMode === "example" ? "active" : "") + '" onclick="setMode(\'example\')">예시 보기</button>' +
'<button class="tab-button ' + (currentMode === "write" ? "active" : "") + '" onclick="setMode(\'write\')">질문 만들기</button>' +
        '</div>' +

        '<div class="content-grid">' +
          '<section class="example-panel">' +
            '<div class="panel-title-row">' +
              '<h3 class="panel-title">📖 예시 질문</h3>' +
              '<span class="book-tag">이 책의 제목: ' + selectedBook.title + '</span>' +
            '</div>' +

            '<div class="example-list">' +
              step.examples.map(function(example, index) {
                return '<article class="example-item">' +
                  '<div class="example-num">' + (index + 1) + '</div>' +
                  '<div>' +
                    '<p class="example-question">' + example.q + '</p>' +
                    '<p class="example-answer">' + example.a + '</p>' +
                  '</div>' +
                '</article>';
              }).join("") +
            '</div>' +
          '</section>' +

          '<section class="write-panel">' +
            '<div class="panel-title-row">' +
              '<h3 class="panel-title">나만의 질문을 만들어 볼까요?</h3>' +
              '<span class="book-tag">질문은 하나만 적어도 좋아요!</span>' +
            '</div>' +

            '<div class="input-block">' +
              '<div class="input-label-row">' +
                '<label class="input-label" for="questionInput">내가 만든 읽기 전 질문</label>' +
                '<span class="input-help" id="questionLength">0 / 100</span>' +
              '</div>' +
              '<textarea id="questionInput" maxlength="100" placeholder="' + step.questionPlaceholder + '">' + answer.question + '</textarea>' +
            '</div>' +

            '<div class="input-block">' +
              '<div class="input-label-row">' +
                '<label class="input-label" for="answerInput">내가 생각한 답</label>' +
                '<span class="input-help" id="answerLength">0 / 200</span>' +
              '</div>' +
              '<textarea id="answerInput" maxlength="200" placeholder="' + step.answerPlaceholder + '">' + answer.expectedAnswer + '</textarea>' +
            '</div>' +

          '<div class="feedback-box feedback-box-with-lumi" id="feedbackBox">' +
  '<img class="feedback-lumi" src="../assets/images/read-before/intro/pre-reading-lumi-question-note.png" alt="피드백을 주는 루미">' +
  '<div class="feedback-message">질문과 답을 적고 저장하면 루미가 피드백을 줄게!</div>' +
'</div>' +
          '</section>' +
        '</div>' +

        '<div class="bottom-row">' +
  '<div></div>' +

  '<div class="action-area">' +
    '<button class="plain-button" type="button" onclick="goPrevious()">← 이전 단계</button>' +
    '<button class="main-button" type="button" onclick="checkAndGoNext()">저장하고 다음 →</button>' +
  '</div>' +
'</div>';

      bindTextareaEvents();
      updateTextareaCount();
    }

    function setMode(mode) {
      currentMode = mode;
      renderAll();
    }

    function bindTextareaEvents() {
      const questionInput = document.getElementById("questionInput");
      const answerInput = document.getElementById("answerInput");

      questionInput.addEventListener("input", updateTextareaCount);
      answerInput.addEventListener("input", updateTextareaCount);
    }

    function updateTextareaCount() {
      const questionInput = document.getElementById("questionInput");
      const answerInput = document.getElementById("answerInput");

      if (!questionInput || !answerInput) {
        return;
      }

      document.getElementById("questionLength").textContent = questionInput.value.length + " / 100";
      document.getElementById("answerLength").textContent = answerInput.value.length + " / 200";
    }

    /*
      =========================================================
      6. 질문/답 피드백 검사
      =========================================================
    */

    function checkAndGoNext() {
      const questionInput = document.getElementById("questionInput");
      const answerInput = document.getElementById("answerInput");
      const feedbackBox = document.getElementById("feedbackBox");

      const question = questionInput.value.trim();
      const expectedAnswer = answerInput.value.trim();

      const result = validateQuestionAndAnswer(question, expectedAnswer);

      feedbackBox.classList.remove("good", "need");
      feedbackBox.classList.add(result.ok ? "good" : "need");
      feedbackBox.querySelector(".feedback-message").textContent = result.message;

      if (!result.ok) {
        return;
      }

      answers[currentStepIndex].question = question;
      answers[currentStepIndex].expectedAnswer = expectedAnswer;
      answers[currentStepIndex].passed = true;

      setTimeout(function() {
        if (currentStepIndex < steps.length - 1) {
          currentStepIndex++;
          currentMode = "example";
          renderAll();
        } else {
          currentMode = "summary";
          renderAll();
        }
      }, 900);
    }

    function validateQuestionAndAnswer(question, expectedAnswer) {
      if (!question) {
  const emptyQuestionMessages = {
    title: "질문이 아직 비어 있어. 제목에서 궁금한 점을 한 문장으로 적어 봐!",
    contents: "질문이 아직 비어 있어. 차례를 보고 앞으로 어떤 일이 일어날지 궁금한 점을 적어 봐!",
    picture: "질문이 아직 비어 있어. 책 속 그림을 보고 인물, 표정, 장소, 물건에서 궁금한 점을 적어 봐!",
    skim: "질문이 아직 비어 있어. 글을 훑어보고 눈에 띄는 낱말이나 문장에서 궁금한 점을 적어 봐!"
  };

  return {
    ok: false,
    message: emptyQuestionMessages[steps[currentStepIndex].type]
  };
}

      if (question.length < 8) {
        return {
          ok: false,
          message: "질문이 조금 짧아. 무엇이 궁금한지 더 자세히 적어 보면 좋아!"
        };
      }

      if (!question.includes("?") && !question.includes("까") && !question.includes("왜") && !question.includes("어떤") && !question.includes("무슨")) {
        return {
          ok: false,
          message: "질문처럼 보이도록 바꿔 보자. 예를 들면 ‘왜 ~일까?’, ‘어떤 일이 생길까?’처럼 적으면 좋아!"
        };
      }

      if (!expectedAnswer) {
        return {
          ok: false,
          message: "내가 생각한 답도 적어 줘. 아직 읽기 전이니까 상상해서 답해도 괜찮아!"
        };
      }

      if (expectedAnswer.length < 8) {
        return {
          ok: false,
          message: "답이 조금 짧아. 왜 그렇게 생각했는지 한 문장만 더 자세히 적어 봐!"
        };
      }

      const weakAnswers = ["몰라", "모르겠다", "없다", "그냥", "모름"];

      if (weakAnswers.includes(expectedAnswer.replaceAll(" ", ""))) {
        return {
          ok: false,
          message: "조금 더 상상해서 답해 보자. 정답이 아니어도 괜찮으니까 ‘~일 것 같다’처럼 써 보면 좋아!"
        };
      }

      return {
        ok: true,
        message: "좋아! 책을 읽기 전에 내용을 짐작해 볼 수 있는 질문이야. 다음 단서도 살펴보자!"
      };
    }

    /*
      =========================================================
      7. 요약 화면
      =========================================================
    */

    function showSummary() {
      currentMode = "summary";
      renderAll();
    }

    function renderSummary() {
      const activityCard = document.getElementById("activityCard");

      activityCard.innerHTML =
        '<div class="activity-head">' +
          '<div>' +
            '<h2 class="activity-title">내가 만든 읽기 전 질문 확인하기</h2>' +
            '<p class="activity-desc">완성한 질문은 공유하기 화면에서 친구들과 함께 볼 수 있어요.</p>' +
          '</div>' +
        '</div>' +

        '<div class="summary-list">' +
          steps.map(function(step, index) {
            const item = answers[index];

            return '<article class="summary-item">' +
              '<h3 class="summary-title">' + step.number + '. ' + step.title + '</h3>' +
              '<p class="summary-text"><strong>질문</strong> · ' + (item.question || "아직 작성하지 않았어요.") + '</p>' +
              '<p class="summary-text"><strong>내가 생각한 답</strong> · ' + (item.expectedAnswer || "아직 작성하지 않았어요.") + '</p>' +
            '</article>';
          }).join("") +
        '</div>' +

        '<div class="bottom-row">' +
          '<div class="small-note">✨ 모두 완성하면 공유하기 화면에서 친구들의 질문도 볼 수 있어요.</div>' +

          '<div class="action-area">' +
            '<button class="plain-button" type="button" onclick="editIncompleteOrFirst()">수정하기</button>' +
            '<button class="main-button" type="button" onclick="completeAndGoShare()">공유하기로 이동 →</button>' +
          '</div>' +
        '</div>';
    }

    function editIncompleteOrFirst() {
      const incompleteIndex = answers.findIndex(function(item) {
        return !item.passed;
      });

      currentStepIndex = incompleteIndex === -1 ? 0 : incompleteIndex;
      currentMode = "write";
      renderAll();
    }

    function completeAndGoShare() {
      const incompleteIndex = answers.findIndex(function(item) {
        return !item.passed;
      });

      if (incompleteIndex !== -1) {
        currentStepIndex = incompleteIndex;
        currentMode = "write";
        renderAll();

        setTimeout(function() {
          const feedbackBox = document.getElementById("feedbackBox");
          feedbackBox.classList.add("need");
         feedbackBox.querySelector(".feedback-message").textContent =
  "아직 완성하지 않은 질문이 있어. 이 질문과 답을 완성하면 공유하기로 갈 수 있어!";
        }, 100);

        return;
      }

      saveBeforeReadingData();

      location.href = "./before-reading-share.html";
    }

    function saveBeforeReadingData() {
      const payload = {
        studentId: studentId,
        studentName: studentName,
        bookId: selectedBook.bookId,
        bookTitle: selectedBook.title,
        questions: steps.map(function(step, index) {
          return {
            type: step.type,
            typeName: step.title,
            question: answers[index].question,
            expectedAnswer: answers[index].expectedAnswer
          };
        })
      };

      sessionStorage.setItem("beforeReadingQuestions_" + studentId, JSON.stringify(payload));
      console.log("읽기 전 질문 저장 데이터:", payload);
    }

    /*
      =========================================================
      8. 이동 함수
      =========================================================
    */

    function goPrevious() {
      if (currentStepIndex === 0) {
        currentMode = "example";
        renderAll();
        return;
      }

      currentStepIndex--;
      currentMode = "example";
      renderAll();
    }

    function goHome() {
      location.href = "./home.html";
    }

    function goPractice() {
      location.href = "./practice.html";
    }
  </script>
  <script src="../js/fixed-stage.js"></script>
