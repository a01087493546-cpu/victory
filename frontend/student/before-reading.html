<!--
  파일명: before-reading.html
  역할: 문답책 프로젝트의 읽기 전 질문 만들기 화면입니다.

  화면 흐름:
  1. 책 고르기/투표로 결정된 책을 기준으로 읽기 전 질문을 만듭니다.
  2. 제목 → 차례 → 책 속 그림 → 글 훑어보기 순서로 진행합니다.
  3. 각 단계는 예시 보기와 질문 만들기 화면으로 구성됩니다.
  4. 질문과 내가 생각한 답을 적고, 루미의 피드백을 받은 뒤 다음 단계로 넘어갑니다.
  5. 모든 질문을 완성하면 공유하기 화면으로 이동합니다.

  백엔드 연동 준비:
  - 현재는 sessionStorage와 mock 데이터를 사용합니다.
  - 나중에 API 함수 부분만 fetch 코드로 바꾸면 됩니다.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>문답책 - 읽기 전 질문 만들기</title>

  <style>
    
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #fff2dc;
      background:
        linear-gradient(rgba(10, 7, 5, 0.58), rgba(10, 7, 5, 0.68)),
        url("../assets/images/home/home-library-bg.png");
      background-size: cover;
      background-position: center;
      overflow-x: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

   .page {
  position: relative;
  min-height: 100vh;
  padding: 14px 28px 22px;
  background:
    linear-gradient(
      rgba(255, 246, 226, 0.42),
      rgba(235, 209, 164, 0.52)

    .page::before {

      inset: 0;

    .page-inner {

    /* 상단 메뉴 */
   .top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-button {
      border: 1px solid rgba(236, 198, 127, 0.22);

    .my-count {

      font-weight: 900;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
    }

    /* 책 정보 + 진행도 + 루미 */
  .top-info {

  grid-template-columns: 1fr;
  gap: 14px;
  align-items: stretch;
  margin-bottom: 14px;
}

    .book-icon {

  height: 58px;

.book-icon-image {
  width: 58px;
  height: 58px;
  object-fit: contain;
  display: block;
}
    .book-small-label {
      margin-bottom: 8px;
      color: #f2d38b;
      font-size: 15px;
      font-weight: 900;
    }

   .book-title {
  font-family: "Noto Serif KR", serif;
  color: #fff6e4;
  font-size: 27px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .book-meta {
      margin-top: 6px;
      color: rgba(255, 241, 214, 0.66);
      font-size: 15px;
      font-weight: 800;
    }

    .step-progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-step {
      display: grid;
      place-items: center;
      gap: 7px;
      color: rgba(255, 237, 205, 0.62);
      font-size: 14px;
      font-weight: 900;

    .progress-circle {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border-radius: 999px;
      border: 2px solid rgba(239, 206, 145, 0.24);

      color: rgba(255, 237, 205, 0.8);

    .progress-step.active .progress-circle {

    .progress-step.done .progress-circle {

    }

    .progress-line {
      flex: 1;
      height: 2px;
      background: rgba(230, 203, 154, 0.18);
      margin-top: -25px;
    }

    .lumi-zone {
      position: relative;
      min-height: 118px;
      border-radius: 24px;
    }

    .lumi-bubble {
      position: absolute;
      left: 0;
      top: 10px;
      width: 270px;
      padding: 18px 20px;
      border-radius: 20px;
      background: rgba(61, 43, 27, 0.88);

      color: #f4c873;
      font-size: 15px;
      font-weight: 900;
    }

    .lumi-text {
      color: #fff0d2;
      font-size: 16px;
      font-weight: 850;
      line-height: 1.58;
      word-break: keep-all;
      white-space: pre-line;
    }

    .lumi-img {
      position: absolute;
      right: -4px;
      bottom: -10px;
      width: 185px;
      max-height: 150px;
      object-fit: contain;
      filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.34));

    /* 메인 활동 영역 */
    .activity-layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 22px;
      align-items: stretch;
    }

    .side-steps {
      padding: 18px 0;
      border-radius: 24px;
      border: 1px solid rgba(238, 207, 150, 0.18);
      background: rgba(19, 15, 11, 0.72);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(6px);
      overflow: hidden;
    }

    .side-step {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      padding: 24px 22px;
      border: none;
      border-bottom: 1px solid rgba(238, 207, 150, 0.09);
      background: transparent;
      color: rgba(255, 239, 210, 0.68);
      text-align: left;
      transition: 0.18s ease;
    }

    .side-step:last-child {
      border-bottom: none;
    }

    .side-step:hover {
      background: rgba(255, 223, 158, 0.06);
    }

    .side-step.active {
      background:
        linear-gradient(90deg, rgba(217, 154, 45, 0.22), rgba(217, 154, 45, 0.03));
      color: #fff1d4;
      box-shadow: inset 4px 0 0 #f0bf62;
    }

    .side-step.done {
      color: #e3ffe0;
    }

    .side-num {
      display: grid;
      place-items: center;
      min-width: 48px;
      height: 48px;
      border-radius: 999px;
      border: 2px solid rgba(238, 207, 150, 0.24);
      font-size: 18px;
      font-weight: 900;
    }

    .side-step.active .side-num {
      border-color: #ffd77d;
      background: radial-gradient(circle, #ffe29e 0%, #c4862d 76%);
      color: #3e2813;
      box-shadow: 0 0 22px rgba(239, 191, 91, 0.36);

    .side-main {
      display: block;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.35;
      word-break: keep-all;
    }

    .activity-card {
  min-height: 640px;
  padding: 34px 40px 30px;
      border-radius: 28px;
      background: rgba(255, 248, 235, 0.94);
      color: #312419;
      box-shadow:
        0 22px 44px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.78);
    }

    .activity-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  margin-bottom: 28px;
}

    .activity-title {
      font-family: "Noto Serif KR", serif;
      color: #2e2117;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.9px;
      word-break: keep-all;
white-space: normal;
    }

    .tab-box {
  display: flex;
  width: 230px;
  max-width: 100%;
  margin-left: auto;
  border-radius: 18px;
  overflow: hidden;
  background: #d6bd95;
  border: 2px solid #9e7544;
  box-shadow:

}

    .tab-button {
      width: 100%;

      padding: 18px 24px;
      background: linear-gradient(180deg, #d8bd91, #bf9863);
      color: #2f2116;
      font-size: 20px;
      font-weight: 900;

    }

    .tab-button.active {
      background: linear-gradient(180deg, #f3dfbd, #cda36b);
      box-shadow:
        inset 0 0 0 2px rgba(89, 56, 24, 0.18),
        0 0 0 1px rgba(255, 248, 232, 0.55);
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .activity-card.is-write .content-grid {
      min-height: 474px;
    }

    .activity-card.is-example .content-grid {
      min-height: 474px;
    }

    .example-panel,
    .write-panel {
      width: 100%;
      padding: 34px;
      border-radius: 20px;
      background: #f6ead8;
      border: 2px solid #d6bd95;
    }

    .write-panel {
      min-height: 420px;
    }

    .write-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .write-grid .input-block {
      margin-bottom: 0;
    }

    .example-panel {
      min-height: 470px;
    }

    .panel-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
    }

    .panel-title {
      color: #3a2a1c;
      font-size: 25px;
      font-weight: 900;
    }

    .book-tag {
      padding: 10px 16px;
      border-radius: 999px;
      background: #e7d0ad;
      color: #5a4734;
      font-size: 16px;
      font-weight: 900;
    }

    .example-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .example-item {
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 18px;
  align-items: start;
  padding: 26px 24px;
      min-height: 230px;
      border-radius: 20px;
      background: #fff7e9;
      border: 2px solid #d9bf95;
    }

    .example-content {
      display: grid;
      gap: 14px;
    }

    .example-label {
      display: inline-flex;
      width: fit-content;
      margin-bottom: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      background: #d8bd91;
      color: #2f2116;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
    }

    .example-num {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: linear-gradient(180deg, #d9b06b, #9a6b36);
      color: #fff8df;
      font-size: 22px;
      font-weight: 900;
    }

    .example-question {
      color: #3b2a1b;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.38;
      word-break: keep-all;
    }

    .example-answer {
      color: #5f4a36;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.48;
      word-break: keep-all;
    }

    .input-block {
      margin-bottom: 18px;
    }

    .input-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      gap: 12px;
    }

    .input-label {
      color: #3b2a1b;
      font-size: 17px;
      font-weight: 900;
    }

    .input-help {
      color: #b48938;
      font-size: 14px;
      font-weight: 900;
    }

   textarea {
  width: 100%;
  min-height: 292px;
      resize: none;
      border: 1px solid #dec9a8;
      border-radius: 18px;
      outline: none;
      padding: 16px;
      background: #fffdf8;
      color: #33261b;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.55;
    }

    #answerInput {
      min-height: 292px;
    }

    textarea:focus {
      border-color: #c88d24;
      box-shadow: 0 0 0 4px rgba(216, 158, 50, 0.14);
    }

    .feedback-box {
      min-height: 70px;
      margin-top: 14px;
      padding: 16px 18px;
      border-radius: 18px;
      background: #fff3d5;
      border: 1px solid #eac675;
      color: #5a3e19;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.55;
      word-break: keep-all;

    }

    .feedback-box.good {

      border-color: #b7d991;
      color: #355628;
    }

    .feedback-box.need {
      background: #fff0df;

.feedback-box-with-lumi {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 82px;
}

.feedback-lumi {

.feedback-message {

}
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      gap: 14px;
    }

    .small-note {
      flex: 1;
      padding: 16px 18px;
      border-radius: 16px;
      background: #fff2cf;
      border: 1px solid #e7c574;
      color: #5a421c;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.5;
    }

    .action-area {
      display: flex;
      gap: 12px;
    }

    .plain-button,
    .main-button {
      border: none;
      border-radius: 16px;
      padding: 17px 28px;
      font-size: 18px;
      font-weight: 900;
      transition: 0.18s ease;
    }

    .plain-button {
      background: #d8cab5;
      color: #6c5a48;
    }

    .main-button {
      background: linear-gradient(180deg, #dca328, #bd7908);
      color: #fff7e4;
      box-shadow: 0 10px 18px rgba(143, 91, 8, 0.24);
    }

    .plain-button:hover,
    .main-button:hover {
      transform: translateY(-2px);
    }

    .summary-list {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .summary-item {
      padding: 18px;
      border-radius: 18px;
      background: #fffaf0;
      border: 1px solid #ead9bd;
    }

    .summary-title {
      margin-bottom: 8px;
      color: #bb7d13;
      font-size: 17px;
      font-weight: 900;
    }

    .summary-text {
      color: #443123;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.55;
    }

    @media (max-width: 1100px) {
      .top-info,
      .activity-layout,
      .content-grid {
        grid-template-columns: 1fr;
      }

      .book-strip {
        grid-template-columns: 80px 1fr;
      }

      .step-progress {
        grid-column: 1 / -1;
        margin-top: 18px;
      }

      .lumi-zone {
        min-height: 150px;
      }
    }
    /* 읽기 전 질문 만들기 화면: 왼쪽 단계 메뉴 제거 + 카드 확대 */
.read-before-layout,
.before-reading-layout,
.question-layout,
.practice-layout,
.step-layout {
  grid-template-columns: 1fr !important;
  display: grid !important;
}

.left-step-menu,
.step-side-menu,
.step-sidebar,
.before-step-list,
.read-before-sidebar,
.activity-step-list,

    function initPage() {
      selectedBook = getSelectedBook();

      document.getElementById("bookTitle").textContent = "「" + selectedBook.title + "」";
      document.getElementById("bookMeta").textContent = "작가: " + selectedBook.author;

      renderAll();
    }

    // 책 고르기/투표에서 저장된 책이 있으면 사용하고, 없으면 예시 책을 사용합니다.
    function getSelectedBook() {
      const savedBook = sessionStorage.getItem("selectedBook");

      if (savedBook) {
        try {
          return JSON.parse(savedBook);
        } catch (error) {
          console.warn("선정 도서 데이터를 읽을 수 없어 예시 책을 사용합니다.", error);
        }
      }

      return defaultBook;
    }

    function renderAll() {
  renderTopProgress();
  renderSideSteps();

  if (currentMode === "summary") {
    renderSummary();
  } else {
    renderActivity();
  }

  updateQuestionCount();
}

    /*
      =========================================================
      4. 진행도 표시
      =========================================================
    */

    function renderTopProgress() {
      const topProgress = document.getElementById("topProgress");
      topProgress.innerHTML = "";

      steps.forEach(function(step, index) {
        const item = document.createElement("div");
        item.className = "progress-step";

        if (index === currentStepIndex) {
          item.classList.add("active");
        }

        if (answers[index].passed) {
          item.classList.add("done");
        }

        item.innerHTML =
          '<div class="progress-circle">' + step.number + '</div>' +
          '<div>' + step.short + '</div>';

        topProgress.appendChild(item);

        if (index < steps.length - 1) {
          const line = document.createElement("div");
          line.className = "progress-line";
          topProgress.appendChild(line);
        }
      });
    }

    function renderSideSteps() {
      const sideSteps = document.getElementById("sideSteps");
      sideSteps.innerHTML = "";

      steps.forEach(function(step, index) {
        const button = document.createElement("button");
        button.className = "side-step";

        if (index === currentStepIndex && currentMode !== "summary") {
          button.classList.add("active");
        }

        if (answers[index].passed) {
          button.classList.add("done");
        }

        button.onclick = function() {
          currentStepIndex = index;
          currentMode = "write";
          renderAll();
        };

        button.innerHTML =
          '<span class="side-num">' + step.number + '</span>' +
          '<span>' +
            '<span class="side-main">' + step.title + '</span>' +
          '</span>';

        sideSteps.appendChild(button);
      });
    }

    function updateQuestionCount() {
  const count = answers.filter(function(item) {
    return item.passed;
  }).length;

  const questionCountEl = document.getElementById("questionCount");

  if (questionCountEl) {
    questionCountEl.textContent = "(" + count + "/4)";
  }
}

    function checkAndGoNext() {
  const questionInput = document.getElementById("questionInput");
  const answerInput = document.getElementById("answerInput");
  const feedbackBox = document.getElementById("feedbackBox");

  if (!questionInput || !answerInput || !feedbackBox) {
    console.error("질문 입력칸, 답 입력칸 또는 피드백 상자를 찾지 못했습니다.");
    return;
  }

  const question = questionInput.value.trim();
  const expectedAnswer = answerInput.value.trim();

  const result = validateQuestionAndAnswer(question, expectedAnswer);

  feedbackBox.style.display = "flex";
  feedbackBox.classList.remove("good", "need");
  feedbackBox.classList.add(result.ok ? "good" : "need");

  const feedbackMessage = feedbackBox.querySelector(".feedback-message");

  if (feedbackMessage) {
    feedbackMessage.textContent = result.message;
  }

  if (!result.ok) {
    return;
  }

  answers[currentStepIndex].question = question;
  answers[currentStepIndex].expectedAnswer = expectedAnswer;
  answers[currentStepIndex].passed = true;

  questionInput.disabled = true;
  answerInput.disabled = true;

  const nextButton = document.querySelector(
    '.main-button[onclick="checkAndGoNext()"]'
  );

  if (nextButton) {
    nextButton.disabled = true;
    nextButton.textContent = "저장 완료! 다음 단계로 이동 중...";
  }

  setTimeout(function() {
    if (currentStepIndex < steps.length - 1) {
      currentStepIndex++;
      currentMode = "write";
      renderAll();
    } else {
      currentMode = "summary";
      renderAll();
    }
  }, 1800);
}
function goNextAfterFeedback() {
  if (currentStepIndex < steps.length - 1) {
    currentStepIndex++;
    currentMode = "write";
    renderAll();
  } else {
    currentMode = "summary";
    renderAll();
  }
}

    function validateQuestionAndAnswer(question, expectedAnswer) {
      if (!question) {
  const emptyQuestionMessages = {
    title: "질문이 아직 비어 있어. 제목에서 궁금한 점을 한 문장으로 적어 봐!",
    contents: "질문이 아직 비어 있어. 차례를 보고 앞으로 어떤 일이 일어날지 궁금한 점을 적어 봐!",
    picture: "질문이 아직 비어 있어. 책 속 그림을 보고 인물, 표정, 장소, 물건에서 궁금한 점을 적어 봐!",
    skim: "질문이 아직 비어 있어. 글을 훑어보고 눈에 띄는 낱말이나 문장에서 궁금한 점을 적어 봐!"
  };

  return {
    ok: false,
    message: emptyQuestionMessages[steps[currentStepIndex].type]
  };
}

      if (question.length < 8) {
        return {
          ok: false,
          message: "질문이 조금 짧아. 무엇이 궁금한지 더 자세히 적어 보면 좋아!"
        };
      }

      if (!question.includes("?") && !question.includes("까") && !question.includes("왜") && !question.includes("어떤") && !question.includes("무슨")) {
        return {
          ok: false,
          message: "질문처럼 보이도록 바꿔 보자. 예를 들면 ‘왜 ~일까?’, ‘어떤 일이 생길까?’처럼 적으면 좋아!"
        };
      }

      if (!expectedAnswer) {
        return {
          ok: false,
          message: "내가 생각한 답도 적어 줘. 아직 읽기 전이니까 상상해서 답해도 괜찮아!"
        };
      }

      if (expectedAnswer.length < 8) {
        return {
          ok: false,
          message: "답이 조금 짧아. 왜 그렇게 생각했는지 한 문장만 더 자세히 적어 봐!"
        };
      }

      const weakAnswers = ["몰라", "모르겠다", "없다", "그냥", "모름"];

      if (weakAnswers.includes(expectedAnswer.replaceAll(" ", ""))) {
        return {
          ok: false,
          message: "조금 더 상상해서 답해 보자. 정답이 아니어도 괜찮으니까 ‘~일 것 같다’처럼 써 보면 좋아!"
        };
      }

      return {
        ok: true,
        message: "좋아! 책을 읽기 전에 내용을 짐작해 볼 수 있는 질문이야. 다음 단서도 살펴보자!"
      };
    }

    /*
      =========================================================
      7. 요약 화면
      =========================================================
    */

    function showSummary() {
      currentMode = "summary";
      renderAll();
    }

    function renderSummary() {
      const activityCard = document.getElementById("activityCard");

      activityCard.innerHTML =
        '<div class="activity-head">' +
          '<div>' +
            '<h2 class="activity-title">내가 만든 읽기 전 질문 확인하기</h2>' +
          '</div>' +
        '</div>' +

        '<div class="summary-list">' +
          steps.map(function(step, index) {
            const item = answers[index];

            return '<article class="summary-item">' +
              '<h3 class="summary-title">' + step.number + '. ' + step.title + '</h3>' +
              '<p class="summary-text"><strong>질문</strong> · ' + (item.question || "아직 작성하지 않았어요.") + '</p>' +
              '<p class="summary-text"><strong>내가 생각한 답</strong> · ' + (item.expectedAnswer || "아직 작성하지 않았어요.") + '</p>' +
            '</article>';
          }).join("") +
        '</div>' +

        '<div class="bottom-row">' +
          '<div class="small-note">✨ 4개 질문을 모두 완성했어요! 이제 읽기 중 활동으로 넘어갈 수 있어요.</div>' +

          '<div class="action-area">' +
            '<button class="plain-button" type="button" onclick="editIncompleteOrFirst()">수정하기</button>' +
            '<button class="main-button" type="button" onclick="completeAndGoPractice()">읽기 단계 선택으로 이동 →</button>' +
          '</div>' +
        '</div>';
    }

    function editIncompleteOrFirst() {
      const incompleteIndex = answers.findIndex(function(item) {
        return !item.passed;
      });

      currentStepIndex = incompleteIndex === -1 ? 0 : incompleteIndex;
      currentMode = "write";
      renderAll();
    }

    // 질문 4개를 모두 완성하면 읽기 전 질문 공유하기 화면은 건너뛰고,
    // 바로 읽기 전/중/후 3단계 선택 화면(practice.html)으로 이동합니다.
    function completeAndGoPractice() {
      const incompleteIndex = answers.findIndex(function(item) {
        return !item.passed;
      });

      if (incompleteIndex !== -1) {
        currentStepIndex = incompleteIndex;
        currentMode = "write";
        renderAll();

        setTimeout(function() {
          const feedbackBox = document.getElementById("feedbackBox");
          feedbackBox.style.display = "flex";
          feedbackBox.classList.add("need");
         feedbackBox.querySelector(".feedback-message").textContent =
  "아직 완성하지 않은 질문이 있어. 이 질문과 답을 완성하면 다음 단계로 갈 수 있어!";
        }, 100);

        return;
      }

      saveBeforeReadingData();

      const progressKey = "practiceProgress_" + studentId;
      const progress = JSON.parse(sessionStorage.getItem(progressKey)) || {
        book: false,
        before: false,
        during: false,
        classRead: false,
        after: false
      };

      progress.book = true;
      progress.before = true;

      sessionStorage.setItem(progressKey, JSON.stringify(progress));
      sessionStorage.setItem("beforeReadingCompleted_" + studentId, "true");

      location.href = "./practice.html";
    }

    function saveBeforeReadingData() {
      const payload = {
        studentId: studentId,
        studentName: studentName,
        bookId: selectedBook.bookId,
        bookTitle: selectedBook.title,
        questions: steps.map(function(step, index) {
          return {
            type: step.type,
            typeName: step.title,
            question: answers[index].question,
            expectedAnswer: answers[index].expectedAnswer
          };
        })
      };

      sessionStorage.setItem("beforeReadingQuestions_" + studentId, JSON.stringify(payload));
      console.log("읽기 전 질문 저장 데이터:", payload);
    }

    /*
      =========================================================
      8. 이동 함수
      =========================================================
    */

    function goPrevious() {
      if (currentStepIndex === 0) {
        currentMode = "write";
        renderAll();
        return;
      }

      currentStepIndex--;
      currentMode = "write";
      renderAll();
    }

    function goHome() {
      location.href = "./home.html";
    }

    function goPractice() {
      location.href = "./practice.html";
    }
  </script>
  <script src="../js/fixed-stage.js"></script>
</body>
