      padding: 26px 34px 28px;

      align-items: center;
      gap: 20px;

    .br-progress-count {

      height: 52px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(178, 113, 31, 0.24);
      border-radius: 999px;
      background: rgba(255, 247, 224, 0.92);
      color: #5e3715;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 8px 16px rgba(109, 67, 18, 0.08);

      flex: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      align-items: center;
      position: relative;
      height: 40px;

    .br-progress-line::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: rgba(175, 113, 33, 0.24);
      transform: translateY(-50%);
    }

    .br-progress-dot {
      position: relative;
      z-index: 2;
      justify-self: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ead9b9;
      border: 2px solid #fff9ec;
      box-shadow: 0 3px 8px rgba(104, 66, 20, 0.12);
    }

    .br-progress-dot.active,
    .br-progress-dot.done {
      background: linear-gradient(180deg, #efc45f, #b56f22);
    }

      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;

      color: #b5761f;
      font-size: 16px;
      font-weight: 900;
    }

      font-family: "Noto Serif KR", "Noto Sans KR", serif;

      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.055em;
      word-break: keep-all;

      display: none;

    .br-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

    .br-option {

  cursor: pointer;
  box-shadow: 0 12px 22px rgba(101, 63, 18, 0.09);

}

}

  font-size: 27px;

  letter-spacing: -0.04em;
}

}

    }

    .br-options.six-options .br-option {
  min-height: 180px !important;
  padding: 26px 16px 24px !important;
  border-radius: 26px !important;
}

    .br-options.six-options .br-option-icon {
  height: 58px !important;
  margin-bottom: 14px !important;
  font-size: 44px !important;

}

    }

    .br-options.nine-options .br-option {
      min-height: 122px !important;
      padding: 16px 12px 14px !important;
      border-radius: 22px !important;
    }

    .br-options.nine-options .br-option-icon {
      height: 42px !important;
      margin-bottom: 8px !important;
      font-size: 32px !important;
    }

    .br-options.nine-options .br-option strong {
      font-size: 18px !important;
      line-height: 1.22 !important;
    }

      width: 100%;

      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 18px !important;
    }

    .br-options.four-options .br-option {
  min-height: 190px !important;
  padding: 30px 20px 26px !important;
  border-radius: 28px !important;
}

    .br-options.four-options .br-option-icon {
  height: 66px !important;
  margin-bottom: 15px !important;
  font-size: 48px !important;
}

.br-options.four-options .br-option strong {
  font-size: 25px !important;
  line-height: 1.25 !important;
}

    .br-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 18px;
      border-top: 1px solid rgba(181, 117, 37, 0.16);
      padding-top: 22px;
    }

    .br-button {
      height: 58px;
      border-radius: 999px;
      border: 1px solid rgba(174, 109, 27, 0.26);
      background: rgba(255, 250, 237, 0.88);
      color: #5f3714;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(100, 61, 16, 0.1);
    }

    .br-button.primary {
      border: none;
      background: linear-gradient(180deg, #e6b656, #a8641e);
      color: #fff9e8;
      box-shadow: 0 12px 22px rgba(128, 76, 18, 0.22);
    }

    .br-button:disabled {
      opacity: 0.45;

      box-shadow: none;
    }

    .br-result-card {
      display: none;
      grid-template-rows: 124px minmax(0, 1fr) 74px;
      padding: 24px 30px 26px;
    }

    .br-result-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .br-result-header h1 {

      font-size: 38px;

      letter-spacing: -0.055em;
    }

    .br-result-header p {

      font-size: 17px;
      font-weight: 800;
      line-height: 1.45;
    }

      background: #fff6df;

      font-weight: 900;
      cursor: pointer;
    }

    .br-book-list {

      gap: 12px;
    }

    .br-book-card {
      min-height: 0;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) 52px;
      gap: 16px;
      align-items: center;
      padding: 14px 18px;
      border: 1px solid rgba(181, 117, 37, 0.18);
      border-radius: 22px;
      background: rgba(255, 252, 244, 0.82);
      box-shadow: 0 10px 18px rgba(101, 63, 18, 0.08);
    }

    .br-rank {
      width: 48px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 14px 14px 20px 20px;
      background: linear-gradient(180deg, #e6b656, #9f5d1d);
      color: #fff9e8;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 8px 14px rgba(129, 76, 18, 0.16);

      padding: 28px;
      border: 1px dashed rgba(181, 117, 37, 0.32);
      border-radius: 24px;
      background: rgba(255, 252, 244, 0.72);
      color: #754d23;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.45;
      text-align: center;
      word-break: keep-all;
    }

    .br-book-cover {
      width: 52px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 14px 14px 20px 20px;
      background:

      color: #fff9e8;
      font-size: 25px;
      font-weight: 950;
      overflow: hidden;
      box-shadow: 0 8px 14px rgba(129, 76, 18, 0.16);
    }

    .br-book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .br-result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid rgba(181, 117, 37, 0.16);
    }

    .br-result-action-button {
      height: 52px;
      border: 1px solid rgba(174, 109, 27, 0.24);
      border-radius: 999px;
      background: rgba(255, 248, 228, 0.9);
      color: #603814;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(101, 63, 18, 0.08);
    }

    .br-result-action-button.primary {
      border: none;
      background: linear-gradient(180deg, #e7ba5b, #a8641e);
      color: #fff9e8;
    }

    .br-page.result-mode .br-question-card {
      display: none;
    }

    .br-page.result-mode .br-result-card {
      display: grid;
    }

    @media (max-height: 760px) {
      .br-page { padding: 12px 24px; }
      .br-shell { grid-template-rows: 58px minmax(0, 1fr); gap: 10px; }
      .br-main { grid-template-columns: 270px minmax(0, 1fr); gap: 14px; }

      .br-classmate-card {
        left: 18px;
        right: 18px;
        top: 36px;
        bottom: auto;
        min-height: 150px;
        padding: 18px 13px 15px;
      }

      .br-classmate-card p {
        font-size: 13px;
        margin-bottom: 6px;
      }

      .br-classmate-card strong {
        margin-bottom: 12px;
        font-size: 16px;
        line-height: 1.35;
      }

      .br-classmate-button {
        height: 40px;
        font-size: 14px;
      }

      .br-lumi {
        width: 260px;
      }

      .br-question-card {
        grid-template-rows: 62px minmax(0, 1fr) 72px;
        padding: 20px 28px 22px;
      }

      .br-question-title {
        margin-bottom: 24px;
        font-size: 34px;
      }

      .br-option {
        min-height: 145px;
        padding: 16px 12px;
      }

      .br-option-icon {
        height: 50px;
        font-size: 38px;
      }

      .br-option strong {
        font-size: 19px;
      }

      .br-button {
        height: 52px;
        font-size: 18px;
      }

      .br-result-card {
        grid-template-rows: 106px minmax(0, 1fr) 82px;
        padding: 20px 26px;
      }

      .br-book-card {
        grid-template-columns: 52px minmax(0, 1fr) 44px;
        padding: 10px 14px;
      }

      .br-book-info h2 {
        font-size: 18px;
      }

      .br-book-info p {
        font-size: 12px;
      }
    }

  <script>
    checkLogin();

    const API_BASE_URL =
      window.location.hostname === "127.0.0.1"
        ? "http://127.0.0.1:8080"
        : window.location.hostname === "localhost"
        ? "http://localhost:8080"
        : "https://victory-production-f94d.up.railway.app";

    const PREFERENCE_STORAGE_KEY = "bookRecommendationPreferences";
    const RESULTS_STORAGE_KEY = "bookRecommendationResults";

    const questions = [
      {
        key: "thickness",
        title: "읽을 책의 두께는 어느 정도가 좋아?",
        options: [
          { label: "가볍게 읽는\n얇은 책", icon: "🪶", value: "thin" },

      },
      {

        title: "어떤 분위기의 책이 끌려?",
        options: [
          { label: "재미있고\n웃긴 이야기", icon: "😄", value: "funny" },
          { label: "따뜻하고\n감동적인 이야기", icon: "🌷", value: "touching" },
          { label: "신나고\n흥미진진한 이야기", icon: "🧭", value: "exciting" },
          { label: "차분하고\n잔잔한 이야기", icon: "🌿", value: "calm" },
          { label: "상상력이\n커지는 이야기", icon: "💭", value: "imaginative" },
          { label: "무섭거나\n신비로운 이야기", icon: "🌙", value: "mysterious" }
        ]
      },
      {
        key: "genre",
        title: "어떤 종류의 책을 읽고 싶어?",
        options: [
          { label: "친구와\n우정 이야기", icon: "🏫", value: "friendship" },
          { label: "판타지\n이야기", icon: "✨", value: "fantasy" },
          { label: "신나는\n모험 이야기", icon: "🧭", value: "adventure" },
          { label: "일상과\n학교 이야기", icon: "☀️", value: "daily_life" },
          { label: "동물·자연\n이야기", icon: "🦁", value: "nature" },
          { label: "역사·위인\n이야기", icon: "🏛️", value: "history" },
          { label: "과학·정보\n책", icon: "🔎", value: "science" },
          { label: "추리·미스터리\n이야기", icon: "🕵️", value: "mystery" },
          { label: "마음이 자라는\n성장 이야기", icon: "🌱", value: "growth" }
        ]
      },
      {
        key: "illustrationLevel",
        title: "책에 그림이 어느 정도 있으면 좋아?",
        options: [
          { label: "그림이\n많은 책", icon: "🖼️", value: "many" },
          { label: "글과 그림이\n반반 있는 책", icon: "📘", value: "medium" },
          { label: "그림이 조금만\n있어도 좋아", icon: "📚", value: "few" }
        ]
      },
      {
        key: "difficulty",
        title: "읽기 어려운 정도는 어느 정도가 좋아?",
        options: [
          { label: "쉽고 술술\n읽히는 책", icon: "🍃", value: "easy" },
          { label: "생각하면서\n읽는 책", icon: "💭", value: "medium" },
          { label: "어려워도\n도전할 책", icon: "🏔️", value: "hard" }
        ]
      },
      {
        key: "purpose",
        title: "이번 책을 읽고 어떤 느낌을 얻고 싶어?",
        options: [
          { label: "재미있게\n웃고 싶어", icon: "🌟", value: "fun" },
          { label: "마음이\n따뜻해지고 싶어", icon: "🌷", value: "comfort" },
          { label: "새로운 지식을\n알고 싶어", icon: "🧠", value: "knowledge" },
          { label: "상상력을\n키우고 싶어", icon: "✨", value: "imagination" },
          { label: "어려운 책에\n도전하고 싶어", icon: "🛡️", value: "challenge" }
        ]
      }
    ];

    let currentQuestionIndex = 0;
    let answers = {
      thickness: null,
      mood: null,
      genre: null,
      illustrationLevel: null,
      difficulty: null,
      purpose: null
    };
    let selectedValue = null;
    let recommendationItems = [];
    let shownBookIds = [];
    let isRequestingRecommendation = false;

    document.addEventListener("DOMContentLoaded", () => {
      if (!restoreRecommendationSession()) {
        renderQuestion();
      }
    });

    function goIndividualReading() {
      window.location.href = "./individual-reading.html";
    }

    function renderQuestion() {
      const question = questions[currentQuestionIndex];
      selectedValue = answers[question.key] || null;

      document.getElementById("progressCount").textContent = `${currentQuestionIndex + 1} / ${questions.length}`;
      document.getElementById("questionKicker").textContent = `Q${currentQuestionIndex + 1}`;
      document.getElementById("questionTitle").textContent = question.title;

      showQuestionCard();
      renderProgress();
      renderOptions(question);
      updateButtons();
    }

    function renderProgress() {
      const progressLine = document.getElementById("progressLine");
      progressLine.innerHTML = "";

      questions.forEach((_, index) => {
        const dot = document.createElement("span");
        dot.className = "br-progress-dot";
        if (index < currentQuestionIndex) dot.classList.add("done");
        if (index === currentQuestionIndex) dot.classList.add("active");
        progressLine.appendChild(dot);
      });
    }

    function renderOptions(question) {
      const optionList = document.getElementById("optionList");
      optionList.innerHTML = "";

      optionList.classList.toggle("many-options", question.options.length === 5);
      optionList.classList.toggle("six-options", question.options.length === 6);
      optionList.classList.toggle("nine-options", question.options.length === 9);
      optionList.classList.toggle("four-options", question.options.length === 4);

      question.options.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "br-option";
        button.dataset.value = option.value;

        if (selectedValue === option.value) {
          button.classList.add("selected");
        }

        const icon = document.createElement("div");
        icon.className = "br-option-icon";
        icon.textContent = option.icon;

        const label = document.createElement("strong");
        option.label.split("\n").forEach((line, index) => {
          if (index > 0) {
            label.appendChild(document.createElement("br"));
          }
          label.appendChild(document.createTextNode(line));
        });

        button.appendChild(icon);
        button.appendChild(label);

        button.onclick = function () {
          selectOption(question.key, option.value);
        };

        optionList.appendChild(button);
      });
    }

    function selectOption(questionKey, optionValue) {
      selectedValue = optionValue;
      answers[questionKey] = optionValue;
      savePreferences();

      document.querySelectorAll(".br-option").forEach((button) => {
        button.classList.toggle("selected", button.dataset.value === optionValue);
      });

      updateButtons();
    }

    function updateButtons() {
      const prevButton = document.getElementById("prevButton");
      const nextButton = document.getElementById("nextButton");

      prevButton.disabled = currentQuestionIndex === 0;
      nextButton.disabled = !selectedValue || isRequestingRecommendation;

      if (isRequestingRecommendation) {
        nextButton.textContent = "추천 찾는 중...";
      } else {
        nextButton.textContent = currentQuestionIndex === questions.length - 1 ? "책 추천받기 ›" : "다음으로 ›";
      }
    }

    function goPrevQuestion() {
      if (currentQuestionIndex === 0) return;
      currentQuestionIndex -= 1;
      renderQuestion();
    }

    async function goNextQuestion() {
      if (!selectedValue) return;

      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex += 1;
        renderQuestion();
      } else {
        await requestAiRecommendations();
      }
    }

    function showQuestionCard() {
      document.getElementById("bookRecommendPage").classList.remove("result-mode");
    }

    function getCurrentStudentKey() {
      return sessionStorage.getItem("studentId") || sessionStorage.getItem("loginId") || "";
    }

    function getStorageEnvelope(payload) {
      return {
        studentKey: getCurrentStudentKey(),
        payload
      };
    }

    function readStorageEnvelope(key) {
      const raw = sessionStorage.getItem(key);

      if (!raw) {
        return null;
      }

      try {
        const parsed = JSON.parse(raw);
        if (!parsed || parsed.studentKey !== getCurrentStudentKey()) {
          return null;
        }

        return parsed.payload;
      } catch (error) {
        sessionStorage.removeItem(key);
        return null;
      }
    }

    function savePreferences() {
      sessionStorage.setItem(
        PREFERENCE_STORAGE_KEY,
        JSON.stringify(getStorageEnvelope(answers))
      );
    }

    function saveRecommendationResults(recommendations) {
      sessionStorage.setItem(
        RESULTS_STORAGE_KEY,
        JSON.stringify(getStorageEnvelope({
          preferences: answers,
          recommendations,
          shownBookIds: shownBookIds.slice(),
          savedAt: new Date().toISOString()
        }))
      );
    }

    function isValidBookId(value) {
      return typeof value === "number" && Number.isFinite(value) && value > 0;
    }

    function addShownBookIds(items) {
      (items || []).forEach((item) => {
        const bookId = item && item.bookId;
        if (isValidBookId(bookId) && !shownBookIds.includes(bookId)) {
          shownBookIds.push(bookId);
        }
      });
    }

    function restoreRecommendationSession() {
      const savedPreferences = readStorageEnvelope(PREFERENCE_STORAGE_KEY);
      const savedResults = readStorageEnvelope(RESULTS_STORAGE_KEY);

      if (savedPreferences && typeof savedPreferences === "object") {
        questions.forEach((question) => {
          if (typeof savedPreferences[question.key] === "string") {
            answers[question.key] = savedPreferences[question.key];
          }
        });
      }

      /*
       * 이전 후보 API 형식(배열, {book, matchScore})이나 형태가 다른 캐시는
       * 안전하게 무시한다. 새 형식만 { recommendations: [...] } 객체로 복원한다.
       */
      const hasValidShape =
        savedResults &&
        typeof savedResults === "object" &&
        !Array.isArray(savedResults) &&
        Array.isArray(savedResults.recommendations);

      if (!hasValidShape) {
        if (savedResults) {
          sessionStorage.removeItem(RESULTS_STORAGE_KEY);
        }
        return false;
      }

      recommendationItems = savedResults.recommendations;

      /*
       * 오래된 캐시(다른 책 추천받기 기능 이전 형식)에는 shownBookIds가 없을
       * 수 있다 - 그 경우 현재 recommendations의 bookId로 초기화한다.
       * 잘못된 값(문자열, 음수, 0 등)은 걸러낸다.
       */
      shownBookIds = Array.isArray(savedResults.shownBookIds)
        ? savedResults.shownBookIds.filter(isValidBookId)
        : recommendationItems.map((item) => item && item.bookId).filter(isValidBookId);

      document.getElementById("bookRecommendPage").classList.add("result-mode");
      renderRecommendedBooks();
      return true;
    }

    function getFirstMissingQuestionIndex() {
      return questions.findIndex((question) => !answers[question.key]);
    }

    function getRecommendationRequestBody() {
      return {
        thickness: answers.thickness,
        mood: answers.mood,
        genre: answers.genre,
        illustrationLevel: answers.illustrationLevel,
        difficulty: answers.difficulty,
        purpose: answers.purpose,
        excludedBookIds: shownBookIds.slice()
      };
    }

    async function requestAiRecommendations() {
      const missingQuestionIndex = getFirstMissingQuestionIndex();

      if (missingQuestionIndex >= 0) {
        currentQuestionIndex = missingQuestionIndex;
        renderQuestion();
        alert("아직 고르지 않은 질문이 있어요.");
        return;
      }

      if (isRequestingRecommendation) {
        return;
      }

      const token = sessionStorage.getItem("token");
      const role = sessionStorage.getItem("role");

      if (!token || role !== "student") {
        alert("학생 로그인이 필요해요. 다시 로그인해 주세요.");
        window.location.href = "../index.html";
        return;
      }

      isRequestingRecommendation = true;
      updateButtons();

      try {
        const response = await fetch(API_BASE_URL + "/api/students/me/book-recommendations/ai", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify(getRecommendationRequestBody())
        });

        if (response.status === 401 || response.status === 403) {
          alert("로그인이 만료되었어요. 다시 로그인해 주세요.");
          window.location.href = "../index.html";
          return;
        }

        if (response.status === 400) {
          alert("선택값을 다시 확인해 주세요.");
          return;
        }

        if (!response.ok) {
          alert("추천 책을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.");
          return;
        }

        const result = await response.json();
        /*
         * aiUsed/fallbackUsed는 개발 확인용 플래그일 뿐이라 학생에게 어떤
         * 문구도 따로 보여주지 않는다 - fallback이어도 일반 추천처럼 그대로
         * 자연스럽게 표시한다.
         */
        recommendationItems = Array.isArray(result && result.recommendations)
          ? result.recommendations
          : [];
        addShownBookIds(recommendationItems);
        savePreferences();
        saveRecommendationResults(recommendationItems);

        document.getElementById("bookRecommendPage").classList.add("result-mode");
        renderRecommendedBooks();
      } catch (error) {
        console.error("AI 책 추천 API 호출 실패", error);
        alert("서버에 연결할 수 없어요. 잠시 후 다시 시도해 주세요.");
      } finally {
        isRequestingRecommendation = false;
        updateButtons();
      }
    }

    function renderRecommendedBooks() {
      const bookList = document.getElementById("bookList");
      bookList.innerHTML = "";

      const selectedBooks = recommendationItems.slice(0, 3);

      if (selectedBooks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "br-empty-result";
        empty.textContent = "아직 조건에 맞는 추천 책을 찾지 못했어요. 다시 질문해 볼까요?";
        bookList.appendChild(empty);
        return;
      }

      selectedBooks.forEach((book, index) => {
        book = book || {};
        const card = document.createElement("div");
        card.className = "br-book-card";

        const cover = document.createElement("div");
        cover.className = "br-book-cover";

        if (book.coverImage) {
          const image = document.createElement("img");
          image.src = book.coverImage;
          image.alt = (book.title || "추천 책") + " 표지";
          cover.appendChild(image);
        } else {
          cover.textContent = String(index + 1);
        }

        const info = document.createElement("div");
        info.className = "br-book-info";

        const title = document.createElement("h2");
        title.textContent = book.title || "추천 책";

        const author = document.createElement("p");
        author.className = "br-book-author";
        author.textContent = (book.author || "지은이 정보 없음") + " 지음";

        const summary = document.createElement("p");
        summary.className = "br-book-summary";
        summary.textContent = book.description || "책 소개를 준비하고 있어요.";

        const reasonText = document.createElement("p");
        reasonText.className = "br-book-reason-text";
        reasonText.textContent = book.recommendationReason || "네가 고른 책 취향과 잘 맞는 책이야.";

        info.appendChild(title);
        info.appendChild(author);
        info.appendChild(summary);
        info.appendChild(reasonText);

        const pickButton = document.createElement("button");
        pickButton.type = "button";
        pickButton.className = "br-book-pick";
        pickButton.title = "이 책으로 읽기 시작하기";
        pickButton.textContent = "🔖";
        pickButton.dataset.bookId = book.bookId || "";

        card.appendChild(cover);
        card.appendChild(info);
        card.appendChild(pickButton);

        bookList.appendChild(card);
      });
    }

    function updateRefreshButton() {
      const refreshButton = document.getElementById("refreshButton");
      if (!refreshButton) {
        return;
      }

      refreshButton.disabled = isRequestingRecommendation;
      refreshButton.textContent = isRequestingRecommendation
        ? "다른 책을 찾고 있어요..."
        : "↻ 다른 책 추천받기";
    }

    /*
     * "다른 책 추천받기": 질문 화면으로 돌아가지 않고, 같은 취향(answers)을
     * 유지한 채 지금까지 보여준 책(shownBookIds)을 제외 목록으로 함께 보내
     * 새 3권을 요청한다. 성공하면 결과 카드만 새 3권으로 교체한다.
     */
    async function recommendAnotherBooks() {
      if (isRequestingRecommendation) {
        return;
      }

      const token = sessionStorage.getItem("token");
      const role = sessionStorage.getItem("role");

      if (!token || role !== "student") {
        alert("학생 로그인이 필요해요. 다시 로그인해 주세요.");
        window.location.href = "../index.html";
        return;
      }

      isRequestingRecommendation = true;
      updateRefreshButton();

      try {
        const response = await fetch(API_BASE_URL + "/api/students/me/book-recommendations/ai", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify(getRecommendationRequestBody())
        });

        if (response.status === 401 || response.status === 403) {
          alert("로그인이 만료되었어요. 다시 로그인해 주세요.");
          window.location.href = "../index.html";
          return;
        }

        if (response.status === 400) {
          alert("선택값을 다시 확인해 주세요.");
          return;
        }

        if (!response.ok) {
          alert("추천 책을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.");
          return;
        }

        const result = await response.json();
        recommendationItems = Array.isArray(result && result.recommendations)
          ? result.recommendations
          : [];
        addShownBookIds(recommendationItems);
        saveRecommendationResults(recommendationItems);
        renderRecommendedBooks();
      } catch (error) {
        console.error("다른 책 추천 API 호출 실패", error);
        alert("서버에 연결할 수 없어요. 잠시 후 다시 시도해 주세요.");
      } finally {
        isRequestingRecommendation = false;
        updateRefreshButton();
      }
    }

    function restartQuestions() {
      answers = {
        thickness: null,
        mood: null,
        genre: null,
        illustrationLevel: null,
        difficulty: null,
        purpose: null
      };
      selectedValue = null;
      recommendationItems = [];
      shownBookIds = [];
      currentQuestionIndex = 0;
      sessionStorage.removeItem(PREFERENCE_STORAGE_KEY);
      sessionStorage.removeItem(RESULTS_STORAGE_KEY);
      document.getElementById("bookRecommendPage").classList.remove("result-mode");
      renderQuestion();
    }

    function goFriendBookShelf() {
      window.location.href = "./friend-book-shelf.html";
    }
  </script>

  <script src="../js/individual-power.js?v=power-common-5"></script>
  <script src="../js/fixed-stage.js"></script>
</body>
