<!--
  파일명: book-recommend.html
  역할: 문답책 개별읽기 - 책 추천 받기 화면입니다.

  이 화면에서 하는 일:
  1. 루미가 학생에게 책 취향 질문을 하나씩 보여줍니다.
  2. 학생이 답을 모두 선택하면 선택값을 바탕으로 책 3권을 추천합니다.
  3. 마음에 들지 않으면 같은 답변 기준으로 다른 책을 다시 추천받을 수 있습니다.
  4. 우리 반 추천 책장으로 이동하는 버튼을 제공합니다.

  사용 이미지:
  - 배경 이미지: ../assets/images/book-recommend/book-recommend-bg.png
  - 루미 이미지: ../assets/images/book-recommend/book-recommend-lumi.png

  참고:
  - 현재 추천 책 데이터는 임시 데이터입니다.
  - 실제 도서 DB/API 또는 GPT 추천 기능을 붙이면 getMatchedBooks() 부분을 교체하면 됩니다.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>책 추천 받기 - 문답책</title>

  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
  <link rel="stylesheet" href="../css/common.css?v=book-recommend-fixed-1">
<!-- 개별읽기 공통: 나의 힘 팝업 디자인 -->
<link rel="stylesheet" href="../css/individual-power.css">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .br-page,
    .br-page * {
      box-sizing: border-box;
      font-family: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    .br-page {
      width: 100vw;
      height: 100vh;
      padding: 16px 28px 20px;
      color: #4a2a10;
      overflow: hidden;
      background:
        linear-gradient(
          90deg,
          rgba(255, 248, 229, 0.88) 0%,
          rgba(255, 248, 229, 0.58) 44%,
          rgba(255, 248, 229, 0.34) 100%
        ),
        url("../assets/images/book-recommend/book-recommend-bg.png") center / cover no-repeat;
    }

    .br-shell {
      width: 100%;
      max-width: 1480px;
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: 64px minmax(0, 1fr);
      gap: 14px;
    }

    .br-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 22px;
      border: 1px solid rgba(182, 119, 38, 0.28);
      border-radius: 24px;
      background: rgba(255, 250, 236, 0.9);
      box-shadow: 0 12px 24px rgba(92, 58, 18, 0.12);
      backdrop-filter: blur(8px);
    }

    .br-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .br-logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .br-logo span {
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -0.045em;
      color: #5a3415;
    }

    .br-top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .br-top-button {
      height: 42px;
      padding: 0 20px;
      border: 1px solid rgba(168, 106, 31, 0.28);
      border-radius: 999px;
      background: rgba(255, 252, 242, 0.94);
      color: #633915;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(98, 59, 15, 0.1);
    }

    .br-main {
      min-height: 0;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .br-lumi-panel {
      position: relative;
      min-height: 0;
      border: 1px solid rgba(178, 113, 31, 0.22);
      border-radius: 32px;
      background: rgba(255, 250, 236, 0.72);
      box-shadow:
        0 18px 34px rgba(96, 60, 18, 0.12),
        inset 0 0 0 1px rgba(255,255,255,0.44);
      overflow: hidden;
      backdrop-filter: blur(7px);
    }

    /* 말풍선은 꼬리 없이 둥근 카드형으로 정리합니다. */
    .br-lumi-bubble {
      position: absolute;
      top: 34px;
      left: 28px;
      right: 28px;
      padding: 18px 16px;
      border: 1px solid rgba(179, 117, 36, 0.24);
      border-radius: 28px;
      background: rgba(255, 252, 242, 0.96);
      color: #5b3515;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 12px 22px rgba(98, 59, 15, 0.1);
      z-index: 3;
      word-break: keep-all;
    }

    .br-lumi {
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 300px;
      max-height: 520px;
      transform: translateX(-50%);
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 18px 22px rgba(91, 54, 15, 0.22));
      z-index: 2;
    }

    .br-lumi-glow {
      position: absolute;
      left: 50%;
      bottom: 44px;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(255, 218, 121, 0.32), transparent 68%);
      z-index: 1;
    }

    .br-card {
      min-height: 0;
      border: 1px solid rgba(180, 116, 34, 0.24);
      border-radius: 34px;
      background: rgba(255, 251, 242, 0.92);
      box-shadow:
        0 18px 34px rgba(92, 58, 18, 0.13),
        inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .br-question-card {
      display: grid;
      grid-template-rows: 72px minmax(0, 1fr) 84px;
      padding: 26px 34px 28px;
    }

    .br-progress-area {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .br-progress-count {
      width: 106px;
      height: 52px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(178, 113, 31, 0.24);
      border-radius: 999px;
      background: rgba(255, 247, 224, 0.92);
      color: #5e3715;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 8px 16px rgba(109, 67, 18, 0.08);
    }

    .br-progress-line {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      align-items: center;
      position: relative;
      height: 40px;
    }

    .br-progress-line::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: rgba(175, 113, 33, 0.24);
      transform: translateY(-50%);
    }

    .br-progress-dot {
      position: relative;
      z-index: 2;
      justify-self: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ead9b9;
      border: 2px solid #fff9ec;
      box-shadow: 0 3px 8px rgba(104, 66, 20, 0.12);
    }

    .br-progress-dot.active,
    .br-progress-dot.done {
      background: linear-gradient(180deg, #efc45f, #b56f22);
    }

    .br-question-body {
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .br-question-kicker {
      margin: 0 0 12px;
      color: #b5761f;
      font-size: 16px;
      font-weight: 900;
    }

    .br-question-title {
      margin: 0 0 10px;
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      color: #4d2b10;
      font-size: clamp(30px, 3.1vw, 44px);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.055em;
      word-break: keep-all;
    }

    .br-question-desc {
      margin: 0 0 28px;
      color: #795024;
      font-size: 18px;
      font-weight: 800;
    }

    .br-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .br-option {
      min-height: 190px;
      padding: 22px 16px 20px;
      border: 2px solid rgba(192, 132, 48, 0.2);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 10%, rgba(255, 223, 148, 0.28), transparent 40%),
        rgba(255, 252, 244, 0.86);
      color: #523112;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(101, 63, 18, 0.09);
      transition: 0.18s ease;
    }

    .br-option:hover {
      transform: translateY(-3px);
      border-color: rgba(186, 116, 28, 0.42);
      box-shadow: 0 16px 28px rgba(101, 63, 18, 0.14);
    }

    .br-option.selected {
      border-color: #bd7622;
      background:
        linear-gradient(180deg, rgba(255, 232, 162, 0.92), rgba(255, 249, 234, 0.9));
      box-shadow:
        0 16px 30px rgba(129, 76, 18, 0.18),
        inset 0 0 0 2px rgba(255, 255, 255, 0.56);
    }

    .br-option-icon {
      display: grid;
      place-items: center;
      height: 74px;
      margin-bottom: 14px;
      font-size: 52px;
      filter: drop-shadow(0 8px 10px rgba(99, 61, 17, 0.14));
    }

    .br-option strong {
      display: block;
      margin-bottom: 8px;
      font-size: 23px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.04em;
    }

    .br-option span {
      display: block;
      color: #785025;
      font-size: 14px;
      font-weight: 750;
      line-height: 1.45;
      word-break: keep-all;
    }


    /* 선택지가 5개 이상이어도 한 화면에 들어오도록 카드 크기를 안정화합니다. */
    .br-options.many-options {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .br-options.many-options .br-option {
      min-height: 146px;
      padding: 16px 10px 14px;
      border-radius: 22px;
    }

    .br-options.many-options .br-option-icon {
      height: 46px;
      margin-bottom: 9px;
      font-size: 34px;
    }

    .br-options.many-options .br-option strong {
      margin-bottom: 6px;
      font-size: 18px;
      line-height: 1.22;
    }

    .br-options.many-options .br-option span {
      font-size: 12px;
      line-height: 1.35;
    }

    .br-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 18px;
      border-top: 1px solid rgba(181, 117, 37, 0.16);
      padding-top: 22px;
    }

    .br-button {
      height: 58px;
      border-radius: 999px;
      border: 1px solid rgba(174, 109, 27, 0.26);
      background: rgba(255, 250, 237, 0.88);
      color: #5f3714;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(100, 61, 16, 0.1);
    }

    .br-button.primary {
      border: none;
      background: linear-gradient(180deg, #e6b656, #a8641e);
      color: #fff9e8;
      box-shadow: 0 12px 22px rgba(128, 76, 18, 0.22);
    }

    .br-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .br-result-card {
      display: none;
      grid-template-rows: 124px minmax(0, 1fr) 74px;
      padding: 24px 30px 26px;
    }

    .br-result-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .br-result-header h1 {
      margin: 0 0 8px;
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      color: #4d2b10;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.055em;
    }

    .br-result-header p {
      margin: 0;
      color: #795024;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.45;
    }

    .br-refresh-button {
      height: 48px;
      padding: 0 18px;
      border: 1px solid rgba(174, 109, 27, 0.26);
      border-radius: 999px;
      background: #fff6df;
      color: #6b4119;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .br-book-list {
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
    }

    .br-book-card {
      min-height: 0;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) 52px;
      gap: 16px;
      align-items: center;
      padding: 14px 18px;
      border: 1px solid rgba(181, 117, 37, 0.18);
      border-radius: 22px;
      background: rgba(255, 252, 244, 0.82);
      box-shadow: 0 10px 18px rgba(101, 63, 18, 0.08);
    }

    .br-rank {
      width: 48px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 14px 14px 20px 20px;
      background: linear-gradient(180deg, #e6b656, #9f5d1d);
      color: #fff9e8;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 8px 14px rgba(129, 76, 18, 0.16);
    }

    .br-cover {
      width: 84px;
      height: 112px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1px solid rgba(136, 84, 24, 0.2);
      background:
        linear-gradient(160deg, rgba(255,255,255,0.42), transparent 50%),
        linear-gradient(180deg, #d8b06a, #8f5720);
      color: #fff9e8;
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.25;
      box-shadow: 0 10px 18px rgba(101, 63, 18, 0.16);
      word-break: keep-all;
    }

    .br-cover.green { background: linear-gradient(180deg, #91b179, #4f7c42); }
    .br-cover.blue { background: linear-gradient(180deg, #8ab5d7, #3f6f9a); }
    .br-cover.gold { background: linear-gradient(180deg, #e8c76a, #a4681f); }
    .br-cover.brown { background: linear-gradient(180deg, #b98748, #623b16); }

    .br-book-info {
      min-width: 0;
    }

    .br-book-info h2 {
      margin: 0 0 4px;
      color: #4e2d10;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.035em;
    }

    .br-book-info p {
      margin: 0 0 5px;
      color: #754d23;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
      word-break: keep-all;
    }

    .br-book-reason {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255, 239, 196, 0.86);
      color: #8a581d;
      font-size: 12px;
      font-weight: 900;
    }

    .br-book-pick {
      width: 46px;
      height: 46px;
      border: 1px solid rgba(174, 109, 27, 0.24);
      border-radius: 16px;
      background: #fff7e3;
      color: #9b650f;
      font-size: 22px;
      cursor: pointer;
    }


    .br-result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid rgba(181, 117, 37, 0.16);
    }

    .br-result-action-button {
      height: 52px;
      border: 1px solid rgba(174, 109, 27, 0.24);
      border-radius: 999px;
      background: rgba(255, 248, 228, 0.9);
      color: #603814;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(101, 63, 18, 0.08);
    }

    .br-result-action-button.primary {
      border: none;
      background: linear-gradient(180deg, #e7ba5b, #a8641e);
      color: #fff9e8;
    }

    .br-friend-shelf {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: stretch;
      padding-top: 14px;
      border-top: 1px solid rgba(181, 117, 37, 0.16);
    }

    .br-friend-card {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 18px;
      background: rgba(255, 247, 224, 0.82);
      border: 1px solid rgba(180, 116, 34, 0.16);
    }

    .br-friend-avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(180deg, #f3c869, #c17b25);
      color: #fff9e8;
      font-size: 20px;
    }

    .br-friend-card strong {
      display: block;
      margin-bottom: 2px;
      font-size: 14px;
      color: #5f3714;
      font-weight: 900;
    }

    .br-friend-card span {
      display: block;
      color: #7a5123;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .br-page.result-mode .br-question-card {
      display: none;
    }

    .br-page.result-mode .br-result-card {
      display: grid;
    }

    @media (max-height: 760px) {
      .br-page { padding: 12px 24px; }
      .br-shell { grid-template-rows: 58px minmax(0, 1fr); gap: 10px; }
      .br-main { grid-template-columns: 270px minmax(0, 1fr); gap: 14px; }
      .br-lumi-bubble { top: 24px; left: 20px; right: 20px; font-size: 16px; }
      .br-lumi { width: 260px; }
      .br-question-card { grid-template-rows: 62px minmax(0, 1fr) 72px; padding: 20px 28px 22px; }
      .br-question-title { font-size: 34px; }
      .br-question-desc { margin-bottom: 20px; }
      .br-option { min-height: 158px; padding: 16px 12px; }
      .br-option-icon { height: 56px; font-size: 42px; }
      .br-option strong { font-size: 19px; }
      .br-button { height: 52px; font-size: 18px; }
      .br-result-card { grid-template-rows: 106px minmax(0, 1fr) 82px; padding: 20px 26px; }
      .br-book-card { grid-template-columns: 52px minmax(0, 1fr) 44px; padding: 10px 14px; }
      .br-book-info h2 { font-size: 18px; }
      .br-book-info p { font-size: 12px; }
    }
        /*
      선택지가 6개일 때는 3개씩 2줄로 정렬합니다.
      Q2, Q6처럼 선택지가 6개인 질문 화면에서 사용됩니다.
    */

    .br-options.six-options {
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      gap: 14px !important;
    }

    .br-options.six-options .br-option {
      min-height: 142px !important;
      padding: 14px 12px 12px !important;
      border-radius: 22px !important;
    }

    .br-options.six-options .br-option-icon {
      height: 40px !important;
      margin-bottom: 7px !important;
      font-size: 30px !important;
    }

    .br-options.six-options .br-option strong {
      margin-bottom: 5px !important;
      font-size: 18px !important;
      line-height: 1.2 !important;
    }

    .br-options.six-options .br-option span {
      font-size: 12px !important;
      line-height: 1.32 !important;
    }
  </style>
</head>

<body>
  <main class="br-page" id="bookRecommendPage">
    <div class="br-shell">
      <header class="br-top-bar">
        <div class="br-logo">
          <img src="../assets/images/logo-book.png" alt="문답책 로고">
          <span>문답책</span>
        </div>

        <div class="br-top-actions">
  <!-- 개별읽기 활동 중에도 현재 능력치를 확인하는 버튼입니다. -->
  <button type="button" class="br-top-button" onclick="openIndividualPowerModal()">✨ 나의 힘</button>
  <button type="button" class="br-top-button" onclick="goIndividualReading()">개별읽기 홈</button>
</div>
</header>

<section class="br-main">
  <aside class="br-lumi-panel">
          <div class="br-lumi-bubble" id="lumiBubble">
            너에게 잘 어울리는<br>책을 찾아볼게!<br>몇 가지 질문에 답해줘.
          </div>
          <div class="br-lumi-glow"></div>
          <img src="../assets/images/book-recommend/book-recommend-lumi.png" alt="용사 루미" class="br-lumi">
        </aside>

        <article class="br-card br-question-card">
          <div class="br-progress-area">
            <div class="br-progress-count" id="progressCount">1 / 6</div>
            <div class="br-progress-line" id="progressLine"></div>
          </div>

          <div class="br-question-body">
            <p class="br-question-kicker" id="questionKicker">Q1</p>
            <h1 class="br-question-title" id="questionTitle">읽을 책의 두께는 어느 정도가 좋아?</h1>
            <p class="br-question-desc" id="questionDesc">마음에 드는 답을 하나 골라줘.</p>
            <div class="br-options" id="optionList"></div>
          </div>

          <div class="br-actions">
            <button type="button" class="br-button" id="prevButton" onclick="goPrevQuestion()">‹ 이전</button>

          { label: "마음이\n따뜻해지고 싶어", desc: "감동과 위로가 있는 책이 좋아요.", icon: "🌷", value: "comfort" },
          { label: "용기와 힘을\n얻고 싶어", desc: "주인공처럼 씩씩해지고 싶어요.", icon: "🛡️", value: "courage" },
          { label: "새로운 지식을\n알고 싶어", desc: "몰랐던 것을 배우고 싶어요.", icon: "🧠", value: "learn" },
          { label: "깊이 생각해\n보고 싶어", desc: "읽고 나서 이야기 나누고 싶어요.", icon: "🕯️", value: "think" },
          { label: "친구에게\n소개하고 싶어", desc: "다 읽고 친구에게 추천하고 싶어요.", icon: "🤝", value: "share" }

    const bookPool = [
      { title: "만복이네 떡집", author: "김리리", summary: "소원을 들어주는 신기한 떡집을 만나며 벌어지는 따뜻하고 재미있는 이야기예요.", reason: "재미있고 따뜻한 이야기를 좋아하는 친구에게 잘 맞아요.", tags: ["thin", "normal", "funny", "warm", "fantasy", "many", "easy", "joy", "comfort"], color: "gold" },
      { title: "긴긴밤", author: "루리", summary: "서로 다른 존재들이 함께 길을 걸으며 용기와 사랑을 배워가는 이야기예요.", reason: "마음이 따뜻해지는 성장 이야기를 원할 때 좋아요.", tags: ["normal", "warm", "growth", "adventure", "some", "half", "medium", "comfort", "courage"], color: "green" },
      { title: "아몬드", author: "손원평", summary: "감정을 느끼기 어려운 소년이 사람들과 만나며 성장하는 이야기예요.", reason: "생각할 거리가 있는 성장 이야기를 좋아한다면 추천해요.", tags: ["normal", "thinking", "growth", "school", "few", "text", "medium", "think", "comfort"], color: "brown" },
      { title: "시간 가게", author: "이나영", summary: "시간을 사고파는 가게를 통해 선택과 후회를 생각하게 하는 이야기예요.", reason: "판타지와 생각할 거리가 함께 있는 책을 찾는 친구에게 어울려요.", tags: ["normal", "adventure", "mystic", "fantasy", "some", "half", "medium", "learn", "think"], color: "blue" },
      { title: "이상한 과자 가게 전천당", author: "히로시마 레이코", summary: "신비한 과자 가게에서 벌어지는 기묘하고 흥미로운 이야기예요.", reason: "상상력 가득한 판타지 이야기를 좋아한다면 잘 맞아요.", tags: ["thin", "normal", "funny", "mystic", "fantasy", "many", "easy", "joy"], color: "gold" },
      { title: "푸른 사자 와니니", author: "이현", summary: "초원의 사자 와니니가 자신의 길을 찾아가는 모험 이야기예요.", reason: "모험과 성장, 용기를 함께 느끼고 싶을 때 추천해요.", tags: ["normal", "adventure", "growth", "nature", "some", "half", "medium", "comfort", "courage"], color: "green" },
      { title: "수상한 과학실", author: "임시 추천", summary: "생활 속 과학 궁금증을 이야기처럼 재미있게 풀어가는 정보 책이에요.", reason: "새로운 사실을 알고 싶은 친구에게 어울려요.", tags: ["thin", "normal", "info", "some", "half", "easy", "normalSentence", "learn"], color: "blue" },
      { title: "마법의 시간여행", author: "메리 폽 어즈번", summary: "책 속 세계를 넘나들며 역사와 모험을 만나는 흥미진진한 이야기예요.", reason: "모험과 배움을 함께 원하는 친구에게 잘 맞아요.", tags: ["thin", "normal", "adventure", "fantasy", "history", "many", "easy", "learn", "share"], color: "brown" },
      { title: "불량한 자전거 여행", author: "김남중", summary: "자전거 여행을 떠난 아이가 여러 사람을 만나며 성장하는 이야기예요.", reason: "현실적인 모험과 성장을 함께 느끼고 싶을 때 좋아요.", tags: ["normal", "adventure", "growth", "school", "few", "text", "medium", "comfort", "courage"], color: "green" }
    ];

    let currentQuestionIndex = 0;
    let answers = {};
    let selectedValue = null;
    let recommendOffset = 0;

    document.addEventListener("DOMContentLoaded", () => {
      renderQuestion();
    });

    function goIndividualReading() {
      window.location.href = "./individual-reading.html";
    }

    function renderQuestion() {
      const question = questions[currentQuestionIndex];
      selectedValue = answers[question.key] || null;

      document.getElementById("progressCount").textContent = `${currentQuestionIndex + 1} / ${questions.length}`;
      document.getElementById("questionKicker").textContent = `Q${currentQuestionIndex + 1}`;
      document.getElementById("questionTitle").textContent = question.title;
      document.getElementById("questionDesc").textContent = "마음에 드는 답을 하나 골라줘.";
      document.getElementById("lumiBubble").innerHTML = "너에게 잘 어울리는<br>책을 찾아볼게!<br>몇 가지 질문에 답해줘.";

      renderProgress();
      renderOptions(question);
      updateButtons();
    }

    function renderProgress() {
      const progressLine = document.getElementById("progressLine");
      progressLine.innerHTML = "";

      questions.forEach((_, index) => {
        const dot = document.createElement("span");
        dot.className = "br-progress-dot";
        if (index < currentQuestionIndex) dot.classList.add("done");
        if (index === currentQuestionIndex) dot.classList.add("active");
        progressLine.appendChild(dot);
      });
    }

    function renderOptions(question) {
      const optionList = document.getElementById("optionList");
      optionList.innerHTML = "";
      // 선택지 개수에 따라 카드 배열을 다르게 적용합니다.
optionList.classList.toggle("many-options", question.options.length >= 5);
optionList.classList.toggle("six-options", question.options.length === 6);
      question.options.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "br-option";
        button.dataset.value = option.value;

        if (selectedValue === option.value) {
          button.classList.add("selected");
        }

        button.innerHTML = `
          <div class="br-option-icon">${option.icon}</div>
          <strong>${option.label.replace(/\n/g, "<br>")}</strong>
          <span>${option.desc}</span>
        `;

        button.onclick = function () {
          selectOption(question.key, option.value);
        };

        optionList.appendChild(button);
      });
    }

    function selectOption(questionKey, optionValue) {
      selectedValue = optionValue;
      answers[questionKey] = optionValue;

      document.querySelectorAll(".br-option").forEach((button) => {
        button.classList.toggle("selected", button.dataset.value === optionValue);
      });

      updateButtons();
    }

    function updateButtons() {
      const prevButton = document.getElementById("prevButton");
      const nextButton = document.getElementById("nextButton");

      prevButton.disabled = currentQuestionIndex === 0;
      nextButton.disabled = !selectedValue;
      nextButton.textContent = currentQuestionIndex === questions.length - 1 ? "책 추천받기 ›" : "다음으로 ›";
    }

    function goPrevQuestion() {
      if (currentQuestionIndex === 0) return;
      currentQuestionIndex -= 1;
      renderQuestion();
    }

    function goNextQuestion() {
      if (!selectedValue) return;

      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex += 1;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function getMatchedBooks() {
      const answerValues = Object.values(answers);
      return [...bookPool]
        .map((book) => {
          const score = answerValues.reduce((total, value) => total + (book.tags.includes(value) ? 1 : 0), 0);
          return { ...book, score };
        })
        .sort((a, b) => b.score - a.score);
    }

    function showResult() {
      document.getElementById("bookRecommendPage").classList.add("result-mode");
      document.getElementById("lumiBubble").innerHTML = "네 답을 살펴봤어!<br>이런 책들이 잘 어울릴 것 같아.";
      recommendOffset = 0;
      renderRecommendedBooks();
    }

    function renderRecommendedBooks() {
      const matchedBooks = getMatchedBooks();
      const start = recommendOffset % matchedBooks.length;
      const selectedBooks = [];

      for (let i = 0; i < 3; i += 1) {
        selectedBooks.push(matchedBooks[(start + i) % matchedBooks.length]);
      }

      const bookList = document.getElementById("bookList");
      bookList.innerHTML = "";

      selectedBooks.forEach((book, index) => {
        const card = document.createElement("div");
        card.className = "br-book-card";
        card.innerHTML = `
          <div class="br-rank">${index + 1}</div>
          <div class="br-book-info">
            <h2>${book.title}</h2>
            <p><strong>${book.author}</strong> 지음</p>
            <p>${book.summary}</p>
            <span class="br-book-reason">${book.reason}</span>
          </div>
          <button type="button" class="br-book-pick" title="이 책으로 읽기 시작하기">🔖</button>
        `;
        bookList.appendChild(card);
      });
    }

    function recommendAnotherBooks() {
      recommendOffset += 3;
      renderRecommendedBooks();
    }

    function restartQuestions() {
      answers = {};
      selectedValue = null;
      currentQuestionIndex = 0;
      document.getElementById("bookRecommendPage").classList.remove("result-mode");
      renderQuestion();
    }

    function goFriendBookShelf() {
      window.location.href = "./friend-book-shelf.html";
    }

  </script>
