      gap: 20px;

    .br-progress-count {

      height: 52px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(178, 113, 31, 0.24);
      border-radius: 999px;
      background: rgba(255, 247, 224, 0.92);
      color: #5e3715;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 8px 16px rgba(109, 67, 18, 0.08);

      display: grid;
      grid-template-columns: repeat(6, 1fr);
      align-items: center;
      position: relative;
      height: 40px;

    .br-progress-line::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: rgba(175, 113, 33, 0.24);
      transform: translateY(-50%);

    .br-progress-dot {
      position: relative;
      z-index: 2;
      justify-self: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ead9b9;
      border: 2px solid #fff9ec;
      box-shadow: 0 3px 8px rgba(104, 66, 20, 0.12);

      line-height: 1.2;
      letter-spacing: -0.055em;

      display: none;
    }

      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

  padding: 30px 18px 26px;
  border: 2px solid rgba(192, 132, 48, 0.2);
  border-radius: 30px;
  background:

  color: #523112;
  cursor: pointer;
  box-shadow: 0 12px 22px rgba(101, 63, 18, 0.09);

}

      box-shadow: 0 16px 28px rgba(101, 63, 18, 0.14);

    .br-result-header {

<body>

  <script src="../js/auth.js"></script>

  <script>
    // 개발 중 화면 확인을 위해 로그인 체크를 잠시 꺼둡니다.
    // checkLogin();

    const questions = [
      {
        key: "thickness",
        title: "읽을 책의 두께는 어느 정도가 좋아?",
        options: [
          { label: "가볍게 읽는\n얇은 책", icon: "🪶", value: "thin" },

        options: [
          { label: "재미있고\n웃긴 이야기", icon: "😄", value: "funny" },
          { label: "따뜻하고\n감동적인 이야기", icon: "🌷", value: "warm" },
          { label: "긴장감 있는\n모험 이야기", icon: "🧭", value: "adventure" },
          { label: "마음이 뭉클한\n성장 이야기", icon: "🌱", value: "growth" },
          { label: "생각할 거리가\n있는 이야기", icon: "💭", value: "thinking" },
          { label: "무섭거나\n신비로운 이야기", icon: "🌙", value: "mystic" }
        ]
      },
      {
        key: "genre",
        title: "어떤 종류의 책을 읽고 싶어?",
        options: [
          { label: "친구와\n학교 이야기", icon: "🏫", value: "school" },
          { label: "판타지·\n모험 이야기", icon: "✨", value: "fantasy" },
          { label: "동물·자연\n이야기", icon: "🦁", value: "nature" },
          { label: "역사·위인\n이야기", icon: "🏛️", value: "history" },
          { label: "과학·정보\n책", icon: "🔎", value: "info" },
          { label: "추리·미스터리\n이야기", icon: "🕵️", value: "mystery" }
        ]
      },
      {
        key: "picture",
        title: "책에 그림이 어느 정도 있으면 좋아?",
        options: [
          { label: "그림이\n많은 책", icon: "🖼️", value: "many" },
          { label: "글과 그림이\n반반 있는 책", icon: "📘", value: "half" },
          { label: "중간중간\n그림이 있는 책", icon: "📖", value: "some" },
          { label: "글만 있는\n책도 좋아", icon: "📚", value: "text" }
        ]
      },
      {
        key: "difficulty",
        title: "읽기 어려운 정도는 어느 정도가 좋아?",
        options: [
          { label: "쉽고 술술\n읽히는 책", icon: "🍃", value: "easy" },
          { label: "생각하면서\n읽는 책", icon: "💭", value: "medium" },
          { label: "새로운 낱말이\n나와도 괜찮아", icon: "🔤", value: "vocab" },
          { label: "어려워도\n도전할 책", icon: "🏔️", value: "hard" }
        ]
      },
      {
        key: "purpose",
        title: "이번 책을 읽고 어떤 느낌을 얻고 싶어?",
        options: [
          { label: "재미있게\n웃고 싶어", icon: "🌟", value: "joy" },
          { label: "마음이\n따뜻해지고 싶어", icon: "🌷", value: "comfort" },
          { label: "용기와 힘을\n얻고 싶어", icon: "🛡️", value: "courage" },
          { label: "새로운 지식을\n알고 싶어", icon: "🧠", value: "learn" },
          { label: "깊이 생각해\n보고 싶어", icon: "🕯️", value: "think" },
          { label: "친구에게\n소개하고 싶어", icon: "🤝", value: "share" }
        ]
      }
    ];

    const bookPool = [
      { title: "만복이네 떡집", author: "김리리", summary: "소원을 들어주는 신기한 떡집을 만나며 벌어지는 따뜻하고 재미있는 이야기예요.", reason: "재미있고 따뜻한 이야기를 좋아하는 친구에게 잘 맞아요.", tags: ["thin", "normal", "funny", "warm", "fantasy", "many", "easy", "joy", "comfort"] },
      { title: "긴긴밤", author: "루리", summary: "서로 다른 존재들이 함께 길을 걸으며 용기와 사랑을 배워가는 이야기예요.", reason: "마음이 따뜻해지는 성장 이야기를 원할 때 좋아요.", tags: ["normal", "warm", "growth", "adventure", "some", "half", "medium", "comfort", "courage"] },
      { title: "아몬드", author: "손원평", summary: "감정을 느끼기 어려운 소년이 사람들과 만나며 성장하는 이야기예요.", reason: "생각할 거리가 있는 성장 이야기를 좋아한다면 추천해요.", tags: ["normal", "thinking", "growth", "school", "few", "text", "medium", "think", "comfort"] },
      { title: "시간 가게", author: "이나영", summary: "시간을 사고파는 가게를 통해 선택과 후회를 생각하게 하는 이야기예요.", reason: "판타지와 생각할 거리가 함께 있는 책을 찾는 친구에게 어울려요.", tags: ["normal", "adventure", "mystic", "fantasy", "some", "half", "medium", "learn", "think"] },
      { title: "이상한 과자 가게 전천당", author: "히로시마 레이코", summary: "신비한 과자 가게에서 벌어지는 기묘하고 흥미로운 이야기예요.", reason: "상상력 가득한 판타지 이야기를 좋아한다면 잘 맞아요.", tags: ["thin", "normal", "funny", "mystic", "fantasy", "many", "easy", "joy"] },
      { title: "푸른 사자 와니니", author: "이현", summary: "초원의 사자 와니니가 자신의 길을 찾아가는 모험 이야기예요.", reason: "모험과 성장, 용기를 함께 느끼고 싶을 때 추천해요.", tags: ["normal", "adventure", "growth", "nature", "some", "half", "medium", "comfort", "courage"] },
      { title: "수상한 과학실", author: "임시 추천", summary: "생활 속 과학 궁금증을 이야기처럼 재미있게 풀어가는 정보 책이에요.", reason: "새로운 사실을 알고 싶은 친구에게 어울려요.", tags: ["thin", "normal", "info", "some", "half", "easy", "learn"] },
      { title: "마법의 시간여행", author: "메리 폽 어즈번", summary: "책 속 세계를 넘나들며 역사와 모험을 만나는 흥미진진한 이야기예요.", reason: "모험과 배움을 함께 원하는 친구에게 잘 맞아요.", tags: ["thin", "normal", "adventure", "fantasy", "history", "many", "easy", "learn", "share"] },
      { title: "불량한 자전거 여행", author: "김남중", summary: "자전거 여행을 떠난 아이가 여러 사람을 만나며 성장하는 이야기예요.", reason: "현실적인 모험과 성장을 함께 느끼고 싶을 때 좋아요.", tags: ["normal", "adventure", "growth", "school", "few", "text", "medium", "comfort", "courage"] }
    ];

    let currentQuestionIndex = 0;
    let answers = {};
    let selectedValue = null;
    let recommendOffset = 0;

    document.addEventListener("DOMContentLoaded", () => {
      renderQuestion();
    });

    function goIndividualReading() {
      window.location.href = "./individual-reading.html";
    }

    function renderQuestion() {
      const question = questions[currentQuestionIndex];
      selectedValue = answers[question.key] || null;

      document.getElementById("progressCount").textContent = `${currentQuestionIndex + 1} / ${questions.length}`;
      document.getElementById("questionKicker").textContent = `Q${currentQuestionIndex + 1}`;
      document.getElementById("questionTitle").textContent = question.title;

      renderProgress();
      renderOptions(question);
      updateButtons();
    }

    function renderProgress() {
      const progressLine = document.getElementById("progressLine");
      progressLine.innerHTML = "";

      questions.forEach((_, index) => {
        const dot = document.createElement("span");
        dot.className = "br-progress-dot";
        if (index < currentQuestionIndex) dot.classList.add("done");
        if (index === currentQuestionIndex) dot.classList.add("active");
        progressLine.appendChild(dot);
      });
    }

    function renderOptions(question) {
      const optionList = document.getElementById("optionList");
      optionList.innerHTML = "";

      optionList.classList.toggle("many-options", question.options.length === 5);
      optionList.classList.toggle("six-options", question.options.length === 6);
      optionList.classList.toggle("four-options", question.options.length === 4);

      question.options.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "br-option";
        button.dataset.value = option.value;

        if (selectedValue === option.value) {
          button.classList.add("selected");
        }

        button.innerHTML = `
          <div class="br-option-icon">${option.icon}</div>
          <strong>${option.label.replace(/\n/g, "<br>")}</strong>
        `;

        button.onclick = function () {
          selectOption(question.key, option.value);
        };

        optionList.appendChild(button);
      });
    }

    function selectOption(questionKey, optionValue) {
      selectedValue = optionValue;
      answers[questionKey] = optionValue;

      document.querySelectorAll(".br-option").forEach((button) => {
        button.classList.toggle("selected", button.dataset.value === optionValue);
      });

      updateButtons();
    }

    function updateButtons() {
      const prevButton = document.getElementById("prevButton");
      const nextButton = document.getElementById("nextButton");

      prevButton.disabled = currentQuestionIndex === 0;
      nextButton.disabled = !selectedValue;
      nextButton.textContent = currentQuestionIndex === questions.length - 1 ? "책 추천받기 ›" : "다음으로 ›";
    }

    function goPrevQuestion() {
      if (currentQuestionIndex === 0) return;
      currentQuestionIndex -= 1;
      renderQuestion();
    }

    function goNextQuestion() {
      if (!selectedValue) return;

      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex += 1;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function getMatchedBooks() {
      const answerValues = Object.values(answers);

      return [...bookPool]
        .map((book) => {
          const score = answerValues.reduce((total, value) => {
            return total + (book.tags.includes(value) ? 1 : 0);
          }, 0);

          return { ...book, score };
        })
        .sort((a, b) => b.score - a.score);
    }

    function showResult() {
  document.getElementById("bookRecommendPage").classList.add("result-mode");
  recommendOffset = 0;
  renderRecommendedBooks();
}

function renderRecommendedBooks() {
  const matchedBooks = getMatchedBooks();
  const start = recommendOffset % matchedBooks.length;
  const selectedBooks = [];

  for (let i = 0; i < 3; i += 1) {
    selectedBooks.push(matchedBooks[(start + i) % matchedBooks.length]);
  }

  const bookList = document.getElementById("bookList");
  bookList.innerHTML = "";

  selectedBooks.forEach((book, index) => {
    const card = document.createElement("div");
    card.className = "br-book-card";

    card.innerHTML = `
      <div class="br-rank">${index + 1}</div>
      <div class="br-book-info">
        <h2>${book.title}</h2>
        <p class="br-book-author">${book.author} 지음</p>
        <p class="br-book-summary">${book.summary}</p>
      </div>
      <button type="button" class="br-book-pick" title="이 책으로 읽기 시작하기">🔖</button>
    `;

    bookList.appendChild(card);
  });
}

function recommendAnotherBooks() {
  recommendOffset += 3;
  renderRecommendedBooks();
}

    function restartQuestions() {
      answers = {};
      selectedValue = null;
      currentQuestionIndex = 0;
      document.getElementById("bookRecommendPage").classList.remove("result-mode");
      renderQuestion();
    }

    function goFriendBookShelf() {
      window.location.href = "./friend-book-shelf.html";
    }
  </script>

  <script src="../js/individual-power.js?v=power-common-2"></script>
