<!--
  파일명: book-vote.html
  역할: 문답책 프로젝트의 학생용 책 투표 화면입니다.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>문답책 - 책 투표</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 225, 164, 0.24), transparent 30%),
        radial-gradient(circle at 86% 66%, rgba(195, 136, 74, 0.18), transparent 34%),
        linear-gradient(rgba(29, 19, 11, 0.32), rgba(29, 19, 11, 0.66)),
        url("../assets/images/home/home-library-bg.png");
      background-size: cover;
      background-position: center;
      color: #fff3df;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    .vote-page {
      position: relative;
      min-height: 100vh;
      padding: 28px 34px 44px;
    }

    .vote-page::before {
      content: "";
      position: fixed;
      left: 50%;
      top: 80px;
      transform: translateX(-50%);
      width: 960px;
      height: 960px;
      background: radial-gradient(circle, rgba(255, 214, 132, 0.15), transparent 64%);
      pointer-events: none;
      z-index: 0;
    }

    .vote-header {
      position: relative;
      z-index: 2;
      max-width: 1280px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: "Noto Serif KR", serif;
      font-size: 30px;
      font-weight: 900;
      color: #fff6e8;
      letter-spacing: -1px;
      text-shadow:
        0 2px 0 rgba(84, 48, 20, 0.72),
        0 6px 14px rgba(0, 0, 0, 0.32);
    }

    .logo-area img {
      width: 68px;
      height: 68px;
      object-fit: contain;
    }

    .back-button {
      border: 1px solid rgba(233, 182, 105, 0.78);
      border-radius: 999px;
      padding: 12px 22px;
      background: linear-gradient(180deg, rgba(167, 111, 58, 0.96), rgba(101, 64, 35, 0.96));
      color: #fff8ef;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.20),
        inset 0 1px 0 rgba(255, 245, 221, 0.18);
      transition: 0.2s ease;
    }

    .back-button:hover {
      transform: translateY(-2px);
    }

    .vote-card {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      padding: 34px 34px 38px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 82% 10%, rgba(255, 216, 140, 0.16), transparent 34%),
        linear-gradient(180deg, rgba(122, 88, 58, 0.90) 0%, rgba(75, 51, 35, 0.94) 100%);
      border: 1px solid rgba(231, 181, 104, 0.58);
      box-shadow:
        0 24px 52px rgba(0, 0, 0, 0.30),
        inset 0 1px 0 rgba(255, 244, 219, 0.13);
      overflow: hidden;
      backdrop-filter: blur(2px);
    }

    .vote-card::before {
      content: "";
      position: absolute;
      top: -120px;
      right: -110px;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(255, 214, 132, 0.18), transparent 70%);
      pointer-events: none;
    }

    .hero-section {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 24px;
      align-items: center;
      margin-bottom: 26px;
    }

    .lumi-box {
      display: flex;
      justify-content: center;
      align-items: end;
      min-height: 220px;
    }

    .lumi-box img {
      width: 210px;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.25));
    }

    .speech-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lumi-tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 8px 16px;
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(239, 196, 115, 0.92), rgba(190, 131, 64, 0.92));
      color: #fff9f1;
      font-size: 14px;
      font-weight: 900;
      border: 1px solid rgba(255, 230, 180, 0.60);
      box-shadow:
        inset 0 1px 0 rgba(255, 248, 233, 0.22),
        0 4px 10px rgba(0, 0, 0, 0.14);
    }

    .speech-bubble {
      position: relative;
      padding: 25px 28px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 92% 10%, rgba(255, 225, 160, 0.28), transparent 34%),
        linear-gradient(180deg, rgba(255, 248, 232, 0.76) 0%, rgba(239, 217, 184, 0.64) 100%);
      border: 1px solid rgba(255, 226, 170, 0.56);
      color: #4d2d16;
      box-shadow:
        0 16px 30px rgba(0, 0, 0, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.36),
        0 0 20px rgba(210, 152, 69, 0.12);
      backdrop-filter: blur(5px);
    }

    .speech-bubble h1 {
      margin-bottom: 10px;
      font-family: "Noto Serif KR", serif;
      font-size: 36px;
      font-weight: 900;
      line-height: 1.3;
      color: #563016;
      letter-spacing: -1px;
      text-shadow: 0 1px 0 rgba(255, 248, 232, 0.55);
    }

    .speech-bubble p {
      font-size: 18px;
      line-height: 1.8;
      font-weight: 800;
      color: #6a3f20;
    }

    .teacher-note {
      font-size: 15px;
      font-weight: 800;
      color: #f6e2bb;
      line-height: 1.7;
      padding-left: 4px;
    }

    .book-list {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 14px;
    }

    .book-card {
      padding: 20px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 80% 6%, rgba(255, 214, 132, 0.10), transparent 38%),
        linear-gradient(180deg, rgba(137, 98, 65, 0.90) 0%, rgba(86, 58, 39, 0.94) 100%);
      border: 1px solid rgba(231, 181, 104, 0.50);
      box-shadow:
        0 12px 24px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 246, 224, 0.10);
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 500px;
      transition: 0.2s ease;
    }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 18px 30px rgba(0, 0, 0, 0.22),
        0 0 0 2px rgba(244, 196, 122, 0.14);
    }

    .cover-box {
      height: 190px;
      border-radius: 22px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 220, 150, 0.16), transparent 38%),
        linear-gradient(180deg, rgba(117, 83, 49, 0.90) 0%, rgba(86, 57, 34, 0.94) 100%);
      border: 1px solid rgba(236, 190, 119, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      color: #f8e9cc;
      padding: 18px;
    }

    .cover-placeholder-icon {
      font-size: 38px;
      line-height: 1;
    }

    .cover-placeholder-text {
      font-size: 14px;
      line-height: 1.6;
      font-weight: 800;
      color: #f7dfb8;
    }

    .book-info h2 {
      margin-bottom: 6px;
      font-family: "Noto Serif KR", serif;
      font-size: 25px;
      font-weight: 900;
      color: #fff7e9;
      letter-spacing: -0.8px;
    }

    .book-author {
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 800;
      color: #f4cc87;
    }

    .book-summary-label {
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 900;
      color: #ffdca0;
    }

    .book-summary {
      font-size: 15px;
      line-height: 1.8;
      font-weight: 700;
      color: #f8e2bf;
      min-height: 132px;
    }

    .vote-button {
      margin-top: auto;
      width: 100%;
      border: 1px solid rgba(255, 226, 166, 0.72);
      border-radius: 16px;
      padding: 14px 16px;
      background: linear-gradient(180deg, #efc16f 0%, #b77939 100%);
      color: #fffaf2;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 249, 234, 0.22),
        0 8px 14px rgba(0, 0, 0, 0.16);
      transition: 0.2s ease;
    }

    .vote-button:hover {
      transform: translateY(-2px);
      background: linear-gradient(180deg, #f5cd83 0%, #c78641 100%);
    }

    .state-box {
      display: none;
      margin-top: 30px;
    }

    .state-box.show {
      display: block;
    }

    .state-button {
      border: none;
      border-radius: 999px;
      padding: 13px 22px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .state-button.primary {
      background: linear-gradient(180deg, #efc16f 0%, #b77939 100%);
      color: #fff9f0;
      box-shadow:
        inset 0 1px 0 rgba(255, 249, 234, 0.24),
        0 8px 14px rgba(0, 0, 0, 0.16);
    }

    .state-button.secondary {
      background: rgba(243, 225, 191, 0.92);
      color: #6a4020;
      border: 1px solid rgba(203, 154, 78, 0.56);
    }

    .state-button:hover {
      transform: translateY(-2px);
    }

    /* ===== 투표 완료 화면 재구성 ===== */
   .vote-complete-panel {
  position: relative;
  overflow: hidden;
  min-height: 430px;
  padding: 38px 44px;
  border-radius: 34px;
  background:
    radial-gradient(circle at 18% 24%, rgba(255, 236, 184, 0.52), transparent 30%),
    radial-gradient(circle at 88% 16%, rgba(214, 148, 64, 0.24), transparent 32%),
    linear-gradient(135deg, rgba(255, 247, 229, 0.97), rgba(224, 198, 158, 0.94));
  border: 1px solid rgba(236, 190, 119, 0.62);
  box-shadow:
    0 24px 48px rgba(31, 18, 9, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.62);
  color: #4b2b14;
}

    .vote-complete-panel::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 26px;
      border: 1px solid rgba(130, 78, 33, 0.12);
      pointer-events: none;
    }

    .vote-complete-panel::after {
      content: "";
      position: absolute;
      right: -80px;
      bottom: -95px;
      width: 310px;
      height: 310px;
      background: radial-gradient(circle, rgba(255, 215, 132, 0.34), transparent 68%);
      pointer-events: none;
    }

    .vote-complete-inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      gap: 36px;
      align-items: center;
    }

    .vote-complete-illustration {
      width: 190px;
      height: 190px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 42px;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 232, 169, 0.62), transparent 62%),
        linear-gradient(180deg, rgba(123, 75, 33, 0.18), rgba(123, 75, 33, 0.06));
      border: 1px solid rgba(150, 91, 43, 0.18);
      box-shadow:
        0 18px 34px rgba(96, 56, 24, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.42);
    }

    .vote-complete-illustration img {
      width: 152px;
      height: 152px;
      object-fit: contain;
      filter:
        drop-shadow(0 18px 22px rgba(74, 43, 18, 0.32))
        drop-shadow(0 0 18px rgba(238, 181, 78, 0.44));
    }

    .vote-complete-content {
      display: flex;
      flex-direction: column;
      gap: 13px;
      min-width: 0;
    }

    .vote-complete-chip {
      width: fit-content;
      padding: 8px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #76502c, #b77a35);
      color: #fff5dc;
      font-size: 14px;
      font-weight: 900;
      box-shadow:
        0 8px 16px rgba(81, 47, 18, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .vote-complete-title {
      margin: 0;
      font-family: "Noto Serif KR", serif;
      font-size: 38px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -1px;
      color: #4d2b13;
      text-shadow: 0 1px 0 rgba(255, 248, 232, 0.60);
    }

    .vote-complete-book {
      margin: 0;
      font-size: 21px;
      font-weight: 900;
      color: #6b3f1e;
      line-height: 1.55;
    }

    .vote-complete-book strong {
      color: #9a5a25;
      font-family: "Noto Serif KR", serif;
      font-size: 25px;
    }

    .vote-complete-desc {
      margin: 0;
      font-size: 17px;
      line-height: 1.65;
      font-weight: 800;
      color: #674522;
    }

    .vote-complete-notice {
      margin-top: 4px;
      padding: 16px 18px;
      border-radius: 20px;
      background: rgba(96, 58, 28, 0.10);
      border: 1px solid rgba(135, 87, 43, 0.14);
      color: #65421f;
      font-size: 15px;
      line-height: 1.65;
      font-weight: 800;
    }

    .vote-complete-button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .vote-complete-button-row .state-button {
      min-width: 188px;
      min-height: 52px;
    }

    /* ===== 투표 결과 화면 ===== */
    #resultBox {
      padding: 28px;
      border-radius: 28px;
      background:
        radial-gradient(circle at 92% 10%, rgba(255, 225, 160, 0.18), transparent 34%),
        linear-gradient(180deg, rgba(255, 248, 232, 0.86) 0%, rgba(239, 217, 184, 0.78) 100%);
      border: 1px solid rgba(221, 179, 108, 0.62);
      color: #563117;
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(5px);
    }

    #resultBox h3 {
      margin-bottom: 10px;
      font-family: "Noto Serif KR", serif;
      font-size: 30px;
      font-weight: 900;
      color: #61361a;
    }

    #resultText {
      font-size: 23px;
      line-height: 1.7;
      font-weight: 900;
      color: #5b3218;
      margin-bottom: 18px;
    }

    #resultText strong {
      font-size: 27px;
      color: #8a4f1f;
      font-family: "Noto Serif KR", serif;
    }

    .result-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 30px;
      align-items: stretch;
      margin-top: 22px;
    }

    .selected-book-preview {
      padding: 18px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 221, 145, 0.22), transparent 44%),
        linear-gradient(180deg, rgba(128, 84, 45, 0.90), rgba(78, 50, 30, 0.94));
      border: 1px solid rgba(218, 166, 88, 0.46);
      box-shadow:
        inset 0 1px 0 rgba(255, 245, 219, 0.16),
        0 12px 24px rgba(77, 43, 18, 0.18);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .selected-cover {
      width: 100%;
      height: 210px;
      border-radius: 20px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 22%, rgba(255, 226, 151, 0.28), transparent 42%),
        linear-gradient(180deg, rgba(115, 76, 42, 0.95), rgba(63, 39, 24, 0.96));
      border: 1px solid rgba(238, 192, 119, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .selected-cover-placeholder {
      width: 104px;
      height: 142px;
      border-radius: 12px;
      background:
        linear-gradient(135deg, rgba(238, 193, 112, 0.92), rgba(117, 72, 34, 0.96));
      border: 1px solid rgba(255, 230, 170, 0.48);
      box-shadow:
        inset 10px 0 0 rgba(84, 49, 24, 0.28),
        0 12px 22px rgba(0, 0, 0, 0.18);
      position: relative;
    }

    .selected-cover-placeholder::before {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      top: 34px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 238, 195, 0.78);
      box-shadow:
        0 17px 0 rgba(255, 238, 195, 0.58),
        0 34px 0 rgba(255, 238, 195, 0.42);
    }

    .selected-book-title {
      font-family: "Noto Serif KR", serif;
      font-size: 23px;
      font-weight: 900;
      color: #fff4df;
      line-height: 1.4;
    }

    .selected-book-author {
      margin-top: 5px;
      font-size: 15px;
      font-weight: 800;
      color: #f3c982;
    }

    .result-content {
      min-width: 0;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .result-guide {
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(119, 76, 43, 0.10);
      border: 1px solid rgba(145, 95, 49, 0.16);
      color: #6b4120;
      font-size: 15px;
      line-height: 1.7;
      font-weight: 900;
    }

    .result-bars {
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin: 0 0 20px;
    }

    .result-row {
      display: grid;
      grid-template-columns: 150px 1fr 52px;
      gap: 14px;
      align-items: center;
      color: #68401f;
      font-size: 15px;
      font-weight: 900;
    }

    .result-book-name {
      white-space: nowrap;
    }

    .result-bar-track {
      height: 18px;
      border-radius: 999px;
      background: rgba(117, 76, 44, 0.16);
      overflow: hidden;
    }

    .result-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #d99b4f, #f3c879);
    }

    .state-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 1100px) {
      .hero-section {
        grid-template-columns: 1fr;
      }

      .lumi-box {
        justify-content: flex-start;
      }

      .book-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 800px) {
      .vote-complete-panel {
        padding: 32px 24px;
      }

      .vote-complete-inner {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .vote-complete-illustration {
        width: 160px;
        height: 160px;
      }

      .vote-complete-illustration img {
        width: 128px;
        height: 128px;
      }

      .vote-complete-title {
        font-size: 30px;
      }

      .vote-complete-button-row {
        flex-direction: column;
      }

      .vote-complete-button-row .state-button {
        width: 100%;
      }

      .result-layout {
        grid-template-columns: 1fr;
      }

      .result-row {
        grid-template-columns: 1fr;
        gap: 7px;
      }
    }

    @media (max-width: 600px) {
      .vote-page {
        padding: 20px;
      }

      .vote-header {
        gap: 14px;
        align-items: flex-start;
      }

      .logo-area {
        font-size: 24px;
      }

      .logo-area img {
        width: 56px;
        height: 56px;
      }

      .vote-card {
        padding: 24px 20px 24px;
      }

      .speech-bubble h1 {
        font-size: 28px;
      }

      .speech-bubble p {
        font-size: 16px;
      }

      .book-card {
        min-height: auto;
      }

      .book-summary {
        min-height: auto;
      }
    }
  </style>
</head>

<body>
  <div class="vote-page">

    <header class="vote-header">
      <div class="logo-area">
        <img src="../assets/images/logo-book.png" alt="문답책 로고">
        <span>문답책</span>
      </div>

      <button class="back-button" onclick="goPracticePage()">← 연습하기로</button>
    </header>

    <main class="vote-card">

      <!-- 루미 안내 영역 -->
      <section class="hero-section">
        <div class="lumi-box">
          <img src="../assets/images/character/book-vote-lumi.png" alt="책 투표를 안내하는 루미 캐릭터">
        </div>

        <div class="speech-area">
          <span class="lumi-tag">루미의 안내</span>

          <div class="speech-bubble">
            <h1>우리 반이 읽을 책을 투표해볼까?</h1>
            <p>
              선생님이 올려준 책 후보를 살펴보고,<br>
              가장 읽고 싶은 책 한 권을 골라줘!
            </p>
          </div>

          
      </section>

      <!-- 책 후보 카드 -->
      <section class="book-list" id="bookList"></section>

      <!-- 투표 완료 상태 -->
      <section class="state-box" id="waitingBox">
        <div class="vote-complete-panel">
          <div class="vote-complete-inner">
            <div class="vote-complete-illustration">
              <img src="../assets/images/book-vote/mystic-hourglass.png" alt="투표 완료를 알려주는 신비로운 모래시계">
            </div>

            <div class="vote-complete-content">
  <span class="vote-complete-chip">투표 완료</span>

  <!-- 학생이 고른 책 제목이 들어가는 메인 제목입니다. -->
  <h3 class="vote-complete-title" id="waitingText">
    내가 고른 책에 투표했어요.
  </h3>

  <p class="vote-complete-desc">
    친구들의 투표가 모두 끝나면 우리 반이 함께 읽을 책 결과를 확인할 수 있어요.
  </p>

  <div class="vote-complete-notice">
    잠시 기다리는 동안 다른 책 후보의 줄거리도 다시 살펴볼 수 있어요.
  </div>

              <div class="vote-complete-button-row">
                <button class="state-button secondary" onclick="goPracticePage()">
                  연습하기로 돌아가기
                </button>

                <button class="state-button primary" onclick="showResultState()">
                  투표 결과 확인하기
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 투표 결과 상태 -->
      <section class="state-box" id="resultBox">
        <h3>투표 결과를 확인해볼까요?</h3>

        <p id="resultText">
          우리 반이 가장 읽고 싶은 책은 <strong>긴긴밤</strong>이에요.
        </p>

        <div class="result-layout">
          <div class="selected-book-preview" id="selectedBookPreview"></div>

          <div class="result-content">
            <div class="result-guide">
              가장 많은 표를 받은 책으로 읽기 전 활동을 시작해요.
            </div>

            <div class="result-bars">
              <div class="result-row">
                <span class="result-book-name">긴긴밤</span>
                <div class="result-bar-track">
                  <div class="result-bar-fill" style="width: 100%;"></div>
                </div>
                <strong>17표</strong>
              </div>

              <div class="result-row">
                <span class="result-book-name">만복이네 떡집</span>
                <div class="result-bar-track">
                  <div class="result-bar-fill" style="width: 47%;"></div>
                </div>
                <strong>8표</strong>
              </div>

              <div class="result-row">
                <span class="result-book-name">불량한 자전거 여행</span>
                <div class="result-bar-track">
                  <div class="result-bar-fill" style="width: 29%;"></div>
                </div>
                <strong>5표</strong>
              </div>
            </div>

            <div class="state-actions">
              <button class="state-button secondary" onclick="goPracticePage()">
                연습하기로 돌아가기
              </button>

              <button class="state-button primary" onclick="goPracticePage()">
                읽기 전 활동 열기
              </button>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>
    // 로그인한 학생 ID를 가져옵니다.
    const studentId = sessionStorage.getItem("studentId") || "test-student";

    // 학생별 투표 결과 저장 키입니다.
    const voteKey = `bookVote_${studentId}`;

    // 연습하기 진행 상태 저장 키입니다.
    const progressKey = `practiceProgress_${studentId}`;

    /*
      교사 계정에서 책 정보를 등록했다고 가정한 임시 데이터입니다.
      coverImage가 비어 있으면 현재는 표지 placeholder가 보입니다.
      나중에 교사 계정이 연결되면 실제 등록 이미지를 넣으면 됩니다.
    */
    const teacherBookCandidates = [
      {
        id: 1,
        title: "긴긴밤",
        author: "루리",
        summary: "세상에 마지막 하나 남은 흰바위코뿔소와 어린 펭귄이 함께 길을 떠나는 이야기예요. 서로 다른 존재가 함께 살아가는 마음을 생각해 볼 수 있어요.",
        coverImage: ""
      },
      {
        id: 2,
        title: "만복이네 떡집",
        author: "김리리",
        summary: "신기한 떡집에서 특별한 떡을 만나며 벌어지는 이야기예요. 상상력을 자극하고, 주인공의 마음 변화를 재미있게 따라갈 수 있어요.",
        coverImage: ""
      },
      {
        id: 3,
        title: "불량한 자전거 여행",
        author: "김남중",
        summary: "자전거 여행을 통해 친구와 가족, 성장의 의미를 만나게 되는 이야기예요. 여행길에서 벌어지는 사건을 따라가며 다양한 생각을 나눌 수 있어요.",
        coverImage: ""
      }
    ];

    renderBookCards();

    // 책 후보 카드를 화면에 그립니다.
    function renderBookCards() {
      const bookList = document.getElementById("bookList");
      bookList.innerHTML = "";

      teacherBookCandidates.forEach(function(book) {
        const card = document.createElement("article");
        card.className = "book-card";

        let coverHtml = "";

        if (book.coverImage && book.coverImage.trim() !== "") {
          coverHtml = `
            <div class="cover-box">
              <img src="${book.coverImage}" alt="${book.title} 책 표지">
            </div>
          `;
        } else {
          coverHtml = `
            <div class="cover-box">
              <div class="cover-placeholder">
                <div class="cover-placeholder-icon">📚</div>
                <div class="cover-placeholder-text">
                  선생님이 등록한<br>
                  책 표지 이미지가 들어올 자리예요.
                </div>
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          ${coverHtml}

          <div class="book-info">
            <h2>${book.title}</h2>
            <div class="book-author">${book.author} 글</div>
            <div class="book-summary-label">줄거리</div>
            <p class="book-summary">${book.summary}</p>
          </div>

          <button class="vote-button" onclick="voteBook(${book.id})">
            이 책에 투표하기
          </button>
        `;

        bookList.appendChild(card);
      });
    }

    // 학생이 책에 투표합니다.
    function voteBook(bookId) {
      const selectedBook = teacherBookCandidates.find(function(book) {
        return book.id === bookId;
      });

      // 학생이 고른 책을 저장합니다.
      sessionStorage.setItem(voteKey, JSON.stringify(selectedBook));

      // 연습하기 1단계(책 고르기)를 완료 처리합니다.
      let progress = JSON.parse(sessionStorage.getItem(progressKey)) || {
        book: false,
        before: false,
        during: false,
        classRead: false,
        after: false
      };

      progress.book = true;
      sessionStorage.setItem(progressKey, JSON.stringify(progress));

      const waitingBox = document.getElementById("waitingBox");
      const resultBox = document.getElementById("resultBox");
      const waitingText = document.getElementById("waitingText");

      waitingText.innerHTML = `
        <strong>${selectedBook.title}</strong>에 투표했어요.
      `;

      waitingBox.classList.add("show");
      resultBox.classList.remove("show");

      waitingBox.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    // 시연용 투표 결과 확인 상태입니다.
    function showResultState() {
      const waitingBox = document.getElementById("waitingBox");
      const resultBox = document.getElementById("resultBox");
      const resultText = document.getElementById("resultText");
      const selectedBookPreview = document.getElementById("selectedBookPreview");

      /*
        지금은 시연용이라 가장 많은 표를 받은 책을 고정으로 보여줍니다.
        나중에 백엔드가 연결되면 실제 투표 결과 1등 책으로 바꾸면 됩니다.
      */
      const winningBook = teacherBookCandidates[0];

      resultText.innerHTML = `
        우리 반이 가장 읽고 싶은 책은 <strong>${winningBook.title}</strong>이에요.
      `;

      let coverHtml = "";

      if (winningBook.coverImage && winningBook.coverImage.trim() !== "") {
        coverHtml = `
          <div class="selected-cover">
            <img src="${winningBook.coverImage}" alt="${winningBook.title} 책 표지">
          </div>
        `;
      } else {
        coverHtml = `
          <div class="selected-cover">
            <div class="selected-cover-placeholder"></div>
          </div>
        `;
      }

      selectedBookPreview.innerHTML = `
        ${coverHtml}
        <div class="selected-book-title">${winningBook.title}</div>
        <div class="selected-book-author">${winningBook.author} 글</div>
      `;

      waitingBox.classList.remove("show");
      resultBox.classList.add("show");

      resultBox.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    // 연습하기 화면으로 돌아갑니다.
function goPracticePage() {
  // 책 고르기 단계를 완료 처리합니다.
  const studentId = sessionStorage.getItem("studentId") || "student-demo";
  const practiceProgressKey = "practiceProgress_" + studentId;

  let practiceProgress = JSON.parse(sessionStorage.getItem(practiceProgressKey)) || {
    book: false,
    before: false,
    during: false,
    classRead: false,
    after: false
  };

  // 책 고르기를 완료한 것으로 저장합니다.
  practiceProgress.book = true;

  // 저장한 진행 상태를 sessionStorage에 다시 넣습니다.
  sessionStorage.setItem(practiceProgressKey, JSON.stringify(practiceProgress));

  // 연습하기 화면으로 이동합니다.
  location.href = "./practice.html";
}
  </script>
  <script src="../js/fixed-stage.js"></script>
</body>
</html>
