<!--
  파일명: during-reading-practice.html
  역할: 문답책 프로젝트 - 읽기 중 질문 종류별 연습 화면입니다.

  구현 범위:
  1. 질문 종류 선택 화면
  2. 방법 알기 화면
  3. 기본 연습 화면
  4. 심화 연습 화면

  공식 표기:
  - 화면에는 반드시 '문답책' 또는 '문답책 프로젝트'를 사용합니다.
  - 'Victory'라는 이름은 사용하지 않습니다.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문답책 - 읽기 중 질문 연습</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #fff1d0;
      background:
        linear-gradient(rgba(0, 0, 0, 0.32), rgba(0, 0, 0, 0.72)),
        url("../assets/images/during-reading/intro/during-reading-practice-bg.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    button, textarea { font-family: inherit; }
    button { cursor: pointer; }

    .page { min-height: 100vh; padding: 24px 38px 30px; }
    .page-inner { max-width: 1480px; margin: 0 auto; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Noto Serif KR", serif;
      color: #fff4d8;
      font-size: 29px;
      font-weight: 900;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.65);
    }

    .logo-area img {
      width: 62px;
      height: 62px;
      object-fit: contain;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.5));
    }

    .nav-button {
      border: 1px solid rgba(218, 160, 65, 0.45);
      border-radius: 999px;
      padding: 13px 24px;
      background: rgba(25, 17, 10, 0.72);
      color: #fff0cf;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.35);
    }

    .nav-button:hover { transform: translateY(-2px); background: rgba(69, 44, 22, 0.82); }

    .hero-card {
      position: relative;
      min-height: 720px;
      overflow: hidden;
      border-radius: 34px;
      border: 1px solid rgba(218, 160, 65, 0.48);
      background:
        radial-gradient(circle at 50% 8%, rgba(221, 158, 55, 0.13), transparent 34%),
        linear-gradient(180deg, rgba(15, 12, 9, 0.78), rgba(4, 4, 3, 0.86));
      box-shadow: 0 36px 80px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 230, 166, 0.08);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 38%, rgba(216, 150, 42, 0.13), transparent 38%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.08), transparent 45%, rgba(0, 0, 0, 0.18));
      z-index: 0;
    }

    .screen { position: relative; z-index: 1; padding: 38px 58px 48px; }

    .screen-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 24px;
    }

    .title-badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 9px 20px;
      border-radius: 999px;
      background: linear-gradient(180deg, #d8a84c, #8d551a);
      border: 1px solid rgba(255, 220, 142, 0.6);
      color: #fff3d0;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.28);
    }

    .main-title {
      font-family: "Noto Serif KR", serif;
      color: #fff3d4;
      font-size: 43px;
      font-weight: 900;
      line-height: 1.24;
      letter-spacing: -1.4px;
      word-break: keep-all;
      text-shadow: 0 3px 0 rgba(51, 29, 9, 0.9), 0 10px 24px rgba(0, 0, 0, 0.7);
    }

    .main-desc {
      margin-top: 15px;
      color: rgba(255, 228, 186, 0.9);
      font-size: 18px;
      font-weight: 850;
      line-height: 1.65;
      word-break: keep-all;
    }

    .progress-pill {
      flex-shrink: 0;
      padding: 14px 22px;
      border-radius: 999px;
      background: rgba(9, 7, 5, 0.68);
      border: 1px solid rgba(214, 154, 60, 0.5);
      color: #f2cf82;
      font-size: 16px;
      font-weight: 900;
    }

    /* 질문 종류 선택 화면 */
    .question-map {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      min-height: 500px;
      padding: 20px;
      border-radius: 28px;
      background: radial-gradient(circle at 50% 50%, rgba(222, 159, 49, 0.16), transparent 26%), linear-gradient(180deg, rgba(12, 10, 8, 0.74), rgba(4, 4, 3, 0.8));
      border: 1px solid rgba(198, 138, 50, 0.36);
      box-shadow: 0 28px 58px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 223, 158, 0.08);
    }

    .question-cell {
      position: relative;
      min-height: 230px;
      padding: 30px 34px 80px;
      overflow: hidden;
      border: 1px solid rgba(185, 125, 43, 0.34);
      background: radial-gradient(circle at 82% 26%, rgba(222, 158, 44, 0.14), transparent 26%), linear-gradient(180deg, rgba(19, 16, 13, 0.78), rgba(5, 5, 4, 0.84));
      box-shadow: inset 0 1px 0 rgba(255, 231, 168, 0.06), 0 14px 28px rgba(0, 0, 0, 0.35);
      color: #fff1ce;
      text-align: left;
      transition: 0.2s ease;
    }

    .question-cell:nth-child(1) { border-radius: 24px 8px 8px 8px; }
    .question-cell:nth-child(2) { border-radius: 8px 24px 8px 8px; }
    .question-cell:nth-child(3) { border-radius: 8px 8px 8px 24px; }
    .question-cell:nth-child(4) { border-radius: 8px 8px 24px 8px; }

    .question-cell.open {
      border-color: rgba(255, 211, 112, 0.95);
      background: radial-gradient(circle at 82% 25%, rgba(255, 189, 55, 0.28), transparent 28%), radial-gradient(circle at 12% 82%, rgba(189, 116, 24, 0.24), transparent 32%), linear-gradient(180deg, rgba(74, 48, 18, 0.82), rgba(18, 12, 7, 0.9));
      box-shadow: inset 0 0 0 2px rgba(236, 181, 72, 0.24), 0 0 34px rgba(230, 164, 42, 0.34), 0 20px 40px rgba(0, 0, 0, 0.48);
    }

    .question-cell.open:hover { transform: translateY(-4px); }
    .question-cell.locked { opacity: 0.46; filter: grayscale(0.55) brightness(0.7); cursor: not-allowed; }
    .question-cell.done { border-color: rgba(156, 216, 118, 0.7); }

    .cell-number { position: relative; z-index: 3; margin-bottom: 12px; color: #d8a851; font-size: 16px; font-weight: 900; }

    .cell-icon-img {
      position: absolute;
      right: 34px;
      top: 34px;
      width: 126px;
      height: 126px;
      object-fit: contain;
      opacity: 0.92;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 18px rgba(224, 158, 45, 0.24));
    }

    .cell-title {
      position: relative;
      z-index: 3;
      max-width: 60%;
      margin-top: 18px;
      color: #fff1ca;
      font-family: "Noto Serif KR", serif;
      font-size: 27px;
      font-weight: 900;
      line-height: 1.42;
      letter-spacing: -0.9px;
      word-break: keep-all;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.72), 0 0 14px rgba(224, 158, 45, 0.18);
    }

    .cell-desc {
      position: relative;
      z-index: 3;
      max-width: 58%;
      margin-top: 12px;
      color: rgba(255, 228, 184, 0.86);
      font-size: 15px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .cell-state {
      position: absolute;
      left: 34px;
      bottom: 26px;
      width: 210px;
      padding: 12px 10px;
      border-radius: 999px;
      background: rgba(8, 6, 4, 0.76);
      border: 1px solid rgba(201, 139, 52, 0.44);
      color: #cdb37a;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
    }

    .question-cell.open .cell-state { background: linear-gradient(180deg, #dca64a, #8b551a); color: #fff4d4; }

    .question-core {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 20;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 170px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      text-align: center;
      background: radial-gradient(circle at 42% 26%, #f5d38a 0%, #9a641f 55%, #251306 100%);
      border: 1px solid rgba(255, 211, 114, 0.9);
      box-shadow: 0 0 42px rgba(226, 163, 42, 0.52), 0 18px 38px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 246, 210, 0.26);
      color: #fff1c8;
      font-family: "Noto Serif KR", serif;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.35;
    }

    .question-core span { display: block; margin-top: 5px; color: #ffd56f; font-size: 34px; text-shadow: 0 0 18px rgba(255, 204, 76, 0.85); }

    /* 공통 카드 */
    .two-column-layout { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 26px; align-items: stretch; }

    .dark-card {
      min-height: 500px;
      padding: 24px;
      border-radius: 28px;
      border: 1px solid rgba(210, 154, 64, 0.44);
      background: radial-gradient(circle at 50% 0%, rgba(221, 160, 58, 0.12), transparent 38%), linear-gradient(180deg, rgba(22, 17, 12, 0.84), rgba(7, 6, 5, 0.88));
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.44), inset 0 1px 0 rgba(255, 226, 164, 0.08);
    }

    .section-label { color: #e3b35d; font-size: 18px; font-weight: 900; margin-bottom: 12px; }

    .story-box {
      min-height: 220px;
      padding: 26px 28px;
      display: flex;
      align-items: center;
      border-radius: 24px;
      border: 1px solid rgba(218, 166, 76, 0.46);
      background: radial-gradient(circle at 50% 15%, rgba(255, 216, 126, 0.08), transparent 34%), linear-gradient(180deg, rgba(9, 8, 6, 0.9), rgba(3, 3, 2, 0.92));
    }

    .story-box p {
      color: #fff0c9;
      font-family: "Noto Serif KR", serif;
      font-size: 27px;
      font-weight: 900;
      line-height: 1.7;
      word-break: keep-all;
      text-shadow: 0 5px 16px rgba(0, 0, 0, 0.66);
    }

    .story-highlight {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(255, 213, 106, 0.32);
      box-shadow: 0 0 0 1px rgba(255, 224, 135, 0.24), 0 0 18px rgba(255, 203, 87, 0.16);
      color: #fff8d5;
    }

   /* =========================================================
   왼쪽 도움 카드 / 생각 흐름 / 오른쪽 질문 선택 디자인
   - 전체 분위기는 문답책 판타지 톤을 유지합니다.
   - 왼쪽 단서 영역과 오른쪽 질문 선택 영역이 헷갈리지 않도록
     색감과 형태를 조금 다르게 나눕니다.
========================================================= */

/* 왼쪽 단서/답/생각 흐름 기본 묶음 */
.support-grid {
  display: grid;
  gap: 10px;
  margin-top: 16px;
  padding: 14px;
  border-radius: 24px;
  border: 1px solid rgba(210, 154, 64, 0.38);
  background:
    radial-gradient(circle at 8% 0%, rgba(255, 211, 104, 0.12), transparent 34%),
    linear-gradient(145deg, rgba(61, 41, 20, 0.48), rgba(13, 10, 7, 0.82));
  box-shadow:
    inset 0 0 0 1px rgba(255, 238, 188, 0.05),
    0 16px 34px rgba(0, 0, 0, 0.22);
}

/* 왼쪽 단서 카드 */
.support-card {
  position: relative;
  padding: 13px 16px;
  border-radius: 16px;
  border: 1px solid rgba(218, 166, 76, 0.28);
  background:
    linear-gradient(90deg, rgba(255, 222, 145, 0.12), rgba(255, 230, 166, 0.045));
  color: #ffe9b7;
  font-size: 16px;
  font-weight: 850;
  line-height: 1.45;
  word-break: keep-all;
}

/* 왼쪽 영역 제목 */
.support-card strong {
  color: #ffd477;
}

/* 첫 번째 카드: 단서 제목 느낌 */
.support-grid > .support-card:first-child {
  width: fit-content;
  padding: 8px 15px;
  border-radius: 999px;
  border-color: rgba(255, 218, 127, 0.48);
  background:
    radial-gradient(circle at 30% 20%, rgba(255, 235, 173, 0.18), transparent 40%),
    rgba(214, 156, 48, 0.18);
  color: #ffd978;
  box-shadow: 0 0 18px rgba(228, 171, 54, 0.14);
}

/* 3번 질문 전용: 생각 흐름 박스
   - 선택지 버튼과 다르게 '흐름 안내판'처럼 보이게 합니다. */
.support-grid.thought-flow {
  gap: 0;
  margin-top: 18px;
  padding: 18px 20px;
  border-radius: 24px;
  border: 1px solid rgba(255, 206, 105, 0.52);
  background:
    radial-gradient(circle at 10% 0%, rgba(255, 214, 111, 0.20), transparent 36%),
    radial-gradient(circle at 90% 100%, rgba(96, 148, 88, 0.13), transparent 36%),
    linear-gradient(145deg, rgba(82, 52, 18, 0.56), rgba(12, 9, 6, 0.92));
  box-shadow:
    inset 0 0 0 1px rgba(255, 238, 188, 0.08),
    0 20px 44px rgba(0, 0, 0, 0.30);
}

/* 생각 흐름 제목 */
.support-grid.thought-flow .support-card:first-child {
  width: fit-content;
  margin-bottom: 14px;
  padding: 8px 15px;
  border-radius: 999px;
  border: 1px solid rgba(255, 218, 127, 0.55);
  background:
    linear-gradient(180deg, rgba(234, 181, 68, 0.32), rgba(119, 78, 23, 0.22));
  color: #ffe09a;
  font-size: 15px;
  font-weight: 950;
  box-shadow: 0 0 20px rgba(228, 171, 54, 0.20);
}

/* 생각 흐름 항목 */
.support-grid.thought-flow .support-card:not(:first-child) {
  position: relative;
  min-height: 56px;
  padding: 3px 0 18px 52px;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  color: #fff0c2;
  font-size: 16px;
  font-weight: 850;
  line-height: 1.55;
}

/* 마지막 흐름 항목 */
.support-grid.thought-flow .support-card:last-child {
  padding-bottom: 2px;
}

/* 생각 흐름 번호 */
.support-grid.thought-flow .support-card:not(:first-child)::before {
  content: attr(data-step);
  position: absolute;
  left: 0;
  top: 0;
  width: 31px;
  height: 31px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, #f7cc70, #b97815);
  color: #211306;
  font-size: 13px;
  font-weight: 950;
  box-shadow:
    0 0 18px rgba(239, 184, 65, 0.42),
    inset 0 1px 0 rgba(255, 248, 215, 0.28);
}

/* 생각 흐름 연결선 */
.support-grid.thought-flow .support-card:not(:first-child):not(:last-child)::after {
  content: "";
  position: absolute;
  left: 15px;
  top: 35px;
  width: 2px;
  height: calc(100% - 30px);
  background: linear-gradient(
    180deg,
    rgba(239, 184, 65, 0.65),
    rgba(239, 184, 65, 0.08)
  );
}
/* =========================================================
   4번 질문 전용: 연결 다리 디자인
   - 3번의 생각 흐름과 전체 톤은 맞추되,
   - '책 속 장면 → 내 삶'으로 건너가는 느낌이 나도록
     살짝 청록/금빛 포인트를 섞습니다.
========================================================= */

.support-grid.bridge-flow {
  gap: 0;
  margin-top: 18px;
  padding: 18px 20px;
  border-radius: 24px;
  border: 1px solid rgba(112, 202, 176, 0.46);
  background:
    radial-gradient(circle at 10% 0%, rgba(255, 214, 111, 0.16), transparent 36%),
    radial-gradient(circle at 95% 100%, rgba(95, 207, 178, 0.18), transparent 38%),
    linear-gradient(145deg, rgba(50, 63, 42, 0.58), rgba(12, 9, 6, 0.92));
  box-shadow:
    inset 0 0 0 1px rgba(222, 255, 232, 0.07),
    0 20px 44px rgba(0, 0, 0, 0.30);
}

/* 연결 다리 제목 */
.support-grid.bridge-flow .support-card:first-child {
  width: fit-content;
  margin-bottom: 14px;
  padding: 8px 15px;
  border-radius: 999px;
  border: 1px solid rgba(130, 226, 191, 0.58);
  background:
    linear-gradient(180deg, rgba(89, 190, 154, 0.28), rgba(64, 87, 53, 0.24));
  color: #d7ffe7;
  font-size: 15px;
  font-weight: 950;
  box-shadow: 0 0 20px rgba(105, 221, 177, 0.16);
}

/* 연결 다리 항목 */
.support-grid.bridge-flow .support-card:not(:first-child) {
  position: relative;
  min-height: 56px;
  padding: 3px 0 18px 52px;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  color: #fff0c2;
  font-size: 16px;
  font-weight: 850;
  line-height: 1.55;
}

.support-grid.bridge-flow .support-card:last-child {
  padding-bottom: 2px;
}

/* 연결 다리 번호 */
.support-grid.bridge-flow .support-card:not(:first-child)::before {
  content: attr(data-step);
  position: absolute;
  left: 0;
  top: 0;
  width: 31px;
  height: 31px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, #8de6c2, #35775e);
  color: #07170f;
  font-size: 13px;
  font-weight: 950;
  box-shadow:
    0 0 18px rgba(119, 231, 188, 0.34),
    inset 0 1px 0 rgba(235, 255, 246, 0.28);
}

/* 연결 다리 선 */
.support-grid.bridge-flow .support-card:not(:first-child):not(:last-child)::after {
  content: "";
  position: absolute;
  left: 15px;
  top: 35px;
  width: 2px;
  height: calc(100% - 30px);
  background: linear-gradient(
    180deg,
    rgba(119, 231, 188, 0.58),
    rgba(239, 184, 65, 0.10)
  );
}
/* 오른쪽 안내 문구 */
.choice-guide-title,
.workshop-guide {
  margin-bottom: 14px;
  padding: 14px 18px;
  border-radius: 18px;
  border: 1px solid rgba(218, 166, 76, 0.42);
  background:
    radial-gradient(circle at 0% 50%, rgba(255, 211, 104, 0.12), transparent 40%),
    rgba(255, 230, 166, 0.065);
  color: #ffe6ad;
  font-size: 16px;
  font-weight: 900;
  line-height: 1.5;
  word-break: keep-all;
}

/* 오른쪽 질문 선택 영역 전체 */
.choice-list {
  display: grid;
  gap: 11px;
  padding: 14px;
  border-radius: 22px;
  border: 1px solid rgba(120, 88, 48, 0.38);
  background:
    radial-gradient(circle at 100% 0%, rgba(255, 211, 104, 0.08), transparent 34%),
    linear-gradient(180deg, rgba(9, 8, 6, 0.52), rgba(5, 4, 3, 0.72));
}

/* 오른쪽 선택 버튼
   - 왼쪽 단서 카드보다 더 어둡고 눌리는 버튼처럼 보이게 합니다. */
.choice-button {
  width: 100%;
  min-height: 58px;
  padding: 13px 18px;
  border-radius: 16px;
  border: 1px solid rgba(218, 166, 76, 0.28);
  background:
    linear-gradient(180deg, rgba(34, 26, 18, 0.94), rgba(15, 12, 8, 0.96));
  color: #fff0ca;
  text-align: left;
  font-size: 17px;
  font-weight: 900;
  line-height: 1.4;
  word-break: keep-all;
  transition: 0.16s ease;
  box-shadow:
    inset 0 1px 0 rgba(255, 232, 170, 0.05),
    0 8px 16px rgba(0, 0, 0, 0.18);
}

.choice-button:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 207, 116, 0.68);
  background:
    radial-gradient(circle at 0% 50%, rgba(255, 210, 110, 0.12), transparent 42%),
    linear-gradient(180deg, rgba(47, 34, 20, 0.96), rgba(18, 13, 8, 0.98));
}

/* 선택된 질문 */
.choice-button.selected {
  border-color: rgba(174, 255, 111, 0.76);
  background:
    radial-gradient(circle at 0% 50%, rgba(174, 255, 111, 0.18), transparent 42%),

.lumi-feedback {
  position: relative;
  display: grid;
  grid-template-columns: 74px 1fr;
  align-items: center;
  gap: 16px;

  margin-top: 16px;
  padding: 15px 20px 15px 18px;
  min-height: 94px;

  overflow: hidden;
  border-radius: 22px;
  border: 1px solid rgba(218, 166, 76, 0.46);

  background:
    radial-gradient(circle at 8% 50%, rgba(109, 167, 91, 0.28), transparent 38%),
    radial-gradient(circle at 90% 10%, rgba(255, 211, 104, 0.12), transparent 34%),
    linear-gradient(135deg, rgba(45, 54, 27, 0.62), rgba(13, 10, 7, 0.92));

  color: #ffe6ad;

  box-shadow:
    inset 0 0 0 1px rgba(255, 238, 188, 0.07),
    0 16px 34px rgba(0, 0, 0, 0.26);
}

/* 피드백 박스 안쪽 은은한 빛 */
.lumi-feedback::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      rgba(169, 255, 135, 0.10),
      transparent 34%,
      rgba(255, 211, 104, 0.07)
    );
}

/* 루미 이미지 */
.lumi-feedback img {
  position: relative;
  z-index: 1;

  width: 66px;
  height: auto;
  object-fit: contain;

  filter:
    drop-shadow(0 10px 16px rgba(0, 0, 0, 0.45))
    drop-shadow(0 0 12px rgba(172, 255, 125, 0.18));
}

/* 피드백 문장 */
.lumi-feedback p {
  position: relative;
  z-index: 1;

  margin: 0;
  padding: 0;

  color: #fff0c7;
  font-size: 16px;
  font-weight: 900;
  line-height: 1.55;
  word-break: keep-all;
}

/* 정답 피드백 */
.lumi-feedback.good {
  border-color: rgba(174, 255, 111, 0.66);
  background:
    radial-gradient(circle at 8% 50%, rgba(125, 207, 88, 0.34), transparent 40%),
    radial-gradient(circle at 90% 12%, rgba(255, 224, 130, 0.14), transparent 34%),
    linear-gradient(135deg, rgba(43, 70, 27, 0.70), rgba(13, 12, 7, 0.94));

    0 0 24px rgba(174, 255, 111, 0.13),
    inset 0 0 0 1px rgba(220, 255, 186, 0.08),
    0 16px 34px rgba(0, 0, 0, 0.26);
}

    function goPractice() {
      window.location.href = "./practice.html";
    }

    function saveProgress() {
      sessionStorage.setItem(progressKey, JSON.stringify(progress));
    }

    function getSelectedQuestionType() {
      return questionTypes.find(function(item) { return item.id === selectedQuestionType; });
    }

function isTypeOpen(typeId) {
  // 1번, 2번, 3번 질문은 바로 연습할 수 있게 열어 둡니다.
  if (typeId === "direct" || typeId === "infer" || typeId === "opinion") {
    return true;
  }

  // 4번 질문은 3번 질문 연습을 완료하면 열리게 합니다.
  if (typeId === "connect") {
    return progress.opinion === true;
  }

  return false;
}

    function selectQuestionType(typeId) {
      if (!isTypeOpen(typeId)) return;
      selectedQuestionType = typeId;
      keywordRevealed = false;
      currentBasicIndex = 0;
      currentDeepIndex = 0;
      selectedBasicChoice = null;
      selectedDeepChoice = null;
      deepInputValue = "";
      deepChecked = false;
      deepResult = null;
      renderMethodScreen();
    }

    function goSelectScreen() {
      currentScreen = "select";
      selectedQuestionType = null;
      renderSelectScreen();
    }

    function goMethodScreen() {
      currentScreen = "method";
      keywordRevealed = false;
      selectedBasicChoice = null;
      selectedDeepChoice = null;
      deepInputValue = "";
      deepChecked = false;
      deepResult = null;
      renderMethodScreen();
    }

    function goBasicPracticeScreen() {
      currentScreen = "basic";
      currentBasicIndex = 0;
      selectedBasicChoice = null;
      renderBasicPracticeScreen();
    }

    function goDeepPracticeScreen() {
      currentScreen = "deep";
      currentDeepIndex = 0;
      selectedDeepChoice = null;
      deepInputValue = "";
      deepChecked = false;
      deepResult = null;
      renderDeepPracticeScreen();
    }

    function renderSelectScreen() {
      const app = document.getElementById("app");
      app.innerHTML =
        '<section class="screen">' +
          '<div class="screen-title-row">' +
            '<div>' +
              '<span class="title-badge">읽기 중 질문 연습</span>' +
              '<h1 class="main-title">질문의 힘을 골라 연습해요</h1>' +
              '<p class="main-desc">책을 읽으며 만들 수 있는 질문을 종류별로 연습해요.<br>오늘은 3번, 내 생각과 느낌을 말하게 하는 질문까지 이어서 배워요.</p>' +

    function renderQuestionCell(item) {
      const open = isTypeOpen(item.id);
      const done = progress[item.id];
      const className = 'question-cell ' + (open ? 'open ' : 'locked ') + (done ? 'done' : '');
      const stateText = done ? '연습 완료' : (open ? '연습 시작' : '이전 질문 완료 후 열림');
      return '' +
        '<button class="' + className + '" type="button" onclick="selectQuestionType(\'' + item.id + '\')">' +
          '<div class="cell-number">' + item.number + '</div>' +
          '<img class="cell-icon-img" src="' + item.iconImage + '" alt="">' +
          '<h2 class="cell-title">' + item.title + '</h2>' +
          '<p class="cell-desc">' + item.shortDesc + '</p>' +
          '<div class="cell-state">' + stateText + '</div>' +
        '</button>';
    }

              '</div>' +

   function renderSupportBox(question) {

    function renderDeepActionButton(question) {

  // 정답일 때만 다음 문제 버튼
  if (deepResult && deepResult.ok) {
    return '<button class="main-button" type="button" onclick="goNextDeepQuestion()">다음 문제로 가기 →</button>';
  }

  // 오답이면 화면 이동 없이 다시 검사 가능

    function selectDeepChoice(index) {

      if (selectedDeepChoice === null) return;
      deepChecked = true;
      renderDeepPracticeScreen();

      selectedDeepChoice = null;
      deepInputValue = "";
      deepChecked = false;

    function updateDeepInput(value) {
  deepInputValue = value;

  // 학생이 다시 쓰면 이전 검사 결과를 지웁니다.
  deepChecked = false;

}

   function checkDeepInput() {
  const question = getCurrentDeepQuestions()[currentDeepIndex];

  // 직접 쓴 질문을 검사만 합니다.
  // 여기서는 다음 문제나 질문 종류 선택 화면으로 이동하지 않습니다.
  if (question.checker === "opinion") {
    deepResult = checkOpinionQuestion(deepInputValue);
  } else if (question.checker === "infer") {
    deepResult = checkInferQuestion(deepInputValue);
  } else if (question.checker === "connect") {
    deepResult = checkConnectQuestion(deepInputValue);
  } else {
    deepResult = checkDirectQuestion(deepInputValue);
  }

  deepChecked = true;
  renderDeepPracticeScreen();
}

    function getDeepFeedbackClass() {
      const question = getCurrentDeepQuestions()[currentDeepIndex];
      if (question.mode === "choice") {
        if (selectedDeepChoice === null || !deepChecked) return '';
        return isDeepChoiceCorrect(question) ? 'good' : 'need';
      }
      if (!deepChecked) return '';
      return deepResult && deepResult.ok ? 'good' : 'need';
    }

    function getDeepFeedbackText(question) {
  // 아직 루미에게 확인받기 전 안내 문구
  if (!deepChecked) {
    if (selectedQuestionType === "connect") {
      if (question.mode === "write") {
        return "책 속 장면과 내 경험이 함께 드러나는 질문인지 확인해 보자.";
      }

      return "책 속 장면을 내 삶과 연결하는 말인지 확인해 보자.";
    }

    if (selectedQuestionType === "opinion") {
      if (question.mode === "write") {
        return "내 생각이나 느낌이 드러나는 질문인지 확인해 보자.";
      }

      return "읽은 뒤 내 생각이나 느낌으로 이어지는 질문인지 확인해 보자.";
    }

    if (selectedQuestionType === "infer") {
      return "글 속 단서를 보고 답을 짐작할 수 있는 질문인지 확인해 보자.";
    }

    return "책 내용에서 바로 답을 찾을 수 있는 질문인지 확인해 보자.";
  }

  // 선택형 문제를 확인한 뒤 피드백
  if (question.mode === "choice") {
    if (selectedDeepChoice === null) {
      return "질문 제작대의 빈칸에 들어갈 말을 먼저 골라 보자.";
    }

    return question.choices[selectedDeepChoice].feedback;
  }

  // 직접 쓰기 문제를 확인한 뒤 피드백
  if (deepResult) {
    return deepResult.message;
  }

  if (selectedQuestionType === "connect") {
    return "책 속 장면과 내 경험이 함께 드러나는 질문인지 다시 확인해 보자.";
  }

  return "질문을 다시 확인해 보자.";
}

   function goNextDeepQuestion() {
  const questions = getCurrentDeepQuestions();

  if (currentDeepIndex < questions.length - 1) {
    currentDeepIndex += 1;
    selectedDeepChoice = null;
    deepInputValue = "";

  }

  // 마지막 심화 문제까지 끝났을 때만 완료 처리합니다.
  progress[selectedQuestionType] = true;
  saveProgress();

  // 완료 화면 없이 질문 종류 선택 화면으로 이동합니다.
  goSelectScreen();
}

    /*
      =========================================================
      10. 직접 쓰기 채점 함수
      =========================================================
    */

    function normalizeText(text) {
      return (text || "").replace(/\s+/g, "").toLowerCase();
    }

    function hasAny(text, words) {
      return words.some(function(word) { return text.indexOf(word) !== -1; });
    }

    function checkDirectQuestion(input) {
      const text = normalizeText(input);
      if (text.length < 7) return { ok: false, message: "질문이 너무 짧아. 글에서 바로 답을 찾을 수 있게 조금 더 구체적으로 써 보자." };
      if (!text.includes("?") && !text.includes("나요") && !text.includes("까")) return { ok: false, message: "질문 형태로 써야 해. 끝에 ‘~나요?’, ‘~했나요?’처럼 물어보는 말이 필요해." };
      if (hasAny(text, ["왜", "무슨생각", "어떤마음", "나라면", "내생각", "느낌"])) return { ok: false, message: "이건 책 내용에서 바로 답을 찾을 수 있는 질문이 아니야. 이유, 마음, 내 생각을 묻지 말고 글에 나온 답을 바로 물어보자." };
      if (hasAny(text, ["소민", "노란화분", "화분", "물"]) && hasAny(text, ["무엇", "무슨", "어디"])) {
        return { ok: true, message: "좋아! 글에 바로 나오는 답과 연결된 질문이야." };
      }
      return { ok: false, message: "답과 연결이 약해. ‘소민이’, ‘노란 화분’, ‘물’처럼 글에 나온 단어를 활용해 질문을 만들어 보자." };
    }

    function checkInferQuestion(input) {
      const text = normalizeText(input);
      if (text.length < 8) return { ok: false, message: "질문이 너무 짧아. 글 속 단서와 연결되게 더 구체적으로 써 보자." };
      if (!text.includes("?") && !text.includes("나요") && !text.includes("까")) return { ok: false, message: "질문 형태로 써야 해. ‘~했을까요?’처럼 물어보는 말로 써 보자." };
      if (hasAny(text, ["살았", "인생", "평소", "미래", "어른", "나중"])) return { ok: false, message: "질문이 글 속 장면보다 너무 넓어. 준서가 색연필을 어떻게 했는지에 집중해 보자." };
      if (hasAny(text, ["내려놓", "버렸", "가져갔", "숨겼", "훔쳤"])) return { ok: false, message: "글에서는 내려놓거나 가져간 것이 아니라 선생님 책상 위에 올려 두었어. 글과 반대되는 행동은 오답이야." };
      if (hasAny(text, ["집", "운동장", "가방", "친구에게줬", "엄마"])) return { ok: false, message: "글에 없는 장소나 인물이 들어갔어. 준서, 색연필, 선생님 책상 위, 올려 두다 같은 단서를 활용해 보자." };
      const hasScene = hasAny(text, ["준서", "색연필", "선생님책상", "책상위", "올려두", "주인", "찾아주"]);
      const hasInfer = hasAny(text, ["왜", "무슨생각", "어떤마음", "마음으로", "생각했"]);
      if (hasScene && hasInfer) return { ok: true, message: "좋아! 글 속 단서와 연결해서 이유, 마음, 생각을 짐작하게 하는 질문이야." };
      return { ok: false, message: "질문이 글 속 단서와 충분히 연결되지 않아. 준서, 색연필, 선생님 책상 위, 올려 두다, 주인 같은 단서를 활용해 보자." };
    }

   function checkOpinionQuestion(input) {
  const text = normalizeText(input);

  if (!text) {
    return {
      ok: false,
      message: "질문을 먼저 써 봐. 읽은 뒤 네 생각이나 느낌으로 이어지는 질문이어야 해."
    };
  }

  // 1. 너무 짧은 질문은 통과시키지 않습니다.
  if (text.length < 10) {
    return {
      ok: false,
      message: "질문이 너무 짧아. 어떤 장면을 읽고 어떤 생각이나 느낌을 말하려는지 더 자세히 써 보자."
    };
  }

  // 2. 질문 형태인지 확인합니다.
  if (!text.includes("?") && !text.includes("나요") && !text.includes("까요")) {
    return {
      ok: false,
      message: "질문 형태로 써야 해. 끝에 ‘~나요?’, ‘~까요?’처럼 물어보는 말이 필요해."
    };
  }

  // 3. 예전 이야기 단어가 들어가면 오답 처리합니다.
  // 현재 심화 3번은 하윤이 발표 장면이므로 책갈피/색연필/강아지 같은 이전 이야기 단어는 맞지 않습니다.
  const oldStoryWords = ["책갈피", "색연필", "강아지", "서아", "준서", "민재"];
  if (oldStoryWords.some(function(word) { return text.includes(word); })) {
    return {
      ok: false,
      message: "지금 글은 하윤이가 발표 중 어려워하는 친구를 도와준 장면이야. 현재 글 속 인물과 장면에 맞게 질문을 다시 써 보자."
    };
  }

  // 4. 책 내용에서 바로 답을 찾는 질문은 오답입니다.
  const directPatterns = ["무엇을", "누구에게", "어디에서", "언제", "몇시", "몇", "무슨물건"];
  if (directPatterns.some(function(word) { return text.includes(word); })) {
    return {
      ok: false,
      message: "이건 글에서 바로 답을 찾는 질문에 가까워. 책을 읽고 떠오른 네 생각이나 느낌을 말하게 하는 질문으로 바꿔 보자."
    };
  }

  // 5. 인물의 이유나 마음을 맞히는 질문은 2번 질문에 가깝습니다.
  const inferPatterns = ["왜", "어떤마음으로", "무슨생각으로", "왜그랬", "하윤이는왜", "친구는왜"];
  if (inferPatterns.some(function(word) { return text.includes(word); })) {
    return {
      ok: false,
      message: "이건 인물의 이유나 마음을 짐작하는 질문에 가까워. 이번에는 하윤이의 행동을 읽고 내가 어떤 생각이나 느낌이 드는지 묻는 질문이 좋아."
    };
  }

  // 6. 현재 글 속 장면과 연결되어야 합니다.
  const sceneWords = ["하윤", "발표", "친구", "손짓", "도와", "도움", "순서", "웃"];
  const hasSceneWord = sceneWords.some(function(word) { return text.includes(word); });

  if (!hasSceneWord) {
    return {
      ok: false,
      message: "질문이 글 속 장면과 연결되어야 해. 하윤이, 발표, 친구, 손짓, 도와줌 같은 단서를 활용해 보자."
    };
  }

  // 7. 읽은 사람의 생각이나 느낌을 말하게 해야 합니다.
  const opinionWords = ["나는", "나라면", "내가", "어떻게생각", "어떤느낌", "느낌", "생각", "마음에남", "비슷한경험"];
  const hasOpinionWord = opinionWords.some(function(word) { return text.includes(word); });

  if (!hasOpinionWord) {
    return {
      ok: false,
      message: "글 속 장면은 들어갔지만, 읽은 사람의 생각이나 느낌을 말하게 하는 말이 부족해. ‘나는’, ‘나라면’, ‘어떻게 생각’, ‘어떤 느낌’ 같은 말을 넣어 보자."
    };
  }

  return {
    ok: true,
    message: "좋아! 하윤이가 친구를 도와준 장면에서 출발해서, 읽은 사람이 자기 생각이나 느낌을 말하게 하는 질문이야."
  };
}
function checkConnectQuestion(input) {
  const text = normalizeText(input);

  if (!text) {
    return {
      ok: false,
      message: "질문을 먼저 써 봐. 책 속 장면과 내 경험이 함께 드러나야 해."
    };
  }

  if (text.length < 10) {
    return {
      ok: false,
      message: "질문이 너무 짧아. 책 속 어떤 장면과 내 경험을 연결하는지 더 자세히 써 보자."
    };
  }

  if (!text.includes("?") && !text.includes("나요") && !text.includes("까요")) {
    return {
      ok: false,
      message: "질문 형태로 써야 해. 끝에 ‘~나요?’, ‘~까요?’처럼 물어보는 말이 필요해."
    };
  }

  // 책 속 장면 단서가 있어야 합니다.
  const sceneWords = ["유진", "혼자", "친구", "다가", "함께", "놀자", "놀이", "먼저"];
  const hasSceneWord = sceneWords.some(function(word) {
    return text.includes(word);
  });

  if (!hasSceneWord) {
    return {
      ok: false,
      message: "책 속 장면과 연결되어야 해. 유진이, 혼자 있는 친구, 먼저 다가감, 함께 놀자 같은 단서를 활용해 보자."
    };
  }

  // 내 삶/경험 연결 표현이 있어야 합니다.
  const lifeWords = ["나도", "내가", "내경험", "경험", "겪은적", "해본적", "비슷한일", "내생활", "우리반", "친구와", "가족과"];
  const hasLifeWord = lifeWords.some(function(word) {
    return text.includes(word);
  });

  if (!hasLifeWord) {
    return {
      ok: false,
      message: "책 속 장면은 들어갔지만 내 경험과 연결하는 말이 부족해. ‘나도’, ‘내가’, ‘경험’, ‘비슷한 일’ 같은 말을 넣어 보자."
    };
  }

  // 바로 답 찾기 질문은 제외합니다.
  const directPatterns = ["무엇을", "누구에게", "어디에서", "언제", "몇시", "몇"];
  if (directPatterns.some(function(word) { return text.includes(word); })) {
    return {
      ok: false,
      message: "이건 글에서 바로 답을 찾는 질문에 가까워. 책 속 장면을 내 경험과 연결하는 질문으로 바꿔 보자."
    };
  }

  // 짐작 질문은 제외합니다.
  const inferPatterns = ["왜", "어떤마음", "무슨생각", "왜그랬"];
  if (inferPatterns.some(function(word) { return text.includes(word); })) {
    return {
      ok: false,
      message: "이건 인물의 이유나 마음을 짐작하는 질문에 가까워. 이번에는 책 속 장면과 내 경험을 이어 보자."
    };
  }

  // 생각/느낌만 있고 경험 연결이 약한 질문을 걸러냅니다.
  const onlyOpinionPatterns = ["어떤생각", "어떤느낌", "느낌이들", "생각이들"];
  const hasOnlyOpinion = onlyOpinionPatterns.some(function(word) {
    return text.includes(word);
  });

  if (hasOnlyOpinion && !text.includes("경험") && !text.includes("나도") && !text.includes("내가")) {
    return {
      ok: false,
      message: "생각이나 느낌을 묻는 것에서 멈추지 말고, 내 경험이나 생활과 연결되게 질문해 보자."
    };
  }

  return {
    ok: true,
    message: "좋아! 책 속 장면에서 출발해서 내 경험이나 생활로 이어지는 질문이야."
  };
}

    function makeHighlightedStory(story, highlight) {
      if (!highlight) return story;
      return story.replace(highlight, '<span class="story-highlight">' + highlight + '</span>');
    }

    function escapeHtml(text) {
      return (text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
