<!--
  파일명: during-reading-practice.html
  역할: 문답책 프로젝트 - 읽기 중 질문 종류별 연습 화면
  반영 내용:
  1. undefined 삭제
  2. 문답책 질문 지도 버튼 삭제
  3. 총복습 안내 문장 삭제
  4. 각 유형별 기본 연습 2문제
  5. 각 유형별 심화 연습 2문제
  6. 방법 알기 화면: 왼쪽 8 / 오른쪽 2 비율
  7. 오른쪽 예시 보기 버튼 + 보조창
  8. 예시 문장 → 관련 질문 구조
  9. 다음 예시 버튼
  10. 전체 글씨 크기, 문제 글씨, 버튼 글씨 크게 조정
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문답책 - 읽기 중 질문 연습</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #fff1d0;
      background:
        linear-gradient(rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.76)),
        url("../assets/images/practice/during-reading-magic-space-bg.png");
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
  height: 100vh;
  padding: 18px 38px 18px;
  overflow: hidden;
  background:
    linear-gradient(rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.76)),
    url("../assets/images/practice/during-reading-magic-space-bg.png") center / cover no-repeat;
}

    .page-inner {
  width: 1480px !important;
  max-width: 1480px !important;
  min-width: 1480px !important;
  height: 100%;
  margin: 0 auto !important;

  display: grid !important;
  grid-template-rows: 70px minmax(0, 1fr) !important;
  row-gap: 10px !important;
  overflow: hidden !important;
}

.top-bar {
  width: 100%;
  height: 70px !important;
  min-height: 70px !important;
  margin: 0 !important;
  flex-wrap: nowrap !important;
}

.hero-card {
  width: 100%;
  height: 100% !important;
  min-height: 0 !important;
  max-height: none !important;
  overflow: hidden !important;
}

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 38%, rgba(216, 150, 42, 0.13), transparent 38%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.08), transparent 45%, rgba(0, 0, 0, 0.18));
      z-index: 0;
    }

    .screen {
  position: relative;
  z-index: 1;
  height: 100%;
  padding: 28px 52px 30px;
  overflow: hidden;
}

    .screen-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 24px;
    }

    .screen-title-row > div:first-child,
    .screen-title-row .progress-pill {
      flex: 0 0 auto;
    }

    /* 심사 체험 계정에서만 보이는 짧은 안내 배지. 연습읽기 질문 작성
       화면들이 공통으로 사용하는 디자인(베이지/브라운/골드)이다. */
    .mq-demo-banner {
      display: inline-flex;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
      gap: 8px;
      min-height: 40px;
      height: auto;
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(180, 130, 60, 0.42);
      background: linear-gradient(180deg, rgba(255, 247, 225, 0.96), rgba(238, 216, 176, 0.92));
      box-shadow: 0 6px 14px rgba(90, 55, 15, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      color: #6b4b26;
      font-size: 17px;
      line-height: 1.4;
      font-weight: 800;
      white-space: normal;
      word-break: keep-all;
      overflow: visible;
      align-self: center;
    }

    .mq-demo-banner strong {
      color: #7a4a12;
      font-size: 17px;
      font-weight: 900;
    }

    .mq-demo-banner[hidden] { display: none !important; }

    .title-badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 10px 22px;
      border-radius: 999px;
      background: linear-gradient(180deg, #d8a84c, #8d551a);
      border: 1px solid rgba(255, 220, 142, 0.6);
      color: #fff3d0;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.28);
    }

    .main-title {
      font-family: "Noto Serif KR", serif;
      color: #fff3d4;
      font-size: 48px;
      font-weight: 900;
      line-height: 1.24;
      letter-spacing: -1.4px;
      word-break: keep-all;
      text-shadow:
        0 3px 0 rgba(51, 29, 9, 0.9),
        0 10px 24px rgba(0, 0, 0, 0.7);
    }

    .main-desc {
      margin-top: 15px;
      color: rgba(255, 228, 186, 0.95);
      font-size: 22px;
      font-weight: 850;
      line-height: 1.6;
      word-break: keep-all;
    }

    .progress-pill {
      flex-shrink: 0;
      padding: 16px 25px;
      border-radius: 999px;
      background: rgba(9, 7, 5, 0.68);
      border: 1px solid rgba(214, 154, 60, 0.5);
      color: #f2cf82;
      font-size: 20px;
      font-weight: 900;
    }

    /* 질문 종류 선택 */
    .question-map {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      min-height: 500px;
      padding: 20px;
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 50%, rgba(222, 159, 49, 0.16), transparent 26%),
        linear-gradient(180deg, rgba(12, 10, 8, 0.74), rgba(4, 4, 3, 0.8));
      border: 1px solid rgba(198, 138, 50, 0.36);
      box-shadow:
        0 28px 58px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 223, 158, 0.08);
    }

    .question-cell {
      position: relative;
      min-height: 230px;
      padding: 30px 34px 86px;
      overflow: hidden;
      border: 1px solid rgba(185, 125, 43, 0.34);
      background:
        radial-gradient(circle at 82% 26%, rgba(222, 158, 44, 0.14), transparent 26%),
        linear-gradient(180deg, rgba(19, 16, 13, 0.78), rgba(5, 5, 4, 0.84));
      box-shadow:
        inset 0 1px 0 rgba(255, 231, 168, 0.06),
        0 14px 28px rgba(0, 0, 0, 0.35);
      color: #fff1ce;
      text-align: left;
      transition: 0.2s ease;
    }

    .question-cell:nth-child(1) {
      border-radius: 24px 8px 8px 8px;
    }

    .question-cell:nth-child(2) {
      border-radius: 8px 24px 8px 8px;
    }

    .question-cell:nth-child(3) {
      border-radius: 8px 8px 8px 24px;
    }

    .question-cell:nth-child(4) {
      border-radius: 8px 8px 24px 8px;
    }

    .question-cell.open {
      border-color: rgba(255, 211, 112, 0.95);
      background:
        radial-gradient(circle at 82% 25%, rgba(255, 189, 55, 0.28), transparent 28%),
        radial-gradient(circle at 12% 82%, rgba(189, 116, 24, 0.24), transparent 32%),
        linear-gradient(180deg, rgba(74, 48, 18, 0.82), rgba(18, 12, 7, 0.9));
      box-shadow:
        inset 0 0 0 2px rgba(236, 181, 72, 0.24),
        0 0 34px rgba(230, 164, 42, 0.34),
        0 20px 40px rgba(0, 0, 0, 0.48);
    }

    .question-cell.open:hover {
      transform: translateY(-4px);
    }

    .question-cell.locked {
      opacity: 0.46;
      filter: grayscale(0.55) brightness(0.7);
      cursor: not-allowed;
    }

    .question-cell.done {
      border-color: rgba(156, 216, 118, 0.7);
    }

    .cell-number {
      position: relative;
      z-index: 3;
      margin-bottom: 12px;
      color: #d8a851;
      font-size: 18px;
      font-weight: 900;
    }

    .cell-icon-img {
      position: absolute;
      right: 34px;
      top: 34px;
      width: 126px;
      height: 126px;
      object-fit: contain;
      opacity: 0.92;
      filter:
        drop-shadow(0 14px 22px rgba(0, 0, 0, 0.55))
        drop-shadow(0 0 18px rgba(224, 158, 45, 0.24));
    }

    .cell-title {
      position: relative;
      z-index: 3;
      max-width: 64%;
      margin-top: 18px;
      color: #fff1ca;
      font-family: "Noto Serif KR", serif;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.42;
      letter-spacing: -0.9px;
      word-break: keep-all;
      text-shadow:
        0 4px 14px rgba(0, 0, 0, 0.72),
        0 0 14px rgba(224, 158, 45, 0.18);
    }

    .cell-state {
      position: absolute;
      left: 34px;
      bottom: 26px;
      width: 250px;
      padding: 16px 13px;
      border-radius: 999px;
      background: rgba(8, 6, 4, 0.76);
      border: 1px solid rgba(201, 139, 52, 0.44);
      color: #cdb37a;
      font-size: 19px;
      font-weight: 900;
      text-align: center;
    }

    .question-cell.open .cell-state {
      background: linear-gradient(180deg, #dca64a, #8b551a);
      color: #fff4d4;
    }

    .question-core {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 20;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 170px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      text-align: center;
      background: radial-gradient(circle at 42% 26%, #f5d38a 0%, #9a641f 55%, #251306 100%);
      border: 1px solid rgba(255, 211, 114, 0.9);
      box-shadow:
        0 0 42px rgba(226, 163, 42, 0.52),
        0 18px 38px rgba(0, 0, 0, 0.58),
        inset 0 1px 0 rgba(255, 246, 210, 0.26);
      color: #fff1c8;
      font-family: "Noto Serif KR", serif;
      font-size: 23px;
      font-weight: 900;
      line-height: 1.35;
    }

    .question-core span {
      display: block;
      margin-top: 5px;
      color: #ffd56f;
      font-size: 38px;
      text-shadow: 0 0 18px rgba(255, 204, 76, 0.85);
    }

    /* 총 복습 */
    .review-gate {
      margin-top: 24px;
      padding: 24px 28px;
      border-radius: 26px;
      border: 1px solid rgba(255, 211, 112, 0.58);
      background:
        radial-gradient(circle at 8% 50%, rgba(255, 211, 104, 0.18), transparent 38%),
        radial-gradient(circle at 92% 20%, rgba(117, 230, 186, 0.14), transparent 34%),
        linear-gradient(135deg, rgba(61, 42, 19, 0.78), rgba(11, 8, 5, 0.92));
      box-shadow:
        0 20px 46px rgba(0, 0, 0, 0.36),
        inset 0 0 0 1px rgba(255, 239, 190, 0.08);
    }

    .review-gate.locked {
      opacity: 0.55;
      filter: grayscale(0.35);
    }

    .review-gate-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .review-gate-title {
      color: #ffe7a8;
      font-family: "Noto Serif KR", serif;
      font-size: 31px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .review-gems {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .review-gem {
      width: 35px;
      height: 35px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 218, 127, 0.44);
      background: rgba(255, 230, 166, 0.09);
      color: rgba(255, 230, 166, 0.65);
      font-size: 16px;
      font-weight: 900;
    }

    .review-gem.done {
      border-color: rgba(174, 255, 111, 0.72);
      background:
        radial-gradient(circle, rgba(174, 255, 111, 0.32), rgba(67, 104, 36, 0.28));
      color: #eaffcf;
      box-shadow: 0 0 16px rgba(174, 255, 111, 0.22);
    }

    /* 공통 카드 */
    .two-column-layout {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 26px;
      align-items: stretch;
    }

    .dark-card {
      min-height: 500px;
      padding: 26px;
      border-radius: 28px;
      border: 1px solid rgba(210, 154, 64, 0.44);
      background:
        radial-gradient(circle at 50% 0%, rgba(221, 160, 58, 0.12), transparent 38%),
        linear-gradient(180deg, rgba(22, 17, 12, 0.84), rgba(7, 6, 5, 0.88));
      box-shadow:
        0 24px 48px rgba(0, 0, 0, 0.44),
        inset 0 1px 0 rgba(255, 226, 164, 0.08);
    }

    .section-label {
      color: #e3b35d;
      font-size: 23px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .story-box {
      min-height: 260px;
      padding: 30px 32px;
      display: flex;
      align-items: center;
      border-radius: 24px;
      border: 1px solid rgba(218, 166, 76, 0.46);
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 216, 126, 0.08), transparent 34%),
        linear-gradient(180deg, rgba(9, 8, 6, 0.9), rgba(3, 3, 2, 0.92));
    }

    .story-box p {
      color: #fff0c9;
      font-family: "Noto Serif KR", serif;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.7;
      word-break: keep-all;
      text-shadow: 0 5px 16px rgba(0, 0, 0, 0.66);
    }

    .story-highlight {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(255, 213, 106, 0.32);
      box-shadow:
        0 0 0 1px rgba(255, 224, 135, 0.24),
        0 0 18px rgba(255, 203, 87, 0.16);
      color: #fff8d5;
    }

    .support-grid {
      display: grid;
      gap: 12px;
      margin-top: 18px;
      padding: 16px;
      border-radius: 24px;
      border: 1px solid rgba(210, 154, 64, 0.38);
      background:
        radial-gradient(circle at 8% 0%, rgba(255, 211, 104, 0.12), transparent 34%),
        linear-gradient(145deg, rgba(61, 41, 20, 0.48), rgba(13, 10, 7, 0.82));
      box-shadow:
        inset 0 0 0 1px rgba(255, 238, 188, 0.05),
        0 16px 34px rgba(0, 0, 0, 0.22);
    }

    .support-card {
      position: relative;
      padding: 15px 18px;
      border-radius: 16px;
      border: 1px solid rgba(218, 166, 76, 0.28);
      background:
        linear-gradient(90deg, rgba(255, 222, 145, 0.12), rgba(255, 230, 166, 0.045));
      color: #ffe9b7;
      font-size: 21px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .support-card strong {
      color: #ffd477;
    }

    .choice-guide-title,
    .workshop-guide {
      margin-bottom: 16px;
      padding: 16px 20px;
      border-radius: 18px;
      border: 1px solid rgba(218, 166, 76, 0.42);
      background:
        radial-gradient(circle at 0% 50%, rgba(255, 211, 104, 0.12), transparent 40%),
        rgba(255, 230, 166, 0.065);
      color: #ffe6ad;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.5;
      word-break: keep-all;
    }

    .choice-list {
      display: grid;
      gap: 14px;
      padding: 16px;
      border-radius: 22px;
      border: 1px solid rgba(120, 88, 48, 0.38);
      background:
        radial-gradient(circle at 100% 0%, rgba(255, 211, 104, 0.08), transparent 34%),
        linear-gradient(180deg, rgba(9, 8, 6, 0.52), rgba(5, 4, 3, 0.72));
    }

    .choice-button {
      width: 100%;
      min-height: 76px;
      padding: 18px 22px;
      border-radius: 18px;
      border: 1px solid rgba(218, 166, 76, 0.28);
      background:
        linear-gradient(180deg, rgba(34, 26, 18, 0.94), rgba(15, 12, 8, 0.96));
      color: #fff0ca;
      text-align: left;
      font-size: 29px;
      font-weight: 900;
      line-height: 1.45;
      word-break: keep-all;
      transition: 0.16s ease;
      box-shadow:
        inset 0 1px 0 rgba(255, 232, 170, 0.05),
        0 8px 16px rgba(0, 0, 0, 0.18);
    }

    .choice-button:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 207, 116, 0.68);
      background:
        radial-gradient(circle at 0% 50%, rgba(255, 210, 110, 0.12), transparent 42%),
        linear-gradient(180deg, rgba(47, 34, 20, 0.96), rgba(18, 13, 8, 0.98));
    }

    .choice-button.selected {
      border-color: rgba(174, 255, 111, 0.76);
      background:
        radial-gradient(circle at 0% 50%, rgba(174, 255, 111, 0.18), transparent 42%),
        linear-gradient(180deg, rgba(45, 56, 26, 0.92), rgba(18, 25, 12, 0.96));
      box-shadow:
        0 0 20px rgba(174, 255, 111, 0.14),
        inset 0 0 0 1px rgba(220, 255, 186, 0.08);
    }

    .lumi-feedback {
      position: relative;
      display: grid;
      grid-template-columns: 86px 1fr;
      align-items: center;
      gap: 18px;
      margin-top: 18px;
      padding: 14px 18px;
      min-height: 94px;
      overflow: hidden;
      border-radius: 22px;
      border: 1px solid rgba(218, 166, 76, 0.46);
      background:
        radial-gradient(circle at 8% 50%, rgba(109, 167, 91, 0.28), transparent 38%),
        radial-gradient(circle at 90% 10%, rgba(255, 211, 104, 0.12), transparent 34%),
        linear-gradient(135deg, rgba(45, 54, 27, 0.62), rgba(13, 10, 7, 0.92));
      color: #ffe6ad;
      box-shadow:
        inset 0 0 0 1px rgba(255, 238, 188, 0.07),
        0 16px 34px rgba(0, 0, 0, 0.26);
    }

    .lumi-feedback::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgba(169, 255, 135, 0.10),
          transparent 34%,
          rgba(255, 211, 104, 0.07)
        );
    }

    .lumi-feedback img {
      position: relative;
      z-index: 1;
      width: 76px;
      height: auto;
      object-fit: contain;
      filter:
        drop-shadow(0 10px 16px rgba(0, 0, 0, 0.45))
        drop-shadow(0 0 12px rgba(172, 255, 125, 0.18));
    }

    .lumi-feedback p {
      position: relative;
      z-index: 1;
      margin: 0;
      padding: 0;
      color: #fff0c7;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.55;
      word-break: keep-all;
    }

    .lumi-feedback.good {
      border-color: rgba(174, 255, 111, 0.66);
      background:
        radial-gradient(circle at 8% 50%, rgba(125, 207, 88, 0.34), transparent 40%),
        radial-gradient(circle at 90% 12%, rgba(255, 224, 130, 0.14), transparent 34%),
        linear-gradient(135deg, rgba(43, 70, 27, 0.70), rgba(13, 12, 7, 0.94));
      box-shadow:
        0 0 24px rgba(174, 255, 111, 0.13),
        inset 0 0 0 1px rgba(220, 255, 186, 0.08),
        0 16px 34px rgba(0, 0, 0, 0.26);
    }

    .lumi-feedback.need {
      border-color: rgba(255, 190, 93, 0.58);
      background:
        radial-gradient(circle at 8% 50%, rgba(255, 171, 72, 0.22), transparent 40%),
        radial-gradient(circle at 90% 12%, rgba(255, 224, 130, 0.12), transparent 34%),
        linear-gradient(135deg, rgba(70, 45, 22, 0.66), rgba(13, 10, 7, 0.94));
      box-shadow:
        0 0 22px rgba(255, 171, 72, 0.10),
        inset 0 0 0 1px rgba(255, 231, 180, 0.06),
        0 16px 34px rgba(0, 0, 0, 0.26);
    }

    .method-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      gap: 18px;
      flex-wrap: wrap;
    }

    .plain-button,
    .main-button {
      border: none;
      border-radius: 999px;
      padding: 18px 30px;
      font-size: 23px;
      font-weight: 900;
      transition: 0.18s ease;
    }

    .plain-button {
      background: #d8cab5;
      color: #6c5a48;
    }

    .main-button {
      background: linear-gradient(180deg, #dca328, #bd7908);
      color: #fff7e4;
      box-shadow: 0 10px 18px rgba(143, 91, 8, 0.24);
    }

    .main-button:disabled {
      background: #b9a58c;
      color: #efe2d0;
      cursor: not-allowed;
      box-shadow: none;
    }

    .plain-button:hover,
    .main-button:hover {
      transform: translateY(-2px);
    }

    /* 방법 알기 화면 */
    .two-column-layout.method-layout {
  grid-template-columns: 7fr 3fr;
  gap: 24px;
  align-items: stretch;
  height: calc(100% - 130px);
}

    .method-main-card {
  height: 100%;
  min-height: 0;
  padding: 24px 28px;
}

    .method-main-card .section-label {
      font-size: 26px;
      margin-bottom: 16px;
    }

    .method-rune-frame {
      position: relative;
      min-height: 300px;
      display: grid;
      place-items: center;
      padding: 48px 42px;
      border-radius: 24px;
      border: 1px solid rgba(218, 166, 76, 0.54);
      background:
        radial-gradient(circle at 50% 78%, rgba(255, 196, 74, 0.22), transparent 30%),
        linear-gradient(180deg, rgba(16, 13, 10, 0.94), rgba(6, 5, 4, 0.94));
      overflow: hidden;
    }

    .method-rune-text {
      color: #fff2d0;
      font-family: "Noto Serif KR", serif;
     font-size: clamp(34px, 2.4vw, 43px);
      font-weight: 900;
      line-height: 1.72;
      letter-spacing: -1.2px;
      text-align: center;
      word-break: keep-all;
      text-shadow: 0 6px 18px rgba(0, 0, 0, 0.68);
    }

    .hidden-keyword {
      display: inline-grid;
      place-items: center;
      min-width: 136px;
      margin: 0 6px;
      padding: 11px 28px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255, 218, 132, 0.82);
      background: radial-gradient(circle, #fff0b7, #c88624 72%);
      color: #3a2109;
      font-size: 38px;
      font-weight: 900;
      box-shadow:
        0 0 24px rgba(240, 177, 53, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.38);
      cursor: pointer;
      vertical-align: middle;
    }

    .method-side-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .example-toggle-button {
      width: 100%;
      min-height: 78px;
      padding: 18px 20px;
      border: none;
      border-radius: 22px;
      background: linear-gradient(180deg, #dca328, #bd7908);
      color: #fff7e4;
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 12px 22px rgba(143, 91, 8, 0.26);
      cursor: pointer;
    }

    .example-toggle-button:hover {
      transform: translateY(-2px);
    }

    .method-side-tip {
      padding: 24px 20px;
      border-radius: 24px;
      border: 1px solid rgba(218, 166, 76, 0.34);
      background: rgba(255, 239, 202, 0.06);
      color: #ffe9b7;
      font-size: 21px;
      font-weight: 850;
      line-height: 1.6;
      word-break: keep-all;
    }

    .method-example-panel {
      min-height: 0;
      padding: 22px 20px 24px;
    }

    .method-example-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .method-example-title {
      color: #ffe3a2;
      font-family: "Noto Serif KR", serif;
      font-size: 28px;
      font-weight: 900;
    }

    .method-example-count {
      color: #ffd477;
      font-size: 18px;
      font-weight: 900;
    }

    .method-example-box,
    .method-example-question-box {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 14px;
      align-items: start;
      padding: 17px;
      border-radius: 20px;
      background: rgba(255, 239, 202, 0.08);
      border: 1px solid rgba(218, 166, 76, 0.30);
    }

    .method-example-question-box {
      background: rgba(255, 230, 166, 0.10);
    }

    .method-example-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255, 207, 116, 0.12);
      border: 1px solid rgba(230, 178, 83, 0.34);
      font-size: 24px;
    }

    .method-example-text,
    .method-example-question {
      color: #fff0ca;
      font-size: 22px;
      font-weight: 850;
      line-height: 1.6;
      word-break: keep-all;
    }

    .method-example-arrow {
      margin: 15px 0;
      padding-left: 6px;
      color: #ffd477;
      font-size: 23px;
      font-weight: 900;
    }

    .method-example-actions {
      margin-top: 18px;
    }

    .example-next-button {
      width: 100%;
    }

    .method-big-button {
  min-height: 64px;
  padding: 14px 26px;
  font-size: 23px !important;
  font-weight: 900;
}

    /* 심화 질문 쓰기 */
    .question-maker {
      display: grid;
      gap: 14px;
      padding: 20px;
      border-radius: 22px;
      border: 1px solid rgba(218, 166, 76, 0.42);
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 216, 126, 0.08), transparent 36%),
        linear-gradient(180deg, rgba(12, 10, 8, 0.86), rgba(5, 5, 4, 0.88));
    }

    .maker-title {
      color: #ffd477;
      font-size: 22px;
      font-weight: 900;
    }

    .maker-frame {
      color: #fff0c9;
      font-family: "Noto Serif KR", serif;
      font-size: 31px;
      font-weight: 900;
      line-height: 1.6;
      word-break: keep-all;
    }

    .deep-input {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      border-radius: 18px;
      border: 1px solid rgba(255, 215, 121, 0.55);
      background: rgba(255, 244, 213, 0.96);
      color: #3b2915;
      padding: 18px 20px;
      font-size: 22px;
      font-weight: 850;
      line-height: 1.5;
      outline: none;
    }

    .deep-input:focus {
      box-shadow: 0 0 0 3px rgba(255, 207, 116, 0.25);
    }

    .deep-hint-box {
      margin-top: 16px;
      padding: 18px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 218, 127, 0.38);
      background: rgba(255, 230, 166, 0.075);
      color: #ffeac0;
      font-size: 21px;
      font-weight: 850;
      line-height: 1.55;
      word-break: keep-all;
    }

    /* 총 복습 화면 */
    .review-layout {
      display: grid;
      grid-template-columns: 1.02fr 0.98fr;
      gap: 24px;
      align-items: start;
    }

    .review-book,
    .review-workshop {
      min-height: 620px;
      padding: 28px;
      border-radius: 30px;
      border: 1px solid rgba(220, 166, 74, 0.46);
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 213, 106, 0.12), transparent 36%),
        linear-gradient(180deg, rgba(24, 18, 12, 0.88), rgba(6, 5, 4, 0.92));
      box-shadow:
        inset 0 0 0 1px rgba(255, 238, 188, 0.06),
        0 24px 48px rgba(0, 0, 0, 0.40);
    }

    .review-story-title {
      margin-bottom: 18px;
      color: #ffe3a2;
      font-family: "Noto Serif KR", serif;
      font-size: 34px;
      font-weight: 900;
      text-align: center;
    }

    .review-story-part {
      width: 100%;
      padding: 15px 17px;
      margin-bottom: 10px;
      border-radius: 16px;
      border: 1px solid rgba(218, 166, 76, 0.16);
      background: rgba(255, 239, 202, 0.045);
      color: #fff0c9;
      font-size: 21px;
      font-weight: 850;
      line-height: 1.62;
      text-align: left;
      word-break: keep-all;
      transition: 0.16s ease;
    }

    .review-story-part:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 213, 106, 0.48);
      background: rgba(255, 230, 166, 0.09);
    }

    .review-story-part.selected {
      border-color: rgba(255, 218, 127, 0.76);
      background:
        linear-gradient(90deg, rgba(255, 218, 127, 0.22), rgba(255, 230, 166, 0.06));
      box-shadow:
        inset 0 -4px 0 rgba(255, 213, 106, 0.55),
        0 0 18px rgba(255, 213, 106, 0.14);
    }

    .review-selected-box {
      margin-bottom: 16px;
      padding: 17px 19px;
      border-radius: 18px;
      border: 1px solid rgba(255, 218, 127, 0.34);
      background: rgba(255, 230, 166, 0.07);
      color: #ffeac0;
      font-size: 20px;
      font-weight: 850;
      line-height: 1.55;
      word-break: keep-all;
    }

    .review-selected-box strong {
      display: block;
      margin-bottom: 6px;
      color: #ffd477;
    }

    .review-type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0 16px;
    }

    .review-type-button {
      min-height: 72px;
      padding: 14px 15px;
      border-radius: 16px;
      border: 1px solid rgba(218, 166, 76, 0.32);
      background:
        linear-gradient(180deg, rgba(34, 26, 18, 0.94), rgba(15, 12, 8, 0.96));
      color: #fff0ca;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.35;
      word-break: keep-all;
      text-align: left;
    }

    .review-type-button.selected {
      border-color: rgba(174, 255, 111, 0.74);
      background:
        radial-gradient(circle at 0% 50%, rgba(174, 255, 111, 0.17), transparent 42%),
        linear-gradient(180deg, rgba(45, 56, 26, 0.92), rgba(18, 25, 12, 0.96));
      box-shadow: 0 0 18px rgba(174, 255, 111, 0.14);
    }

    .review-input-label {
      display: block;
      margin: 14px 0 8px;
      color: #ffd477;
      font-size: 20px;
      font-weight: 900;
    }

    .review-input {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border-radius: 16px;
      border: 1px solid rgba(255, 215, 121, 0.50);
      background: rgba(255, 244, 213, 0.96);
      color: #3b2915;
      padding: 14px 16px;
      font-size: 20px;
      font-weight: 850;
      line-height: 1.5;
      outline: none;
    }

    .review-status {
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(112, 202, 176, 0.42);
      background:
        radial-gradient(circle at 0% 50%, rgba(112, 202, 176, 0.13), transparent 42%),
        rgba(255, 230, 166, 0.045);
    }

    .review-status-title {
      margin-bottom: 9px;
      color: #d7ffe7;
      font-size: 19px;
      font-weight: 900;
    }

    .review-status-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .review-status-item {
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 218, 127, 0.24);
      color: rgba(255, 237, 196, 0.78);
      font-size: 16px;
      font-weight: 900;
    }

    .review-status-item.done {
      border-color: rgba(174, 255, 111, 0.66);
      color: #eaffcf;
      background: rgba(174, 255, 111, 0.12);
    }

    @media (max-width: 1280px) {
      .two-column-layout.method-layout {
        grid-template-columns: 1fr;
      }

      .method-rune-text {
        font-size: 38px;
      }

      .method-example-text,
      .method-example-question,
      .method-side-tip {
        font-size: 19px;
      }

      .method-big-button,
      .example-toggle-button {
        font-size: 22px !important;
      }
    }

    @media (max-width: 980px) {
      .page {
        padding: 18px;
      }

      .screen {
        padding: 28px 22px 36px;
      }

      .question-map,
      .two-column-layout,
      .review-layout {
        grid-template-columns: 1fr;
      }

      .question-core {
        display: none;
      }

      .cell-title {
        max-width: 72%;
      }

      .main-title {
        font-size: 34px;
      }

      .story-box p {
        font-size: 26px;
      }
    }
    /* =========================================================
   방법 알기 화면 잘림 방지 최종 수정
   - 화면 전체 스크롤은 만들지 않고,
   - 카드 안 내용이 화면 안에 들어오도록 높이와 여백만 조정
========================================================= */

body {
  overflow: hidden;
}

.page {
  height: 100vh;
  padding: 16px 38px 16px;
  overflow: hidden;
}

.top-bar {
  height: 70px;
  margin-bottom: 10px;
}

.logo-area img {
  width: 56px;
  height: 56px;
}

.logo-area {
  font-size: 29px;
}

.hero-card {
  height: calc(100vh - 96px);
  min-height: 0;
  overflow: hidden;
}

.screen {
  height: 100%;
  padding: 24px 52px 26px;
  overflow: hidden;
}

.screen-title-row {
  margin-bottom: 18px;
}

.title-badge {
  margin-bottom: 10px;
  padding: 9px 20px;
  font-size: 17px;
}

.main-title {
  font-size: clamp(34px, 2.8vw, 48px);
  line-height: 1.18;
}

.main-desc {
  margin-top: 10px;
  font-size: 21px;
  line-height: 1.35;
}

.progress-pill {
  padding: 14px 24px;
  font-size: 20px;
}

/* 방법 알기 화면 높이 맞춤 */
.two-column-layout.method-layout {
  height: calc(100% - 145px);
  min-height: 0;
  align-items: stretch;
}

/* 왼쪽 큰 카드 잘림 방지 */
.method-main-card {
  height: 100%;
  min-height: 0;
  padding: 24px 28px;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
}

.method-main-card .section-label {
  font-size: 25px;
  margin-bottom: 12px;
}

.method-rune-frame {
  min-height: 0;
  height: 100%;
  padding: 28px 34px;
}

.method-rune-text {
  font-size: clamp(34px, 2.45vw, 43px);
  line-height: 1.55;
}

.hidden-keyword {
  min-width: 120px;
  padding: 8px 24px 10px;
  font-size: 35px;
}

/* 루미 피드백이 아래에서 잘리지 않도록 압축 */
.method-main-card .lumi-feedback,
.lumi-feedback {
  min-height: 88px;
  margin-top: 14px;
  padding: 12px 18px;
  grid-template-columns: 72px 1fr;
}

.method-main-card .lumi-feedback img,
.lumi-feedback img {
  width: 66px;
}

.method-main-card .lumi-feedback p,
.lumi-feedback p {
  font-size: 19px;
  line-height: 1.45;
}

/* 버튼 영역 압축 */
.method-actions {
  margin-top: 14px;
}

.method-big-button {
  min-height: 58px;
  padding: 13px 24px;
  font-size: 22px !important;
}

/* 오른쪽 예시 보조창 잘림 방지 */
.method-side-area {
  height: 100%;
  min-height: 0;
}

.example-toggle-button {
  min-height: 64px;
  padding: 14px 18px;
  font-size: 24px;
}

.method-example-panel {
  height: calc(100% - 80px);
  min-height: 0;
  padding: 18px 18px;
  overflow: hidden;
}

.method-example-top {
  margin-bottom: 10px;
}

.method-example-title {
  font-size: 26px;
}

.method-example-count {
  font-size: 18px;
}

.method-example-box,
.method-example-question-box {
  grid-template-columns: 50px 1fr;
  gap: 12px;
  padding: 14px;
}

.method-example-icon {
  width: 44px;
  height: 44px;
  font-size: 23px;
}

.method-example-text,
.method-example-question {
  font-size: 20px;
  line-height: 1.48;
}

.method-example-arrow {
  margin: 10px 0;
  font-size: 21px;
}

.method-example-actions {
  margin-top: 12px;
}

.example-next-button {
  min-height: 56px;
  font-size: 21px !important;
}
/* =========================================================
   선택 화면 상단 진행률 + 총복습 버튼 배치
   - 아래 총복습 박스를 없애고 제목 오른쪽에 배치
========================================================= */

.select-screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.select-title-row {
  align-items: center;
  margin-bottom: 18px;
}

.select-progress-area {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 14px;
  margin-top: 14px;
}

.select-progress-pill {
  min-width: 132px;
  height: 64px;
  padding: 8px 18px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 211, 112, 0.58);
  background:
    radial-gradient(circle at 30% 20%, rgba(255, 221, 138, 0.20), transparent 42%),
    linear-gradient(180deg, rgba(35, 24, 12, 0.92), rgba(9, 7, 5, 0.92));
  box-shadow:
    0 12px 24px rgba(0, 0, 0, 0.34),
    inset 0 0 0 1px rgba(255, 239, 190, 0.06);
}

.select-progress-label {
  color: rgba(255, 229, 180, 0.82);
  font-size: 15px;
  font-weight: 900;
  line-height: 1;
}

.select-progress-pill strong {
  color: #ffe6a3;
  font-size: 25px;
  font-weight: 950;
  line-height: 1.1;
}

.select-review-button {
  min-height: 64px;
  padding: 14px 26px;
  font-size: 22px;
  white-space: nowrap;
}

.select-review-button:disabled {
  opacity: 0.55;
}

/* 선택 화면에서는 질문 카드 영역이 남은 공간을 꽉 쓰도록 조정 */
.select-screen .question-map {
  flex: 1;
  min-height: 0;
  height: auto;
}

/* 기존 아래 총복습 박스가 혹시 남아 있어도 선택 화면에서는 숨김 */
.select-screen .review-gate {
  display: none;
}

/* 낮은 화면에서도 제목 오른쪽 영역이 잘리지 않게 조정 */
@media (max-height: 900px) {
  .select-title-row {
    margin-bottom: 14px;
  }

  .select-progress-pill {
    height: 58px;
    min-width: 120px;
  }

  .select-progress-pill strong {
    font-size: 23px;
  }

  .select-review-button {
    min-height: 58px;
    padding: 12px 22px;
    font-size: 20px;
  }
}
/* =========================================================
   방법 알기 화면 글씨/예시창 잘림 수정
   - 핵심 주문 글씨를 조금 줄임
   - 오른쪽 예시창은 화면 밖으로 넘치지 않고 내부에서만 스크롤
========================================================= */

/* 핵심 주문 글씨 크기 줄이기 */
.method-rune-text {
  font-size: clamp(28px, 2.1vw, 36px);
  line-height: 1.5;
}

/* 가운데 물음표/핵심 낱말 버튼도 함께 축소 */
.hidden-keyword {
  min-width: 104px;
  padding: 7px 22px 9px;
  font-size: 31px;
}

/* 핵심 주문 박스 안쪽 여백도 살짝 줄이기 */
.method-rune-frame {
  padding: 22px 28px;
}

/* 오른쪽 예시 보조창: 전체 높이 안에서 잘리지 않게 */
.method-side-area {
  min-height: 0;
  overflow: hidden;
}

.method-example-panel {
  height: calc(100% - 82px);
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* 예시 내용이 길면 이 안에서만 스크롤 */
.method-example-box,
.method-example-question-box {
  flex-shrink: 0;
}

/* 예시 문장/질문 글씨 약간 축소 */
.method-example-text,
.method-example-question {
  font-size: 18px;
  line-height: 1.42;
}

/* 예시 안쪽 카드 여백 줄이기 */
.method-example-box,
.method-example-question-box {
  grid-template-columns: 46px 1fr;
  gap: 10px;
  padding: 12px;
}

.method-example-icon {
  width: 40px;
  height: 40px;
  font-size: 21px;
}

/* 관련된 질문 화살표 영역 압축 */
.method-example-arrow {
  margin: 8px 0;
  font-size: 19px;
}

/* 다음 예시 버튼이 잘리지 않도록 아래쪽 고정 느낌 */
.method-example-actions {
  margin-top: auto;
  padding-top: 10px;
}

.example-next-button {
  min-height: 50px;
  padding: 10px 18px;
  font-size: 19px !important;
}

/* 그래도 낮은 화면에서 오른쪽 내용이 넘치면 패널 내부 스크롤 */
@media (max-height: 850px) {
  .method-example-panel {
    overflow-y: auto;
  }

  .method-example-panel::-webkit-scrollbar {
    width: 6px;
  }

  .method-example-panel::-webkit-scrollbar-thumb {
    background: rgba(218, 166, 76, 0.55);
    border-radius: 999px;
  }

  .method-example-title {
    font-size: 23px;
  }

  .method-example-count {
    font-size: 16px;
  }

  .method-example-text,
  .method-example-question {
    font-size: 16px;
    line-height: 1.36;
  }
}
/* =========================================================
   기본 연습 화면 하단 버튼 아주 조금 위로 올리기
   - 버튼이 화면 아래에서 살짝 잘리는 문제 해결
========================================================= */

.two-column-layout:not(.method-layout) {
  height: calc(100% - 120px);
  min-height: 0;
}

.two-column-layout:not(.method-layout) .dark-card {
  min-height: 0;
  height: 100%;
}

.two-column-layout:not(.method-layout) .method-actions {
  margin-top: 10px;
  padding-bottom: 10px;
}

.two-column-layout:not(.method-layout) .plain-button,
.two-column-layout:not(.method-layout) .main-button {
  min-height: 54px;
  padding: 12px 24px;
  font-size: 21px;
}

/* 글 박스가 버튼을 밀어내지 않도록 아주 살짝 압축 */
.two-column-layout:not(.method-layout) .story-box {
  min-height: 235px;
  padding: 24px 30px;
}

.two-column-layout:not(.method-layout) .story-box p {
  font-size: 32px;
  line-height: 1.62;
}

.two-column-layout:not(.method-layout) .lumi-feedback {
  min-height: 92px;
  margin-top: 12px;
}
/* =========================================================
   기본 연습 화면 루미 피드백 상자 살짝 축소
   - 하단 버튼이 잘리지 않도록 루미 박스만 조금 줄임
========================================================= */

.two-column-layout:not(.method-layout) .lumi-feedback {
  min-height: 78px;
  margin-top: 10px;
  padding: 10px 16px;
  grid-template-columns: 64px 1fr;
}

.two-column-layout:not(.method-layout) .lumi-feedback img {
  width: 58px;
}

.two-column-layout:not(.method-layout) .lumi-feedback p {
  font-size: 19px;
  line-height: 1.35;
}
/* =========================================================
   방법 알기 화면 최종 구조 수정
   - 오른쪽 고정 예시 칸 삭제
   - 핵심 주문 카드를 화면 가로로 크게 사용
   - 예시는 오른쪽에 뜨는 보조창처럼 표시
========================================================= */

.method-screen {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 방법 알기 화면에서는 제목 아래 설명 문구 없이 넓게 사용 */
.method-screen .screen-title-row {
  margin-bottom: 16px;
}

/* 핵심 주문 카드가 화면 전체 폭을 사용 */
.method-full-card {
  flex: 1;
  min-height: 0;
  width: 100%;
  padding: 28px 32px 26px;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

/* 핵심 주문 제목 옆에 예시 보기 버튼 배치 */
.method-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 14px;
}

.method-card-top .section-label {
  margin-bottom: 0;
  font-size: 30px;
}

/* 예시 보기 버튼 */
.method-top-example-button {
  width: auto;
  min-width: 190px;
  min-height: 64px;
  padding: 14px 30px;
  border-radius: 999px;
  font-size: 25px;
  white-space: nowrap;
}

/* 핵심 주문 박스가 넓게 보이도록 */
.method-rune-wide {
  height: 100%;
  min-height: 0;
  padding: 34px 46px;
}

/* 핵심 주문 글씨 크게 */
.method-rune-text-wide {
  font-size: clamp(40px, 3.1vw, 58px);
  line-height: 1.58;
  letter-spacing: -1.3px;
}

/* 가운데 물음표/핵심 낱말 버튼도 크게 */
.method-keyword-wide {
  min-width: 142px;
  padding: 10px 32px 12px;
  font-size: clamp(36px, 2.5vw, 46px);
}

/* 루미 피드백은 넓게, 하지만 너무 높지 않게 */
.method-wide-feedback {
  min-height: 92px;
  margin-top: 16px;
  padding: 12px 20px;
  grid-template-columns: 74px 1fr;
}

.method-wide-feedback img {
  width: 66px;
}

.method-wide-feedback p {
  font-size: 22px;
  line-height: 1.42;
}

/* 버튼 하단 잘림 방지 */
.method-screen .method-actions {
  margin-top: 14px;
}

/* 오른쪽에 뜨는 예시 보조창 */
.floating-example-panel {
  position: absolute;
  right: 46px;
  top: 136px;
  z-index: 50;

  width: min(430px, 30vw);
  max-height: calc(100% - 170px);
  padding: 22px;

  display: flex;
  flex-direction: column;

  border-radius: 28px;
  border: 1px solid rgba(255, 211, 112, 0.68);
  background:
    radial-gradient(circle at 20% 0%, rgba(255, 211, 104, 0.18), transparent 36%),
    linear-gradient(180deg, rgba(34, 25, 14, 0.97), rgba(8, 6, 4, 0.98));
  box-shadow:
    0 24px 60px rgba(0, 0, 0, 0.62),
    0 0 0 1px rgba(255, 239, 190, 0.08) inset,
    0 0 34px rgba(230, 164, 42, 0.18);

  overflow-y: auto;
}

/* 보조창 스크롤바 */
.floating-example-panel::-webkit-scrollbar {
  width: 7px;
}

.floating-example-panel::-webkit-scrollbar-thumb {
  background: rgba(218, 166, 76, 0.62);
  border-radius: 999px;
}

/* 보조창 상단 */
.floating-example-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.floating-example-title {
  color: #ffe3a2;
  font-family: "Noto Serif KR", serif;
  font-size: 31px;
  font-weight: 900;
  line-height: 1.1;
}

.floating-example-count {
  margin-top: 5px;
  color: #ffd477;
  font-size: 18px;
  font-weight: 900;
}

.floating-close-button {
  width: 42px;
  height: 42px;
  border-radius: 999px;
  border: 1px solid rgba(255, 218, 127, 0.45);
  background: rgba(9, 7, 5, 0.78);
  color: #ffe4a4;
  font-size: 28px;
  font-weight: 900;
  line-height: 1;
}

/* 예시 문장 박스 */
.floating-example-box,
.floating-example-question-box {
  display: grid;
  grid-template-columns: 52px 1fr;
  align-items: flex-start;
  gap: 14px;
  padding: 16px;
  border-radius: 20px;
  border: 1px solid rgba(218, 166, 76, 0.34);
  background: rgba(255, 239, 202, 0.08);
}

.floating-example-question-box {
  background: rgba(255, 230, 166, 0.11);
}

.floating-example-panel .method-example-icon {
  width: 46px;
  height: 46px;
  font-size: 24px;
}

.floating-example-panel .method-example-text,
.floating-example-panel .method-example-question {
  color: #fff0ca;
  font-size: 22px;
  font-weight: 900;
  line-height: 1.52;
  word-break: keep-all;
}

.floating-example-panel .method-example-arrow {
  margin: 13px 0;
  padding-left: 4px;
  color: #ffd477;
  font-size: 23px;
  font-weight: 900;
}

/* 다음 예시 버튼 */
.floating-next-button {
  width: 100%;
  min-height: 58px;
  margin-top: 16px;
  padding: 12px 20px;
  font-size: 22px;
}

/* 예시창이 떠 있을 때도 핵심 주문은 가려지지 않게 오른쪽 여백 살짝 확보 */
.method-screen:has(.floating-example-panel) .method-rune-wide {
  padding-right: min(500px, 34vw);
}

/* 낮은 화면 보정 */
@media (max-height: 850px) {
  .method-full-card {
    padding: 22px 28px 20px;
  }

  .method-card-top {
    margin-bottom: 10px;
  }

  .method-card-top .section-label {
    font-size: 27px;
  }

  .method-top-example-button {
    min-height: 56px;
    padding: 12px 26px;
    font-size: 22px;
  }

  .method-rune-wide {
    padding: 24px 36px;
  }

  .method-rune-text-wide {
    font-size: clamp(34px, 2.7vw, 48px);
    line-height: 1.48;
  }

  .method-wide-feedback {
    min-height: 78px;
    margin-top: 12px;
  }

  .method-wide-feedback p {
    font-size: 19px;
    line-height: 1.35;
  }

  .floating-example-panel {
    top: 116px;
    right: 34px;
    width: min(400px, 30vw);
    max-height: calc(100% - 140px);
    padding: 18px;
  }

  .floating-example-title {
    font-size: 27px;
  }

  .floating-example-panel .method-example-text,
  .floating-example-panel .method-example-question {
    font-size: 19px;
    line-height: 1.42;
  }

  .floating-next-button {
    min-height: 52px;
    font-size: 20px;
  }
}

/* 화면 폭이 좁으면 보조창은 중앙 팝업처럼 */
@media (max-width: 1200px) {
  .floating-example-panel {
    right: 28px;
    width: 420px;
  }

  .method-screen:has(.floating-example-panel) .method-rune-wide {
    padding-right: 36px;
  }
}
/* =========================================================
   방법 알기 화면 루미 피드백 삭제 후 핵심 주문 확대
========================================================= */

/* 루미 피드백 박스가 혹시 남아도 방법 알기 화면에서는 숨김 */
.method-screen .method-wide-feedback,
.method-screen .lumi-feedback {
  display: none;
}

/* 루미가 사라진 만큼 핵심 주문 카드가 더 크게 공간을 사용 */
.method-full-card {
  grid-template-rows: auto 1fr auto;
}

/* 핵심 주문 박스 높이 확보 */
.method-rune-wide {
  height: 100%;
  min-height: 0;
  padding: 34px 46px;
}

/* 핵심 주문 글씨 다시 크게 */
.method-rune-text-wide {
  font-size: clamp(38px, 3vw, 54px);
  line-height: 1.52;
  letter-spacing: -1.2px;
}

/* 물음표 버튼도 크게 */
.method-keyword-wide {
  min-width: 136px;
  padding: 10px 30px 12px;
  font-size: clamp(35px, 2.4vw, 44px);
}

/* 버튼 영역은 아래에 안정적으로 붙게 */
.method-screen .method-actions {
  margin-top: 16px;
}

/* 낮은 화면에서는 살짝만 줄임 */
@media (max-height: 850px) {
  .method-rune-wide {
    padding: 28px 40px;
  }

  .method-rune-text-wide {
    font-size: clamp(34px, 2.6vw, 46px);
    line-height: 1.45;
  }

  .method-keyword-wide {
    min-width: 120px;
    padding: 8px 26px 10px;
    font-size: clamp(31px, 2.1vw, 38px);
  }
}
/* =========================================================
   심화 연습 화면 읽을 글 상자 높이 줄이기
   - 모든 질문 유형의 심화 연습 화면에 공통 적용
   - 왼쪽 읽을 글 박스 여백을 줄여 아래 예시가 보이게 함
========================================================= */

/* 심화 연습 화면의 전체 2단 레이아웃 높이 안정화 */
.two-column-layout:not(.method-layout) {
  height: calc(100% - 128px);
  min-height: 0;
  align-items: stretch;
}

/* 양쪽 카드가 화면 안에서만 높이를 쓰도록 */
.two-column-layout:not(.method-layout) .dark-card {
  height: 100%;
  min-height: 0;
  overflow: hidden;
}

/* 왼쪽 읽을 글 상자 자체를 조금 줄임 */
.two-column-layout:not(.method-layout) .story-box {
  min-height: 190px;
  padding: 20px 26px;
}

/* 읽을 글 글씨는 크게 유지하되 줄간격만 살짝 압축 */
.two-column-layout:not(.method-layout) .story-box p {
  font-size: 30px;
  line-height: 1.5;
}

/* 심화 연습의 도움말/예시 박스 여백 축소 */
.deep-hint-box {
  margin-top: 12px;
  padding: 14px 18px;
  font-size: 19px;
  line-height: 1.42;
}

/* 왼쪽 카드 제목 여백도 살짝 축소 */
.two-column-layout:not(.method-layout) .section-label {
  margin-bottom: 10px;
}

/* 낮은 화면에서는 조금 더 압축 */
@media (max-height: 850px) {
  .two-column-layout:not(.method-layout) {
    height: calc(100% - 118px);
  }

  .two-column-layout:not(.method-layout) .story-box {
    min-height: 165px;
    padding: 18px 24px;
  }

  .two-column-layout:not(.method-layout) .story-box p {
    font-size: 27px;
    line-height: 1.42;
  }

  .deep-hint-box {
    margin-top: 10px;
    padding: 12px 16px;
    font-size: 18px;
    line-height: 1.35;
  }
}
/* =========================================================
   총 복습 화면 비율/글씨 잘림 최종 수정
   - 총 복습 화면에서 글씨가 잘리지 않도록
   - 왼쪽 읽을 글 / 오른쪽 질문 제작대 비율 재조정
   - 카드 높이와 내부 여백 압축
========================================================= */

/* 총 복습 화면 전체 높이 고정 */
.review-layout {
  height: calc(100% - 132px);
  min-height: 0;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 20px;
  align-items: stretch;
}

/* 양쪽 카드가 화면 안에 들어오게 */
.review-book,
.review-workshop {
  height: 100%;
  min-height: 0;
  padding: 20px 22px;
  overflow: hidden;
}

/* 왼쪽 제목 줄이기 */
.review-story-title {
  margin-bottom: 12px;
  font-size: 27px;
  line-height: 1.2;
}

/* 읽을 글 버튼들 높이/글씨 조정 */
.review-story-part {
  padding: 10px 13px;
  margin-bottom: 7px;
  font-size: 17px;
  line-height: 1.38;
  border-radius: 14px;
}

/* 오른쪽 질문 제작대 압축 */
.review-selected-box {
  margin-bottom: 10px;
  padding: 11px 13px;
  font-size: 16px;
  line-height: 1.35;
}

.review-type-grid {
  gap: 8px;
  margin: 8px 0 10px;
}

.review-type-button {
  min-height: 54px;
  padding: 9px 11px;
  font-size: 15px;
  line-height: 1.28;
}

/* 입력칸 라벨과 입력칸 축소 */
.review-input-label {
  margin: 8px 0 5px;
  font-size: 16px;
}

.review-input {
  min-height: 58px;
  padding: 9px 11px;
  font-size: 16px;
  line-height: 1.35;
}

/* 완성한 질문 상태 박스 축소 */
.review-status {
  margin-bottom: 10px;
  padding: 10px 12px;
}

.review-status-title {
  margin-bottom: 6px;
  font-size: 16px;
}

.review-status-list {
  gap: 6px;
}

.review-status-item {
  padding: 7px 8px;
  font-size: 13px;
}

/* 총 복습 화면 안의 루미 피드백 축소 */
.review-workshop .lumi-feedback {
  min-height: 70px;
  margin-top: 9px;
  padding: 9px 13px;
  grid-template-columns: 54px 1fr;
}

.review-workshop .lumi-feedback img {
  width: 48px;
}

.review-workshop .lumi-feedback p {
  font-size: 15px;
  line-height: 1.3;
}

/* 총 복습 화면 하단 버튼 축소 */
.review-workshop .method-actions {
  margin-top: 9px;
  gap: 10px;
}

.review-workshop .plain-button,
.review-workshop .main-button {
  min-height: 48px;
  padding: 9px 16px;
  font-size: 17px;
}

/* 총 복습 화면 제목 영역도 살짝 압축 */
.screen-title-row:has(.title-badge) {
  margin-bottom: 14px;
}

/* 낮은 화면에서 한 번 더 압축 */
@media (max-height: 850px) {
  .review-layout {
    height: calc(100% - 112px);
    gap: 16px;
  }

  .review-book,
  .review-workshop {
    padding: 16px 18px;
  }

  .review-story-title {
    font-size: 24px;
    margin-bottom: 8px;
  }

  .review-story-part {
    padding: 8px 11px;
    margin-bottom: 6px;
    font-size: 15.5px;
    line-height: 1.3;
  }

  .review-selected-box {
    font-size: 14.5px;
    padding: 9px 11px;
  }

  .review-type-button {
    min-height: 48px;
    font-size: 14px;
  }

  .review-input {
    min-height: 50px;
    font-size: 15px;
  }

  .review-workshop .lumi-feedback {
    min-height: 62px;
  }

  .review-workshop .lumi-feedback p {
    font-size: 14px;
  }

  .review-workshop .plain-button,
  .review-workshop .main-button {
    min-height: 44px;
    font-size: 15.5px;
    padding: 8px 14px;
  }
}
/* =========================================================
   총 복습 화면 위치/타이틀 크기 미세 조정
   - 큰 타이틀 글씨를 아주 조금 줄임
   - 질문 제작대가 위로 올라오도록 총 복습 화면 레이아웃 재조정
   - 하단 입력칸/버튼 잘림 방지
========================================================= */

/* 총 복습 화면 큰 제목 아주 조금 축소 */
.review-layout ~ *,
.screen .title-badge + .main-title {
  font-size: clamp(32px, 2.55vw, 43px);
}

/* 총 복습 화면 설명 문구도 높이를 덜 차지하게 */
.screen .main-desc {
  margin-top: 6px;
  font-size: 19px;
  line-height: 1.25;
}

/* 총 복습 화면 제목 줄 전체 높이 줄이기 */
.screen-title-row {
  margin-bottom: 10px;
}

/* 총 복습 전체 레이아웃을 더 위에서 시작하고 화면 안에 맞춤 */
.review-layout {
  height: calc(100% - 108px);
  min-height: 0;
  align-items: stretch;
  gap: 20px;
}

/* 질문 제작대와 읽을 글 카드 모두 위에서 바로 시작 */
.review-book,
.review-workshop {
  height: 100%;
  min-height: 0;
  padding: 18px 22px;
  overflow: hidden;
}

/* 오른쪽 질문 제작대 내부를 위에서부터 촘촘하게 */
.review-workshop {
  display: flex;
  flex-direction: column;
}

/* 오른쪽 제목 '질문 제작대' 위쪽 여백 제거 */
.review-workshop > .section-label:first-child {
  margin-bottom: 10px;
}

/* 완성한 질문 박스 높이 축소 */
.review-status {
  margin-bottom: 8px;
  padding: 9px 12px;
}

.review-status-title {
  margin-bottom: 5px;
  font-size: 15px;
}

.review-status-list {
  gap: 5px;
}

.review-status-item {
  padding: 6px 8px;
  font-size: 12.5px;
}

/* 선택한 글 부분 박스도 살짝 축소 */
.review-selected-box {
  margin-bottom: 8px;
  padding: 10px 12px;
  font-size: 15px;
  line-height: 1.3;
}

/* 질문 종류 선택 영역 압축 */
.review-type-grid {
  gap: 7px;
  margin: 7px 0 8px;
}

.review-type-button {
  min-height: 46px;
  padding: 8px 10px;
  font-size: 14px;
  line-height: 1.25;
}

/* 내 질문 / 내 답 입력칸이 화면 안에 들어오게 */
.review-input-label {
  margin: 6px 0 4px;
  font-size: 15px;
}

.review-input {
  min-height: 50px;
  padding: 8px 10px;
  font-size: 15px;
  line-height: 1.3;
}

/* 루미 피드백이 있으면 너무 밀지 않게 */
.review-workshop .lumi-feedback {
  min-height: 58px;
  margin-top: 7px;
  padding: 7px 11px;
  grid-template-columns: 46px 1fr;
}

/* =========================================================

   - 오른쪽 질문 제작대 카드를 큰 타이틀 위치까지 위로 올림
   - 아래 입력칸이 잘리지 않도록 오른쪽 카드 높이도 같이 늘림
========================================================= */

.review-layout {
  height: calc(100% - 108px);
  align-items: stretch;
}

/* 오른쪽 질문 제작대만 위로 올림 */
.review-workshop {
  transform: translateY(-110px);
height: calc(100% + 110px);
  min-height: 0;
  overflow: hidden;
}

/* 질문 제작대 안쪽도 위에서부터 촘촘하게 */
.review-workshop > .section-label:first-child {
  margin-top: 0;
  margin-bottom: 10px;
}

/* 오른쪽 카드가 위로 올라가면서 아래까지 잘 보이도록 내부 간격 압축 */
.review-workshop {
  padding: 18px 22px;
  display: flex;
  flex-direction: column;
}

/* 내 질문 / 내 답 부분이 아래에서 잘리지 않도록 */

  min-height: 48px;
  padding: 8px 10px;
  font-size: 15px;
  line-height: 1.3;
}

  margin: 6px 0 4px;
}

/* 루미 피드백이 있으면 너무 밀지 않게 */

  min-height: 56px;
  margin-top: 7px;
  padding: 7px 11px;
}

/* 버튼 영역은 맨 아래에 붙이고 잘리지 않게 */

  margin-top: auto;
  padding-top: 8px;
}
/* 총 복습 질문 종류: 완료한 유형 비활성화 */
.review-type-button.disabled,
.review-type-button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  filter: grayscale(0.45);
  border-color: rgba(174, 255, 111, 0.45);
  background:
    radial-gradient(circle at 0% 50%, rgba(174, 255, 111, 0.10), transparent 42%),
    linear-gradient(180deg, rgba(32, 40, 22, 0.82), rgba(12, 14, 8, 0.92));

}

/* =========================================================
   1920 × 1080 고정 화면 + 전체 확대 최종본
   - 브라우저 크기에 따라 화면 전체만 비율 확대/축소
   - 카드형 그리드와 위치는 변하지 않음
   - 상단 홈 버튼 복구
   - 로고, 책 그림, 유형별 방법 글씨, 루미 피드백 확대
========================================================= */
:root {
  --screen-scale: 1;
}

html,
body {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  margin: 0;
  overflow: hidden !important;
  background: #17130d;
}

body {
  position: relative;
}

.page {
  position: absolute !important;
  left: 50% !important;
  top: 50% !important;
  width: 1920px !important;
  height: 1080px !important;
  min-width: 1920px !important;
  min-height: 1080px !important;
  max-width: 1920px !important;
  max-height: 1080px !important;
  padding: 16px 38px !important;
  overflow: hidden !important;
  transform: translate(-50%, -50%) scale(var(--screen-scale)) !important;
  transform-origin: center center !important;
}

.page-inner {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  height: 100% !important;
  margin: 0 !important;
  display: grid !important;
  grid-template-rows: 92px minmax(0, 1fr) !important;
  row-gap: 12px !important;
  overflow: hidden !important;
}

.top-bar {
  position: relative !important;
  z-index: 100 !important;
  width: 100% !important;
  height: 92px !important;
  min-height: 92px !important;
  max-height: 92px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;

    return;
  }

  try {
    const response = await fetch(
      `http://localhost:8080/api/students/${studentId}/practice-progress`,
      {
        method: "GET",
        headers: {
          "Authorization": `Bearer ${token}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("읽기 중 진행 상태 불러오기에 실패했습니다.");
    }

    const data = await response.json();

    if (data.duringTypeProgress) {
      progress = {
        ...progress,
        ...data.duringTypeProgress
      };

      sessionStorage.setItem(
        progressKey,
        JSON.stringify(progress)
      );
    }
  } catch (error) {
    console.error(error);

    async function saveProgress() {
  const studentId = sessionStorage.getItem("studentId");
  const token = sessionStorage.getItem("token");

  if (!studentId || !token) {
    alert("로그인 정보가 없어서 진행 상태를 저장하지 못했어요. 다시 로그인해 주세요.");
    window.location.href = "../index.html";
    return false;
  }

  try {
    const response = await fetch(
      `http://localhost:8080/api/students/${studentId}/practice-progress`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
  duringTypeProgress: progress
})
      }
    );

    if (!response.ok) {
      throw new Error(
        "읽기 중 진행 상태 저장에 실패했습니다."
      );
    }

    /* 실제로 저장에 성공했을 때만 브라우저 임시 저장도 갱신합니다. */
    sessionStorage.setItem(
      progressKey,
      JSON.stringify(progress)
    );

    return true;
  } catch (error) {
    console.error(error);
    alert("읽기 중 진행 상태를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.");
    return false;
  }
}

      if (isDemoAccount()) return true;

      if (typeId === "infer") return progress.direct;
      if (typeId === "opinion") return progress.infer;
      if (typeId === "connect") return progress.opinion;

/*
  Fisher-Yates 셔플. 문제·정답 내용은 전혀 바꾸지 않고 배열 순서만 섞는다.
*/
function shuffleArray(items) {
  const shuffled = items.slice();

  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = shuffled[i];
    shuffled[i] = shuffled[j];
    shuffled[j] = temp;
  }

  return shuffled;
}

/*
  이 문제(유형+번호)를 이번에 처음 보여줄 때만 선택지를 섞고, 그 뒤로는
  같은 순서를 그대로 재사용한다(캐시 키: "유형-문제번호").
*/
function getShuffledBasicChoices(question, cacheKey) {
  if (!basicChoicesShuffleCache[cacheKey]) {
    basicChoicesShuffleCache[cacheKey] = shuffleArray(question.choices);
  }

  return basicChoicesShuffleCache[cacheKey];
}

    async function requestDeepAiFeedback(question) {
  const requestId = ++deepAiRequestId;

  deepAiLoading = true;
  renderDeepPracticeScreen();

  const token = sessionStorage.getItem("token");

  if (!token || !studentId || !classReadingBookId) {
    deepAiLoading = false;
    deepChecked = true;
    deepResult = {
      ok: false,
      message: "로그인 또는 책 정보가 없어요. 다시 로그인한 뒤 시도해 주세요."
    };
    renderDeepPracticeScreen();
    return;
  }

  /*
    심화 연습은 문제 번호(currentDeepIndex)까지 넣어야 같은 유형의 다른
    문제와 겹치지 않는다. 기본/심화 연습과 총복습은 evaluationKey의
    "deep-"/"review-" 구분자로 서로 섞이지 않는다.
  */
  const evaluationKey =
    "practice-during-" +
    classReadingBookId +
    "-" +
    studentId +
    "-deep-" +
    selectedQuestionType +
    "-" +
    currentDeepIndex;

  try {
    const response = await fetch(
      API_BASE_URL + "/api/students/me/feedback/ai-review",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({
          question: question,
          answer: "",
          activityType: "during_reading_practice_deep",
          questionType: selectedQuestionType,
          evaluationKey: evaluationKey,
          classReadingBookId: classReadingBookId
        })
      }
    );

    if (!response.ok) {
      throw new Error(
        "읽기 중 심화 연습 AI 피드백 요청 실패: " +
        response.status
      );
    }

    const result = await response.json();

    /*
     * 학생이 질문을 수정한 뒤 다시 검사했거나,
     * 더 최근 요청이 실행됐다면 이전 결과는 적용하지 않습니다.
     */
    if (requestId !== deepAiRequestId) {
      return;
    }

    const isGood = result.status === "good";

    /*
     * AI가 통과시킨 질문만 DB에 저장합니다.
     * 저장에 실패하면 화면에서도 통과 처리하지 않습니다.
     */
    if (isGood) {
      const saved = await saveDuringPracticeQuestion(question);

      if (requestId !== deepAiRequestId) {
        return;
      }

      if (!saved) {
        deepAiLoading = false;
        deepChecked = true;
        deepResult = {
          ok: false,
          message:
            "질문은 잘 만들었지만 저장하지 못했어요. 잠시 후 다시 검사해 주세요."
        };
        renderDeepPracticeScreen();
        return;
      }
    }

    deepAiLoading = false;
    deepChecked = true;

    deepResult = {
      ok: isGood,
      message:
        result.message ||
        (
          isGood
            ? "질문이 잘 만들어졌어! 다음 문제로 넘어가 보자."
            : "질문을 다시 확인해 보자."
        )
    };

    renderDeepPracticeScreen();
  } catch (error) {
    if (requestId !== deepAiRequestId) {
      return;
    }

    console.error(error);

    deepAiLoading = false;
    deepChecked = true;
    deepResult = {
      ok: false,
      message:
        "지금은 루미 피드백을 확인하기 어려워요. 잠시 후 다시 검사해 보세요."
    };

    renderDeepPracticeScreen();
  }
}

    if (!response.ok) {
      throw new Error(`총복습 질문·답 저장 실패: ${response.status}`);
    }

    return true;
  } catch (error) {
    console.error("총복습 질문·답을 저장하지 못했습니다.", error);
    return false;
  }
}
    async function requestReviewAiFeedback(type, partIndex, question, answer) {
      const requestId = ++reviewAiRequestId;
      reviewAiLoading = true;
      renderReviewScreen();

      const passage = reviewStory.title + "\n" +
        reviewStory.parts.map(function (part) { return part.text; }).join(" ");

     const token = sessionStorage.getItem("token");

if (!token || !studentId || !classReadingBookId) {
  reviewAiLoading = false;
  reviewChecked = true;
  reviewResult = {
    ok: false,
    message: "로그인 또는 책 정보가 없어요. 다시 로그인한 뒤 시도해 주세요."
  };
  renderReviewScreen();
  return;
}

const evaluationKey =
  "practice-during-" +
  classReadingBookId +
  "-" +
  studentId +
  "-review-" +
  type;

fetch(API_BASE_URL + "/api/students/me/feedback/ai-review", {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
    Authorization: "Bearer " + token
  },
  body: JSON.stringify({
    question: question,
    answer: answer,
    activityType: "during_reading_practice_review",
    questionType: type,
    evaluationKey: evaluationKey,
    passage: passage,
    classReadingBookId: classReadingBookId
  })
}).then(function(response) {
        if (!response.ok) {
          throw new Error("총복습 AI 피드백 요청 실패: " + response.status);
        }
        return response.json();
      }).then(async function(result) {
        if (requestId !== reviewAiRequestId) return;
        reviewAiLoading = false;

        /* status가 아닌 다른 값으로 통과 여부를 추측하지 않는다. */
        const isGood = result.status === "good";

        if (isGood) {
  const saved = await saveDuringReviewResponse(
    type,
    question,
    answer
  );

  if (requestId !== reviewAiRequestId) {
    return;
  }

  if (!saved) {
    reviewAiLoading = false;
    reviewChecked = true;
    reviewResult = {
      ok: false,
      message:
        "질문은 잘 만들었지만 저장하지 못했어요. 잠시 후 다시 검사해 주세요."
    };
    renderReviewScreen();
    return;
  }

  reviewCompletedQuestions[type] = {
    partIndex: partIndex,
    question: question,
    answer: answer
  };

  reviewQuestionInput = "";
  reviewAnswerInput = "";
  reviewSelectedType = null;
}

        reviewResult = {
          ok: isGood,
          message: result.message ||
            (isGood
              ? "좋아! 이 질문 종류를 잘 만들었어. 남은 질문 종류도 채워 보자."
              : "질문이나 답을 다시 확인해 보자.")
        };

        renderReviewScreen();
      }).catch(function(error) {
        console.error("총복습 AI 피드백 요청에 실패했습니다.", error);

        if (requestId !== reviewAiRequestId) return;
        reviewAiLoading = false;
        reviewResult = {
          ok: false,
          message: "지금은 루미 피드백을 확인하기 어려워요. 잠시 후 다시 검사해 보세요."
        };
        renderReviewScreen();
      });
    }

    async function finishReview() {
  const complete =
    reviewCompletedQuestions.direct &&
    reviewCompletedQuestions.infer &&
    reviewCompletedQuestions.opinion &&
    reviewCompletedQuestions.connect;

  if (!complete && !isDemoAccount()) {
    return;
  }

  /* 총 복습 완료 상태를 추가합니다. */
  progress.review = true;

  if (isDemoAccount()) {
    const demoProgress = loadDemoState("practiceProgress", {});
    demoProgress.classReadDone = true;
    saveDemoState("practiceProgress", demoProgress);
  }

  /* 백엔드 저장이 끝날 때까지 기다립니다. */
  const saved = isDemoAccount() ? true : await saveProgress();

  if (!saved) {
    return;
  }

  alert("총 복습까지 완료했어요!");
  window.location.href = "class-reading.html";
}

                  : reviewChecked && reviewResult

                        '<p>' + reviewResult.message + '</p>' +

                    : '<div class="lumi-feedback">' +

                      '</div>'

              '<div class="method-actions">' +

    function renderReviewTypeButton(type, label) {

const savedDuringPracticeQuestions = {
  direct: "",
  infer: "",
  opinion: "",
  connect: ""
};

async function loadDuringPracticeQuestions() {
  if (isDemoAccount()) {
    const saved = loadDemoState(DEMO_DEEP_PRACTICE_STORAGE_KEY, null);

    if (saved) {
      Object.keys(savedDuringPracticeQuestions).forEach(function(type) {
        if (Object.prototype.hasOwnProperty.call(saved, type)) {
          savedDuringPracticeQuestions[type] = saved[type] || "";
        }
      });
    }

    return true;
  }

  const token = sessionStorage.getItem("token");

  if (!token || !studentId) {
    return false;
  }

  try {
    const response = await fetch(
      `${API_BASE_URL}/api/students/${studentId}/responses/during-practice`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        `심화 연습 질문 조회 실패: ${response.status}`
      );
    }

    const items = await response.json();

    items.forEach(function(item) {
      if (
        item.questionType &&
        Object.prototype.hasOwnProperty.call(
          savedDuringPracticeQuestions,
          item.questionType
        )
      ) {
        savedDuringPracticeQuestions[item.questionType] =
          item.question || "";
      }
    });

    return true;
  } catch (error) {
    console.error(
      "심화 연습 질문을 불러오지 못했습니다.",
      error
    );
    return false;
  }
}

async function loadClassReadingBookId() {
  const token = sessionStorage.getItem("token");
  const role = sessionStorage.getItem("role");

  if (!token || !studentId || role !== "student") {
    alert("학생 로그인이 필요합니다.");
    location.href = "../../index.html";
    return false;
  }

  try {
    /* 로그인한 학생의 학급을 먼저 조회합니다. */
    const classResponse = await fetch(
      `${API_BASE_URL}/api/students/${studentId}/class`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (!classResponse.ok) {
      throw new Error(`학생 학급 조회 실패: ${classResponse.status}`);
    }

    const classData = await classResponse.json();

    /* 해당 학급에 등록된 연습읽기 책 정보를 조회합니다. */
    const bookResponse = await fetch(
      `${API_BASE_URL}/api/classes/${classData.classId}/reading-range`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (bookResponse.status === 404) {
      alert("아직 우리 반의 온책읽기 책이 등록되지 않았습니다.");
      return false;
    }

    if (!bookResponse.ok) {
      throw new Error(`온책읽기 책 조회 실패: ${bookResponse.status}`);
    }

    const bookData = await bookResponse.json();

    classReadingBookId = bookData.id;
    return true;
  } catch (error) {
    console.error("학급 책 정보를 불러오지 못했습니다.", error);
    alert("책 정보를 불러오지 못했습니다.");
    return false;
  }
}
async function initPage() {
  const bookLoaded = await loadClassReadingBookId();

  if (!bookLoaded) {
    return;
  }

  await loadProgress();
  await loadDuringPracticeQuestions();
  await loadDuringReviewResponses();
  renderSelectScreen();
}

initPage();

    (function () {
      const DESIGN_WIDTH = 1920;
      const DESIGN_HEIGHT = 1080;

      function resizeFixedScreen() {
        const scaleX = window.innerWidth / DESIGN_WIDTH;
        const scaleY = window.innerHeight / DESIGN_HEIGHT;
        const scale = Math.min(scaleX, scaleY);
        document.documentElement.style.setProperty("--screen-scale", String(scale));
      }

      window.addEventListener("resize", resizeFixedScreen);
      window.addEventListener("orientationchange", resizeFixedScreen);
      window.addEventListener("DOMContentLoaded", resizeFixedScreen);
      resizeFixedScreen();
    })();
