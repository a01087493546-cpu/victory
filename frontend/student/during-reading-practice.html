<!--
  파일명: during-reading-practice.html
  역할: 문답책 프로젝트 - 읽기 중 질문 종류별 연습 화면입니다.

  구현 범위:
  1. 질문 종류 선택 화면
  2. 방법 알기 화면
  3. 기본 연습 화면
  4. 심화 연습 화면

  공식 표기:
  - 화면에는 반드시 '문답책' 또는 '문답책 프로젝트'를 사용합니다.
  - 'Victory'라는 이름은 사용하지 않습니다.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문답책 - 읽기 중 질문 연습</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #fff1d0;
      background:
        linear-gradient(rgba(0, 0, 0, 0.32), rgba(0, 0, 0, 0.72)),
        url("../assets/images/during-reading/intro/during-reading-practice-bg.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    button, textarea { font-family: inherit; }
    button { cursor: pointer; }

    .page { min-height: 100vh; padding: 24px 38px 30px; }
    .page-inner { max-width: 1480px; margin: 0 auto; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Noto Serif KR", serif;
      color: #fff4d8;
      font-size: 29px;
      font-weight: 900;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.65);
    }

    .logo-area img {
      width: 62px;
      height: 62px;
      object-fit: contain;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.5));
    }

    .nav-button {
      border: 1px solid rgba(218, 160, 65, 0.45);
      border-radius: 999px;
      padding: 13px 24px;
      background: rgba(25, 17, 10, 0.72);
      color: #fff0cf;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.35);
    }

    .nav-button:hover { transform: translateY(-2px); background: rgba(69, 44, 22, 0.82); }

    .hero-card {
      position: relative;
      min-height: 720px;
      overflow: hidden;
      border-radius: 34px;
      border: 1px solid rgba(218, 160, 65, 0.48);
      background:
        radial-gradient(circle at 50% 8%, rgba(221, 158, 55, 0.13), transparent 34%),
        linear-gradient(180deg, rgba(15, 12, 9, 0.78), rgba(4, 4, 3, 0.86));
      box-shadow: 0 36px 80px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 230, 166, 0.08);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 38%, rgba(216, 150, 42, 0.13), transparent 38%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.08), transparent 45%, rgba(0, 0, 0, 0.18));
      z-index: 0;
    }

    .screen { position: relative; z-index: 1; padding: 38px 58px 48px; }

    .screen-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 24px;
    }

    .title-badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 9px 20px;
      border-radius: 999px;
      background: linear-gradient(180deg, #d8a84c, #8d551a);
      border: 1px solid rgba(255, 220, 142, 0.6);
      color: #fff3d0;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.28);
    }

    .main-title {
      font-family: "Noto Serif KR", serif;
      color: #fff3d4;
      font-size: 43px;
      font-weight: 900;
      line-height: 1.24;
      letter-spacing: -1.4px;
      word-break: keep-all;
      text-shadow: 0 3px 0 rgba(51, 29, 9, 0.9), 0 10px 24px rgba(0, 0, 0, 0.7);
    }

    .main-desc {
      margin-top: 15px;
      color: rgba(255, 228, 186, 0.9);
      font-size: 18px;
      font-weight: 850;
      line-height: 1.65;
      word-break: keep-all;
    }

    .progress-pill {
      flex-shrink: 0;
      padding: 14px 22px;
      border-radius: 999px;
      background: rgba(9, 7, 5, 0.68);
      border: 1px solid rgba(214, 154, 60, 0.5);
      color: #f2cf82;
      font-size: 16px;
      font-weight: 900;
    }

    /* 질문 종류 선택 화면 */
    .question-map {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      min-height: 500px;
      padding: 20px;
      border-radius: 28px;
      background: radial-gradient(circle at 50% 50%, rgba(222, 159, 49, 0.16), transparent 26%), linear-gradient(180deg, rgba(12, 10, 8, 0.74), rgba(4, 4, 3, 0.8));
      border: 1px solid rgba(198, 138, 50, 0.36);
      box-shadow: 0 28px 58px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 223, 158, 0.08);
    }

    .question-cell {
      position: relative;
      min-height: 230px;
      padding: 30px 34px 80px;
      overflow: hidden;
      border: 1px solid rgba(185, 125, 43, 0.34);
      background: radial-gradient(circle at 82% 26%, rgba(222, 158, 44, 0.14), transparent 26%), linear-gradient(180deg, rgba(19, 16, 13, 0.78), rgba(5, 5, 4, 0.84));
      box-shadow: inset 0 1px 0 rgba(255, 231, 168, 0.06), 0 14px 28px rgba(0, 0, 0, 0.35);
      color: #fff1ce;
      text-align: left;
      transition: 0.2s ease;
    }

    .question-cell:nth-child(1) { border-radius: 24px 8px 8px 8px; }
    .question-cell:nth-child(2) { border-radius: 8px 24px 8px 8px; }
    .question-cell:nth-child(3) { border-radius: 8px 8px 8px 24px; }
    .question-cell:nth-child(4) { border-radius: 8px 8px 24px 8px; }

    .question-cell.open {
      border-color: rgba(255, 211, 112, 0.95);
      background: radial-gradient(circle at 82% 25%, rgba(255, 189, 55, 0.28), transparent 28%), radial-gradient(circle at 12% 82%, rgba(189, 116, 24, 0.24), transparent 32%), linear-gradient(180deg, rgba(74, 48, 18, 0.82), rgba(18, 12, 7, 0.9));
      box-shadow: inset 0 0 0 2px rgba(236, 181, 72, 0.24), 0 0 34px rgba(230, 164, 42, 0.34), 0 20px 40px rgba(0, 0, 0, 0.48);
    }

    .question-cell.open:hover { transform: translateY(-4px); }
    .question-cell.locked { opacity: 0.46; filter: grayscale(0.55) brightness(0.7); cursor: not-allowed; }
    .question-cell.done { border-color: rgba(156, 216, 118, 0.7); }

    .cell-number { position: relative; z-index: 3; margin-bottom: 12px; color: #d8a851; font-size: 16px; font-weight: 900; }

    .cell-icon-img {
      position: absolute;
      right: 34px;
      top: 34px;
      width: 126px;
      height: 126px;
      object-fit: contain;
      opacity: 0.92;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 18px rgba(224, 158, 45, 0.24));
    }

    .cell-title {
      position: relative;
      z-index: 3;
      max-width: 60%;
      margin-top: 18px;
      color: #fff1ca;
      font-family: "Noto Serif KR", serif;
      font-size: 27px;
      font-weight: 900;
      line-height: 1.42;
      letter-spacing: -0.9px;
      word-break: keep-all;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.72), 0 0 14px rgba(224, 158, 45, 0.18);
    }

    .cell-desc {
      position: relative;
      z-index: 3;
      max-width: 58%;
      margin-top: 12px;
      color: rgba(255, 228, 184, 0.86);
      font-size: 15px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .cell-state {
      position: absolute;
      left: 34px;
      bottom: 26px;
      width: 210px;
      padding: 12px 10px;
      border-radius: 999px;
      background: rgba(8, 6, 4, 0.76);
      border: 1px solid rgba(201, 139, 52, 0.44);
      color: #cdb37a;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
    }

    .question-cell.open .cell-state { background: linear-gradient(180deg, #dca64a, #8b551a); color: #fff4d4; }

    .question-core {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 20;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 170px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      text-align: center;
      background: radial-gradient(circle at 42% 26%, #f5d38a 0%, #9a641f 55%, #251306 100%);
      border: 1px solid rgba(255, 211, 114, 0.9);
      box-shadow: 0 0 42px rgba(226, 163, 42, 0.52), 0 18px 38px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 246, 210, 0.26);
      color: #fff1c8;
      font-family: "Noto Serif KR", serif;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.35;
    }

    .question-core span { display: block; margin-top: 5px; color: #ffd56f; font-size: 34px; text-shadow: 0 0 18px rgba(255, 204, 76, 0.85); }
/* =========================================================
   총 복습으로 가는 버튼
   - 4가지 질문 종류를 모두 연습한 뒤 열리는 마지막 관문입니다.
========================================================= */

.review-gate {
  margin-top: 24px;
  padding: 22px 26px;
  border-radius: 26px;
  border: 1px solid rgba(255, 211, 112, 0.58);
  background:
    radial-gradient(circle at 8% 50%, rgba(255, 211, 104, 0.18), transparent 38%),
    radial-gradient(circle at 92% 20%, rgba(117, 230, 186, 0.14), transparent 34%),
    linear-gradient(135deg, rgba(61, 42, 19, 0.78), rgba(11, 8, 5, 0.92));
  box-shadow:
    0 20px 46px rgba(0, 0, 0, 0.36),
    inset 0 0 0 1px rgba(255, 239, 190, 0.08);
}

.review-gate.locked {
  opacity: 0.55;
  filter: grayscale(0.35);
}

.review-gate-title {
  color: #ffe7a8;
  font-family: "Noto Serif KR", serif;
  font-size: 25px;
  font-weight: 900;
  margin-bottom: 8px;
}

.review-gate-desc {
  color: rgba(255, 237, 196, 0.86);
  font-size: 16px;
  font-weight: 850;
  line-height: 1.55;
  word-break: keep-all;
}

.review-gate-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.review-gems {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.review-gem {
  width: 30px;
  height: 30px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 218, 127, 0.44);
  background: rgba(255, 230, 166, 0.09);
  color: rgba(255, 230, 166, 0.65);
  font-size: 14px;
  font-weight: 900;
}

.review-gem.done {
  border-color: rgba(174, 255, 111, 0.72);
  background:
    radial-gradient(circle, rgba(174, 255, 111, 0.32), rgba(67, 104, 36, 0.28));
  color: #eaffcf;
  box-shadow: 0 0 16px rgba(174, 255, 111, 0.22);
}
/* =========================================================
   총 복습 활동 화면
   - 신비로운 책 페이지 느낌으로 긴 글을 읽고,
   - 질문 만들 부분을 선택할 수 있게 합니다.
========================================================= */

.review-layout {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 26px;
  align-items: stretch;
}

.review-book {
  min-height: 620px;
  padding: 28px;
  border-radius: 30px;
  border: 1px solid rgba(220, 166, 74, 0.46);
  background:
    radial-gradient(circle at 50% 0%, rgba(255, 213, 106, 0.12), transparent 36%),
    linear-gradient(180deg, rgba(24, 18, 12, 0.88), rgba(6, 5, 4, 0.92));
  box-shadow:
    inset 0 0 0 1px rgba(255, 238, 188, 0.06),
    0 24px 48px rgba(0, 0, 0, 0.40);
}

.review-story-title {
  margin-bottom: 18px;
  color: #ffe3a2;
  font-family: "Noto Serif KR", serif;
  font-size: 28px;
  font-weight: 900;
  text-align: center;
}

.review-story-text {
  display: grid;
  gap: 10px;
}

.review-story-part {
  width: 100%;
  padding: 12px 15px;
  border-radius: 16px;
  border: 1px solid rgba(218, 166, 76, 0.16);
  background: rgba(255, 239, 202, 0.045);
  color: #fff0c9;
  font-family: "Noto Serif KR", serif;
  font-size: 19px;
  font-weight: 800;
  line-height: 1.62;
  text-align: left;
  word-break: keep-all;
  transition: 0.16s ease;
}

.review-story-part:hover {
  transform: translateY(-1px);
  border-color: rgba(255, 213, 106, 0.48);
  background: rgba(255, 230, 166, 0.09);
}

.review-story-part.selected {
  border-color: rgba(255, 218, 127, 0.76);
  background:
    linear-gradient(90deg, rgba(255, 218, 127, 0.22), rgba(255, 230, 166, 0.06));
  box-shadow:
    inset 0 -4px 0 rgba(255, 213, 106, 0.55),
    0 0 18px rgba(255, 213, 106, 0.14);
}

.review-workshop {
  min-height: 620px;
  padding: 24px;
  border-radius: 30px;
  border: 1px solid rgba(220, 166, 74, 0.46);
  background:
    radial-gradient(circle at 10% 0%, rgba(255, 213, 106, 0.11), transparent 34%),
    linear-gradient(180deg, rgba(18, 14, 10, 0.90), rgba(5, 4, 3, 0.94));
  box-shadow:
    inset 0 0 0 1px rgba(255, 238, 188, 0.06),
    0 24px 48px rgba(0, 0, 0, 0.40);
}

.review-selected-box {
  margin-bottom: 16px;
  padding: 15px 17px;
  border-radius: 18px;
  border: 1px solid rgba(255, 218, 127, 0.34);
  background: rgba(255, 230, 166, 0.07);
  color: #ffeac0;
  font-size: 15.5px;
  font-weight: 850;
  line-height: 1.55;
  word-break: keep-all;
}

.review-selected-box strong {
  display: block;
  margin-bottom: 6px;
  color: #ffd477;
}

.review-type-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 14px 0 16px;
}

.review-type-button {
  min-height: 58px;
  padding: 12px 13px;
  border-radius: 16px;
  border: 1px solid rgba(218, 166, 76, 0.32);
  background:
    linear-gradient(180deg, rgba(34, 26, 18, 0.94), rgba(15, 12, 8, 0.96));
  color: #fff0ca;
  font-size: 14.5px;
  font-weight: 900;
  line-height: 1.35;
  word-break: keep-all;
  text-align: left;
}

.review-type-button.selected {
  border-color: rgba(174, 255, 111, 0.74);
  background:
    radial-gradient(circle at 0% 50%, rgba(174, 255, 111, 0.17), transparent 42%),
    linear-gradient(180deg, rgba(45, 56, 26, 0.92), rgba(18, 25, 12, 0.96));
  box-shadow: 0 0 18px rgba(174, 255, 111, 0.14);
}

.review-input-label {
  display: block;
  margin: 12px 0 8px;
  color: #ffd477;
  font-size: 16px;
  font-weight: 900;
}

.review-input {
  width: 100%;
  min-height: 78px;
  resize: vertical;
  border-radius: 16px;
  border: 1px solid rgba(255, 215, 121, 0.50);
  background: rgba(255, 244, 213, 0.96);
  color: #3b2915;
  padding: 13px 15px;
  font-size: 16px;
  font-weight: 850;
  line-height: 1.5;
  outline: none;
}

.review-status {
  margin-bottom: 16px;
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid rgba(112, 202, 176, 0.42);
  background:
    radial-gradient(circle at 0% 50%, rgba(112, 202, 176, 0.13), transparent 42%),
    rgba(255, 230, 166, 0.045);
}

.review-status-title {
  margin-bottom: 9px;
  color: #d7ffe7;
  font-size: 16px;
  font-weight: 900;
}

.review-status-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.review-status-item {
  padding: 9px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255, 218, 127, 0.24);
  color: rgba(255, 237, 196, 0.78);
  font-size: 13px;
  font-weight: 900;
}

.review-status-item.done {
  border-color: rgba(174, 255, 111, 0.66);
  color: #eaffcf;
  background: rgba(174, 255, 111, 0.12);
}
    /* 공통 카드 */
    .two-column-layout { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 26px; align-items: stretch; }

    .dark-card {
      min-height: 500px;
      padding: 24px;
      border-radius: 28px;
      border: 1px solid rgba(210, 154, 64, 0.44);
      background: radial-gradient(circle at 50% 0%, rgba(221, 160, 58, 0.12), transparent 38%), linear-gradient(180deg, rgba(22, 17, 12, 0.84), rgba(7, 6, 5, 0.88));
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.44), inset 0 1px 0 rgba(255, 226, 164, 0.08);
    }

    .section-label { color: #e3b35d; font-size: 18px; font-weight: 900; margin-bottom: 12px; }

    .story-box {
      min-height: 220px;
      padding: 26px 28px;
      display: flex;
      align-items: center;
      border-radius: 24px;
      border: 1px solid rgba(218, 166, 76, 0.46);
      background: radial-gradient(circle at 50% 15%, rgba(255, 216, 126, 0.08), transparent 34%), linear-gradient(180deg, rgba(9, 8, 6, 0.9), rgba(3, 3, 2, 0.92));
    }

    .story-box p {
      color: #fff0c9;
      font-family: "Noto Serif KR", serif;
      font-size: 27px;
      font-weight: 900;
      line-height: 1.7;
      word-break: keep-all;
      text-shadow: 0 5px 16px rgba(0, 0, 0, 0.66);
    }

    .story-highlight {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(255, 213, 106, 0.32);
      box-shadow: 0 0 0 1px rgba(255, 224, 135, 0.24), 0 0 18px rgba(255, 203, 87, 0.16);
      color: #fff8d5;
    }

   /* =========================================================
   왼쪽 도움 카드 / 생각 흐름 / 오른쪽 질문 선택 디자인
   - 전체 분위기는 문답책 판타지 톤을 유지합니다.
   - 왼쪽 단서 영역과 오른쪽 질문 선택 영역이 헷갈리지 않도록
     색감과 형태를 조금 다르게 나눕니다.
========================================================= */

/* 왼쪽 단서/답/생각 흐름 기본 묶음 */
.support-grid {
  display: grid;
  gap: 10px;
  margin-top: 16px;
  padding: 14px;
  border-radius: 24px;
  border: 1px solid rgba(210, 154, 64, 0.38);
  background:
    radial-gradient(circle at 8% 0%, rgba(255, 211, 104, 0.12), transparent 34%),
    linear-gradient(145deg, rgba(61, 41, 20, 0.48), rgba(13, 10, 7, 0.82));
  box-shadow:
    inset 0 0 0 1px rgba(255, 238, 188, 0.05),
    0 16px 34px rgba(0, 0, 0, 0.22);
}

/* 왼쪽 단서 카드 */
.support-card {
  position: relative;
  padding: 13px 16px;
  border-radius: 16px;
  border: 1px solid rgba(218, 166, 76, 0.28);
  background:
    linear-gradient(90deg, rgba(255, 222, 145, 0.12), rgba(255, 230, 166, 0.045));
  color: #ffe9b7;
  font-size: 16px;
  font-weight: 850;
  line-height: 1.45;
  word-break: keep-all;
}

/* 왼쪽 영역 제목 */
.support-card strong {
  color: #ffd477;
}

/* 첫 번째 카드: 단서 제목 느낌 */
.support-grid > .support-card:first-child {
  width: fit-content;
  padding: 8px 15px;
  border-radius: 999px;
  border-color: rgba(255, 218, 127, 0.48);
  background:
    radial-gradient(circle at 30% 20%, rgba(255, 235, 173, 0.18), transparent 40%),
    rgba(214, 156, 48, 0.18);
  color: #ffd978;
  box-shadow: 0 0 18px rgba(228, 171, 54, 0.14);
}

/* 3번 질문 전용: 생각 흐름 박스
   - 선택지 버튼과 다르게 '흐름 안내판'처럼 보이게 합니다. */
.support-grid.thought-flow {
  gap: 0;
  margin-top: 18px;
  padding: 18px 20px;
  border-radius: 24px;
  border: 1px solid rgba(255, 206, 105, 0.52);
  background:
    radial-gradient(circle at 10% 0%, rgba(255, 214, 111, 0.20), transparent 36%),
    radial-gradient(circle at 90% 100%, rgba(96, 148, 88, 0.13), transparent 36%),
    linear-gradient(145deg, rgba(82, 52, 18, 0.56), rgba(12, 9, 6, 0.92));
  box-shadow:

function isTypeOpen(typeId) {
  // 1번 질문은 처음부터 열려 있습니다.
  if (typeId === "direct") return true;

  // 2번 질문은 1번을 완료하면 열립니다.
  if (typeId === "infer") return progress.direct === true;

  // 3번 질문은 2번을 완료하면 열립니다.
  if (typeId === "opinion") return progress.infer === true;

  // 4번 질문은 3번을 완료하면 열립니다.
  if (typeId === "connect") return progress.opinion === true;

  return false;
}
function canStartReview() {
  // 4번 질문은 앞의 질문들을 끝내야 열리므로,
  // 4번 질문 완료 여부만 보고 총 복습을 열어 줍니다.
  return progress.connect === true;
}

      selectedDeepChoice = null;
      deepInputValue = "";
      deepChecked = false;
      deepResult = null;
      renderMethodScreen();
    }

/* 여기부터 3단계 코드 붙이기 */
function renderReviewMainButton(completedCount) {
  // 4개 질문을 모두 통과하면 같은 버튼이 다음 활동 버튼으로 바뀝니다.
  if (completedCount === 4) {
    return '<button class="main-button" type="button" onclick="finishReviewPractice()">다음 활동으로 가기 →</button>';
  }

  // 현재 쓴 질문이 통과되면, 다음 질문을 만들 수 있게 버튼을 바꿉니다.
  if (reviewChecked && reviewResult && reviewResult.ok) {
    return '<button class="main-button" type="button" onclick="prepareNextReviewQuestion()">다른 질문 만들기 →</button>';
  }

  // 평소에는 루미에게 확인 받기 버튼입니다.
  return '<button class="main-button" type="button" onclick="checkReviewQuestion()">루미에게 확인 받기</button>';
}

function prepareNextReviewQuestion() {
  // 통과한 질문은 질문현황에 남기고,
  // 입력창만 비워서 다음 질문을 만들 수 있게 합니다.
  reviewSelectedType = null;
  reviewQuestionInput = "";
  reviewAnswerInput = "";
  reviewChecked = false;
  reviewResult = null;

  renderReviewScreen();
}
function finishReviewPractice() {
  // 총 복습 완료 기록을 저장합니다.
  // practice.html에서 이 값을 보고 '우리반 책읽기'를 열어 줄 예정입니다.
  sessionStorage.setItem("duringReadingReviewDone_" + studentId, "true");

  // 읽기 중 질문 연습 전체 완료 기록도 함께 저장합니다.
  sessionStorage.setItem("duringReadingPracticeDone_" + studentId, "true");

  // 연습하기 화면으로 돌아갑니다.
  window.location.href = "./practice.html";
}

  const selectedClass = reviewSelectedType === type ? ' selected' : '';

  return '' +
    '<button class="review-type-button' + selectedClass + '" type="button" onclick="selectReviewType(\'' + type + '\')">' +
      label +
    '</button>';
}

    '<label class="review-input-label">' + getReviewAnswerLabel() + '</label>' +

}

  return reviewResult && reviewResult.ok ? "good" : "need";
}

function getReviewFeedbackText() {
  // 아직 루미에게 검사받기 전 안내 문구입니다.
  if (!reviewChecked) {
    if (!reviewSelectedType) {
      return "먼저 만들고 싶은 질문 종류를 골라 봐. 글을 다시 살펴보면서 어떤 질문을 만들지 떠올려 보자.";
    }

    if (!reviewQuestionInput.trim()) {
      return "좋아. 이제 글 내용을 바탕으로 네가 고른 종류의 질문을 직접 써 보자.";
    }

    if (!reviewAnswerInput.trim()) {
      return "질문을 썼다면 답도 함께 써 보자. 글에서 찾은 답인지, 짐작한 답인지, 내 생각이나 경험인지 잘 맞춰야 해.";
    }

    return "좋아. 루미가 질문이 글과 관련 있는지, 질문 종류에 맞는지, 질문 문장으로 잘 썼는지 확인해 볼게.";
  }

  // 검사 결과가 있으면 루미의 구체적인 피드백을 보여 줍니다.
  if (reviewResult) {
    return reviewResult.message;
  }

  return "질문을 다시 확인해 보자.";
}
function normalizeKoreanText(text) {
  // 비교할 때 띄어쓰기, 줄바꿈, 물음표 차이 때문에 틀리지 않도록 정리합니다.
  return String(text || "")
    .replace(/\s/g, "")
    .replace(/[?？!！.,，。'‘’"“”]/g, "")
    .toLowerCase();
}

function isQuestionForm(question) {
  const text = String(question || "").trim();

  // 물음표가 있으면 질문으로 인정합니다.
  if (text.includes("?") || text.includes("？")) {
    return true;
  }

  // 초등학생 질문 문장에서 자주 쓰는 끝말입니다.
  const questionEndings = [
    "나요",
    "나요?",
    "까요",
    "까요?",
    "했나요",
    "했나요?",
    "일까요",
    "일까요?",
    "있나요",
    "있나요?",
    "없나요",
    "없나요?",
    "무엇인가요",
    "누구인가요",
    "어디인가요",
    "왜그랬을까요",
    "어떤마음이었을까요"
  ];

  const normalized = normalizeKoreanText(text);

  return questionEndings.some(function(ending) {
    return normalized.endsWith(normalizeKoreanText(ending));
  });
}
function checkReviewQuestion() {
  try {
    const question = reviewQuestionInput.trim();
    const answer = reviewAnswerInput.trim();

    // 1. 질문 종류 선택 확인
    if (!reviewSelectedType) {
      reviewChecked = true;
      reviewResult = {
        ok: false,
        message: "먼저 질문 종류를 골라야 해. 바로 찾기, 짐작하기, 생각/느낌, 삶과 연결 중 하나를 선택해 줘."
      };
      renderReviewScreen();
      return;
    }

    // 2. 질문 입력 확인
    if (!question) {
      reviewChecked = true;
      reviewResult = {
        ok: false,
        message: "질문 칸이 비어 있어. 글을 읽고 네가 만들고 싶은 질문을 먼저 써 줘."
      };
      renderReviewScreen();
      return;
    }

    // 3. 답 입력 확인
    if (!answer) {
      reviewChecked = true;
      reviewResult = {
        ok: false,
        message: "답 칸이 비어 있어. 질문에 대한 답, 생각, 느낌, 경험을 함께 써야 해."
      };
      renderReviewScreen();
      return;
    }

    // 4. 질문 길이 확인
    if (question.length < 8) {
      reviewChecked = true;
      reviewResult = {
        ok: false,
        message: "질문이 너무 짧아. 글의 내용이 드러나도록 조금 더 자세히 써 보자."
      };
      renderReviewScreen();
      return;
    }

    // 5. 질문 문장 형식 확인
    if (!isQuestionForm(question)) {
      reviewChecked = true;
      reviewResult = {
        ok: false,
        message: "이 문장은 질문처럼 보이지 않아. 끝을 ‘나요?’, ‘까요?’, ‘했나요?’처럼 물어보는 문장으로 바꿔 보자."
      };
      renderReviewScreen();
      return;
    }

    // 6. 글 전체와 관련 있는지 확인
    if (!isReviewQuestionRelatedToStory(question, answer)) {
      reviewChecked = true;
      reviewResult = {
        ok: false,
        message: "글과 관련이 약해 보여. 질문이나 답에 ‘서윤이, 민준이, 책갈피, 분실물 상자, 소중한 물건’처럼 글에 나온 중요한 내용을 넣어 다시 써 보자."
      };
      renderReviewScreen();
      return;
    }

    // 7. 질문 종류별 검사
    const typeResult = checkReviewQuestionType(reviewSelectedType, question, answer);

    reviewChecked = true;
    reviewResult = typeResult;

    // 8. 통과하면 질문현황에 저장
    if (typeResult.ok) {
      reviewCompletedQuestions[reviewSelectedType] = {
        question: question,
        answer: answer
      };
    }

    renderReviewScreen();
  } catch (error) {
    // 검사 중 코드 오류가 나도 화면이 멈추지 않게 하고,
    // 루미 말풍선에 실제 오류 내용을 보여 줍니다.
    reviewChecked = true;
    reviewResult = {
      ok: false,
      message: "검사 중 코드 오류가 났어: " + error.message
    };

    renderReviewScreen();
  }
}

function isReviewQuestionRelated(question, answer, selectedText) {
  const normalizedQuestion = normalizeKoreanText(question);
  const normalizedAnswer = normalizeKoreanText(answer);
  const normalizedSelected = normalizeKoreanText(selectedText);

  const keywords = [
    "서윤", "민준", "책갈피", "도서관", "책장", "분실물", "상자",
    "할머니", "소중", "걱정", "고마워", "작은물건"
  ];

  return keywords.some(function(word) {
    const normalizedWord = normalizeKoreanText(word);
    return normalizedSelected.includes(normalizedWord) &&
      (normalizedQuestion.includes(normalizedWord) || normalizedAnswer.includes(normalizedWord));
  });
}

/* 여기 아래에 4단계 코드 붙이기 */
function isReviewQuestionRelatedToStory(question, answer) {
  const q = normalizeKoreanText(question);
  const a = normalizeKoreanText(answer);
  const combined = q + " " + a;

  // 이 글의 핵심 낱말입니다.
  // 질문이나 답에 최소 1개 이상은 들어가야 글과 관련 있다고 봅니다.
  const storyKeywords = [
    "서윤",
    "민준",
    "책갈피",
    "도서관",
    "책장",
    "분실물",
    "상자",
    "할머니",
    "소중",
    "걱정",
    "고마워",
    "작은물건",
    "잃어버",
    "찾았",
    "발견",
    "이름"
  ];

  return storyKeywords.some(function(word) {
    return combined.includes(normalizeKoreanText(word));
  });
}

function checkReviewQuestionType(type, question, answer) {
  const q = normalizeKoreanText(question);
  const a = normalizeKoreanText(answer);

  if (type === "direct") {
    return checkReviewDirect(q, a);
  }

  if (type === "infer") {
    return checkReviewInfer(q, a);
  }

  if (type === "opinion") {
    return checkReviewOpinion(q, a);
  }

  if (type === "connect") {
    return checkReviewConnect(q, a);
  }

  return {
    ok: false,
    message: "질문 종류를 다시 골라 보자."
  };
}
function checkReviewDirect(q, a) {
  const directWords = ["무엇", "누구", "어디", "언제", "어떤이름", "이름", "무슨"];
  const inferWords = ["왜", "어떤마음", "무슨생각", "짐작", "이유"];
  const opinionWords = ["내생각", "어떻게생각", "느낌", "좋았", "싫었", "나라면"];
  const connectWords = ["나도", "내가", "경험", "비슷한일", "겪은적"];

  if (inferWords.some(function(word) { return q.includes(word); })) {
    return {
      ok: false,
      message: "이 질문은 글에서 바로 찾는 질문이 아니라 이유나 마음을 짐작하는 질문에 가까워. 바로 찾기 질문은 ‘어디에서 발견했나요?’, ‘누구의 이름이 적혀 있었나요?’처럼 글에 답이 그대로 나와야 해."
    };
  }

  if (opinionWords.some(function(word) { return q.includes(word); })) {
    return {
      ok: false,
      message: "이 질문은 네 생각이나 느낌을 묻고 있어. 바로 찾기 질문은 사람마다 답이 달라지면 안 되고, 글 속 문장에서 바로 확인할 수 있어야 해."
    };
  }

  if (connectWords.some(function(word) { return q.includes(word); })) {
    return {
      ok: false,
      message: "이 질문은 네 경험과 연결하는 질문에 가까워. 바로 찾기 질문은 글 밖의 경험이 아니라 글 안에 있는 사실을 물어야 해."
    };
  }

  if (!directWords.some(function(word) { return q.includes(word); })) {
    return {
      ok: false,
      message: "바로 찾기 질문이라면 ‘무엇, 누구, 어디, 언제, 이름’처럼 글에서 바로 확인할 수 있는 말을 넣어 보자."
    };
  }

  const answerKeywords = ["책갈피", "책장", "도서관", "민준", "분실물", "상자", "할머니", "서윤"];
  if (!answerKeywords.some(function(word) { return a.includes(normalizeKoreanText(word)); })) {
    return {
      ok: false,
      message: "답이 글에서 바로 찾은 내용인지 잘 안 보여. 답에는 ‘책갈피’, ‘책장 아래’, ‘민준’, ‘분실물 상자’처럼 글에 나온 말을 넣어 줘."
    };
  }

  return {
    ok: true,
    message: "좋아! 글 속 문장에서 바로 답을 찾을 수 있는 질문이야. 답도 글에 나온 내용과 잘 연결되어 있어."
  };
}

function checkReviewInfer(q, a) {
  const inferWords = ["왜", "어떤마음", "무슨생각", "이유", "어째서", "마음"];
  const directWords = ["무엇", "누구", "어디", "언제", "몇"];

    };
  }

  if (opinionWords.some(function(word) { return q.includes(word); })) {
    return {

  }

    };
  }

  if (!inferWords.some(function(word) { return q.includes(word); })) {
    return {
      ok: false,
      message: "짐작하기 질문이라면 ‘왜’, ‘어떤 마음’, ‘무슨 생각’, ‘이유’ 같은 말이 들어가면 좋아. 글에 바로 적힌 사실만 묻지 말고 인물의 마음이나 행동의 까닭을 물어 봐."
    };
  }

  const clueWords = ["주머니", "분실물", "상자", "조심", "걱정", "소중", "할머니", "고마워"];
  if (!clueWords.some(function(word) { return q.includes(normalizeKoreanText(word)) || a.includes(normalizeKoreanText(word)); })) {

  }

  if (a.length < 8) {
    return {
      ok: false,
      message: "짐작한 답이 너무 짧아. 왜 그렇게 생각했는지 글 속 단서와 함께 조금 더 써 보자."
    };
  }

  return {
    ok: true,
    message: "좋아! 글에 그대로 답이 적힌 질문이 아니라, 행동과 말을 단서로 이유나 마음을 짐작하는 질문이야."
  };
}

function checkReviewOpinion(q, a) {

}

function checkReviewConnect(q, a) {
  const connectWords = ["나도", "내가", "경험", "비슷한일", "겪은적", "해본적", "내생활", "우리반", "친구와", "가족과"];
  const directWords = ["무엇", "누구", "어디", "언제", "몇"];
  const inferWords = ["왜", "어떤마음", "무슨생각"];
  const opinionOnlyWords = ["어떻게생각", "느낌", "생각이들"];

  if (directWords.some(function(word) { return q.includes(word); })) {
    return {
      ok: false,
      message: "이 질문은 글에서 바로 찾는 질문에 가까워. 삶과 연결하는 질문은 글 속 장면에서 출발해 내 경험이나 생활로 이어져야 해."
    };
  }

  if (inferWords.some(function(word) { return q.includes(word); })) {
    return {
      ok: false,
      message: "이 질문은 인물의 마음이나 이유를 짐작하는 질문에 가까워. 삶과 연결하는 질문은 ‘나도 비슷한 경험이 있는지’를 묻는 쪽이어야 해."
    };
  }

  if (opinionOnlyWords.some(function(word) { return q.includes(word); }) &&
      !connectWords.some(function(word) { return q.includes(word); })) {
    return {
      ok: false,
      message: "이 질문은 생각이나 느낌만 묻고 있어. 삶과 연결하려면 ‘나도’, ‘내가’, ‘경험’, ‘비슷한 일’처럼 내 생활로 이어지는 말이 들어가야 해."
    };
  }

  if (!connectWords.some(function(word) { return q.includes(word); })) {
    return {
      ok: false,
      message: "삶과 연결하는 질문이라면 ‘나도’, ‘내가’, ‘경험’, ‘비슷한 일’ 같은 말이 필요해. 글 속 책갈피 장면과 네 생활을 이어서 물어 봐."
    };
  }

  const storyBridgeWords = ["책갈피", "소중", "잃어버", "찾아", "도움", "분실물", "고마워"];
  if (!storyBridgeWords.some(function(word) { return q.includes(normalizeKoreanText(word)) || a.includes(normalizeKoreanText(word)); })) {
    return {
      ok: false,
      message: "내 경험을 묻고 있지만 글 속 장면과의 연결이 약해 보여. ‘소중한 물건’, ‘잃어버린 물건’, ‘찾아 준 경험’처럼 글의 장면과 이어지는 말을 넣어 봐."
    };
  }

  if (a.length < 8) {
    return {
      ok: false,
      message: "내 경험 답이 너무 짧아. 언제, 누구와, 어떤 일이 있었는지 조금 더 구체적으로 써 보자."
    };
  }

  return {
    ok: true,
    message: "좋아! 글 속 장면에서 출발해서 네 경험이나 생활로 자연스럽게 이어지는 질문이야."
  };
}

      }

      if (!deepChecked) {
        if (selectedQuestionType === "opinion") return "‘나는’, ‘나라면’, ‘어떻게 생각’, ‘어떤 느낌’, ‘마음에 남는’ 같은 말로 내 생각과 느낌이 드러나게 써 보자.";
        if (selectedQuestionType === "infer") return "글 속 단서와 반대되는 행동을 넣으면 안 돼. 인물, 물건, 행동 단서를 정확히 활용해 보자.";
        return "답이 글에 바로 나오는 질문인지 확인해 보자.";
      }

      return deepResult.message;
    }

   function goNextDeepQuestion() {
  const questions = getCurrentDeepQuestions();

  if (currentDeepIndex < questions.length - 1) {
    currentDeepIndex += 1;
    selectedDeepChoice = null;
    deepInputValue = "";
    deepChecked = false;
    deepResult = null;
    renderDeepPracticeScreen();
    return;
  }

  // 현재 질문 종류 연습 완료 처리
  progress[selectedQuestionType] = true;
  sessionStorage.setItem(progressKey, JSON.stringify(progress));

  // 4번 질문까지 끝났으면 바로 질문 종류 선택 화면으로 돌아갑니다.
  // 그러면 총 복습 버튼이 활성화됩니다.
  goSelectScreen();
}

    /*
      =========================================================
      10. 직접 쓰기 채점 함수
      =========================================================
    */

    function normalizeText(text) {
      return (text || "").replace(/\s+/g, "").toLowerCase();
    }

    function hasAny(text, words) {
      return words.some(function(word) { return text.indexOf(word) !== -1; });
    }

    function checkDirectQuestion(input) {
      const text = normalizeText(input);
      if (text.length < 7) return { ok: false, message: "질문이 너무 짧아. 글에서 바로 답을 찾을 수 있게 조금 더 구체적으로 써 보자." };
      if (!text.includes("?") && !text.includes("나요") && !text.includes("까")) return { ok: false, message: "질문 형태로 써야 해. 끝에 ‘~나요?’, ‘~했나요?’처럼 물어보는 말이 필요해." };
      if (hasAny(text, ["왜", "무슨생각", "어떤마음", "나라면", "내생각", "느낌"])) return { ok: false, message: "이건 책 내용에서 바로 답을 찾을 수 있는 질문이 아니야. 이유, 마음, 내 생각을 묻지 말고 글에 나온 답을 바로 물어보자." };
      if (hasAny(text, ["소민", "노란화분", "화분", "물"]) && hasAny(text, ["무엇", "무슨", "어디"])) {
        return { ok: true, message: "좋아! 글에 바로 나오는 답과 연결된 질문이야." };
      }
      return { ok: false, message: "답과 연결이 약해. ‘소민이’, ‘노란 화분’, ‘물’처럼 글에 나온 단어를 활용해 질문을 만들어 보자." };
    }

    function checkInferQuestion(input) {
      const text = normalizeText(input);
      if (text.length < 8) return { ok: false, message: "질문이 너무 짧아. 글 속 단서와 연결되게 더 구체적으로 써 보자." };
      if (!text.includes("?") && !text.includes("나요") && !text.includes("까")) return { ok: false, message: "질문 형태로 써야 해. ‘~했을까요?’처럼 물어보는 말로 써 보자." };
      if (hasAny(text, ["살았", "인생", "평소", "미래", "어른", "나중"])) return { ok: false, message: "질문이 글 속 장면보다 너무 넓어. 준서가 색연필을 어떻게 했는지에 집중해 보자." };
      if (hasAny(text, ["내려놓", "버렸", "가져갔", "숨겼", "훔쳤"])) return { ok: false, message: "글에서는 내려놓거나 가져간 것이 아니라 선생님 책상 위에 올려 두었어. 글과 반대되는 행동은 오답이야." };
      if (hasAny(text, ["집", "운동장", "가방", "친구에게줬", "엄마"])) return { ok: false, message: "글에 없는 장소나 인물이 들어갔어. 준서, 색연필, 선생님 책상 위, 올려 두다 같은 단서를 활용해 보자." };
      const hasScene = hasAny(text, ["준서", "색연필", "선생님책상", "책상위", "올려두", "주인", "찾아주"]);
      const hasInfer = hasAny(text, ["왜", "무슨생각", "어떤마음", "마음으로", "생각했"]);
      if (hasScene && hasInfer) return { ok: true, message: "좋아! 글 속 단서와 연결해서 이유, 마음, 생각을 짐작하게 하는 질문이야." };
      return { ok: false, message: "질문이 글 속 단서와 충분히 연결되지 않아. 준서, 색연필, 선생님 책상 위, 올려 두다, 주인 같은 단서를 활용해 보자." };
    }

   function checkOpinionQuestion(input) {
  const text = normalizeText(input);

  if (!text) {
    return {
      ok: false,
      message: "질문을 먼저 써 봐. 읽은 뒤 네 생각이나 느낌으로 이어지는 질문이어야 해."
    };
  }

  // 1. 너무 짧은 질문은 통과시키지 않습니다.
  if (text.length < 10) {
    return {
      ok: false,
      message: "질문이 너무 짧아. 어떤 장면을 읽고 어떤 생각이나 느낌을 말하려는지 더 자세히 써 보자."
    };
  }

  // 2. 질문 형태인지 확인합니다.
  if (!text.includes("?") && !text.includes("나요") && !text.includes("까요")) {
    return {
      ok: false,
      message: "질문 형태로 써야 해. 끝에 ‘~나요?’, ‘~까요?’처럼 물어보는 말이 필요해."
    };
  }

  // 3. 예전 이야기 단어가 들어가면 오답 처리합니다.
  // 현재 심화 3번은 하윤이 발표 장면이므로 책갈피/색연필/강아지 같은 이전 이야기 단어는 맞지 않습니다.
  const oldStoryWords = ["책갈피", "색연필", "강아지", "서아", "준서", "민재"];
  if (oldStoryWords.some(function(word) { return text.includes(word); })) {
    return {
      ok: false,
      message: "지금 글은 하윤이가 발표 중 어려워하는 친구를 도와준 장면이야. 현재 글 속 인물과 장면에 맞게 질문을 다시 써 보자."
    };
  }

  // 4. 책 내용에서 바로 답을 찾는 질문은 오답입니다.
  const directPatterns = ["무엇을", "누구에게", "어디에서", "언제", "몇시", "몇", "무슨물건"];
  if (directPatterns.some(function(word) { return text.includes(word); })) {
    return {
      ok: false,
      message: "이건 글에서 바로 답을 찾는 질문에 가까워. 책을 읽고 떠오른 네 생각이나 느낌을 말하게 하는 질문으로 바꿔 보자."
    };
  }

  // 5. 인물의 이유나 마음을 맞히는 질문은 2번 질문에 가깝습니다.
  const inferPatterns = ["왜", "어떤마음으로", "무슨생각으로", "왜그랬", "하윤이는왜", "친구는왜"];
  if (inferPatterns.some(function(word) { return text.includes(word); })) {
    return {
      ok: false,
      message: "이건 인물의 이유나 마음을 짐작하는 질문에 가까워. 이번에는 하윤이의 행동을 읽고 내가 어떤 생각이나 느낌이 드는지 묻는 질문이 좋아."
    };
  }

  // 6. 현재 글 속 장면과 연결되어야 합니다.
  const sceneWords = ["하윤", "발표", "친구", "손짓", "도와", "도움", "순서", "웃"];
  const hasSceneWord = sceneWords.some(function(word) { return text.includes(word); });

  if (!hasSceneWord) {
    return {
      ok: false,
      message: "질문이 글 속 장면과 연결되어야 해. 하윤이, 발표, 친구, 손짓, 도와줌 같은 단서를 활용해 보자."
    };
  }

  // 7. 읽은 사람의 생각이나 느낌을 말하게 해야 합니다.
  const opinionWords = ["나는", "나라면", "내가", "어떻게생각", "어떤느낌", "느낌", "생각", "마음에남", "비슷한경험"];
  const hasOpinionWord = opinionWords.some(function(word) { return text.includes(word); });

  if (!hasOpinionWord) {
    return {
      ok: false,
      message: "글 속 장면은 들어갔지만, 읽은 사람의 생각이나 느낌을 말하게 하는 말이 부족해. ‘나는’, ‘나라면’, ‘어떻게 생각’, ‘어떤 느낌’ 같은 말을 넣어 보자."
    };
  }

  return {
    ok: true,
    message: "좋아! 하윤이가 친구를 도와준 장면에서 출발해서, 읽은 사람이 자기 생각이나 느낌을 말하게 하는 질문이야."
  };
}
function checkConnectQuestion(input) {
  const text = normalizeText(input);

  if (!text) {
    return {
      ok: false,
      message: "질문을 먼저 써 봐. 책 속 장면과 내 경험이 함께 드러나야 해."
    };
  }

  if (text.length < 10) {
    return {
      ok: false,
      message: "질문이 너무 짧아. 책 속 어떤 장면과 내 경험을 연결하는지 더 자세히 써 보자."
    };
  }

  if (!text.includes("?") && !text.includes("나요") && !text.includes("까요")) {
    return {
      ok: false,
      message: "질문 형태로 써야 해. 끝에 ‘~나요?’, ‘~까요?’처럼 물어보는 말이 필요해."
    };
  }

  // 책 속 장면 단서가 있어야 합니다.
  const sceneWords = ["유진", "혼자", "친구", "다가", "함께", "놀자", "놀이", "먼저"];
  const hasSceneWord = sceneWords.some(function(word) {
    return text.includes(word);
  });

  if (!hasSceneWord) {
    return {
      ok: false,
      message: "책 속 장면과 연결되어야 해. 유진이, 혼자 있는 친구, 먼저 다가감, 함께 놀자 같은 단서를 활용해 보자."
    };
  }

  // 내 삶/경험 연결 표현이 있어야 합니다.
  const lifeWords = ["나도", "내가", "내경험", "경험", "겪은적", "해본적", "비슷한일", "내생활", "우리반", "친구와", "가족과"];
  const hasLifeWord = lifeWords.some(function(word) {
    return text.includes(word);
  });

  if (!hasLifeWord) {
    return {
      ok: false,
      message: "책 속 장면은 들어갔지만 내 경험과 연결하는 말이 부족해. ‘나도’, ‘내가’, ‘경험’, ‘비슷한 일’ 같은 말을 넣어 보자."
    };
  }

  // 바로 답 찾기 질문은 제외합니다.
  const directPatterns = ["무엇을", "누구에게", "어디에서", "언제", "몇시", "몇"];
  if (directPatterns.some(function(word) { return text.includes(word); })) {
    return {
      ok: false,
      message: "이건 글에서 바로 답을 찾는 질문에 가까워. 책 속 장면을 내 경험과 연결하는 질문으로 바꿔 보자."
    };
  }

  // 짐작 질문은 제외합니다.
  const inferPatterns = ["왜", "어떤마음", "무슨생각", "왜그랬"];
  if (inferPatterns.some(function(word) { return text.includes(word); })) {
    return {
      ok: false,
      message: "이건 인물의 이유나 마음을 짐작하는 질문에 가까워. 이번에는 책 속 장면과 내 경험을 이어 보자."
    };
  }

  // 생각/느낌만 있고 경험 연결이 약한 질문을 걸러냅니다.
  const onlyOpinionPatterns = ["어떤생각", "어떤느낌", "느낌이들", "생각이들"];
  const hasOnlyOpinion = onlyOpinionPatterns.some(function(word) {
    return text.includes(word);
  });

  if (hasOnlyOpinion && !text.includes("경험") && !text.includes("나도") && !text.includes("내가")) {
    return {
      ok: false,
      message: "생각이나 느낌을 묻는 것에서 멈추지 말고, 내 경험이나 생활과 연결되게 질문해 보자."
    };
  }

  return {
    ok: true,
    message: "좋아! 책 속 장면에서 출발해서 내 경험이나 생활로 이어지는 질문이야."
  };
}

    function makeHighlightedStory(story, highlight) {
      if (!highlight) return story;
      return story.replace(highlight, '<span class="story-highlight">' + highlight + '</span>');
    }

    function escapeHtml(text) {
      return (text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

  // 원래 시작 화면
