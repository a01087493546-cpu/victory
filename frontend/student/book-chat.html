<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문답책 - 책수다방</title>

  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap");

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #3f2615;
      background:
        linear-gradient(180deg, rgba(255,246,222,.42), rgba(255,232,184,.46)),
        url("../assets/images/practice/book-chat-bg.png") center / cover no-repeat;
    }

    button, textarea, select { font-family: inherit; }
    button { cursor: pointer; }

    .page {
      width: 100%;
      height: 100vh;
      padding: 14px 26px 18px;
      overflow: hidden;
    }

    .shell {
      width: min(1760px, calc(100vw - 80px));
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto auto minmax(0,1fr);
      gap: 12px;
      overflow: hidden;
    }

    .top {
      display: grid;
      grid-template-columns: 220px 1fr 245px;
      align-items: center;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 26px;
      font-weight: 900;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(180deg,#bf8740,#6d3a0d);
      color: #fff5d6;
      border: 1px solid rgba(255,224,158,.78);
      box-shadow: 0 8px 16px rgba(91,47,10,.18);
      font-size: 22px;
    }

    .main-title {
      text-align: center;
      font-family: "Noto Serif KR", serif;
      color: #4b2a13;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -1.5px;
      text-shadow: 0 2px 0 rgba(255,255,255,.72), 0 8px 18px rgba(122,72,25,.12);
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    .nav-button {
      height: 43px;
      padding: 0 16px;
      border-radius: 15px;
      border: 1px solid rgba(177,122,57,.34);
      background: rgba(255,250,238,.82);
      color: #4f2e16;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 7px 14px rgba(116,71,20,.10);
    }

    .nav-button.primary {
      background: linear-gradient(180deg,#e4ad45,#b06d0d);
      color: #fff9ec;
    }

    .activity-card,
    .filter-card,
    .board-card,
    .modal-panel {
      border-radius: 24px;
      border: 1px solid rgba(193,133,61,.34);
      background: linear-gradient(180deg,rgba(255,254,249,.94),rgba(255,247,231,.92));
      box-shadow: 0 14px 28px rgba(123,75,25,.15), inset 0 1px 0 rgba(255,255,255,.72);
    }

    .activity-card {
      min-height: 118px;
      padding: 16px 26px;
      display: grid;
      grid-template-columns: 340px minmax(0,1fr);
      gap: 26px;
      align-items: center;
    }

    .activity-title {
      font-family: "Noto Serif KR", serif;
      font-size: 40px;
      font-weight: 900;
      white-space: nowrap;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 16px;
    }

    .stat-box {
      min-height: 78px;
      padding: 14px 20px;
      border-radius: 18px;
      border: 1px solid rgba(192,130,55,.28);
      background: rgba(255,255,255,.58);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-label { color:#8b6a46; font-size:20px; font-weight:900; }
    .stat-value { margin-top:6px; color:#4a2a10; font-size:42px; font-weight:900; line-height:1; }

    .filter-card { padding: 10px 16px; }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr 220px;
      gap: 12px;
      align-items: center;
    }

    .filter-button,
    .sort-select {
      height: 48px;
      border-radius: 16px;
      border: 1px solid rgba(192,130,55,.34);
      background: rgba(255,252,245,.84);
      color: #5a3820;
      font-size: 21px;
      font-weight: 900;
    }

    .filter-button.active {
      border-color: rgba(190,125,32,.82);
      background: linear-gradient(180deg,#f3c978,#c9902d);
      color:#4a2a10;
      box-shadow: 0 7px 13px rgba(176,112,25,.16);
    }

    .sort-select { padding: 0 16px; text-align:center; text-align-last:center; outline:none; }

    .board-card {
      height: 100%;
      min-height: 0;
      padding: 20px 26px;
      display: grid;
      grid-template-rows: auto minmax(0,1fr);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      font-family: "Noto Serif KR", serif;
      color:#4b2a13;
      font-size:40px;
      font-weight:900;
      letter-spacing:-1px;
    }

    .count-pill {
      padding: 10px 16px;
      border-radius: 999px;
      border:1px solid rgba(190,130,55,.26);
      background:rgba(255,249,235,.88);
      color:#8c5c1e;
      font-size:18px;
      font-weight:900;
    }

    .question-list {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      align-content: start;
      gap: 12px;
      padding: 2px 10px 14px 2px;
      scrollbar-gutter: stable;
    }

    .question-list::-webkit-scrollbar,
    .modal-body::-webkit-scrollbar { width:12px; }
    .question-list::-webkit-scrollbar-track,
    .modal-body::-webkit-scrollbar-track { border-radius:999px; background:rgba(116,77,38,.10); }
    .question-list::-webkit-scrollbar-thumb,
    .modal-body::-webkit-scrollbar-thumb { border:3px solid transparent; border-radius:999px; background:rgba(142,91,36,.50); background-clip:padding-box; }

    .question-card {
      width:100%;
      min-height:138px;
      padding:18px 22px;
      border:1px solid rgba(186,130,58,.26);
      border-radius:24px;
      background:rgba(255,255,255,.68);
      color:#4d321a;
      text-align:left;
      transition:.15s ease;
    }

    .question-card:hover { transform:translateY(-1px); box-shadow:0 8px 14px rgba(123,75,25,.10); }

    .question-top {
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .student-name { color:#4b2a13; font-size:24px; font-weight:900; }

    .type-badge,
    .talk-badge {
      display:inline-block;
      padding:6px 11px;
      border-radius:999px;
      font-size:15px;
      font-weight:900;
    }

    .type-badge { background:rgba(222,168,79,.18); color:#8b5a1d; }
    .talk-badge { background:rgba(88,139,62,.14); color:#47722c; }

    .card-actions {
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .thought-write-button {
      min-height:38px;
      padding:8px 14px;
      border:1px solid rgba(68,124,42,.38);
      border-radius:14px;
      background:linear-gradient(180deg,#3f842e,#245716);
      color:#fff8dd;
      font-size:15px;
      font-weight:900;
      box-shadow:0 4px 0 rgba(36,87,22,.34);
    }

    .time-text { color:#9c7141; font-size:16px; font-weight:800; white-space:nowrap; }

    .question-main-click {
      width:100%;
      padding:0;
      border:0;
      background:transparent;
      color:inherit;
      text-align:left;
    }

    .question-text { font-size:25px; font-weight:900; line-height:1.45; word-break:keep-all; }

    .question-answer-preview {
      margin-top:12px;
      color:#6f4e2f;
      font-size:18px;
      font-weight:800;
      line-height:1.5;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;
      overflow:hidden;
    }

    .question-answer-preview strong { color:#4f7130; }

    .empty-list {
      min-height:220px;
      display:grid;
      place-items:center;
      border-radius:18px;
      border:1px dashed rgba(177,122,57,.30);
      background:rgba(255,255,255,.50);
      color:#92745a;
      font-size:18px;
      font-weight:850;
      text-align:center;
    }

    .modal.hidden { display:none !important; }

    .modal {
      position:fixed;
      inset:0;
      z-index:20000;
      display:grid;
      place-items:center;
      padding:28px;
      background:rgba(43,29,18,.58);
      backdrop-filter:blur(5px);
    }

    .modal-panel {
      width:min(1320px,calc(100vw - 80px));
      height:min(940px,calc(100vh - 70px));
      max-height:calc(100vh - 70px);
      padding:22px 25px 25px;
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
      gap:14px;
      overflow:hidden;
      background:rgba(255,251,242,.99);
      box-shadow:0 28px 70px rgba(47,28,10,.38);
    }

    .modal-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding-bottom:13px;
      border-bottom:1px solid rgba(186,130,58,.22);
    }

    .modal-title {
      font-family:"Noto Serif KR",serif;
      color:#4b2a13;
      font-size:34px;
      font-weight:900;
    }

    .modal-close-button {
      width:44px;
      height:44px;
      border:1px solid rgba(175,119,53,.34);
      border-radius:14px;
      background:rgba(255,252,245,.94);
      color:#654220;
      font-size:28px;
      font-weight:900;
      line-height:1;
    }

    .modal-body {
      min-height:0;
      height:100%;
      overflow-y:auto;
      overflow-x:hidden;
      overscroll-behavior:contain;
      padding:2px 14px 30px 2px;
      scrollbar-gutter:stable;
    }

    .selected-question-box,
    .comment-card,
    .write-box {
      border-radius:18px;
      border:1px solid rgba(186,130,58,.28);
      background:rgba(255,255,255,.66);
    }

    .selected-question-box { width:100%; padding:20px 22px; margin-bottom:14px; }
    .selected-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .selected-name { font-size:18px; font-weight:900; }
    .selected-question { font-size:25px; font-weight:900; line-height:1.45; }
    .selected-answer { margin-top:12px; padding:14px 16px; border-radius:16px; background:rgba(243,255,236,.70); border:1px solid rgba(83,133,60,.20); font-size:17px; font-weight:820; line-height:1.5; }

    .form-grid { display:grid; gap:14px; }
    .field { display:grid; gap:7px; }
    .field-label { font-size:20px; font-weight:900; }
    .text-area { width:100%; min-height:105px; padding:14px 16px; resize:vertical; outline:none; border-radius:15px; border:1px solid rgba(196,138,69,.34); background:rgba(255,255,255,.78); color:#452713; font-size:18px; font-weight:760; line-height:1.5; }
    .text-area:focus { border-color:rgba(203,139,44,.72); box-shadow:0 0 0 3px rgba(216,162,68,.13); }

    .button-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }

    .plain-button,
    .main-button {
      height:50px;
      border-radius:16px;
      font-size:17px;
      font-weight:900;
    }

    .plain-button { border:1px solid rgba(175,119,53,.34); background:rgba(255,252,245,.78); color:#654220; }
    .main-button { border:1px solid rgba(176,111,25,.40); background:linear-gradient(180deg,#e4ad45,#b06d0d); color:#fff9ec; box-shadow:0 7px 0 rgba(105,57,5,.68); }

    .comment-list { display:grid; gap:14px; }
    .comment-card { width:100%; padding:19px 22px; }
    .comment-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .comment-name { font-size:18px; font-weight:900; }
    .comment-time { margin-left:auto; color:#9c7141; font-size:14px; font-weight:800; }
    .thought-lines { display:grid; gap:8px; color:#4f3219; font-size:17px; font-weight:820; line-height:1.5; }
    .thought-lines strong { color:#4f7130; }

    .reply-button-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:13px; }

    .reply-type-button {
      min-height:40px;
      padding:8px 13px;
      border-radius:14px;
      font-size:15px;
      font-weight:900;
      color:#fff8dd;
    }
    .reply-type-button.green { border:1px solid rgba(68,124,42,.38); background:linear-gradient(180deg,#3f842e,#245716); }
    .reply-type-button.brown { border:1px solid rgba(120,73,24,.38); background:linear-gradient(180deg,#965d25,#562b0c); }
    .reply-type-button.gold { border:1px solid rgba(176,111,25,.40); background:linear-gradient(180deg,#e4ad45,#b06d0d); }

    .write-box { margin-top:12px; padding:14px; background:rgba(255,250,238,.76); }
    .write-title { margin-bottom:10px; font-size:18px; font-weight:900; }

    .nested-list { display:grid; gap:8px; margin-top:12px; padding-left:12px; border-left:3px solid rgba(205,151,67,.34); }
    .nested-item { padding:11px 12px; border-radius:14px; border:1px solid rgba(186,130,58,.18); background:rgba(255,255,255,.64); font-size:15px; font-weight:800; line-height:1.45; }
    .nested-item strong { color:#8b5a1d; }

    .teacher-return-button {
      position:fixed;
      left:24px;
      bottom:24px;
      z-index:9999;
      border:1px solid rgba(255,215,132,.72);
      border-radius:999px;
      padding:13px 20px;
      background:linear-gradient(180deg,#965d25,#562b0c);
      color:#fff5df;
      font-size:15px;
      font-weight:900;
      box-shadow:0 7px 0 rgba(45,22,7,.78),0 12px 22px rgba(0,0,0,.28);
    }

    /* 1920×1080 고정 캔버스: 브라우저 확대/축소에도 내부 배치 유지 */
    :root {
      --stage-scale: 1;
      --stage-left: 0px;
      --stage-top: 0px;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden !important;
    }

    body {
      position: relative !important;
      inset: auto !important;
    }

    .page {
      position: absolute !important;
      left: var(--stage-left) !important;
      top: var(--stage-top) !important;
      width: 1920px !important;
      height: 1080px !important;
      min-width: 1920px !important;
      min-height: 1080px !important;
      transform: scale(var(--stage-scale));
      transform-origin: top left;
    }

    .shell {
      width: 1760px !important;
      height: 100% !important;
    }

    .modal-panel {
      width: 1320px !important;
      height: 940px !important;
      max-width: none !important;
      max-height: calc(100vh - 70px) !important;
    }

    /* 친구 생각 이어쓰기 보조창 안에서만 스크롤 */
    #commentsModal .modal-body,
    #thoughtModal .modal-body {
      height: 100%;
      min-height: 0;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      overscroll-behavior: contain;
    }

    /* 화면 전체는 계속 고정 */
    .modal {
      overflow: hidden !important;
    }

    /* 넓어진 화면에 맞춰 내부 상자도 가로 폭 전체 사용 */
    .activity-card,
    .filter-card,
    .board-card,
    .question-card,
    .selected-question-box,
    .comment-card,
    .write-box,
    .text-area {
      width: 100%;
    }
  </style>
</head>
<body>
  <button class="teacher-return-button" id="teacherReturnButton" type="button" onclick="goTeacherPractice()" style="display:none;">← 교사용 수업차례로</button>

  <main class="page">
    <div class="shell">
      <header class="top">
        <div class="brand"><div class="brand-icon">📖</div><span>문답책</span></div>
        <h1 class="main-title">책수다방</h1>
        <div class="top-actions">
          <button class="nav-button" type="button" onclick="goHome()">⌂ 홈으로</button>
          <button class="nav-button primary" type="button" onclick="goClassReading()">우리반 책읽기</button>
        </div>
      </header>

      <section class="activity-card">
        <h2 class="activity-title">활동 내역</h2>
        <div class="stat-row">
          <div class="stat-box"><p class="stat-label">공유된 질문</p><p class="stat-value" id="questionCount">0개</p></div>
          <div class="stat-box"><p class="stat-label">내 생각</p><p class="stat-value" id="myThoughtCount">0개</p></div>
          <div class="stat-box"><p class="stat-label">이어쓰기</p><p class="stat-value" id="myReplyCount">0개</p></div>
        </div>
      </section>

      <section class="filter-card">
        <div class="filter-row">
          <button class="filter-button active" type="button" data-type="quiz">📖 책 퀴즈</button>
          <button class="filter-button" type="button" data-type="talk">💬 생각 나누기</button>
          <select class="sort-select" id="sortSelect">
            <option value="talk">수다 많은 순</option>
            <option value="latest">최신순</option>
            <option value="name">이름순</option>
          </select>
        </div>
      </section>

      <section class="board-card">
        <div class="section-head">
          <h2 class="section-title">질문 고르기</h2>
          <span class="count-pill" id="visibleQuestionCount">0개</span>
        </div>
        <div class="question-list" id="questionList"></div>
      </section>
    </div>
  </main>

  <div class="modal hidden" id="thoughtModal" aria-hidden="true" onclick="closeThoughtModal(event)">
    <article class="modal-panel" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
      <div class="modal-head">
        <h2 class="modal-title">내 생각 쓰기</h2>
        <button class="modal-close-button" type="button" onclick="closeThoughtModal()">×</button>
      </div>
      <div class="modal-body" id="thoughtModalBody"></div>
    </article>
  </div>

  <div class="modal hidden" id="commentsModal" aria-hidden="true" onclick="closeCommentsModal(event)">
    <article class="modal-panel" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
      <div class="modal-head">
        <h2 class="modal-title">친구 생각 보기</h2>
        <button class="modal-close-button" type="button" onclick="closeCommentsModal()">×</button>
      </div>
      <div class="modal-body" id="commentsModalBody"></div>
    </article>
  </div>

  <script>
    const studentId = sessionStorage.getItem("studentId") || "student-demo";
    const studentName = sessionStorage.getItem("name") || "나";

    const typeInfo = {
      direct: { label:"책 퀴즈", icon:"📖" },
      infer: { label:"생각 나누기", icon:"💬" },
      feeling: { label:"생각 나누기", icon:"💬" },
      life: { label:"생각 나누기", icon:"💬" }
    };

    let currentType = "quiz";
    let allQuestions = [];
    let selectedQuestionId = null;
    let activeReplyTarget = null;
    let activeReplyType = null;

    const filterButtons = document.querySelectorAll(".filter-button");
    const sortSelect = document.getElementById("sortSelect");
    const questionList = document.getElementById("questionList");
    const thoughtModal = document.getElementById("thoughtModal");
    const thoughtModalBody = document.getElementById("thoughtModalBody");
    const commentsModal = document.getElementById("commentsModal");
    const commentsModalBody = document.getElementById("commentsModalBody");

    initPage();

    function initPage() {
      allQuestions = buildQuestionData();
      bindEvents();
      renderAll();
      showTeacherButtonWhenNeeded();
    }

    function bindEvents() {
      filterButtons.forEach(button => {
        button.addEventListener("click", function() {
          filterButtons.forEach(btn => btn.classList.remove("active"));
          button.classList.add("active");
          currentType = button.dataset.type;
          renderAll();
        });
      });
      sortSelect.addEventListener("change", renderAll);
    }

    function buildQuestionData() {
      const myQuestions = loadMySharedQuestions();
      const mockFriends = [
        { name:"민지", questions:[
          { text:"주인공은 왜 무서웠는데도 친구를 도왔을까?", answer:"친구가 혼자 힘들어하는 모습을 보고 그냥 지나칠 수 없었기 때문이라고 생각해.", type:"infer", createdAt:"06.11 09:10" },
          { text:"나라면 주인공처럼 친구를 도울 수 있었을까?", answer:"나라면 처음에는 무서웠겠지만, 친구가 정말 위험하다면 도와주려고 했을 것 같아.", type:"life", createdAt:"06.11 09:14" }
        ]},
        { name:"서준", questions:[
          { text:"이 장면에서 주인공의 마음은 어떻게 바뀌었을까?", answer:"처음에는 겁이 났지만, 친구를 생각하면서 용기를 낸 것 같아.", type:"feeling", createdAt:"06.11 09:21" },
          { text:"주인공이 다시 돌아간 장면에서 알 수 있는 것은 무엇일까?", answer:"주인공이 친구를 소중하게 생각한다는 것을 알 수 있어.", type:"direct", createdAt:"06.11 09:25" }
        ]},
        { name:"하윤", questions:[
          { text:"친구를 도와주는 마음은 왜 중요할까?", answer:"친구를 도와주면 서로 믿을 수 있고, 어려운 일을 함께 이겨낼 수 있기 때문이야.", type:"feeling", createdAt:"06.11 09:32" },
          { text:"주인공이 혼자였다면 다른 선택을 했을까?", answer:"혼자였다면 더 무서워서 도망갔을 수도 있을 것 같아.", type:"infer", createdAt:"06.11 09:37" }
        ]}
      ];

      const people = [];
      if (myQuestions) people.push(myQuestions);
      mockFriends.forEach(friend => people.push(friend));

      const flattened = [];
      people.forEach(person => {
        person.questions.forEach((question,index) => {
          const type = normalizeType(question.type);
          flattened.push({
            id: person.name + "-" + index + "-" + question.text,
            name: person.name,
            isMine: !!person.isMine,
            text: question.text,
            answer: question.answer || "",
            type,
            createdAt: question.createdAt || "오늘",
            baseTalkCount: getBaseTalkCount(type,index)
          });
        });
      });
      return flattened;
    }

    function loadMySharedQuestions() {
      const raw = localStorage.getItem("mySharedQuestions");
      if (!raw) return null;
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.questions) || !parsed.questions.length) return null;
        return { name:parsed.name || studentName, isMine:true, questions:parsed.questions };
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    function normalizeType(type) {
      if (type === "opinion") return "feeling";
      if (type === "connect") return "life";
      return type || "direct";
    }

    function getBaseTalkCount(type,index) {
      if (type === "infer") return 5 + index;
      if (type === "feeling") return 4 + index;
      if (type === "life") return 3 + index;
      return 2 + index;
    }

    function getFilteredQuestions() {
      let questions = allQuestions.slice();
      questions = currentType === "quiz"
        ? questions.filter(q => q.type === "direct")
        : questions.filter(q => q.type !== "direct");

      if (sortSelect.value === "name") questions.sort((a,b) => a.name.localeCompare(b.name,"ko"));
      else if (sortSelect.value === "latest") questions.sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)));
      else questions.sort((a,b) => getTalkCount(b) - getTalkCount(a));
      return questions;
    }

    function renderAll() {
      const questions = getFilteredQuestions();
      renderQuestionList(questions);
      updateCounts(questions);
    }

    function renderQuestionList(questions) {
      if (!questions.length) {
        questionList.innerHTML = '<div class="empty-list">이 유형으로 공유된 질문이 아직 없어요.</div>';
        return;
      }

      questionList.innerHTML = questions.map(question => {
        const type = typeInfo[question.type] || {label:"질문",icon:"❓"};
        return `
          <article class="question-card">
            <div class="question-top">
              <span class="student-name">${escapeHtml(question.isMine ? "나의 질문" : question.name)}</span>
              <span class="type-badge">${type.icon} ${escapeHtml(type.label)}</span>
              <button class="talk-badge" type="button" onclick="openCommentsModal('${escapeAttribute(question.id)}'); event.stopPropagation();">수다 ${getTalkCount(question)}개</button>
              <div class="card-actions">
                <button class="thought-write-button" type="button" onclick="openThoughtModal('${escapeAttribute(question.id)}'); event.stopPropagation();">내 생각 쓰기</button>
                <span class="time-text">${escapeHtml(question.createdAt)}</span>
              </div>
            </div>
            <button class="question-main-click" type="button" onclick="openCommentsModal('${escapeAttribute(question.id)}')">
              <div class="question-text">${escapeHtml(question.text)}</div>
              ${question.answer ? `<div class="question-answer-preview"><strong>${question.isMine ? "내 생각" : "처음 생각"}:</strong> ${escapeHtml(question.answer)}</div>` : ""}
            </button>
          </article>
        `;
      }).join("");
    }

    function openThoughtModal(questionId) {
      selectedQuestionId = questionId;
      const question = allQuestions.find(q => q.id === questionId);
      if (!question) return;

      const saved = getSavedThought(questionId);
      thoughtModalBody.innerHTML = `
        ${renderSelectedQuestion(question)}
        <div class="form-grid">
          <div class="field"><label class="field-label" for="thoughtMain">내 생각은:</label><textarea class="text-area" id="thoughtMain" maxlength="300"></textarea></div>
          <div class="field"><label class="field-label" for="thoughtReason">그렇게 생각한 까닭은:</label><textarea class="text-area" id="thoughtReason" maxlength="300"></textarea></div>
          <div class="field"><label class="field-label" for="thoughtEvidence">책에서 찾은 부분은:</label><textarea class="text-area" id="thoughtEvidence" maxlength="300"></textarea></div>
          <div class="button-row">
            <button class="plain-button" type="button" onclick="clearThoughtForm()">지우기</button>
            <button class="main-button" type="button" onclick="saveThought('${escapeAttribute(questionId)}')">등록하기</button>
          </div>
        </div>
      `;

      if (saved) {
        document.getElementById("thoughtMain").value = saved.main || "";
        document.getElementById("thoughtReason").value = saved.reason || "";
        document.getElementById("thoughtEvidence").value = saved.evidence || "";
      }

      thoughtModal.classList.remove("hidden");
      thoughtModal.setAttribute("aria-hidden","false");
    }

    function closeThoughtModal(event) {
      if (event && event.target !== thoughtModal) return;
      thoughtModal.classList.add("hidden");
      thoughtModal.setAttribute("aria-hidden","true");
    }

    function openCommentsModal(questionId) {
      selectedQuestionId = questionId;
      activeReplyTarget = null;
      activeReplyType = null;
      renderCommentsModal();
      commentsModal.classList.remove("hidden");
      commentsModal.setAttribute("aria-hidden","false");
    }

    function closeCommentsModal(event) {
      if (event && event.target !== commentsModal) return;
      commentsModal.classList.add("hidden");
      commentsModal.setAttribute("aria-hidden","true");
    }

    function renderCommentsModal() {
      const question = allQuestions.find(q => q.id === selectedQuestionId);
      if (!question) return;
      const comments = getCommentsForQuestion(question);

      commentsModalBody.innerHTML = `
        ${renderSelectedQuestion(question)}
        ${comments.length ? `<div class="comment-list">${comments.map(comment => renderCommentCard(question,comment)).join("")}</div>` : '<div class="empty-list">아직 올라온 생각이 없어요.<br>먼저 내 생각을 써 봐요.</div>'}
      `;
    }

    function renderSelectedQuestion(question) {
      const type = typeInfo[question.type] || {label:"질문",icon:"❓"};
      return `
        <article class="selected-question-box">
          <div class="selected-meta">
            <span class="selected-name">${escapeHtml(question.isMine ? "나의 질문" : question.name + "의 질문")}</span>
            <span class="type-badge">${type.icon} ${escapeHtml(type.label)}</span>
            <span class="time-text">${escapeHtml(question.createdAt)}</span>
          </div>
          <div class="selected-question">${escapeHtml(question.text)}</div>
          ${question.answer ? `<div class="selected-answer"><strong>${question.isMine ? "내가 처음 쓴 생각" : "친구가 처음 쓴 생각"}</strong><br>${escapeHtml(question.answer)}</div>` : ""}
        </article>
      `;
    }

    function renderCommentCard(question,comment) {
      const replies = getNestedReplies(question.id,comment.id);
      return `
        <article class="comment-card">
          <div class="comment-head">
            <span class="comment-name">${escapeHtml(comment.name)}</span>
            ${comment.isMine ? '<span class="talk-badge">내 생각</span>' : '<span class="type-badge">친구 생각</span>'}
            <span class="comment-time">${escapeHtml(comment.savedAt || "오늘")}</span>
          </div>
          <div class="thought-lines">
            <p><strong>내 생각은</strong> ${escapeHtml(comment.main)}</p>
            <p><strong>그렇게 생각한 까닭은</strong> ${escapeHtml(comment.reason)}</p>
            <p><strong>책에서 찾은 부분은</strong> ${escapeHtml(comment.evidence)}</p>
          </div>
          <div class="reply-button-row">
            <button class="reply-type-button green" type="button" onclick="openNestedReply('${escapeAttribute(comment.id)}','similar')">비슷해요</button>
            <button class="reply-type-button brown" type="button" onclick="openNestedReply('${escapeAttribute(comment.id)}','different')">다르게 생각해요</button>
            <button class="reply-type-button gold" type="button" onclick="openNestedReply('${escapeAttribute(comment.id)}','evidence')">책에서 찾았어요</button>
          </div>
          ${activeReplyTarget === comment.id ? renderReplyWriteBox(question.id,comment.id) : ""}
          ${replies.length ? `<div class="nested-list">${replies.map(reply => `<div class="nested-item"><strong>${escapeHtml(reply.name)} · ${escapeHtml(reply.label)}</strong><br>${escapeHtml(reply.text)}</div>`).join("")}</div>` : ""}
        </article>
      `;
    }

    function renderReplyWriteBox(questionId,commentId) {
      const info = getReplyTypeInfo(activeReplyType);
      return `
        <div class="write-box">
          <div class="write-title">${escapeHtml(info.title)}</div>
          <textarea class="text-area" id="nestedReplyInput" maxlength="350" placeholder="${escapeAttribute(info.placeholder)}"></textarea>
          <div class="button-row">
            <button class="plain-button" type="button" onclick="closeNestedReply()">닫기</button>
            <button class="main-button" type="button" onclick="saveNestedReply('${escapeAttribute(questionId)}','${escapeAttribute(commentId)}','${escapeAttribute(activeReplyType)}')">이어 쓰기</button>
          </div>
        </div>
      `;
    }

    function openNestedReply(commentId,type) {
      activeReplyTarget = commentId;
      activeReplyType = type;
      renderCommentsModal();
      setTimeout(() => document.getElementById("nestedReplyInput")?.focus(),0);
    }

    function closeNestedReply() {
      activeReplyTarget = null;
      activeReplyType = null;
      renderCommentsModal();
    }

    function getReplyTypeInfo(type) {
      if (type === "similar") return { title:"비슷한 생각 이어 쓰기", label:"비슷해요", placeholder:"나도 비슷하게 생각해요. 그 까닭은..." };
      if (type === "different") return { title:"다른 생각 이어 쓰기", label:"다르게 생각해요", placeholder:"나는 조금 다르게 생각해요. 그 까닭은..." };
      return { title:"책에서 찾은 내용 이어 쓰기", label:"책에서 찾았어요", placeholder:"책에서 이런 부분도 찾았어요..." };
    }

    function saveThought(questionId) {
      const main = document.getElementById("thoughtMain").value.trim();
      const reason = document.getElementById("thoughtReason").value.trim();
      const evidence = document.getElementById("thoughtEvidence").value.trim();
      if (!main || !reason || !evidence) {
        alert("세 칸을 모두 써 주세요.");
        return;
      }
      const data = getThoughtStore();
      data[questionId] = { main, reason, evidence, savedAt:getNowText() };
      localStorage.setItem("bookChatThoughts_" + studentId,JSON.stringify(data));
      alert("내 생각을 등록했어요.");
      closeThoughtModal();
      renderAll();
    }

    function clearThoughtForm() {
      ["thoughtMain","thoughtReason","thoughtEvidence"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
    }

    function saveNestedReply(questionId,commentId,type) {
      const input = document.getElementById("nestedReplyInput");
      const text = input ? input.value.trim() : "";
      if (!text) {
        alert("이어 쓸 내용을 적어 주세요.");
        return;
      }
      const store = getReplyStore();
      if (!Array.isArray(store[questionId])) store[questionId] = [];
      const info = getReplyTypeInfo(type);
      store[questionId].push({ id:Date.now().toString(), commentId, type, label:info.label, text, name:studentName, savedAt:getNowText() });
      localStorage.setItem("bookChatReplies_" + studentId,JSON.stringify(store));
      activeReplyTarget = null;
      activeReplyType = null;
      renderCommentsModal();
      renderAll();
    }

    function getSavedThought(questionId) {
      return getThoughtStore()[questionId] || null;
    }

    function getThoughtStore() {
      try { return JSON.parse(localStorage.getItem("bookChatThoughts_" + studentId) || "{}"); }
      catch { return {}; }
    }

    function getReplyStore() {
      try { return JSON.parse(localStorage.getItem("bookChatReplies_" + studentId) || "{}"); }
      catch { return {}; }
    }

    function getCommentsForQuestion(question) {
      const comments = [
        { id:"friend-1", name:"민지", isMine:false, main:"주인공은 친구를 혼자 둘 수 없어서 다시 돌아갔다고 생각해.", reason:"친구가 위험한데 혼자 도망가면 계속 마음이 불편했을 것 같기 때문이야.", evidence:"주인공이 멈춰 서서 친구가 있는 곳을 다시 바라본 장면이야.", savedAt:"06.11 09:40" },
        { id:"friend-2", name:"하윤", isMine:false, main:"주인공이 용기를 냈다는 것을 알 수 있어.", reason:"무서웠지만 친구를 도와야 한다고 생각했기 때문이야.", evidence:"주인공이 다시 길을 되돌아간 장면이야.", savedAt:"06.11 09:45" }
      ];
      const mine = getSavedThought(question.id);
      if (mine) comments.unshift({ id:"mine-" + question.id, name:studentName, isMine:true, ...mine });
      return comments;
    }

    function getNestedReplies(questionId,commentId) {
      const list = getReplyStore()[questionId];
      return Array.isArray(list) ? list.filter(item => item.commentId === commentId) : [];
    }

    function getTalkCount(question) {
      const replies = getReplyStore()[question.id];
      const thought = getSavedThought(question.id) ? 1 : 0;
      return question.baseTalkCount + thought + (Array.isArray(replies) ? replies.length : 0);
    }

    function updateCounts(visibleQuestions) {
      const thoughtCount = Object.keys(getThoughtStore()).length;
      const replyCount = Object.values(getReplyStore()).reduce((sum,list) => sum + (Array.isArray(list) ? list.length : 0),0);
      document.getElementById("questionCount").textContent = allQuestions.length + "개";
      document.getElementById("myThoughtCount").textContent = thoughtCount + "개";
      document.getElementById("myReplyCount").textContent = replyCount + "개";
      document.getElementById("visibleQuestionCount").textContent = visibleQuestions.length + "개";
    }

    function getNowText() {
      const now = new Date();
      return String(now.getMonth()+1).padStart(2,"0") + "." + String(now.getDate()).padStart(2,"0") + " " + String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g,char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g,"&#96;");
    }

    function goHome() { location.href = "individual-reading.html"; }
    function goClassReading() { location.href = "class-reading.html"; }
    function goTeacherPractice() { location.href = "../teacher/practice-teacher.html"; }

    function showTeacherButtonWhenNeeded() {
      const teacherMode = sessionStorage.getItem("teacherMode") === "true" || new URLSearchParams(location.search).get("teacher") === "1";
      if (teacherMode) document.getElementById("teacherReturnButton").style.display = "block";
    }

    window.addEventListener("keydown",event => {
      if (event.key !== "Escape") return;
      if (!thoughtModal.classList.contains("hidden")) closeThoughtModal();
      if (!commentsModal.classList.contains("hidden")) closeCommentsModal();
    });

    function fitFixedStage() {
      const baseWidth = 1920;
      const baseHeight = 1080;
      const scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
      const left = Math.max(0, (window.innerWidth - baseWidth * scale) / 2);
      const top = Math.max(0, (window.innerHeight - baseHeight * scale) / 2);

      document.documentElement.style.setProperty("--stage-scale", String(scale));
      document.documentElement.style.setProperty("--stage-left", left + "px");
      document.documentElement.style.setProperty("--stage-top", top + "px");
    }

    window.addEventListener("resize", fitFixedStage);
    window.addEventListener("load", fitFixedStage);
    fitFixedStage();

  </script>
</body>
</html>
