<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문답책 - 책수다방</title>

  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap");

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #3f2615;
      background:
        linear-gradient(180deg, rgba(255,246,222,.42), rgba(255,232,184,.46)),
        url("../assets/images/practice/book-chat-bg.png") center / cover no-repeat;
    }

    button, textarea, select { font-family: inherit; }
    button { cursor: pointer; }

    .page {
      width: 100%;
      height: 100vh;
      padding: 14px 26px 18px;
      overflow: hidden;
    }

    .shell {
      width: min(1760px, calc(100vw - 80px));
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto auto auto minmax(0,1fr);
      gap: 10px;
      overflow: hidden;
    }

    .top {
      display: grid;
      grid-template-columns: 220px 1fr 245px;
      align-items: center;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 26px;
      font-weight: 900;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(180deg,#bf8740,#6d3a0d);
      color: #fff5d6;
      border: 1px solid rgba(255,224,158,.78);
      box-shadow: 0 8px 16px rgba(91,47,10,.18);
      font-size: 22px;
    }

    .main-title {
      text-align: center;
      font-family: "Noto Serif KR", serif;
      color: #4b2a13;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -1.5px;
      text-shadow: 0 2px 0 rgba(255,255,255,.72), 0 8px 18px rgba(122,72,25,.12);
    }

    .mq-demo-banner {
      display: inline-flex;
      align-items: center;
      flex: 0 1 900px;
      min-width: 0;
      max-width: 900px;
      min-height: 38px;
      padding: 6px 16px;
      border: 1px solid rgba(180, 130, 60, 0.42);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,247,225,.96), rgba(238,216,176,.92));
      color: #6b4b26;
      box-shadow: 0 4px 10px rgba(90,55,15,.14);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 700;
      white-space: normal;
      word-break: keep-all;
    }

    .mq-demo-banner strong { font-size: 15px; font-weight: 900; }

    .mq-demo-banner[hidden] { display: none !important; }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    .nav-button {
      height: 43px;
      padding: 0 16px;
      border-radius: 15px;
      border: 1px solid rgba(177,122,57,.34);
      background: rgba(255,250,238,.82);
      color: #4f2e16;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 7px 14px rgba(116,71,20,.10);
    }

    .nav-button.primary,
    .nav-button.reading-home {
      border-radius: 999px;
      border: 1px solid rgba(176,111,25,.46);
      background: linear-gradient(180deg,#e4ad45,#b06d0d);
      color: #fff9ec;
      box-shadow: 0 6px 0 rgba(105,57,5,.50), 0 10px 18px rgba(116,71,20,.16);
    }

    .nav-button:disabled {
      opacity: .45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .date-nav-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 74px;
      padding: 8px 20px;
      border-radius: 18px;
      border: 1px solid rgba(193,133,61,.30);
      background: linear-gradient(180deg,rgba(255,254,249,.90),rgba(255,247,231,.86));
    }

    .date-nav-info {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
    }

    .date-nav-title {
      color: #4b2a13;
      font-size: 16px;
      font-weight: 900;
    }

    .date-nav-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .date-nav-label {
      min-width: 150px;
      text-align: center;
      color: #5f3714;
      font-size: 16px;
      font-weight: 900;
    }

    .activity-card,
    .filter-card,
    .board-card,
    .modal-panel {
      border-radius: 24px;
      border: 1px solid rgba(193,133,61,.34);
      background: linear-gradient(180deg,rgba(255,254,249,.94),rgba(255,247,231,.92));
      box-shadow: 0 14px 28px rgba(123,75,25,.15), inset 0 1px 0 rgba(255,255,255,.72);
    }

    .activity-card {
      min-height: 92px;
      padding: 10px 22px;
      display: grid;
      grid-template-columns: 260px minmax(0,1fr);
      gap: 18px;
      align-items: center;
    }

    .activity-title {
      font-family: "Noto Serif KR", serif;
      font-size: 32px;
      font-weight: 900;
      white-space: nowrap;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 12px;
    }

    .stat-box {
      min-height: 78px;
      padding: 9px 16px;
      border-radius: 18px;
      border: 1px solid rgba(192,130,55,.28);
      background: rgba(255,255,255,.58);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-label { color:#8b6a46; font-size:16px; font-weight:900; }
    .stat-value { margin-top:4px; color:#4a2a10; font-size:32px; font-weight:900; line-height:1; }

    .filter-card { padding: 7px 14px; }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr 220px;
      gap: 10px;
      align-items: center;
    }

    .filter-button,
    .sort-select {
      height: 40px;
      border-radius: 14px;
      border: 1px solid rgba(192,130,55,.34);
      background: rgba(255,252,245,.84);
      color: #5a3820;
      font-size: 16px;
      font-weight: 900;
    }

    .filter-button.active {
      border-color: rgba(190,125,32,.82);
      background: linear-gradient(180deg,#f3c978,#c9902d);
      color:#4a2a10;
      box-shadow: 0 7px 13px rgba(176,112,25,.16);
    }

    .sort-select { padding: 0 16px; text-align:center; text-align-last:center; outline:none; }

    .board-card {
      height: calc(100% - 4px);
      min-height: 0;
      padding: 18px 24px 20px;
      display: grid;
      grid-template-rows: auto minmax(0,1fr);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      font-family: "Noto Serif KR", serif;
      color:#4b2a13;
      font-size:40px;
      font-weight:900;
      letter-spacing:-1px;
    }

    .count-pill {
      padding: 10px 16px;
      border-radius: 999px;
      border:1px solid rgba(190,130,55,.26);
      background:rgba(255,249,235,.88);
      color:#8c5c1e;
      font-size:18px;
      font-weight:900;
    }

	    .question-list {
	      min-height: 0;
	      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-auto-rows: max-content;
      align-content: start;
	      gap: 12px;
	      padding: 2px 10px 18px 2px;
	      scrollbar-gutter: stable;
	    }

	    .question-list .empty-list {
	      min-height: 100%;
	    }

    .question-list::-webkit-scrollbar,
    .modal-body::-webkit-scrollbar { width:12px; }
    .question-list::-webkit-scrollbar-track,
    .modal-body::-webkit-scrollbar-track { border-radius:999px; background:rgba(116,77,38,.10); }
    .question-list::-webkit-scrollbar-thumb,
    .modal-body::-webkit-scrollbar-thumb { border:3px solid transparent; border-radius:999px; background:rgba(142,91,36,.50); background-clip:padding-box; }

    .question-card {
      position: relative;
      align-self: start;
      width: 100%;
      min-width: 0;
      min-height: 152px;
      height: auto;
      padding: 18px 22px 24px;
      overflow: visible;
      border:1px solid rgba(186,130,58,.26);
      border-radius:24px;
      background:rgba(255,255,255,.68);
      color:#4d321a;
      text-align:left;
      transition:.15s ease;
    }

    .question-card.rejected-card {
      min-height: 0;
      padding-bottom: 22px;
    }

    .card-delete-button {
      position: static;
      padding:8px 16px;
      border-radius:999px;
      border:1px solid rgba(186,130,58,.32);
      background:rgba(255,255,255,.82);
      color:#8a5a2f;
      font-size:14px;
      font-weight:900;
    }

    .card-delete-button:hover {
      background:rgba(214,68,58,.12);
      border-color:rgba(214,68,58,.34);
      color:#b23327;
    }

    .question-card:hover { transform:translateY(-1px); box-shadow:0 8px 14px rgba(123,75,25,.10); }

    .question-top {
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .student-name { color:#4b2a13; font-size:24px; font-weight:900; }

    .type-badge,
    .talk-badge {
      display:inline-block;
      padding:6px 11px;
      border-radius:999px;
      font-size:15px;
      font-weight:900;
    }

    .type-badge { background:rgba(222,168,79,.18); color:#8b5a1d; }
    .talk-badge { background:rgba(88,139,62,.14); color:#47722c; }

	    .moderation-badge {
	      display:inline-block;
	      margin-bottom:10px;
	      padding:5px 11px;
	      border-radius:999px;
	      border:1px solid transparent;
	      font-size:13px;
	      font-weight:900;
	    }

	    .moderation-legend {
	      display:flex;
	      align-items:center;
	      flex-wrap:wrap;
	      gap:6px;
	      margin-top:0;
	    }

    .moderation-legend .moderation-badge { margin-bottom:0; }

	    .moderation-legend-text {
	      color:#7a5a35;
	      font-size:12px;
	      font-weight:700;
	    }

    .moderation-badge.status-pending {
      background:rgba(230,180,40,.22);
      border-color:rgba(230,180,40,.4);
      color:#8a6a10;
    }

    .moderation-badge.status-approved {
      background:rgba(88,139,62,.18);
      border-color:rgba(88,139,62,.4);
      color:#2f6b1c;
    }

    .moderation-badge.status-rejected {
      background:rgba(214,68,58,.16);
      border-color:rgba(214,68,58,.4);
      color:#b23327;
      cursor:pointer;
    }

    .question-top .moderation-badge { margin-bottom:0; }

    .card-actions {
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .thought-write-button {
      min-height:38px;
      padding:8px 14px;
      border:1px solid rgba(68,124,42,.38);
      border-radius:14px;
      background:linear-gradient(180deg,#3f842e,#245716);
      color:#fff8dd;
      font-size:15px;
      font-weight:900;
      box-shadow:0 4px 0 rgba(36,87,22,.34);
    }

    .time-text { color:#9c7141; font-size:16px; font-weight:800; white-space:nowrap; }

    .question-main-click {
      width:100%;
      padding:0;
      border:0;
      background:transparent;
      color:inherit;
      text-align:left;
      display:block;
    }

    .question-text {
      display: block;
      font-size: 25px;
      font-weight: 900;
      line-height: 1.45;
      word-break: keep-all;
    }

    .question-answer-preview {
      display: block;
      margin-top:12px;
      color:#6f4e2f;
      font-size:18px;
      font-weight:800;
      line-height:1.5;
      overflow:hidden;
    }

    .question-answer-preview strong { color:#4f7130; }

    .empty-list {
      min-height:220px;
      display:grid;
      place-items:center;
      border-radius:18px;
      border:1px dashed rgba(177,122,57,.30);
      background:rgba(255,255,255,.50);
      color:#92745a;
      font-size:18px;
      font-weight:850;
      text-align:center;
    }

    .modal.hidden { display:none !important; }

    .modal {
      position:fixed;
      inset:0;
      z-index:20000;
      display:grid;
      place-items:center;
      padding:28px;
      background:rgba(43,29,18,.58);
      backdrop-filter:blur(5px);
    }

    .modal-panel {
      width:min(1320px,calc(100vw - 80px));
      height:min(940px,calc(100vh - 70px));
      max-height:calc(100vh - 70px);
      padding:22px 25px 25px;
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
      gap:14px;
      overflow:hidden;
      background:rgba(255,251,242,.99);
      box-shadow:0 28px 70px rgba(47,28,10,.38);
    }

    .reject-reason-panel {
      width:min(620px,calc(100vw - 80px));
      height:auto;
      max-height:calc(100vh - 70px);
    }

    .reject-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      margin-top: 16px;
      padding-top: 2px;
    }

    .reject-reason-box {
      width: 100%;
      min-width: 0;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid rgba(214,68,58,.28);
      background: rgba(214,68,58,.08);
      color: #7a281f;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.6;
      position: static;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .reject-reason-box strong {
      display: block;
      margin-bottom: 10px;
      color: #b23327;
      font-size: 20px;
      font-weight: 900;
    }

    .reject-reason-box p {
      margin: 0;
      max-height: 130px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 6px;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: keep-all;
      line-height: 1.6;
      -webkit-overflow-scrolling: touch;
    }

    .reject-action-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      min-height: 36px;
    }

    .reject-rewrite-button {
      margin-top:16px;
      width:100%;
      min-height:48px;
      border:1px solid rgba(68,124,42,.38);
      border-radius:14px;
      background:linear-gradient(180deg,#3f842e,#245716);
      color:#fff8dd;
      font-size:16px;
      font-weight:900;
    }

    .modal-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding-bottom:13px;
      border-bottom:1px solid rgba(186,130,58,.22);
    }

    .modal-title {
      font-family:"Noto Serif KR",serif;
      color:#4b2a13;
      font-size:34px;
      font-weight:900;
    }

    .modal-close-button {
      width:44px;
      height:44px;
      border:1px solid rgba(175,119,53,.34);
      border-radius:14px;
      background:rgba(255,252,245,.94);
      color:#654220;
      font-size:28px;
      font-weight:900;
      line-height:1;
    }

    .modal-body {
      min-height:0;
      height:100%;
      overflow-y:auto;
      overflow-x:hidden;
      overscroll-behavior:contain;
      padding:2px 14px 30px 2px;
      scrollbar-gutter:stable;
    }

    .selected-question-box,
    .comment-card,
    .write-box {
      border-radius:18px;
      border:1px solid rgba(186,130,58,.28);
      background:rgba(255,255,255,.66);
    }

    .selected-question-box { width:100%; padding:20px 22px; margin-bottom:14px; }
    .selected-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .selected-name { font-size:18px; font-weight:900; }
    .selected-question { font-size:25px; font-weight:900; line-height:1.45; }
    .selected-answer { margin-top:12px; padding:14px 16px; border-radius:16px; background:rgba(243,255,236,.70); border:1px solid rgba(83,133,60,.20); font-size:17px; font-weight:820; line-height:1.5; }
    .quiz-author-answer {
      margin-top:14px;
      padding:13px 16px 14px;
      border:1px solid rgba(185,126,38,.34);
      border-radius:16px;
      background:linear-gradient(135deg,rgba(255,248,224,.94),rgba(246,231,190,.78));
      color:#513116;
      font-size:17px;
      font-weight:760;
      line-height:1.5;
      word-break:keep-all;
    }
    .quiz-author-answer-label {
      display:inline-flex;
      align-items:center;
      margin-bottom:7px;
      padding:4px 10px;
      border:1px solid rgba(171,108,27,.34);
      border-radius:999px;
      background:rgba(255,253,244,.88);
      color:#8a5517;
      font-size:14px;
      font-weight:900;
    }
    .quiz-answer-list-title {
      margin:2px 2px 10px;
      color:#5a371a;
      font-size:19px;
      font-weight:900;
    }
    .quiz-my-submitted-answer {
      margin:0 0 14px;
      padding:13px 16px 14px;
      border:1px solid rgba(83,133,60,.24);
      border-radius:16px;
      background:rgba(243,255,236,.74);
      color:#3f542e;
      font-size:17px;
      font-weight:760;
      line-height:1.5;
      word-break:keep-all;
    }
    .quiz-my-submitted-answer .quiz-author-answer-label {
      border-color:rgba(83,133,60,.28);
      color:#52713a;
    }

    .form-grid { display:grid; gap:14px; }
    .field { display:grid; gap:7px; }
    .field-label { font-size:20px; font-weight:900; }
    .text-area { width:100%; min-height:105px; padding:14px 16px; resize:vertical; outline:none; border-radius:15px; border:1px solid rgba(196,138,69,.34); background:rgba(255,255,255,.78); color:#452713; font-size:18px; font-weight:760; line-height:1.5; }
    .text-area:focus { border-color:rgba(203,139,44,.72); box-shadow:0 0 0 3px rgba(216,162,68,.13); }

    .button-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    .demo-action-guide {
      margin-top: 8px;
      color: #79552c;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 800;
      text-align: right;
      word-break: keep-all;
    }

    .plain-button,
    .main-button {
      height:50px;
      border-radius:16px;
      font-size:17px;
      font-weight:900;
    }

    .plain-button { border:1px solid rgba(175,119,53,.34); background:rgba(255,252,245,.78); color:#654220; }
    .main-button { border:1px solid rgba(176,111,25,.40); background:linear-gradient(180deg,#e4ad45,#b06d0d); color:#fff9ec; box-shadow:0 7px 0 rgba(105,57,5,.68); }

    .comment-list { display:grid; gap:14px; }
    .comment-card { width:100%; padding:19px 22px; }
    .comment-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .comment-name { font-size:18px; font-weight:900; }
    .comment-time { margin-left:auto; color:#9c7141; font-size:14px; font-weight:800; }
    .thought-lines { display:grid; gap:8px; color:#4f3219; font-size:17px; font-weight:820; line-height:1.5; }
    .thought-lines strong { color:#4f7130; }

    .reply-button-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:13px; }

    .reply-type-button {
      min-height:40px;
      padding:8px 13px;
      border-radius:14px;
      font-size:15px;
      font-weight:900;
      color:#fff8dd;
    }
    .reply-type-button.green { border:1px solid rgba(68,124,42,.38); background:linear-gradient(180deg,#3f842e,#245716); }
    .reply-type-button.brown { border:1px solid rgba(120,73,24,.38); background:linear-gradient(180deg,#965d25,#562b0c); }
    .reply-type-button.gold { border:1px solid rgba(176,111,25,.40); background:linear-gradient(180deg,#e4ad45,#b06d0d); }

    .write-box { margin-top:12px; padding:14px; background:rgba(255,250,238,.76); }
    .write-title { margin-bottom:10px; font-size:18px; font-weight:900; }

    .nested-list { display:grid; gap:8px; margin-top:12px; padding-left:12px; border-left:3px solid rgba(205,151,67,.34); }
    .nested-item { padding:11px 12px; border-radius:14px; border:1px solid rgba(186,130,58,.18); background:rgba(255,255,255,.64); font-size:15px; font-weight:800; line-height:1.45; }
    .nested-item strong { color:#8b5a1d; }
    .content-manage-actions { display:inline-flex; gap:6px; margin-left:auto; }
    .content-manage-button { height:32px; padding:0 14px; border:1px solid rgba(139,84,33,.28); border-radius:999px; background:#fffaf0; color:#744619; font-size:13px; font-weight:850; cursor:pointer; }
    .content-manage-button:hover { background:#fdf0d5; }
    .content-manage-button.danger { color:#9a3f2d; border-color:rgba(154,63,45,.28); }

async function loadClassReadingBookId() {
  const token = sessionStorage.getItem("token");
  const role = sessionStorage.getItem("role");

  if (!token || !studentId || (role !== "student" && !teacherMode)) {
    alert("학생 로그인이 필요합니다.");

    return false;

    const classResponse = await fetch(
      teacherMode
        ? `${API_BASE_URL}/api/teachers/${studentId}/class`
        : `${API_BASE_URL}/api/students/${studentId}/class`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (!classResponse.ok) {
      throw new Error(
        `학생 학급 조회 실패: ${classResponse.status}`
      );
    }

    const classData = await classResponse.json();

    const bookResponse = await fetch(
      `${API_BASE_URL}/api/classes/${classData.classId}/reading-range`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (bookResponse.status === 404) {
      alert("아직 우리 반의 온책읽기 책이 등록되지 않았습니다.");

    if (!bookResponse.ok) {

        `온책읽기 책 조회 실패: ${bookResponse.status}`
      );
    }

    const bookData = await bookResponse.json();

    classReadingBookId = bookData.id;
    return true;
  } catch (error) {
    console.error(
      "학급 책 정보를 불러오지 못했습니다.",
      error
    );

    alert("책 정보를 불러오지 못했습니다.");
    return false;
  }
}

async function loadBookChatQuestions() {
  const token = sessionStorage.getItem("token");

  if (!token || !studentId || !classReadingBookId) {
    return [];
  }

  try {
    const response = await fetch(
      teacherMode
        ? `${API_BASE_URL}/api/teachers/${studentId}/book-thought-reviews?classReadingBookId=${classReadingBookId}&status=APPROVED`
        : `${API_BASE_URL}/api/students/${studentId}/book-chat/questions?classReadingBookId=${classReadingBookId}`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        `책수다방 질문 조회 실패: ${response.status}`
      );
    }

    const items = await response.json();

    let serverQuestions = items.map(function(item) {
      const isMine = item.studentId != null &&
        String(item.studentId) === String(studentId);
      const moderationStatus = String(
        item.approvalStatus || "PENDING"
      ).toLowerCase();

      return {
        id: String(item.id),
        name: item.studentName || "학생",
        studentId: item.studentId,
        classReadingBookId: item.classReadingBookId,
        // 심사계정도 studentId가 같으면(=김초롱/ss01 본인이 쓴 실제 seed
        // 글) isMine을 그대로 true로 둔다 - 그래야 교사가 이 글을 거절했을
        // 때 ss01 화면에 기존 "다시 써볼까요?" UI가 뜬다. 다른 가상
        // 학생의 seed는 studentId가 달라 자연히 isMine=false로 남는다.
        isMine: isMine,
        myIndex: null,
        text: item.question || "",
        answer: item.answer || "",
        type: normalizeType(item.questionType),
        // 날짜 이동 필터용 - createdAt은 화면 표시용 문자열로 바뀌므로 원본에서 날짜만 따로 뽑아둔다.
        dateKey: item.createdAt ? String(item.createdAt).slice(0, 10) : getTodayDateKey(),
        createdAt: formatBookChatDate(item.createdAt),
        moderationStatus: moderationStatus,
        rejectReason: item.rejectionReason || "",
        demoSeed: isDemoAccount()
      };
    });

    if (!isDemoAccount()) return serverQuestions;

    /*
     * 실제 DB 승인 예시(공용, 모든 심사 브라우저 공통) 위에 이 브라우저의
     * override(teacher 화면에서 거절/재승인한 결과)만 얹는다. DB 값
     * 자체는 절대 바꾸지 않는다.
     */
    serverQuestions = serverQuestions.map(function (question) {
      const override = getDemoBookChatStatusOverride("practice", question.id);
      if (!override) return question;
      return Object.assign({}, question, {
        moderationStatus: override.status,
        rejectReason: override.status === "rejected" ? override.reason : "",
        dateKey: override.updatedAt
          ? getDemoBookChatItemDateKey(question, override.updatedAt)
          : question.dateKey,
        text: override.question == null ? question.text : override.question,
        answer: override.answer == null ? question.answer : override.answer,
        type: override.questionType == null ? question.type : normalizeType(override.questionType)
      });
    }).filter(function(question) {
      const override = getDemoBookChatStatusOverride("practice", question.id);
      return !(override && override.deleted === true);
    });

    const seedQuestions = PRACTICE_BOOK_CHAT_PENDING_SEED
      .map(mapPracticePendingSeedToQuestion)
      .filter(Boolean);

    const demoQuestions = loadDemoApprovalRequests("practice").map(function(request) {
      const requestStudentId = request.studentId == null ? "" : String(request.studentId);
      return {
        id: String(request.requestId),
        name: request.studentName || "김초롱",
        studentId: request.studentId || studentId,
        isMine: requestStudentId !== "" && requestStudentId === String(studentId),
        myIndex: null,
        text: request.question || "",
        answer: request.answer || "",
        type: normalizeType(request.questionType),
        dateKey: getDemoBookChatItemDateKey(
          request,
          request.reviewedAt || ""
        ) || getTodayDateKey(),
        createdAt: formatBookChatDate(request.submittedAt),
        moderationStatus: request.status || "pending",
        rejectReason: request.rejectedReason || "",
        demoApproval: true
      };
    });

    return serverQuestions.concat(seedQuestions).concat(demoQuestions).map(function(question) {
      /*
       * seed/직접 작성/서버 글을 합친 마지막 단계에서 작성자 ID로 mine을
       * 다시 확정한다. 교사 review override는 상태와 본문만 바꾸므로 이
       * 값이 override 적용 뒤에도 유실되거나 이름 비교로 바뀌면 안 된다.
       */
      const mine = question.studentId != null &&
        String(question.studentId) === String(studentId);
      return Object.assign({}, question, { isMine: mine });
    });
  } catch (error) {
    console.error(
      "책수다방 질문을 불러오지 못했습니다.",
      error
    );

    return [];
  }
}

function formatBookChatDate(value) {
  if (!value) return "오늘";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  const month = String(
    date.getMonth() + 1
  ).padStart(2, "0");

  const day = String(
    date.getDate()
  ).padStart(2, "0");

  const hour = String(
    date.getHours()
  ).padStart(2, "0");

  const minute = String(
    date.getMinutes()
  ).padStart(2, "0");

  return `${month}.${day} ${hour}:${minute}`;
}

function getBookChatDisplayDate(value) {
  const original = String(value || "");
  if (!isDemoAccount() || !original) return original || "오늘";

  const selectedParts = String(selectedBookChatDate).split("-");
  const timeMatch = original.match(/\b\d{2}:\d{2}\b/);

  if (selectedParts.length !== 3 || !timeMatch) return original;

  return `${selectedParts[1]}.${selectedParts[2]} ${timeMatch[0]}`;
}

/*
  책수다방 날짜 이동. 개별읽기 책수다방과 같은 방식(YYYY-MM-DD 키 비교)을
  그대로 재사용한다 - 새로고침하면 항상 오늘로 돌아간다.
*/
function getTodayDateKey() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(new Date());
  const byType = {};
  parts.forEach(function(part) { byType[part.type] = part.value; });
  return byType.year + "-" + byType.month + "-" + byType.day;
}

function formatBookChatDateLabel(dateKey) {
  const parts = dateKey.split("-");
  return `${Number(parts[0])}년 ${Number(parts[1])}월 ${Number(parts[2])}일`;
}

function updateBookChatDateLabel() {
  const label = document.getElementById("bookChatDateLabel");
  const nextButton = document.getElementById("bookChatNextDayButton");
  if (label) label.textContent = formatBookChatDateLabel(selectedBookChatDate);
  if (nextButton) nextButton.disabled = selectedBookChatDate >= getTodayDateKey();
}

function moveBookChatDate(direction) {
  const dateParts = String(selectedBookChatDate).split("-").map(Number);
  const currentDate = new Date(Date.UTC(dateParts[0], dateParts[1] - 1, dateParts[2]));
  currentDate.setUTCDate(currentDate.getUTCDate() + direction);
  const nextDateKey = currentDate.getUTCFullYear() + "-"
    + String(currentDate.getUTCMonth() + 1).padStart(2, "0") + "-"
    + String(currentDate.getUTCDate()).padStart(2, "0");
  const todayKey = getTodayDateKey();

  if (nextDateKey > todayKey) {
    alert("아직 오지 않은 날짜예요.");
    return;
  }

  selectedBookChatDate = nextDateKey;
  updateBookChatDateLabel();
  renderAll();
}

function goTodayBookChatDate() {
  selectedBookChatDate = getTodayDateKey();
  updateBookChatDateLabel();
  renderAll();
}

    function getModerationBadgeInfo(status) {
      if (status === "approved") return { label:"게시됐어요", className:"status-approved" };
      if (status === "rejected") return { label:"다시 써볼까요?", className:"status-rejected" };
      return { label:"확인 중이에요", className:"status-pending" };

      if (question && question.demoApproval && question.moderationStatus === "pending") {
        return { label:"승인 대기", className:"status-pending" };
      }
      return getModerationBadgeInfo(question && question.moderationStatus);
    }

    async function deleteMyQuestion(responseId) {

  );

  if (isDemoAccount() && question.demoApproval) {
    const remaining = loadDemoApprovalRequests("practice").filter(function(item) {

    });
    saveDemoState("practiceBookChatApprovals", remaining);

    delete replyCache[String(responseId)];
    persistDemoBookChatActivity();

    });

    alert("질문을 삭제했어요.");

  }

  if (isDemoAccount()) {
    deleteDemoBookChatPost("practice", responseId);
    delete thoughtCache[String(responseId)];
    delete quizAnswerCache[String(responseId)];
    delete replyCache[String(responseId)];
    persistDemoBookChatActivity();
    allQuestions = await loadBookChatQuestions();
    renderAll();
    alert("질문을 삭제했어요.");
    return;
  }

  try {
    const response = await fetch(
      `${API_BASE_URL}/api/students/${studentId}/responses/book-thought/${responseId}`,
      {
        method: "DELETE",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        `질문 삭제 실패: ${response.status}`
      );
    }

    allQuestions = await loadBookChatQuestions();
    renderAll();

    alert("질문을 삭제했어요.");
  } catch (error) {
    console.error(
      "거절된 질문을 삭제하지 못했습니다.",
      error
    );

    alert("질문 삭제에 실패했어요.");
  }
}

    async function reviseMyRejectedQuestion(responseId) {
      const question = allQuestions.find(item => String(item.id) === String(responseId));
      if (!question || !question.isMine || question.moderationStatus !== "rejected") {
        alert("거절된 내 질문만 수정할 수 있어요.");
        return;
      }
      const revisedQuestion = prompt("질문을 수정해 주세요.", question.text || "");
      if (revisedQuestion === null) return;
      const revisedAnswer = prompt(
        question.type === "direct" ? "나의 답을 수정해 주세요." : "내 생각을 수정해 주세요.",
        question.answer || ""
      );
      if (revisedAnswer === null) return;
      if (!revisedQuestion.trim() || !revisedAnswer.trim()) {
        alert("질문과 답을 모두 써 주세요.");
        return;
      }
      const storedType = question.type === "feeling" ? "opinion"
        : question.type === "life" ? "connect" : question.type;

      if (isDemoAccount()) {
        const localRequest = loadDemoApprovalRequests("practice")
          .find(item => String(item.requestId) === String(responseId));
        if (localRequest) {
          saveDemoApprovalRequest("practice", Object.assign({}, localRequest, {
            question: revisedQuestion.trim(), answer: revisedAnswer.trim(),
            questionType: storedType, status: "pending", rejectedReason: "",
            submittedAt: new Date().toISOString()
          }));
        } else {
          saveDemoBookChatRevisionOverride("practice", responseId, {
            question: revisedQuestion.trim(), answer: revisedAnswer.trim(), questionType: storedType
          });
        }
        /*
         * 이 질문이 잠깐 승인 상태였을 때(같은 브라우저에서) 남긴 생각/
         * 퀴즈답/답글 캐시가 남아있으면 글 내용을 바꾼 뒤에도 계속
         * 보인다 - 게시글 자체를 수정하는 경우이므로 이 브라우저의
         * 캐시도 실제로 비운다("댓글만 수정"하는 editBookChatThought 등과
         * 달리 여기서만 적용).
         */
        delete thoughtCache[String(responseId)];
        delete quizAnswerCache[String(responseId)];
        delete replyCache[String(responseId)];
        persistDemoBookChatActivity();
        allQuestions = await loadBookChatQuestions();
        renderAll();
        alert("수정한 글을 선생님께 다시 보냈어요.");
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/api/students/${studentId}/responses/book-thought/${responseId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${sessionStorage.getItem("token")}` },
          body: JSON.stringify({
            questionType: storedType, question: revisedQuestion.trim(), answer: revisedAnswer.trim(),
            classReadingBookId: question.classReadingBookId || classReadingBookId
          })
        });
        if (!response.ok) throw new Error("질문 재제출 실패: " + response.status);
        allQuestions = await loadBookChatQuestions();
        renderAll();
        alert("수정한 글을 선생님께 다시 보냈어요.");
      } catch (error) {
        console.error(error);
        alert("지금은 수정한 글을 다시 보내지 못했어요.");
      }
    }

    function normalizeType(type) {
      if (type === "opinion") return "feeling";
      if (type === "connect") return "life";
      return type || "direct";
    }

    /*
     * 학생이 아무것도 안 써도 심사 교사 승인/거절 체험을 볼 수 있게 넣어 둔
     * 가상 승인대기 예시 - teacher/book-chat-manage.html의 같은 이름
     * 상수와 id가 반드시 같아야 승인 결과가 이 화면에도 반영된다.
     */
    const PRACTICE_BOOK_CHAT_PENDING_SEED = getDemoBookChatPendingSeeds("practice");

    function mapPracticePendingSeedToQuestion(seed) {
      const override = getDemoBookChatStatusOverride("practice", seed.id);
      if (override && override.deleted === true) return null;
      const status = override ? override.status : "pending";
      return {
        id: seed.id,
        name: seed.studentName,
        studentId: null,
        isMine: false,
        myIndex: null,
        text: override && override.question != null ? override.question : seed.question,
        answer: override && override.answer != null ? override.answer : seed.answer,
        type: normalizeType(override && override.questionType != null ? override.questionType : seed.questionType),
        dateKey: getDemoBookChatItemDateKey(
          seed,
          override ? override.updatedAt : ""
        ),
        createdAt: formatBookChatDate(seed.submittedAt),
        moderationStatus: status,
        rejectReason: status === "rejected" ? (override ? override.reason : "") : ""
      };
    }

    function getFilteredQuestions() {
      let questions = allQuestions.filter(q => q.dateKey === selectedBookChatDate);

      /*
       * 심사계정에서만: 내 글이 아니면서 승인 상태가 아닌 질문(교사 화면에서
       * 거절 override를 남긴 글, 아직 승인 안 된 가상 승인대기 예시)은
       * 학생 공개 목록에서 제외한다 - 일반계정은 서버가 이미 "내 글(모든
       * 상태) + 남의 approved 글"만 내려주므로 이 필터가 필요 없다.
       *
       * isPublic(공개 여부)과 isMine(작성자 판별)은 서로 다른 조건이다 -
       * 작성자가 누구든(김초롱이든 다른 가상 학생이든) 승인된 글은 공개
       * 피드에 보여야 하고, isMine은 "내 글" 예외 노출(상태 무관 표시)에만
       * 쓴다. 두 조건을 섞으면 특정 학생 이름을 조건에 넣는 실수로 이어질
       * 수 있으므로 명시적으로 분리해 둔다.
       */
      if (isDemoAccount()) {
        questions = questions.filter(function (q) {
          const status = String(q.moderationStatus || "pending").toLowerCase();
          const isPublic = status === "approved";
          const isOwnReviewState = q.isMine && (status === "pending" || status === "rejected");
          return isPublic || isOwnReviewState;
        });
      }

      questions = currentType === "quiz"
        ? questions.filter(q => q.type === "direct")
        : questions.filter(q => q.type !== "direct");

      questions.sort(function (a, b) {
        if (sortSelect.value === "name") return a.name.localeCompare(b.name, "ko");
        return compareQuestionsByLatest(a, b);
      });
      return questions;
    }

    function renderAll() {
      const questions = getFilteredQuestions();
      renderQuestionList(questions);
      updateCounts(questions);
    }

    function renderQuestionList(questions) {
      if (!questions.length) {
        questionList.innerHTML = '<div class="empty-list">이 유형으로 공유된 질문이 아직 없어요.</div>';
        return;
      }

      questionList.innerHTML = questions.map(question => {
        const type = typeInfo[question.type] || {label:"질문",icon:"❓"};
        const isQuiz = question.type === "direct";
        // 출제자는 자신의 질문과 정답을 바로 확인할 수 있고, 다른 학생은
        // 기존 정책대로 답을 제출한 뒤에만 친구 답 상세를 열 수 있다.
        const quizDone = teacherMode || question.isMine || !!getSavedQuizAnswer(question.id);
        const thoughtDone = teacherMode || question.isMine || !!getSavedThought(question.id);
        const actionLabel = isQuiz
          ? (quizDone ? "친구 답 보기" : "퀴즈 풀기")
          : (thoughtDone ? "친구 생각 보기" : "내 생각 쓰기");
        const actionClick = isQuiz
          ? (quizDone ? `openCommentsModal('${escapeAttribute(question.id)}')` : `openThoughtModal('${escapeAttribute(question.id)}')`)
          : (thoughtDone ? `openCommentsModal('${escapeAttribute(question.id)}')` : `openThoughtModal('${escapeAttribute(question.id)}')`);
        const countLabel = isQuiz ? `답 ${getQuizAnswerCount(question)}개` : `수다 ${getTalkCount(question)}개`;
        const countClick = isQuiz
          ? (quizDone ? `openCommentsModal('${escapeAttribute(question.id)}')` : `openThoughtModal('${escapeAttribute(question.id)}')`)
          : (thoughtDone ? `openCommentsModal('${escapeAttribute(question.id)}')` : `openThoughtModal('${escapeAttribute(question.id)}')`);

        const badge = question.isMine && question.moderationStatus
          ? getQuestionModerationBadgeInfo(question)
          : null;
        const badgeClick = question.moderationStatus === "rejected"
          ? `onclick="openRejectReasonModal('${escapeAttribute(question.id)}'); event.stopPropagation();"`
          : "";
        const isRejectedMine =
          question.isMine && question.moderationStatus === "rejected";

        return `
          <article class="question-card ${isRejectedMine ? "rejected-card" : ""}">
            <div class="question-top">
              <span class="student-name">${escapeHtml(question.isMine ? "나의 질문" : question.name)}</span>
              ${badge ? `<span class="moderation-badge ${badge.className}" ${badgeClick}>${escapeHtml(badge.label)}</span>` : ""}
              <button class="talk-badge" type="button" onclick="${countClick}; event.stopPropagation();">${countLabel}</button>
              <div class="card-actions">
                <button class="thought-write-button" type="button" onclick="${actionClick}; event.stopPropagation();">${actionLabel}</button>
                <span class="time-text">${escapeHtml(getBookChatDisplayDate(question.createdAt))}</span>
              </div>
            </div>
            <button class="question-main-click" type="button" onclick="${countClick}">
              <span class="question-text">${escapeHtml(question.text)}</span>
              ${!isQuiz && question.answer
                ? `<span class="question-answer-preview">
                     <strong>${question.isMine ? "내 생각" : "처음 생각"}:</strong>
                     ${escapeHtml(question.answer)}
                   </span>`
                : ""}
            </button>
            ${isRejectedMine
              ? `<div class="reject-area">
                   <div class="reject-reason-box">
                     <strong>선생님이 남긴 이유</strong>
                     <p>${escapeHtml(
                       question.rejectReason ||
                       "선생님이 남긴 이유를 불러오지 못했어요."
                     )}</p>
                   </div>
                   <div class="reject-action-row">
                     <button class="content-manage-button" type="button" onclick="reviseMyRejectedQuestion('${escapeAttribute(question.id)}'); event.stopPropagation();">수정하기</button>
                     <button class="content-manage-button danger" type="button" onclick="deleteMyQuestion('${escapeAttribute(question.id)}'); event.stopPropagation();">삭제</button>
                   </div>
                 </div>`
              : ""}
          </article>
        `;
      }).join("");
    }

    async function openThoughtModal(questionId) {
      selectedQuestionId = questionId;
      const question = allQuestions.find(q => q.id === questionId);
      if (!question) return;

      const isQuiz = question.type === "direct";

      // 교사는 학생의 퀴즈 응답자나 생각 등록자가 아니므로 입력 화면을
      // 거치지 않고 승인된 활동의 상세 내용을 바로 확인한다.
      if (teacherMode) {
        await openCommentsModal(questionId);
        return;
      }

      // 출제자는 자기 퀴즈를 다시 풀지 않고 곧바로 친구 답 상세로 간다.
      // 카드 렌더링 외에 함수 직접 호출 경로에서도 같은 정책을 보장한다.
      if (isQuiz && question.isMine) {
        await openCommentsModal(questionId);
        return;
      }

      if (!isQuiz && (question.isMine || getSavedThought(questionId))) {
        await openCommentsModal(questionId);
        return;
      }

      if (!isDemoAccount()) await loadQuestionActivity(questionId);
      ensureDemoActivityExamples(questionId);

      const saved = isQuiz ? getSavedQuizAnswer(questionId) : getSavedThought(questionId);

      thoughtModal.querySelector(".modal-title").textContent = isQuiz ? "책 퀴즈 풀기" : "내 생각 쓰기";

      thoughtModalBody.innerHTML = isQuiz ? `
  ${renderSelectedQuestion(question)}

  <div class="form-grid">
    <div class="field">
      <label class="field-label" for="quizAnswer">내 답:</label>
      <textarea
        class="text-area"
        id="quizAnswer"
        maxlength="300"
        placeholder="질문에 대한 내 답을 써 보세요."
      ></textarea>
    </div>

    ${isDemoAccount() ? `
      <div class="mq-demo-guide">
        🔍 <strong>심사 체험 안내</strong> — 심사계정에서는 답 작성 여부와 관계없이
        ‘확인’ 버튼을 눌러 친구들의 답 예시를 확인할 수 있습니다.
      </div>
    ` : ""}

    <div class="button-row">
      <button class="plain-button" type="button" onclick="clearQuizForm()">
        지우기
      </button>

      <button
        class="main-button"
        type="button"
        onclick="saveQuizAnswer('${escapeAttribute(questionId)}')"
      >
        확인
      </button>
    </div>
  </div>
` : `
  ${renderSelectedQuestion(question)}

  <div class="form-grid">
    <div class="field">
      <label class="field-label" for="thoughtMain">내 생각은:</label>
      <textarea class="text-area" id="thoughtMain" maxlength="300"></textarea>
    </div>

    <div class="field">
      <label class="field-label" for="thoughtReason">그렇게 생각한 까닭은:</label>
      <textarea class="text-area" id="thoughtReason" maxlength="300"></textarea>
    </div>

    ${isDemoAccount() ? `
      <div class="mq-demo-guide">
        🔍 <strong>심사 체험 안내</strong> — 심사계정에서는 글 작성 여부와 관계없이
        ‘등록하기’ 버튼을 눌러 학생들의 활동 예시를 확인할 수 있습니다.
      </div>
    ` : ""}

    <div class="button-row">
      <button class="plain-button" type="button" onclick="clearThoughtForm()">
        지우기
      </button>

      <button
        class="main-button"
        type="button"
        onclick="saveThought('${escapeAttribute(questionId)}')"
      >
        등록하기
      </button>
    </div>
  </div>
`;

      if (saved) {
        if (isQuiz) {
          document.getElementById("quizAnswer").value = saved.answer || "";
        } else {
          document.getElementById("thoughtMain").value = saved.main || "";
          document.getElementById("thoughtReason").value = saved.reason || "";
        }
      }

      thoughtModal.classList.remove("hidden");
      thoughtModal.setAttribute("aria-hidden","false");
    }

    function closeThoughtModal(event) {
      if (event && event.target !== thoughtModal) return;
      thoughtModal.classList.add("hidden");
      thoughtModal.setAttribute("aria-hidden","true");
    }

    async function openCommentsModal(questionId) {
      const question = allQuestions.find(q => q.id === questionId);
      if (!question) return;

      if (!isDemoAccount()) await loadQuestionActivity(questionId);
      ensureDemoActivityExamples(questionId);

      if (
        question.type === "direct" &&
        !teacherMode &&
        !question.isMine &&
        !isDemoAccount() &&
        !getSavedQuizAnswer(questionId)
      ) {
        alert("먼저 퀴즈 답을 쓰고 확인해 주세요.");
        openThoughtModal(questionId);
        return;
      }

      if (
        question.type !== "direct" &&
        !teacherMode &&
        !question.isMine &&
        !isDemoAccount() &&
        !getSavedThought(questionId)
      ) {
        openThoughtModal(questionId);
        return;
      }

      selectedQuestionId = questionId;
      activeReplyTarget = null;
      activeReplyType = null;
      commentsModal.querySelector(".modal-title").textContent = question.type === "direct" ? "친구 답 보기" : "친구 생각 보기";
      renderCommentsModal();
      commentsModal.classList.remove("hidden");
      commentsModal.setAttribute("aria-hidden","false");
    }

    function closeCommentsModal(event) {
      if (event && event.target !== commentsModal) return;
      commentsModal.classList.add("hidden");
      commentsModal.setAttribute("aria-hidden","true");
    }

    function openRejectReasonModal(questionId) {
      const question = allQuestions.find(q => q.id === questionId);
      if (!question) return;

      const reasonModal = document.getElementById("rejectReasonModal");
      const reasonBody = document.getElementById("rejectReasonModalBody");

      reasonBody.innerHTML = `
        <div class="reject-reason-box">
          <strong>선생님이 남긴 이유</strong>
          <p>${escapeHtml(question.rejectReason || "따로 남긴 이유가 없어요. 내용을 다시 살펴보고 고쳐 써 봐요.")}</p>
        </div>
        <button class="reject-rewrite-button" type="button" onclick="location.href='./during-read.html';">다시 쓰기</button>
      `;

      reasonModal.classList.remove("hidden");
      reasonModal.setAttribute("aria-hidden","false");

    function closeRejectReasonModal(event) {
      const reasonModal = document.getElementById("rejectReasonModal");
      if (event && event.target !== reasonModal) return;
      reasonModal.classList.add("hidden");
      reasonModal.setAttribute("aria-hidden","true");
    }

    function renderCommentsModal() {
      const question = allQuestions.find(q => q.id === selectedQuestionId);
      if (!question) return;

      if (question.type === "direct") {
        const answers = getQuizAnswersForQuestion(question);
        const mySubmittedAnswer = question.isMine
          ? null
          : answers.find(answer => answer.isMine) || null;
        // 출제자의 기존 중복 제출과 현재 응답자의 답은 친구 목록에서 뺀다.

        commentsModalBody.innerHTML = `

              <div>${escapeHtml(mySubmittedAnswer.answer)}</div>
              <span class="content-manage-actions">
                <button class="content-manage-button" type="button" onclick="editBookChatQuizAnswer('${escapeAttribute(question.id)}','${escapeAttribute(mySubmittedAnswer.id)}')">수정하기</button>
                <button class="content-manage-button danger" type="button" onclick="deleteBookChatQuizAnswer('${escapeAttribute(question.id)}','${escapeAttribute(mySubmittedAnswer.id)}')">삭제</button>
              </span>
            </div>
          ` : ""}
          <div class="quiz-answer-list-title">친구들이 쓴 답</div>
          ${friendAnswers.length ? `<div class="comment-list">
            ${friendAnswers.map(answer => `
              <article class="comment-card">
                <div class="comment-head">
                  <span class="comment-name">${escapeHtml(answer.name)}</span>
                  <span class="type-badge">친구 답</span>
                  <span class="comment-time">${escapeHtml(getBookChatDisplayDate(answer.savedAt || "오늘"))}</span>
                  ${teacherMode ? `<span class="content-manage-actions"><button class="content-manage-button danger" type="button" onclick="deleteBookChatQuizAnswer('${escapeAttribute(question.id)}','${escapeAttribute(answer.id)}')">삭제</button></span>` : ""}
                </div>
                <div class="thought-lines">
                  <p><strong>답</strong> ${escapeHtml(answer.answer)}</p>
                </div>
              </article>
            `).join("")}
          </div>` : '<div class="empty-list">아직 친구가 쓴 답이 없어요.</div>'}
        `;
        return;
      }

      const comments = getCommentsForQuestion(question);
      commentsModalBody.innerHTML = `
        ${renderSelectedQuestion(question, { showOriginalThoughtReactions: true })}
        ${comments.length ? `<div class="comment-list">${comments.map(comment => renderCommentCard(question,comment)).join("")}</div>` : '<div class="empty-list">아직 올라온 생각이 없어요.<br>먼저 내 생각을 써 봐요.</div>'}
      `;
    }

    function renderSelectedQuestion(question, options = {}) {
      const type = typeInfo[question.type] || {label:"질문",icon:"❓"};
      // 답쓰기 단계에는 정답 HTML 자체를 만들지 않는다. 친구 답 상세에서만
      // 호출자가 명시적으로 true를 전달해야 출제자의 답을 렌더링한다.
      const showQuizAuthorAnswer = options.showQuizAuthorAnswer === true;
      const showOriginalThoughtReactions = options.showOriginalThoughtReactions === true;
      const originalReplies = getNestedReplies(question.id, question.id);
      return `
        <article class="selected-question-box">
          <div class="selected-meta">
            <span class="selected-name">${escapeHtml(question.isMine ? "나의 질문" : question.name + "의 질문")}</span>
            <span class="type-badge">${type.icon} ${escapeHtml(type.label)}</span>
            <span class="time-text">${escapeHtml(getBookChatDisplayDate(question.createdAt))}</span>
          </div>
          <div class="selected-question">${escapeHtml(question.text)}</div>
          ${question.type === "direct" && showQuizAuthorAnswer && question.answer
            ? `<div class="quiz-author-answer">
                 <span class="quiz-author-answer-label">${question.isMine ? "나의 답" : "출제자의 답"}</span>
                 <div>${escapeHtml(getQuizAuthorAnswerText(question.answer))}</div>
               </div>`
            : ""}
          ${question.type !== "direct" && question.answer ? `<div class="selected-answer"><strong>${question.isMine ? "내가 처음 쓴 생각" : "글쓴이의 처음 생각"}</strong><br>${escapeHtml(question.answer)}</div>` : ""}
          ${question.type !== "direct" && question.answer && showOriginalThoughtReactions && !question.isMine ? `

              <button class="reply-type-button brown" type="button" onclick="openNestedReply('${escapeAttribute(question.id)}','different')">다르게 생각해요</button>
            </div>
            ${activeReplyTarget === question.id ? renderReplyWriteBox(question.id,question.id) : ""}
          ` : ""}
          ${question.type !== "direct" && showOriginalThoughtReactions && originalReplies.length ? `<div class="nested-list">${originalReplies.map(reply => renderNestedReply(question, reply)).join("")}</div>` : ""}
        </article>
      `;
    }

    /*
      책퀴즈 정답은 현재 별도 optionA/optionB 필드가 아니라 answer 문자열에
      "A. ... / B. ... (정답 A)" 형식으로 저장된다. 저장 구조는 그대로
      두고 상세 화면에서만 선택된 실제 문장 하나를 꺼내 보여준다.
    */
    function getQuizAuthorAnswerText(answer) {
      const original = String(answer || "").trim();
      const choiceMatch = original.match(/\((?:정답|선택)\s*[:：]?\s*([AB])\s*\)/i);
      const optionsMatch = original
        .replace(/\s*\((?:정답|선택)\s*[:：]?\s*[AB]\s*\)\s*$/i, "")
        .match(/^\s*A[.)]\s*([\s\S]*?)\s*\/\s*B[.)]\s*([\s\S]*?)\s*$/i);

      if (!choiceMatch || !optionsMatch) return original;
      return (choiceMatch[1].toUpperCase() === "B" ? optionsMatch[2] : optionsMatch[1]).trim();
    }

    function renderCommentCard(question,comment) {

            ${comment.isMine ? '<span class="talk-badge">내 생각</span>' : '<span class="type-badge">친구 생각</span>'}

              ${canDelete ? `<button class="content-manage-button danger" type="button" onclick="deleteBookChatThought('${escapeAttribute(question.id)}','${escapeAttribute(comment.id)}')">삭제</button>` : ""}

      if (type === "different") return { title:"다른 생각 이어 쓰기", label:"다르게 생각해요", placeholder:"나는 조금 다르게 생각해요. 그 까닭은..." };

    async function saveThought(questionId) {
      const main = document.getElementById("thoughtMain").value.trim();
      const reason = document.getElementById("thoughtReason").value.trim();
      if (!isDemoAccount() && (!main || !reason)) {
        alert("두 칸을 모두 써 주세요.");
        return;
      }

      if (isDemoAccount()) {
        const key = String(questionId);
        const others = (thoughtCache[key] || []).filter(item => !item.isMine);
        thoughtCache[key] = main || reason
          ? others.concat({ id: "demo-thought-" + Date.now(), name: teacherMode ? studentName : "김초롱", authorId: studentId, authorRole: teacherMode ? "teacher" : "student", isMine: true, isTeacher: teacherMode, main, reason, savedAt: getNowText() })
          : others;
        ensureDemoActivityExamples(questionId);
        persistDemoBookChatActivity();
        closeThoughtModal();
        renderAll();
        await openCommentsModal(questionId);
        return;

      try {
        await bookChatFetch(

          {
            method: "PUT",
            body: JSON.stringify({ main, reason })
          }
        );
        await loadQuestionActivity(questionId);
        alert("내 생각을 등록했어요.");
        closeThoughtModal();
        renderAll();
        await openCommentsModal(questionId);

    async function saveNestedReply(questionId,commentId,type) {
      const input = document.getElementById("nestedReplyInput");
      const text = input ? input.value.trim() : "";
      if (!text) {
        alert("이어 쓸 내용을 적어 주세요.");
        return;
      }
      const info = getReplyTypeInfo(type);

      if (isDemoAccount()) {
        const key = String(questionId);
        replyCache[key] = (replyCache[key] || []).concat({
          id: "demo-reply-" + Date.now(),
          parentThoughtId: String(commentId),
          name: "김초롱",
          authorId: studentId,
          authorRole: teacherMode ? "teacher" : "student",
          isMine: true,
          type: type === "different" ? "different" : "similar",
          label: info.label,
          text,
          savedAt: getNowText()
        });
        persistDemoBookChatActivity();
        activeReplyTarget = null;
        activeReplyType = null;
        renderCommentsModal();
        renderAll();
        return;
      }

      try {
        await bookChatFetch(
          `/questions/${encodeURIComponent(questionId)}/thoughts/${encodeURIComponent(commentId)}/replies`,
          {
            method: "POST",
            body: JSON.stringify({
              replyType: type === "different" ? "DIFFERENT" : "SIMILAR",
              text
            })
          }
        );
        await loadQuestionActivity(questionId);
        activeReplyTarget = null;
        activeReplyType = null;
        renderCommentsModal();
        renderAll();
      } catch (error) {
        console.error("이어쓰기를 저장하지 못했습니다.", error);

      return thoughtCache[String(question.id)] || [];
    }

      return quizAnswerCache[String(question.id)] || [];
    }

      return getQuizAnswersForQuestion(question).length;
    }

    function getNestedReplies(questionId,commentId) {
      const list = replyCache[String(questionId)] || [];
      return Array.isArray(list)
        ? list.filter(item => String(item.parentThoughtId) === String(commentId))
        : [];
    }

    function getTalkCount(question) {
      const comments = getCommentsForQuestion(question);
      const replies = replyCache[String(question.id)] || [];
      return comments.length + (Array.isArray(replies) ? replies.length : 0);
    }

    function compareQuestionsByLatest(a, b) {
      const dateDiff = String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
      if (dateDiff !== 0) return dateDiff;
      return String(b.id).localeCompare(String(a.id));
    }

    function updateCounts(visibleQuestions) {
      // 활동 내역 통계는 유형(퀴즈/생각 나누기)과 무관하게 선택한 날짜 전체를 기준으로 계산한다.
      const dateFilteredQuestions = allQuestions.filter(q => q.dateKey === selectedBookChatDate);
      const dateFilteredIds = new Set(dateFilteredQuestions.map(q => q.id));

      const thoughtCount =
        Object.entries(thoughtCache).reduce(
          (sum,[qid,list]) => dateFilteredIds.has(qid) ? sum + list.filter(item => item.isMine).length : sum,
          0
        ) +
        Object.entries(quizAnswerCache).reduce(
          (sum,[qid,list]) => dateFilteredIds.has(qid) ? sum + list.filter(item => item.isMine).length : sum,
          0
        );
      const replyCount = Object.entries(replyCache).reduce(
        (sum,[qid,list]) => dateFilteredIds.has(qid) ? sum + list.filter(item => item.isMine).length : sum,
        0
      );
      document.getElementById("questionCount").textContent = dateFilteredQuestions.length + "개";
      document.getElementById("myThoughtCount").textContent = thoughtCount + "개";
      document.getElementById("myReplyCount").textContent = replyCount + "개";
      document.getElementById("visibleQuestionCount").textContent = visibleQuestions.length + "개";
    }

    function ensureDemoActivityExamples(questionId) {
      if (!isDemoAccount()) return;
      const question = allQuestions.find(item => item.id === String(questionId));
      if (!question) return;
      const key = String(questionId);

      if (question.type === "direct") {
        const mine = (quizAnswerCache[key] || []).filter(item => item.isMine);
        const examples = getDemoQuizFriendAnswers(question);
        quizAnswerCache[key] = examples.map((item, index) => ({
          id: "demo-friend-quiz-" + key + "-" + index,
          name: item[0], isMine: false, answer: item[1], savedAt: "오늘"
        })).filter(item => !deletedDemoContentIds.has(String(item.id))).concat(mine);
        return;
      }

      const seedIdPrefix = "demo-friend-thought-" + key + "-";
      const preservedItems = (thoughtCache[key] || []).filter(item =>
        !String(item.id || "").startsWith(seedIdPrefix) &&
        !deletedDemoContentIds.has(String(item.id))
      );
      const examples = getDemoThoughtFriendComments(question);
      thoughtCache[key] = examples.map((item, index) => ({
        id: seedIdPrefix + index,
        name: item[0], isMine: false, main: item[1], reason: item[2], savedAt: "오늘"
      })).filter(item => !deletedDemoContentIds.has(String(item.id))).concat(preservedItems);
    }

    function restoreDemoBookChatActivity() {
      if (!isDemoAccount()) return;
      const saved = loadDemoState("classBookChat", null);
      if (!saved) return;
      thoughtCache = Object.assign({}, thoughtCache, saved.thoughtCache || {});
      quizAnswerCache = Object.assign({}, quizAnswerCache, saved.quizAnswerCache || {});
      replyCache = Object.assign({}, replyCache, saved.replyCache || {});
      deletedDemoContentIds = new Set(saved.deletedContentIds || []);
      Object.keys(thoughtCache).forEach(key => { thoughtCache[key] = thoughtCache[key].filter(item => !deletedDemoContentIds.has(String(item.id))).map(item => ({...item, isMine: item.authorId != null ? String(item.authorId) === String(studentId) : !!item.isMine && !teacherMode})); });
      Object.keys(quizAnswerCache).forEach(key => { quizAnswerCache[key] = quizAnswerCache[key].filter(item => !deletedDemoContentIds.has(String(item.id))).map(item => ({...item, isMine: item.authorId != null ? String(item.authorId) === String(studentId) : !!item.isMine && !teacherMode})); });
      Object.keys(replyCache).forEach(key => { replyCache[key] = replyCache[key].filter(item => !deletedDemoContentIds.has(String(item.id))).map(item => ({...item, isMine: item.authorId != null ? String(item.authorId) === String(studentId) : !!item.isMine && !teacherMode})); });
    }

    async function loadQuestionActivity(questionId) {
      const question = allQuestions.find(item => item.id === String(questionId));

      if (!question || question.moderationStatus !== "approved") {
        return;
      }

      if (question.demoApproval) return;

      try {
        if (question.type === "direct") {
          const answers = await bookChatFetch(
            `/questions/${encodeURIComponent(questionId)}/quiz-answers`
          );
          quizAnswerCache[String(questionId)] = answers.map(mapQuizAnswerItem);
          thoughtCache[String(questionId)] = [];
        } else {
          const thoughts = await bookChatFetch(
            `/questions/${encodeURIComponent(questionId)}/thoughts`
          );
          thoughtCache[String(questionId)] = thoughts.map(mapThoughtItem);
          quizAnswerCache[String(questionId)] = [];
        }

        const replies = await bookChatFetch(
          `/questions/${encodeURIComponent(questionId)}/replies`
        );
        replyCache[String(questionId)] = replies.map(mapReplyItem);
      } catch (error) {
        console.error("책수다방 활동을 불러오지 못했습니다.", error);
        thoughtCache[String(questionId)] = thoughtCache[String(questionId)] || [];
        quizAnswerCache[String(questionId)] = quizAnswerCache[String(questionId)] || [];
        replyCache[String(questionId)] = replyCache[String(questionId)] || [];
      }
    }

    async function bookChatFetch(path, options = {}) {
      const token = sessionStorage.getItem("token");

      const response = await fetch(
        teacherMode
          ? `${API_BASE_URL}/api/teachers/${studentId}/book-chat${path}`
          : `${API_BASE_URL}/api/students/${studentId}/book-chat${path}`,
        {
          method: options.method || "GET",
          headers: {
            Authorization: `Bearer ${token}`,
            ...(options.body ? { "Content-Type": "application/json" } : {})
          },
          body: options.body
        }
      );

      if (!response.ok) {
        throw new Error(`책수다방 API 실패: ${response.status}`);
      }

      if (response.status === 204) {
        return null;
      }

      return response.json();
    }

    function mapThoughtItem(item) {
      return {
        id: String(item.id),
        authorId: item.studentId,
        authorRole: item.authorRole || "student",
        name: item.studentName || "학생",
        isMine: !!item.mine,
        main: item.main || "",
        reason: item.reason || "",
        savedAt: formatBookChatDate(item.createdAt)
      };
    }

    function mapQuizAnswerItem(item) {
      return {
        id: String(item.id),
        authorId: item.studentId,
        authorRole: item.authorRole || "student",
        name: item.studentName || "학생",
        isMine: !!item.mine,
        answer: item.answer || "",
        savedAt: formatBookChatDate(item.createdAt)
      };
    }

    function mapReplyItem(item) {
      const type = String(item.replyType || "").toLowerCase();
      const info = getReplyTypeInfo(type === "different" ? "different" : "similar");

      return {
        id: String(item.id),
        parentThoughtId: String(item.parentThoughtId),
        authorId: item.studentId,
        authorRole: item.authorRole || "student",
        name: item.studentName || "학생",
        isMine: !!item.mine,
        type,
        label: info.label,
        text: item.text || "",
        savedAt: formatBookChatDate(item.createdAt)
      };
    }

    async function editBookChatThought(questionId, thoughtId) {
      const item = (thoughtCache[String(questionId)] || []).find(value => String(value.id) === String(thoughtId));
      if (!item || !item.isMine) return;
      const main = prompt("내 생각을 수정해 주세요.", item.main || "");
      if (main === null) return;
      const reason = prompt("그렇게 생각한 까닭을 수정해 주세요.", item.reason || "");
      if (reason === null) return;
      if (!main.trim() || !reason.trim()) { alert("두 칸을 모두 써 주세요."); return; }
      if (isDemoAccount()) {
        item.main = main.trim(); item.reason = reason.trim(); persistDemoBookChatActivity(); renderCommentsModal(); return;
      }
      try {
        await bookChatFetch(`/questions/${encodeURIComponent(questionId)}/thoughts/${encodeURIComponent(thoughtId)}`, {method:"PUT", body:JSON.stringify({main:main.trim(), reason:reason.trim()})});
        await loadQuestionActivity(questionId); renderCommentsModal(); renderAll();
      } catch (error) { alert("생각을 수정하지 못했어요."); }
    }

    async function editBookChatQuizAnswer(questionId, answerId) {
      const item = (quizAnswerCache[String(questionId)] || []).find(value => String(value.id) === String(answerId));
      if (!item || !item.isMine || teacherMode) return;
      const answer = prompt("내 답을 수정해 주세요.", item.answer || "");
      if (answer === null) return;
      if (!answer.trim()) { alert("답을 써 주세요."); return; }
      if (isDemoAccount()) {
        item.answer = answer.trim();
        persistDemoBookChatActivity();
        renderCommentsModal();
        return;
      }
      try {
        await bookChatFetch(`/questions/${encodeURIComponent(questionId)}/quiz-answers/${encodeURIComponent(answerId)}`, {method:"PUT", body:JSON.stringify({answer:answer.trim()})});
        await loadQuestionActivity(questionId);
        renderCommentsModal(); renderAll();
      } catch (error) { alert("답을 수정하지 못했어요."); }
    }

      const item = (quizAnswerCache[String(questionId)] || []).find(value => String(value.id) === String(answerId));
      if (!item || (!item.isMine && !teacherMode)) return;
      if (!confirm("이 답을 삭제할까요?")) return;
      if (isDemoAccount()) {
        deletedDemoContentIds.add(String(answerId));
        quizAnswerCache[String(questionId)] = (quizAnswerCache[String(questionId)] || []).filter(value => String(value.id) !== String(answerId));
        persistDemoBookChatActivity();
        if (item.isMine && !teacherMode) {
          closeCommentsModal(); renderAll();
        } else {
          renderCommentsModal(); renderAll();
        }
        return;
      }
      try {
        await bookChatFetch(`/questions/${encodeURIComponent(questionId)}/quiz-answers/${encodeURIComponent(answerId)}`, {method:"DELETE"});
        await loadQuestionActivity(questionId);
        if (item.isMine && !teacherMode) closeCommentsModal(); else renderCommentsModal();
        renderAll();
      } catch (error) { alert("답을 삭제하지 못했어요."); }
    }

    async function deleteBookChatThought(questionId, thoughtId) {
      const item = (thoughtCache[String(questionId)] || []).find(value => String(value.id) === String(thoughtId));
      if (!item || (!item.isMine && !teacherMode)) return;
      if (!confirm(teacherMode ? "이 학생의 글을 책수다방에서 삭제할까요?" : "이 글을 삭제할까요?\n삭제한 글은 다시 볼 수 없어요.")) return;
      if (isDemoAccount()) {
        deletedDemoContentIds.add(String(thoughtId));
        thoughtCache[String(questionId)] = (thoughtCache[String(questionId)] || []).filter(item => String(item.id) !== String(thoughtId));
        replyCache[String(questionId)] = (replyCache[String(questionId)] || []).filter(item => String(item.parentThoughtId) !== String(thoughtId));
        persistDemoBookChatActivity(); renderCommentsModal(); renderAll(); return;
      }
      try {
        await bookChatFetch(`/questions/${encodeURIComponent(questionId)}/thoughts/${encodeURIComponent(thoughtId)}`, {method:"DELETE"});
        await loadQuestionActivity(questionId); renderCommentsModal(); renderAll();
      } catch (error) { alert("글을 삭제하지 못했어요."); }
    }

    async function editBookChatReply(questionId, replyId) {
      const item = (replyCache[String(questionId)] || []).find(value => String(value.id) === String(replyId));
      if (!item || !item.isMine || teacherMode) return;
      const text = prompt("답글을 수정해 주세요.", item.text || "");
      if (text === null) return;
      if (!text.trim()) { alert("답글 내용을 적어 주세요."); return; }
      if (isDemoAccount()) { item.text = text.trim(); persistDemoBookChatActivity(); renderCommentsModal(); return; }
      try {
        await bookChatFetch(`/questions/${encodeURIComponent(questionId)}/replies/${encodeURIComponent(replyId)}`, {method:"PUT", body:JSON.stringify({replyType:item.type === "different" ? "DIFFERENT" : "SIMILAR", text:text.trim()})});
        await loadQuestionActivity(questionId); renderCommentsModal();
      } catch (error) { alert("답글을 수정하지 못했어요."); }
    }

    async function deleteBookChatReply(questionId, replyId) {
      const item = (replyCache[String(questionId)] || []).find(value => String(value.id) === String(replyId));
      if (!item || (!item.isMine && !teacherMode)) return;
      if (!confirm(teacherMode ? "이 학생의 답글을 삭제할까요?" : "이 글을 삭제할까요?\n삭제한 글은 다시 볼 수 없어요.")) return;
      if (isDemoAccount()) {
        deletedDemoContentIds.add(String(replyId));
        replyCache[String(questionId)] = (replyCache[String(questionId)] || []).filter(item => String(item.id) !== String(replyId));
        persistDemoBookChatActivity(); renderCommentsModal(); renderAll(); return;
      }
      try {
        await bookChatFetch(`/questions/${encodeURIComponent(questionId)}/replies/${encodeURIComponent(replyId)}`, {method:"DELETE"});
        await loadQuestionActivity(questionId); renderCommentsModal(); renderAll();
      } catch (error) { alert("답글을 삭제하지 못했어요."); }
    }

    function getNowText() {
      const now = new Date();
      return String(now.getMonth()+1).padStart(2,"0") + "." + String(now.getDate()).padStart(2,"0") + " " + String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g,char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g,"&#96;");
    }

    function goHome() { location.href = "individual-reading.html"; }
    function goClassReading() { location.href = "class-reading.html"; }
    function goTeacherPractice() {
      sessionStorage.removeItem("teacherMode");
      sessionStorage.removeItem("teacherBookChatReturn");
      location.href = "../teacher/book-chat-manage.html";
    }

    function showTeacherButtonWhenNeeded() {
      document.body.classList.toggle("teacher-mode", teacherMode);
      const button = document.getElementById("teacherReturnButton");
      if (button) button.hidden = !teacherMode;
    }

    window.addEventListener("keydown",event => {
      if (event.key !== "Escape") return;
      if (!thoughtModal.classList.contains("hidden")) closeThoughtModal();
      if (!commentsModal.classList.contains("hidden")) closeCommentsModal();
    });

    function fitFixedStage() {
      const baseWidth = 1920;
      const baseHeight = 1080;
      const scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
      const left = Math.max(0, (window.innerWidth - baseWidth * scale) / 2);
      const top = Math.max(0, (window.innerHeight - baseHeight * scale) / 2);

      document.documentElement.style.setProperty("--stage-scale", String(scale));
      document.documentElement.style.setProperty("--stage-left", left + "px");
      document.documentElement.style.setProperty("--stage-top", top + "px");
    }

    window.addEventListener("resize", fitFixedStage);
    window.addEventListener("load", fitFixedStage);
    fitFixedStage();

  </script>
</body>
</html>
