<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문답책 - 질문 나누기</title>

  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap");

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #3f2615;
      background:
        linear-gradient(180deg, rgba(255, 246, 222, 0.48), rgba(255, 232, 184, 0.50)),
        url("../assets/images/class-reading/class-reading-question-bg.png");
      background-size: cover;
      background-position: center;
    }

    button, textarea, select { font-family: inherit; }
    button { cursor: pointer; }

    .page {
      min-height: 100vh;
      padding: 18px 26px 20px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.68), transparent 34%),
        linear-gradient(90deg, rgba(255, 246, 224, 0.72), rgba(255, 255, 255, 0.18), rgba(255, 246, 224, 0.72));
    }

    .shell { width: min(1180px, calc(100vw - 52px)); margin: 0 auto; }

    .top {
      display: grid;
      grid-template-columns: 220px 1fr 245px;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.8px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.65);
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(180deg, #bf8740, #6d3a0d);
      color: #fff5d6;
      border: 1px solid rgba(255, 224, 158, 0.78);
      box-shadow: 0 8px 16px rgba(91, 47, 10, 0.18);
      font-size: 22px;
    }

    .title-area { text-align: center; }

    .main-title {
      font-family: "Noto Serif KR", serif;
      color: #4b2a13;
      font-size: 44px;
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -1.5px;
      text-shadow: 0 2px 0 rgba(255,255,255,0.72), 0 8px 18px rgba(122,72,25,0.12);
    }

    .main-desc { margin-top: 7px; color: #6e4b2e; font-size: 17px; font-weight: 850; }
    .top-actions { display: flex; justify-content: flex-end; gap: 9px; }

    .nav-button {
      height: 43px;
      padding: 0 16px;
      border-radius: 15px;
      border: 1px solid rgba(177, 122, 57, 0.34);
      background: rgba(255, 250, 238, 0.82);
      color: #4f2e16;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 7px 14px rgba(116,71,20,0.10), inset 0 1px 0 rgba(255,255,255,0.58);
    }

    .nav-button.primary {
      background: linear-gradient(180deg, #e4ad45, #b06d0d);
      color: #fff9ec;
      border-color: rgba(176, 111, 25, 0.40);
    }

    .hero {
      display: grid;
      grid-template-columns: 0.95fr 1fr;
      gap: 18px;
      align-items: stretch;
      margin-bottom: 16px;
    }

    .hero-left, .activity-card, .filter-card, .board-card, .selected-card {
      border-radius: 24px;
      border: 1px solid rgba(193, 133, 61, 0.34);
      background: linear-gradient(180deg, rgba(255,254,249,0.92), rgba(255,247,231,0.90));
      box-shadow: 0 14px 28px rgba(123,75,25,0.15), inset 0 1px 0 rgba(255,255,255,0.72);
      backdrop-filter: blur(2px);
    }

    .hero-left {
      display: grid;
      grid-template-columns: 150px 1fr;
      align-items: center;
      min-height: 160px;
      padding: 16px 22px;
    }

    .lumi-img {
      width: 150px;
      align-self: end;
      filter: drop-shadow(0 12px 15px rgba(112,63,15,0.16)) drop-shadow(0 0 15px rgba(255,198,94,0.14));
    }

    .speech-box {
      position: relative;
      padding: 21px 26px;
      border-radius: 22px;
      border: 1px solid rgba(186, 130, 58, 0.28);
      background: rgba(255, 254, 248, 0.78);
      color: #4f2d15;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.55;
      word-break: keep-all;
    }

    .speech-box::before {
      content: "";
      position: absolute;
      left: -14px;
      top: 50%;
      width: 0;
      height: 0;
      transform: translateY(-50%);
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-right: 14px solid rgba(255, 254, 248, 0.92);
    }

    .activity-card { padding: 22px 24px; display: flex; flex-direction: column; justify-content: center; }

    .activity-title {
      margin-bottom: 16px;
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }

    .stat-box {
      min-height: 76px;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid rgba(192, 130, 55, 0.28);
      background: rgba(255, 255, 255, 0.54);
    }

    .stat-label { color: #8b6a46; font-size: 14px; font-weight: 900; }
    .stat-value { margin-top: 6px; color: #4a2a10; font-size: 28px; font-weight: 900; }
    .activity-desc { color: #6f5031; font-size: 16px; font-weight: 820; line-height: 1.52; word-break: keep-all; }

    .filter-card { margin-bottom: 14px; padding: 14px 18px; }
    .filter-row { display: grid; grid-template-columns: repeat(5, 1fr) 150px; gap: 10px; align-items: center; }

    .filter-button, .sort-select {
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(192, 130, 55, 0.34);
      background: rgba(255, 252, 245, 0.84);
      color: #5a3820;
      font-size: 15px;
      font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.75);
    }

    .filter-button.active {
      border-color: rgba(190,125,32,0.82);
      background: linear-gradient(180deg, #f3c978, #c9902d);
      color: #4a2a10;
      box-shadow: 0 7px 13px rgba(176,112,25,0.16);
    }

    .sort-select { padding: 0 12px; outline: none; }

    .board-grid { display: grid; grid-template-columns: 0.95fr 1fr; gap: 16px; align-items: start; }
    .board-card, .selected-card { padding: 22px 24px; min-width: 0; }

    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }

    .section-title {
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    .count-pill {
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid rgba(190,130,55,0.26);
      background: rgba(255,249,235,0.88);
      color: #8c5c1e;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .friend-list { display: grid; gap: 10px; max-height: 500px; overflow-y: auto; padding-right: 4px; }

    .friend-question-button {
      width: 100%;
      border: 1px solid rgba(186,130,58,0.26);
      border-radius: 18px;
      background: rgba(255,255,255,0.66);
      padding: 15px 17px;
      text-align: left;
      color: #4d321a;
      transition: 0.15s ease;
    }

    .friend-question-button:hover { transform: translateY(-1px); box-shadow: 0 8px 14px rgba(123,75,25,0.10); }
    .friend-question-button.active { border-color: rgba(83,133,60,0.65); background: rgba(243,255,236,0.82); box-shadow: 0 0 0 3px rgba(110,169,80,0.12), inset 0 1px 0 rgba(255,255,255,0.72); }

    .question-top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
    .student-name { color: #4b2a13; font-size: 17px; font-weight: 900; }
    .type-badge { display: inline-block; padding: 4px 9px; border-radius: 999px; background: rgba(222,168,79,0.18); color: #8b5a1d; font-size: 12px; font-weight: 900; }
    .time-text { margin-left: auto; color: #9c7141; font-size: 13px; font-weight: 800; }
    .question-text { color: #3f2615; font-size: 18px; font-weight: 900; line-height: 1.45; word-break: keep-all; }

    .shared-answer-preview {
      margin-top: 9px;
      color: #6f4e2f;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.45;
      word-break: keep-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .shared-answer-preview strong { color: #4f7130; font-weight: 900; }

    .empty-list, .selected-empty {
      display: grid;
      place-items: center;
      border-radius: 18px;
      border: 1px dashed rgba(177,122,57,0.30);
      background: rgba(255,255,255,0.50);
      color: #92745a;
      font-size: 16px;
      font-weight: 850;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }
    .empty-list { min-height: 220px; }
    .selected-empty { min-height: 440px; font-size: 18px; }

    .selected-question-box, .reply-box {
      padding: 18px 19px;
      border-radius: 18px;
      border: 1px solid rgba(186,130,58,0.28);
      background: rgba(255,255,255,0.64);
    }

    .selected-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .selected-name { color: #4b2a13; font-size: 18px; font-weight: 900; }
    .selected-question { color: #3f2615; font-size: 24px; font-weight: 900; line-height: 1.45; word-break: keep-all; }

    .selected-answer {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(243,255,236,0.70);
      border: 1px solid rgba(83,133,60,0.20);
      color: #4f3219;
      font-size: 16px;
      font-weight: 820;
      line-height: 1.5;
      word-break: keep-all;
    }
    .selected-answer strong { color: #4f7130; font-weight: 900; }
/* 다른 친구들의 답 영역입니다. */
.other-reply-box {
  margin-top: 14px;
  padding: 16px 18px;
  border-radius: 18px;
  border: 1px solid rgba(186, 130, 58, 0.24);
  background: rgba(255, 250, 238, 0.76);
}

.other-reply-head {
  margin-bottom: 11px;
}

.other-reply-desc {
  margin-top: -4px;
  color: #7a5a3b;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.4;
  word-break: keep-all;
}

.other-reply-list {
  display: grid;
  gap: 9px;
}

.other-reply-item {
  padding: 12px 14px;
  border-radius: 15px;
  border: 1px solid rgba(186, 130, 58, 0.18);
  background: rgba(255, 255, 255, 0.64);
}

.other-reply-name {
  margin-bottom: 5px;
  color: #9c7141;
  font-size: 14px;
  font-weight: 900;
}

.other-reply-text {
  color: #4f3219;
  font-size: 15px;
  font-weight: 800;
  line-height: 1.45;
  word-break: keep-all;
}
    .reply-box { margin-top: 14px; background: rgba(255,255,250,0.72); }
    .reply-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; gap: 10px; }
    .reply-title { color: #4b2a13; font-size: 18px; font-weight: 900; }
    .reply-count { color: #9c7141; font-size: 14px; font-weight: 850; }

    .reply-input {
      width: 100%;
      height: 150px;
      resize: none;
      outline: none;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(196,138,69,0.34);
      background: rgba(255,255,255,0.74);
      color: #452713;
      font-size: 17px;
      font-weight: 750;
      line-height: 1.5;
    }

    .reply-input:focus { border-color: rgba(203,139,44,0.72); box-shadow: 0 0 0 3px rgba(216,162,68,0.13), inset 0 1px 0 rgba(255,255,255,0.72); }

    .reply-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .plain-button, .main-button { height: 50px; border-radius: 16px; font-size: 17px; font-weight: 900; }
    .plain-button { border: 1px solid rgba(175,119,53,0.34); background: rgba(255,252,245,0.78); color: #654220; }
    .main-button { border: 1px solid rgba(176,111,25,0.40); background: linear-gradient(180deg, #e4ad45, #b06d0d); color: #fff9ec; box-shadow: 0 7px 0 rgba(105,57,5,0.68), inset 0 1px 0 rgba(255,255,255,0.32); }

    .feedback-box { margin-top: 12px; padding: 13px 15px; border-radius: 15px; border: 1px solid rgba(209,146,48,0.42); background: rgba(255,250,238,0.78); color: #5b3a1f; font-size: 15px; font-weight: 850; line-height: 1.45; word-break: keep-all; }
    .feedback-box.good { border-color: rgba(97,155,72,0.40); background: rgba(250,255,245,0.78); color: #355628; }
    .saved-replies { margin-top: 14px; display: grid; gap: 9px; }
    .reply-item { padding: 12px 14px; border-radius: 15px; border: 1px solid rgba(186,130,58,0.20); background: rgba(255,255,255,0.58); color: #4f3219; font-size: 15px; font-weight: 800; line-height: 1.45; word-break: keep-all; }

    .bottom-note { margin-top: 14px; text-align: center; color: #7e5d3a; font-size: 16px; font-weight: 850; }

    @media (max-width: 1050px) {
      .top, .hero, .board-grid { grid-template-columns: 1fr; }
      .top-actions { justify-content: center; }
      .filter-row { grid-template-columns: repeat(2, 1fr); }
      .hero-left { grid-template-columns: 130px 1fr; }
      .lumi-img { width: 130px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="shell">
      <header class="top">
        <div class="brand">
          <div class="brand-icon">📖</div>
          <span>문답책</span>
        </div>

        <div class="title-area">
          <h1 class="main-title">질문 나누기</h1>
          <p class="main-desc">친구들이 만든 질문을 읽고, 내 생각을 나눠보아요!</p>
        </div>

        <div class="top-actions">
          <button class="nav-button" type="button" onclick="goHome()">⌂ 홈으로</button>
          <button class="nav-button primary" type="button" onclick="goClassReading()">우리반 책읽기</button>
        </div>
      </header>

      <section class="hero">
        <article class="hero-left">
          <img class="lumi-img" src="../assets/images/class-reading/class-reading-lumi-feedback.png" alt="루미">
          <div class="speech-box">
  친구들이 만든 질문을 살펴보고<br>
  내 생각을 답으로 적어보자!
</div>
        </article>

        <article class="activity-card">
          <h2 class="activity-title">질문 나누기 활동</h2>
          <div class="stat-row">
            <div class="stat-box"><p class="stat-label">참여한 친구</p><p class="stat-value" id="friendCount">0명</p></div>
            <div class="stat-box"><p class="stat-label">공유된 질문</p><p class="stat-value" id="questionCount">0개</p></div>
            <div class="stat-box"><p class="stat-label">내가 답한 수</p><p class="stat-value" id="replyCount">0개</p></div>
          </div>
          <p class="activity-desc">친구들이 나눈 질문과 답을 살펴보고, 나도 내 생각을 답으로 적어 봐요.</p>
        </article>
      </section>

      <section class="filter-card">
        <div class="filter-row">
          <button class="filter-button active" type="button" data-type="all">전체 보기</button>
          <button class="filter-button" type="button" data-type="direct">🔍 바로 답 찾기</button>
          <button class="filter-button" type="button" data-type="infer">💡 답 짐작하기</button>
          <button class="filter-button" type="button" data-type="feeling">💛 생각·느낌</button>
          <button class="filter-button" type="button" data-type="life">🔗 내 삶 연결</button>
          <select class="sort-select" id="sortSelect">
            <option value="latest">최신순</option>
            <option value="name">이름순</option>
          </select>
        </div>
      </section>

      <section class="board-grid">
        <article class="board-card">
          <div class="section-head">
            <h2 class="section-title">친구 질문 카드</h2>
            <span class="count-pill" id="visibleQuestionCount">0개</span>
          </div>
          <div class="friend-list" id="friendList"></div>
        </article>

        <article class="selected-card">
          <div class="section-head">
            <h2 class="section-title">선택한 질문</h2>
            <span class="count-pill">내 생각 쓰기</span>
          </div>
          <div id="selectedArea"></div>
        </article>
      </section>

     
    </div>
  </main>

  <script>
    const studentId = sessionStorage.getItem("studentId") || "student-demo";
    const studentName = sessionStorage.getItem("name") || "나";

    const typeInfo = {
      direct: { label: "바로 답 찾기", icon: "🔍" },
      infer: { label: "답 짐작하기", icon: "💡" },
      feeling: { label: "생각·느낌", icon: "💛" },
      life: { label: "내 삶 연결", icon: "🔗" }
    };

    let currentType = "all";
    let selectedQuestionId = null;
    let allQuestions = [];

    const filterButtons = document.querySelectorAll(".filter-button");
    const sortSelect = document.getElementById("sortSelect");
    const friendList = document.getElementById("friendList");
    const selectedArea = document.getElementById("selectedArea");

    initPage();

    function initPage() {
      allQuestions = buildQuestionData();
      if (allQuestions.length > 0) selectedQuestionId = allQuestions[0].id;
      bindEvents();
      renderAll();
    }

    function bindEvents() {
      filterButtons.forEach(function(button) {
        button.addEventListener("click", function() {
          filterButtons.forEach(function(btn) { btn.classList.remove("active"); });
          button.classList.add("active");
          currentType = button.dataset.type;
          selectedQuestionId = null;
          const filtered = getFilteredQuestions();
          if (filtered.length > 0) selectedQuestionId = filtered[0].id;
          renderAll();
        });
      });
      sortSelect.addEventListener("change", renderAll);
    }
// 친구들이 같은 질문에 답했다고 가정한 예시 답변입니다.
// 나중에 백엔드가 연결되면 서버에서 불러오는 부분으로 바꾸면 됩니다.
function getOtherFriendReplies(question) {
  const type = question.type;
    // 내가 만든 질문을 선택한 경우:
  // 내 질문에 친구들이 답을 달았다고 가정해서 보여줍니다.
  if (question.isMine) {
    return [
      {
        name: "민지",
        answer: "나는 이 질문을 보고 비슷한 경험이 떠올랐어. 나도 그런 상황이라면 마음이 복잡했을 것 같아."
      },
      {
        name: "서준",
        answer: "질문이 내 경험과 연결돼서 좋았어. 왜 그런 마음이 들었는지 더 생각해 볼 수 있었어."
      },
      {
        name: "하윤",
        answer: "나는 네 질문을 읽고 주인공의 마음을 더 자세히 상상해 보게 됐어."
      }
    ];
  }

  if (type === "direct") {
    return [
      {
        name: "민준",
        answer: "나는 책 속 내용에서 바로 답을 찾을 수 있어서 이해하기 쉬웠어."
      },
      {
        name: "서연",
        answer: "질문에 나온 장면을 다시 읽어 보니까 답을 찾을 수 있었어."
      }
    ];
  }

  if (type === "infer") {
    return [
      {
        name: "도윤",
        answer: "나는 주인공의 행동을 보고 그런 마음이었을 거라고 짐작했어."
      },
      {
        name: "하윤",
        answer: "글에 나온 단서를 보면 그렇게 생각한 이유를 알 수 있을 것 같아."
      }
    ];
  }

  if (type === "feeling") {
    return [
      {
        name: "지민",
        answer: "나는 이 장면을 읽고 조금 슬프기도 하고 공감이 되었어."
      },
      {
        name: "수아",
        answer: "주인공의 마음이 이해돼서 나도 비슷한 기분이 들었어."
      }
    ];
  }

  if (type === "life") {
    return [
      {
        name: "현우",
        answer: "나도 비슷한 경험이 있어서 이 질문에 더 공감이 되었어."
      },
      {
        name: "가은",
        answer: "내 생활에서도 이런 일이 있었던 것 같아서 떠올려 볼 수 있었어."
      }
    ];
  }

  return [];
}
function renderOtherFriendReplies(question) {
  const replies = getOtherFriendReplies(question);

  if (replies.length === 0) {
    return "";
  }

  // 내가 만든 질문을 선택했을 때와 친구 질문을 선택했을 때 제목을 다르게 보여줍니다.
  const title = question.isMine
    ? "내 질문에 달린 친구들의 답"
    : "다른 친구들의 답";

  

  return `
    <article class="other-reply-box">
      <div class="other-reply-head">
        <h3 class="other-reply-title">${title}</h3>
        
      </div>

      <div class="other-reply-list">
        ${replies.map(function(reply) {
          return `
            <div class="other-reply-item">
              <p class="other-reply-name">${escapeHtml(reply.name)}의 답</p>
              <p class="other-reply-text">${escapeHtml(reply.answer)}</p>
            </div>
          `;
        }).join("")}
      </div>
    </article>
  `;
}
    function buildQuestionData() {
      const myQuestions = loadMySharedQuestions();
      const mockFriends = [
        { name: "민지", questions: [
          { text: "주인공은 왜 숲으로 들어갔을까?", answer: "주인공이 잃어버린 물건을 찾기 위해 숲으로 들어갔을 것 같아요.", type: "direct", createdAt: "06.11 09:10" },
          { text: "나라면 주인공처럼 행동했을까? 왜?", answer: "나라면 조금 무서웠겠지만 친구를 도와주려고 했을 것 같아요.", type: "life", createdAt: "06.11 09:15" }
        ]},
        { name: "서준", questions: [
          { text: "주인공의 마음은 언제 가장 많이 바뀌었을까?", answer: "친구의 마음을 알게 되었을 때 주인공의 마음이 가장 많이 바뀌었을 것 같아요.", type: "feeling", createdAt: "06.11 09:20" },
          { text: "주인공은 왜 친구를 도와주었을까?", answer: "친구가 힘들어하는 모습을 보고 그냥 지나칠 수 없었기 때문이라고 생각해요.", type: "infer", createdAt: "06.11 09:23" }
        ]},
        { name: "하윤", questions: [
          { text: "이 이야기에서 가장 궁금한 부분은 무엇인가요?", answer: "주인공이 다음에는 어떤 선택을 하게 될지 궁금해요.", type: "feeling", createdAt: "06.11 09:27" },
          { text: "이 책이 나에게 알려준 것은 무엇일까?", answer: "작은 선택도 친구에게 큰 도움이 될 수 있다는 것을 알려준 것 같아요.", type: "life", createdAt: "06.11 09:31" }
        ]}
      ];

      const people = [];
      if (myQuestions) people.push(myQuestions);
      mockFriends.forEach(function(friend) { people.push(friend); });

      let flattened = [];
      people.forEach(function(person) {
        person.questions.forEach(function(question, index) {
          const normalizedType = normalizeType(question.type);
          flattened.push({
            id: person.name + "-" + index + "-" + question.text,
            name: person.name,
            isMine: person.isMine || false,
            text: question.text,
            answer: question.answer || "",
            type: normalizedType,
            typeLabel: question.typeLabel || getTypeLabel(normalizedType),
            createdAt: question.createdAt || ""
          });
        });
      });
      return flattened;
    }

    function loadMySharedQuestions() {
  // 1순위: 질문 만들기 화면에서 '질문 나누기'로 선택한 질문을 불러옵니다.
  const sharedData = localStorage.getItem("mySharedQuestions");

  if (sharedData) {
    try {
      const parsedData = JSON.parse(sharedData);

      if (
        parsedData &&
        Array.isArray(parsedData.questions) &&
        parsedData.questions.length > 0
      ) {
        return {
          name: parsedData.name || studentName,
          isMine: true,
          questions: parsedData.questions
        };
      }
    } catch (error) {
      console.error("공유한 내 질문 데이터를 불러오지 못했습니다.", error);
    }
  }

  // 2순위: 오늘 만든 질문 저장소에서 내 질문을 불러옵니다.
  // 질문 만들기 화면에서 저장한 질문이 있으면, 질문 나누기 화면에도 보여줍니다.
  const todayInfo = getTodayInfoForQuestionShare();
  const todayQuestionKey = "classReadingQuestions_" + studentId + "_" + todayInfo.key;
  const todayQuestionData = localStorage.getItem(todayQuestionKey);

  if (!todayQuestionData) {
    return null;
  }

  try {
    const parsedQuestions = JSON.parse(todayQuestionData);

    if (!Array.isArray(parsedQuestions) || parsedQuestions.length === 0) {
      return null;
    }

    return {
      name: studentName || "나",
      isMine: true,
      questions: parsedQuestions.map(function(question) {
        return {
          text: question.text,
          answer: question.answer,
          type: question.type,
          typeLabel: question.typeLabel,
          createdAt: question.dateText
            ? question.dateText + " " + (question.createdAt || "")
            : todayInfo.display
        };
      })
    };
  } catch (error) {
    console.error("오늘 만든 내 질문 데이터를 불러오지 못했습니다.", error);
    return null;
  }
}
function getTodayInfoForQuestionShare() {
  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const date = String(today.getDate()).padStart(2, "0");
  const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
  const day = dayNames[today.getDay()];

  return {
    key: year + "-" + month + "-" + date,
    display: year + "." + month + "." + date + " (" + day + ")"
  };
}
    function normalizeType(type) {
      if (type === "opinion") return "feeling";
      if (type === "connect") return "life";
      return type || "direct";
    }

    function getTypeLabel(type) { return typeInfo[type] ? typeInfo[type].label : "질문"; }

    function renderAll() {
      const filteredQuestions = getFilteredQuestions();
      if (!selectedQuestionId && filteredQuestions.length > 0) selectedQuestionId = filteredQuestions[0].id;
      renderQuestionList(filteredQuestions);
      renderSelectedQuestion(filteredQuestions);
      updateCounts(filteredQuestions);
    }

    function getFilteredQuestions() {
      let questions = allQuestions.slice();
      if (currentType !== "all") questions = questions.filter(function(question) { return question.type === currentType; });
      if (sortSelect.value === "name") questions.sort(function(a,b) { return a.name.localeCompare(b.name, "ko"); });
      else questions.sort(function(a,b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });
      return questions;
    }

    function renderQuestionList(questions) {
      if (questions.length === 0) {
        friendList.innerHTML = '<div class="empty-list">이 유형으로 공유된 질문이 아직 없어요.</div>';
        return;
      }

      friendList.innerHTML = questions.map(function(question) {
        const isActive = selectedQuestionId === question.id;
        const type = typeInfo[question.type] || { label: "질문", icon: "❓" };
        return `
          <button class="friend-question-button ${isActive ? "active" : ""}" type="button" onclick="selectQuestion('${escapeAttribute(question.id)}')">
            <div class="question-top">
              <span class="student-name">${escapeHtml(question.isMine ? "나의 질문" : question.name)}</span>
              <span class="type-badge">${type.icon} ${escapeHtml(type.label)}</span>
              <span class="time-text">${escapeHtml(question.createdAt || "오늘")}</span>
            </div>
            <div class="question-text">${escapeHtml(question.text)}</div>
            ${question.answer ? `<div class="shared-answer-preview"><strong>${question.isMine ? "내 답" : "친구의 답"}:</strong> ${escapeHtml(question.answer)}</div>` : ""}
          </button>
        `;
      }).join("");
    }

    function renderSelectedQuestion(questions) {
      const selectedQuestion = questions.find(function(question) { return question.id === selectedQuestionId; });
      if (!selectedQuestion) {
        selectedArea.innerHTML = '<div class="selected-empty">왼쪽에서 질문을 하나 선택해 봐요.<br>선택한 질문과 답을 자세히 볼 수 있어요.</div>';
        return;
      }

      const type = typeInfo[selectedQuestion.type] || { label: "질문", icon: "❓" };
      const savedReply = loadReply(selectedQuestion.id);
      selectedArea.innerHTML = `
        <article class="selected-question-box">
          <div class="selected-meta">
            <span class="selected-name">${escapeHtml(selectedQuestion.isMine ? "나의 질문" : selectedQuestion.name + "의 질문")}</span>
            <span class="type-badge">${type.icon} ${escapeHtml(type.label)}</span>
            <span class="time-text">${escapeHtml(selectedQuestion.createdAt || "오늘")}</span>
          </div>
          <div class="selected-question">${escapeHtml(selectedQuestion.text)}</div>
          ${selectedQuestion.answer ? `<div class="selected-answer"><strong>${selectedQuestion.isMine ? "내가 쓴 답" : "친구가 쓴 답"}</strong><br>${escapeHtml(selectedQuestion.answer)}</div>` : ""}
                </article>

        ${renderOtherFriendReplies(selectedQuestion)}

        <article class="reply-box">
          <div class="reply-head">
            <label class="reply-title" for="replyInput">이 질문에 대한 내 생각 쓰기</label>
            <span class="reply-count" id="replyCountText">0 / 400자</span>
          </div>
          <textarea class="reply-input" id="replyInput" maxlength="400" placeholder="친구의 질문과 답을 읽고 내 생각을 적어 봐요.">${escapeTextarea(savedReply)}</textarea>
          <div class="reply-actions">
            <button class="plain-button" type="button" onclick="clearReply()">지우기</button>
            <button class="main-button" type="button" onclick="saveReply()">답변 저장</button>
          </div>
          <div class="feedback-box" id="feedbackBox">친구의 질문을 읽고 네 생각을 적어 봐. 정답이 아니어도 괜찮아!</div>
          <div class="saved-replies" id="savedReplies"></div>
        </article>
      `;
      bindReplyInput();
      renderSavedReplies(selectedQuestion.id);
    }

    function bindReplyInput() {
      const input = document.getElementById("replyInput");
      const count = document.getElementById("replyCountText");
      if (!input || !count) return;
      function update() { count.textContent = input.value.length + " / 400자"; }
      input.addEventListener("input", update);
      update();
    }

    function updateCounts(filteredQuestions) {
      const allNames = new Set(allQuestions.map(function(question) { return question.name; }));
      const replyData = getAllReplies();
      document.getElementById("friendCount").textContent = allNames.size + "명";
      document.getElementById("questionCount").textContent = allQuestions.length + "개";
      document.getElementById("replyCount").textContent = Object.keys(replyData).length + "개";
      document.getElementById("visibleQuestionCount").textContent = filteredQuestions.length + "개";
    }

    function selectQuestion(id) { selectedQuestionId = id; renderAll(); }

    function saveReply() {
      const selectedQuestion = allQuestions.find(function(question) { return question.id === selectedQuestionId; });
      const input = document.getElementById("replyInput");
      const feedbackBox = document.getElementById("feedbackBox");
      if (!selectedQuestion || !input || !feedbackBox) return;
      const reply = input.value.trim();
      feedbackBox.classList.remove("good");
      if (!reply) { feedbackBox.textContent = "답이 아직 비어 있어. 친구 질문을 보고 떠오른 생각을 한 문장으로 적어 봐!"; return; }
      if (reply.length < 8) { feedbackBox.textContent = "답이 조금 짧아. 왜 그렇게 생각했는지 조금 더 자세히 적어 봐!"; return; }
      const replies = getAllReplies();
      replies[selectedQuestion.id] = { questionId: selectedQuestion.id, question: selectedQuestion.text, originalAnswer: selectedQuestion.answer, friendName: selectedQuestion.name, myReply: reply, savedAt: getTodayText() };
      localStorage.setItem(getReplyKey(), JSON.stringify(replies));
      feedbackBox.classList.add("good");
      feedbackBox.textContent = "좋아! 친구 질문과 답을 읽고 네 생각을 잘 이어서 적었어.";
      renderSavedReplies(selectedQuestion.id);
      updateCounts(getFilteredQuestions());
    }

    function clearReply() {
      const input = document.getElementById("replyInput");
      const feedbackBox = document.getElementById("feedbackBox");
      if (!input || !feedbackBox) return;
      input.value = "";
      feedbackBox.classList.remove("good");
      feedbackBox.textContent = "입력칸을 비웠어. 다시 네 생각을 적어 봐.";
      bindReplyInput();
    }

    function renderSavedReplies(questionId) {
      const area = document.getElementById("savedReplies");
      const replies = getAllReplies();
      const reply = replies[questionId];
      if (!area) return;
      if (!reply) { area.innerHTML = ""; return; }
      area.innerHTML = `<div class="reply-item"><strong>내가 저장한 답:</strong><br>${escapeHtml(reply.myReply)}</div>`;
    }

    function loadReply(questionId) {
      const replies = getAllReplies();
      return replies[questionId] ? (replies[questionId].myReply || "") : "";
    }

    function getAllReplies() {
      const saved = localStorage.getItem(getReplyKey());
      if (!saved) return {};
      try { return JSON.parse(saved); } catch (error) { return {}; }
    }

    function getReplyKey() { return "friendQuestionReplies_" + studentId; }

    function getTodayText() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const date = String(now.getDate()).padStart(2, "0");
      const hour = String(now.getHours()).padStart(2, "0");
      const minute = String(now.getMinutes()).padStart(2, "0");
      return month + "." + date + " " + hour + ":" + minute;
    }

    function goHome() { location.href = "./home.html"; }
    function goClassReading() { location.href = "./class-reading.html"; }

    function escapeHtml(text) {
      return String(text || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }
    function escapeAttribute(text) { return escapeHtml(text).replaceAll("`", "&#096;"); }
    function escapeTextarea(text) { return String(text || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"); }
  </script>
  <script src="../js/fixed-stage.js"></script>
</body>
