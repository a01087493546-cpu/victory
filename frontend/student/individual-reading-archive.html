<!--
  파일명: individual-reading-archive.html
  역할: 문답책 개별읽기 - 나의 독서 보관함 화면입니다.

  이 화면에서 하는 일:
  1. 읽은 책을 책 단위로 보여줍니다.
  2. 책을 누르면 읽기 전 / 읽는 중 / 읽은 후 / 간추린 내용 기록을 나누어 확인합니다.
  3. 현재는 sessionStorage에 저장된 데이터를 불러옵니다.
  4. 저장된 데이터가 없을 때는 화면 확인용 예시 데이터를 보여줍니다.
-->

    .ira-logo {

    .ira-logo img {

    .ira-logo span {

      font-size: 15px;
      font-weight: 950;

    /* 상단 소개 영역을 작고 효율적으로 정리합니다. */
    .ira-hero-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 22px 30px;

    .ira-hero-card h1 {
      margin: 0;
      color: #4d2b10;
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      font-size: 36px;
      font-weight: 950;
      line-height: 1.13;
      letter-spacing: -0.055em;
      word-break: keep-all;
    }

    .ira-hero-card p {
      margin: 10px 0 0;
      color: #6f4720;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.45;
      word-break: keep-all;
    }

    .ira-hero-summary {
      min-width: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px 28px;

      border: 1px solid rgba(181, 117, 37, 0.18);
      text-align: center;
    }

    .ira-hero-summary strong {

      font-weight: 950;
      white-space: nowrap;
    }

    .ira-view {
      display: none;

    .ira-view.active {
      display: block;
    }

    /* 책 목록 영역 비중을 키우기 위해 패널 높이와 여백을 다시 잡습니다. */
    .ira-panel {
      min-height: 560px;
      padding: 30px 32px;
      border: 1px solid rgba(180, 116, 34, 0.22);
      border-radius: 32px;
      background: rgba(255, 251, 242, 0.88);
      box-shadow:
        0 18px 34px rgba(92, 58, 18, 0.13),
        inset 0 0 0 1px rgba(255,255,255,0.58);
      backdrop-filter: blur(8px);
    }

    .ira-section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .ira-section-head h2 {
      margin: 0;
      color: #4d2b10;
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      font-size: 32px;
      font-weight: 950;
      letter-spacing: -0.05em;
    }

    .ira-section-head p {
      margin: 6px 0 0;
      color: #795024;
      font-size: 15px;
      font-weight: 850;
    }

    .ira-book-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    .ira-book-card {
      min-height: 250px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: 24px;
     border: 2px solid rgba(181, 117, 37, 0.26);
      border-radius: 28px;
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 226, 145, 0.20), transparent 42%),
        rgba(255, 252, 244, 0.90);
      box-shadow: 0 12px 22px rgba(101, 63, 18, 0.08);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .ira-book-card:hover {
      transform: translateY(-4px);
      border-color: rgba(187, 113, 26, 0.42);
      box-shadow: 0 18px 30px rgba(101, 63, 18, 0.13);
    }

    .ira-book-card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .ira-book-title {
      margin: 0;
      color: #4d2b10;
      font-size: 32px;
      font-weight: 950;
      letter-spacing: -0.045em;
      word-break: keep-all;
    }

    .ira-book-date {
      flex: 0 0 auto;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1.5px solid rgba(181, 117, 37, 0.24);
      background: rgba(255, 246, 220, 0.92);
      color: #9a631e;
      font-size: 12px;
      font-weight: 950;
      white-space: nowrap;
    }

    /* =========================================================
   읽은 책 카드 정보
   - 책 제목, 지은이, 완독 날짜, 별점, 대표 질문을 보여줍니다.
   ========================================================= */

.ira-book-meta-line {
  display: grid;
  gap: 7px;
}

.ira-book-author {
  margin: 0;
  color: #8a5b22;
  font-size: 14px;
  font-weight: 900;
}

.ira-book-finish-info {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.ira-book-info-pill {
  width: fit-content;
  padding: 7px 11px;
  border-radius: 999px;
  background: rgba(255, 247, 228, 0.96);
border: 1.5px solid rgba(181, 117, 37, 0.22);
  color: #6a451c;
  font-size: 13px;
  font-weight: 950;
}

.ira-book-rating {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  letter-spacing: 0.04em;
  font-weight: 950;
}

.ira-rating-filled {
  color: #b97921;
  text-shadow: 0 1px 0 rgba(120, 70, 18, 0.08);
}

.ira-rating-empty {
  color: #d8c5a3;
}

.ira-represent-question-box {
  margin: 0;
  padding: 15px 16px;
  border-radius: 20px;
  background: rgba(255, 248, 231, 0.90);
border: 1.5px solid rgba(181, 117, 37, 0.20);
  color: #6f4720;
  font-size: 14px;
  font-weight: 850;
  line-height: 1.5;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.ira-represent-question-box strong {
  display: block;
  margin-bottom: 5px;
  color: #3f220d;
  font-size: 13px;
  font-weight: 950;
}

    .ira-book-help {
      margin: 0;
      padding: 16px 18px;
      border-radius: 20px;
      background: rgba(255, 250, 237, 0.76);
      border: 1px solid rgba(181, 117, 37, 0.12);
      color: #6f4720;
      font-size: 14px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .ira-book-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .ira-detail-header {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    .ira-back-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .ira-detail-title {
      margin: 0;
      color: #4d2b10;
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      font-size: 38px;
      font-weight: 950;
      letter-spacing: -0.055em;
    }

    .ira-detail-desc {
      margin: 0;
      color: #6f4720;
      font-size: 16px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .ira-tab-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 18px 0;
      padding: 10px;
      border-radius: 22px;
      background: rgba(255, 250, 237, 0.72);
      border: 1px solid rgba(181, 117, 37, 0.14);
    }

    .ira-tab-button {
      height: 42px;
      border: 1px solid rgba(174, 109, 27, 0.20);
      border-radius: 999px;
      background: rgba(255, 252, 242, 0.92);
      color: #654018;
      font-size: 14px;
      font-weight: 950;
      cursor: pointer;
    }

    .ira-tab-button.active {
      border: none;
      background: linear-gradient(180deg, #e6b656, #a8641e);
      color: #fff9e8;
      box-shadow: 0 9px 16px rgba(128, 76, 18, 0.14);
    }

    .ira-record-list {
      display: grid;
      gap: 12px;
    }

    .ira-record-card {
      padding: 18px 20px;
      border-radius: 22px;
      border: 1px solid rgba(181, 117, 37, 0.18);
      background: rgba(255, 252, 244, 0.90);
      box-shadow: 0 10px 18px rgba(101, 63, 18, 0.06);
    }

    .ira-record-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .ira-badge {
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e9f5de;
      color: #356221;
      font-size: 12px;
      font-weight: 950;
    }

    .ira-badge.brown {
      background: rgba(255, 238, 198, 0.9);
      color: #8a561b;
    }

    .ira-badge.gray {
      background: rgba(245, 238, 223, 0.92);
      color: #7a6a58;
    }

    .ira-record-card h3 {
      margin: 0 0 8px;
      color: #4d2b10;
      font-size: 20px;
      font-weight: 950;
      line-height: 1.35;
      word-break: keep-all;
    }

    .ira-record-card p {
      margin: 0;
      color: #416928;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.55;
      word-break: keep-all;
      white-space: pre-wrap;
    }

    .ira-summary-card {
      padding: 24px;
      border-radius: 26px;
      border: 1px solid rgba(181, 117, 37, 0.18);
      background:
        radial-gradient(circle at 10% 0%, rgba(255, 226, 145, 0.22), transparent 42%),
        rgba(255, 252, 244, 0.92);
      box-shadow: 0 12px 22px rgba(101, 63, 18, 0.08);
    }

    .ira-summary-card h3 {
      margin: 0 0 14px;
      color: #4d2b10;
      font-size: 25px;
      font-weight: 950;
    }

    .ira-summary-card p {
      margin: 0;
      color: #4d2b10;
      font-size: 17px;
      font-weight: 850;
      line-height: 1.75;
      word-break: keep-all;
      white-space: pre-wrap;
    }

    .ira-empty {
      min-height: 180px;
      display: grid;
      place-items: center;
      padding: 24px;
      border: 2px dashed rgba(181, 117, 37, 0.20);
      border-radius: 24px;
      background: rgba(255, 250, 237, 0.56);
      color: #7a5123;
      text-align: center;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.5;
    }

    @media (max-width: 1100px) {
      .ira-book-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 980px) {
      .ira-hero-card,
      .ira-book-grid {
        grid-template-columns: 1fr;
      }

      .ira-tab-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    /* 나의 독서 보관함 화면 폭 최종 조정
   - 읽기중/질문 만들기 화면과 비슷한 폭으로 맞춤 */
.ira-page {
  padding: 16px 28px 28px !important;
}

.ira-shell {
  width: 100% !important;
  max-width: 1480px !important;
  margin: 0 auto !important;
}

/* 상단 문답책 헤더 폭 */
.ira-top-bar {
  width: 100% !important;
  max-width: none !important;
}

/* 상단 소개 카드 폭 */
.ira-hero-card {
  width: 100% !important;
  max-width: none !important;
}

/* 읽은 책 목록 배경 카드 폭 */
.ira-panel {
  width: 100% !important;
  max-width: none !important;
}

/* 책 카드들이 넓어진 폭에 맞게 자연스럽게 배치 */
.ira-book-grid {
  width: 100% !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  gap: 24px !important;
}
/* 나의 독서 보관함 - 읽은 책 목록 배경 카드 높이 조정 */
#bookListView .ira-panel {
  min-height: 750px !important;
  padding: 34px 32px 38px !important;
}
/* 나의 독서 보관함 상세 화면: 배경 카드 높이 확대 + 안쪽 스크롤 */
#bookDetailView.active .ira-panel {
  height: 760px !important;
  min-height: 760px !important;
  max-height: none !important;
  overflow-y: auto !important;
  padding: 34px 32px 70px !important;
}

/* 상세 화면에서 페이지 자체도 아래로 내려갈 수 있게 허용 */
#bookDetailView {
  overflow: visible !important;
}

.ira-page {
  height: auto !important;
  min-height: 100vh !important;
  overflow-y: auto !important;
  padding-bottom: 90px !important;
}

/* 질문 기록이 아래에서 잘리지 않도록 여백 확보 */
#bookDetailView .ira-record-list {
  padding-bottom: 80px !important;
}

/* 상세 화면 안 기록 목록이 카드 안에서 자연스럽게 이어지도록 */
#bookDetailView .ira-record-list {
  padding-bottom: 40px !important;
}

/* 상단 설명 문구 제거:
   "책을 누르면 읽기 전, 읽는 중, 읽은 후 기록과 간추린 내용을 확인할 수 있어요." */
.ira-hero-card p {
  display: none !important;
}

   "읽기 전, 읽는 중, 읽은 후, 간추린 내용을 단계별로 확인해 봐요." */

  display: none !important;

  min-height: 330px !important;

}

.ira-book-card-head {
  gap: 18px !important;
}

.ira-book-title {
  font-size: 36px !important;

}

.ira-book-author {
  margin-top: 8px !important;

   나의 독서 보관함 - 읽은 책 목록 안내 문구 확대

  font-size: 19px !important;
  line-height: 1.5 !important;
}

/* =========================================================
   읽은 책 목록 카드 - 하단 여백 줄이기 + 스크롤 안전장치
   - 배경 카드 높이를 늘려 아래쪽 빈 여백을 줄입니다.

  height: 820px !important;
  min-height: 820px !important;

  display: flex !important;
  flex-direction: column !important;
  padding: 34px 32px 38px !important;
}

/* 제목/설명과 책 카드 목록 사이 간격을 좁히기 위해, 카드가 몇 개든
   위쪽부터 자연스럽게 채워지도록 합니다(가운데 정렬 대신 start).
   책이 많아 넘칠 때는 이 목록 영역 안에서만 세로 스크롤됩니다. */

  flex: 1 1 auto !important;
  min-height: 0 !important;
  align-content: start !important;
  overflow-y: auto !important;
  padding-right: 6px !important;
  margin-top: 4px !important;
}
/* =========================================================
   독서 보관함 상세 화면 상단 정리
   - 책 제목, 별점, 대표 질문은 상세 화면에서만 숨김
   - 목록 카드의 제목, 별점, 대표 질문은 그대로 유지
   ========================================================= */

/* 상세 화면의 책 제목과 설명 영역 제거 */
#bookDetailView .ira-detail-header > div:nth-child(2) {
  display: none !important;
}

/* 상세 화면의 별점과 대표 질문 영역 제거 */
#bookDetailView .ira-detail-header > .ira-book-meta-line {
  display: none !important;
}

/* 책 목록으로 버튼과 완독 날짜 아래의 불필요한 여백 축소 */
#bookDetailView .ira-detail-header {
  gap: 0 !important;
  margin-bottom: 8px !important;
}

/* 읽기 전·중·후·간추리기 탭을 위로 이동 */
#bookDetailView .ira-tab-row {
  margin-top: 8px !important;
  margin-bottom: 18px !important;
}
  </style>
</head>

<body>
  <main class="ira-page">
    <div class="ira-shell">
      <header class="ira-top-bar">
        <div class="ira-logo">
          <img src="../assets/images/logo-book.png" alt="문답책 로고">
          <span>문답책</span>
        </div>

        <div class="ira-top-actions">
            <!-- 개별읽기 활동 중에도 현재 능력치를 확인하는 버튼입니다. -->
<button type="button" class="ira-top-button" onclick="openIndividualPowerModal()">✨ 나의 힘</button>
          <button type="button" class="ira-top-button" onclick="goAdventure()">오늘의 독서 모험</button>
          <button type="button" class="mq-book-home-button" onclick="goIndividualHome()">📚 책읽기 홈</button>
        </div>
      </header>

      <section class="ira-hero-card">
        <div>
          <p class="ira-kicker">나의 독서 보관함</p>
          <h1>내가 읽은 책을 모아 봐요</h1>
          <p>책을 누르면 읽기 전, 읽는 중, 읽은 후 기록과 간추린 내용을 확인할 수 있어요.</p>
        </div>

        <div class="ira-hero-summary">
          <span>보관된 책 :</span>
          <strong id="archiveBookCount">0권</strong>
        </div>
      </section>

      <section class="ira-view active" id="bookListView">
        <article class="ira-panel">
          <div class="ira-section-head">
            <div>
              <h2>읽은 책 목록</h2>
              <p>책 카드를 누르면 그 책에서 만든 질문과 간추리기를 볼 수 있어요.</p>
            </div>
          </div>

          <div class="ira-book-grid" id="bookGrid"></div>
        </article>
      </section>

      <section class="ira-view" id="bookDetailView">
        <article class="ira-panel">
          <div class="ira-detail-header">
            <div class="ira-back-line">
              <button type="button" class="ira-main-button" onclick="showBookList()">← 책 목록으로</button>
              <span class="ira-book-date" id="detailCompletedAt">완료일 없음</span>
            </div>

            <div>
              <h2 class="ira-detail-title" id="detailBookTitle">책 제목</h2>
              <p class="ira-detail-desc" id="detailBookDescription">읽기 기록을 단계별로 확인해 봐요.</p>
            </div>

            <div class="ira-book-meta-line">
              <div class="ira-book-finish-info">
                <span class="ira-book-info-pill ira-book-rating" id="detailRating"></span>
              </div>
              <p class="ira-represent-question-box" id="detailRepresentative"></p>
            </div>
          </div>

          <div class="ira-tab-row">
            <button type="button" class="ira-tab-button active" data-tab="all" onclick="changeArchiveTab('all')">전체 보기</button>
            <button type="button" class="ira-tab-button" data-tab="before" onclick="changeArchiveTab('before')">읽기 전</button>
            <button type="button" class="ira-tab-button" data-tab="during" onclick="changeArchiveTab('during')">읽는 중</button>
            <button type="button" class="ira-tab-button" data-tab="after" onclick="changeArchiveTab('after')">읽은 후</button>
            <button type="button" class="ira-tab-button" data-tab="summary" onclick="changeArchiveTab('summary')">간추린 내용</button>
          </div>

          <div class="ira-record-list" id="recordList"></div>
        </article>
      </section>
    </div>
  </main>

  <script>
    const studentId = sessionStorage.getItem("studentId") || "student-demo";
    const INDIVIDUAL_READING_API_BASE_URL = "http://localhost:8080";

    let archiveBooks = [];
    let selectedBookDetail = null;
    let currentTab = "all";

    document.addEventListener("DOMContentLoaded", async function () {
      await loadArchiveBooks();
      renderArchiveSummary();
      renderBookList();
    });

    /*
      나의 독서 보관함 목록을 서버(GET .../individual-reading/archive)에서
      받아온다 - sessionStorage 샘플/임시 데이터는 더 이상 쓰지 않는다.
      완독한 기록만 서버가 최신순으로 내려준다.
    */
    async function loadArchiveBooks() {
      const token = sessionStorage.getItem("token");

      if (!token) {
        archiveBooks = [];
        return;
      }

      try {
        const response = await fetch(
          INDIVIDUAL_READING_API_BASE_URL + "/api/students/me/individual-reading/archive",
          { headers: { Authorization: "Bearer " + token } }
        );

        if (!response.ok) {
          throw new Error("나의 독서 보관함 목록 조회 실패: " + response.status);
        }

        archiveBooks = await response.json();
      } catch (error) {
        console.error("나의 독서 보관함 목록을 불러오지 못했습니다.", error);
        archiveBooks = [];

        const bookGrid = document.getElementById("bookGrid");
        if (bookGrid) {
          bookGrid.innerHTML = `
            <div class="ira-empty" style="grid-column: 1 / -1;">
              보관함을 불러오지 못했어요.<br>
              잠시 후 다시 시도해 주세요.
            </div>
          `;
        }
      }
    }

    // 서버 ISO 시각(예: 2026-07-28T21:48:14)을 2026.07.28 형식으로 바꾼다.
    function formatArchiveDate(isoDateTime) {
      if (!isoDateTime) return "완독 날짜 없음";

      const datePart = String(isoDateTime).slice(0, 10);
      const parts = datePart.split("-");

      if (parts.length !== 3) return datePart;

      return parts[0] + "." + parts[1] + "." + parts[2];
    }

    function getRepresentCategoryLabelForArchive(category) {
      if (category === "before") return "읽기 전";
      if (category === "during") return "읽기 중";
      if (category === "after") return "읽기 후";
      return "";
    }

    function getBeforeStepLabel(stepType) {
      if (stepType === "title") return "제목 보고 질문 만들기";
      if (stepType === "contents") return "차례 보고 질문 만들기";
      if (stepType === "picture") return "그림 보고 질문 만들기";
      if (stepType === "skim") return "훑어보고 질문 만들기";
      return "읽기 전 질문";
    }

    function getDuringTypeLabel(questionType) {
      if (questionType === "find") return "바로 찾기";
      if (questionType === "infer") return "짐작하기";
      if (questionType === "feel") return "생각·느낌";
      if (questionType === "connect") return "삶과 연결";
      return "읽는 중 질문";
    }

   // 별점 숫자를 별 모양으로 바꿔 보여줍니다.
function getRatingStars(rating) {
  const safeRating = Math.max(0, Math.min(5, Number(rating || 0)));
  const filledStars = "★".repeat(safeRating);
  const emptyStars = "☆".repeat(5 - safeRating);

  return `
    <span class="ira-rating-filled">${filledStars}</span>
    <span class="ira-rating-empty">${emptyStars}</span>
  `;
}

function renderArchiveSummary() {
  const bookCount = archiveBooks.length;
  document.getElementById("archiveBookCount").textContent = bookCount + "권";
}

    function renderBookList() {
      const bookGrid = document.getElementById("bookGrid");

      if (archiveBooks.length === 0) {
        bookGrid.innerHTML = `
          <div class="ira-empty" style="grid-column: 1 / -1;">
            아직 보관된 책이 없어요.<br>
            오늘의 독서 모험에서 책을 완독하면 이곳에 자동으로 저장돼요.
          </div>
        `;
        return;
      }

      bookGrid.innerHTML = archiveBooks.map(function (book) {
  const title = book.bookTitle || "제목 없는 책";
  const author = book.author || "지은이 없음";
  const completedAt = formatArchiveDate(book.finishedAt);
  const ratingDisplay = book.rating ? getRatingStars(book.rating) : "별점 미등록";
  const representativeQuestion = book.representativeQuestion || "아직 대표 질문이 저장되지 않았어요.";

  return `
    <article class="ira-book-card" onclick="showBookDetail(${book.readingRecordId})">
      <div class="ira-book-card-head">
        <div>
          <h3 class="ira-book-title">${escapeHtml(title)}</h3>
          <p class="ira-book-author">${escapeHtml(author)} 지음</p>
        </div>
        <span class="ira-book-date">${escapeHtml(completedAt)}</span>
      </div>

      <div class="ira-book-meta-line">
        <div class="ira-book-finish-info">
          <span class="ira-book-info-pill ira-book-rating">${ratingDisplay}</span>
        </div>

        <p class="ira-represent-question-box">
          <strong>대표 질문</strong>
          ${escapeHtml(representativeQuestion)}
        </p>
      </div>
    </article>
  `;
}).join("");
    }

    /*
      책 카드를 누르면 서버 상세 API(GET .../archive/{readingRecordId})를
      새로 호출한다 - 목록 카드 데이터(요약용 필드만 있음)를 재사용하지
      않고, 매번 그 책의 최신 전체 기록을 받아온다. 로딩 중에는 이전 책의
      내용이 잠깐이라도 남아 있지 않도록 화면을 먼저 비운다.
    */
    async function showBookDetail(readingRecordId) {
      selectedBookDetail = null;
      currentTab = "all";

      document.getElementById("bookListView").classList.remove("active");
      document.getElementById("bookDetailView").classList.add("active");
      document.getElementById("detailBookTitle").textContent = "불러오는 중...";
      document.getElementById("detailCompletedAt").textContent = "";
      document.getElementById("detailRating").innerHTML = "";
      document.getElementById("detailRepresentative").innerHTML = "";
      document.getElementById("recordList").innerHTML = "";
      window.scrollTo({ top: 0, behavior: "smooth" });

      const token = sessionStorage.getItem("token");

      if (!token) {
        document.getElementById("recordList").innerHTML = `
          <div class="ira-empty">로그인 정보가 없어요. 다시 로그인한 뒤 시도해 주세요.</div>
        `;
        return;
      }

      try {
        const response = await fetch(
          INDIVIDUAL_READING_API_BASE_URL +
            "/api/students/me/individual-reading/archive/" +
            readingRecordId,
          { headers: { Authorization: "Bearer " + token } }
        );

        if (!response.ok) {
          throw new Error("나의 독서 보관함 상세 조회 실패: " + response.status);
        }

        selectedBookDetail = await response.json();
      } catch (error) {
        console.error("나의 독서 보관함 상세를 불러오지 못했습니다.", error);
        document.getElementById("recordList").innerHTML = `
          <div class="ira-empty">
            기록을 불러오지 못했어요.<br>
            잠시 후 다시 시도해 주세요.
          </div>
        `;
        return;
      }

      document.getElementById("detailBookTitle").textContent = selectedBookDetail.bookTitle || "제목 없는 책";
      document.getElementById("detailCompletedAt").textContent = formatArchiveDate(selectedBookDetail.finishedAt);
      renderDetailRepresentative(selectedBookDetail);

      changeArchiveTab("all");
    }

    // 책 정보 위쪽에 별점과 대표 질문·답을 고정으로 보여준다(탭과 무관).
    function renderDetailRepresentative(detail) {
      const ratingEl = document.getElementById("detailRating");
      const repEl = document.getElementById("detailRepresentative");

      if (ratingEl) {
        ratingEl.innerHTML = detail.rating ? getRatingStars(detail.rating) : "별점 미등록";
      }

      if (repEl) {
        if (detail.representativeQuestion) {
          const categoryLabel = getRepresentCategoryLabelForArchive(detail.representativeCategory);
          repEl.innerHTML = `
            <strong>대표 질문 (${escapeHtml(categoryLabel)})</strong>
            Q. ${escapeHtml(detail.representativeQuestion)}<br>
            A. ${escapeHtml(detail.representativeAnswer || "답 없음")}
          `;
        } else {
          repEl.innerHTML = `<strong>대표 질문</strong>대표 질문 미등록`;
        }
      }
    }

    function showBookList() {
      selectedBookDetail = null;
      document.getElementById("bookDetailView").classList.remove("active");
      document.getElementById("bookListView").classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function changeArchiveTab(tab) {
      currentTab = tab;

      const buttons = document.querySelectorAll(".ira-tab-button");
      buttons.forEach(function (button) {
        button.classList.toggle("active", button.dataset.tab === tab);
      });

      renderRecords();
    }

    function renderRecords() {
      const recordList = document.getElementById("recordList");
      if (!selectedBookDetail) return;

      const records = getRecordsByTab(selectedBookDetail, currentTab);

      if (records.length === 0) {
        recordList.innerHTML = `
          <div class="ira-empty">
            이 카테고리에 저장된 기록이 없어요.
          </div>
        `;
        return;
      }

      recordList.innerHTML = records.map(function (record) {
        if (record.category === "summary") {
          return `
            <article class="ira-summary-card">
              <div class="ira-record-meta">
                <span class="ira-badge">간추린 내용</span>
                ${record.feedback ? `<span class="ira-badge brown">루미 피드백 통과</span>` : ""}
              </div>
              <h3>내가 쓴 간추리기</h3>
              <p>${escapeHtml(record.summary)}</p>
            </article>
          `;
        }

        return `
          <article class="ira-record-card">
            <div class="ira-record-meta">
              <span class="ira-badge">${escapeHtml(record.label)}</span>
              ${record.date ? `<span class="ira-badge brown">${escapeHtml(record.date)}</span>` : ""}
              ${record.source ? `<span class="ira-badge gray">${escapeHtml(record.source)}</span>` : ""}
            </div>
            <h3>Q. ${escapeHtml(record.question || "질문 없음")}</h3>
            <p>${escapeHtml(record.answer || "아직 답은 없어요.")}</p>
            ${record.feedback ? `<p style="margin-top:8px;color:#8a5a22;">💬 루미: ${escapeHtml(record.feedback)}</p>` : ""}
          </article>
        `;
      }).join("");
    }

    // 실패하거나 아직 루미 통과를 못 받은 임시 응답은 서버가 이미 걸러서
    // 내려주므로(최종 통과 기록만), 여기서는 필드 이름만 화면용으로 맞춘다.
    function getRecordsByTab(detail, tab) {
      const beforeRecords = (detail.beforeResponses || []).map(function (item) {
        return {
          category: "before",
          label: "읽기 전",
          source: getBeforeStepLabel(item.stepType),
          question: item.question,
          answer: item.answer,
          feedback: item.aiFeedback
        };
      });

      const duringRecords = (detail.duringResponses || []).map(function (item) {
        return {
          category: "during",
          label: "읽는 중",
          date: formatArchiveDate(item.createdAt),
          source: getDuringTypeLabel(item.questionType),
          question: item.question,
          answer: item.answer,
          feedback: item.aiFeedback
        };
      });

      const afterRecords = (detail.afterResponses || []).map(function (item) {
        return {
          category: "after",
          label: "읽은 후 질문 " + (item.questionIndex || ""),
          source: "간추리기 질문",
          question: item.question,
          answer: item.answer,
          feedback: item.aiFeedback
        };
      });

      const summaryRecords = detail.summaryText
        ? [{ category: "summary", summary: detail.summaryText, feedback: detail.summaryAiPassed }]
        : [];

      if (tab === "before") return beforeRecords;
      if (tab === "during") return duringRecords;
      if (tab === "after") return afterRecords;
      if (tab === "summary") return summaryRecords;

      return [...beforeRecords, ...duringRecords, ...afterRecords, ...summaryRecords];
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function goAdventure() {
      location.href = "./today-reading-adventure.html";
    }

    function goIndividualHome() {
      location.href = "./individual-reading.html";
    }
  </script>
  <!-- 개별읽기 공통: 나의 힘 팝업 기능 -->
<script src="../js/individual-power.js"></script>
  <script src="../js/fixed-stage.js"></script>
</body>
</html>
