<!--
  파일명: individual-reading-archive.html
  역할: 문답책 개별읽기 - 나의 독서 보관함 화면입니다.

  이 화면에서 하는 일:
  1. 읽은 책을 책 단위로 보여줍니다.
  2. 책을 누르면 읽기 전 / 읽는 중 / 읽은 후 / 간추린 내용 기록을 나누어 확인합니다.
  3. 현재는 sessionStorage에 저장된 데이터를 불러옵니다.
  4. 저장된 데이터가 없을 때는 화면 확인용 예시 데이터를 보여줍니다.
-->

    .ira-logo {

    .ira-logo img {

    .ira-logo span {

      font-size: 15px;
      font-weight: 950;

    /* 상단 소개 영역을 작고 효율적으로 정리합니다. */
    .ira-hero-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 22px 30px;

    .ira-hero-card h1 {
      margin: 0;
      color: #4d2b10;
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      font-size: 36px;
      font-weight: 950;
      line-height: 1.13;
      letter-spacing: -0.055em;
      word-break: keep-all;
    }

    .ira-hero-card p {
      margin: 10px 0 0;
      color: #6f4720;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.45;
      word-break: keep-all;
    }

    .ira-hero-summary {
      min-width: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px 28px;

      border: 1px solid rgba(181, 117, 37, 0.18);
      text-align: center;
    }

    .ira-hero-summary strong {

      font-weight: 950;
      white-space: nowrap;
    }

    .ira-view {
      display: none;

    .ira-view.active {
      display: block;
    }

    /* 책 목록 영역 비중을 키우기 위해 패널 높이와 여백을 다시 잡습니다. */
    .ira-panel {
      min-height: 560px;
      padding: 30px 32px;
      border: 1px solid rgba(180, 116, 34, 0.22);
      border-radius: 32px;
      background: rgba(255, 251, 242, 0.88);
      box-shadow:
        0 18px 34px rgba(92, 58, 18, 0.13),
        inset 0 0 0 1px rgba(255,255,255,0.58);
      backdrop-filter: blur(8px);
    }

    .ira-section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .ira-section-head h2 {
      margin: 0;
      color: #4d2b10;
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      font-size: 32px;
      font-weight: 950;
      letter-spacing: -0.05em;
    }

    .ira-section-head p {
      margin: 6px 0 0;
      color: #795024;
      font-size: 15px;
      font-weight: 850;
    }

    .ira-book-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    .ira-book-card {
      min-height: 250px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: 24px;
     border: 2px solid rgba(181, 117, 37, 0.26);
      border-radius: 28px;
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 226, 145, 0.20), transparent 42%),
        rgba(255, 252, 244, 0.90);
      box-shadow: 0 12px 22px rgba(101, 63, 18, 0.08);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .ira-book-card:hover {
      transform: translateY(-4px);
      border-color: rgba(187, 113, 26, 0.42);
      box-shadow: 0 18px 30px rgba(101, 63, 18, 0.13);
    }

    .ira-book-card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .ira-book-title {
      margin: 0;
      color: #4d2b10;
      font-size: 32px;
      font-weight: 950;
      letter-spacing: -0.045em;
      word-break: keep-all;
    }

    .ira-book-date {
      flex: 0 0 auto;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1.5px solid rgba(181, 117, 37, 0.24);
      background: rgba(255, 246, 220, 0.92);
      color: #9a631e;
      font-size: 12px;
      font-weight: 950;
      white-space: nowrap;
    }

    /* =========================================================
   읽은 책 카드 정보
   - 책 제목, 지은이, 완독 날짜, 별점, 대표 질문을 보여줍니다.
   ========================================================= */

.ira-book-meta-line {
  display: grid;
  gap: 7px;
}

.ira-book-author {
  margin: 0;
  color: #8a5b22;
  font-size: 14px;
  font-weight: 900;
}

.ira-book-finish-info {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.ira-book-info-pill {
  width: fit-content;
  padding: 7px 11px;
  border-radius: 999px;
  background: rgba(255, 247, 228, 0.96);
border: 1.5px solid rgba(181, 117, 37, 0.22);
  color: #6a451c;
  font-size: 13px;
  font-weight: 950;
}

.ira-book-rating {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  letter-spacing: 0.04em;
  font-weight: 950;
}

.ira-rating-filled {
  color: #b97921;
  text-shadow: 0 1px 0 rgba(120, 70, 18, 0.08);
}

.ira-rating-empty {
  color: #d8c5a3;
}

.ira-represent-question-box {
  margin: 0;
  padding: 15px 16px;
  border-radius: 20px;
  background: rgba(255, 248, 231, 0.90);
border: 1.5px solid rgba(181, 117, 37, 0.20);
  color: #6f4720;
  font-size: 14px;
  font-weight: 850;
  line-height: 1.5;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.ira-represent-question-box strong {
  display: block;
  margin-bottom: 5px;
  color: #3f220d;
  font-size: 13px;
  font-weight: 950;
}

    .ira-book-help {
      margin: 0;
      padding: 16px 18px;
      border-radius: 20px;
      background: rgba(255, 250, 237, 0.76);
      border: 1px solid rgba(181, 117, 37, 0.12);
      color: #6f4720;
      font-size: 14px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .ira-book-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .ira-detail-header {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    .ira-back-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .ira-detail-title {
      margin: 0;
      color: #4d2b10;
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      font-size: 38px;
      font-weight: 950;
      letter-spacing: -0.055em;
    }

    .ira-detail-desc {
      margin: 0;
      color: #6f4720;
      font-size: 16px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .ira-tab-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 18px 0;
      padding: 10px;
      border-radius: 22px;
      background: rgba(255, 250, 237, 0.72);
      border: 1px solid rgba(181, 117, 37, 0.14);
    }

    .ira-tab-button {
      height: 42px;
      border: 1px solid rgba(174, 109, 27, 0.20);
      border-radius: 999px;
      background: rgba(255, 252, 242, 0.92);
      color: #654018;
      font-size: 14px;
      font-weight: 950;
      cursor: pointer;
    }

    .ira-tab-button.active {
      border: none;
      background: linear-gradient(180deg, #e6b656, #a8641e);
      color: #fff9e8;
      box-shadow: 0 9px 16px rgba(128, 76, 18, 0.14);
    }

    .ira-record-list {
      display: grid;
      gap: 12px;
    }

    .ira-record-card {
      padding: 18px 20px;
      border-radius: 22px;
      border: 1px solid rgba(181, 117, 37, 0.18);
      background: rgba(255, 252, 244, 0.90);
      box-shadow: 0 10px 18px rgba(101, 63, 18, 0.06);
    }

    .ira-record-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .ira-badge {
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e9f5de;
      color: #356221;
      font-size: 12px;
      font-weight: 950;
    }

    .ira-badge.brown {
      background: rgba(255, 238, 198, 0.9);
      color: #8a561b;
    }

    .ira-badge.gray {
      background: rgba(245, 238, 223, 0.92);
      color: #7a6a58;
    }

    .ira-record-card h3 {
      margin: 0 0 8px;
      color: #4d2b10;
      font-size: 20px;
      font-weight: 950;
      line-height: 1.35;
      word-break: keep-all;
    }

    .ira-record-card p {
      margin: 0;
      color: #416928;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.55;
      word-break: keep-all;
      white-space: pre-wrap;
    }

    .ira-summary-card {
      padding: 24px;
      border-radius: 26px;
      border: 1px solid rgba(181, 117, 37, 0.18);
      background:
        radial-gradient(circle at 10% 0%, rgba(255, 226, 145, 0.22), transparent 42%),
        rgba(255, 252, 244, 0.92);
      box-shadow: 0 12px 22px rgba(101, 63, 18, 0.08);
    }

    .ira-summary-card h3 {
      margin: 0 0 14px;
      color: #4d2b10;
      font-size: 25px;
      font-weight: 950;
    }

    .ira-summary-card p {
      margin: 0;
      color: #4d2b10;
      font-size: 17px;
      font-weight: 850;
      line-height: 1.75;
      word-break: keep-all;
      white-space: pre-wrap;
    }

    .ira-empty {
      min-height: 180px;
      display: grid;
      place-items: center;
      padding: 24px;
      border: 2px dashed rgba(181, 117, 37, 0.20);
      border-radius: 24px;
      background: rgba(255, 250, 237, 0.56);
      color: #7a5123;
      text-align: center;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.5;
    }

    @media (max-width: 1100px) {
      .ira-book-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 980px) {
      .ira-hero-card,
      .ira-book-grid {
        grid-template-columns: 1fr;
      }

      .ira-tab-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    /* 나의 독서 보관함 화면 폭 최종 조정
   - 읽기중/질문 만들기 화면과 비슷한 폭으로 맞춤 */
.ira-page {
  padding: 16px 28px 28px !important;
}

.ira-shell {
  width: 100% !important;
  max-width: 1480px !important;
  margin: 0 auto !important;
}

/* 상단 문답책 헤더 폭 */
.ira-top-bar {
  width: 100% !important;
  max-width: none !important;
}

/* 상단 소개 카드 폭 */
.ira-hero-card {
  width: 100% !important;
  max-width: none !important;
}

/* 읽은 책 목록 배경 카드 폭 */
.ira-panel {
  width: 100% !important;
  max-width: none !important;
}

/* 책 카드들이 넓어진 폭에 맞게 자연스럽게 배치 */
.ira-book-grid {
  width: 100% !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  gap: 24px !important;
}
/* 나의 독서 보관함 - 읽은 책 목록 배경 카드 높이 조정 */
#bookListView .ira-panel {
  min-height: 750px !important;
  padding: 34px 32px 38px !important;
}
/* 나의 독서 보관함 상세 화면: 배경 카드 높이 확대 + 안쪽 스크롤 */
#bookDetailView.active .ira-panel {
  height: 760px !important;
  min-height: 760px !important;
  max-height: none !important;
  overflow-y: auto !important;
  padding: 34px 32px 70px !important;
}

/* 상세 화면에서 페이지 자체도 아래로 내려갈 수 있게 허용 */
#bookDetailView {
  overflow: visible !important;
}

.ira-page {
  height: auto !important;
  min-height: 100vh !important;
  overflow-y: auto !important;
  padding-bottom: 90px !important;
}

/* 질문 기록이 아래에서 잘리지 않도록 여백 확보 */
#bookDetailView .ira-record-list {
  padding-bottom: 80px !important;
}

/* 상세 화면 안 기록 목록이 카드 안에서 자연스럽게 이어지도록 */
#bookDetailView .ira-record-list {
  padding-bottom: 40px !important;
}

/* 상단 설명 문구 제거:
   "책을 누르면 읽기 전, 읽는 중, 읽은 후 기록과 간추린 내용을 확인할 수 있어요." */
.ira-hero-card p {
  display: none !important;
}

   "읽기 전, 읽는 중, 읽은 후, 간추린 내용을 단계별로 확인해 봐요." */

  display: none !important;

  min-height: 330px !important;

}

.ira-book-card-head {
  gap: 18px !important;
}

.ira-book-title {
  font-size: 36px !important;

}

.ira-book-author {
  margin-top: 8px !important;

   나의 독서 보관함 - 읽은 책 목록 안내 문구 확대

  font-size: 19px !important;
  line-height: 1.5 !important;
}

/* =========================================================
   읽은 책 목록 카드 - 하단 여백 줄이기 + 스크롤 안전장치
   - 배경 카드 높이를 늘려 아래쪽 빈 여백을 줄입니다.

  height: 820px !important;
  min-height: 820px !important;

  display: flex !important;
  flex-direction: column !important;
  padding: 34px 32px 38px !important;
}

/* 제목/설명과 책 카드 목록 사이 간격을 좁히기 위해, 카드가 몇 개든
   위쪽부터 자연스럽게 채워지도록 합니다(가운데 정렬 대신 start).
   책이 많아 넘칠 때는 이 목록 영역 안에서만 세로 스크롤됩니다. */

  flex: 1 1 auto !important;
  min-height: 0 !important;

</head>

<body>

<button type="button" class="ira-top-button" onclick="openIndividualPowerModal()">✨ 나의 힘</button>

  </main>

  <script>
    // 개발 중 화면 확인을 위해 로그인 정보가 없으면 임시 학생 아이디를 사용합니다.
    const studentId = sessionStorage.getItem("studentId") || "student-demo";

    // 나의 독서 보관함에서 사용하는 저장 키입니다.
const ARCHIVE_KEY = "individualReadingArchive_" + studentId;

// 읽기 후 활동을 마무리할 때 저장한 별점/대표 질문 기록입니다.
const FINISH_RECORD_KEY = "individualBookFinishRecord_" + studentId;

// 읽기 후 활동에서 만든 질문과 답, 간추리기 기록입니다.
// 보관함 상세 보기에서 함께 보여주기 위해 사용합니다.
const AFTER_QUESTION_KEY = "individualAfterQuestionAnswers_" + studentId;
const AFTER_SUMMARY_KEY = "individualAfterSummary_" + studentId;

    let archiveBooks = [];
    let selectedBook = null;
    let currentTab = "all";

    document.addEventListener("DOMContentLoaded", function () {
      archiveBooks = getArchiveBooks();
      renderArchiveSummary();
      renderBookList();
    });

    // sessionStorage에 저장된 책 단위 보관함을 불러옵니다.
    // 아직 자동 저장 데이터가 없으면 화면 확인용 예시 데이터를 보여줍니다.
    function getArchiveBooks() {
  const stored = safeJsonParse(sessionStorage.getItem(ARCHIVE_KEY), []);
  const finishedBook = getFinishedBookFromAfterReading();

  // 이 책 마무리하기로 저장한 기록이 있으면 보관함 목록 맨 앞에 보여줍니다.
  if (finishedBook) {
    const filteredStored = stored.filter(function (book) {
      return book.id !== finishedBook.id;
    });

    return [finishedBook, ...filteredStored];
  }

  if (stored.length > 0) {
    return stored;
  }

  return getExampleArchiveBooks();
}
// 읽기 후 활동에서 최종 마무리한 책 기록을 보관함 카드용 데이터로 바꿉니다.
function getFinishedBookFromAfterReading() {
  const finishRecord = safeJsonParse(sessionStorage.getItem(FINISH_RECORD_KEY), null);

  if (!finishRecord) {
    return null;
  }

  const afterQuestions = safeJsonParse(sessionStorage.getItem(AFTER_QUESTION_KEY), []);
  const summary = sessionStorage.getItem(AFTER_SUMMARY_KEY) || "";

  return {
    id: "finished-book-" + studentId,
    title: finishRecord.bookTitle || "내가 읽은 책",
    author: finishRecord.author || "지은이 없음",
    completedAt: finishRecord.finishedAt || "완독 날짜 없음",
    finishedAt: finishRecord.finishedAt || "완독 날짜 없음",
    rating: finishRecord.rating || 0,
    representativeQuestion: finishRecord.representativeQuestion || "",
    beforeQuestions: [],
    duringQuestions: [],
    afterQuestions: afterQuestions,
    summary: summary
  };
}
    // 화면 확인용 예시 데이터입니다.
    // 학생이 직접 입력하기 어려운 책 설명은 카드에서 보여주지 않습니다.
    function getExampleArchiveBooks() {
      return [
        {
          id: "book-20260617-001",

            },
            {
              source: "차례를 보고 질문 만들기",
              question: "주인공은 어떤 일을 겪으며 달라질까?"
            }
          ],
          duringQuestions: [
            {
              date: "2026.06.16",
              type: "생각·느낌",

              answer: "친구들과 마음을 나누지 못했을 때 외로웠을 것 같습니다."
            },
            {
              date: "2026.06.16",
              type: "삶과 연결",
              question: "내가 주인공이라면 어떤 말을 듣고 싶었을까?",

            }
          ],
          afterQuestions: [
            {
              question: "처음에는 어떤 일이 있었나요?",
              answer: "처음에는 주인공이 다른 사람의 감정을 잘 이해하지 못했습니다."
            },
            {
              question: "가운데에는 어떤 문제가 생겼나요?",
              answer: "주인공이 친구와 갈등을 겪으며 마음을 이해하는 일이 어려웠습니다."
            },

          // 화면 확인용 예시 데이터입니다. 실제 서비스 로직과는 무관하며,

          id: "book-20260620-002",

          completedAt: "2026.06.20",
          rating: 5,
          representativeQuestion: "잎싹은 왜 양계장을 떠나기로 결심했을까?",
          beforeQuestions: [
            {
              source: "제목을 보고 질문 만들기",
              question: "마당을 나온 암탉에게는 어떤 일이 생길까?"
            },
            {
              source: "차례를 보고 질문 만들기",
              question: "암탉은 마당 밖에서 누구를 만나게 될까?"
            }
          ],
          duringQuestions: [
            {
              date: "2026.06.19",
              type: "바로 찾기",
              question: "잎싹이 가장 하고 싶었던 일은 무엇이었나요?",
              answer: "알을 품어서 병아리를 키우는 일이었습니다."
            },
            {
              date: "2026.06.19",

              question: "잎싹은 위험한 순간에 어떤 마음이었을까?",
              answer: "무섭지만 자식을 지키겠다는 마음이 더 컸을 것 같습니다."
            }
          ],
          afterQuestions: [
            {
              question: "처음에는 어떤 일이 있었나요?",
              answer: "처음에는 잎싹이 양계장에서 나가고 싶어 했습니다."
            },
            {
              question: "가운데에는 어떤 문제가 생겼나요?",
              answer: "잎싹이 청둥오리의 알을 품고 키우며 여러 위험을 겪었습니다."
            },
            {
              question: "마지막에는 어떻게 되었나요?",
              answer: "잎싹은 초록머리를 무사히 키워 하늘로 떠나보냈습니다."
            }
          ],

        },
        {
          // 카드가 3개 이상일 때 배치와 목록 스크롤이 자연스러운지 확인하기
          // 위한 화면 확인용 예시 데이터입니다. 실제 서비스 로직과는 무관하며,
          // 확인이 끝나면 이 항목만 지워도 됩니다.
          id: "book-20260622-003",
          title: "나무를 심은 사람",
          author: "장 지오노",
          completedAt: "2026.06.22",
          rating: 4,
          representativeQuestion: "엘제아르 부피에는 왜 혼자 나무를 심기 시작했을까?",
          beforeQuestions: [
            {
              source: "제목을 보고 질문 만들기",

          duringQuestions: [

            }
          ],
          afterQuestions: [
            {

            },
            {
              question: "가운데에는 어떤 문제가 생겼나요?",

            },

   // 별점 숫자를 별 모양으로 바꿔 보여줍니다.
function getRatingStars(rating) {
  const safeRating = Math.max(0, Math.min(5, Number(rating || 0)));
  const filledStars = "★".repeat(safeRating);
  const emptyStars = "☆".repeat(5 - safeRating);

  return `
    <span class="ira-rating-filled">${filledStars}</span>
    <span class="ira-rating-empty">${emptyStars}</span>
  `;
}

// 대표 질문이 저장되지 않은 예전 데이터는 읽기 후 질문 중 첫 번째 질문을 대신 보여줍니다.
function getDefaultRepresentativeQuestion(book) {
  const afterQuestions = book.afterQuestions || [];

  if (book.representativeQuestion) {
    return book.representativeQuestion;
  }

  if (afterQuestions.length > 0 && afterQuestions[0].question) {
    return afterQuestions[0].question;
  }

  return "아직 대표 질문이 저장되지 않았어요.";
}

function renderArchiveSummary() {
  const bookCount = archiveBooks.length;
  document.getElementById("archiveBookCount").textContent = bookCount + "권";
}

    function renderBookList() {
      const bookGrid = document.getElementById("bookGrid");

      if (archiveBooks.length === 0) {
        bookGrid.innerHTML = `
          <div class="ira-empty" style="grid-column: 1 / -1;">
            아직 보관된 책이 없어요.<br>
            오늘의 독서 모험에서 읽기 후 활동을 완료하면 이곳에 자동으로 저장돼요.
          </div>
        `;
        return;
      }

      bookGrid.innerHTML = archiveBooks.map(function (book) {
  const title = book.title || book.bookTitle || "제목 없는 책";
  const author = book.author || "지은이 없음";
  const completedAt = book.finishedAt || book.completedAt || "완독 날짜 없음";
  const rating = Number(book.rating || 0);
  const representativeQuestion = getDefaultRepresentativeQuestion(book);
  const ratingStars = getRatingStars(rating);

  return `
    <article class="ira-book-card" onclick="showBookDetail('${escapeHtml(book.id)}')">
      <div class="ira-book-card-head">
        <div>
          <h3 class="ira-book-title">${escapeHtml(title)}</h3>
          <p class="ira-book-author">${escapeHtml(author)} 지음</p>
        </div>
        <span class="ira-book-date">${escapeHtml(completedAt)}</span>
      </div>

      <div class="ira-book-meta-line">
        <div class="ira-book-finish-info">
          <span class="ira-book-info-pill ira-book-rating">${ratingStars}</span>
        </div>

        <p class="ira-represent-question-box">
          <strong>대표 질문</strong>
          ${escapeHtml(representativeQuestion)}
        </p>
      </div>
    </article>
  `;
}).join("");
    }

    function showBookDetail(bookId) {
      selectedBook = archiveBooks.find(function (book) {
        return book.id === bookId;
      });

      if (!selectedBook) {
        alert("책 기록을 찾지 못했어.");
        return;
      }

      currentTab = "all";
      document.getElementById("bookListView").classList.remove("active");
      document.getElementById("bookDetailView").classList.add("active");
      document.getElementById("detailBookTitle").textContent = selectedBook.title || "제목 없는 책";
      document.getElementById("detailBookDescription").textContent = "읽기 전, 읽는 중, 읽은 후, 간추린 내용을 단계별로 확인해 봐요.";
      document.getElementById("detailCompletedAt").textContent = selectedBook.completedAt || "완료일 없음";

      changeArchiveTab("all");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showBookList() {
      selectedBook = null;
      document.getElementById("bookDetailView").classList.remove("active");
      document.getElementById("bookListView").classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function changeArchiveTab(tab) {
      currentTab = tab;

      const buttons = document.querySelectorAll(".ira-tab-button");
      buttons.forEach(function (button) {
        button.classList.toggle("active", button.dataset.tab === tab);
      });

      renderRecords();
    }

    function renderRecords() {
      const recordList = document.getElementById("recordList");
      if (!selectedBook) return;

      const records = getRecordsByTab(selectedBook, currentTab);

      if (records.length === 0) {
        recordList.innerHTML = `
          <div class="ira-empty">
            이 카테고리에 저장된 기록이 없어요.<br>
            독서 활동을 완료하면 자동으로 기록이 채워져요.
          </div>
        `;
        return;
      }

      recordList.innerHTML = records.map(function (record) {
        if (record.category === "summary") {
          return `
            <article class="ira-summary-card">
              <div class="ira-record-meta">
                <span class="ira-badge">간추린 내용</span>
                <span class="ira-badge brown">${escapeHtml(selectedBook.completedAt || "완료일 없음")}</span>
              </div>
              <h3>내가 쓴 간추리기</h3>
              <p>${escapeHtml(record.summary)}</p>
            </article>
          `;
        }

        return `
          <article class="ira-record-card">
            <div class="ira-record-meta">
              <span class="ira-badge">${escapeHtml(record.label)}</span>
              ${record.date ? `<span class="ira-badge brown">${escapeHtml(record.date)}</span>` : ""}
              ${record.source ? `<span class="ira-badge gray">${escapeHtml(record.source)}</span>` : ""}
            </div>
            <h3>Q. ${escapeHtml(record.question || "질문 없음")}</h3>
            <p>${escapeHtml(record.answer || "아직 답은 없어요.")}</p>
          </article>
        `;
      }).join("");
    }

    function getRecordsByTab(book, tab) {
      const beforeRecords = (book.beforeQuestions || []).map(function (item) {
        return {
          category: "before",
          label: "읽기 전",
          source: item.source || "읽기 전 질문",
          question: item.question,
          answer: "읽기 전에 만든 예상 질문이에요."
        };
      });

      const duringRecords = (book.duringQuestions || []).map(function (item) {
        return {
          category: "during",
          label: "읽는 중",
          date: item.date,
          source: item.type || "읽는 중 질문",
          question: item.question,
          answer: item.answer
        };
      });

      const afterRecords = (book.afterQuestions || []).map(function (item, index) {
        return {
          category: "after",
          label: "읽은 후 질문 " + (index + 1),
          source: "간추리기 질문",
          question: item.question,
          answer: item.answer
        };
      });

      const summaryRecords = book.summary ? [{ category: "summary", summary: book.summary }] : [];

      if (tab === "before") return beforeRecords;
      if (tab === "during") return duringRecords;
      if (tab === "after") return afterRecords;
      if (tab === "summary") return summaryRecords;

      return [...beforeRecords, ...duringRecords, ...afterRecords, ...summaryRecords];
    }

    function safeJsonParse(value, fallback) {
      try {
        return JSON.parse(value || "");
      } catch (error) {
        return fallback;
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function goAdventure() {
      location.href = "./today-reading-adventure.html";
    }

    function goIndividualHome() {
      location.href = "./individual-reading.html";
    }
  </script>
