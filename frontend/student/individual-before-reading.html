<!--
  파일명: individual-before-reading.html
  역할: 문답책 개별읽기 - 읽기 전 질문 만들기 화면입니다.

  이 화면에서 하는 일:
  1. 이번에 읽을 책 제목과 지은이를 학생이 직접 입력합니다.
  2. 제목 / 차례 / 그림 / 글 훑어보기 총 4개의 읽기 전 질문을 만듭니다.
  3. 연습읽기와 달리 예시 질문은 보여주지 않습니다.
  4. 질문과 내가 생각한 답을 모두 저장하면 읽기 전 활동이 완료됩니다.
  5. 완료 후 오늘의 독서 모험에서 읽기 중 단계가 열립니다.

  사용 이미지:
  - 배경: ../assets/images/individual-reading/today-reading-adventure-bg.png
  - 루미: ../assets/images/individual-reading/today-reading-lumi-point.png
  - 읽기 전 아이콘: ../assets/images/individual-reading/today-reading-before-icon.png

  참고:
  - 현재는 sessionStorage로 임시 저장합니다.
  - 나중에 서버/DB를 붙이면 saveBeforeReadingAdventure() 함수 안을 API 호출로 바꾸면 됩니다.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>읽기 전 활동 - 문답책</title>

  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
  <link rel="stylesheet" href="../css/common.css?v=individual-before-reading-v2">
<!-- 개별읽기 공통: 나의 힘 팝업 디자인 -->
<link rel="stylesheet" href="../css/individual-power.css">
  <style>

      overflow: hidden;
    }

    }

    .ibr-page::before {

    .ibr-shell {

      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: minmax(64px, auto) minmax(0, 1fr);
      gap: 14px;
    }

    .ibr-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 22px;
      border: 1px solid rgba(182, 119, 38, 0.28);
      border-radius: 24px;
      background: rgba(255, 250, 236, 0.9);
      box-shadow: 0 12px 24px rgba(92, 58, 18, 0.12);
      backdrop-filter: blur(10px);
    }

    .ibr-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ibr-logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .ibr-logo span {
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -0.045em;
      color: #5a3415;
    }

    .ibr-top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    /* 심사 체험 계정에서만 보이는 짧은 안내 배지. 공간이 넉넉하면 한 줄로,
       좁으면 최대 2줄까지 자연스럽게 줄바꿈되어 문구가 잘리지 않게 한다. */
    .mq-demo-banner {
      display: inline-flex;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      width: auto;
      max-width: 760px;
      min-height: 34px;
      height: auto;
      padding: 4px 14px;
      border-radius: 16px;
      border: 1px solid rgba(180, 130, 60, 0.42);
      background: linear-gradient(180deg, rgba(255, 247, 225, 0.96), rgba(238, 216, 176, 0.92));
      box-shadow: 0 6px 14px rgba(90, 55, 15, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      color: #6b4b26;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
      white-space: normal;
      word-break: keep-all;
      overflow: visible;
    }

    .mq-demo-banner strong {
      color: #7a4a12;
      font-weight: 900;
    }

    .mq-demo-banner[hidden] { display: none !important; }

    .ibr-top-button,
    .ibr-count-button {
      height: 42px;
      padding: 0 18px;
      border: 1px solid rgba(168, 106, 31, 0.28);
      border-radius: 999px;
      background: rgba(255, 252, 242, 0.94);
      color: #633915;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(98, 59, 15, 0.1);
    }

    .ibr-count-button {
      background: rgba(255, 246, 220, 0.96);
      color: #9a631e;
    }

    .ibr-main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
      align-items: stretch;
    }

    .ibr-card,
    .ibr-lumi-card {
      min-height: 0;
      border: 1px solid rgba(180, 116, 34, 0.24);
      border-radius: 34px;
      background: rgba(255, 251, 242, 0.82);
      box-shadow:
        0 18px 34px rgba(92, 58, 18, 0.13),
        inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .ibr-card {
      display: grid;
      grid-template-rows: 128px minmax(0, 1fr) 76px;
      padding: 28px 34px 28px;
    }

    .ibr-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 24px;
      align-items: start;
      border-bottom: 1px solid rgba(181, 117, 37, 0.16);
      padding-bottom: 18px;
    }

    .ibr-kicker {
      margin: 0 0 8px;
      color: #b5761f;
      font-size: 17px;
      font-weight: 900;
    }

    .ibr-header h1 {
      margin: 0;
      font-family: "Noto Serif KR", "Noto Sans KR", serif;
      color: #4d2b10;
      font-size: 40px;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.055em;
      word-break: keep-all;
    }

    .ibr-progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 10px;
    }

    .ibr-progress-item {
      display: grid;
      place-items: center;
      gap: 6px;
      color: rgba(102, 66, 28, 0.55);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }

    .ibr-progress-circle {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid rgba(181, 117, 37, 0.2);
      background: rgba(255, 250, 237, 0.8);
      color: #8a5a20;
      font-size: 15px;
      font-weight: 900;
    }

    .ibr-progress-item.active .ibr-progress-circle {
      border: none;
      background: linear-gradient(180deg, #e8bd5e, #a8641e);
      color: #fff9e8;
      box-shadow: 0 8px 16px rgba(128, 76, 18, 0.18);
    }

    .ibr-progress-item.done .ibr-progress-circle {
      border-color: rgba(101, 145, 66, 0.38);
      background: #e9f5de;
      color: #456225;
    }

    .ibr-progress-line {
      flex: 1;
      height: 2px;
      margin-top: -20px;
      background: rgba(181, 117, 37, 0.16);
    }

    .ibr-body {
      min-height: 0;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 20px;
      padding: 22px 0 20px;
    }

    .ibr-side-steps {
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(5, 1fr);
      gap: 10px;
    }

    .ibr-side-step {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid rgba(181, 117, 37, 0.14);
      border-radius: 22px;
      background: rgba(255, 252, 244, 0.7);
      color: #795024;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 8px 14px rgba(101, 63, 18, 0.05);
    }

    .ibr-side-step.active {
      border-color: rgba(187, 113, 26, 0.6);
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 227, 151, 0.5), transparent 40%),
        rgba(255, 247, 224, 0.92);
      box-shadow: 0 12px 20px rgba(130, 76, 18, 0.12);
    }

    .ibr-side-step.done {
      background: rgba(247, 253, 239, 0.82);
      border-color: rgba(101, 145, 66, 0.28);
    }

    .ibr-side-num {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 246, 220, 0.9);
      color: #8b581c;
      font-size: 15px;
      font-weight: 900;
    }

    .ibr-side-step.active .ibr-side-num {
      background: linear-gradient(180deg, #e8bd5e, #a8641e);
      color: #fff9e8;
    }

    .ibr-side-main {
      display: block;
      color: #4e2d10;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.25;
      word-break: keep-all;
    }

    .ibr-side-sub {
      display: block;
      margin-top: 3px;
      color: #8a6335;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
    }

    .ibr-work-card {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
      padding: 24px 26px;
      border: 1px solid rgba(181, 117, 37, 0.16);
      border-radius: 28px;
      background: rgba(255, 252, 244, 0.86);
      box-shadow: 0 12px 22px rgba(101, 63, 18, 0.07);
    }

    .ibr-work-head {
      display: block;
    }

    .ibr-work-title {
      margin: 0 0 8px;
      color: #4e2d10;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.04em;
      word-break: keep-all;
    }

    .ibr-work-desc {
      margin: 0;
      color: #775026;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .ibr-work-body {
      min-height: 0;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 18px;
    }

    .ibr-guide-card {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
      padding: 20px;
      border: 1px solid rgba(181, 117, 37, 0.14);
      border-radius: 24px;
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 231, 159, 0.38), transparent 42%),
        rgba(255, 247, 224, 0.78);
    }

    .ibr-guide-card img {
      width: 112px;
      height: 112px;
      object-fit: contain;
      filter: drop-shadow(0 10px 14px rgba(94, 56, 15, 0.13));
    }

    .ibr-guide-card h3 {
      margin: 0;
      color: #4e2d10;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.04em;
      word-break: keep-all;
    }

    .ibr-guide-card p,
    .ibr-guide-card li {
      color: #775026;
      font-size: 14px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .ibr-guide-card ul {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .ibr-guide-card li {
      padding: 10px 11px;
      border-radius: 16px;
      background: rgba(255, 252, 244, 0.76);
      border: 1px solid rgba(181, 117, 37, 0.12);
    }

    .ibr-form-card {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto auto 82px;
      gap: 14px;
    }

    .ibr-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ibr-field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .ibr-field label {
      color: #5c3615;
      font-size: 16px;
      font-weight: 900;
    }

    .ibr-count {
      color: #b48938;
      font-size: 14px;
      font-weight: 900;
    }

    .ibr-input,
    .ibr-textarea {
      width: 100%;
      border: 1px solid rgba(171, 108, 31, 0.22);
      border-radius: 20px;
      background: rgba(255, 250, 237, 0.94);
      color: #4d2b10;
      font-size: 16px;
      font-weight: 850;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.42);
    }

    .ibr-input {
      height: 54px;
      padding: 0 17px;
    }

    .ibr-textarea {
      min-height: 98px;
      padding: 15px 17px;
      resize: none;
      line-height: 1.5;
    }

    .ibr-input::placeholder,
    .ibr-textarea::placeholder {
      color: rgba(111, 72, 29, 0.52);
    }

    .ibr-feedback {
      min-height: 78px;
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 12px;
      align-items: center;
      padding: 13px 15px;
      border-radius: 20px;
      background: #fff3d5;
      border: 1px solid #eac675;
      color: #5a3e19;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.45;
      word-break: keep-all;
    }

    .ibr-feedback.good {
      background: #eff8e8;
      border-color: #b7d991;
      color: #355628;
    }

    .ibr-feedback.need {
      background: #fff0df;
      border-color: #e6b178;
      color: #6a3d17;
    }

    .ibr-feedback img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 7px 10px rgba(94, 56, 15, 0.13));
    }

    /*
      검사하기 버튼을 루미 피드백 카드 오른쪽에 배치하는 가로 정렬 행.
      왼쪽 .ibr-feedback(루미 이미지+문구)은 남는 공간을 채우고, 오른쪽
      버튼은 내용 크기만큼만 차지한다. 폭이 좁아지면 flex-wrap으로 버튼이
      다음 줄로 자연스럽게 내려간다(겹치지 않음).
    */
    .ibr-feedback-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .ibr-feedback-row .ibr-feedback {
      flex: 1 1 260px;
      min-width: 0;
    }

    .ibr-check-button {
      flex: 0 0 auto;
      height: 56px;
      padding: 0 28px;
      white-space: nowrap;
    }

    .ibr-actions {
      display: flex;
      gap: 14px;
      align-items: center;
      border-top: 1px solid rgba(181, 117, 37, 0.16);
      padding-top: 18px;
    }

    .ibr-actions .ibr-button {
      flex: 1;
    }

    .ibr-actions .ibr-button.primary {
      flex: 1.2;
    }

    .ibr-button {
      height: 58px;
      border-radius: 999px;
      border: 1px solid rgba(174, 109, 27, 0.26);
      background: rgba(255, 250, 237, 0.88);
      color: #5f3714;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(100, 61, 16, 0.1);
    }

    .ibr-button.primary {
      border: none;
      background: linear-gradient(180deg, #e6b656, #a8641e);
      color: #fff9e8;
      box-shadow: 0 12px 22px rgba(128, 76, 18, 0.22);
    }

    .ibr-lumi-card {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 18px;
      padding: 28px 24px 24px;
      background: rgba(255, 251, 242, 0.72);
    }

    .ibr-lumi-bubble {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      padding: 19px 17px;
      border: 1px solid rgba(179, 117, 36, 0.24);
      border-radius: 26px;
      background: rgba(255, 252, 242, 0.96);
      color: #5b3515;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
      box-shadow: 0 12px 22px rgba(98, 59, 15, 0.1);
    }

    .ibr-lumi-wrap {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .ibr-lumi {
      position: relative;
      z-index: 2;
      width: 292px;
      max-height: 485px;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 18px 22px rgba(91, 54, 15, 0.22));
    }

    .ibr-lumi-glow {
      position: absolute;
      left: 50%;
      bottom: 62px;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(255, 218, 121, 0.38), transparent 68%);
      z-index: 1;
    }

    .ibr-complete-modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(42, 25, 8, 0.42);
      z-index: 20;
    }

    .ibr-complete-modal.show {
      display: grid;
    }

    .ibr-modal-box {
      width: min(560px, calc(100vw - 44px));
      padding: 34px 30px 30px;
      border-radius: 30px;
      border: 1px solid rgba(184, 116, 30, 0.28);
      background: rgba(255, 250, 236, 0.98);
      box-shadow: 0 24px 60px rgba(47, 28, 8, 0.26);
      text-align: center;
    }

    .ibr-modal-icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      border-radius: 24px;
      background: linear-gradient(180deg, #e8bd5e, #a8641e);
      color: #fff9e8;
      font-size: 36px;
      box-shadow: 0 14px 24px rgba(128, 76, 18, 0.24);
    }

    .ibr-modal-box h2 {
      margin: 0 0 26px;
      color: #4d2b10;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    @media (max-height: 760px) {
      .ibr-page { padding: 12px 24px; }
      .ibr-shell { grid-template-rows: minmax(58px, auto) minmax(0, 1fr); gap: 10px; }
      .ibr-main { grid-template-columns: minmax(0, 1fr) 310px; gap: 14px; }
      .ibr-card { grid-template-rows: 112px minmax(0, 1fr) 68px; padding: 22px 28px 22px; }
      .ibr-header h1 { font-size: 34px; }
      .ibr-body { grid-template-columns: 250px minmax(0, 1fr); gap: 14px; padding: 18px 0 16px; }
      .ibr-side-step { padding: 10px 12px; }
      .ibr-side-num { width: 40px; height: 40px; }
      .ibr-work-card { padding: 20px; }
      .ibr-work-body { grid-template-columns: 240px minmax(0, 1fr); gap: 14px; }
      .ibr-guide-card { padding: 16px; }
      .ibr-guide-card img { width: 92px; height: 92px; }
      .ibr-input { height: 48px; font-size: 15px; }
      .ibr-textarea { min-height: 78px; font-size: 15px; }
      .ibr-feedback { min-height: 62px; grid-template-columns: 54px 1fr; font-size: 13px; }
      .ibr-feedback img { width: 50px; height: 50px; }
      .ibr-button { height: 52px; font-size: 15px; }
      .ibr-lumi-card { padding: 20px 18px; gap: 14px; }
      .ibr-lumi-bubble { padding: 15px 14px; font-size: 15px; }
      .ibr-lumi { width: 260px; max-height: 390px; }
    }
        /*
      개별읽기 읽기 전 화면 폭 정리
      - 오른쪽 큰 루미 패널 제거
      - 질문 작성 영역을 넓게 사용
      - 책 정하기 / 질문 만들기 입력칸이 비좁지 않게 조정
    */

    .ibr-main {
      grid-template-columns: 1fr !important;
      gap: 0 !important;
    }

    .ibr-lumi-card {
      display: none !important;
    }

    .ibr-card {
      width: 100% !important;
      display: grid !important;
      grid-template-rows: 120px minmax(0, 1fr) 76px !important;
      padding: 28px 36px 28px !important;
    }

    .ibr-header {
      grid-template-columns: minmax(0, 1fr) 380px !important;
      gap: 28px !important;

      /*
        심사 체험 계정은 공용 DB 대신 "현재 브라우저" sessionStorage에
        저장된 값만 복원한다(다른 심사위원 브라우저의 DB 응답이 섞이지
        않게 하기 위함). 일반 학생 계정은 이 분기를 타지 않는다.
      */
      if (isDemoAccount()) {
        const bookContext = loadDemoState("individualBeforeReadingBook", null);
        if (bookContext) {
          document.getElementById("bookTitleInput").value = bookContext.title || "";
          document.getElementById("bookAuthorInput").value = bookContext.author || "";
          if (bookContext.bookType) selectedBookType = bookContext.bookType;
        }

        currentReadingRecordId =
          sessionStorage.getItem("individualReadingRecordId_" + studentId) || currentReadingRecordId;

        const saved = loadDemoState("individualBeforeReading", {});
        steps.forEach(function (step, stepIndex) {
          if (stepIndex === 0) return;
          const item = saved[step.key];
          if (!item) return;
          answers[stepIndex - 1] = {
            question: item.question || "",
            expectedAnswer: item.answer || "",
            passed: true,
            savedQuestion: item.question || "",
            savedAnswer: item.answer || "",
            skipped: !!item.skipped
          };
        });

        if (currentReadingRecordId) {
          currentStepIndex = 1;
        }

        return;
      }

      const token = sessionStorage.getItem("token");

      if (!token) {
        return;
      }

      try {
        const currentResponse = await fetch(
          INDIVIDUAL_READING_API_BASE_URL + "/api/students/me/individual-reading/current",
          {
            headers: {
              Authorization: "Bearer " + token
            }
          }
        );

        if (currentResponse.status === 204) {
          return;
        }

        if (!currentResponse.ok) {
          throw new Error("진행 중인 책 조회 실패: " + currentResponse.status);
        }

        const record = await currentResponse.json();

        currentReadingRecordId = record.readingRecordId;
        sessionStorage.setItem("individualReadingRecordId_" + studentId, String(record.readingRecordId));
        sessionStorage.setItem("individualReadingBookId_" + studentId, String(record.bookId));

        document.getElementById("bookTitleInput").value = record.title || "";
        document.getElementById("bookAuthorInput").value = record.author || "";
        sessionStorage.setItem(STORAGE_KEYS.bookTitle, record.title || "");
        sessionStorage.setItem(STORAGE_KEYS.bookAuthor, record.author || "");

        if (record.bookType) {
          selectedBookType = record.bookType;
          sessionStorage.setItem(STORAGE_KEYS.bookType, record.bookType);
        }

        const beforeResponsesResponse = await fetch(
          INDIVIDUAL_READING_API_BASE_URL +
            "/api/students/me/individual-reading/" +
            currentReadingRecordId +
            "/before-responses",
          {
            headers: {
              Authorization: "Bearer " + token
            }
          }
        );

        if (!beforeResponsesResponse.ok) {
          throw new Error("읽기 전 저장 기록 조회 실패: " + beforeResponsesResponse.status);
        }

        const savedResponses = await beforeResponsesResponse.json();

        savedResponses.forEach(function (item) {
          const stepIndex = steps.findIndex(function (step) {
            return step.key === item.stepType;
          });

          if (stepIndex <= 0) {
            return;
          }

          answers[stepIndex - 1] = {
            question: item.question || "",
            expectedAnswer: item.answer || "",
            passed: true,
            savedQuestion: item.question || "",
            savedAnswer: item.answer || "",
            skipped: !!item.skipped
          };
        });

        /*
          완료 상태(answers[].passed)는 방금 복원한 그대로 유지하되,
          화면은 저장 단계 수와 상관없이 항상 01 제목부터 다시 보여준다
          (사용자가 저장한 내용을 처음부터 순서대로 다시 확인하고 싶어함).
        */
        currentStepIndex = 1;
      } catch (error) {
        console.error("개별읽기 읽기 전 기록을 불러오지 못했습니다.", error);
      }
    }

    function bindEvents() {
      document.getElementById("bookTitleInput").addEventListener("input", updateBookLabel);
      document.getElementById("bookAuthorInput").addEventListener("input", updateBookLabel);
      document.getElementById("questionInput").addEventListener("input", updateTextareaCount);
      document.getElementById("answerInput").addEventListener("input", updateTextareaCount);

      document.getElementById("questionInput").addEventListener("input", resetIndividualPreReadingFeedbackOnEdit);
      document.getElementById("answerInput").addEventListener("input", resetIndividualPreReadingFeedbackOnEdit);
    }

    /*
      심사계정에서는 질문·답 작성, 루미 피드백 결과와 관계없이 "다음"
      버튼이 항상 눌리는 상태여야 한다. 여러 곳에서 nextStepButton을
      직접 잠그는 대신 이 함수를 거치게 해서 isDemoAccount() 분기를
      한 곳에만 두고 놓치는 지점이 없게 한다.
    */
    function setNextStepButtonEnabled(enabled) {
      const nextStepButton = document.getElementById("nextStepButton");
      if (!nextStepButton) return;
      nextStepButton.disabled = isDemoAccount() ? false : !enabled;
    }

    function resetIndividualPreReadingFeedbackOnEdit() {
      if (currentStepIndex === 0) {
        return;
      }

      const answer = answers[currentStepIndex - 1];

      if (!answer) {
        return;
      }

      const currentQuestion = document.getElementById("questionInput").value;
      const currentAnswerText = document.getElementById("answerInput").value;
      const feedbackBox = document.getElementById("feedbackBox");
      const feedbackText = document.getElementById("feedbackText");

      /*
        저장된 값이 있고(한 번이라도 성공적으로 저장된 단계) 지금 입력값이
        그 저장본과 글자 하나까지 완전히 같으면, 도중에 무엇을 고쳤든 다시
        검사할 필요 없이 완료 상태를 그대로 쓴다(되돌려 놓은 경우 포함).
      */
      const matchesSavedValue =
        !!answer.savedQuestion &&
        currentQuestion === answer.savedQuestion &&
        currentAnswerText === answer.savedAnswer;

      if (matchesSavedValue) {
        if (!answer.passed) {
          answer.passed = true;
          individualPreReadingAiRequestId++;

          if (feedbackBox && feedbackText) {
            feedbackBox.classList.remove("need");
            feedbackBox.classList.add("good");
            feedbackText.textContent = "이미 저장된 내용과 같아요. 다음으로 넘어갈 수 있어요!";
          }
        }

        setNextStepButtonEnabled(true);

        return;
      }

      if (!answer.passed) {
        return;
      }

      answer.passed = false;
      individualPreReadingAiRequestId++;

      setNextStepButtonEnabled(false);

      if (feedbackBox && feedbackText) {
        feedbackBox.classList.remove("good", "need");
        feedbackText.textContent = "질문이나 답을 바꿨으니 검사하기를 다시 눌러 줘!";
      }
    }

    function renderAll() {
      renderProgress();
      renderSideSteps();
      renderCurrentStep();
      updateQuestionCount();
      updateBookLabel();
      updateTextareaCount();
    }

    function renderProgress() {
      const topProgress = document.getElementById("topProgress");
      topProgress.innerHTML = "";

      steps.slice(1).forEach((step, index) => {
        const item = document.createElement("div");
        item.className = "ibr-progress-item";
        item.classList.toggle("active", currentStepIndex === index + 1);
        item.classList.toggle("done", answers[index].passed);

        item.innerHTML = `
          <div class="ibr-progress-circle">${step.number}</div>
          <div>${step.short}</div>
        `;

        topProgress.appendChild(item);

        if (index < 3) {
          const line = document.createElement("div");
          line.className = "ibr-progress-line";
          topProgress.appendChild(line);
        }
      });
    }

    function renderSideSteps() {
      const sideSteps = document.getElementById("sideSteps");
      sideSteps.innerHTML = "";

      steps.forEach((step, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "ibr-side-step";
        button.classList.toggle("active", currentStepIndex === index);

        if (index > 0 && answers[index - 1].passed) {
          button.classList.add("done");
        }

        button.innerHTML = `
          <span class="ibr-side-num">${step.number}</span>
          <span>
            <span class="ibr-side-main">${step.sideTitle}</span>
            <span class="ibr-side-sub">${index === 0 ? "먼저 입력하기" : answers[index - 1].passed ? "완성됨" : step.sideSub}</span>
          </span>
        `;

        button.onclick = () => {
          /*
            이미 책이 등록된 상태(currentReadingRecordId 존재)라면 책 정하기
            단계로 다시 들어가지 않는다 - 그 화면에서 다시 등록을 시도하면
            409가 나기 때문이다(goPreviousStep의 제목 단계 제한과 같은 이유).
          */
          if (index === 0 && currentReadingRecordId) {
            return;
          }

          if (index > 1 && !answers[index - 2].passed && !isDemoAccount()) {
            alert("앞 질문을 먼저 저장하면 열려요!");
            return;
          }

          currentStepIndex = index;
          renderAll();
        };

        sideSteps.appendChild(button);
      });
    }

    /*
      심사 체험 계정에서만 보이는 안내 배지. 책 정하기 단계와 질문·답
      작성 단계에서 안내 문구가 다르므로 renderCurrentStep()이 호출될
      때마다 현재 단계에 맞는 문구로 다시 채운다.
    */
    function updateDemoBanner(isBookStep) {
      const banner = document.getElementById("demoExperienceBanner");
      if (!banner) return;

      if (!isDemoAccount()) {
        banner.hidden = true;
        return;
      }

      banner.innerHTML = isBookStep
        ? "🔍 <strong>심사 체험 안내</strong> — 심사계정은 내용을 입력하지 않아도 다음 단계로 이동할 수 있습니다."
        : "🔍 <strong>심사 체험 안내</strong> — 실제 학생은 루미 피드백을 통과해야 다음 단계로 이동하지만, 심사계정은 바로 이동할 수 있습니다.";
      banner.hidden = false;
    }

    function renderCurrentStep() {
      individualPreReadingAiRequestId++;

      const step = steps[currentStepIndex];
      const isBookStep = currentStepIndex === 0;
const answer = isBookStep ? null : answers[currentStepIndex - 1];
const isContentsStep = step.key === "contents";
const isContentsSkipped = isContentsStep && !!(answer && answer.skipped);

/*
  읽을 책 정하기 단계에서는 책 입력 화면 전용 배치를 사용합니다.
*/
document.querySelector(".ibr-page").classList.toggle("book-step", isBookStep);

updateDemoBanner(isBookStep);


      document.getElementById("mainTitle").innerHTML = isBookStep
        ? "이번 모험에서<br>어떤 책을 읽을까요?"
        : "읽기 전 질문을 만들어볼까요?";

      document.getElementById("workTitle").textContent = step.title;
      document.getElementById("workDesc").textContent = step.desc;
      document.getElementById("guideTitle").textContent = step.guideTitle;

      const guideContent = document.getElementById("guideContent");

      if (step.guideType === "list") {
        guideContent.innerHTML = `
          <ul>
            ${step.guideItems.map((item) => `<li>${item}</li>`).join("")}
          </ul>
        `;
      } else {
        guideContent.innerHTML = `<p>${step.guideText}</p>`;
      }

      document.getElementById("bookTitleField").style.display = isBookStep ? "flex" : "none";
      document.getElementById("bookAuthorField").style.display = isBookStep ? "flex" : "none";
      document.querySelectorAll(".ibr-book-type-button").forEach((button) => {
  button.classList.toggle("active", button.dataset.bookType === selectedBookType);
});
      document.getElementById("bookTypeField").style.display = isBookStep ? "flex" : "none";
      document.getElementById("questionField").style.display = isBookStep ? "none" : "flex";
      document.getElementById("answerField").style.display = isBookStep ? "none" : "flex";

      if (!isBookStep) {
        const questionInputEl = document.getElementById("questionInput");
        const answerInputEl = document.getElementById("answerInput");

        if (isContentsSkipped) {
          questionInputEl.placeholder = "이 책에는 차례가 없어요.";
          answerInputEl.placeholder = "차례 질문은 건너뛰었어요.";
          questionInputEl.value = "";
          answerInputEl.value = "";
          questionInputEl.disabled = true;
          answerInputEl.disabled = true;
        } else {
          questionInputEl.placeholder = step.questionPlaceholder;
          answerInputEl.placeholder = step.answerPlaceholder;
          questionInputEl.value = answer.question;
          answerInputEl.value = answer.expectedAnswer;
          questionInputEl.disabled = false;
          answerInputEl.disabled = false;
        }
      }

      const feedbackBox = document.getElementById("feedbackBox");
      feedbackBox.classList.remove("good", "need");

      document.getElementById("feedbackText").textContent = isBookStep
        ? "책 제목을 적고 저장하면 4개의 읽기 전 질문 만들기가 시작돼!"
        : (isContentsSkipped
          ? "이 책에는 차례가 없어 질문 만들기를 건너뛰었어요."
          : "질문과 답을 적고 저장하면 루미가 확인해줄게!");

      const mainActionButton = document.getElementById("mainActionButton");
      const checkAnswerButton = document.getElementById("checkAnswerButton");
      const nextStepButton = document.getElementById("nextStepButton");
      const prevStepButton = document.getElementById("prevStepButton");
      const tocSkipButton = document.getElementById("tocSkipButton");

      /*
        책 정하기 단계는 하단 mainActionButton("책 정하고 질문 만들기 →")을
        그대로 쓰고, 질문 단계(01~04)는 루미 카드 안의 checkAnswerButton
        ("검사하기")만 쓴다 - 같은 handleMainAction()을 호출하므로 동작은
        동일하고 위치/노출만 다르다. 차례 없음 상태에서는 검사할 내용이
        없으므로 검사하기 버튼 자체를 숨긴다.
      */
      if (isBookStep) {
        mainActionButton.style.display = "";
        mainActionButton.textContent = "책 정하고 질문 만들기 →";
        checkAnswerButton.style.display = "none";
      } else {
        mainActionButton.style.display = "none";
        checkAnswerButton.style.display = isContentsSkipped ? "none" : "";
        checkAnswerButton.disabled = false;
      }

      /*
        "차례 없음"/"차례 질문 작성하기" 토글 버튼은 차례(contents) 단계
        에서만 표시하고, 다음 버튼 바로 왼쪽에 고정된 위치(정적 HTML
        순서)를 그대로 쓴다.
      */
      if (tocSkipButton) {
        tocSkipButton.style.display = isContentsStep ? "" : "none";
        tocSkipButton.textContent = isContentsSkipped ? "차례 질문 작성하기" : "차례 없음";
      }

      if (isBookStep) {
        nextStepButton.style.display = "none";
      } else {
        nextStepButton.style.display = "";
        nextStepButton.textContent = currentStepIndex === steps.length - 1
          ? "읽기 전 활동 완료하기"
          : "다음 →";
        setNextStepButtonEnabled(!!(answer && answer.passed));
      }

      /*
        제목 단계(currentStepIndex === 1)의 "이전"은 책 정하기(0) 단계로
        되돌아간다. 책 정하기 단계에서 "다음"을 다시 눌러도
        saveBookAndGoFirstQuestion()이 이미 등록된 읽기 중 기록이 있으면
        재등록 API를 부르지 않으므로 409가 나지 않는다.
      */
      if (prevStepButton) {
        prevStepButton.disabled = false;
      }

      renderLumi(step, isBookStep);
    }

    function renderLumi(step, isBookStep) {
      const lumiBubble = document.getElementById("lumiBubble");
      const lumiImage = document.getElementById("lumiImage");

      if (isBookStep) {
        lumiImage.src = "../assets/images/individual-reading/today-reading-lumi-point.png";
        lumiBubble.innerHTML = "먼저 이번 모험에서<br>읽을 책을 알려줘!";
        return;
      }

      lumiImage.src = "../assets/images/individual-reading/today-reading-lumi-guide.png";
      lumiBubble.innerHTML = `${step.short}에서 단서를 찾아<br>네 질문을 만들어봐!`;
    }

    function updateTextareaCount() {
      const questionInput = document.getElementById("questionInput");
      const answerInput = document.getElementById("answerInput");

      document.getElementById("questionLength").textContent = questionInput.value.length + " / 100";
      document.getElementById("answerLength").textContent = answerInput.value.length + " / 200";
    }

    function updateQuestionCount() {
      const count = answers.filter((item) => item.passed).length;
      document.getElementById("questionCountTop").textContent = "(" + count + "/4)";
    }

    function updateBookLabel() {
  const selectedBookLabel = document.getElementById("selectedBookLabel");
  if (!selectedBookLabel) {
    return;
  }

  const title = document.getElementById("bookTitleInput").value.trim() || sessionStorage.getItem(STORAGE_KEYS.bookTitle) || "";
  const author = document.getElementById("bookAuthorInput").value.trim() || sessionStorage.getItem(STORAGE_KEYS.bookAuthor) || "";
  const bookType = selectedBookType || sessionStorage.getItem(STORAGE_KEYS.bookType) || "";
  const bookTypeLabel = BOOK_TYPE_LABELS[bookType] || "";

  selectedBookLabel.textContent = title
    ? `${author ? `「${title}」 · ${author}` : `「${title}」`}${bookTypeLabel ? ` · ${bookTypeLabel}` : ""}`
    : "아직 정하지 않았어요";
}

    function handleMainAction() {
      if (currentStepIndex === 0) {
        saveBookAndGoFirstQuestion();
        return;
      }

      checkAndGoNext();
    }

    /*
      개별읽기 책 등록 API(POST /api/students/me/individual-reading/books).
      DB가 원본이어야 하므로 등록이 성공한 뒤에만 다음 단계로 넘어가고,
      실패하면(특히 409: 진행 중인 책이 이미 있음) 여기서 멈춘다.
    */
    function getApiBaseUrl() {
  if (window.location.hostname === "127.0.0.1") {
    return "http://127.0.0.1:8080";
  }
  if (window.location.hostname === "localhost") {
    return "http://localhost:8080";
  }
  return "https://victory-production-f94d.up.railway.app";
}

const INDIVIDUAL_READING_API_BASE_URL = getApiBaseUrl();
    async function registerIndividualReadingBook(title, author, bookType) {
      const token = sessionStorage.getItem("token");

      if (!token) {
        alert("로그인이 필요해요. 다시 로그인한 뒤 시도해 주세요.");
        return false;
      }

      try {
        const response = await fetch(
          INDIVIDUAL_READING_API_BASE_URL + "/api/students/me/individual-reading/books",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token
            },
            body: JSON.stringify({
              title: title,
              author: author,
              bookType: bookType
            })
          }
        );

        if (response.status === 409) {
          const errorBody = await response.json().catch(function () {
            return null;
          });

          alert((errorBody && errorBody.message) || "현재 읽고 있는 책을 먼저 마쳐 주세요.");
          return false;
        }

        if (!response.ok) {
          throw new Error("개별읽기 책 등록 실패: " + response.status);
        }

        const record = await response.json();

        currentReadingRecordId = record.readingRecordId;
        sessionStorage.setItem("individualReadingRecordId_" + studentId, String(record.readingRecordId));
        sessionStorage.setItem("individualReadingBookId_" + studentId, String(record.bookId));

        return true;
      } catch (error) {
        console.error("개별읽기 책 등록 중 오류가 발생했습니다.", error);
        alert("지금은 책 등록을 완료하지 못했어요. 잠시 후 다시 시도해 주세요.");
        return false;
      }
    }

    async function saveBookAndGoFirstQuestion() {
  const title = document.getElementById("bookTitleInput").value.trim();
  const author = document.getElementById("bookAuthorInput").value.trim() || "지은이 미입력";

  if (!title && !isDemoAccount()) {
    alert("이번에 읽을 책 제목을 먼저 적어줘!");
    return;
  }

  if (!selectedBookType && !isDemoAccount()) {
    alert("책 종류를 하나 골라줘!");
    return;
  }

  /*
    이미 진행 중인 개별읽기 기록이 있다면(제목 단계에서 "이전"으로
    책 정하기 단계에 다시 돌아온 경우) 책을 다시 등록하려고 하면 서버가
    409로 거부한다. 이 경우 등록 API를 다시 부르지 않고, 화면에 있는
    값을 그대로 로컬(sessionStorage)에 반영한 뒤 제목 단계로 돌아간다.

    심사 체험 계정은 제목/종류를 비워 둔 채로도 다음 단계로 갈 수 있어야
    하는데, 빈 값으로 실제 등록 API(POST .../individual-reading/books)를
    부르면 서버 검증에 걸릴 수 있다. 그래서 심사 계정은 공용 DB에 책을
    새로 만들지 않고, 이 브라우저에서만 쓰는 가짜 진행 ID를 sessionStorage에
    만들어 그대로 다음 단계로 넘어간다.
  */
  if (!currentReadingRecordId) {
    if (isDemoAccount()) {
      currentReadingRecordId =
        sessionStorage.getItem("individualReadingRecordId_" + studentId) ||
        ("demo-" + Date.now());
      sessionStorage.setItem("individualReadingRecordId_" + studentId, currentReadingRecordId);
      saveDemoState("individualBeforeReadingBook", {
        title: title,
        author: author,
        bookType: selectedBookType
      });
    } else {
      const registered = await registerIndividualReadingBook(title, author, selectedBookType);

      if (!registered) {
        return;
      }
    }
  }

  /*
    책 종류 누적 기록을 먼저 불러옵니다.
    핵심:
    - 새 책을 저장하기 전에 기존 기록을 먼저 읽어야 합니다.
    - 그래야 새 책을 고를 때마다 기존 책이 사라지지 않습니다.
  */
  let bookTypeHistory = [];

  try {
    const savedHistory = sessionStorage.getItem(STORAGE_KEYS.bookTypeHistory);
    bookTypeHistory = savedHistory ? JSON.parse(savedHistory) : [];
  } catch (error) {
    bookTypeHistory = [];
  }

  if (!Array.isArray(bookTypeHistory)) {
    bookTypeHistory = [];
  }

  /*
    현재 sessionStorage에 남아 있던 이전 책도 누적 기록에 없으면 살립니다.
    단, 지금 새로 저장하려는 책과 같은 책이면 중복 추가하지 않습니다.
  */
  const previousTitle = sessionStorage.getItem(STORAGE_KEYS.bookTitle);
  const previousAuthor = sessionStorage.getItem(STORAGE_KEYS.bookAuthor) || "지은이 미입력";
  const previousType = sessionStorage.getItem(STORAGE_KEYS.bookType);

  if (previousTitle && previousType) {
    const previousId = previousTitle + "__" + previousAuthor;

    const alreadyHasPrevious = bookTypeHistory.some(function (book) {
      return book.id === previousId;
    });

    if (!alreadyHasPrevious) {
      bookTypeHistory.push({
        id: previousId,
        title: previousTitle,
        author: previousAuthor,
        type: previousType,
        typeName: BOOK_TYPE_LABELS[previousType] || "",
        savedAt: new Date().toISOString()
      });
    }
  }

  /*
    새로 고른 책을 누적 기록에 추가합니다.
    같은 제목+지은이 책이면 새로 추가하지 않고 종류만 갱신합니다.
  */
  const newBookId = title + "__" + author;

  const newBookRecord = {
    id: newBookId,
    title,
    author,
    type: selectedBookType,
    typeName: BOOK_TYPE_LABELS[selectedBookType] || "",
    savedAt: new Date().toISOString()
  };

  const existingBookIndex = bookTypeHistory.findIndex(function (book) {
    return book.id === newBookId;
  });

  if (existingBookIndex >= 0) {
    bookTypeHistory[existingBookIndex] = newBookRecord;
  } else {
    bookTypeHistory.push(newBookRecord);
  }

  /*
    중복 방지:
    혹시 같은 책이 여러 번 들어간 경우 마지막 기록만 남깁니다.
  */
  const uniqueBookMap = {};

  bookTypeHistory.forEach(function (book) {
    if (book && book.id && book.type) {
      uniqueBookMap[book.id] = book;
    }
  });

  const nextBookTypeHistory = Object.values(uniqueBookMap);

  sessionStorage.setItem(STORAGE_KEYS.bookTypeHistory, JSON.stringify(nextBookTypeHistory));

  /*
    마지막에 현재 책 정보를 저장합니다.
    절대 이걸 누적 기록 저장보다 먼저 하면 안 됩니다.
  */
  sessionStorage.setItem(STORAGE_KEYS.bookTitle, title);
  sessionStorage.setItem(STORAGE_KEYS.bookAuthor, author);
  sessionStorage.setItem(STORAGE_KEYS.bookType, selectedBookType);

  // 개별읽기 메인 독서 현황과 읽기 중 그래프에서 함께 사용할 수 있도록 같은 값을 저장합니다.
  sessionStorage.setItem("individualReadingCurrentBookTitle_" + studentId, title);
  sessionStorage.setItem("individualReadingCurrentBookAuthor_" + studentId, author);
  sessionStorage.setItem("individualReadingCurrentBookType_" + studentId, selectedBookType);

  

  currentStepIndex = 1;
  renderAll();
}

    function checkAndGoNext() {
      const question = document.getElementById("questionInput").value.trim();
      const expectedAnswer = document.getElementById("answerInput").value.trim();
      const feedbackBox = document.getElementById("feedbackBox");
      const feedbackText = document.getElementById("feedbackText");
      const step = steps[currentStepIndex];
      const result = validatePreReadingQuestionAndAnswer(
        question,
        expectedAnswer,
        `${step.short}에서 궁금한 점을 한 문장으로 적어봐!`
      );

      const answerIndex = currentStepIndex - 1;

      if (!result.ok) {
        feedbackBox.classList.remove("good", "need");
        feedbackBox.classList.add("need");
        feedbackText.textContent = result.message;

        answers[answerIndex].passed = false;

        setNextStepButtonEnabled(false);

        return;
      }

      answers[answerIndex].question = question;
      answers[answerIndex].expectedAnswer = expectedAnswer;

      requestIndividualPreReadingAiFeedback(feedbackBox, feedbackText, question, expectedAnswer);
    }

    function goNextQuestionStep() {
      if (currentStepIndex < steps.length - 1) {
        currentStepIndex++;
        renderAll();
      } else {
        completeBeforeReading();
      }
    }

    /*
      =========================================================
      6-1. 차례 없음(스킵) 처리 - 개별읽기
      =========================================================
      연습읽기 before-reading.html과 같은 정책. 실제 질문·답을 작성한
      것이 아니므로 AI 검사 요청을 보내지 않고(AI 시도 기록도 남기지
      않는다), 서버에는 question/answer를 빈 값으로, skipped=true로만
      저장한다. 이 단계는 "정상적으로 완료"된 것으로 취급하므로 passed는
      그대로 true를 쓴다.
    */
    let isSavingIndividualContentsSkip = false;
    let stashedIndividualContentsDraft = null;

    function handleTocSkipButtonClick() {
      const answer = answers[currentStepIndex - 1];

      if (answer && answer.skipped) {
        cancelContentsSkipIndividual();
      } else {
        skipContentsStepIndividual();
      }
    }

    async function skipContentsStepIndividual() {
      const answerIndex = currentStepIndex - 1;
      const answer = answers[answerIndex];

      if (isIndividualPreReadingAiRequestInFlight || isSavingIndividualContentsSkip) {
        return;
      }

      /*
        이미 검사를 통과한 정상 질문·답이 저장되어 있다면(차례 없음이
        아니라 실제로 작성해서 통과한 상태), 되돌릴 수 없다는 것을
        학생에게 먼저 확인받는다 - 임의로 조용히 지우지 않는다.
      */
      if (answer.passed && !answer.skipped) {
        const confirmed = window.confirm(
          "작성한 차례 질문과 답이 있어요.\n" +
          "차례 없음으로 바꾸면 이 단계의 작성 내용은 사용하지 않게 됩니다.\n" +
          "계속할까요?"
        );

        if (!confirmed) {
          return;
        }

        stashedIndividualContentsDraft = null;
      } else if (!answer.passed) {
        const questionInputEl = document.getElementById("questionInput");
        const answerInputEl = document.getElementById("answerInput");
        const draftQuestion = questionInputEl ? questionInputEl.value.trim() : answer.question;
        const draftAnswer = answerInputEl ? answerInputEl.value.trim() : answer.expectedAnswer;

        stashedIndividualContentsDraft = (draftQuestion || draftAnswer)
          ? { question: draftQuestion, expectedAnswer: draftAnswer }
          : null;
      }

      const tocSkipButton = document.getElementById("tocSkipButton");
      isSavingIndividualContentsSkip = true;
      if (tocSkipButton) {
        tocSkipButton.disabled = true;
      }

      try {
        const saved = await saveIndividualBeforeResponseToServer("contents", "", "", true);

        if (!saved) {
          alert("차례 없음 처리를 저장하지 못했어. 다시 시도해줘.");
          return;
        }

        lastBeforeStepSaveResult = saved;

        answers[answerIndex] = {
          question: "",
          expectedAnswer: "",
          passed: true,
          savedQuestion: "",
          savedAnswer: "",
          skipped: true
        };

        /*
         * 저장이 성공했을 때만 다음 단계(그림)로 자동 이동한다. 기존
         * "다음" 버튼과 완전히 같은 이동 로직(goNextQuestionStep)을
         * 그대로 재사용해, 차례가 steps 배열의 마지막 단계가 되는
         * 경우가 생기더라도(현재는 아니지만) completeBeforeReading()
         * 분기까지 일관되게 따라가게 한다.
         */
        goNextQuestionStep();
      } catch (error) {
        console.error("차례 없음 처리에 실패했습니다.", error);
        alert("차례 없음 처리를 저장하지 못했어. 다시 시도해줘.");
      } finally {
        isSavingIndividualContentsSkip = false;
        if (tocSkipButton) {
          tocSkipButton.disabled = false;
        }
      }
    }

    /*
      "차례 없음" 취소. 서버에 저장된 skipped 상태는 학생이 실제로 새
      질문·답을 작성해 검사를 통과할 때만(requestIndividualPreReadingAiFeedback의
      저장 경로) 덮어써진다 - 여기서는 화면 상태만 "아직 완료하지 않음"
      으로 되돌려서 입력칸을 다시 활성화한다. 취소만 하고 새로 작성하지
      않은 채 새로고침해도 이전 차례 없음 상태가 안전하게 복원된다.
    */
    function cancelContentsSkipIndividual() {
      const answerIndex = currentStepIndex - 1;
      const answer = answers[answerIndex];

      answer.skipped = false;
      answer.passed = false;
      answer.question = stashedIndividualContentsDraft ? stashedIndividualContentsDraft.question : "";
      answer.expectedAnswer = stashedIndividualContentsDraft ? stashedIndividualContentsDraft.expectedAnswer : "";
      answer.savedQuestion = "";
      answer.savedAnswer = "";
      stashedIndividualContentsDraft = null;

      individualPreReadingAiRequestId++;

      renderAll();
    }

    /*
      =========================================================
      읽기 전 AI 피드백 요청
      =========================================================
      실제 요청/타임아웃/버튼 잠금 로직은 js/pre-reading-validation.js의
      requestPreReadingAiFeedback()(연습읽기 읽기 전과 공용)를 그대로 쓰고,
      여기서는 이 화면의 DOM/상태만 연결한다.
    */
    let isIndividualPreReadingAiRequestInFlight = false;

    function requestIndividualPreReadingAiFeedback(feedbackBox, feedbackText, question, answer) {
      const requestId = ++individualPreReadingAiRequestId;
      const checkAnswerButton = document.getElementById("checkAnswerButton");
      const answerIndex = currentStepIndex - 1;

      const stepKey = steps[currentStepIndex].key;

      requestPreReadingAiFeedback({
        stepType: stepKey,
        bookTitle: sessionStorage.getItem(STORAGE_KEYS.bookTitle) || "",
        question: question,
        answer: answer,
        activityType: "pre_reading_question",
        questionType: stepKey,
        /*
         * evaluationKey는 readingRecordId 유무와 상관없이 항상 채워
         * 인증 API 경로를 타게 한다 - readingRecordId가 없으면
         * pre-reading-validation.js의 가드가 "진행 중인 책 정보를 찾을 수
         * 없어요" 오류로 안전하게 막아준다(공개 API로 조용히 새지 않음).
         */
        evaluationKey: "individual_before_" + (currentReadingRecordId || "unknown") + "_" + stepKey,
        readingRecordId: currentReadingRecordId || undefined,
        requestButton: checkAnswerButton,
        guard: {
          isRequesting: function () {
            return isIndividualPreReadingAiRequestInFlight;
          },
          setRequesting: function (value) {
            isIndividualPreReadingAiRequestInFlight = value;
          }
        },
        onLoading: function () {
          feedbackBox.classList.remove("good", "need");
          feedbackText.textContent = "루미가 답변을 읽고 있어요...";
        },
        onResult: async function (result) {
          if (requestId !== individualPreReadingAiRequestId) {
            return;
          }

          feedbackBox.classList.remove("good", "need");

          if (!result.isGood) {
            feedbackBox.classList.add("need");
            feedbackText.textContent = result.message;
            answers[answerIndex].passed = false;

            setNextStepButtonEnabled(false);
            return;
          }

          /*
            AI 검사와 DB 저장을 분리한다: AI가 good을 줘도 저장이 실패하면
            그 단계를 완료 처리하지 않는다(입력한 내용은 화면에 그대로 남김).
          */
          const stepType = steps[currentStepIndex].key;
          const saved = await saveIndividualBeforeResponseToServer(stepType, question, answer);

          if (requestId !== individualPreReadingAiRequestId) {
            return;
          }

          if (!saved) {
            feedbackBox.classList.add("need");
            feedbackText.textContent = "질문과 답을 저장하지 못했어요. 잠시 후 검사하기를 다시 눌러 줘.";
            answers[answerIndex].passed = false;

            setNextStepButtonEnabled(false);
            return;
          }

          lastBeforeStepSaveResult = saved;

          feedbackBox.classList.add("good");
          feedbackText.textContent = result.message;
          answers[answerIndex].passed = true;
          answers[answerIndex].savedQuestion = question;
          answers[answerIndex].savedAnswer = answer;

          setNextStepButtonEnabled(true);
        }
      });
    }

    /*
      읽기 전 한 단계(title/contents/picture/skim)의 질문·답을 저장한다
      (PUT .../{readingRecordId}/before-responses/{stepType}). AI가 good을
      준 직후에만 호출되며, AI 판정 결과 자체는 이 요청에 담지 않는다.
      응답 body(IndividualBeforeResponseItem)를 그대로 돌려준다 - 마지막
      단계(skim) 응답에만 rewardGranted/stats가 채워져 있어서, 이 값으로
      완료 보상 모달을 띄울지 서버 기준으로 판단한다(클라이언트가 임의로
      "이미 지급했다"고 판단하지 않는다).
    */
    async function saveIndividualBeforeResponseToServer(stepType, question, answer, skipped) {
      /*
        심사 체험 계정은 공용 DB 대신 "현재 브라우저" sessionStorage에만
        저장한다. 같은 ss01 로그인을 쓰는 다른 심사위원 브라우저와 서로
        섞이지 않게 하기 위함이다(일반 학생 계정은 이 분기를 타지 않음).
      */
      if (isDemoAccount()) {
        const saved = loadDemoState("individualBeforeReading", {});
        saved[stepType] = {
          question: question || "",
          answer: answer || "",
          skipped: !!skipped,
          /* 이 함수는 AI good 직후(또는 차례 없음 처리)에만 호출된다. */
          aiPassed: !skipped,
          readingRecordId: String(
            currentReadingRecordId ||
            sessionStorage.getItem("individualReadingRecordId_" + studentId) ||
            ""
          ),
          bookTitle: sessionStorage.getItem(STORAGE_KEYS.bookTitle) || "",
          updatedAt: new Date().toISOString()
        };
        saveDemoState("individualBeforeReading", saved);
        return { demoSaved: true, stepType: stepType, question: question, answer: answer, skipped: !!skipped };
      }

      const token = sessionStorage.getItem("token");
      const readingRecordId =
        currentReadingRecordId || sessionStorage.getItem("individualReadingRecordId_" + studentId);

      if (!token || !readingRecordId) {
        console.error("진행 중인 개별읽기 책 정보를 찾을 수 없어 읽기 전 질문·답을 저장하지 못했습니다.");
        return null;
      }

      try {
        const response = await fetch(
          INDIVIDUAL_READING_API_BASE_URL +
            "/api/students/me/individual-reading/" +
            readingRecordId +
            "/before-responses/" +
            stepType,
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token
            },
            body: JSON.stringify({
              question: question,
              answer: answer,
              skipped: !!skipped
            })
          }
        );

        if (!response.ok) {
          throw new Error("읽기 전 질문·답 저장 실패: " + response.status);
        }

        return await response.json();
      } catch (error) {
        console.error("개별읽기 읽기 전 질문·답을 저장하지 못했습니다.", error);
        return null;
      }
    }

    /*
      마지막으로 서버에 저장한 읽기 전 단계 응답. 4단계(skim)를 처음 완료한
      순간에만 rewardGranted:true + stats가 채워져서 오고, 그 외에는
      rewardGranted:false다 - completeBeforeReading()이 이 값만 보고 보상
      모달을 띄울지 정한다(sessionStorage의 "이미 봤는지" 플래그를 쓰지 않는다).
    */
    let lastBeforeStepSaveResult = null;

   function completeBeforeReading() {
  saveBeforeReadingAdventure();

  sessionStorage.setItem(STORAGE_KEYS.stage, "during");

  if (isDemoAccount()) {
    const demoProgress = loadDemoState("individualAdventureProgress", {});
    demoProgress.beforeDone = true;
    demoProgress.stage = "during";
    saveDemoState("individualAdventureProgress", demoProgress);

    /*
      심사계정은 입력칸이 비어 있어도 "다음 단계로 이동했다"는 사실
      자체를 읽기 전 완료로 본다(일반계정처럼 4단계 질문이 실제로 저장돼
      있는지 검증하지 않는다). readingRecordId(demo-*로 시작하는 이 책의
      진행 ID)당 최초 1회만 지급되므로, 이 단계를 여러 번 왔다 갔다 해도
      다시 지급되지 않는다 - 새 책을 시작하면 readingRecordId가 새로
      생기므로 그 책에서는 다시 지급된다.
    */
    const demoReadingRecordId = currentReadingRecordId ||
      sessionStorage.getItem("individualReadingRecordId_" + studentId);
    let demoResult = null;
    if (typeof grantDemoStatRewardOnce === "function") {
      demoResult = grantDemoStatRewardOnce("individual-before", demoReadingRecordId, { magic: 1, wisdom: 1 });
    } else {
      console.error("grantDemoStatRewardOnce를 찾을 수 없어 읽기 전 보상을 지급하지 못했습니다.");
    }

    if (demoResult && demoResult.rewardGranted) {
      if (typeof openMiniRewardModal !== "function") {
        console.error("openMiniRewardModal을 찾을 수 없어 읽기 전 보상 팝업을 표시하지 못했습니다.");
      } else {
        openMiniRewardModal({
          badge: "✨ 나의 힘 성장!",
          title: "읽기 전 준비 보상!",
          message: "루미: 좋아! 이제 읽기 중 모험으로 떠나자!",
          rewards: [
            { type: "magic", name: "마법력", point: "+1" },
            { type: "wisdom", name: "지혜", point: "+1" }
          ],
          nextAction: function () {
            document.getElementById("completeModal").classList.add("show");
          }
        });
        return;
      }
    }

    document.getElementById("completeModal").classList.add("show");
    return;
  }

  const rewardGranted = !!(lastBeforeStepSaveResult && lastBeforeStepSaveResult.rewardGranted);

  if (rewardGranted && typeof openMiniRewardModal === "function") {
    openMiniRewardModal({
      badge: "✨ 나의 힘 성장!",
      title: "읽기 전 준비 보상!",
      message: "루미: 좋아! 이제 읽기 중 모험으로 떠나자!",
      rewards: [
        { type: "magic", name: "마법력", point: "+1" },
        { type: "wisdom", name: "지혜", point: "+1" }
      ],
      nextAction: function () {
        document.getElementById("completeModal").classList.add("show");
      }
    });
    return;
  }

  document.getElementById("completeModal").classList.add("show");
}

    function saveBeforeReadingAdventure() {
      const payload = {
        studentId,
        bookTitle: sessionStorage.getItem(STORAGE_KEYS.bookTitle),
        bookAuthor: sessionStorage.getItem(STORAGE_KEYS.bookAuthor),
        bookType: sessionStorage.getItem(STORAGE_KEYS.bookType),
bookTypeName: BOOK_TYPE_LABELS[sessionStorage.getItem(STORAGE_KEYS.bookType)] || "",
        questions: steps.slice(1).map((step, index) => {
          return {
            type: step.key,
            typeName: step.title,
            question: answers[index].question,
            expectedAnswer: answers[index].expectedAnswer
          };
        })
      };

      sessionStorage.setItem("individualBeforeReadingPayload_" + studentId, JSON.stringify(payload));
      console.log("개별읽기 읽기 전 저장 데이터:", payload);
    }

    function goPreviousStep() {
      if (currentStepIndex === 0) {
        goTodayAdventure();
        return;
      }

      /*
        제목 단계(1)의 "이전"은 책 정하기(0) 단계로 이동한다(01→00,
        02→01, 03→02, 04→03과 같은 규칙). 책 정하기 단계에서 기존 책
        제목·유형을 확인·수정한 뒤 "다음"을 누르면 다시 제목 단계(1)로
        돌아온다 - saveBookAndGoFirstQuestion()이 이미 등록된 기록이면
        재등록 API를 부르지 않아 409가 발생하지 않는다.
      */
      currentStepIndex--;
      renderAll();
    }

    function showFirstIncompleteQuestion() {
      const incompleteIndex = answers.findIndex((item) => !item.passed);

      currentStepIndex = incompleteIndex === -1 ? 1 : incompleteIndex + 1;
      renderAll();
    }
