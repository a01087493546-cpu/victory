    function initPage() {
      myBeforeReadingData = loadMyQuestions();

      document.getElementById("bookTitle").textContent =
        "「" + myBeforeReadingData.bookTitle + "」";

      renderMyQuestions();
      renderFilters();
      renderFriendQuestions();
      renderAnswerArea();
    }

    // before-reading.html에서 저장한 내 질문을 불러옵니다.
    function loadMyQuestions() {
      const savedData = sessionStorage.getItem("beforeReadingQuestions_" + studentId);

      if (savedData) {
        return JSON.parse(savedData);
      }

      // 직접 주소로 들어온 경우를 대비한 예시 데이터입니다.
      return {
        studentId: studentId,
        studentName: studentName,
        bookId: "book001",
        bookTitle: "신통방통 홈 쇼핑",
        questions: [
          {
            type: "title",
            typeName: "제목을 보고 질문 만들기",

        ]
      };
    }

    /*
      =========================================================
      3. 내 질문 렌더링
      =========================================================
    */

    function renderMyQuestions() {
      const list = document.getElementById("myQuestionList");
      const count = document.getElementById("myQuestionCount");

      count.textContent = myBeforeReadingData.questions.length + "개";
      list.innerHTML = "";

      myBeforeReadingData.questions.forEach(function(item) {
        const card = document.createElement("article");
        card.className = "my-question-card";

        card.innerHTML = `
          <p class="question-type">${item.typeName}</p>
          <p class="question-text">질문 · ${item.question}</p>
          <p class="answer-text">내가 생각한 답 · ${item.expectedAnswer}</p>
        `;

        list.appendChild(card);
      });
    }

    function renderFilters() {
      const filterRow = document.getElementById("filterRow");
      filterRow.innerHTML = "";

      questionTypes.forEach(function(item) {
        const button = document.createElement("button");
        button.className = "filter-button";

        if (currentFilter === item.type) {
          button.classList.add("active");
        }

        button.textContent = item.label;

        button.onclick = function() {
          currentFilter = item.type;
          selectedFriendQuestionId = null;
          renderFilters();
          renderFriendQuestions();
          renderAnswerArea();
        };

        filterRow.appendChild(button);
      });
    }

    function renderFriendQuestions() {
      const list = document.getElementById("friendQuestionList");
      const count = document.getElementById("friendQuestionCount");

      const filteredQuestions = getFilteredFriendQuestions();

      count.textContent = filteredQuestions.length + "개";
      list.innerHTML = "";

      filteredQuestions.forEach(function(item) {
        const button = document.createElement("button");
        button.className = "friend-question-card";

        if (selectedFriendQuestionId === item.id) {
          button.classList.add("active");
        }

        button.innerHTML = `
          <p class="friend-name">${item.friendName} · ${item.typeName}</p>
          <p class="friend-question">${item.question}</p>
        `;

        button.onclick = function() {
          selectedFriendQuestionId = item.id;
          renderFriendQuestions();
          renderAnswerArea();
        };

        list.appendChild(button);
      });
    }

    function getFilteredFriendQuestions() {
      if (currentFilter === "all") {
        return mockFriendQuestions;
      }

      return mockFriendQuestions.filter(function(item) {
        return item.type === currentFilter;
      });
    }

    /*
      =========================================================
      5. 친구 질문에 답하기
      =========================================================
    */
function renderOtherFriendAnswers(questionId) {
  const answers = mockOtherFriendAnswers[questionId] || [];

  if (answers.length === 0) {
    return "";
  }

  return `
    <article class="other-answer-box">
      <h3 class="other-answer-title">다른 친구들의 답</h3>

      <div class="other-answer-list">
        ${answers.map(function(item) {
          return `
            <div class="other-answer-item">
              <p class="other-answer-name">${item.name}의 답</p>
              <p class="other-answer-text">${item.answer}</p>
            </div>
          `;
        }).join("")}
      </div>
    </article>
  `;
}
    function renderAnswerArea() {
      const answerArea = document.getElementById("answerArea");
      const selectedQuestion = mockFriendQuestions.find(function(item) {
        return item.id === selectedFriendQuestionId;
      });

      if (!selectedQuestion) {
        answerArea.innerHTML = `
          <div class="answer-empty">
            친구의 질문을 하나 선택해 봐요.<br>
            선택한 질문에 내 생각을 답으로 적을 수 있어요.
          </div>
        `;
        return;
      }

      const savedAnswer = loadFriendAnswer(selectedQuestion.id);

      answerArea.innerHTML = `
        <article class="selected-box">
          <p class="selected-title">${selectedQuestion.friendName}의 질문 · ${selectedQuestion.typeName}</p>
          <p class="selected-question">${selectedQuestion.question}</p>
        </article>
${renderOtherFriendAnswers(selectedQuestion.id)}
        <article class="answer-write-box">
          <div class="write-label-row">
            <label class="write-label" for="friendAnswerInput">이 질문에 대한 내 답</label>
            <span class="write-help" id="friendAnswerLength">0 / 200</span>
          </div>

          <textarea
            id="friendAnswerInput"
            maxlength="200"
            placeholder="친구의 질문을 읽고 내가 생각한 답을 적어 봐요."
          >${savedAnswer}</textarea>

          

         <div class="bottom-actions">
  <button class="plain-button" type="button" onclick="clearFriendAnswer()">
    지우기
  </button>

  <button class="main-button" type="button" onclick="saveFriendAnswer()">
    답 저장하기
  </button>

  <button class="main-button" type="button" onclick="completeShareAndGoDuringReading()">
    공유 활동 완료 →
  </button>
</div>
        </article>
      `;

      bindFriendAnswerInput();
      updateFriendAnswerLength();
    }

    function bindFriendAnswerInput() {
      const input = document.getElementById("friendAnswerInput");

      input.addEventListener("input", updateFriendAnswerLength);
    }

    function updateFriendAnswerLength() {
      const input = document.getElementById("friendAnswerInput");
      const lengthText = document.getElementById("friendAnswerLength");

      if (!input || !lengthText) {
        return;
      }

      lengthText.textContent = input.value.length + " / 200";
    }

    function saveFriendAnswer() {
  const selectedQuestion = mockFriendQuestions.find(function(item) {
    return item.id === selectedFriendQuestionId;
  });

  const input = document.getElementById("friendAnswerInput");
  const answer = input.value.trim();

  if (!answer) {
    alert("답이 아직 비어 있어요. 친구 질문을 보고 떠오른 생각을 적어 봐요.");
    input.focus();
    return;
  }

  const key = "beforeReadingFriendAnswer_" + studentId + "_" + selectedQuestion.id;

  sessionStorage.setItem(key, JSON.stringify({
    friendQuestionId: selectedQuestion.id,
    friendName: selectedQuestion.friendName,
    question: selectedQuestion.question,
    answer: answer
  }));

  alert("답이 저장되었어요.");
}

    function loadFriendAnswer(questionId) {
      const key = "beforeReadingFriendAnswer_" + studentId + "_" + questionId;
      const savedAnswer = sessionStorage.getItem(key);

      if (!savedAnswer) {
        return "";
      }

      return JSON.parse(savedAnswer).answer;
    }

    function clearFriendAnswer() {
      const input = document.getElementById("friendAnswerInput");

      input.value = "";
      updateFriendAnswerLength();
    }

    /*
      =========================================================
      6. 이동 함수
      =========================================================
    */

    function goHome() {
      location.href = "./home.html";
    }

    function goPractice() {
      location.href = "./practice.html";
    }
// 읽기 전 공유 활동을 완료하고 읽기 중 인트로로 이동합니다.
// 읽기 전 공유 활동을 완료하고 연습하기 화면으로 돌아갑니다.
function completeShareAndGoDuringReading() {
  const progressKey = "practiceProgress_" + studentId;

  const progress = JSON.parse(sessionStorage.getItem(progressKey)) || {
    book: false,
    before: false,
    during: false,
    classRead: false,
    after: false
  };

  progress.book = true;
  progress.before = true;

  sessionStorage.setItem(progressKey, JSON.stringify(progress));
  sessionStorage.setItem("beforeReadingShareCompleted_" + studentId, "true");

  location.href = "./practice.html";
}
    function goBeforeReading() {
      location.href = "./before-reading.html";
    }
    function isTeacherMode() {
  const params = new URLSearchParams(window.location.search);
  return params.get("mode") === "teacher";
}

function goTeacherPractice() {
  location.href = "../teacher/practice-teacher.html";
}

if (isTeacherMode()) {
  const teacherReturnButton = document.getElementById("teacherReturnButton");

  if (teacherReturnButton) {
    teacherReturnButton.style.display = "block";
  }
}
  </script>
