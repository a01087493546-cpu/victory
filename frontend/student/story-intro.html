<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문답책 - 이야기 시작</title>

  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <main id="storyPage" class="story-intro-page">
    <div class="story-dark-layer"></div>

    <button id="skipStoryButton" class="story-skip-button" type="button" onclick="skipStory()">
      건너뛰기
    </button>

    <section class="story-scene-area">
      <div id="storyCharacter" class="story-character"></div>
    </section>

    <section class="story-dialog-box">
      <div class="story-dialog-header">
        <div>
          <p id="storySpeaker" class="story-speaker">루미</p>
          <h1 id="storyTitle" class="story-title"></h1>
        </div>

        <p id="storyCount" class="story-count">1 / 6</p>
      </div>

   <!-- 장면 설명은 JS에서 필요할 때 넣습니다. 지금은 중복 표시를 막기 위해 비워둡니다. -->
<p id="storyScene" class="story-scene-text"></p>

<!-- 스토리 본문은 story-intro.js에서 현재 장면에 맞게 바뀝니다. -->
<!-- JS가 늦게 불러와져도 첫 장면 문구가 보이도록 기본 문장을 넣어둡니다. -->
<p id="storyText" class="story-main-text">
  아무리 배워도 만족하지 못하는 용이 있었어.
  그 용은 세상의 지식을 모두 혼자 갖고 싶어 했지.
</p>
      <div class="story-bottom-area">
        <button id="prevStoryButton" class="story-nav-button prev" type="button" onclick="goPrevStory()">
          이전
        </button>

        <div id="storyDots" class="story-dots"></div>

        <button id="nextStoryButton" class="story-nav-button next" type="button" onclick="goNextStory()">
          다음
        </button>
      </div>
    </section>
  </main>

  <script src="../js/auth.js"></script>
  <script src="../js/story-intro.js"></script>
</body>
</html>
