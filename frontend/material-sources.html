<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문답책 - 사용 자료 출처</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #1b1008;
    }

    .source-pdf-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #2a1a0d;
    }

    .source-exit-button {
      position: fixed;
      top: 18px;
      right: 24px;
      z-index: 1000;
      min-width: 112px;
      min-height: 48px;
      padding: 10px 18px;
      border: 2px solid rgba(255, 221, 150, 0.78);
      border-radius: 13px;
      background: linear-gradient(180deg, #fff0b8, #dca951);
      color: #45260f;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      font-size: 17px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      box-shadow:
        0 5px 0 rgba(91, 49, 13, 0.82),
        0 10px 22px rgba(0, 0, 0, 0.34);
    }

    .source-exit-button:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .source-exit-button:focus-visible {
      outline: 3px solid #fff4cf;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <iframe
    class="source-pdf-frame"
    src="./assets/docs/material-sources.pdf"
    title="문답책 사용 자료 출처 PDF"
  ></iframe>

  <button class="source-exit-button" type="button" id="sourceExitButton">
    ✕ 나가기
  </button>

  <script>
    document.getElementById("sourceExitButton").addEventListener("click", function () {
      window.close();

      window.setTimeout(function () {
        if (window.closed) return;

        if (window.history.length > 1) {
          window.history.back();
          return;
        }

        window.location.replace("./index.html");
      }, 150);
    });
  </script>
</body>
</html>
