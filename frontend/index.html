<!--
  파일명: index.html
  역할: 문답책 프로젝트의 첫 로그인 화면입니다.

  화면 구성:
  1. 왼쪽: 문답책 소개, 용사/드래곤 모험 장면
  2. 오른쪽: 학생/교사 역할 선택 및 로그인
  3. 하단: 사용 자료 출처 확인 버튼

  저작권/출처:
  - UI 구조와 버튼은 HTML/CSS로 직접 제작합니다.
  - 캐릭터/드래곤 이미지는 AI 생성 이미지이며 source-data.js에 출처를 기록합니다.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>문답책 - 로그인</title>

  <!-- 공통 디자인 CSS -->
  <link rel="stylesheet" href="./css/common.css">

    <style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #1b1008;
  }

  .mq-stage-viewport {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1b1008;
  }

  .mq-stage-frame {
    width: calc(1920px * var(--stage-scale, 1));
    height: calc(1080px * var(--stage-scale, 1));
    position: relative;
    overflow: hidden;
    flex: 0 0 auto;
  }

  .mq-login-page {
    position: relative;
    width: 1920px !important;
    height: 1080px !important;
    min-width: 1920px !important;
    min-height: 1080px !important;
    overflow: hidden;
    transform: scale(var(--stage-scale, 1));
    transform-origin: top left;
  }

  /* 왼쪽 모험 장면 */
  .mq-visual-area {
    position: absolute !important;
    left: 0;
    top: 0;
    width: 1220px;
    height: 1080px;
    z-index: 1;
    overflow: hidden;
  }

  /* 오른쪽 로그인 영역 */
  .mq-login-area {
    position: absolute !important;
    left: 1180px;
    top: 0;
    width: 740px;
    height: 1080px;
    z-index: 20;
    display: flex !important;
    align-items: center;
    justify-content: flex-start;
    padding-left: 24px !important;
    margin: 0 !important;
    background: transparent !important;
    overflow: visible;
    transform: none !important;
  }

  /* 로그인 카드 크기 키우기 */
  .mq-login-card {
    position: relative !important;
    width: 640px;
    max-width: 640px;
    margin: 0 !important;
    padding: 54px 42px 34px !important;
    transform: none !important;
  }

  /* 하단 멘트 카드 위치 이동 */
       .mq-login-page .mq-visual-area .mq-visual-content .mq-bottom-message {
    position: absolute !important;
    left: 120px !important;
    top: 775px !important;
    width: 720px !important;
    min-height: 120px !important;
    margin: 0 !important;
    padding: 0 34px !important;
    z-index: 999 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    text-align: center !important;
    font-size: 24px !important;
    line-height: 1.45 !important;
    font-weight: 900 !important;
    transform: none !important;
  }

  /* 왼쪽 타이틀 쪽 크기 키우기 */
  .mq-book-emblem,
  .mq-logo-image {
    width: 110px !important;
    height: 110px !important;
  }

  .mq-kicker {
    font-size: 24px !important;
  }

  .mq-title {
    font-size: 92px !important;
    line-height: 1 !important;
  }

  .mq-main-copy {
    font-size: 24px !important;
    line-height: 1.5 !important;
    max-width: 520px;
  }

  /* 로그인 카드 안쪽 크기 키우기 */
  .mq-login-title {
    font-size: 58px !important;
    line-height: 1.1 !important;
    margin-bottom: 16px !important;
  }

  .mq-login-subtitle {
    font-size: 22px !important;
    margin-bottom: 28px !important;
  }

  .mq-role-grid {
    gap: 18px !important;
    margin-bottom: 28px !important;
  }

  .mq-role-card {
    min-height: 210px !important;
    padding: 18px 16px !important;
  }

  .mq-role-image {
    width: 90px !important;
    height: 90px !important;
    object-fit: contain;
  }

  .mq-role-card strong {
    font-size: 28px !important;
  }

  .mq-role-card span {
    font-size: 18px !important;
  }

  .mq-login-form label {
    font-size: 22px !important;
    margin-bottom: 8px !important;
  }

  .mq-login-form input {
    height: 64px !important;
    font-size: 22px !important;
    padding: 0 18px !important;
    margin-bottom: 18px !important;
  }

  .login-start-btn,
  .mq-source-button {
    height: 68px !important;
    font-size: 22px !important;
  }

  .mq-source-button {
    margin-top: 16px !important;
  }

  /* 처음 이용하는 교사를 위한 계정 등록 안내 */
  .mq-register-guide {
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    font-size: 18px;
    font-weight: 700;
    color: #6b431f;
  }

  .mq-register-link {
    padding: 0;
    border: 0;
    border-bottom: 2px solid #8c541d;
    background: transparent;
    color: #7a4517;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
  }

  .mq-register-link:hover {
    color: #3f842e;
    border-bottom-color: #3f842e;
  }
</style>

  <!-- 사용 자료 출처 데이터 -->
  <script defer src="./js/source-data.js"></script>

  <!-- 로그인/출처 모달 기능 -->
  <script defer src="./js/auth.js"></script>
</head>

<body>
  <div class="mq-stage-viewport">
    <div class="mq-stage-frame" id="loginStageFrame">
      <!-- 전체 로그인 화면 -->
      <main class="mq-login-page" id="loginFixedStage">

        <!-- 왼쪽 모험 소개 영역 -->
        <section class="mq-visual-area">

      <!-- 어두운 배경 위에 살짝 덮는 효과 -->
      <div class="mq-visual-overlay"></div>

      <!-- 왼쪽 텍스트와 캐릭터가 들어가는 실제 내용 영역 -->
      <div class="mq-visual-content">

        <!-- 위쪽 책 아이콘 -->
       <div class="mq-book-emblem">
  <img
    src="./assets/images/logo-book.png"
    alt="문답책 로고 엠블럼"
    class="mq-logo-image"
  >
</div>

        <!-- 작은 부제 -->
        <p class="mq-kicker">
         질문 독서 프로젝트
        </p>

        <!-- 공식 서비스 이름 -->
        <h1 class="mq-title">
          문답책
        </h1>

        <!-- 기존 목표 문구 -->
        <p class="mq-main-copy">
          책을 읽고 좋은 질문을 만들며<br>
          지식창고를 빼앗은 용을 물리치는 독서 모험
        </p>

        <!-- 캐릭터/드래곤 장면 -->
        <div class="mq-character-scene">

          <!-- 뒤쪽 드래곤 -->
          <img
            src="./assets/images/dragon-main.png"
            alt="지식창고를 빼앗은 드래곤 캐릭터"
            class="mq-dragon"
          >

          <!-- 앞쪽 학생 용사 -->
          <img
            src="./assets/images/role-student.png"
            alt="책과 검을 들고 모험을 시작하는 학생 용사 캐릭터"
            class="mq-hero"
          >

        </div>

        <!-- 아래 설명 박스: 원래 있던 멘트 유지 -->
        <div class="mq-bottom-message">
          깊이 있는 질문은 용을 약하게 만들고,<br>
          용사의 힘을 성장시킵니다.
        </div>
      </div>
        </section>

        <!-- 오른쪽 로그인 영역 -->
        <section class="mq-login-area">

      <!-- 로그인 카드 -->
      <div class="mq-login-card">

        <h2 class="mq-login-title">
          모험 입장
        </h2>

        <p class="mq-login-subtitle">
          역할을 선택하고 계정으로 로그인하세요.
        </p>

        <!-- 역할 선택 -->
        <div class="mq-role-grid">

          <!-- 학생 선택 -->
          <button type="button" class="mq-role-card active" data-role="student" id="studentRoleButton">
            <div class="mq-role-image-box">
              <img
                src="./assets/images/role-student.png"
                alt="학생 역할 캐릭터"
                class="mq-role-image"
              >
            </div>

            <strong>학생</strong>
            <span>질문 훈련과 독서 모험</span>
          </button>

          <!-- 교사 선택 -->
          <button type="button" class="mq-role-card" data-role="teacher" id="teacherRoleButton">
            <div class="mq-role-image-box">
              <img
  src="./assets/images/role-teacher.png"
  alt="교사 역할 캐릭터"
  class="mq-role-image"
>
            </div>

            <strong>교사</strong>
            <span>학생 활동 관리</span>
          </button>
        </div>

                      <!-- 로그인 입력 영역 -->
        <form id="loginForm" class="mq-login-form">

          <!-- 아이디 입력칸입니다. -->
          <label for="loginId">
            아이디
          </label>

          <input
            type="text"
            id="loginId"
            placeholder="아이디를 입력하세요"
            autocomplete="username"
          >

          <!-- 비밀번호 입력칸입니다. -->
          <label for="loginPassword">
            비밀번호
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password"
          >

          <!-- 로그인 버튼입니다. -->
          <!-- type="submit"이어야 auth.js의 form 제출 이벤트가 실행됩니다. -->
          <button class="login-start-btn" type="submit">
            로그인하고 시작하기
          </button>
        </form>

        <!-- 처음 이용하는 교사를 위한 계정 등록 안내: 로그인과 무관하게 바로 이동합니다. -->
        <div class="mq-register-guide">
          <span>처음 이용하시나요?</span>

          <button
            type="button"
            class="mq-register-link"
            onclick="location.href='./teacher/teacher-register.html'"
          >
            교사 계정 등록하러 가기
          </button>
        </div>

        <!-- 사용 자료 출처 버튼: 심사위원이 확인하기 쉽게 크게 배치 -->
        <button type="button" class="mq-source-button" id="openSourceButton">
          <span>ⓘ</span>
          사용 자료 출처
        </button>
      </div>
        </section>
      </main>
    </div>
  </div>

  <!-- 출처 모달 -->
  <div class="modal-backdrop hidden" id="sourceModal">

    <section class="source-modal">

      <div class="modal-header">
        <h3>
          사용 자료 출처
        </h3>

        <button type="button" class="modal-close-btn" id="closeSourceButton">
          ✕
        </button>
      </div>

      <p class="modal-desc">
        이미지 자료의 출처는 최초 사용 화면을 기준으로 기록하였으며, 같은 이미지의 반복 표기는 생략하였습니다.
      </p>

      <div class="source-list" id="sourceList">
        <p class="empty-source">
          출처 목록을 불러오는 중입니다.
        </p>
      </div>

    </section>
  </div>

  <script>
    function updateLoginStageScale() {
      const stage = document.getElementById("loginFixedStage");
      const frame = document.getElementById("loginStageFrame");

      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY, 1);

      stage.style.setProperty("--stage-scale", scale);
      frame.style.setProperty("--stage-scale", scale);
    }

    updateLoginStageScale();
    window.addEventListener("resize", updateLoginStageScale);
  </script>  
</body>
</html>
