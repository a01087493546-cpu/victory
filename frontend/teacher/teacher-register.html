<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문답책 - 교사 계정 등록</title>

  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&display=swap");

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #fff1cc;
      background:
        linear-gradient(180deg, rgba(9, 5, 2, 0.12), rgba(9, 5, 2, 0.70)),
        url("../assets/images/after-read/after-reading-main-bg.png");
      background-size: cover;
      background-position: center;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .tr-page {
      width: 100vw;
      height: 100vh;
      padding: 14px 22px 18px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 16%, rgba(255, 213, 111, 0.14), transparent 30%),
        linear-gradient(90deg, rgba(4, 2, 1, 0.58), rgba(4, 2, 1, 0.08), rgba(4, 2, 1, 0.58));
    }

    .tr-shell {
      width: min(1480px, 100%);
      height: calc(100vh - 32px);
      margin: 0 auto;
      display: grid;
      grid-template-rows: 66px minmax(0, 1fr);
      gap: 14px;
      min-width: 0;
    }

    .tr-topbar {
      height: 66px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 260px;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      border-radius: 26px;
      border: 1.5px solid rgba(255, 203, 112, 0.68);
      background:
        linear-gradient(90deg, rgba(12, 7, 3, 0.94), rgba(50, 27, 10, 0.78), rgba(12, 7, 3, 0.94));
      box-shadow:
        0 18px 36px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 237, 184, 0.20);
    }

    .tr-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff4cf;
      font-family: "Noto Serif KR", serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.8px;
      white-space: nowrap;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.42);
    }

    .tr-brand-mark {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(255, 220, 141, 0.72);
      background:
        radial-gradient(circle at 35% 20%, rgba(255, 242, 190, 0.42), transparent 42%),
        linear-gradient(180deg, rgba(126, 78, 27, 0.94), rgba(38, 21, 9, 0.98));
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        0 10px 22px rgba(0, 0, 0, 0.28);
    }

    .tr-brand-mark img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
    }

    .tr-title {
      text-align: center;
      color: #ffe9a8;
      font-family: "Noto Serif KR", serif;
      font-size: 40px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
      text-shadow:
        0 2px 0 rgba(60, 31, 8, 0.96),
        0 0 18px rgba(255, 211, 111, 0.30),
        0 8px 24px rgba(0, 0, 0, 0.42);
    }

    .tr-top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .tr-pill-button {
      height: 39px;
      padding: 0 17px;
      border-radius: 999px;
      border: 1px solid rgba(255, 215, 132, 0.72);
      background: linear-gradient(180deg, rgba(130, 78, 26, 0.98), rgba(62, 30, 8, 0.98));
      color: #fff1c9;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
      box-shadow:
        0 5px 0 rgba(27, 13, 4, 0.76),
        inset 0 1px 0 rgba(255, 238, 190, 0.18);
    }

    .tr-main {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr;
      overflow: hidden;
    }

    .tr-board {
      height: 100%;
      min-height: 0;
      padding: 34px 42px 36px;
      border-radius: 32px;
      border: 1.5px solid rgba(255, 205, 112, 0.66);
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 218, 128, 0.16), transparent 32%),
        linear-gradient(180deg, rgba(16, 10, 5, 0.82), rgba(23, 13, 6, 0.88));
      box-shadow:
        0 24px 44px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 236, 184, 0.16),
        inset 0 0 46px rgba(255, 201, 92, 0.06);
      overflow: hidden;
    }

    .tr-panel {
      display: none;
      height: 100%;
      min-height: 0;
    }

    .tr-panel.is-active {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 22px;
    }

    #completePanel.is-active {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 0;
    }

    #teacherPanel.is-active,
    #classPanel.is-active {
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 22px;
    }

    #completePanel .tr-complete-wrap {
      height: 100%;
      min-height: 0;
    }

    .tr-panel-title {
      text-align: center;
    }

    .tr-panel-title h2 {
      color: #ffe9a8;
      font-family: "Noto Serif KR", serif;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -1px;
      text-shadow:
        0 2px 0 rgba(45, 22, 5, 0.88),
        0 0 18px rgba(255, 205, 105, 0.28);
    }

    .tr-panel-title p {
      margin-top: 7px;
      color: rgba(255, 235, 188, 0.88);
      font-size: 15px;
      font-weight: 850;
    }

    .tr-choice-grid {
      width: min(900px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 30px;
      align-items: stretch;
    }

    .tr-choice-card {
      height: 100%;
      min-height: 320px;
      padding: 28px 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 28px;
      border: 1.5px solid rgba(255, 215, 132, 0.54);
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 210, 104, 0.14), transparent 28%),
        linear-gradient(180deg, rgba(255, 249, 226, 0.15), rgba(51, 30, 12, 0.60)),
        rgba(18, 11, 6, 0.68);
      color: #fff2c8;
      box-shadow:
        0 18px 30px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 250, 225, 0.18),
        inset 0 -30px 54px rgba(0, 0, 0, 0.14);
      overflow: hidden;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .tr-choice-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 224, 151, 0.82);
      box-shadow:
        0 22px 34px rgba(0, 0, 0, 0.36),
        0 0 22px rgba(255, 198, 92, 0.14),
        inset 0 1px 0 rgba(255, 250, 225, 0.22);
    }

    .tr-choice-icon {
      width: 106px;
      height: 106px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 35% 25%, #fffdf3 0%, #f9ecd0 44%, #e8c777 78%, #b8832d 100%);
      border: 2px solid rgba(255, 224, 145, 0.98);
      box-shadow:
        0 0 0 4px rgba(105, 68, 25, 0.24),
        0 0 22px rgba(255, 204, 95, 0.34),
        0 8px 15px rgba(0, 0, 0, 0.20),
        inset 0 2px 9px rgba(255, 255, 255, 0.68),
        inset 0 -6px 10px rgba(126, 76, 22, 0.18);
      font-size: 48px;
    }

    .tr-choice-card h3 {
      color: #fff2c8;
      font-family: "Noto Serif KR", serif;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.7px;
      text-shadow:
        0 2px 0 rgba(42, 22, 7, 0.86),
        0 0 12px rgba(255, 205, 105, 0.18);
    }

    .tr-choice-card p {
      margin-top: 12px;
      color: rgba(255, 236, 190, 0.90);
      font-size: 15px;
      font-weight: 850;
      line-height: 1.5;
      word-break: keep-all;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.24);
    }

    .tr-form-wrap {
  width: min(1250px, 100%);
  height: 100%;
  margin: 0 auto;
  padding: 58px 66px;
  display: grid;
  align-content: center;
  border-radius: 34px;
  border: 2px solid rgba(255, 222, 145, 0.72);
  background:
    radial-gradient(circle at 50% 0%, rgba(255, 245, 207, 0.95), rgba(248, 227, 183, 0.88) 55%, rgba(215, 176, 104, 0.78));
  color: #3f230e;
  box-shadow:
    0 18px 30px rgba(0, 0, 0, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.44);
  overflow: hidden;
}

    .tr-form-grid {
      display: grid;
      gap: 34px;
    }

    .tr-input-row {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: 28px;
       align-items: center;
  min-height: 72px;
    }

    .tr-label {
  display: flex;
  align-items: center;
  gap: 15px;
  color: #4b2a12;
  font-size: 25px;
  font-weight: 900;
  white-space: nowrap;
}
    .tr-label span {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #3f842e;
  color: #fff8e3;
  font-size: 19px;
  font-weight: 900;
  box-shadow: 0 3px 0 rgba(31, 86, 24, 0.45);
}
    .tr-input,
.tr-select {
  width: 100%;
  height: 72px;
  border: 3px solid rgba(135, 82, 34, 0.24);
  border-radius: 20px;
  background: rgba(255, 253, 246, 0.96);
  color: #3e2310;
  font-size: 22px;
  font-weight: 800;
  outline: none;
  padding: 0 24px;
}

    .tr-input:focus,
    .tr-select:focus {
      border-color: rgba(63, 132, 46, 0.78);
      box-shadow: 0 0 0 3px rgba(63, 132, 46, 0.14);
    }

    .tr-action-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .tr-action-button {
  min-width: 150px;
  height: 58px;
  padding: 0 28px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(180deg, #3f842e, #245716);
  color: #fff8e3;
  font-size: 19px;
  font-weight: 900;
  white-space: nowrap;
  box-shadow: 0 6px 0 rgba(24, 45, 12, 0.78);
}

    .tr-action-button.is-brown {
      background: linear-gradient(180deg, #965d25, #562b0c);
      box-shadow: 0 5px 0 rgba(45, 22, 7, 0.78);
    }

    .tr-action-button.is-gold {
      background: linear-gradient(180deg, #e0ad4f, #a86413);
      box-shadow: 0 5px 0 rgba(91, 45, 6, 0.78);
      color: #fff8e3;
    }

    .tr-student-layout {
  min-height: 0;
  display: grid;
  grid-template-columns: 420px minmax(0, 1fr);
  gap: 24px;
  overflow: hidden;
}
    .tr-setting-card,
.tr-table-card {
  min-width: 0;
  min-height: 0;
  padding: 32px;
  border-radius: 28px;
  border: 2px solid rgba(255, 215, 132, 0.46);
  background:
    linear-gradient(180deg, rgba(255, 249, 226, 0.92), rgba(244, 224, 180, 0.84));
  color: #3f230e;
  box-shadow:
    0 12px 24px rgba(0, 0, 0, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.42);
  overflow: hidden;
}

    .tr-setting-card h3,
.tr-table-card h3 {
  margin-bottom: 22px;
  color: #42240e;
  font-family: "Noto Serif KR", serif;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: -0.5px;
}

    .tr-setting-list {
      display: grid;
      gap: 16px;
    }

   .tr-mini-label {
  display: block;
  margin-bottom: 9px;
  color: #674019;
  font-size: 18px;
  font-weight: 900;
}

    .tr-help-box {
  margin-top: 20px;
  padding: 18px 20px;
  border-radius: 20px;
  border: 1px solid rgba(76, 113, 48, 0.26);
  background: rgba(76, 113, 48, 0.16);
  color: #3f4e1c;
  font-size: 16px;
  font-weight: 850;
  line-height: 1.65;
  word-break: keep-all;
}

    .tr-table-card {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
    }

    .tr-table-wrap {
      min-height: 0;
      overflow-y: auto;
      padding-right: 6px;
    }

    .tr-student-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 10px;
    }
.tr-student-table th {
  height: 46px;
  color: #5a3513;
  font-size: 18px;
  font-weight: 900;
  text-align: center;
}

    .tr-student-table td {
      padding: 0 5px;
    }

   .tr-student-table input {
  width: 100%;
  height: 54px;
  border: 2px solid rgba(135, 82, 34, 0.18);
  border-radius: 15px;
  background: rgba(255, 253, 246, 0.92);
  color: #3e2310;
  font-size: 18px;
  font-weight: 800;
  text-align: center;
  outline: none;
}

    .tr-student-table input:focus {
      border-color: rgba(63, 132, 46, 0.78);
      box-shadow: 0 0 0 3px rgba(63, 132, 46, 0.12);
    }

    .tr-table-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .tr-student-count {
      color: #5a3513;
      font-size: 19px;
      font-weight: 900;
    }

    .tr-plus-button {
  width: 52px;
  height: 52px;
  border: 0;
  border-radius: 50%;
  background: linear-gradient(180deg, #3f842e, #245716);
  color: #fff8e3;
  font-size: 32px;
  font-weight: 900;
  box-shadow: 0 5px 0 rgba(24, 45, 12, 0.72);
}

    .tr-complete-wrap {
      width: min(1040px, 100%);
      height: 100%;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .tr-complete-card {
      width: 100%;
      min-height: 500px;
      padding: 42px;
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 30px;
      border: 1.5px solid rgba(255, 222, 145, 0.72);
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 245, 207, 0.95), rgba(248, 227, 183, 0.90) 55%, rgba(215, 176, 104, 0.82));
      color: #3f230e;
      box-shadow:
        0 24px 44px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.44);
    }

    .tr-check-badge {
      width: 142px;
      height: 142px;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #2f7d32;
      border: 4px solid rgba(255, 238, 184, 0.95);
      box-shadow:
        0 0 0 5px rgba(105, 68, 25, 0.24),
        0 0 24px rgba(47, 125, 50, 0.32),
        0 10px 18px rgba(0, 0, 0, 0.22),
        inset 0 2px 8px rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-size: 82px;
      font-weight: 1000;
      line-height: 1;
      text-shadow: 0 3px 0 rgba(18, 72, 22, 0.7);
    }

    .tr-complete-card h2 {
      color: #42240e;
      font-family: "Noto Serif KR", serif;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.8px;
      margin-bottom: 16px;
    }

    .tr-complete-card p {
      color: #5b3a1a;
      font-size: 25px;
      font-weight: 900;
      line-height: 1.7;
      letter-spacing: -0.35px;
      word-break: keep-all;
      margin-bottom: 38px;
    }

    .tr-summary-box {
      width: min(560px, 100%);
      margin: 0 auto 26px;
      padding: 16px 20px;
      border-radius: 18px;
      border: 1px solid rgba(76, 113, 48, 0.28);
      background: rgba(76, 113, 48, 0.16);
      color: #3f4e1c;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.6;
      text-align: left;
      word-break: keep-all;
    }
/* =========================================================
   1920 × 1080 고정 화면
========================================================= */

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  margin: 0;
}

.tr-stage-viewport {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  display: grid;
  justify-items: center;
  align-items: start;
}

.tr-stage-frame {
  position: relative;
  width: calc(1920px * var(--stage-scale, 1));
  height: calc(1080px * var(--stage-scale, 1));
  flex: 0 0 auto;
}

.tr-page {
  width: 1920px;
  height: 1080px;
  min-height: 1080px;
  padding: 30px 52px 38px;
  overflow: hidden;
  transform: scale(var(--stage-scale, 1));
  transform-origin: top left;
}

.tr-shell {
  width: 100%;
  max-width: 1816px;
  height: 1012px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: 88px minmax(0, 1fr);
  gap: 22px;
}

/* 상단 바 확대 */

.tr-topbar {
  width: 100%;
  height: 88px;
  grid-template-columns: 330px minmax(0, 1fr) 330px;
  padding: 0 24px;
  border-radius: 28px;
}

.tr-brand {
  gap: 16px;
  font-size: 34px;
}

.tr-brand-mark {
  width: 58px;
  height: 58px;
  flex: 0 0 58px;
  border-radius: 18px;
}

.tr-brand-mark img {
  width: 48px;
  height: 48px;
}

.tr-title {
  font-size: 50px;
}

.tr-pill-button {
  height: 50px;
  padding: 0 26px;
  font-size: 18px;
}

/* 등록 대상을 골라요 전체 상자 확대 */

.tr-main {
  width: 100%;
  height: 100%;
  min-height: 0;
}

.tr-board {
  width: 100%;
  height: 100%;
  min-height: 0;
  padding: 42px 70px 52px;
  border-radius: 36px;
}

.tr-panel.is-active {
  width: 100%;
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 32px;
}

/* 제목 확대 */

.tr-panel-title h2 {
  font-size: 48px;
  line-height: 1.15;
}

.tr-panel-title p {
  margin-top: 10px;
  font-size: 21px;
}

/* 카드 그리드 고정 */

.tr-choice-grid {
  width: 100%;
  max-width: 1260px;
  height: 100%;
  min-height: 0;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 48px;
  align-items: stretch;
}

/* 카드 확대 */

.tr-choice-card {
  width: 100%;
  height: 100%;
  min-height: 620px;
  padding: 48px 38px;
  border-radius: 34px;
}

.tr-choice-card > div {
  width: 100%;
}

/* 아이콘 확대 */

.tr-choice-icon {
  width: 158px;
  height: 158px;
  margin: 0 auto 30px;
  border-width: 3px;
  font-size: 76px;
}

/* 카드 글씨 확대 */

.tr-choice-card h3 {
  font-size: 46px;
  line-height: 1.2;
}

.tr-choice-card p {
  margin-top: 22px;
  font-size: 23px;
  line-height: 1.65;
}

/* 첫 선택 화면에 아래 버튼 공간이 남지 않게 처리 */

#selectPanel.is-active {
  grid-template-rows: auto minmax(0, 1fr);
}

#selectPanel .tr-action-row {
  display: none;
}

/* 고정 화면 안에서는 무조건 두 칸 유지 */

.tr-stage-frame .tr-choice-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.tr-stage-frame .tr-topbar {
  grid-template-columns: 330px minmax(0, 1fr) 330px;
}
    /* 학생 계정 일괄 생성 화면을 위로 올리기 */
#studentPanel.is-active {
  transform: translateY(-18px);
}
.tr-setting-card .tr-help-box {
  margin-top: 14px !important;
  padding: 13px 16px !important;
  font-size: 15px !important;
  line-height: 1.45 !important;
}
/* 학생 계정 화면 잘림 수정 */
#studentPanel.is-active {
  transform: translateY(-18px);
}

.tr-setting-card {
  padding: 26px 32px !important;
}

.tr-setting-card h3 {
  margin-bottom: 14px !important;
}

.tr-setting-list {
  gap: 13px !important;
}

.tr-setting-card .tr-help-box {
  margin-top: 14px !important;
  padding: 13px 16px !important;
  font-size: 15px !important;
  line-height: 1.45 !important;
}
  </style>
</head>

<body>
  <div class="tr-stage-viewport">
    <div class="tr-stage-frame" id="teacherRegisterStageFrame">
      <div class="tr-page" id="teacherRegisterFixedStage">
        <div class="tr-shell">
      <header class="tr-topbar">
        <div class="tr-brand">
          <div class="tr-brand-mark">
            <img src="../assets/images/logo-book.png" alt="문답책 로고">
          </div>
          <span>문답책</span>
        </div>

        <h1 class="tr-title" id="topTitle">계정 관리</h1>

        <div class="tr-top-actions">
          <button class="tr-pill-button" type="button" onclick="logoutAndGoLogin()">로그아웃</button>
        </div>
      </header>

      <main class="tr-main">
        <section class="tr-board">
          <section class="tr-panel is-active" id="selectPanel">
            <div class="tr-panel-title">
              <h2>✦ 등록 대상을 골라요 ✦</h2>
              <p>처음에는 교사 계정을 먼저 등록해요.</p>
            </div>

            <div class="tr-choice-grid">
              <button class="tr-choice-card" type="button" onclick="showPanel('teacher')">
                <div>
                  <div class="tr-choice-icon">👩‍🏫</div>
                  <h3>교사</h3>
                  <p>교사 계정과 학급 정보를 등록한 뒤<br>학생 계정을 한 번에 만들어요.</p>
                </div>
              </button>

              <button class="tr-choice-card" type="button" onclick="showStudentNotice()">
                <div>
                  <div class="tr-choice-icon">🧒</div>
                  <h3>학생</h3>
                  <p>학생 계정은 교사가 만든 뒤<br>학생에게 나누어 줄 수 있어요.</p>
                </div>
              </button>
            </div>
          </section>

          <section class="tr-panel" id="teacherPanel">
            <div class="tr-form-wrap">
              <div class="tr-form-grid">
                <div class="tr-input-row">
                  <label class="tr-label" for="teacherName"><span>1</span> 이름</label>
                  <input class="tr-input" id="teacherName" type="text" autocomplete="off" placeholder="예) 김문답">
                </div>

                <div class="tr-input-row">
                  <label class="tr-label" for="schoolName"><span>2</span> 학교명</label>
                  <input class="tr-input" id="schoolName" type="text" autocomplete="off" placeholder="예) 문답초등학교">
                </div>

                <div class="tr-input-row">
                  <label class="tr-label" for="teacherId"><span>3</span> 아이디</label>
                  <input class="tr-input" id="teacherId" type="text" autocomplete="off" placeholder="영어 소문자와 숫자만 사용해요. 예) teacher01">
                </div>

                <div class="tr-input-row">
                  <label class="tr-label" for="teacherPw"><span>4</span> 비밀번호</label>
                  <input class="tr-input" id="teacherPw" type="password" autocomplete="new-password" placeholder="4자 이상 입력해요.">
                </div>
              </div>
            </div>

            <div class="tr-action-row">
              <button class="tr-action-button is-brown" type="button" onclick="showPanel('select')">이전 화면</button>
              <button class="tr-action-button" type="button" onclick="goClassPanel()">다음으로</button>
            </div>
          </section>

          <section class="tr-panel" id="classPanel">
            <div class="tr-form-wrap">
              <div class="tr-form-grid">
                <div class="tr-input-row">
                  <label class="tr-label" for="gradeSelect"><span>1</span> 학년 선택</label>
                  <select class="tr-select" id="gradeSelect">
                    <option value="">학년을 선택해요</option>
                    <option value="4">4학년</option>
                    <option value="5">5학년</option>
                    <option value="6">6학년</option>
                  </select>
                </div>

                <div class="tr-input-row">
                  <label class="tr-label" for="classSelect"><span>2</span> 반 선택</label>
                  <select class="tr-select" id="classSelect">
                    <option value="">반을 선택해요</option>
                    <option value="1">1반</option>
                    <option value="2">2반</option>
                    <option value="3">3반</option>
                    <option value="4">4반</option>
                    <option value="5">5반</option>
                    <option value="6">6반</option>
                    <option value="7">7반</option>
                    <option value="8">8반</option>
                    <option value="9">9반</option>
                    <option value="10">10반</option>
                  </select>
                </div>

                <div class="tr-input-row">
                  <label class="tr-label" for="className"><span>3</span> 학급명</label>
                  <input class="tr-input" id="className" type="text" autocomplete="off" placeholder="예) 생각이 자라는 우리반">
                </div>
              </div>
            </div>

            <div class="tr-action-row">
              <button class="tr-action-button is-brown" type="button" onclick="showPanel('teacher')">이전 화면</button>
              <button class="tr-action-button" type="button" onclick="goStudentPanel()">학생 계정 만들기</button>
            </div>
          </section>

          <section class="tr-panel" id="studentPanel">
            <div class="tr-panel-title">
              <h2>학생 계정 일괄 생성</h2>
            </div>

            <div class="tr-student-layout">
              <article class="tr-setting-card">
                <h3>자동생성 설정</h3>

                <div class="tr-setting-list">
                  <div>
                    <label class="tr-mini-label" for="studentCountInput">학생 수</label>
                    <input class="tr-input" id="studentCountInput" type="number" min="1" max="40" value="5">
                  </div>

                  <div>
                    <label class="tr-mini-label" for="studentPrefixInput">아이디 앞글자</label>
                    <input class="tr-input" id="studentPrefixInput" type="text" value="s" maxlength="8">
                  </div>

                  <div>
                    <label class="tr-mini-label" for="studentPwInput">공통 비밀번호</label>
                    <input class="tr-input" id="studentPwInput" type="text" value="1234" maxlength="12">
                  </div>

                  <button class="tr-action-button is-gold" type="button" onclick="autoCreateStudents()">자동생성</button>
                </div>

                <div class="tr-help-box">
                  아이디는 영어 소문자와 숫자만 사용해요.<br>
                  예) s01, s02, s03<br>
                  대문자와 특수문자는 자동으로 빼요.
                </div>
              </article>

              <article class="tr-table-card">
                <h3>학생 계정 목록</h3>

                <div class="tr-table-wrap">
                  <table class="tr-student-table">
                    <thead>
                      <tr>
                        <th style="width: 13%;">번호</th>
                        <th style="width: 24%;">이름</th>
                        <th style="width: 35%;">아이디</th>
                        <th style="width: 28%;">비밀번호</th>
                      </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                  </table>
                </div>

                <div class="tr-table-bottom">
                  <button class="tr-plus-button" type="button" onclick="addStudentRow()">+</button>
                  <div class="tr-student-count" id="studentCountText">총 0명</div>
                  <button class="tr-action-button" type="button" onclick="finishRegister()">등록하기</button>
                </div>
              </article>
            </div>

            <div class="tr-action-row">
              <button class="tr-action-button is-brown" type="button" onclick="showPanel('class')">이전 화면</button>
            </div>
          </section>

          <section class="tr-panel" id="completePanel">
            <div class="tr-complete-wrap">
              <article class="tr-complete-card">
                <div>
                  <div class="tr-check-badge">✔</div>

                  <h2>계정 등록이 완료되었어요</h2>

                  <p>
                    등록한 교사 아이디와 비밀번호로 로그인해 주세요.<br>
                    학생 계정을 다시 만들더라도 등록이 끝나면 로그인 화면으로 이동하게 됩니다.
                  </p>

                  <button class="tr-action-button" type="button" onclick="confirmGoLogin()">로그인 하러 가기</button>
                </div>
              </article>
            </div>
          </section>
        </section>
      </main>
           </div>
      </div>
    </div>
  </div>

  <script>
    function updateTeacherRegisterStageScale() {
  const stage = document.getElementById("teacherRegisterFixedStage");
  const frame = document.getElementById("teacherRegisterStageFrame");

  if (!stage || !frame) {
    return;
  }

  const scale = Math.min(
    window.innerWidth / 1920,
    window.innerHeight / 1080,
    1
  );

  stage.style.setProperty("--stage-scale", scale);
  frame.style.setProperty("--stage-scale", scale);

  frame.style.width = `${1920 * scale}px`;
  frame.style.height = `${1080 * scale}px`;
}

updateTeacherRegisterStageScale();
window.addEventListener("resize", updateTeacherRegisterStageScale);
    let teacherData = {};
    let classData = {};
    let studentData = [];

    const panelMap = {
      select: {
        panelId: "selectPanel",
        title: "계정 관리"
      },
      teacher: {
        panelId: "teacherPanel",
        title: "교사 계정 등록"
      },
      class: {
        panelId: "classPanel",
        title: "학급 정보 등록"
      },
      student: {
        panelId: "studentPanel",
        title: "학생 계정 등록"
      },
      complete: {
        panelId: "completePanel",
        title: "등록 완료"
      }
    };

    function showPanel(name) {
      const data = panelMap[name];

      if (!data) {
        alert("이동할 화면을 찾을 수 없어요.");
        return;
      }

      document.querySelectorAll(".tr-panel").forEach(function(panel) {
        panel.classList.remove("is-active");
      });

      const targetPanel = document.getElementById(data.panelId);

      if (!targetPanel) {
        alert("화면 요소를 찾을 수 없어요: " + data.panelId);
        return;
      }

      targetPanel.classList.add("is-active");
      document.getElementById("topTitle").textContent = data.title;
    }

    function showStudentNotice() {
      alert("학생 계정은 교사 계정과 학급 정보를 등록한 뒤 한 번에 만들 수 있어요.");
    }

    function goClassPanel() {
      const teacherName = document.getElementById("teacherName").value.trim();
      const schoolName = document.getElementById("schoolName").value.trim();
      const teacherId = document.getElementById("teacherId").value.trim();
      const teacherPw = document.getElementById("teacherPw").value.trim();

      if (!teacherName || !schoolName || !teacherId || !teacherPw) {
        alert("교사 계정 정보를 모두 입력해 주세요.");
        return;
      }

      if (!isSimpleId(teacherId)) {
  alert("교사 아이디는 영어 소문자와 숫자만 사용할 수 있어요.");
  document.getElementById("teacherId").focus();
  return;
}

if (isIdAlreadyUsed(teacherId)) {
  alert("이미 사용하고 있는 아이디입니다.");
  document.getElementById("teacherId").focus();
  document.getElementById("teacherId").select();
  return;
}

if (teacherPw.length < 4) {
        alert("비밀번호는 4자 이상으로 입력해 주세요.");
        return;
      }

      teacherData = {
        name: teacherName,
        school: schoolName,
        id: teacherId,
        password: teacherPw
      };

      showPanel("class");
    }

    function goStudentPanel() {
      const grade = document.getElementById("gradeSelect").value;
      const classNumber = document.getElementById("classSelect").value;
      const className = document.getElementById("className").value.trim();

      if (!grade || !classNumber || !className) {
        alert("학급 정보를 모두 입력해 주세요.");
        return;
      }

      classData = {
        grade: grade,
        classNumber: classNumber,
        className: className
      };

      if (document.querySelectorAll("#studentTableBody tr").length === 0) {
        autoCreateStudents(false);
      }

      showPanel("student");
      updateStudentCountText();
    }

    function isSimpleId(text) {
      return /^[a-z0-9]+$/.test(String(text || ""));
    }
    /* 지금까지 이 브라우저에서 등록한 모든 아이디를 가져와요. */
function getRegisteredIds() {
  try {
    const savedIds = JSON.parse(
      localStorage.getItem("registeredAccountIds") || "[]"
    );

    return Array.isArray(savedIds) ? savedIds : [];
  } catch (error) {
    return [];
  }
}

/* 아이디가 이미 등록되어 있는지 확인해요. */
function isIdAlreadyUsed(id) {
  const normalizedId = String(id || "").trim().toLowerCase();
  const registeredIds = getRegisteredIds();

  return registeredIds.includes(normalizedId);
}

/* 새로 등록한 아이디를 기존 목록에 저장해요. */
function saveRegisteredIds(ids) {
  const registeredIds = getRegisteredIds();

  ids.forEach(function(id) {
    const normalizedId = String(id || "").trim().toLowerCase();

    if (normalizedId && !registeredIds.includes(normalizedId)) {
      registeredIds.push(normalizedId);
    }
  });

  localStorage.setItem(
    "registeredAccountIds",
    JSON.stringify(registeredIds)
  );
}

    function makeSafePrefix(prefix) {
      const safe = String(prefix || "s")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");

      return safe || "s";
    }

    function autoCreateStudents(showAlert) {
      const countInput = document.getElementById("studentCountInput");
      const prefixInput = document.getElementById("studentPrefixInput");
      const pwInput = document.getElementById("studentPwInput");

      let count = Number(countInput.value);
      let prefix = makeSafePrefix(prefixInput.value);
      let password = String(pwInput.value || "1234").trim();

      if (!count || count < 1) {
        count = 1;
      }

      if (count > 40) {
        count = 40;
      }

      if (!password) {
        password = "1234";
      }

      countInput.value = count;
      prefixInput.value = prefix;
      pwInput.value = password;

      const tbody = document.getElementById("studentTableBody");
      tbody.innerHTML = "";

      for (let i = 1; i <= count; i++) {
        const numberText = String(i).padStart(2, "0");
        const studentName = i + "번";
        const studentId = prefix + numberText;

        tbody.insertAdjacentHTML(
          "beforeend",
          makeStudentRow(i, studentName, studentId, password)
        );
      }

      updateStudentCountText();

      if (showAlert !== false) {
        alert("학생 계정이 자동생성되었어요.");
      }
    }

    function makeStudentRow(number, name, id, password) {
      return (
        "<tr>" +
          "<td><input value=\"" + escapeHtml(number) + "\"></td>" +
          "<td><input value=\"" + escapeHtml(name || "") + "\"></td>" +
          "<td><input value=\"" + escapeHtml(id || "") + "\"></td>" +
          "<td><input value=\"" + escapeHtml(password || "") + "\"></td>" +
        "</tr>"
      );
    }

    function addStudentRow() {
      const tbody = document.getElementById("studentTableBody");
      const nextNumber = tbody.querySelectorAll("tr").length + 1;

      tbody.insertAdjacentHTML(
        "beforeend",
        makeStudentRow(nextNumber, "", "", "")
      );

      document.getElementById("studentCountInput").value = nextNumber;
      updateStudentCountText();
    }

    function updateStudentCountText() {
      const count = document.querySelectorAll("#studentTableBody tr").length;
      document.getElementById("studentCountText").textContent = "총 " + count + "명";
    }

    function finishRegister() {
      const rows = Array.from(document.querySelectorAll("#studentTableBody tr"));

      if (rows.length === 0) {
        alert("학생 계정을 먼저 생성해 주세요.");
        return;
      }

      studentData = rows.map(function(row) {
        const inputs = row.querySelectorAll("input");

        return {
          number: inputs[0].value.trim(),
          name: inputs[1].value.trim(),
          id: inputs[2].value.trim(),
          password: inputs[3].value.trim()
        };
      });

      const hasEmpty = studentData.some(function(student) {
        return !student.number || !student.name || !student.id || !student.password;
      });

      if (hasEmpty) {
        alert("학생 번호, 이름, 아이디, 비밀번호를 모두 채워 주세요.");
        return;
      }

      const hasWrongId = studentData.some(function(student) {
        return !isSimpleId(student.id);
      });

      if (hasWrongId) {
        alert("학생 아이디는 영어 소문자와 숫자만 사용할 수 있어요.");
        return;
      }

      const idList = studentData.map(function(student) {
        return student.id;
      });

      const uniqueIdList = new Set(idList);

if (uniqueIdList.size !== idList.length) {
  alert("중복된 학생 아이디가 있어요. 아이디를 확인해 주세요.");
  return;
}

/* 교사 아이디와 학생 아이디가 같은지도 확인해요. */
if (idList.includes(teacherData.id)) {
  alert("교사 아이디와 동일한 학생 아이디가 있어요. 아이디를 변경해 주세요.");
  return;
}

/* 예전에 등록한 아이디와 중복되는지 확인해요. */
const alreadyUsedStudent = studentData.find(function(student) {
  return isIdAlreadyUsed(student.id);
});

if (alreadyUsedStudent) {
  alert(
    alreadyUsedStudent.id +
    " 아이디는 이미 사용하고 있는 아이디입니다."
  );

  const duplicatedRow = rows.find(function(row) {
    const inputs = row.querySelectorAll("input");
    return inputs[2].value.trim() === alreadyUsedStudent.id;
  });

  if (duplicatedRow) {
    const duplicatedInput = duplicatedRow.querySelectorAll("input")[2];
    duplicatedInput.focus();
    duplicatedInput.select();
  }

  return;
}

const savedData = {
        teacher: teacherData,
        classInfo: classData,
        students: studentData,
        createdAt: new Date().toISOString()
      };

      localStorage.setItem(
  "teacherRegisterData",
  JSON.stringify(savedData)
);

/* 교사와 학생 아이디를 사용된 아이디 목록에 저장해요. */
saveRegisteredIds([
  teacherData.id,
  ...studentData.map(function(student) {
    return student.id;
  })
]);

showPanel("complete");
    }

    function confirmGoLogin() {
      alert(
        "계정 등록이 완료되었어요.\n\n" +
        "등록한 교사 아이디와 비밀번호로 로그인해 주세요.\n" +
        "학생 계정을 여러 번 만들어도 등록이 끝나면 로그인 화면으로 이동합니다."
      );
      goLogin();
    }

    function goLogin() {
      location.href = "../index.html";
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
  <script src="../js/auth.js"></script>
  <script src="../js/fixed-stage.js"></script>
</body>
</html>
