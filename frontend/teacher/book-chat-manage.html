<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>문답책 - 책수다방 관리</title>

  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap");

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #3f2615;
      background:
        linear-gradient(180deg, rgba(255, 246, 222, 0.48), rgba(255, 232, 184, 0.50)),
        url("../assets/images/class-reading/class-reading-question-bg.png");
      background-size: cover;
      background-position: center;
    }

    button,
    textarea,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      padding: 20px 28px 20px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.68), transparent 34%),
        linear-gradient(90deg, rgba(255, 246, 224, 0.72), rgba(255, 255, 255, 0.18), rgba(255, 246, 224, 0.72));
    }

    .shell {
      width: min(1240px, calc(100vw - 56px));
      margin: 0 auto;
    }

    .top {
      display: grid;
      grid-template-columns: 220px 1fr 300px;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.8px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.65);
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(180deg, #bf8740, #6d3a0d);
      border: 1px solid rgba(255, 224, 158, 0.78);
      box-shadow: 0 8px 16px rgba(91, 47, 10, 0.18);
    }

    .brand-icon img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      display: block;
    }

    .title-area {
      text-align: center;
    }

    .main-title {
      font-family: "Noto Serif KR", serif;
      color: #4b2a13;
      font-size: 42px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -1.4px;
      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.72),
        0 8px 18px rgba(122, 72, 25, 0.12);
    }

    .main-desc {
      margin-top: 7px;
      color: #6e4b2e;
      font-size: 16px;
      font-weight: 850;
      word-break: keep-all;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
    }

    .nav-button {
      height: 43px;
      padding: 0 16px;
      border-radius: 15px;
      border: 1px solid rgba(177, 122, 57, 0.34);
      background: rgba(255, 250, 238, 0.84);
      color: #4f2e16;
      font-size: 14px;
      font-weight: 900;
      box-shadow:
        0 7px 14px rgba(116, 71, 20, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.58);
    }

    .nav-button.primary {
      background: linear-gradient(180deg, #e4ad45, #b06d0d);
      color: #fff9ec;
      border-color: rgba(176, 111, 25, 0.40);
      box-shadow:
        0 5px 0 rgba(105, 57, 5, 0.58),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .hero {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 16px;
      margin-bottom: 16px;
      align-items: stretch;
    }

    .lumi-card,
    .summary-card,
    .filter-card,
    .list-card,
    .detail-card,
    .history-card {
      border-radius: 24px;
      border: 1px solid rgba(193, 133, 61, 0.34);
      background: linear-gradient(180deg, rgba(255, 254, 249, 0.92), rgba(255, 247, 231, 0.90));
      box-shadow:
        0 14px 28px rgba(123, 75, 25, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(2px);
    }

    .lumi-card {
      min-height: 154px;
      display: grid;
      grid-template-columns: 130px 1fr;
      align-items: center;
      padding: 16px 20px;
    }

    .lumi-img {
      width: 130px;
      align-self: end;
      filter:
        drop-shadow(0 12px 15px rgba(112, 63, 15, 0.16))
        drop-shadow(0 0 15px rgba(255, 198, 94, 0.14));
    }

    .student-book-chat-entry {
      width:100%; min-height:154px; display:flex; align-items:center; gap:18px;
      padding:22px 26px; border:1px solid rgba(151,91,18,.48); border-radius:24px;
      background:linear-gradient(135deg,rgba(255,248,226,.98),rgba(226,181,91,.88));
      color:#573310; text-align:left; cursor:pointer;
      box-shadow:0 8px 0 rgba(105,57,5,.28),0 12px 22px rgba(100,57,12,.14);
      transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
    }
    .student-book-chat-entry:hover { transform:translateY(-2px); filter:saturate(1.04); box-shadow:0 10px 0 rgba(105,57,5,.30),0 15px 25px rgba(100,57,12,.17); }
    .student-book-chat-entry:active { transform:translateY(2px); box-shadow:0 4px 0 rgba(105,57,5,.28),0 8px 16px rgba(100,57,12,.13); }
    .student-book-chat-entry-icon { flex:0 0 auto; width:64px; height:64px; display:grid; place-items:center; border:1px solid rgba(139,81,14,.30); border-radius:20px; background:rgba(255,253,244,.78); font-size:34px; }
    .student-book-chat-entry-copy { min-width:0; display:grid; gap:6px; }
    .student-book-chat-entry-title { font-size:25px; font-weight:900; line-height:1.2; word-break:keep-all; }
    .student-book-chat-entry-description { color:#77522d; font-size:15px; font-weight:750; line-height:1.45; word-break:keep-all; }

    .speech-box {
      position: relative;
      padding: 18px 22px;
      border-radius: 22px;
      border: 1px solid rgba(186, 130, 58, 0.28);
      background: rgba(255, 254, 248, 0.78);
      color: #4f2d15;
      font-size: 19px;
      font-weight: 900;
      line-height: 1.45;
      word-break: keep-all;
    }

    .speech-box::before {
      content: "";
      position: absolute;
      left: -14px;
      top: 50%;
      width: 0;
      height: 0;
      transform: translateY(-50%);
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-right: 14px solid rgba(255, 254, 248, 0.92);
    }

    .summary-card {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .summary-title {
      margin-bottom: 13px;
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.6px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-box {
      min-height: 78px;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid rgba(192, 130, 55, 0.28);
      background: rgba(255, 255, 255, 0.54);
    }

    .stat-label {
      color: #8b6a46;
      font-size: 13px;
      font-weight: 900;
      word-break: keep-all;
    }

    .stat-value {
      margin-top: 6px;
      color: #4a2a10;
      font-size: 27px;
      font-weight: 900;
    }

    .filter-card {
      margin-bottom: 14px;
      padding: 14px 18px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr) 160px;
      gap: 10px;
      align-items: center;
    }

    .filter-button,
    .sort-select {
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(192, 130, 55, 0.34);
      background: rgba(255, 252, 245, 0.84);
      color: #5a3820;
      font-size: 15px;
      font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .filter-button.active {
      border-color: rgba(190, 125, 32, 0.82);
      background: linear-gradient(180deg, #f3c978, #c9902d);
      color: #4a2a10;
      box-shadow: 0 7px 13px rgba(176, 112, 25, 0.16);
    }

    .post-type-filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -2px 0 12px;
    }

    .post-type-filter-button {
      min-width: 86px;
      height: 36px;
      padding: 0 14px;
      border: 1px solid rgba(192, 130, 55, 0.38);
      border-radius: 999px;
      background: rgba(255, 252, 245, 0.86);
      color: #684322;
      font-size: 14px;
      font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.76);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .post-type-filter-button:hover {
      transform: translateY(-1px);
      border-color: rgba(190, 125, 32, 0.7);
    }

    .post-type-filter-button.active {
      border-color: rgba(174, 107, 22, 0.78);
      background: linear-gradient(180deg, #f5d58f, #d7a044);
      color: #4a2a10;
      box-shadow: 0 5px 10px rgba(176, 112, 25, 0.14);
    }

    .sort-select {
      padding: 0 12px;
      outline: none;
    }

    .board-grid {
      display: grid;
      grid-template-columns: 0.88fr 1.12fr;
      gap: 16px;
      align-items: start;
    }

    .list-card,
.detail-card {
  padding: 20px 24px;
  min-width: 0;
  height: 620px;
  min-height: 620px;
}

.list-card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

    .detail-card {
      padding-top: 18px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    .count-pill {
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid rgba(190, 130, 55, 0.26);
      background: rgba(255, 249, 235, 0.88);
      color: #8c5c1e;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .guide-box {
      margin-bottom: 13px;
      padding: 14px 16px;
      border-radius: 17px;
      border: 1px dashed rgba(178, 122, 55, 0.36);
      background: rgba(255, 255, 255, 0.48);
      color: #694729;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .post-list {
  flex: 1;
  min-height: 0;
  display: grid;
  align-content: start;
  gap: 10px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 2px 8px 28px 2px;
  scroll-padding-bottom: 28px;
}

    .post-button {
      width: 100%;
      border: 1px solid rgba(186, 130, 58, 0.26);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.66);
      padding: 15px 17px;
      text-align: left;
      color: #4d321a;
      transition: 0.15s ease;
    }

    .post-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 14px rgba(123, 75, 25, 0.10);
    }

    .post-button.active {
      border-color: rgba(83, 133, 60, 0.65);
      background: rgba(243, 255, 236, 0.82);
      box-shadow:
        0 0 0 3px rgba(110, 169, 80, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    .post-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
      flex-wrap: wrap;
    }

    .student-name {
      color: #4b2a13;
      font-size: 17px;
      font-weight: 900;
    }

    .type-badge,
    .status-badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }

    .type-badge {
      background: rgba(222, 168, 79, 0.18);
      color: #8b5a1d;
    }

    .status-badge.pending {
      background: rgba(229, 174, 69, 0.20);
      color: #8b5a1d;
    }

    .status-badge.approved {
      background: rgba(88, 139, 62, 0.14);
      color: #47722c;
    }

    .status-badge.rejected {
      background: rgba(184, 82, 55, 0.13);
      color: #9b4228;
    }

    .time-text {
      margin-left: auto;
      color: #9c7141;
      font-size: 13px;
      font-weight: 800;
    }

    .post-question {
      color: #3f2615;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.45;
      word-break: keep-all;
    }

    .post-preview {
      margin-top: 9px;
      color: #6f4e2f;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.45;
      word-break: keep-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-list,
    .detail-empty {
      display: grid;
      place-items: center;
      border-radius: 18px;
      border: 1px dashed rgba(177, 122, 57, 0.30);
      background: rgba(255, 255, 255, 0.50);
      color: #92745a;
      font-size: 17px;
      font-weight: 850;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .empty-list {
      min-height: 230px;
    }

    .detail-empty {
      min-height: 560px;
    }

    .detail-box,
    .reject-box,
    .teacher-note-box,
    .history-card {
      border-radius: 18px;
      border: 1px solid rgba(186, 130, 58, 0.28);
      background: rgba(255, 255, 255, 0.64);
    }

    .detail-box {
      padding: 15px 19px;
      margin-bottom: 10px;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .detail-name {
      color: #4b2a13;
      font-size: 18px;
      font-weight: 900;
    }

    .detail-question {
      color: #3f2615;
      font-size: 25px;
      font-weight: 900;
      line-height: 1.45;
      word-break: keep-all;
    }

    .detail-lines {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .line-card {
  min-height: 118px;
  padding: 18px 20px;
  border-radius: 18px;
  background: rgba(255, 250, 238, 0.70);
  border: 1px solid rgba(186, 130, 58, 0.20);
  color: #3f2615;
  font-size: 22px;
  font-weight: 850;
  line-height: 1.5;
  word-break: keep-all;
}

.line-card strong {
  display: block;
  margin-bottom: 10px;
  color: #4f7130;
  font-size: 23px;
  font-weight: 950;
}

    .reject-box,
.teacher-note-box {
  padding: 16px 18px;
  margin-top: 18px;
  background: rgba(255, 255, 250, 0.74);
}

    .box-title {
      margin-bottom: 10px;
      color: #4b2a13;
      font-size: 18px;
      font-weight: 900;
    }

    .reason-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .reason-option {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 11px;
      border-radius: 14px;
      border: 1px solid rgba(186, 130, 58, 0.22);
      background: rgba(255, 255, 255, 0.58);
      color: #5a3820;
      font-size: 14px;
      font-weight: 850;
      word-break: keep-all;
    }

    .reason-option input {
      width: 16px;
      height: 16px;
      accent-color: #b06d0d;
      flex-shrink: 0;
    }

    .text-area {
      width: 100%;
      min-height: 68px;
      outline: none;
      resize: vertical;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1px solid rgba(196, 138, 69, 0.34);
      background: rgba(255, 255, 255, 0.74);
      color: #452713;
      font-size: 15px;
      font-weight: 760;
      line-height: 1.45;
    }

    .text-area:focus {
      border-color: rgba(203, 139, 44, 0.72);
      box-shadow:
        0 0 0 3px rgba(216, 162, 68, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
      position: relative;
      z-index: 2;
    }

    .button-row.three {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .plain-button,
    .main-button,
    .danger-button,
    .brown-button {
      min-height: 46px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
    }

    .plain-button {
      border: 1px solid rgba(175, 119, 53, 0.34);
      background: rgba(255, 252, 245, 0.78);
      color: #654220;
    }

    .main-button {
      border: 1px solid rgba(68, 124, 42, 0.38);
      background: linear-gradient(180deg, #3f842e, #245716);
      color: #fff8dd;
      box-shadow:
        0 7px 0 rgba(31, 70, 18, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.26);
    }

    .danger-button {
      border: 1px solid rgba(151, 67, 42, 0.38);
      background: linear-gradient(180deg, #c87952, #93401f);
      color: #fff8dd;
      box-shadow:
        0 7px 0 rgba(95, 39, 19, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .brown-button {
      border: 1px solid rgba(120, 73, 24, 0.38);
      background: linear-gradient(180deg, #965d25, #562b0c);
      color: #fff8dd;
      box-shadow:
        0 7px 0 rgba(52, 24, 8, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .plain-button:active,
    .main-button:active,
    .danger-button:active,
    .brown-button:active,
    .nav-button:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .feedback-box {
      margin-top: 12px;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1px solid rgba(209, 146, 48, 0.42);
      background: rgba(255, 250, 238, 0.78);
      color: #5b3a1f;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .feedback-box.good {
      border-color: rgba(97, 155, 72, 0.40);
      background: rgba(250, 255, 245, 0.78);
      color: #355628;
    }

    .feedback-box.bad {
      border-color: rgba(177, 79, 45, 0.36);
      background: rgba(255, 245, 240, 0.78);
      color: #8f3d24;
    }

    .history-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .history-card {
      padding: 18px 20px;
      min-height: 230px;
    }

    .history-list {
      display: grid;
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-item {
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid rgba(186, 130, 58, 0.18);
      background: rgba(255, 255, 255, 0.62);
      color: #4f3219;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.4;
      word-break: keep-all;
    }

    .history-item strong {
      color: #4b2a13;
      font-weight: 950;
    }

    .history-item .mini {
      display: block;
      margin-top: 4px;
      color: #8b6a46;
      font-size: 12px;
      font-weight: 850;
    }

    .bottom-note {
      margin-top: 16px;
      text-align: center;
      color: #7e5d3a;
      font-size: 16px;
      font-weight: 850;
      word-break: keep-all;
    }


    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(63, 38, 21, 0.48);
      backdrop-filter: blur(4px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-card {
      width: min(720px, calc(100vw - 80px));
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      padding: 26px 28px 24px;
      border-radius: 26px;
      border: 1px solid rgba(193, 133, 61, 0.42);
      background: linear-gradient(180deg, #fffef8, #fff6e4);
      box-shadow:
        0 24px 60px rgba(69, 36, 12, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.88);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .modal-title {
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 28px;
      font-weight: 900;
    }

      ></textarea>

        <button class="danger-button" type="button" onclick="confirmRejectPost()">거절 완료</button>

  <script src="../js/auth.js"></script>
  <script src="../js/demo-storage.js"></script>
  <script>
   function getApiBaseUrl() {
  if (window.location.hostname === "127.0.0.1") {
    return "http://127.0.0.1:8080";
  }
  if (window.location.hostname === "localhost") {
    return "http://localhost:8080";
  }
  return "https://victory-production-f94d.up.railway.app";
}

const API_BASE_URL = getApiBaseUrl();

    const statusInfo = {
      pending: { label: "승인 대기", className: "pending" },
      approved: { label: "승인", className: "approved" },
      rejected: { label: "거절", className: "rejected" }
    };

    const typeInfo = {
      quiz: { label: "책 퀴즈", icon: "📖" },
      talk: { label: "생각 나누기", icon: "💬" },
      direct: { label: "책 퀴즈", icon: "📖" },
      infer: { label: "생각 나누기", icon: "💬" },
      feeling: { label: "생각 나누기", icon: "💬" },
      life: { label: "생각 나누기", icon: "💬" }
    };

    let currentStatus = "pending";
    let currentPostType = "all";
    let selectedPostId = null;
    let allPosts = [];
    let modalTargetPostId = null;
    let reviewPostsByStatus = {
      pending: [],
      approved: [],
      rejected: []
    };

    /*
     * 학생이 아무것도 안 써도 심사 교사가 "승인대기" 체험을 바로 할 수
     * 있도록 추가한 가상 예시다. 실제 DB에는 없는 화면 전용 데이터라
     * saveDemoBookChatStatusOverride("practice", id, ...)로 상태를
     * 뒤집으면 그 상태가 이 브라우저에서만 유지된다. book-chat.html의
     * 같은 이름 상수와 id가 반드시 같아야 학생 화면과 승인 결과가 연동된다.
     */
    const PRACTICE_BOOK_CHAT_PENDING_SEED = getDemoBookChatPendingSeeds("practice");

    const filterButtons = document.querySelectorAll(".filter-button");
    const postTypeFilterButtons = document.querySelectorAll(".post-type-filter-button");
    const sortSelect = document.getElementById("sortSelect");
    const postList = document.getElementById("postList");
    const detailArea = document.getElementById("detailArea");

    initPage();

    function initPage() {
      bindEvents();
      renderAll();
      loadBackendReviewPosts();
    }

    /*
     * ss01이 현재 브라우저에서 직접 작성한 글은 서버 응답과 무관한
     * browser-local 승인 요청이다. 교사 화면이 PENDING/APPROVED/REJECTED
     * API 세 건을 모두 기다린 뒤에야 이 목록을 읽으면, 네트워크가 느린
     * 동안 direct 글이 승인 대기에서 빠져 보인다. 따라서 demo 화면은
     * 이 함수를 먼저 호출해 local 글을 즉시 보여 주고, 서버 seed를 받은
     * 뒤에도 같은 requestId를 기준으로 한 번만 유지한다.
     */
    function mergeDemoDirectApprovalRequests(targetByStatus) {
      loadDemoApprovalRequests("practice").forEach(function(request) {
        const normalizedStatus = String(request.status || "pending").toLowerCase();
        const status = ["pending", "approved", "rejected"].includes(normalizedStatus)
          ? normalizedStatus
          : "pending";
        if (status === "approved" && !isDemoBookChatItemOnDate(
          request,
          getDemoTodayDateKey(),
          request.reviewedAt || ""
        )) return;

        const requestId = String(request.requestId);
        ["pending", "approved", "rejected"].forEach(function(groupStatus) {
          targetByStatus[groupStatus] = targetByStatus[groupStatus].filter(function(post) {
            return String(post.id) !== requestId;
          });
        });
        targetByStatus[status].push({
          id: requestId,
          sourceId: requestId,
          status: status,
          studentId: request.studentId,
          studentName: request.studentName || "김초롱",
          type: normalizeType(request.questionType),
          question: request.question || "",
          thought: request.answer || "",
          reason: "",
          evidence: "",
          answer: request.answer || "",
          classReadingBookId: request.classReadingBookId,
          submittedAt: request.submittedAt || "",
          submittedText: formatSubmittedText(request.submittedAt),
          reviewedAt: request.reviewedAt || "",
          reviewedText: request.reviewedAt ? formatSubmittedText(request.reviewedAt) : "",
          rejectReason: request.rejectedReason || ""
        });
      });
    }

    function bindEvents() {
      filterButtons.forEach(function(button) {
        button.addEventListener("click", function() {
          filterButtons.forEach(function(btn) {
            btn.classList.remove("active");
          });

          button.classList.add("active");
          currentStatus = button.dataset.status;
          selectedPostId = null;
          renderAll();
        });
      });

      postTypeFilterButtons.forEach(function(button) {
        button.addEventListener("click", function() {
          postTypeFilterButtons.forEach(function(btn) {
            btn.classList.remove("active");
          });

          button.classList.add("active");
          currentPostType = button.dataset.postType;
          selectedPostId = null;
          renderAll();
        });
      });

      sortSelect.addEventListener("change", function() {
        renderAll();
      });
    }

    function renderAll() {
      allPosts = getAllPosts();
      const filteredPosts = getFilteredPosts();

      const selectedPostIsVisible = filteredPosts.some(function(post) {
        return post.id === selectedPostId;
      });

      if (!selectedPostIsVisible) {
        selectedPostId = filteredPosts.length > 0 ? filteredPosts[0].id : null;
      }

      renderPostList(filteredPosts);
      renderDetail(filteredPosts);
      renderCounts(filteredPosts);
      renderHistory();
    }

    function getAllPosts() {
      return []
        .concat(reviewPostsByStatus.pending)
        .concat(reviewPostsByStatus.approved)
        .concat(reviewPostsByStatus.rejected);
    }

    function getFilteredPosts() {
      let posts = allPosts.slice();

      if (currentStatus !== "all") {
        posts = posts.filter(function(post) {
          return post.status === currentStatus;
        });
      }

      if (currentPostType !== "all") {
        posts = posts.filter(function(post) {
          return normalizeType(post.type) === currentPostType;
        });
      }

      if (sortSelect.value === "name") {
        posts.sort(function(a, b) {
          return String(a.studentName).localeCompare(String(b.studentName), "ko");
        });
      } else if (sortSelect.value === "type") {
        posts.sort(function(a, b) {
          return getSimpleType(a.type).localeCompare(getSimpleType(b.type), "ko");
        });
      } else {
        posts.sort(function(a, b) {
          return String(b.submittedAt || "").localeCompare(String(a.submittedAt || ""));
        });
      }

      return posts;
    }

    function renderPostList(posts) {
      if (posts.length === 0) {
        postList.innerHTML = '<div class="empty-list">해당 조건의 게시물이 없습니다.</div>';
        return;
      }

      postList.innerHTML = posts.map(function(post) {
        const isActive = selectedPostId === post.id;
        const type = getTypeDisplay(post.type);
        const status = statusInfo[post.status] || statusInfo.pending;

        return `
          <button class="post-button ${isActive ? "active" : ""}" type="button" onclick="selectPost('${escapeAttribute(post.id)}')">
            <div class="post-top">
              <span class="student-name">${escapeHtml(post.studentName || "학생")}</span>
              <span class="type-badge">${type.icon} ${escapeHtml(type.label)}</span>
              <span class="status-badge ${status.className}">${status.label}</span>
              <span class="time-text">${escapeHtml(post.submittedText || "오늘")}</span>
            </div>

            <div class="post-question">${escapeHtml(post.question || "질문 없음")}</div>

            <div class="post-preview">
              ${escapeHtml(
                post.type === "quiz" && post.answer
                  ? getQuizAuthorAnswerText(post.answer)
                  : (post.thought || post.reason || post.answer || "아직 내용이 없어요.")
              )}
            </div>
          </button>
        `;
      }).join("");
    }

    function renderDetail(posts) {
      const selectedPost = posts.find(function(post) {
        return post.id === selectedPostId;
      });

      if (!selectedPost) {
        document.getElementById("detailStatusPill").textContent = "선택 필요";
        detailArea.innerHTML = `
          <div class="detail-empty">
            왼쪽에서 게시물을 선택해 주세요.<br>
            선택한 글을 확인하고 승인하거나 거절할 수 있어요.
          </div>
        `;
        return;
      }

      const type = getTypeDisplay(selectedPost.type);
      const status = statusInfo[selectedPost.status] || statusInfo.pending;

      document.getElementById("detailStatusPill").textContent = status.label;

      detailArea.innerHTML = `
        <article class="detail-box">
          <div class="detail-meta">
            <span class="detail-name">${escapeHtml(selectedPost.studentName || "학생")}의 글</span>
            <span class="type-badge">${type.icon} ${escapeHtml(type.label)}</span>
            <span class="status-badge ${status.className}">${status.label}</span>
            <span class="time-text">${escapeHtml(selectedPost.submittedText || "오늘")}</span>
          </div>

          <div class="detail-question">${escapeHtml(selectedPost.question || "질문 없음")}</div>

          <div class="detail-lines">
  ${renderLineCard(
    "학생이 쓴 답",
    /*
     * thought 필드는 이 화면의 데이터 매핑 전 구간(실제 DB/seed/ss01
     * 직접작성)에서 항상 answer와 완전히 같은 값으로 채워진다(별도의
     * "생각" 텍스트가 아니라 answer의 별칭). 그래서 quiz 타입일 때는
     * thought를 먼저 보면 안 되고, answer를 정답 추출 함수에 먼저
     * 통과시켜야 한다 - 순서를 바꾸지 않으면 thought가 항상 먼저
     * 걸려서 "A. .../B. ... (정답 A)" 원문이 그대로 노출된다.
     */
    (selectedPost.type === "quiz" && selectedPost.answer
      ? getQuizAuthorAnswerText(selectedPost.answer)
      : (selectedPost.thought || selectedPost.answer)) ||
    "내용 없음"
  )}
</div>
        </article>

        ${renderTeacherActionArea(selectedPost)}
      `;
    }

    /*
     * 책퀴즈 정답은 answer 문자열에 "A. .../B. ... (정답 A)" 형식으로
     * 저장된다(학생 화면 book-chat.html의 getQuizAuthorAnswerText와
     * 완전히 같은 로직 - 저장 구조는 그대로 두고 표시할 때만 선택된
     * 실제 문장 하나를 꺼낸다). 이 패턴에 맞지 않는 문자열(생각 나누기
     * 답 등)이 들어와도 원본을 그대로 돌려주므로 다른 유형에는 영향이
     * 없다.
     */
    function getQuizAuthorAnswerText(answer) {
      const original = String(answer || "").trim();
      const choiceMatch = original.match(/\((?:정답|선택)\s*[:：]?\s*([AB])\s*\)/i);
      const optionsMatch = original
        .replace(/\s*\((?:정답|선택)\s*[:：]?\s*[AB]\s*\)\s*$/i, "")
        .match(/^\s*A[.)]\s*([\s\S]*?)\s*\/\s*B[.)]\s*([\s\S]*?)\s*$/i);

      if (!choiceMatch || !optionsMatch) return original;
      return (choiceMatch[1].toUpperCase() === "B" ? optionsMatch[2] : optionsMatch[1]).trim();
    }

    function renderLineCard(title, text) {
      return `
        <div class="line-card">
          <strong>${escapeHtml(title)}</strong>
          ${escapeHtml(text)}
        </div>
      `;
    }

    function renderTeacherActionArea(post) {
      if (post.status === "pending") {
        return `
          <div class="teacher-note-box">
            <div class="box-title">게시물 처리</div>

            <div class="button-row">
              <button class="main-button" type="button" onclick="approvePost('${escapeAttribute(post.id)}')">승인하기</button>
              <button class="danger-button" type="button" onclick="openRejectModal('${escapeAttribute(post.id)}')">거절하기</button>
            </div>

            <div class="feedback-box good">
              승인하면 바로 학생 책수다방에 공개돼요. 거절할 때는 이유를 남길 수 있어요.
            </div>
          </div>
        `;
      }

      if (post.status === "approved") {
        return `
          <div class="teacher-note-box">
            <div class="box-title">승인된 글</div>
            <div class="feedback-box good">
              이 글은 현재 학생 책수다방에 공개되는 글이에요.
            </div>

            <div class="button-row">
              <button class="brown-button" type="button" onclick="returnToPending('${escapeAttribute(post.id)}')">승인 취소</button>
              <button class="danger-button" type="button" onclick="hideApprovedPost('${escapeAttribute(post.id)}')">거절 목록으로 보내기</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="teacher-note-box">
          <div class="box-title">거절된 글</div>

          <div class="feedback-box bad">
            <strong>학생에게 남긴 말</strong><br>
            ${escapeHtml(post.rejectReason || "거절 이유가 따로 입력되지 않았어요.")}
          </div>

          <div class="button-row">
            <button class="main-button" type="button" onclick="approveRejectedPost('${escapeAttribute(post.id)}')">다시 승인하기</button>
            <button class="brown-button" type="button" onclick="returnToPending('${escapeAttribute(post.id)}')">대기로 돌리기</button>
          </div>
        </div>
      `;
    }

    function renderCounts(filteredPosts) {
      const pending = reviewPostsByStatus.pending;
      const approved = reviewPostsByStatus.approved;
      const rejected = reviewPostsByStatus.rejected;

      document.getElementById("pendingCount").textContent = pending.length + "개";
      document.getElementById("approvedCount").textContent = approved.length + "개";
      document.getElementById("rejectedCount").textContent = rejected.length + "개";
      document.getElementById("visibleCount").textContent = filteredPosts.length + "개";

    }




    function renderHistory() {
      const historyList = document.getElementById("historyList");

      if (!historyList) return;

      historyList.innerHTML = "";
    }

    function getTeacherAuthContext() {
      const token = sessionStorage.getItem("token");
      const teacherId =
        sessionStorage.getItem("id") ||
        sessionStorage.getItem("studentId");
      const role = sessionStorage.getItem("role");

      if (!token || !teacherId || role !== "teacher") {
        return null;
      }

      return { token: token, teacherId: teacherId };
    }

    async function fetchReviewPostsByStatus(status) {
      const auth = getTeacherAuthContext();

      if (!auth) return null;

      const response = await fetch(
        `${API_BASE_URL}/api/teachers/${auth.teacherId}/book-thought-reviews?status=${encodeURIComponent(status)}`,
        {
          method: "GET",
          headers: {
            Authorization: `Bearer ${auth.token}`
          }
        }
      );

      if (!response.ok) {
        throw new Error("책수다방 승인 목록을 불러오지 못했습니다.");
      }

      return response.json();
    }

    async function loadBackendReviewPosts(options) {
      const auth = getTeacherAuthContext();

      if (!auth) return false;

      if (isDemoAccount()) {
        /*
         * reviewPostsByStatus를 곧바로 비우면, 이 함수가 네트워크 응답을
         * 기다리는 동안(await) 다른 승인/거절 액션이 findPostById()로 글을
         * 찾다가 "일시적으로 빈 목록"만 보고 조용히 실패할 수 있다(교사가
         * 짧은 시간 안에 서로 다른 글 두 개를 연달아 승인하면 두 번째
         * 승인이 사라지는 원인이었다). 그래서 로컬 변수에 다 채운 뒤
         * 마지막에 한 번에 교체한다 - 일반계정 분기와 같은 방식이다.
         */
        const nextReviewPostsByStatus = { pending: [], approved: [], rejected: [] };

        /* 서버 조회를 기다리지 않고 같은 브라우저의 direct 글부터 표시한다. */
        mergeDemoDirectApprovalRequests(nextReviewPostsByStatus);
        reviewPostsByStatus = nextReviewPostsByStatus;
        renderAll();

        /*
         * 1) 학생 화면에 이미 공개돼 있는 진짜 승인 예시(DemoClassActivityInitializer가
         * 만든 DB 행)를 일반계정과 같은 GET API로 읽어 온다 - 쓰기(승인/거절)만
         * 심사계정에서 가로채고, 읽기는 실제 데이터를 신뢰한다. 그 위에 이 브라우저의
         * override(saveDemoBookChatStatusOverride)가 있으면 표시 상태만 덮어쓴다.
         */
        try {
          const results = await Promise.all([
            fetchReviewPostsByStatus("PENDING"),
            fetchReviewPostsByStatus("APPROVED"),
            fetchReviewPostsByStatus("REJECTED")
          ]);
          const backendItems = results[0].concat(results[1]).concat(results[2]);

          const seenBackendIds = new Set();
          backendItems.forEach(function (item) {
            const basePost = mapReviewItemToPost(item, "approved");
            if (seenBackendIds.has(basePost.id)) return;
            seenBackendIds.add(basePost.id);
            const override = getDemoBookChatStatusOverride("practice", basePost.id);
            if (override && override.deleted === true) return;
            const status = override ? override.status : basePost.status;
            if (status === "approved" && !isDemoBookChatItemOnDate(
              item,
              getDemoTodayDateKey(),
              override ? override.updatedAt : ""
            )) return;
            nextReviewPostsByStatus[status].push(Object.assign({}, basePost, {
              status: status,
              rejectReason: override ? override.reason : basePost.rejectReason,
              question: override && override.question != null ? override.question : basePost.question,
              thought: override && override.answer != null ? override.answer : basePost.thought,
              answer: override && override.answer != null ? override.answer : basePost.answer,
              type: override && override.questionType != null ? normalizeType(override.questionType) : basePost.type
            }));
          });
        } catch (error) {
          console.warn("심사 학급의 실제 책수다방 글을 불러오지 못했습니다.", error);
        }

        /*
         * 2) 학생이 아무 글도 안 써도 승인대기 체험이 바로 되도록 넣어 둔
         * 가상 예시. 역시 override가 있으면 그 상태를 따른다(기본값은 pending).
         */
        PRACTICE_BOOK_CHAT_PENDING_SEED.forEach(function (seed) {
          const override = getDemoBookChatStatusOverride("practice", seed.id);
          if (override && override.deleted === true) return;
          const status = override ? override.status : "pending";
          if (status === "approved" && !isDemoBookChatItemOnDate(
            seed,
            getDemoTodayDateKey(),
            override ? override.updatedAt : ""
          )) return;
          nextReviewPostsByStatus[status].push({
            id: seed.id,
            sourceId: seed.id,
            status: status,
            studentId: null,
            studentName: seed.studentName,
            type: normalizeType(seed.questionType),
            question: override && override.question != null ? override.question : seed.question,
            thought: override && override.answer != null ? override.answer : seed.answer,
            reason: "",
            evidence: "",
            answer: override && override.answer != null ? override.answer : seed.answer,
            classReadingBookId: null,
            submittedAt: seed.submittedAt,
            submittedText: formatSubmittedText(seed.submittedAt),
            reviewedAt: override ? override.updatedAt : "",
            reviewedText: override ? formatSubmittedText(override.updatedAt) : "",
            rejectReason: override ? override.reason : ""
          });
        });

        /*
         * 서버 조회 중 상태가 바뀌었을 수도 있으므로 최신 local 요청을
         * requestId로 다시 병합한다. 기존 항목은 제거한 뒤 한 건만 넣는다.
         */
        mergeDemoDirectApprovalRequests(nextReviewPostsByStatus);

        reviewPostsByStatus = nextReviewPostsByStatus;
        if (options && options.keepSelection) selectedPostId = String(options.keepSelection);
        renderAll();
        return true;
      }

      try {
        const results = await Promise.all([
          fetchReviewPostsByStatus("PENDING"),
          fetchReviewPostsByStatus("APPROVED"),
          fetchReviewPostsByStatus("REJECTED")
        ]);

        reviewPostsByStatus = {
          pending: results[0].map(function(item) {
            return mapReviewItemToPost(item, "pending");
          }),
          approved: results[1].map(function(item) {
            return mapReviewItemToPost(item, "approved");
          }),
          rejected: results[2].map(function(item) {
            return mapReviewItemToPost(item, "rejected");
          })
        };

        if (options && options.keepSelection) {
          selectedPostId = String(options.keepSelection);
        }

        renderAll();
        return true;
      } catch (error) {
        console.warn(error);
        return false;
      }
    }

    function mapReviewItemToPost(item, status) {
      return {
        id: String(item.id),
        sourceId: "book-thought-" + item.id,
        status: status,
        studentId: item.studentId,
        studentName: item.studentName || "학생",
        type: normalizeType(item.questionType),
        question: item.question || "",
        thought: item.answer || "",
        reason: "",
        evidence: "",
        answer: item.answer || "",
        classReadingBookId: item.classReadingBookId,
        submittedAt: item.createdAt || "",
        submittedText: formatSubmittedText(item.createdAt),
        reviewedAt: item.reviewedAt || "",
        reviewedText: item.reviewedAt ? formatSubmittedText(item.reviewedAt) : "",
        rejectReason: item.rejectionReason || ""
      };
    }

    async function approvePostWithApi(id) {
      if (isDemoAccount()) {
        const directRequest = loadDemoApprovalRequests("practice").find(function (item) {
          return String(item.requestId) === String(id);
        });
        if (directRequest) {
          return Boolean(updateDemoApprovalRequest("practice", id, "approved", ""));
        }
        return Boolean(saveDemoBookChatStatusOverride("practice", id, "approved", ""));
      }
      const auth = getTeacherAuthContext();

      if (!auth) return false;

      const response = await fetch(
        `${API_BASE_URL}/api/teachers/${auth.teacherId}/book-thought-reviews/${encodeURIComponent(id)}/approve`,
        {
          method: "PATCH",
          headers: {
            Authorization: `Bearer ${auth.token}`
          }
        }
      );

      if (!response.ok) {
        alert("승인 처리에 실패했어요. 잠시 뒤 다시 시도해 주세요.");
        return null;
      }

      return true;
    }

    async function rejectPostWithApi(id, reason) {
      if (isDemoAccount()) {
        const directRequest = loadDemoApprovalRequests("practice").find(function (item) {
          return String(item.requestId) === String(id);
        });
        if (directRequest) {
          return Boolean(updateDemoApprovalRequest("practice", id, "rejected", reason));
        }
        return Boolean(saveDemoBookChatStatusOverride("practice", id, "rejected", reason));
      }
      const auth = getTeacherAuthContext();

      if (!auth) return false;

      const response = await fetch(
        `${API_BASE_URL}/api/teachers/${auth.teacherId}/book-thought-reviews/${encodeURIComponent(id)}/reject`,
        {
          method: "PATCH",
          headers: {
            Authorization: `Bearer ${auth.token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            reason: reason
          })
        }
      );

      if (!response.ok) {
        alert("거절 처리에 실패했어요. 잠시 뒤 다시 시도해 주세요.");
        return null;
      }

      return true;
    }

    /*
     * "승인 취소" - 거절이 아니라 다시 검토 대기 상태로 되돌리는 것이라
     * 거절 사유를 남기지 않는다. approvePostWithApi/rejectPostWithApi와
     * 같은 패턴: 심사계정은 ss01이 이 브라우저에서 직접 쓴 글이면 기존
     * 방식(요청 자체 status) 그대로, 그게 아니면(실제 DB 승인 예시 또는
     * 가상 승인대기 예시) DB는 그대로 두고 browser-local override만 남긴다.
     */
    async function returnToPendingWithApi(id) {
      if (isDemoAccount()) {
        const directRequest = loadDemoApprovalRequests("practice").find(function (item) {
          return String(item.requestId) === String(id);
        });
        if (directRequest) {
          return Boolean(updateDemoApprovalRequest("practice", id, "pending", ""));
        }
        return Boolean(saveDemoBookChatStatusOverride("practice", id, "pending", ""));
      }
      const auth = getTeacherAuthContext();

      if (!auth) return false;

      const response = await fetch(
        `${API_BASE_URL}/api/teachers/${auth.teacherId}/book-thought-reviews/${encodeURIComponent(id)}/pending`,
        {
          method: "PATCH",
          headers: {
            Authorization: `Bearer ${auth.token}`
          }
        }
      );

      if (!response.ok) {
        alert("승인 취소 처리에 실패했어요. 잠시 뒤 다시 시도해 주세요.");
        return null;
      }

      return true;
    }

    function openRejectModal(id) {
      modalTargetPostId = id;
      clearModalRejectForm();

      const modal = document.getElementById("rejectModal");
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeRejectModal() {
      const modal = document.getElementById("rejectModal");
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
      modalTargetPostId = null;
    }

    function clearModalRejectForm() {
      document.querySelectorAll('input[name="modalRejectReason"]').forEach(function(input) {
        input.checked = false;
      });

      const commentInput = document.getElementById("modalRejectCommentInput");
      if (commentInput) commentInput.value = "";
    }

    function confirmRejectPost() {
      if (!modalTargetPostId) return;

      const checkedReasons = Array.from(
        document.querySelectorAll('input[name="modalRejectReason"]:checked')
      ).map(function(input) {
        return input.value;
      });

      const commentInput = document.getElementById("modalRejectCommentInput");
      const directComment = commentInput ? commentInput.value.trim() : "";
      const id = modalTargetPostId;

      closeRejectModal();
      rejectPost(id, checkedReasons, directComment);
    }

    document.addEventListener("keydown", function(event) {
      if (event.key !== "Escape") return;

      if (document.getElementById("rejectModal").classList.contains("show")) {
        closeRejectModal();
      }
    });

    function selectPost(id) {
      selectedPostId = id;
      renderAll();
    }

    async function approvePost(id) {
      const post = findPostById(id);

      if (!post) return;

      const approvedByApi = await approvePostWithApi(id);

      if (approvedByApi === true) {
        selectedPostId = id;
        await loadBackendReviewPosts({ keepSelection: id });
        alert("승인됐어요.");
        return;
      }

      if (approvedByApi === null) {
        return;
      }

      alert("로그인 정보가 없어 승인할 수 없어요. 다시 로그인한 뒤 시도해 주세요.");
    }

    async function rejectPost(id, checkedReasonsValue, directCommentValue) {
      const post = findPostById(id);

      if (!post) return;

      const checkedReasons = Array.isArray(checkedReasonsValue) ? checkedReasonsValue : [];
      const directComment = String(directCommentValue || "").trim();

      const reasonParts = checkedReasons.slice();

      if (directComment) {
        reasonParts.push(directComment);
      }

      const rejectReason = reasonParts.length > 0
        ? reasonParts.join("\n")
        : "고쳐서 다시 올리면 더 좋은 책수다방 글이 될 수 있어요.";

      const rejectedByApi = await rejectPostWithApi(id, rejectReason);

      if (rejectedByApi === true) {
        selectedPostId = id;
        await loadBackendReviewPosts({ keepSelection: id });
        alert("거절됐어요.");
        return;
      }

      if (rejectedByApi === null) {
        return;
      }

      alert("로그인 정보가 없어 거절할 수 없어요. 다시 로그인한 뒤 시도해 주세요.");
    }

    function approveRejectedPost(id) {
      approvePost(id);
    }

    async function returnToPending(id) {
      const post = findPostById(id);

      if (!post) return;

      const returnedByApi = await returnToPendingWithApi(id);

      if (returnedByApi === true) {
        selectedPostId = id;
        await loadBackendReviewPosts({ keepSelection: id });
        alert("승인 대기 상태로 되돌렸어요.");
        return;
      }

      if (returnedByApi === null) {
        return;
      }

      alert("로그인 정보가 없어 처리할 수 없어요. 다시 로그인한 뒤 시도해 주세요.");
    }

    function hideApprovedPost(id) {
      openRejectModal(id);
    }

    function findPostById(id) {
      return getAllPosts().find(function(post) {
        return post.id === id;
      });
    }

    function setActiveFilter(status) {
      filterButtons.forEach(function(button) {
        button.classList.toggle("active", button.dataset.status === status);
      });
    }

    function focusRejectBox() {
      const rejectBox = document.getElementById("rejectBox");

      if (rejectBox) {
        rejectBox.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    function clearRejectForm() {
      document.querySelectorAll('input[name="rejectReason"]').forEach(function(input) {
        input.checked = false;
      });

      const commentInput = document.getElementById("rejectCommentInput");

      if (commentInput) {
        commentInput.value = "";
      }
    }

    function getTypeDisplay(type) {
      return typeInfo[type] || typeInfo.talk;
    }

    function getSimpleType(type) {
      const simple = getTypeDisplay(type);
      return simple.label;
    }

    function normalizeType(type) {
      if (type === "direct" || type === "quiz") return "quiz";
      if (type === "infer" || type === "feeling" || type === "life" || type === "opinion" || type === "connect") {
        return "talk";
      }

      return "talk";
    }

    function getTodayText() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const date = String(now.getDate()).padStart(2, "0");
      const hour = String(now.getHours()).padStart(2, "0");
      const minute = String(now.getMinutes()).padStart(2, "0");

      return month + "." + date + " " + hour + ":" + minute;
    }

    function formatSubmittedText(value) {
      if (!value) return getTodayText();

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return getTodayText();
      }

      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");

      return month + "." + day + " " + hour + ":" + minute;
    }

    function goTeacherHome() {
      location.href = "./home.html";
    }

    function openStudentBookChat() {
      sessionStorage.setItem("teacherMode", "true");
      sessionStorage.setItem("teacherBookChatReturn", "book-chat-manage.html");
      location.href = "../student/book-chat.html?teacher=1";
    }

   function goBookManage() {
  location.href = "./book-manage.html";
}

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(text) {
      return escapeHtml(text).replaceAll("`", "&#096;");
    }
  </script>
