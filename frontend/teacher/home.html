<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문답책 교사 홈</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", sans-serif;
      color: #fff7df;
      background:
        linear-gradient(rgba(31, 16, 7, 0.68), rgba(31, 16, 7, 0.78)),
        url("../assets/images/after-read/after-reading-main-bg.png") center / cover no-repeat;
      overflow-x: hidden;
    }

    .tr-page {
      width: 100%;
      min-height: 100vh;
      padding: 28px 42px 42px;
    }

    .tr-topbar {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto 28px;
      padding: 16px 24px;
      border: 2px solid rgba(255, 224, 151, 0.75);
      border-radius: 24px;
      background: rgba(69, 35, 13, 0.82);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.32),
        inset 0 0 18px rgba(255, 233, 168, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
    }

    .tr-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Noto Serif KR", serif;
      font-size: 26px;
      font-weight: 800;
      color: #ffe9a8;
      text-shadow: 0 3px 0 rgba(58, 24, 5, 0.9);
    }

    .tr-brand img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.35));
    }

    .tr-top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tr-small-button {
      border: 1.5px solid rgba(255, 230, 166, 0.75);
      border-radius: 999px;
      padding: 10px 17px;
      font-size: 14px;
      font-weight: 700;
      color: #fff6d9;
      background: linear-gradient(180deg, #965d25, #562b0c);
      box-shadow: 0 5px 0 rgba(52, 24, 8, 0.9);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .tr-small-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 rgba(52, 24, 8, 0.9);
    }

    .tr-board {
      width: 100%;
      max-width: 1180px;
      min-height: 650px;
      margin: 0 auto;
      padding: 42px;
      border: 2.5px solid rgba(255, 224, 151, 0.82);
      border-radius: 34px;
      background:
        radial-gradient(circle at top, rgba(255, 226, 156, 0.12), transparent 42%),
        rgba(50, 25, 10, 0.86);
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.42),
        inset 0 0 30px rgba(255, 233, 168, 0.08);
    }

    .tr-panel-header {
      text-align: center;
      margin-bottom: 38px;
    }

    .tr-panel-title {
      margin: 0;
      font-family: "Noto Serif KR", serif;
      font-size: 44px;
      font-weight: 800;
      color: #ffe9a8;
      letter-spacing: -1px;
      text-shadow:
        0 4px 0 rgba(69, 29, 6, 0.95),
        0 8px 16px rgba(0, 0, 0, 0.38);
    }

    .tr-panel-subtitle {
      margin: 14px 0 0;
      font-size: 18px;
      font-weight: 600;
      color: #f7ddb1;
      line-height: 1.55;
    }

    .tr-menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      margin-top: 28px;
    }

    .tr-menu-card {
      position: relative;
      min-height: 340px;
      padding: 28px 24px 24px;
      border: 2px solid rgba(151, 91, 36, 0.36);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 250, 226, 0.98), rgba(236, 215, 171, 0.98));
      box-shadow:
        0 14px 0 rgba(92, 47, 16, 0.45),
        0 20px 35px rgba(0, 0, 0, 0.28);
      color: #4a2a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .tr-menu-card::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1.5px dashed rgba(139, 82, 31, 0.28);
      border-radius: 22px;
      pointer-events: none;
    }

    .tr-card-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(91, 55, 20, 0.12);
      border: 1px solid rgba(91, 55, 20, 0.18);
      font-size: 13px;
      font-weight: 800;
      color: #6b3b14;
    }

    .tr-card-icon {
      width: 116px;
      height: 116px;
      margin-top: 34px;
      border-radius: 30px;
      border: 2px solid rgba(255, 224, 151, 0.85);
      background:
        radial-gradient(circle at 45% 35%, #67d7ff 0%, #42b5f2 34%, #6b67ef 100%);
      box-shadow:
        inset 0 0 20px rgba(255, 255, 255, 0.25),
        0 10px 18px rgba(75, 45, 18, 0.24);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 54px;
    }

    .tr-menu-title {
      margin: 24px 0 8px;
      font-family: "Noto Serif KR", serif;
      font-size: 29px;
      font-weight: 800;
      color: #3b210e;
    }

    .tr-menu-desc {
      min-height: 56px;
      margin: 0 0 24px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.55;
      color: #6d4a2d;
    }

    .tr-action-button {
      width: 100%;
      max-width: 230px;
      margin-top: auto;
      border: 2px solid rgba(255, 233, 168, 0.78);
      border-radius: 18px;
      padding: 15px 18px;
      font-size: 18px;
      font-weight: 800;
      color: #fff8df;
      background: linear-gradient(180deg, #3f842e, #245716);
      box-shadow: 0 7px 0 rgba(31, 70, 18, 0.9);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .tr-action-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 0 rgba(31, 70, 18, 0.9);
      filter: brightness(1.04);
    }

    .tr-action-button:active,
    .tr-small-button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(31, 70, 18, 0.9);
    }

    .tr-action-button.secondary {
      background: linear-gradient(180deg, #965d25, #562b0c);
      box-shadow: 0 7px 0 rgba(52, 24, 8, 0.9);
    }

    .tr-menu-card.ready {
      border-color: rgba(95, 151, 67, 0.55);
    }

    .tr-menu-card.disabled {
      opacity: 0.93;
    }

    .tr-menu-card.disabled .tr-action-button {
      background: linear-gradient(180deg, #965d25, #562b0c);
      box-shadow: 0 7px 0 rgba(52, 24, 8, 0.9);
    }

    .tr-guide-box {
      margin-top: 36px;
      padding: 18px 22px;
      border: 1.5px solid rgba(255, 224, 151, 0.58);
      border-radius: 22px;
      background: rgba(255, 248, 221, 0.11);
      color: #f8e4bc;
      font-size: 15px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 980px) {
      .tr-page {
        padding: 22px;
      }

      .tr-board {
        padding: 30px 24px;
      }

      .tr-menu-grid {
        grid-template-columns: 1fr;
      }

      .tr-panel-title {
        font-size: 34px;
      }

      .tr-menu-card {
        min-height: 300px;
      }
    }

    @media (max-width: 560px) {
      .tr-topbar {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .tr-brand {
        justify-content: center;
      }

      .tr-top-actions {
        justify-content: center;
      }

      .tr-panel-title {
        font-size: 30px;
      }

      .tr-panel-subtitle {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="tr-page">
    <header class="tr-topbar">
      <div class="tr-brand">
        <img src="../assets/images/logo-book.png" alt="문답책 로고">
        <span>문답책</span>
      </div>

      <div class="tr-top-actions">
        <button class="tr-small-button" type="button" onclick="goLogin()">로그인으로</button>
      </div>
    </header>

    <section class="tr-board">
      <div class="tr-panel-header">
        <h1 class="tr-panel-title">교사 관리 화면</h1>
        <p class="tr-panel-subtitle">
          관리할 영역을 선택하세요.<br>
          계정관리에서 교사 계정과 학급, 학생 계정을 먼저 등록할 수 있어요.
        </p>
      </div>

      <div class="tr-menu-grid">
        <article class="tr-menu-card ready">
          <span class="tr-card-badge">먼저 설정</span>
          <div class="tr-card-icon">📚</div>
          <h2 class="tr-menu-title">계정관리</h2>
          <p class="tr-menu-desc">
            교사 계정, 학급 정보,<br>
            학생 계정을 등록해요.
          </p>
          <button class="tr-action-button" type="button" onclick="goTeacherRegister()">
            계정 관리하기
          </button>
        </article>

        <article class="tr-menu-card disabled">
          <span class="tr-card-badge">준비 중</span>
          <div class="tr-card-icon">📖</div>
          <h2 class="tr-menu-title">온책읽기</h2>
          <p class="tr-menu-desc">
            우리 반이 함께 읽는 책과<br>
            활동을 관리해요.
          </p>
          <button class="tr-action-button secondary" type="button" onclick="readyMenu('온책읽기')">
            온책읽기 들어가기
          </button>
        </article>

        <article class="tr-menu-card disabled">
          <span class="tr-card-badge">준비 중</span>
          <div class="tr-card-icon">📝</div>
          <h2 class="tr-menu-title">개별읽기</h2>
          <p class="tr-menu-desc">
            학생별 읽기 활동과<br>
            질문 기록을 살펴봐요.
          </p>
          <button class="tr-action-button secondary" type="button" onclick="readyMenu('개별읽기')">
            개별읽기 들어가기
          </button>
        </article>
      </div>

      <div class="tr-guide-box">
        ※ 현재는 <strong>계정관리</strong> 화면만 연결되어 있어요.  
        온책읽기와 개별읽기는 화면을 만든 뒤 링크를 연결하면 됩니다.
      </div>
    </section>
  </main>

  <script>
    function goLogin() {
      location.href = "../index.html";
    }

    function goTeacherRegister() {
      location.href = "teacher-register.html";
    }

    function readyMenu(menuName) {
      alert(menuName + " 화면은 아직 준비 중이에요.");
    }
  </script>
</body>
</html>
