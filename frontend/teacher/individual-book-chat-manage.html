<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>문답책 - 개별읽기 책수다방 확인</title>

  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap");

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: #3f2615;
      background:
        linear-gradient(180deg, rgba(255, 246, 222, 0.48), rgba(255, 232, 184, 0.50)),
        url("../assets/images/class-reading/class-reading-question-bg.png");
      background-size: cover;
      background-position: center;
    }

    button,
    textarea,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      padding: 20px 28px 28px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.68), transparent 34%),
        linear-gradient(90deg, rgba(255, 246, 224, 0.72), rgba(255, 255, 255, 0.18), rgba(255, 246, 224, 0.72));
    }

    .shell {
      width: min(1240px, calc(100vw - 56px));
      margin: 0 auto;
    }

    .top {
      display: grid;
      grid-template-columns: 220px 1fr 300px;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.8px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.65);
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(180deg, #bf8740, #6d3a0d);
      border: 1px solid rgba(255, 224, 158, 0.78);
      box-shadow: 0 8px 16px rgba(91, 47, 10, 0.18);
    }

    .brand-icon img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      display: block;
    }

    .title-area {
      text-align: center;
    }

    .main-title {
      font-family: "Noto Serif KR", serif;
      color: #4b2a13;
      font-size: 42px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -1.4px;
      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.72),
        0 8px 18px rgba(122, 72, 25, 0.12);
    }

    .main-desc {
      margin-top: 7px;
      color: #6e4b2e;
      font-size: 16px;
      font-weight: 850;
      word-break: keep-all;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
    }

    .nav-button {
      height: 43px;
      padding: 0 16px;
      border-radius: 15px;
      border: 1px solid rgba(177, 122, 57, 0.34);
      background: rgba(255, 250, 238, 0.84);
      color: #4f2e16;
      font-size: 14px;
      font-weight: 900;
      box-shadow:
        0 7px 14px rgba(116, 71, 20, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.58);
    }

    .nav-button.primary {
      background: linear-gradient(180deg, #e4ad45, #b06d0d);
      color: #fff9ec;
      border-color: rgba(176, 111, 25, 0.40);
      box-shadow:
        0 5px 0 rgba(105, 57, 5, 0.58),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .hero {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 16px;
      margin-bottom: 16px;
      align-items: stretch;
    }

    .lumi-card,
    .summary-card,
    .filter-card,
    .list-card,
    .detail-card,
    .history-card {
      border-radius: 24px;
      border: 1px solid rgba(193, 133, 61, 0.34);
      background: linear-gradient(180deg, rgba(255, 254, 249, 0.92), rgba(255, 247, 231, 0.90));
      box-shadow:
        0 14px 28px rgba(123, 75, 25, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(2px);
    }

    .lumi-card {
      min-height: 154px;
      display: grid;
      grid-template-columns: 130px 1fr;
      align-items: center;
      padding: 16px 20px;
    }

    .lumi-img {
      width: 130px;
      align-self: end;
      filter:
        drop-shadow(0 12px 15px rgba(112, 63, 15, 0.16))
        drop-shadow(0 0 15px rgba(255, 198, 94, 0.14));
    }

    .student-book-chat-entry {
      width:100%; min-height:154px; display:flex; align-items:center; gap:18px;
      padding:22px 26px; border:1px solid rgba(151,91,18,.48); border-radius:24px;
      background:linear-gradient(135deg,rgba(255,248,226,.98),rgba(226,181,91,.88));
      color:#573310; text-align:left; cursor:pointer;
      box-shadow:0 8px 0 rgba(105,57,5,.28),0 12px 22px rgba(100,57,12,.14);
      transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
    }
    .student-book-chat-entry:hover { transform:translateY(-2px); filter:saturate(1.04); box-shadow:0 10px 0 rgba(105,57,5,.30),0 15px 25px rgba(100,57,12,.17); }
    .student-book-chat-entry:active { transform:translateY(2px); box-shadow:0 4px 0 rgba(105,57,5,.28),0 8px 16px rgba(100,57,12,.13); }
    .student-book-chat-entry-icon { flex:0 0 auto; width:64px; height:64px; display:grid; place-items:center; border:1px solid rgba(139,81,14,.30); border-radius:20px; background:rgba(255,253,244,.78); font-size:34px; }
    .student-book-chat-entry-copy { min-width:0; display:grid; gap:6px; }
    .student-book-chat-entry-title { font-size:25px; font-weight:900; line-height:1.2; word-break:keep-all; }
    .student-book-chat-entry-description { color:#77522d; font-size:15px; font-weight:750; line-height:1.45; word-break:keep-all; }

    .speech-box {
      position: relative;
      padding: 18px 22px;
      border-radius: 22px;
      border: 1px solid rgba(186, 130, 58, 0.28);
      background: rgba(255, 254, 248, 0.78);
      color: #4f2d15;
      font-size: 19px;
      font-weight: 900;
      line-height: 1.45;
      word-break: keep-all;
    }

    .speech-box::before {
      content: "";
      position: absolute;
      left: -14px;
      top: 50%;
      width: 0;
      height: 0;
      transform: translateY(-50%);
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-right: 14px solid rgba(255, 254, 248, 0.92);
    }

    .summary-card {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .summary-title {
      margin-bottom: 13px;
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.6px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-box {
      min-height: 78px;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid rgba(192, 130, 55, 0.28);
      background: rgba(255, 255, 255, 0.54);
    }

    .stat-label {
      color: #8b6a46;
      font-size: 13px;
      font-weight: 900;
      word-break: keep-all;
    }

    .stat-value {
      margin-top: 6px;
      color: #4a2a10;
      font-size: 27px;
      font-weight: 900;
    }

    .filter-card {
      margin-bottom: 14px;
      padding: 14px 18px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr) 160px;
      gap: 10px;
      align-items: center;
    }

    .filter-button,
    .sort-select {
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(192, 130, 55, 0.34);
      background: rgba(255, 252, 245, 0.84);
      color: #5a3820;
      font-size: 15px;
      font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .filter-button.active {
      border-color: rgba(190, 125, 32, 0.82);
      background: linear-gradient(180deg, #f3c978, #c9902d);
      color: #4a2a10;
      box-shadow: 0 7px 13px rgba(176, 112, 25, 0.16);
    }

    .sort-select {
      padding: 0 12px;
      outline: none;
    }

    .board-grid {
      display: grid;
      grid-template-columns: 0.88fr 1.12fr;
      gap: 16px;
      align-items: stretch;
      min-height: 0;
    }

    .list-card,
    .detail-card {
      padding: 22px 24px;
      min-width: 0;
      min-height: 650px;
    }

    .detail-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #detailArea {
      display: grid;
      grid-template-rows: minmax(0, 1fr) 54px;
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #detailArea:has(> .teacher-note-box) {
      grid-template-rows: minmax(0, 1fr) minmax(150px, auto);
    }

    #detailArea:has(> .detail-empty) {
      grid-template-rows: 1fr;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      color: #4b2a13;
      font-family: "Noto Serif KR", serif;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    .count-pill {
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid rgba(190, 130, 55, 0.26);
      background: rgba(255, 249, 235, 0.88);
      color: #8c5c1e;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .guide-box {
      margin-bottom: 13px;
      padding: 14px 16px;
      border-radius: 17px;
      border: 1px dashed rgba(178, 122, 55, 0.36);
      background: rgba(255, 255, 255, 0.48);
      color: #694729;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
    }

    .post-list {
      display: grid;
      gap: 10px;
      max-height: 640px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .post-button {
      width: 100%;
      border: 1px solid rgba(186, 130, 58, 0.26);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.66);
      padding: 15px 17px;
      text-align: left;
      color: #4d321a;
      transition: 0.15s ease;
    }

    .post-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 14px rgba(123, 75, 25, 0.10);
    }

    .post-button.active {
      border-color: rgba(83, 133, 60, 0.65);
      background: rgba(243, 255, 236, 0.82);
      box-shadow:
        0 0 0 3px rgba(110, 169, 80, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    .post-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
      flex-wrap: wrap;
    }

    .student-name {
      color: #4b2a13;
      font-size: 17px;
      font-weight: 900;
    }

    .type-badge,
    .status-badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }

    .type-badge {
      background: rgba(222, 168, 79, 0.18);
      color: #8b5a1d;
    }

    .status-badge.pending {
      background: rgba(229, 174, 69, 0.20);
      color: #8b5a1d;
    }

    .status-badge.approved {
      background: rgba(88, 139, 62, 0.14);
      color: #47722c;
    }

    .status-badge.rejected {
      background: rgba(184, 82, 55, 0.13);
      color: #9b4228;
    }

    .time-text {
      margin-left: auto;
      color: #9c7141;
      font-size: 13px;
      font-weight: 800;
    }

    .post-question {
      color: #3f2615;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.45;
      word-break: keep-all;
    }

    .post-preview {
      margin-top: 9px;
      color: #6f4e2f;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.45;
      word-break: keep-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-list,
    .detail-empty {
      display: grid;
      place-items: center;
      border-radius: 18px;
      border: 1px dashed rgba(177, 122, 57, 0.30);
      background: rgba(255, 255, 255, 0.50);
      color: #92745a;
      font-size: 17px;
      font-weight: 850;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .empty-list {
      min-height: 230px;
    }

    .detail-empty {
      min-height: 560px;
    }

    #detailArea > .detail-empty {
      min-height: 0;
      height: 100%;
    }

    .detail-box,
    .reject-box,
    .teacher-note-box {
      border-radius: 18px;
      border: 1px solid rgba(186, 130, 58, 0.28);
      background: rgba(255, 255, 255, 0.64);
    }

    .detail-box {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      padding: 17px 19px;
      margin-bottom: 0;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 0 0 auto;
      margin-bottom: 10px;
    }

    .detail-name {
      color: #4b2a13;
      font-size: 19px;
      font-weight: 900;
    }

    .detail-question {
      color: #3f2615;
      font-size: 25px;
      font-weight: 900;
      line-height: 1.45;
      word-break: keep-all;
    }

    .detail-lines {
      display: grid;
      grid-template-rows: minmax(76px, 0.9fr) minmax(84px, 1fr) minmax(145px, 1.75fr);
      gap: 9px;
      flex: 1;
      min-height: 0;
      margin-top: 0;
    }

    .line-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding: 15px 17px;
      border-radius: 16px;
      background: rgba(255, 250, 238, 0.70);
      border: 1px solid rgba(186, 130, 58, 0.20);
      color: #4f3219;
      font-size: 17px;
      font-weight: 820;
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .line-card strong {
      display: block;
      margin-bottom: 6px;
      color: #4f7130;
      font-size: 16px;
      font-weight: 950;
    }

    .detail-lines .line-card:nth-child(3) {
      justify-content: flex-start;
      line-height: 1.5;
    }

    .balance-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      flex: 0 0 auto;
      min-height: 118px;
      margin-top: 9px;
    }

    .balance-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 118px;
      padding: 16px 18px;
      border-radius: 17px;
      border: 1px solid rgba(186, 130, 58, 0.22);
      background: rgba(255, 248, 231, 0.78);
      overflow-wrap: anywhere;
    }

    .balance-card strong {
      display: block;
      margin-bottom: 7px;
      color: #8b5a1d;
      font-size: 16px;
      font-weight: 950;
    }

    .balance-card p {
      color: #3f2615;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.4;
      word-break: keep-all;
    }

    .reply-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      max-height: 190px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .reply-item {
      padding: 11px 13px;
      border-radius: 14px;
      border: 1px solid rgba(101, 145, 66, 0.18);
      background: rgba(247, 253, 239, 0.78);
      color: #355628;
      font-size: 14px;
      font-weight: 850;
      line-height: 1.42;
      word-break: keep-all;
    }

    .reply-item strong {
      display: block;
      margin-bottom: 4px;
      color: #4d2b10;
      font-size: 13px;
      font-weight: 950;
    }

    .post-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      margin-top: 14px;
      border-radius: 18px;
      border: 1px solid rgba(181, 117, 37, 0.18);
    }

    .reject-box,
    .teacher-note-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 150px;
      padding: 16px 17px;
      margin-top: 0;
      background: rgba(255, 255, 250, 0.74);
    }

    .box-title {
      margin-bottom: 8px;
      color: #4b2a13;
      font-size: 18px;
      font-weight: 900;
    }

    .reason-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .reason-option {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 11px;
      border-radius: 14px;
      border: 1px solid rgba(186, 130, 58, 0.22);
      background: rgba(255, 255, 255, 0.58);
      color: #5a3820;
      font-size: 14px;
      font-weight: 850;
      word-break: keep-all;
    }

    .reason-option input {
      width: 16px;
      height: 16px;
      accent-color: #b06d0d;
      flex-shrink: 0;
    }

    .text-area {
      width: 100%;
      min-height: 88px;
      outline: none;
      resize: vertical;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1px solid rgba(196, 138, 69, 0.34);
      background: rgba(255, 255, 255, 0.74);
      color: #452713;
      font-size: 15px;
      font-weight: 760;
      line-height: 1.45;
    }

    .text-area:focus {
      border-color: rgba(203, 139, 44, 0.72);
      box-shadow:
        0 0 0 3px rgba(216, 162, 68, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 9px;
    }

    .pending-action-row {
      align-self: stretch;
      min-height: 54px;
      margin-top: 0;
      padding: 0 0 4px;
      background: transparent;
    }

    .pending-action-row .main-button,
    .pending-action-row .danger-button {
      min-height: 48px;
      height: 48px;
      font-size: 18px;
    }

    .plain-button,
    .main-button,
    .danger-button,
    .brown-button {
      min-height: 50px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
    }

    .plain-button {
      border: 1px solid rgba(175, 119, 53, 0.34);
      background: rgba(255, 252, 245, 0.78);
      color: #654220;
    }

    .main-button {
      border: 1px solid rgba(68, 124, 42, 0.38);
      background: linear-gradient(180deg, #3f842e, #245716);
      color: #fff8dd;
      box-shadow:
        0 7px 0 rgba(31, 70, 18, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.26);
    }

    .danger-button {
      border: 1px solid rgba(151, 67, 42, 0.38);
      background: linear-gradient(180deg, #c87952, #93401f);
      color: #fff8dd;
      box-shadow:
        0 7px 0 rgba(95, 39, 19, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .brown-button {
      border: 1px solid rgba(120, 73, 24, 0.38);
      background: linear-gradient(180deg, #965d25, #562b0c);
      color: #fff8dd;
      box-shadow:
        0 7px 0 rgba(52, 24, 8, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .plain-button:active,
    .main-button:active,
    .danger-button:active,
    .brown-button:active,
    .nav-button:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .feedback-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 58px;
      margin-top: 0;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1px solid rgba(209, 146, 48, 0.42);
      background: rgba(255, 250, 238, 0.78);
      color: #5b3a1f;
      font-size: 16px;
      font-weight: 880;
      line-height: 1.4;
      word-break: keep-all;
      user-select: text;
    }

    .feedback-box.good {
      min-height: 62px;
      padding-top: 13px;
      padding-bottom: 13px;
      border-color: rgba(97, 155, 72, 0.40);
      background: rgba(250, 255, 245, 0.78);
      color: #355628;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.4;
    }

    .feedback-box.bad {
      border-color: rgba(177, 79, 45, 0.36);
      background: rgba(255, 245, 240, 0.78);
      color: #8f3d24;
    }

    .feedback-box.bad strong {
      display: block;
      margin-bottom: 5px;
      font-size: 16px;
      font-weight: 950;
      line-height: 1.4;
    }

    .reject-reason-text {
      margin: 0;

    async function initPage() {
      bindEvents();
      const loaded = await loadBackendReviewPosts();

      if (!loaded) {
        renderAll();
      }
    }

    function bindEvents() {
      filterButtons.forEach(function(button) {
        button.addEventListener("click", function() {
          filterButtons.forEach(function(btn) {
            btn.classList.remove("active");
          });

          button.classList.add("active");
          currentStatus = button.dataset.status;
          selectedPostId = null;
          renderAll();
        });
      });

      sortSelect.addEventListener("change", function() {
        renderAll();
      });
    }

    function renderAll() {
      allPosts = getAllPosts();
      const filteredPosts = getFilteredPosts();

      if (!selectedPostId && filteredPosts.length > 0) {
        selectedPostId = filteredPosts[0].id;
      }

      renderPostList(filteredPosts);
      renderDetail();
      renderCounts(filteredPosts);
    }

    function getAllPosts() {
      return []
        .concat(reviewPostsByStatus.pending)
        .concat(reviewPostsByStatus.approved)
        .concat(reviewPostsByStatus.rejected);
    }

    function getFilteredPosts() {
      let posts = allPosts.slice();

      if (currentStatus !== "all") {
        posts = posts.filter(function(post) {
          return post.status === currentStatus;
        });
      }

      if (sortSelect.value === "name") {
        posts.sort(function(a, b) {
          return String(a.studentName || a.writer || "").localeCompare(String(b.studentName || b.writer || ""), "ko");
        });
      } else if (sortSelect.value === "book") {
        posts.sort(function(a, b) {
          return String(a.bookTitle || "").localeCompare(String(b.bookTitle || ""), "ko");
        });
      } else {
        posts.sort(function(a, b) {
          return String(b.submittedAt || b.createdAt || "").localeCompare(String(a.submittedAt || a.createdAt || ""));
        });
      }

      return posts;
    }

    function renderPostList(posts) {
      if (posts.length === 0) {
        postList.innerHTML = '<div class="empty-list">이 목록에 표시할 밸런스 게임 글이 없어요.</div>';
        return;
      }

      postList.innerHTML = posts.map(function(post) {
        const isActive = selectedPostId === post.id;
        const status = statusInfo[post.status] || statusInfo.pending;
        const counts = getChoiceCounts(post);
        const total = counts.A + counts.B;

        return `
          <button class="post-button ${isActive ? "active" : ""}" type="button" onclick="selectPost('${escapeAttribute(post.id)}')">
            <div class="post-top">
              <span class="student-name">${escapeHtml(post.studentName || post.writer || "학생")}</span>
              <span class="type-badge">⚖️ 밸런스 게임</span>
              <span class="status-badge ${status.className}">${status.label}</span>
              <span class="time-text">${escapeHtml(post.submittedText || post.createdDate || "오늘")}</span>
            </div>

            <div class="post-question">${escapeHtml(post.title || "밸런스 제목 없음")}</div>

            <div class="post-preview">
              ${escapeHtml(post.bookTitle || "책 제목 없음")} · 참여 ${total}명 · A ${counts.A}명 / B ${counts.B}명<br>
              ${escapeHtml(post.scene || "장면 설명이 없어요.")}
            </div>
          </button>
        `;
      }).join("");
    }

    function renderDetail() {
      const selectedPost = allPosts.find(function(post) {
        return post.id === selectedPostId;
      });

      if (!selectedPost) {
        document.getElementById("detailStatusPill").textContent = "선택 필요";
        detailArea.innerHTML = `
          <div class="detail-empty">
            왼쪽에서 밸런스 게임 글을 선택해 주세요.<br>
            선택한 글을 확인하고 승인하거나 거절할 수 있어요.
          </div>
        `;
        return;
      }

      const status = statusInfo[selectedPost.status] || statusInfo.pending;
      document.getElementById("detailStatusPill").textContent = status.label;

      detailArea.innerHTML = `
        <article class="detail-box">
          <div class="detail-meta">
            <span class="detail-name">${escapeHtml(selectedPost.studentName || selectedPost.writer || "학생")}의 밸런스 게임</span>
            <span class="type-badge">⚖️ 밸런스 게임</span>
            <span class="status-badge ${status.className}">${status.label}</span>
            <span class="time-text">${escapeHtml(selectedPost.submittedText || selectedPost.createdDate || "오늘")}</span>
          </div>

          <div class="detail-lines">
            ${renderLineCard("책 제목", selectedPost.bookTitle || "책 제목 없음")}
            ${renderLineCard("글 제목", selectedPost.title || "밸런스 제목 없음")}
            ${renderLineCard("장면 설명", selectedPost.scene || "장면 설명이 없어요.")}
          </div>

          <div class="balance-row">
            <div class="balance-card">
              <strong>A 선택지</strong>
              <p>${escapeHtml(selectedPost.optionA || "A 선택지 없음")}</p>
            </div>

            <div class="balance-card">
              <strong>B 선택지</strong>
              <p>${escapeHtml(selectedPost.optionB || "B 선택지 없음")}</p>
            </div>
          </div>
        </article>

        ${renderTeacherActionArea(selectedPost)}
      `;
    }

    function renderLineCard(title, text) {
      return `
        <div class="line-card">
          <strong>${escapeHtml(title)}</strong>
          ${escapeHtml(text)}
        </div>
      `;
    }

    function renderTeacherActionArea(post) {
      if (post.status === "pending") {
        return `
            <div class="button-row pending-action-row">
              <button class="main-button" type="button" onclick="approvePost('${escapeAttribute(post.id)}')">승인하기</button>
              <button class="danger-button" type="button" onclick="openRejectModal('${escapeAttribute(post.id)}')">거절하기</button>
            </div>
        `;
      }

      if (post.status === "approved") {
        return `
          <div class="teacher-note-box">
            <div class="box-title">승인된 밸런스 게임 글</div>
            <div class="feedback-box good">
              이 글은 현재 개별읽기 책수다방에 공개되는 글이에요.
            </div>

            <div class="button-row">
              <button class="brown-button" type="button" onclick="returnToPending('${escapeAttribute(post.id)}')">승인 취소</button>
              <button class="danger-button" type="button" onclick="hideApprovedPost('${escapeAttribute(post.id)}')">거절 목록으로 보내기</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="teacher-note-box">
          <div class="box-title">거절된 밸런스 게임 글</div>

          <div class="feedback-box bad">
            <strong>학생에게 남긴 말</strong>
            <p class="reject-reason-text">${escapeHtml(post.rejectReason || "거절 이유가 따로 입력되지 않았어요.")}</p>
          </div>

          <div class="button-row">
            <button class="main-button" type="button" onclick="approveRejectedPost('${escapeAttribute(post.id)}')">다시 승인하기</button>
            <button class="brown-button" type="button" onclick="returnToPending('${escapeAttribute(post.id)}')">대기로 돌리기</button>
          </div>
        </div>
      `;
    }

    function renderCounts(filteredPosts) {
      const pending = reviewPostsByStatus.pending;
      const approved = reviewPostsByStatus.approved;
      const rejected = reviewPostsByStatus.rejected;

      document.getElementById("pendingCount").textContent = pending.length + "개";
      document.getElementById("approvedCount").textContent = approved.length + "개";
      document.getElementById("rejectedCount").textContent = rejected.length + "개";
      document.getElementById("visibleCount").textContent = filteredPosts.length + "개";
    }

    function selectPost(id) {
      selectedPostId = id;
      renderAll();
    }

    async function approvePost(id) {
      const post = findPostById(id);
      if (!post) return;

      const approvedByApi = await changePostStatusWithApi(id, "approve");
      if (!approvedByApi) return;

      currentStatus = "approved";
      setActiveFilter("approved");
      selectedPostId = id;
      await loadBackendReviewPosts({ keepSelection: id });
    }

    async function rejectPost(id, rejectReason) {
      const post = findPostById(id);
      if (!post) return;

      const rejectedByApi = await changePostStatusWithApi(id, "reject", rejectReason);
      if (!rejectedByApi) return;

      currentStatus = "rejected";
      setActiveFilter("rejected");
      selectedPostId = id;
      await loadBackendReviewPosts({ keepSelection: id });
    }

    function openRejectModal(id) {
      modalTargetPostId = id;
      clearRejectForm();

      const modal = document.getElementById("rejectModal");
      if (!modal) return;

      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeRejectModal() {
      const modal = document.getElementById("rejectModal");
      if (!modal) return;

      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
      modalTargetPostId = null;
    }

    async function confirmRejectPost() {
      if (!modalTargetPostId) return;

      const checkedReasons = Array.from(document.querySelectorAll('input[name="modalRejectReason"]:checked'))
        .map(function(input) {
          return input.value;
        });

      const commentInput = document.getElementById("modalRejectCommentInput");
      const directComment = commentInput ? commentInput.value.trim() : "";
      const reasonParts = checkedReasons.slice();

      if (directComment) {
        reasonParts.push(directComment);
      }

      const error = document.getElementById("rejectError");

      if (reasonParts.length === 0) {
        if (error) {
          error.classList.add("show");
        }
        return;
      }

      const id = modalTargetPostId;
      const rejectReason = reasonParts.join("\n");
      closeRejectModal();
      await rejectPost(id, rejectReason);
    }

    async function approveRejectedPost(id) {
      await approvePost(id);
    }

    async function returnToPending(id) {
      const post = findPostById(id);
      if (!post) return;

      const returnedByApi = await changePostStatusWithApi(id, "pending");
      if (!returnedByApi) return;

      currentStatus = "pending";
      setActiveFilter("pending");
      selectedPostId = id;
      await loadBackendReviewPosts({ keepSelection: id });
    }

    async function hideApprovedPost(id) {
      const ok = confirm("이 글을 개별읽기 책수다방에서 숨기고 거절 목록으로 보낼까요?");
      if (!ok) return;

      const post = findPostById(id);
      if (!post) return;

      const rejectedByApi = await changePostStatusWithApi(
        id,
        "reject",
        "교사가 다시 확인한 뒤 개별읽기 책수다방에서 숨겼어요. 장면 설명이나 선택지를 다시 살펴봐요."
      );
      if (!rejectedByApi) return;

      currentStatus = "rejected";
      setActiveFilter("rejected");
      selectedPostId = id;
      await loadBackendReviewPosts({ keepSelection: id });
    }

    function findPostById(id) {
      return getAllPosts().find(function(post) {
        return post.id === id;
      });
    }

    function getTeacherAuthContext() {
      const token = sessionStorage.getItem("token");
      const teacherId = sessionStorage.getItem("id") || sessionStorage.getItem("studentId");
      const role = sessionStorage.getItem("role");

      if (!token || !teacherId || role !== "teacher") {
        return null;
      }

      return { token: token, teacherId: teacherId };
    }

    async function fetchReviewPostsByStatus(status) {
      const auth = getTeacherAuthContext();

      if (!auth) return null;

      const response = await fetch(
        `${API_BASE_URL}/api/teachers/${auth.teacherId}/individual-reading/book-chat/posts?status=${encodeURIComponent(status)}`,
        {
          method: "GET",
          headers: {
            Authorization: `Bearer ${auth.token}`
          }
        }
      );

      if (!response.ok) {
        throw new Error("개별읽기 책수다방 승인 목록을 불러오지 못했습니다.");
      }

      return response.json();
    }

    async function loadBackendReviewPosts(options) {
      const auth = getTeacherAuthContext();

      if (!auth) {
        postList.innerHTML = '<div class="empty-list">교사 로그인 정보가 없어요. 다시 로그인해 주세요.</div>';
        return false;
      }

      if (isDemoAccount()) {
        /*
         * reviewPostsByStatus를 곧바로 비우면, 이 함수가 네트워크 응답을
         * 기다리는 동안(await) 다른 승인/거절 액션이 findPostById()로 글을
         * 찾다가 "일시적으로 빈 목록"만 보고 조용히 실패할 수 있다(교사가
         * 짧은 시간 안에 서로 다른 글 두 개를 연달아 승인하면 두 번째
         * 승인이 사라지는 원인이었다). 그래서 로컬 변수에 다 채운 뒤
         * 마지막에 한 번에 교체한다 - 일반계정 분기와 같은 방식이다.
         */
        const nextReviewPostsByStatus = { pending: [], approved: [], rejected: [] };

        /* 학생 화면과 같은 공용 최종 seed를 그대로 사용한다. 심사계정의
           승인 seed에는 날짜 필터를 적용하지 않아 날짜가 바뀌어도 유지된다. */
        getDemoFinalIndividualBookChatSeeds().forEach(function (seed) {
          const status = seed.status;
          nextReviewPostsByStatus[status].push({
            id: seed.id,
            sourceId: seed.id,
            status: status,
            studentId: seed.writerLoginId || null,
            writerLoginId: seed.writerLoginId || "",
            classId: null,
            studentName: seed.studentName,
            writer: seed.studentName,
            bookTitle: seed.bookTitle,
            title: seed.title,
            scene: seed.scene,
            optionA: seed.optionA,
            optionB: seed.optionB,
            imageData: "",
            countA: 0,
            countB: 0,
            commentCount: 0,
            replies: [],
            submittedAt: seed.submittedAt,
            submittedText: formatDateText(seed.submittedAt),
            createdAt: seed.submittedAt,
            createdDate: seed.submittedAt.slice(0, 10),
            reviewedAt: seed.updatedAt || "",
            reviewedText: seed.updatedAt ? formatDateText(seed.updatedAt) : "",
            rejectReason: seed.reason || ""
          });
        });

        /*
         * 3) ss01이 이 브라우저에서 직접 쓴 글(기존 방식 그대로, requestId
         * 기준 별도 저장소) - 위 두 종류와 id 네임스페이스가 겹치지 않는다.
         */
        loadDemoApprovalRequests("individual").forEach(function(request) {
          const status = ["pending", "approved", "rejected"].includes(request.status)
            ? request.status
            : "pending";
          if (status === "approved" && !isDemoBookChatItemOnDate(
            request,
            getDemoTodayDateKey(),
            request.reviewedAt || ""
          )) return;
          nextReviewPostsByStatus[status].push({
            id: String(request.requestId),
            sourceId: String(request.requestId),
            status: status,
            studentId: request.studentId,
            classId: request.classId,
            studentName: request.studentName || "김초롱",
            writer: request.studentName || "김초롱",
            bookTitle: request.bookTitle || "책 제목 없음",
            title: request.title || "밸런스 게임 제목 없음",
            scene: request.scene || "",
            optionA: request.optionA || "",
            optionB: request.optionB || "",
            imageData: "",
            countA: 0,
            countB: 0,
            commentCount: 0,
            replies: [],
            submittedAt: request.submittedAt || "",
            submittedText: formatDateText(request.submittedAt),
            createdAt: request.submittedAt || "",
            createdDate: request.activityDate || "",
            reviewedAt: request.reviewedAt || "",
            reviewedText: request.reviewedAt ? formatDateText(request.reviewedAt) : "",
            rejectReason: request.rejectedReason || ""
          });
        });

        reviewPostsByStatus = nextReviewPostsByStatus;
        if (options && options.keepSelection) selectedPostId = String(options.keepSelection);
        renderAll();
        return true;
      }

      try {
        const results = await Promise.all([
          fetchReviewPostsByStatus("PENDING"),
          fetchReviewPostsByStatus("APPROVED"),
          fetchReviewPostsByStatus("REJECTED")
        ]);

        reviewPostsByStatus = {
          pending: results[0].map(function(item) {
            return mapReviewItemToPost(item, "pending");
          }),
          approved: results[1].map(function(item) {
            return mapReviewItemToPost(item, "approved");
          }),
          rejected: results[2].map(function(item) {
            return mapReviewItemToPost(item, "rejected");
          })
        };

        if (options && options.keepSelection) {
          selectedPostId = String(options.keepSelection);
        }

        renderAll();
        return true;
      } catch (error) {
        console.warn(error);
        postList.innerHTML = '<div class="empty-list">실제 책수다방 글을 불러오지 못했어요.</div>';
        return false;
      }
    }

    function mapReviewItemToPost(item, status) {
      return {
        id: String(item.id),
        sourceId: String(item.id),
        status: status,
        studentId: item.studentId,
        classId: item.classId,
        studentName: item.writerName || item.writer || "학생",
        writer: item.writerName || item.writer || "학생",
        bookTitle: item.bookTitle || "책 제목 없음",
        title: item.title || "밸런스 게임 제목 없음",
        scene: item.scene || "",
        optionA: item.optionA || "",
        optionB: item.optionB || "",
        imageData: "",
        countA: item.countA || 0,
        countB: item.countB || 0,
        commentCount: item.commentCount || 0,
        replies: [],
        submittedAt: item.createdAt || "",
        submittedText: formatDateText(item.createdAt),
        createdAt: item.createdAt || "",
        createdDate: item.activityDate || "",
        reviewedAt: item.reviewedAt || "",
        reviewedText: item.reviewedAt ? formatDateText(item.reviewedAt) : "",
        rejectReason: item.rejectReason || ""
      };
    }

    async function changePostStatusWithApi(id, action, reason) {
      if (isDemoAccount()) {
        const status = action === "approve" ? "approved" : action === "reject" ? "rejected" : "pending";

        /*
         * ss01이 이 브라우저에서 직접 쓴 글이면 기존 방식(요청 자체의
         * status를 바꿈) 그대로 쓰고, 그게 아니면(실제 DB 승인 예시 또는
         * 가상 승인대기 예시) 원본은 그대로 두고 이 브라우저의 override만
         * 남긴다.
         */
        const directRequest = loadDemoApprovalRequests("individual").find(function (item) {
          return String(item.requestId) === String(id);
        });

        if (directRequest) {
          return Boolean(updateDemoApprovalRequest("individual", id, status, reason || ""));
        }

        return Boolean(saveDemoBookChatStatusOverride("individual", id, status, reason || ""));
      }
      const auth = getTeacherAuthContext();

      if (!auth) {
        alert("로그인 정보가 없어 처리할 수 없어요. 다시 로그인한 뒤 시도해 주세요.");
        return false;
      }

      const response = await fetch(
        `${API_BASE_URL}/api/teachers/${auth.teacherId}/individual-reading/book-chat/posts/${encodeURIComponent(id)}/${action}`,
        {
          method: "PATCH",
          headers: Object.assign(
            { Authorization: `Bearer ${auth.token}` },
            action === "reject" ? { "Content-Type": "application/json" } : {}
          ),
          body: action === "reject" ? JSON.stringify({ reason: reason }) : undefined
        }
      );

      if (!response.ok) {
        alert("처리에 실패했어요. 잠시 뒤 다시 시도해 주세요.");
        return false;
      }

      return true;
    }

    function setActiveFilter(status) {
      filterButtons.forEach(function(button) {
        button.classList.toggle("active", button.dataset.status === status);
      });
    }

    function clearRejectForm() {
      document.querySelectorAll('input[name="modalRejectReason"]').forEach(function(input) {
        input.checked = false;
      });

      const commentInput = document.getElementById("modalRejectCommentInput");
      const error = document.getElementById("rejectError");

      if (commentInput) {
        commentInput.value = "";
      }

      if (error) {
        error.classList.remove("show");
      }
    }

    function getAllReplies(post) {
      return Array.isArray(post.replies) ? post.replies : [];
    }

    function getChoiceCounts(post) {
      if (typeof post.countA === "number" || typeof post.countB === "number") {
        return {
          A: post.countA || 0,
          B: post.countB || 0
        };
      }

      const replies = getAllReplies(post);

      return {
        A: replies.filter(function(reply) {
          return reply.choice === "A";
        }).length,
        B: replies.filter(function(reply) {
          return reply.choice === "B";
        }).length
      };
    }

    function formatDateText(value) {
      if (!value) return "";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");

      return month + "." + day + " " + hour + ":" + minute;
    }

    function goTeacherHome() {
      location.href = "./home.html";
    }

    function openStudentBookChat() {
      sessionStorage.setItem("teacherMode", "true");
      sessionStorage.setItem("teacherBookChatReturn", "individual-book-chat-manage.html");
      sessionStorage.setItem("teacherBookChatDemoMode", String(isDemoAccount()));
      location.href = "../student/individual-during-reading.html?view=bookChat&teacher=1";
    }

    function goIndividualManage() {
      location.href = "./individual-reading-manage.html";
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(text) {
      return escapeHtml(text).replaceAll("`", "&#096;");
    }
  </script>
  <script src="../js/fixed-stage.js"></script>
</body>
