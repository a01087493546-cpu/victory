<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>문답책 | 교사 개별읽기 관리</title>

  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&display=swap");

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --brown: #4b2a13;
      --brown-soft: #765136;
      --gold: #e4ad45;
      --gold-dark: #a9630b;
      --cream: #fff8e9;
      --cream-deep: #f2ddb7;
      --green: #849d42;
      --green-dark: #61762e;

      --paper: rgba(255, 254, 249, 0.96);
      --paper-warm: rgba(255, 247, 231, 0.95);

      --line: rgba(190, 130, 55, 0.34);

      --shadow:
        0 13px 27px rgba(82, 51, 23, 0.16);

      --radius-large: 28px;
      --radius-medium: 20px;
      --radius-small: 15px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      color: var(--brown);

      font-family:
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          rgba(255, 247, 226, 0.34),
          rgba(214, 195, 162, 0.48)
        ),
        url("../assets/images/class-reading/class-reading-question-bg.png");

      background-size: cover;
      background-position: center;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================
       전체 화면
    ========================================================= */

    .wr-page {
      width: 100%;
      height: 100vh;

      padding: 14px 20px 16px;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255, 255, 255, 0.64),
          transparent 34%
        ),
        linear-gradient(
          90deg,
          rgba(255, 246, 224, 0.62),
          rgba(255, 255, 255, 0.12),
          rgba(255, 246, 224, 0.62)
        );
    }

    .wr-shell {
      width: min(1580px, calc(100vw - 40px));
      height: 100%;

      margin: 0 auto;

      display: grid;
      grid-template-rows: 78px minmax(0, 1fr);
      gap: 12px;

      overflow: hidden;
    }

    /* =========================================================
       상단바
    ========================================================= */

    .wr-topbar {
      min-width: 0;
      height: 78px;

      display: grid;
      grid-template-columns:
        minmax(210px, 1fr)
        auto
        minmax(315px, 1fr);

      align-items: center;
      gap: 16px;

      padding: 10px 18px;

      border: 1.5px solid var(--line);
      border-radius: 25px;

      background:
        linear-gradient(
          180deg,
          rgba(255, 254, 249, 0.96),
          rgba(255, 247, 231, 0.94)
        );

      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .wr-brand {
      min-width: 0;

      display: flex;
      align-items: center;
      gap: 10px;

      color: var(--brown);

      font-family: "Noto Serif KR", serif;
      font-size: 24px;
      font-weight: 900;

      white-space: nowrap;
    }

    .wr-brand-icon {
      width: 45px;
      height: 45px;
      flex: 0 0 45px;

      display: grid;
      place-items: center;

      overflow: hidden;

      border: 1px solid rgba(255, 224, 158, 0.78);
      border-radius: 15px;

      background:
        linear-gradient(
          180deg,
          #bf8740,
          #6d3a0d
        );

      box-shadow:
        0 7px 14px rgba(91, 47, 10, 0.18);
    }

    .wr-brand-icon img {
      width: 31px;
      height: 31px;

      display: block;
      object-fit: contain;
    }

    .wr-top-title {
      min-width: 0;

      text-align: center;
      white-space: nowrap;
    }

    .wr-top-title-small {
      margin-bottom: 1px;

      color: #8a5a21;

      font-size: 12px;
      font-weight: 900;
    }

    .wr-main-title {
      color: var(--brown);

      font-family: "Noto Serif KR", serif;
      font-size: clamp(27px, 2vw, 35px);
      font-weight: 900;

      letter-spacing: -1px;
      line-height: 1.1;

      text-shadow:
        0 3px 0 rgba(255, 255, 255, 0.7);
    }

    .wr-top-pills {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;

      white-space: nowrap;
    }

    .wr-pill,
    .wr-home-button {
      height: 39px;

      padding: 0 14px;

      border-radius: 13px;

      font-size: 17px;
      font-weight: 900;

      white-space: nowrap;
    }

    .wr-pill {
      color: #4f2e16;

      border: 1px solid rgba(177, 122, 57, 0.32);

      background:
        rgba(255, 250, 238, 0.88);
    }

    .wr-home-button {
      color: #fff9ec;

      border:
        1px solid rgba(176, 111, 25, 0.42);

      background:
        linear-gradient(
          180deg,
          #e5ae44,
          #aa6408
        );

      box-shadow:
        0 4px 0 rgba(105, 57, 5, 0.52);
    }

    .wr-home-button:active {
      transform: translateY(2px);

      box-shadow:
        0 2px 0 rgba(105, 57, 5, 0.52);
    }

    /* =========================================================
       메인 배치
    ========================================================= */

    .wr-dashboard {
      min-width: 0;
      min-height: 0;
      height: 100%;

      display: grid;
      grid-template-columns:
        minmax(0, 1.45fr)
        minmax(430px, 0.85fr);

      gap: 12px;

      overflow: hidden;
    }

    .wr-left-area,
    .wr-right-area {
      min-width: 0;
      min-height: 0;
      height: 100%;
    }

    .wr-left-area {
      display: flex;
    }

    .wr-right-area {
      display: grid;
      grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 0.9fr);

      gap: 10px;
    }

    .wr-card {
      position: relative;

      min-width: 0;
      min-height: 0;

      border: 1.5px solid var(--line);
      border-radius: var(--radius-large);

      background:
        linear-gradient(
          180deg,
          var(--paper),
          var(--paper-warm)
        );

      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.74);

      overflow: hidden;
    }

    .wr-card::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(255, 219, 129, 0.11),
          transparent 36%
        );

      pointer-events: none;
    }

    .wr-card-inner {
      position: relative;
      z-index: 1;

      width: 100%;
      height: 100%;

      padding: 17px 19px;
    }

    .wr-card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;

      margin-bottom: 11px;
    }

    .wr-card-title {
      color: var(--brown);

      font-family: "Noto Serif KR", serif;
      font-size: 25px;
      font-weight: 900;

      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .wr-card-sub {
      margin-top: 4px;

      color: var(--brown-soft);

      font-size: 14px;
      font-weight: 850;
      line-height: 1.35;
    }

    .wr-small-tag {
      min-width: 61px;
      height: 35px;
      flex-shrink: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 11px;

      border:
        1px solid rgba(190, 130, 55, 0.28);
      border-radius: 999px;

      background:
        rgba(255, 249, 235, 0.92);

      color: #8c5c1e;

      font-size: 13px;
      font-weight: 900;
    }

    /* =========================================================
       학생별 달성도 미리보기
    ========================================================= */

    .wr-preview-card {
      width: 100%;
      height: 100%;
    }

    .wr-preview-card .wr-card-inner {
      display: flex;
      flex-direction: column;

      padding: 19px 21px 17px;
    }

    .wr-preview-card .wr-card-title {
      font-size: 28px;
    }

    .wr-preview-card .wr-card-sub {
      font-size: 15px;
    }

    .wr-preview-list {
      flex: 1;
      min-height: 0;

      display: grid;
      grid-template-rows:
        repeat(4, minmax(0, 1fr));

      gap: 10px;
    }

    .wr-student-row {
      min-width: 0;
      min-height: 0;

      display: grid;
      grid-template-columns:
        105px
        minmax(170px, 1fr)
        94px;

      align-items: center;
      gap: 15px;

      padding: 12px 16px;

      border:
        1px solid rgba(190, 130, 55, 0.23);
      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.65);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.66);
    }

    .wr-student-name {
      color: var(--brown);

      font-size: 19px;
      font-weight: 900;
    }

    .wr-achieve-bar {
      width: 100%;
      height: 18px;

      border-radius: 999px;

      background: #f1dfc4;

      overflow: hidden;
    }

    .wr-achieve-fill {
      height: 100%;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          #f2ca70,
          #bd7816
        );
    }

    .wr-state-good .wr-achieve-fill {
      background:
        linear-gradient(
          90deg,
          #efbd76,
          #b97221
        );
    }

    .wr-state-need .wr-achieve-fill {
      background:
        linear-gradient(
          90deg,
          #f2b879,
          #c27b3a
        );
    }

    .wr-state-danger .wr-achieve-fill {
      background:
        linear-gradient(
          90deg,
          #e7a078,
          #b75b36
        );
    }

    .wr-student-result {
      text-align: right;
    }

    .wr-student-percent {
      color: #a76315;

      font-size: 21px;
      font-weight: 900;
      line-height: 1;
    }

    .wr-student-state {
      margin-top: 4px;

      color: #74553d;

      font-size: 12px;
      font-weight: 900;
    }

    .wr-more-button {
      width: 100%;
      height: 49px;
      flex-shrink: 0;

      margin-top: 10px;

      border:
        1px solid rgba(132, 78, 15, 0.5);
      border-radius: 16px;

      background:
        linear-gradient(
          180deg,
          #e8b64c,
          #bd7410
        );

      color: #fffaf0;

      font-size: 17px;
      font-weight: 900;

      box-shadow:
        0 5px 0 rgba(105, 57, 5, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .wr-more-button:active {
      transform: translateY(3px);

      box-shadow:
        0 2px 0 rgba(105, 57, 5, 0.5);
    }

    /* =========================================================
       오늘의 학습 현황
    ========================================================= */

    .wr-status-card .wr-card-inner {
      display: flex;
      flex-direction: column;

      padding: 15px 17px;
    }

    .wr-status-card .wr-card-title-row {
      margin-bottom: 8px;
    }

    .wr-status-card .wr-card-title {
      font-size: 23px;
    }

    .wr-today-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      margin-bottom: 8px;
    }

    .wr-today-box {
      min-height: 64px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 5px 7px;

      border:
        1px solid rgba(190, 130, 55, 0.27);
      border-radius: 16px;

      background:
        rgba(255, 250, 238, 0.88);
    }

    .wr-today-value {
      color: #a76315;

      font-size: 28px;
      font-weight: 900;
      line-height: 1;
    }

    .wr-today-label {
      margin-top: 3px;

      color: #745239;

      font-size: 13px;
      font-weight: 900;
      line-height: 1.2;
    }

    .wr-support-list {
      flex: 1;
      min-height: 0;

      display: grid;
      grid-template-rows:
        repeat(3, minmax(0, 1fr));

      gap: 6px;
    }

    .wr-support-item {
      min-width: 0;
      min-height: 0;

      display: grid;
      grid-template-columns:
        84px
        minmax(0, 1fr);

      align-items: center;
      gap: 7px;

      padding: 6px 11px;

      border:
        1px solid rgba(190, 130, 55, 0.22);
      border-radius: 13px;

      background:
        rgba(255, 255, 255, 0.64);
    }

    .wr-support-name {
      color: var(--brown);

      font-size: 15px;
      font-weight: 900;
    }

    .wr-support-reason {
      color: #704e32;

      font-size: 15px;
      font-weight: 850;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================================================
       개별읽기 관리
    ========================================================= */

    .wr-manage-card .wr-card-inner {
      display: flex;
      flex-direction: column;

      padding: 13px 16px 11px;
    }

    .wr-manage-card .wr-card-title-row {
      margin-bottom: 6px;
    }

    .wr-manage-card .wr-card-title {
      font-size: 22px;
    }

    /* 관리 버튼 3개 세로 배치 */

    .wr-main-buttons {
      flex: 1;
      min-height: 0;

      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .wr-big-button {
      width: 100%;
      min-height: 54px;
      min-width: 0;

      padding: 9px 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      border:
        1px solid rgba(176, 111, 25, 0.37);
      border-radius: 13px;

      background:
        linear-gradient(
          180deg,
          #fff7e7,
          #f1d8aa
        );

      color: var(--brown);

      font-size: 13px;
      font-weight: 900;

      white-space: nowrap;

      box-shadow:
        0 4px 0 rgba(127, 87, 35, 0.33),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .wr-big-button.green {
      color: #fffaf0;

      background:
        linear-gradient(
          180deg,
          #91aa4a,
          #687c31
        );

      box-shadow:
        0 4px 0 rgba(70, 83, 31, 0.44);
    }

    .wr-big-button:active {
      transform: translateY(2px);
    }

    .wr-big-button-icon {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 9px;

      background:
        rgba(255, 255, 255, 0.36);

      font-size: 13px;
    }

    /* =========================================================
       학생별 상세 평가 보조창
    ========================================================= */

    .wr-detail-modal {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 25px;

      background:
        rgba(38, 22, 10, 0.68);

      backdrop-filter: blur(5px);
    }

    .wr-detail-modal.show {
      display: flex;
    }

    .wr-detail-panel {
      width: min(1120px, calc(100vw - 50px));
      max-height: calc(100vh - 50px);

      display: flex;
      flex-direction: column;

      border:
        2px solid rgba(202, 144, 61, 0.55);
      border-radius: 28px;

      background:
        linear-gradient(
          180deg,
          #fffdf8,
          #fff2d8
        );

      box-shadow:
        0 27px 68px rgba(39, 22, 9, 0.5);

      overflow: hidden;
    }

    .wr-detail-header {
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;

      padding: 18px 22px;

      border-bottom:
        1px solid rgba(190, 130, 55, 0.31);

      background:
        linear-gradient(
          180deg,
          #fffaf0,
          #f3dfbd
        );
    }

    .wr-detail-title {
      color: var(--brown);

      font-family: "Noto Serif KR", serif;
      font-size: 27px;
      font-weight: 900;
    }

    .wr-detail-description {
      margin-top: 4px;

      color: var(--brown-soft);

      font-size: 15px;
      font-weight: 850;
    }

    .wr-detail-close {
      min-width: 80px;
      height: 43px;
      flex-shrink: 0;

      border:
        1px solid rgba(176, 111, 25, 0.42);
      border-radius: 14px;

      background:
        linear-gradient(
          180deg,
          #e4ad45,
          #ad680b
        );

      color: #fff9ec;

      font-size: 15px;
      font-weight: 900;

      box-shadow:
        0 4px 0 rgba(105, 57, 5, 0.5);
    }

    .wr-detail-content {
      flex: 1;
      min-height: 0;

      padding: 15px;

      overflow-y: auto;
      overflow-x: hidden;

      scrollbar-width: thin;
      scrollbar-color: #bd7a1e #f1dfc4;
    }

    .wr-detail-content::-webkit-scrollbar {
      width: 11px;
    }

    .wr-detail-content::-webkit-scrollbar-track {
      background: #f1dfc4;
    }

    .wr-detail-content::-webkit-scrollbar-thumb {
      border:
        3px solid #f1dfc4;
      border-radius: 999px;

      background:
        linear-gradient(
          180deg,
          #dda83d,
          #9a5d16
        );
    }

    .wr-detail-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 12px;
    }

    .wr-detail-card {
      min-width: 0;

      padding: 15px 17px;

      border:
        1px solid rgba(190, 130, 55, 0.29);
      border-radius: 18px;

      background:
        rgba(255, 250, 238, 0.94);

      box-shadow:
        0 7px 14px rgba(116, 71, 20, 0.09);
    }

    .wr-detail-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 11px;
    }

    .wr-detail-name {
      color: var(--brown);

      font-size: 21px;
      font-weight: 900;
    }

    .wr-state-chip {
      padding: 6px 11px;

      border-radius: 999px;

      color: #fff;

      font-size: 13px;
      font-weight: 900;

      white-space: nowrap;
    }

    .chip-excellent {
      background: #b97919;
    }

    .chip-good {
      background: #a16b22;
    }

    .chip-need {
      background: #c27b3a;
    }

    .chip-danger {
      background: #b65b36;
    }

    .wr-detail-bars {
      display: grid;
      gap: 9px;
    }

    .wr-detail-bar-row {
      display: grid;
      grid-template-columns:
        92px
        minmax(0, 1fr)
        44px;

      align-items: center;
      gap: 9px;
    }

    .wr-detail-bar-name {
      color: #59371e;

      font-size: 15px;
      font-weight: 900;
    }

    .wr-detail-bar {
      height: 14px;

      border-radius: 999px;

      background: #f1dfc4;

      overflow: hidden;
    }

    .wr-detail-bar-fill {
      height: 100%;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          #efc36f,
          #ad6a0d
        );
    }

    .wr-detail-bar-value {
      color: #a76315;

      font-size: 15px;
      font-weight: 900;

      text-align: right;
    }

    .wr-teacher-note {
      margin-top: 11px;
      padding: 9px 11px;

      border:
        1px dashed rgba(177, 122, 57, 0.33);
      border-radius: 14px;

      background:
        rgba(255, 255, 255, 0.62);

      color: #684a2c;

      font-size: 14px;
      font-weight: 800;
      line-height: 1.4;
    }

    /* =========================================================
       낮은 화면 보정
    ========================================================= */

    @media (min-width: 1101px) and (max-height: 820px) {
      .wr-page {
        padding:
          9px 15px 11px;
      }

      .wr-shell {
        width:
          min(1580px, calc(100vw - 30px));

        grid-template-rows:
          67px minmax(0, 1fr);

        gap: 9px;
      }

      .wr-topbar {
        height: 67px;

        padding:
          7px 15px;
      }

      .wr-brand {
        font-size: 21px;
      }

      .wr-brand-icon {
        width: 39px;
        height: 39px;
        flex-basis: 39px;
      }

      .wr-brand-icon img {
        width: 27px;
        height: 27px;
      }

      .wr-main-title {
        font-size: 27px;
      }

      .wr-top-title-small {
        font-size: 11px;
      }

      .wr-pill,
      .wr-home-button {
        height: 34px;

        padding:
          0 11px;

        font-size: 12px;
      }

      .wr-dashboard {
        gap: 9px;
      }

      .wr-right-area {
        gap: 8px;
      }

      .wr-preview-card .wr-card-inner {
        padding:
          15px 17px 14px;
      }

      .wr-preview-card .wr-card-title {
        font-size: 24px;
      }

      .wr-preview-list {
        gap: 7px;
      }

      .wr-student-row {
        padding:
          8px 13px;
      }

      .wr-more-button {
        height: 42px;
        margin-top: 8px;

        font-size: 15px;
      }

      .wr-status-card .wr-card-inner {
        padding:
          12px 14px;
      }

      .wr-today-box {
        min-height: 53px;
      }

      .wr-today-value {
        font-size: 24px;
      }

      .wr-support-item {
        padding:
          4px 9px;
      }

      .wr-manage-card .wr-card-inner {
        padding:
          10px 13px 9px;
      }

      .wr-main-buttons {
        gap: 7px;
      }

      .wr-big-button {
        min-height: 44px;
        padding: 7px 13px;
        font-size: 15px;
      }

      .wr-big-button-icon {
        width: 21px;
        height: 21px;
        flex-basis: 21px;

        font-size: 11px;
      }
    }

    /* =========================================================
       반응형
    ========================================================= */

    @media (max-width: 1100px) {
      html,
      body {
        height: auto;
        overflow-y: auto;
      }

      .wr-page {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .wr-shell {
        height: auto;

        grid-template-rows:
          auto auto;

        overflow: visible;
      }

      .wr-topbar {
        height: auto;

        grid-template-columns:
          1fr;

        padding: 14px;
      }

      .wr-brand,
      .wr-top-pills {
        justify-content: center;
      }

      .wr-top-title {
        white-space: normal;
      }

      .wr-dashboard {
        height: auto;

        grid-template-columns:
          1fr;

        overflow: visible;
      }

      .wr-right-area {
        grid-template-rows:
          auto auto;
      }

      .wr-preview-card {
        height: auto;
      }

      .wr-preview-list {
        grid-template-rows:
          repeat(4, auto);
      }

      .wr-student-row {
        min-height: 78px;
      }

      .wr-detail-grid {
        grid-template-columns:
          1fr;
      }
    }
  </style>
</head>

<body>
  <main class="wr-page">
    <div class="wr-shell">

      <!-- 상단 -->
      <header class="wr-topbar">

        <div class="wr-brand">
          <div class="wr-brand-icon">
            <img
              src="../assets/images/logo-book.png"
              alt="문답책 로고"
            />
          </div>

          <span>문답책</span>
        </div>

        <div class="wr-top-title">
          <div class="wr-top-title-small">
            📚 개별읽기 대시보드
          </div>

          <h1 class="wr-main-title">
            우리 반 개별읽기 한눈에 보기
          </h1>
        </div>

        <div class="wr-top-pills">
          <button
            class="wr-pill"
            type="button"
          >
            교사 송은정
          </button>

          <button
            class="wr-pill"
            type="button"
          >
            4학년 1반
          </button>

          <button
            class="wr-home-button"
            type="button"
            onclick="goTeacherHome()"
          >
            교사 홈
          </button>
        </div>
      </header>

      <!-- 본문 -->
      <section class="wr-dashboard">

        <!-- 학생별 달성도 -->
        <div class="wr-left-area">
          <article class="wr-card wr-preview-card">
            <div class="wr-card-inner">

              <div class="wr-card-title-row">
                <div>
                  <h2 class="wr-card-title">
                    학생별 달성도 미리보기
                  </h2>

                  <p class="wr-card-sub">
                    학생별 개별읽기 활동 상태를 확인할 수 있어요.
                  </p>
                </div>

                <span class="wr-small-tag">
                  4명 표시
                </span>
              </div>

              <div
                class="wr-preview-list"
                id="studentPreviewList"
              ></div>

              <button
                class="wr-more-button"
                type="button"
                onclick="openStudentDetailModal()"
              >
                개별 평가 상세히 보기
              </button>
            </div>
          </article>
        </div>

        <!-- 오른쪽 -->
        <div class="wr-right-area">

          <!-- 오늘 현황 -->
          <article class="wr-card wr-status-card">
            <div class="wr-card-inner">

              <div class="wr-card-title-row">
                <h2 class="wr-card-title">
                  오늘의 학습 현황
                </h2>

                <span class="wr-small-tag">
                  오늘
                </span>
              </div>

              <div class="wr-today-main">

                <div class="wr-today-box">
                  <div class="wr-today-value">
                    76%
                  </div>

                  <div class="wr-today-label">
                    오늘 참여율
                  </div>
                </div>

                <div class="wr-today-box">
                  <div class="wr-today-value">
                    3명
                  </div>

                  <div class="wr-today-label">
                    추가 지원 필요
                  </div>
                </div>
              </div>

              <div class="wr-support-list">

                <div class="wr-support-item">
                  <div class="wr-support-name">
                    김수현
                  </div>

                  <div class="wr-support-reason">
                    질문 미제출
                  </div>
                </div>

                <div class="wr-support-item">
                  <div class="wr-support-name">
                    이재훈
                  </div>

                  <div class="wr-support-reason">
                    읽기 활동 참여 부족
                  </div>
                </div>

                <div class="wr-support-item">
                  <div class="wr-support-name">
                    송은정
                  </div>

                  <div class="wr-support-reason">
                    질문 수정 횟수 많음
                  </div>
                </div>

              </div>
            </div>
          </article>

          <!-- 개별읽기 관리 -->
          <article class="wr-card wr-manage-card">
            <div class="wr-card-inner">

              <div class="wr-card-title-row">
                <h2 class="wr-card-title">
                  개별읽기 관리
                </h2>
              </div>

              <div class="wr-main-buttons">

                <button
                  class="wr-big-button"
                  type="button"
                  onclick="goBookChatManage()"
                >
                  <span>책수다방 관리</span>
                  <span class="wr-big-button-icon">💬</span>
                </button>

                <button
                  class="wr-big-button"
                  type="button"
                  onclick="goRecommendShelf()"
                >
                  <span>추천 책장</span>
                  <span class="wr-big-button-icon">📚</span>
                </button>

                <button
                  class="wr-big-button green"
                  type="button"
                  onclick="goSummaryActivity()"
                >
                  <span>간추리기</span>
                  <span class="wr-big-button-icon">✏️</span>
                </button>

              </div>
            </div>
          </article>

        </div>
      </section>
    </div>
  </main>

  <!-- 학생별 평가 상세 보조창 -->
  <div
    class="wr-detail-modal"
    id="studentDetailModal"
    onclick="closeStudentDetailByBackground(event)"
  >
    <div
      class="wr-detail-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="studentDetailTitle"
    >

      <div class="wr-detail-header">

        <div>
          <h2
            class="wr-detail-title"
            id="studentDetailTitle"
          >
            학생별 개별읽기 평가 상세
          </h2>

          <p class="wr-detail-description">
            학생별 독서 실천도와 기록 완성도를 확인해요.
          </p>
        </div>

        <button
          class="wr-detail-close"
          type="button"
          onclick="closeStudentDetailModal()"
        >
          닫기
        </button>
      </div>

      <div class="wr-detail-content">
        <div
          class="wr-detail-grid"
          id="studentDetailGrid"
        ></div>
      </div>
    </div>
  </div>

  <script>
    const students = [
      {
        name: "김민지",
        total: 92,
        readingPractice: 95,
        recordCompletion: 90,
        state: "매우 우수",
        note: "꾸준히 책을 읽고 독서 기록도 빠짐없이 충실하게 작성했어요."
      },
      {
        name: "송은정",
        total: 87,
        readingPractice: 90,
        recordCompletion: 84,
        state: "우수",
        note: "정해진 독서를 꾸준히 실천하고 기록 내용을 알맞게 완성했어요."
      },
      {
        name: "이재훈",
        total: 68,
        readingPractice: 70,
        recordCompletion: 65,
        state: "지원 필요",
        note: "독서 실천을 격려하고 기록에 책의 내용이 충분히 담겼는지 확인해 주세요."
      },
      {
        name: "김수현",
        total: 54,
        readingPractice: 50,
        recordCompletion: 58,
        state: "집중 지원",
        note: "꾸준한 독서 실천과 독서 기록 완성을 함께 도와줄 필요가 있어요."
      }
    ];


    function getPreviewStateClass(state) {
      if (state === "매우 우수") {
        return "wr-state-excellent";
      }

      if (state === "우수") {
        return "wr-state-good";
      }

      if (state === "지원 필요") {
        return "wr-state-need";
      }

      return "wr-state-danger";
    }

    function getDetailChipClass(state) {
      if (state === "매우 우수") {
        return "chip-excellent";
      }

      if (state === "우수") {
        return "chip-good";
      }

      if (state === "지원 필요") {
        return "chip-need";
      }

      return "chip-danger";
    }

    function renderStudentPreview() {
      const list =
        document.getElementById(
          "studentPreviewList"
        );

      list.innerHTML = students
        .map(function (student) {
          return `
            <div
              class="wr-student-row ${getPreviewStateClass(student.state)}"
            >
              <div class="wr-student-name">
                ${student.name}
              </div>

              <div class="wr-achieve-bar">
                <div
                  class="wr-achieve-fill"
                  style="width: ${student.total}%;"
                ></div>
              </div>

              <div class="wr-student-result">
                <div class="wr-student-percent">
                  ${student.total}%
                </div>

                <div class="wr-student-state">
                  ${student.state}
                </div>
              </div>
            </div>
          `;
        })
        .join("");
    }

    function makeDetailBar(label, value) {
      return `
        <div class="wr-detail-bar-row">
          <div class="wr-detail-bar-name">
            ${label}
          </div>

          <div class="wr-detail-bar">
            <div
              class="wr-detail-bar-fill"
              style="width: ${value}%;"
            ></div>
          </div>

          <div class="wr-detail-bar-value">
            ${value}%
          </div>
        </div>
      `;
    }

    function renderStudentDetail() {
      const grid =
        document.getElementById(
          "studentDetailGrid"
        );

      grid.innerHTML = students
        .map(function (student) {
          return `
            <article class="wr-detail-card">

              <div class="wr-detail-card-header">
                <div class="wr-detail-name">
                  ${student.name}
                </div>

                <span
                  class="wr-state-chip ${getDetailChipClass(student.state)}"
                >
                  ${student.state}
                </span>
              </div>

              <div class="wr-detail-bars">

                ${makeDetailBar(
                  "독서 실천도",
                  student.readingPractice
                )}

                ${makeDetailBar(
                  "기록 완성도",
                  student.recordCompletion
                )}

              </div>

              <div class="wr-teacher-note">
                <strong>교사 참고:</strong>
                ${student.note}
              </div>
            </article>
          `;
        })
        .join("");
    }

    function openStudentDetailModal() {
      const modal =
        document.getElementById(
          "studentDetailModal"
        );

      const content =
        modal.querySelector(
          ".wr-detail-content"
        );

      renderStudentDetail();

      modal.classList.add("show");

      if (content) {
        content.scrollTop = 0;
      }
    }

    function closeStudentDetailModal() {
      const modal =
        document.getElementById(
          "studentDetailModal"
        );

      modal.classList.remove("show");
    }

    function closeStudentDetailByBackground(event) {
      if (
        event.target.id ===
        "studentDetailModal"
      ) {
        closeStudentDetailModal();
      }
    }

    document.addEventListener(
      "keydown",
      function (event) {
        if (event.key === "Escape") {
          closeStudentDetailModal();
        }
      }
    );

    function goTeacherHome() {
      location.href = "home.html";
    }

    function goBookSelect() {
      location.href = "book-select.html";
    }

    function goBookChatManage() {
      location.href =
        "book-chat-manage.html";
    }

    function goRecommendShelf() {
      location.href =
        "../student/friend-book-shelf.html?mode=teacher";
    }

    /*
      teacher/book-manage.html
              ↓
      student/after-read.html

      open=share:
      간추리기 화면 바로 열기

      mode=teacher:
      교사 모드 돌아가기 버튼 표시
    */
    function goSummaryActivity() {
  location.href =
    "../student/individual-after-reading.html?teacherView=summaryShare";
}

    renderStudentPreview();
  </script>
</body>
</html>
