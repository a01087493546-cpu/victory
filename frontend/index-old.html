<!--
  파일명: index.html
  역할: Victory 프로젝트의 첫 화면입니다.

  이 화면에서 하는 일:
  1. 학생 또는 교사를 선택합니다.
  2. 아이디와 비밀번호를 입력합니다.
  3. 로그인 버튼을 누르면 auth.js에서 백엔드 로그인 API를 호출합니다.
  4. i 버튼을 누르면 프로그램 제작에 사용된 자료 출처를 확인할 수 있습니다.

  아직 CSS와 JS는 다음 단계에서 작성합니다.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 UTF-8로 설정합니다. -->
  <meta charset="UTF-8">

  <!-- 태블릿, 노트북, PC 화면에서 크기가 자연스럽게 보이도록 설정합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 브라우저 탭에 보이는 제목입니다. -->
  <title>문답책 - Victory</title>

  <!-- 공통 디자인 파일입니다. 다음 단계에서 작성할 예정입니다. -->
  <link rel="stylesheet" href="./css/common.css">
</head>

<body>
  <!-- 전체 첫 화면을 감싸는 영역입니다. -->
  <main class="start-page">

   <section class="start-intro">

  <!-- 책과 별 장식입니다. 외부 이미지 없이 텍스트/이모지로 표현합니다. -->
  <div class="magic-badge">
    <span>📖</span>
  </div>

  <!-- 작은 부제목입니다. -->
  <p class="intro-label">Victory Reading Quest</p>

  <!-- 프로그램 이름입니다. -->
  <h1>문답책</h1>

  <!-- 프로그램 세계관 설명입니다. -->
  <p class="intro-text">
    책을 읽고 좋은 질문을 만들며<br>
    지식창고를 빼앗은 용을 물리치는 독서 모험
  </p>

  <!-- 로그인 화면 캐릭터 무대 영역입니다. -->
<div class="login-hero-scene">

  <!-- 뒤쪽에 배치되는 메인 드래곤 이미지입니다. -->
  <img
    src="./assets/images/dragon-main.png"
    alt="문답책 지식창고를 지키고 있는 메인 드래곤 캐릭터"
    class="login-dragon-image"
  >

  <!-- 앞쪽에 배치되는 학생 용사 이미지입니다. -->
  <img
    src="./assets/images/hero-student.png"
    alt="책과 검을 들고 모험을 시작하는 문답책 학생 용사 캐릭터"
    class="login-hero-image"
  >

  <!-- 짧은 모험 안내 문구입니다. -->
  <div class="login-adventure-bubble">
    질문의 힘으로<br>
    지식창고를 되찾아요!
  </div>
</div>

  <!-- 짧은 동기유발 문구입니다. -->
  <div class="intro-message">
    깊이 있는 질문은 용을 약하게 만들고,<br>
    용사의 힘을 성장시킵니다.
  </div>
</section>

    <!-- 오른쪽: 로그인 카드 영역입니다. -->
    <section class="login-card">

      <!-- 로그인 카드 제목입니다. -->
      <h2>모험 입장</h2>

      <!-- 안내 문구입니다. -->
      <p class="login-guide">
        역할을 선택하고 계정으로 로그인하세요.
      </p>

      <!-- 로그인 폼입니다. -->
      <!-- 실제 로그인 기능은 js/auth.js에서 처리합니다. -->
      <form id="loginForm">

        <!-- 학생 / 교사 선택 영역입니다. -->
        <div class="role-select-box">

          <!-- 학생 선택 버튼입니다. -->
          <label class="role-card">
            <input type="radio" name="role" value="student" checked>
            <span class="role-icon">🧒</span>
            <strong>학생</strong>
            <small>질문 훈련과 독서 모험</small>
          </label>

          <!-- 교사 선택 버튼입니다. -->
          <label class="role-card">
            <input type="radio" name="role" value="teacher">
            <span class="role-icon">👩‍🏫</span>
            <strong>교사</strong>
            <small>학생 활동 관리</small>
          </label>

        </div>

        <!-- 아이디 입력 영역입니다. -->
        <div class="form-group">
          <label for="username">아이디</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="아이디를 입력하세요"
            required
          >
        </div>

        <!-- 비밀번호 입력 영역입니다. -->
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            required
          >
        </div>

        <!-- 로그인 버튼입니다. -->
        <button type="submit" class="primary-button">
          로그인하고 시작하기
        </button>
      </form>

      <!-- 하단 버튼 영역입니다. -->
      <div class="login-bottom">

        <!-- 출처 확인 버튼입니다. -->
        <!-- 대회 규정상 사용 자료 출처를 소프트웨어 화면에서 확인할 수 있어야 하므로 필요합니다. -->
        <button type="button" class="source-button" id="openSourceModal">
          ⓘ 사용 자료 출처
        </button>

      </div>
    </section>
  </main>

  <!-- 출처 확인 모달입니다. 처음에는 숨겨져 있다가 i 버튼을 누르면 나타납니다. -->
  <div class="modal-backdrop hidden" id="sourceModal">

    <!-- 모달 창 본체입니다. -->
    <section class="source-modal">

      <!-- 모달 상단 영역입니다. -->
      <div class="modal-header">
        <h2>사용 자료 출처</h2>

        <!-- 모달 닫기 버튼입니다. -->
        <button type="button" class="modal-close-button" id="closeSourceModal">
          ×
        </button>
      </div>

      <!-- 출처 안내 문구입니다. -->
      <p class="modal-desc">
        프로그램 제작에 사용된 이미지, 아이콘, 효과음, 폰트 등의 출처를 확인할 수 있습니다.
      </p>

      <!-- 실제 출처 목록이 들어갈 영역입니다. -->
      <!-- 나중에 js/source-data.js와 auth.js에서 자동으로 채울 예정입니다. -->
      <div class="source-list" id="sourceList">
        <p class="empty-source">
          출처 목록은 다음 단계에서 연결합니다.
        </p>
      </div>
    </section>
  </div>

  <!-- 출처 데이터 파일입니다. 다음 단계 이후 만들 예정입니다. -->
  <script src="./js/source-data.js"></script>

  <!-- 로그인 기능과 출처 모달 기능 파일입니다. 다음 단계 이후 만들 예정입니다. -->
  <script src="./js/auth.js"></script>
</body>
</html>
